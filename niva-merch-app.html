  arcRenderHandles();
}
function arcRenderHandles(){
  const box = arcEl("arHandles");
  if(!box) return;
  const labels = ARC.mode === "quad" ? ["1","2","3","4"] : ["A","B"];
  box.innerHTML = ARC.handles.map(function(p,i){
    return '<div class="arh" data-arch="'+i+'" style="left:'+p[0].toFixed(1)+'px;top:'+p[1].toFixed(1)+'px">'+labels[i]+'</div>';
  }).join("");
}

/* ---------- Tier A: WebXR ---------- */
/* True only for failures that a different feature set could plausibly fix. */
function arcRetryWithoutDepth(e){
  const n = (e && e.name) || "";
  return n === "NotSupportedError" || n === "TypeError" || n === "";
}
function arcTierA(){
  ARC.tier = "A";
  const d = ARC.diag = arcDiagNew();
  arcPanel('<h2>Starting the AR session…</h2><p>Point the phone at the wall and move it slowly so the '
    + 'runtime can find the surface. Grant the AR prompt if it appears.</p>');
  const layer = arcEl("arlayer");
  let glCanvas, gl;
  try{
    glCanvas = document.createElement("canvas");
    glCanvas.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0";
    layer.appendChild(glCanvas);
    // WebGL2 first: stricter, better-defined readPixels behaviour than WebGL1.
    gl = glCanvas.getContext("webgl2", { xrCompatible:true, alpha:true, antialias:false })
      || glCanvas.getContext("webgl", { xrCompatible:true, alpha:true, antialias:false })
      || glCanvas.getContext("experimental-webgl", { xrCompatible:true });
    if(!gl) throw new Error("no WebGL context");
    d.glVersion  = gl.getParameter(gl.VERSION);
    d.glVendor   = gl.getParameter(gl.VENDOR);
    d.glRenderer = gl.getParameter(gl.RENDERER);
    d.glMaxTexture = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  }catch(e){
    arcDiagErr(d, "webgl-context", e);
    arcErrorPanel("WebGL unavailable",
      "WebXR needs a WebGL context for its base layer and this browser would not give one ("
      + esc((e && e.message) || "unknown") + "). Fall back to camera + reference scale.", "tierB");
    return;
  }
  ARC.xr.glCanvas = glCanvas; ARC.xr.gl = gl;

  const OPTIONAL = ["dom-overlay","anchors","camera-access","depth-sensing","light-estimation"];
  const OPTIONAL_NO_DEPTH = ["dom-overlay","anchors","camera-access"];
  const base = { requiredFeatures:["hit-test"], domOverlay:{ root: layer } };
  const withDepth = Object.assign({}, base, {
    optionalFeatures: OPTIONAL,
    depthSensing:{ usagePreference:["cpu-optimized"], dataFormatPreference:["luminance-alpha","float32"] }
  });
  // Retried without the depthSensing init dict, which some runtimes reject outright.
  const noDepth = Object.assign({}, base, { optionalFeatures: OPTIONAL_NO_DEPTH });
  d.requested = ["hit-test"].concat(OPTIONAL);

  const start = function(opts){ return navigator.xr.requestSession("immersive-ar", opts); };
  start(withDepth).catch(function(e){
    // Only a feature/dict problem is worth retrying. SecurityError (no user
    // activation) and InvalidStateError would fail identically the second time
    // and retrying just buries the real cause under a misleading note.
    if(!arcRetryWithoutDepth(e)) throw e;
    d.notes.push("Session with depth-sensing refused (" + ((e && e.name) || "?") + "); retrying without it.");
    d.requested = ["hit-test"].concat(OPTIONAL_NO_DEPTH);
    return start(noDepth);
  }).then(function(session){
    ARC.xr.session = session;
    const en = (session.enabledFeatures ? Array.prototype.slice.call(session.enabledFeatures) : []);
    ARC.xr.enabled = en; ARC.xr.requested = d.requested;
    d.enabled = en;
    d.missing = d.requested.filter(function(f){ return en.indexOf(f) < 0; });
    if(!session.enabledFeatures) d.notes.push("session.enabledFeatures is not exposed by this runtime — feature grants are unknown.");
    ARC.xr.depth = en.indexOf("depth-sensing") >= 0;
    ARC.xr.anchors = en.indexOf("anchors") >= 0;
    ARC.xr.camAccess = en.indexOf("camera-access") >= 0;
    d.depthGranted = ARC.xr.depth;
    session.addEventListener("end", function(){
      ARC.xr.session = null; ARC.xr.hitSource = null; ARC.xr.binding = null; ARC.xr.pendingShot = null;
      if(ARC.open && !ARC.busy && !ARC.capture){ arcErrorPanel("AR session ended",
        "The AR session was closed before a capture was made.", "tierA"); }
    });
    session.updateRenderState({ baseLayer: new XRWebGLLayer(session, ARC.xr.gl) });
    // The binding must use the same xrCompatible context that backs the base layer.
    if(ARC.xr.camAccess){
      try{
        if(typeof XRWebGLBinding === "undefined") throw new Error("XRWebGLBinding is not defined");
        ARC.xr.binding = new XRWebGLBinding(session, ARC.xr.gl);
        d.bindingCreated = true;
        d.getCameraImageAvailable = typeof ARC.xr.binding.getCameraImage === "function";
        if(!d.getCameraImageAvailable) d.notes.push("camera-access was granted but XRWebGLBinding has no getCameraImage().");
      }catch(e){
        arcDiagErr(d, "XRWebGLBinding", e);
        ARC.xr.binding = null; ARC.xr.camAccess = false;
        d.notes.push("Could not create XRWebGLBinding — falling back to the handover capture path.");
      }
    } else {
      d.notes.push("camera-access not granted; single-frame capture unavailable, handover path will be used.");
    }
    return Promise.all([ session.requestReferenceSpace("viewer"), session.requestReferenceSpace("local") ])
      .then(function(spaces){
        ARC.xr.viewer = spaces[0]; ARC.xr.local = spaces[1];
        return session.requestHitTestSource({ space: spaces[0] });
      })
      .then(function(hs){
        ARC.xr.hitSource = hs;
        arcPanel(null);
        ARC.video.style.display = "none";
        arcStartSensors().then(function(){ /* roll still comes from the device */ });
        session.requestAnimationFrame(arcXRFrame);
      });
  }).catch(function(err){
    const name = (err && err.name) || "";
    let msg;
    if(name === "NotSupportedError"){
      msg = "This device reports immersive-ar but refused the session — the <span class=\"mono\">hit-test</span> feature is probably unavailable. ";
    } else if(name === "SecurityError"){
      msg = "The AR session was blocked. WebXR needs a secure origin and a user gesture. ";
    } else if(name === "InvalidStateError"){
      msg = "An AR session is already running in this tab. ";
    } else {
      msg = "The AR session could not start (<span class=\"mono\">"+esc(name || (err && err.message) || "unknown")+"</span>). ";
    }
    arcErrorPanel("AR unavailable", msg + "Camera + reference scale still measures distance, just less precisely.", "tierB");
  });
}

function arcXRFrame(time, frame){
  if(!ARC.open || !ARC.xr.session) return;
  const session = ARC.xr.session;
  session.requestAnimationFrame(arcXRFrame);
  ARC.meas.centreDepthFt = null;   // never let a stale depth sample outlive its frame
  try{
    const gl = ARC.xr.gl;
    const layer = session.renderState.baseLayer;
    if(gl && layer){
      gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
      gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    }
    // focal length + viewport straight out of the XR view
    const vp = frame.getViewerPose(ARC.xr.local);
    let view = null, port = null;
    const dg = ARC.diag;
    if(vp && vp.views && vp.views.length && layer){
      view = vp.views[0];
      port = layer.getViewport(view);
      if(port && port.width){
        ARC.xr.vpW = port.width; ARC.xr.vpH = port.height;
        const vi = GEO.intrinsicsFromProjection(view.projectionMatrix, port.width, port.height);
        if(vi){
          ARC.xr.focalPx = vi.fx;
          if(dg){ dg.viewportW = port.width; dg.viewportH = port.height;
                  dg.projFocalX = +vi.fx.toFixed(2); dg.projFocalY = +vi.fy.toFixed(2);
                  dg.projCx = +vi.cx.toFixed(2); dg.projCy = +vi.cy.toFixed(2);
                  dg.projAspect = +vi.projAspect.toFixed(5); }
        }
      }
      // raw camera image metadata — cheap, per frame; the pixels are NOT read here
      const cam = view.camera || null;
      ARC.xr.cam = cam ? { w: cam.width, h: cam.height } : null;
      if(dg){
        dg.cameraPresent = !!cam;
        if(cam){
          dg.cameraW = cam.width; dg.cameraH = cam.height;
          const ci = GEO.intrinsicsFromProjection(view.projectionMatrix, cam.width, cam.height);
          ARC.xr.camIntr = ci;
          if(ci){
            dg.cameraAspect = +ci.rasterAspect.toFixed(5);
            dg.aspectSkew = +ci.aspectSkew.toFixed(5);
            dg.aspectAgrees = ci.aspectSkew < 0.02;
            dg.camFocalX = +ci.fx.toFixed(2); dg.camFocalY = +ci.fy.toFixed(2);
            dg.camCx = +ci.cx.toFixed(2); dg.camCy = +ci.cy.toFixed(2);
            if(!dg.aspectAgrees && !ARC.xr.aspectWarned){
              ARC.xr.aspectWarned = true;
              dg.notes.push("Camera image aspect " + ci.rasterAspect.toFixed(4) +
                " disagrees with the view frustum aspect " + ci.projAspect.toFixed(4) +
                " by " + (ci.aspectSkew*100).toFixed(1) + "% — the poster is projected with " +
                "separate fx/fy so it stays geometrically correct, but the camera image may be cropped " +
                "relative to the viewport.");
              if(window.console && console.warn) console.warn("[NIVA] XR camera/viewport aspect mismatch", dg.notes[dg.notes.length-1]);
            }
          }
        } else { ARC.xr.camIntr = null; }
        dg.frames++;
      } else if(cam){
        ARC.xr.camIntr = GEO.intrinsicsFromProjection(view.projectionMatrix, cam.width, cam.height);
      } else { ARC.xr.camIntr = null; }

      if(ARC.xr.depth && frame.getDepthInformation){
        try{
          const di = frame.getDepthInformation(view);
          if(di && di.getDepthInMeters){
            const dm = di.getDepthInMeters(0.5, 0.5);
            if(dm > 0.05 && dm < 40){
              ARC.meas.centreDepthFt = GEO.mToFt(dm);
              if(dg) dg.depthSampleFt = +ARC.meas.centreDepthFt.toFixed(3);
            }
          }
        }catch(e){ /* depth buffers are flaky; hit-test remains authoritative */ }
      }
    }
    const results = ARC.xr.hitSource ? frame.getHitTestResults(ARC.xr.hitSource) : [];
    if(!results.length){
      ARC.meas.wallSeen = false;
      ARC.meas.distFt = null; ARC.meas.yawDeg = null; ARC.meas.yawVerified = false;
      ARC.meas.xrPitchDeg = null;      // no plane, no wall-relative pitch either
      ARC.meas.distSrc = "no surface detected";
    } else {
      const pose = results[0].getPose(ARC.xr.viewer);
      if(pose){
        const p = pose.transform.position;
        const q = pose.transform.orientation;
        const dM = Math.sqrt(p.x*p.x + p.y*p.y + p.z*p.z);
        const useDepth = ARC.xr.depth && ARC.meas.centreDepthFt != null;
        ARC.meas.distFt = useDepth ? ARC.meas.centreDepthFt : GEO.mToFt(dM);
        ARC.meas.depthUsed = !!useDepth;
        ARC.meas.distSrc = useDepth
          ? "WebXR depth buffer, centre sample (AR measured)"
          : "WebXR hit-test pose in viewer space (AR measured)";
        // the hit pose's +Y axis is the surface normal
        const n = GEO.quatRotate({x:q.x,y:q.y,z:q.z,w:q.w}, [0,1,0]);
        const ang = GEO.normalToAngles(n);
        ARC.meas.yawDeg = ang.yawDeg;
        ARC.meas.xrPitchDeg = ang.pitchDeg;   // wall-relative, the correct pitch gate
        ARC.meas.incidenceDeg = ang.incidenceDeg;
        ARC.meas.yawVerified = true;
        ARC.meas.wallSeen = true;
      }
    }
    /* Roll is only meaningful against gravity, and the local reference space is
       already gravity-aligned (+Y up), so the viewer pose gives it directly —
       no DeviceOrientationEvent needed in this tier. */
    if(vp && vp.transform && vp.transform.orientation){
      const q = vp.transform.orientation;
      const right = GEO.quatRotate({x:q.x,y:q.y,z:q.z,w:q.w}, [1,0,0]);
      ARC.meas.xrRollDeg = -GEO.deg(Math.asin(clamp(right[1], -1, 1)));
    }
    /* The shutter only raises a request; the readback has to happen HERE, while
       the opaque camera texture handed out by this callback is still valid. */
    if(ARC.xr.pendingShot) arcTrySingleFrame(frame, view);
  }catch(e){
    ARC.meas.wallSeen = false;
    ARC.meas.distSrc = "hit-test error: " + ((e && e.message) || "unknown");
    arcDiagErr(ARC.diag, "xr-frame", e);
    if(ARC.xr.pendingShot){
      const shot = ARC.xr.pendingShot; ARC.xr.pendingShot = null;
      arcHandoverCapture(arcGates(), arcTierKey(), shot.nudge,
        "the XR frame threw (" + ((e && e.message) || "unknown") + ")");
    }
  }
  arcTick();
}

/* ---------- the per-frame update shared by every tier ---------- */
function arcLoop(){
  if(!ARC.open || ARC.tier === "A") return;
  arcTick();
  ARC.raf = requestAnimationFrame(arcLoop);
}

function arcMeasureTierB(){
  const m = arcMap(), f = ARC.focal.f, def = arcRefDef();
  const realWft = GEO.mToFt(def.mm/1000);
  if(ARC.mode === "quad" && ARC.handles.length === 4){
    const realHft = GEO.mToFt((def.hmm || def.mm)/1000);
    const dst = ARC.handles.map(function(p){ return arcToVid(m, p[0], p[1]); });
    const src = [[-realWft/2,-realHft/2],[realWft/2,-realHft/2],[realWft/2,realHft/2],[-realWft/2,realHft/2]];
    const H = GEO.homography(src, dst);
    const pose = H ? GEO.poseFromHomography(H, f, m.vw/2, m.vh/2) : null;
    if(pose && isFinite(pose.distance) && pose.distance > 0.3 && pose.distance < 200){
      ARC.meas.distFt = pose.distance;
      ARC.meas.yawDeg = pose.yawDeg;
      ARC.meas.yawVerified = true;
      ARC.meas.homPitchDeg = pose.pitchDeg;
      ARC.meas.wallSeen = true;
      ARC.meas.distSrc = "reference-scaled — 4-handle quad (" + def.label + ")";
      return;
    }
    ARC.meas.wallSeen = false;
    ARC.meas.distFt = null; ARC.meas.yawVerified = false;
    ARC.meas.distSrc = "quad is degenerate — spread the four handles onto the real corners";
    return;
  }
  const a = arcToVid(m, ARC.handles[0][0], ARC.handles[0][1]);
  const b = arcToVid(m, ARC.handles[1][0], ARC.handles[1][1]);
  const px = Math.hypot(b[0]-a[0], b[1]-a[1]);
  const d = GEO.distanceFromWidth(realWft, f, px);
  ARC.meas.distFt = (isFinite(d) && d > 0.3 && d < 200) ? d : null;
  ARC.meas.yawDeg = null; ARC.meas.yawVerified = false;
  ARC.meas.wallSeen = ARC.meas.distFt != null;
  ARC.meas.distSrc = "reference-scaled — 2-handle (" + def.label + ")";
}

/* gate evaluation — one place, used by the HUD, the shutter and the record */
function arcGates(){
  const t = ARC.task, s = ARC.sensors;
  const tol = t.standoffTolFt, atol = t.angleTolDeg;
  const d = ARC.meas.distFt;
  // Tier A prefers its own measurements: pitch from the wall plane normal (which
  // is wall-relative, not gravity-relative), roll from the gravity-aligned XR
  // viewer pose. Tier B/C fall back to the device attitude sensors.
  let pitch = (ARC.tier === "A" && ARC.meas.xrPitchDeg != null) ? ARC.meas.xrPitchDeg : s.pitchDeg;
  let roll   = (ARC.tier === "A" && ARC.meas.xrRollDeg  != null) ? ARC.meas.xrRollDeg  : s.rollDeg;
  let assumed = false;
  if(ARC.assumeLevel && (pitch == null || roll == null)){
    if(pitch == null) pitch = 0;
    if(roll  == null) roll  = 0;
    assumed = true;
  }
  const yaw = ARC.meas.yawVerified ? ARC.meas.yawDeg : null;
  const g = {
    distance: d, delta: (d==null?null:d - t.standoffFt),
    pitch: pitch, roll: roll, yaw: yaw,
    distOk: d != null && Math.abs(d - t.standoffFt) <= tol,
    pitchOk: pitch != null && Math.abs(pitch) <= atol,
    rollOk:  roll  != null && Math.abs(roll)  <= atol,
    yawOk:   yaw   != null && Math.abs(yaw)   <= atol,
    yawVerified: ARC.meas.yawVerified,
    attitudeAssumed: assumed,
    sensorsOn: s.on
  };
  g.all = g.distOk && g.pitchOk && g.rollOk && g.yawOk;
  return g;
}
/* Focal length of the LIVE overlay, in CSS pixels — lets the poster nudge be
   stored as an angle so it survives the switch to the capture frame. */
function arcDisplayFocalCss(){
  const st = arcEl("arStage");
  const cw = st ? st.clientWidth : 360;
  if(ARC.tier === "A"){
    const f = ARC.xr.focalPx || GEO.focalFromFov(cw, ASSUMED_HFOV_DEG);
    return f * (ARC.xr.vpW ? (cw/ARC.xr.vpW) : 1);
  }
  if(ARC.tier === "B" && ARC.focal.f) return ARC.focal.f * arcMap().s;
  return GEO.focalFromFov(cw, ASSUMED_HFOV_DEG);
}
function arcNudgeNorm(){
  const f = arcDisplayFocalCss();
  if(!(f > 0)) return { ax:0, ay:0 };
  return { ax: ARC.nudge.x/f, ay: ARC.nudge.y/f };
}

function arcTick(){
  if(!ARC.open) return;
  if(ARC.panel) { arcDrawOverlay(null); return; }
  if(ARC.tier === "B") arcMeasureTierB();
  const g = arcGates();
  ARC.lastGates = g;

  // arming: gates must hold continuously
  const now = Date.now();
  if(g.all){
    if(!ARC.armT0) ARC.armT0 = now;
  } else {
    ARC.armT0 = 0;
  }
  const held = ARC.armT0 ? (now - ARC.armT0) : 0;
  const prog = clamp(held/ARM_MS, 0, 1);
  ARC.armed = prog >= 1;

  arcRenderHud(g, prog);
  arcDrawOverlay(g);
}

function arcRenderHud(g, prog){
  const t = ARC.task;
  const n1 = v => (v==null||!isFinite(v)) ? "—" : Number(v).toFixed(1);
  const tierKey = ARC.tier === "A" ? (ARC.meas.depthUsed ? "Ad" : "A")
                : ARC.tier === "B" ? (ARC.focal.estimated ? "Be" : (ARC.mode==="quad" ? "Bq" : "B"))
                : "C";
  const tm = tierMeta(tierKey);
  const badge = arcEl("arTier");
  if(badge){ badge.className = "tierbadge " + tm.cls; badge.textContent = tm.label; }

  // distance
  const dEl = arcEl("arDist");
  if(dEl){
    if(g.distance == null){
      dEl.className = "arstat";
      dEl.innerHTML = (ARC.tier === "A" ? "LOOKING FOR THE WALL — move the phone slowly" : "NO READING")
        + '<span class="sub">'+esc(ARC.meas.distSrc || "")+'</span>';
    } else if(Math.abs(g.delta) <= t.standoffTolFt){
      dEl.className = "arstat ok";
      dEl.innerHTML = "DISTANCE OK — " + g.distance.toFixed(1) + " ft"
        + '<span class="sub">target ' + Number(t.standoffFt).toFixed(1) + ' ± ' + t.standoffTolFt + ' ft</span>';
    } else if(g.delta < 0){
      dEl.className = "arstat no";
      dEl.innerHTML = "TOO CLOSE — move back " + Math.abs(g.delta).toFixed(1) + " ft"
        + '<span class="sub">' + g.distance.toFixed(1) + ' ft of ' + Number(t.standoffFt).toFixed(1) + ' ft</span>';
    } else {
      dEl.className = "arstat no";
      dEl.innerHTML = "TOO FAR — move in " + g.delta.toFixed(1) + " ft"
        + '<span class="sub">' + g.distance.toFixed(1) + ' ft of ' + Number(t.standoffFt).toFixed(1) + ' ft</span>';
    }
  }
  // ruler
  const lo = 0, hi = Math.max(t.standoffFt*2, t.standoffFt + 4);
  const pct = v => clamp((v - lo)/(hi - lo), 0, 1)*100;
  const band = arcEl("arRulerBand");
  if(band){
    const a = pct(t.standoffFt - t.standoffTolFt), b = pct(t.standoffFt + t.standoffTolFt);
    band.style.left = a.toFixed(2)+"%"; band.style.width = Math.max(1.2, b-a).toFixed(2)+"%";
  }
  const ticks = arcEl("arRulerTicks");
  if(ticks && ticks.dataset.built !== "1"){
    let h = "";
    for(let v=0; v<=hi; v+=(hi>14?4:2)){
      h += '<i style="left:'+pct(v).toFixed(2)+'%"></i><span style="left:'+pct(v).toFixed(2)+'%">'+v+'</span>';
    }
    ticks.innerHTML = h; ticks.dataset.built = "1";
  }
  const nd = arcEl("arNeedle");
  if(nd) nd.style.left = (g.distance == null ? 50 : pct(g.distance)).toFixed(2)+"%";

  // angles
  const setStat = function(id, ok, text, sub){
    const el = arcEl(id); if(!el) return;
    el.className = "arstat " + (ok === null ? "" : (ok ? "ok" : "no"));
    el.innerHTML = esc(text) + (sub ? '<span class="sub">'+esc(sub)+'</span>' : "");
  };
  if(g.pitch == null) setStat("arPitch", null, "TILT — no sensor", ARC.sensors.on?"":"tap Enable motion sensors");
  else if(g.pitchOk)  setStat("arPitch", true, "LEVEL " + n1(g.pitch) + "°");
  else setStat("arPitch", false, (g.pitch < 0 ? "TILTED FORWARD " : "TILTED BACK ") + Math.abs(g.pitch).toFixed(0) + "° — straighten up");

  if(g.roll == null) setStat("arRoll", null, "ROLL — no sensor");
  else if(g.rollOk)  setStat("arRoll", true, "ROLL " + n1(g.roll) + "°");
  else setStat("arRoll", false, "ROLLED " + Math.abs(g.roll).toFixed(0) + "° — level the phone");

  if(!g.yawVerified) setStat("arYaw", null, "YAW UNVERIFIED",
    ARC.tier === "B" ? "switch to 4-handle quad mode to check" : "no wall plane yet");
  else if(g.yawOk)   setStat("arYaw", true, "SQUARE " + n1(g.yaw) + "°");
  else setStat("arYaw", false, "OFF-AXIS " + Math.abs(g.yaw).toFixed(0) + "° — move square to the wall");

  // bubble level
  const bub = arcEl("arBubble");
  if(bub){
    const rng = Math.max(12, t.angleTolDeg*4);
    const bx = clamp((g.roll  || 0)/rng, -1, 1) * 34;
    const by = clamp(-(g.pitch || 0)/rng, -1, 1) * 34;
    bub.style.transform = "translate(" + bx.toFixed(1) + "px," + by.toFixed(1) + "px)";
    bub.className = (g.pitchOk && g.rollOk) ? "ok" : "";
  }
  // arming ring + shutter
  const C = 2*Math.PI*35;
  const arm = arcEl("arArm");
  const prg = arm ? arm.querySelector(".prg") : null;
  if(prg) prg.setAttribute("stroke-dashoffset", (C*(1-prog)).toFixed(1));
  const sh = arcEl("arShutter");
  if(sh){
    sh.disabled = !ARC.armed;
    sh.className = "pe" + (ARC.armed ? " armed" : "");
    sh.title = ARC.armed ? "Capture" : "Shutter locks until every gate holds for " + (ARM_MS/1000).toFixed(1) + " s";
  }
  // chips + tools
  const chips = arcEl("arChips");
  if(chips){
    const bits = [];
    bits.push('<span class="archip">f ' + (ARC.tier==="A"
      ? (ARC.xr.focalPx ? Math.round(ARC.xr.focalPx)+" px · XR proj" : "XR")
      : (ARC.focal.f ? Math.round(ARC.focal.f)+" px" : "—")) + '</span>');
    if(ARC.tier === "A"){
      bits.push('<span class="archip">hit-test</span>');
      if(ARC.xr.depth) bits.push('<span class="archip">depth</span>');
      if(ARC.xr.anchors) bits.push('<span class="archip">anchors</span>');
    }
    if(ARC.tier === "B") bits.push('<span class="archip">' + esc(arcRefDef().label) + '</span>');
    if(ARC.sensors.on) bits.push('<span class="archip">' + esc(ARC.sensors.src) + '</span>');
    bits.push('<span class="archip">screen ' + arcScreenAngle() + '°</span>');
    chips.innerHTML = bits.join("");
  }
  const tools = arcEl("arTools");
  const attitudeLive = (g.pitch != null && g.roll != null && !g.attitudeAssumed);
  const key = [ARC.tier, ARC.mode, ARC.sensors.on?1:0, ARC.assumeLevel?1:0,
               attitudeLive?1:0, ARC.focal.estimated?1:0].join("|");
  if(tools && tools.dataset.tier !== key){
    tools.dataset.tier = key;
    let h = "";
    if(!ARC.sensors.on && ARC.tier !== "A") h += '<button class="arbtn pe" data-arc="sensors">Enable motion sensors</button>';
    if(!attitudeLive) h += '<button class="arbtn pe'+(ARC.assumeLevel?" on":"")+'" data-arc="assume">Assume level (not verified)</button>';
    if(ARC.tier === "B"){
      h += '<button class="arbtn pe'+(ARC.mode==="two"?" on":"")+'" data-arc="mode2">2-handle</button>';
      h += '<button class="arbtn pe'+(ARC.mode==="quad"?" on":"")+'" data-arc="mode4">4-handle quad</button>';
      h += '<button class="arbtn pe" data-arc="refpick">Reference…</button>';
      h += '<button class="arbtn pe" data-arc="calib">'
        + (ARC.focal.estimated ? "Calibrate — readings are estimated" : "Re-calibrate") + '</button>';
    }
    h += '<button class="arbtn pe" data-arc="recentre">Re-centre poster</button>';
    tools.innerHTML = h;
  }
}

/* ---------- overlay drawing ---------- */
function arcPosterGeometry(g, focalPx, cx, cy, uOff, vOff){
  const t = ARC.task;
  return GEO.posterQuad({
    focalPx: focalPx, cx: cx, cy: cy,
    u0: cx + (uOff||0), v0: cy + (vOff||0),
    distance: g.distance, widthFt: t.widthFt, heightFt: t.heightFt,
    yawDeg: g.yawVerified ? g.yaw : 0,
    pitchDeg: g.pitch || 0,
    rollDeg: g.roll || 0
  });
}
function arcDrawOverlay(g){
  const cv = ARC.canvas, ctx = ARC.ctx;
  if(!cv || !ctx) return;
  const st = arcEl("arStage");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = st.clientWidth, ch = st.clientHeight;
  if(cv.width !== Math.round(cw*dpr) || cv.height !== Math.round(ch*dpr)){
    cv.width = Math.round(cw*dpr); cv.height = Math.round(ch*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cw,ch);
  if(!g) return;

  // crosshair
  const ccx = cw/2 + ARC.nudge.x, ccy = ch/2 + ARC.nudge.y;
  ctx.save();
  ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(ccx-14, ccy); ctx.lineTo(ccx+14, ccy);
  ctx.moveTo(ccx, ccy-14); ctx.lineTo(ccx, ccy+14); ctx.stroke();
  ctx.restore();

  if(ARC.mode === "quad" && ARC.tier === "B" && ARC.handles.length === 4){
    ctx.save(); ctx.strokeStyle = "rgba(45,212,191,.8)"; ctx.lineWidth = 2; ctx.setLineDash([6,5]);
    ctx.beginPath(); ctx.moveTo(ARC.handles[0][0], ARC.handles[0][1]);
    for(let i=1;i<4;i++) ctx.lineTo(ARC.handles[i][0], ARC.handles[i][1]);
    ctx.closePath(); ctx.stroke(); ctx.restore();
  } else if(ARC.tier === "B" && ARC.handles.length === 2){
    ctx.save(); ctx.strokeStyle = "rgba(45,212,191,.8)"; ctx.lineWidth = 2; ctx.setLineDash([6,5]);
    ctx.beginPath(); ctx.moveTo(ARC.handles[0][0], ARC.handles[0][1]);
    ctx.lineTo(ARC.handles[1][0], ARC.handles[1][1]); ctx.stroke(); ctx.restore();
  }

  if(g.distance == null) return;

  // XR draws straight in CSS px; camera tiers project in video px then map across.
  const nn = arcNudgeNorm();
  let quadCss;
  if(ARC.tier === "A"){
    const fCss = arcDisplayFocalCss();
    quadCss = arcPosterGeometry(g, fCss, cw/2, ch/2, nn.ax*fCss, nn.ay*fCss);
  } else {
    const m = arcMap();
    const f = ARC.focal.f;
    const q = arcPosterGeometry(g, f, m.vw/2, m.vh/2, nn.ax*f, nn.ay*f);
    quadCss = q.map(function(p){ return arcToCss(m, p); });
  }

  const caption = ARC.task.widthFt.toFixed(1) + " ft × " + ARC.task.heightFt.toFixed(1)
                + " ft @ " + g.distance.toFixed(1) + " ft";
  if(g.all){
    if(ARC.posterImg){
      ctx.save(); ctx.globalAlpha = 0.85;
      arcDrawQuadImage(ctx, ARC.posterImg, quadCss);
      ctx.restore();
    }
    arcDrawQuadChrome(ctx, quadCss, caption, "#2dd4bf");
  } else {
    ctx.save(); ctx.globalAlpha = 0.35; ctx.setLineDash([8,6]);
    arcDrawQuadChrome(ctx, quadCss, null, "#94a3b8");
    ctx.restore();
    ctx.save();
    ctx.font = "700 12px ui-monospace, Menlo, monospace"; ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillText("poster unlocks when all gates pass", ccx, ccy + 26);
    ctx.restore();
  }
}

/* ---------- stage interaction: handle drag + poster nudge ---------- */
function arcBindStage(){
  const st = arcEl("arStage");
  if(!st) return;
  let drag = null;
  st.addEventListener("pointerdown", function(e){
    if(ARC.panel) return;
    const h = e.target.closest ? e.target.closest("[data-arch]") : null;
    if(h){ drag = { kind:"handle", i:Number(h.dataset.arch) }; }
    else  { drag = { kind:"nudge", x:e.clientX, y:e.clientY, nx:ARC.nudge.x, ny:ARC.nudge.y }; }
    try{ st.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  st.addEventListener("pointermove", function(e){
    if(!drag) return;
    const r = st.getBoundingClientRect();
    if(drag.kind === "handle"){
      ARC.handles[drag.i] = [ clamp(e.clientX - r.left, 4, r.width-4), clamp(e.clientY - r.top, 4, r.height-4) ];
      arcRenderHandles();
    } else {
      ARC.nudge.x = clamp(drag.nx + (e.clientX - drag.x), -r.width/2,  r.width/2);
      ARC.nudge.y = clamp(drag.ny + (e.clientY - drag.y), -r.height/2, r.height/2);
    }
  });
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
    st.addEventListener(ev, function(){ drag = null; });
  });
}

function arcCalibSave(){
  const mm = parseFloat((arcEl("cal_mm")||{}).value);
  const dFt = parseFloat((arcEl("cal_d")||{}).value);
  const sel = arcEl("cal_ref");
  if(!(mm > 5) || !(dFt > 0.5)){ toast("Enter a real width in mm and a measured distance in ft.", true); return; }
  if(ARC.handles.length < 2){ toast("Switch to 2-handle mode and place the handles first.", true); return; }
  const m = arcMap();
  const a = arcToVid(m, ARC.handles[0][0], ARC.handles[0][1]);
  const b = arcToVid(m, ARC.handles[1][0], ARC.handles[1][1]);
  const px = Math.hypot(b[0]-a[0], b[1]-a[1]);
  if(!(px > 12)){ toast("Handles are too close together to solve a focal length.", true); return; }
  const realWft = GEO.mToFt(mm/1000);
  const f = GEO.focalFromCalibration(px, dFt, realWft);
  const hfov = GEO.fovFromFocal(m.vw, f);
  if(!(f > 50) || !(hfov > 15 && hfov < 170)){
    toast("That solves to an implausible "+hfov.toFixed(0)+"° field of view — re-check the distance and handles.", true);
    return;
  }
  arcCalibSet({ f:f, vw:m.vw, vh:m.vh, refLabel: sel ? (sel.options[sel.selectedIndex].text) : (mm+" mm"),
                mm:mm, distFt:dFt, pixelWidth:px, ts:new Date().toISOString(), device:deviceString() });
  ARC.focal = arcResolveFocal();
  toast("Calibrated: f = "+Math.round(f)+" px (HFOV "+hfov.toFixed(1)+"°).");
  arcPanel(null);
  if(ARC.tier !== "B"){ arcTierB(); } else { arcLoop(); }
}

/* ---------- capture ---------- */
function arcDownscale(w, h, maxLong){
  const long = Math.max(w,h);
  const k = long > maxLong ? maxLong/long : 1;
  return { w: Math.max(1, Math.round(w*k)), h: Math.max(1, Math.round(h*k)), k:k };
}
function arcFooter(ctx, W, H, lines, accent){
  const rowH = Math.max(14, Math.round(W*0.017));
  const pad = Math.round(rowH*0.6);
  const fh = rowH*lines.length + pad*2;
  ctx.save();
  ctx.fillStyle = "rgba(4,10,18,.86)";
  ctx.fillRect(0, H - fh, W, fh);
  ctx.fillStyle = accent || "#5eead4";
  ctx.fillRect(0, H - fh, Math.round(W*0.004), fh);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  lines.forEach(function(l, i){
    ctx.fillStyle = i === 0 ? (accent || "#5eead4") : "#e2e8f0";
    ctx.font = (i === 0 ? "800 " : "500 ") + Math.round(rowH*0.72) + "px ui-monospace, Menlo, monospace";
    ctx.fillText(l, pad*2, H - fh + pad + rowH*(i+0.78));
  });
  ctx.restore();
  return fh;
}
/* Intrinsics for a raster whose optical centre is its middle and whose pixels are
   square — true for a getUserMedia frame or a generated backdrop, NOT necessarily
   true for a raw XR camera image, which supplies its own. */
function arcIsoIntr(focalPx, w, h){
  return { fx: focalPx, fy: focalPx, cx: w/2, cy: h/2 };
}
/* Composites source pixels + poster + footer. Returns {stamped, clean}.
   `intr` is {fx,fy,cx,cy} in SOURCE pixel space; everything scales by the
   downscale factor together, so the projection stays consistent. */
function arcComposite(source, srcW, srcH, intr, g, tierKey, geo, nudgeNorm, captureMode){
  const t = ARC.task;
  const d = arcDownscale(srcW, srcH, 1280);
  const c = document.createElement("canvas"); c.width = d.w; c.height = d.h;
  const x = c.getContext("2d");
  try{ x.drawImage(source, 0, 0, d.w, d.h); }
  catch(e){ x.fillStyle = "#111827"; x.fillRect(0,0,d.w,d.h); }

  const I = intr || arcIsoIntr(GEO.focalFromFov(srcW, ASSUMED_HFOV_DEG), srcW, srcH);
  const fx = I.fx * d.k, fy = I.fy * d.k;        // focal scales with the downscale
  const cx = I.cx * d.k, cy = I.cy * d.k;        // so does the principal point
  const nn = nudgeNorm || { ax:0, ay:0 };        // nudge is an angle, so it transfers cleanly
  const q = GEO.posterQuad({
    focalPx:fx, focalPxY:fy, cx:cx, cy:cy,
    u0: cx + nn.ax*fx, v0: cy + nn.ay*fy,
    distance: g.distance, widthFt: t.widthFt, heightFt: t.heightFt,
    yawDeg: g.yawVerified ? g.yaw : 0, pitchDeg: g.pitch || 0, rollDeg: g.roll || 0
  });
  if(ARC.posterImg){
    x.save(); x.globalAlpha = 0.85; arcDrawQuadImage(x, ARC.posterImg, q); x.restore();
  }
  arcDrawQuadChrome(x, q,
    t.widthFt.toFixed(1)+" ft × "+t.heightFt.toFixed(1)+" ft @ "+g.distance.toFixed(1)+" ft", "#2dd4bf");

  const clean = c.toDataURL("image/jpeg", 0.62);

  const tm = tierMeta(tierKey);
  const n1 = v => (v==null||!isFinite(v)) ? "—" : Number(v).toFixed(1);
  arcFooter(x, d.w, d.h, [
    "NIVA PLACEMENT VERIFIED CAPTURE — " + tm.label.toUpperCase()
      + (captureMode === "single-frame" ? "  [SAME-FRAME]" : captureMode === "handover" ? "  [HANDOVER]" : ""),
    t.storeCode + "  " + t.storeName + "  ·  " + t.city + ", " + t.state,
    new Date().toISOString() + "   GPS " + gps(geo.lat, geo.lng) + "  ±" + Math.round(geo.accuracy||0) + " m"
      + "   geofence " + (geo.pass ? "PASS" : "FAIL") + " " + Math.round(geo.distance||0) + " m",
    "DIST " + n1(g.distance) + " ft (target " + Number(t.standoffFt).toFixed(1) + " ±" + t.standoffTolFt + ")"
      + "   TILT " + n1(g.pitch) + "°   ROLL " + n1(g.roll) + "°   YAW "
      + (g.yawVerified ? n1(g.yaw) + "°" : "unverified")
      + "   POSTER " + t.widthFt + "×" + t.heightFt + " ft"
  ], "#5eead4");
  return { stamped: c.toDataURL("image/jpeg", 0.7), clean: clean };
}
/* GPS fix at shutter time, reusing the geofence rule the rest of the app uses. */
function arcGeoFix(t){
  return new Promise(function(res){
    const fallback = function(note){
      const sim = simCoord(t, 12 + Math.random()*40);
      res({ lat:sim.lat, lng:sim.lng, accuracy:sim.accuracy, distance:sim.distance,
            pass: sim.distance <= GEOFENCE_M, source:"simulated", note:note });
    };
    if(!navigator.geolocation){ fallback("no geolocation API"); return; }
    let done = false;
    const bail = setTimeout(function(){ if(!done){ done = true; fallback("GPS timed out"); } }, 5000);
    try{
      navigator.geolocation.getCurrentPosition(function(pos){
        if(done) return; done = true; clearTimeout(bail);
        const la = pos.coords.latitude, ln = pos.coords.longitude;
        const dist = haversine(la, ln, t.lat, t.lng);
        res({ lat:+la.toFixed(5), lng:+ln.toFixed(5), accuracy: pos.coords.accuracy || 20,
              distance: dist, pass: dist <= GEOFENCE_M, source:"device", note:"" });
      }, function(err){
        if(done) return; done = true; clearTimeout(bail);
        fallback("device GPS unavailable (" + ((err && err.message) || "denied") + ")");
      }, { enableHighAccuracy:true, timeout:4500, maximumAge:0 });
    }catch(e){ clearTimeout(bail); fallback("geolocation threw"); }
  });
}
function arcTierKey(){
  return ARC.tier === "A" ? (ARC.meas.depthUsed ? "Ad" : "A")
       : ARC.tier === "B" ? (ARC.focal.estimated ? "Be" : (ARC.mode === "quad" ? "Bq" : "B"))
       : "C";
}
function arcBuildRecord(g, tierKey, focalPx, captureMode, camInfo){
  const t = ARC.task;
  const p = blankPlacement();
  p.tier = tierKey; p.tierLabel = tierMeta(tierKey).label;
  p.captureMode = captureMode || (ARC.tier === "A" ? "handover" : ARC.tier === "B" ? "camera" : "manual");
  if(camInfo) p.cameraImage = camInfo;
  p.distanceFt = g.distance == null ? null : +g.distance.toFixed(2);
  p.targetFt = t.standoffFt; p.tolFt = t.standoffTolFt; p.angleTolDeg = t.angleTolDeg;
  p.distanceOk = !!g.distOk; p.distanceSource = ARC.meas.distSrc || "—";
  p.pitchDeg = g.pitch == null ? null : +g.pitch.toFixed(1);
  p.rollDeg  = g.roll  == null ? null : +g.roll.toFixed(1);
  p.yawDeg   = g.yaw   == null ? null : +g.yaw.toFixed(1);
  p.pitchOk = !!g.pitchOk; p.rollOk = !!g.rollOk; p.yawOk = !!g.yawOk; p.yawVerified = !!g.yawVerified;
  p.focalPx = focalPx ? Math.round(focalPx) : null;
  p.focalSource = ARC.tier === "A"
    ? (p.captureMode === "single-frame"
        ? "XR view projection matrix, rasterised over the raw camera image"
        : "XR view projection matrix")
    : ARC.focal.src;
  p.posterWFt = t.widthFt; p.posterHFt = t.heightFt;
  p.pass = !!(g.all && tierKey !== "C" && !g.attitudeAssumed);
  p.attitudeAssumed = !!g.attitudeAssumed;
  p.ts = new Date().toISOString();
  p.angleSource = ARC.tier === "A"
    ? "yaw + tilt from the hit-test plane normal; roll from the gravity-aligned XR viewer pose"
    : (g.attitudeAssumed ? "assumed level (no sensor)" : (ARC.sensors.on ? ARC.sensors.src : "no motion sensor"));
  const notes = [];
  if(tierKey === "C") notes.push("Unverified — distance and angles were typed in, not measured.");
  if(g.attitudeAssumed) notes.push("Tilt and roll were assumed level because this device has no attitude sensor — squareness is NOT verified.");
  if(!g.yawVerified && tierKey !== "C") notes.push("Yaw obliqueness not verified — 2-handle reference mode cannot see keystone.");
  if(tierKey === "Be") notes.push("Focal length is an assumed " + ASSUMED_HFOV_DEG + "° HFOV. Calibrate the device for a real number.");
  if(p.captureMode === "handover" && isARTier(tierKey))
    notes.push("Photographed after the AR session handed the camera back, so the frame is a fraction of a second later than the measurement.");
  if(camInfo && camInfo.aspectAgrees === false)
    notes.push("The raw camera image aspect differed from the view frustum; the poster was projected with separate fx/fy to compensate.");
  p.note = notes.join(" ");
  return p;
}

function arcShoot(){
  if(ARC.busy) return;
  if(!ARC.armed){ toast("Hold the gates for " + (ARM_MS/1000).toFixed(1) + " s first.", true); return; }
  ARC.busy = true;
  const g = ARC.lastGates, tierKey = arcTierKey();
  const nn = arcNudgeNorm();
  if(ARC.tier === "A"){
    /* Preferred path: raw camera access. The opaque camera texture only exists
       inside an XR animation-frame callback, so the shutter cannot read it here —
       it raises a request that the very next arcXRFrame fulfils inline, giving a
       photo from the same frame as the measurement. */
    if(ARC.xr.session && ARC.xr.camAccess && ARC.xr.binding &&
       typeof ARC.xr.binding.getCameraImage === "function"){
      arcPanel('<h2>Capturing…</h2><p>Reading the camera frame straight out of the AR session. '
        + 'Keep the phone still.</p>');
      ARC.xr.pendingShot = { nudge: nn, attempts: 0, armedGates: g, startedAt: arcNow() };
      return;
    }
    return arcHandoverCapture(g, tierKey, nn,
      ARC.xr.camAccess ? "raw camera access was granted but no usable binding is available"
                       : "raw camera access is not available in this session");
  }
  arcFinishCapture(ARC.video, ARC.video.videoWidth, ARC.video.videoHeight,
                   arcIsoIntr(ARC.focal.f, ARC.video.videoWidth, ARC.video.videoHeight),
                   g, tierKey, nn, "camera")
    .catch(function(err){
      ARC.busy = false;
      toast("Capture failed: " + ((err && err.message) || "unknown"), true);
    });
}

/* ---------- single-frame capture, executed inside the XR frame callback ----------
   Runs while the opaque camera texture is still valid. Re-reads the gates from
   THIS frame so the recorded numbers describe the photographed instant, not the
   instant the button was pressed. */
function arcTrySingleFrame(frame, view){
  const shot = ARC.xr.pendingShot;
  if(!shot) return;
  const d = ARC.diag || (ARC.diag = arcDiagNew());
  const gl = ARC.xr.gl;
  const giveUp = function(why){
    ARC.xr.pendingShot = null;
    d.notes.push("Single-frame capture abandoned: " + why + ". Falling back to the handover path.");
    arcHandoverCapture(arcGates(), arcTierKey(), shot.nudge, why);
  };
  shot.attempts++;
  // view.camera can legitimately be null on individual frames; allow a short grace
  // period before conceding, but never spin — 12 frames is about 200 ms.
  const cam = view && view.camera;
  if(!cam || !ARC.xr.binding){
    if(shot.attempts > 12) giveUp(cam ? "the WebGL binding disappeared" : "view.camera stayed null");
    return;
  }
  let tex = null;
  try{
    tex = ARC.xr.binding.getCameraImage(cam);
  }catch(e){
    arcDiagErr(d, "getCameraImage", e);
    giveUp("getCameraImage threw (" + ((e && e.message) || "unknown") + ")");
    return;
  }
  if(!tex){
    if(shot.attempts > 12) giveUp("getCameraImage returned null");
    return;
  }
  const w = cam.width, h = cam.height;
  let canvas = null;
  try{
    canvas = arcCameraImageToCanvas(gl, tex, w, h, d);   // inline readback + Y flip
  }catch(e){
    arcDiagErr(d, "camera-readback", e);
    giveUp("the readback threw (" + ((e && e.message) || "unknown") + ")");
    return;
  }
  tex = null;                                            // never outlive the callback
  if(!canvas){
    giveUp(d.allZero || d.allBlack
      ? "the readback came back black"
      : "the readback produced no pixels (framebuffer " + (d.fboStatusName || "?") + ")");
    return;
  }
  // Project into CAMERA-IMAGE pixel space, not viewport space.
  const intr = ARC.xr.camIntr || GEO.intrinsicsFromProjection(view.projectionMatrix, w, h);
  if(!intr){ giveUp("the view projection matrix could not be interpreted"); return; }

  ARC.xr.pendingShot = null;
  const g = arcGates();                                  // this frame's measurement
  const tierKey = ARC.meas.depthUsed ? "Asd" : "As";
  const camInfo = {
    w: w, h: h, readbackMs: d.readbackMs, readbackBytes: d.readbackBytes,
    path: d.readbackPath, meanLuma: d.meanLuma,
    viewportW: ARC.xr.vpW, viewportH: ARC.xr.vpH,
    aspectAgrees: intr.aspectSkew < 0.02,
    aspectSkewPct: +(intr.aspectSkew*100).toFixed(2),
    frameLatencyMs: +(arcNow() - shot.startedAt).toFixed(1),
    attempts: shot.attempts
  };
  ARC.busy = true;
  const done = function(){
    arcFinishCapture(canvas, w, h, intr, g, tierKey, shot.nudge, "single-frame", camInfo)
      .catch(function(err){
        ARC.busy = false;
        arcErrorPanel("Capture failed",
          "The camera frame was read back, but the composite failed ("
          + esc((err && err.message) || "unknown") + ").", "tierA");
      });
  };
  // The pixels are already ours, so the session can go before we composite.
  if(ARC.xr.session){
    try{ ARC.xr.session.end().then(done, done); }
    catch(e){ done(); }
  } else done();
}

/* ---------- fallback: freeze, end the session, reopen getUserMedia ---------- */
function arcHandoverCapture(g, tierKey, nn, why){
  ARC.busy = true;
  arcPanel('<h2>Capturing…</h2><p>Holding the AR measurement and handing the camera over to capture the frame. '
    + 'Keep the phone still.</p>'
    + (why ? '<p class="hint" style="margin:0">Same-frame capture unavailable — ' + esc(why) + '.</p>' : ''));
  {
    const frozen = { distance:g.distance, pitch:g.pitch, roll:g.roll, yaw:g.yaw,
                     yawVerified:g.yawVerified, distOk:g.distOk, pitchOk:g.pitchOk,
                     rollOk:g.rollOk, yawOk:g.yawOk, all:g.all, attitudeAssumed:g.attitudeAssumed };
    const focalXR = ARC.xr.focalPx;
    ARC.xr.pendingShot = null;
    const endP = ARC.xr.session ? ARC.xr.session.end().catch(function(){}) : Promise.resolve();
    endP.then(function(){
      ARC.xr.session = null; ARC.xr.hitSource = null;
      if(ARC.video) ARC.video.style.display = "";
      return navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ideal:"environment"}, width:{ideal:1280} }, audio:false });
    }).then(function(stream){
      ARC.stream = stream; ARC.video.srcObject = stream;
      const pl = ARC.video.play(); if(pl && pl.catch) pl.catch(function(){});
      return new Promise(function(res, rej){
        let n = 0;
        const wait = function(){
          if(ARC.video.videoWidth > 0) return res();
          if(++n > 120) return rej(new Error("camera never produced a frame"));
          setTimeout(wait, 60);
        };
        wait();
      });
    }).then(function(){
      // the XR focal is in XR viewport pixels; rescale it to the video's pixels
      const vw = ARC.video.videoWidth, vh = ARC.video.videoHeight;
      const f = (focalXR && ARC.xr.vpW) ? focalXR * (vw/ARC.xr.vpW) : arcResolveFocal().f;
      return arcFinishCapture(ARC.video, vw, vh, arcIsoIntr(f, vw, vh),
                              frozen, tierKey, nn, "handover");
    }).catch(function(err){
      ARC.busy = false;
      arcErrorPanel("Could not capture the frame",
        "The AR measurement was taken, but the camera could not be reopened to record the photo ("
        + esc((err && err.message) || "unknown") + "). Without raw camera access the capture has to hand "
        + "the camera back, and that handover failed. Try again, or use camera + reference scale.", "tierB");
    });
  }
}
function arcManualShoot(){
  const t = ARC.task;
  const num = (id, dflt) => { const el = arcEl(id); const v = el ? parseFloat(el.value) : NaN; return isFinite(v) ? v : dflt; };
  const yRaw = arcEl("mc_y") ? arcEl("mc_y").value : "";
  const g = {
    distance: num("mc_d", t.standoffFt), pitch: num("mc_p", 0), roll: num("mc_r", 0),
    yaw: yRaw === "" ? null : num("mc_y", 0)
  };
  g.yawVerified = g.yaw != null;
  g.distOk  = Math.abs(g.distance - t.standoffFt) <= t.standoffTolFt;
  g.pitchOk = Math.abs(g.pitch) <= t.angleTolDeg;
  g.rollOk  = Math.abs(g.roll)  <= t.angleTolDeg;
  g.yawOk   = g.yawVerified && Math.abs(g.yaw) <= t.angleTolDeg;
  g.all     = false;                       // manual entry can never pass the gate
  ARC.meas.distSrc = "manual entry (unverified)";
  ARC.busy = true;
  arcPanel('<h2>Compositing…</h2><p>Building the frame from the generated store image.</p>');
  const backdrop = new Image();
  backdrop.onload = function(){
    const f = GEO.focalFromFov(backdrop.width, ASSUMED_HFOV_DEG);
    arcFinishCapture(backdrop, backdrop.width, backdrop.height,
      arcIsoIntr(f, backdrop.width, backdrop.height), g, "C", null, "manual")
      .catch(function(err){ ARC.busy = false; toast("Capture failed: "+((err&&err.message)||"unknown"), true); });
  };
  backdrop.onerror = function(){ ARC.busy = false; toast("Could not build the backdrop image.", true); };
  backdrop.src = genShot(t.storeCode, "AFTER", (t.afterImages.length + ws(t.id).after.length) % 3);
}
function arcFinishCapture(source, w, h, intr, g, tierKey, nudgeNorm, captureMode, camInfo){
  const t = ARC.task;
  const I = intr || arcIsoIntr(GEO.focalFromFov(w, ASSUMED_HFOV_DEG), w, h);
  return arcGeoFix(t).then(function(geo){
    const imgs = arcComposite(source, w, h, I, g, tierKey, geo, nudgeNorm, captureMode);
    const rec = arcBuildRecord(g, tierKey, I.fx, captureMode, camInfo);
    rec.geofencePass = geo.pass;
    rec.geofenceM = Math.round(geo.distance || 0);
    ARC.capture = { imgs: imgs, rec: rec, geo: geo };
    ARC.busy = false;
    arcReviewPanel();
  });
}
function arcReviewPanel(){
  const c = ARC.capture, t = ARC.task, p = c.rec;
  arcPanel('<h2>' + (p.pass ? "Placement verified" : "Capture recorded — gates not met") + '</h2>'
    + '<div class="shot" style="margin-bottom:12px"><img alt="composited capture" src="'+c.imgs.stamped+'"></div>'
    + placementBlock(p, t)
    + '<div class="hint" style="margin-top:10px">Geofence '
    + (c.geo.pass ? '<b style="color:var(--st-approved)">PASS</b>' : '<b style="color:var(--st-rework)">FAIL</b>')
    + ' · ' + Math.round(c.geo.distance) + ' m from the registered store coordinates ('
    + esc(c.geo.source) + (c.geo.note ? ' — '+esc(c.geo.note) : '') + ').</div>'
    + '<div class="pfoot"><button class="btn primary" data-arc="attach">Attach to task</button>'
    + '<button class="btn" data-arc="retake">Retake</button>'
    + '<button class="btn ghost" data-arc="close">Discard</button></div>');
  ARC.panel = "review";
}
function arcAttach(){
  const c = ARC.capture, t = ARC.task;
  if(!c) return;
  const w = ws(t.id);
  /* The AR engine's output is untouched: `c.rec` is the placement record it
     produced and `c.imgs` are the two JPEGs it rasterised. All that changed is
     the handoff — the bytes are staged into the durable local store against
     their eventual Storage paths instead of being stuffed into a localStorage
     blob as data URLs. */
  const meta = makeAfterMeta(t, c.imgs.stamped, {
    placement: c.rec, cleanData: c.imgs.clean,
    lat: c.geo.lat, lng: c.geo.lng, guided: true
  });
  w.after.push(meta);
  const p = c.rec;
  const n1 = v => (v==null||!isFinite(v)) ? "—" : Number(v).toFixed(1);
  audit(t, "Guided capture recorded",
    "Tier " + p.tier + " (" + p.tierLabel + ") · distance " + n1(p.distanceFt) + " ft vs target "
    + Number(t.standoffFt).toFixed(1) + " ± " + t.standoffTolFt + " ft [" + (p.distanceOk?"PASS":"FAIL") + "]"
    + " · tilt " + n1(p.pitchDeg) + "° [" + (p.pitchOk?"PASS":"FAIL") + "]"
    + " · roll " + n1(p.rollDeg) + "° [" + (p.rollOk?"PASS":"FAIL") + "]"
    + " · yaw " + (p.yawVerified ? (n1(p.yawDeg) + "° [" + (p.yawOk?"PASS":"FAIL") + "]") : "unverified")
    + " · poster " + t.widthFt + "×" + t.heightFt + " ft"
    + " · f " + (p.focalPx||"—") + " px from " + p.focalSource
    + " · distance from " + p.distanceSource
    + " · geofence " + (p.geofencePass?"PASS":"FAIL") + " " + p.geofenceM + " m"
    + " · overall " + (p.pass ? "VERIFIED" : "NOT VERIFIED"),
    { lat:c.geo.lat, lng:c.geo.lng });
  notify(p.pass ? "Placement Verified" : "Unverified Capture", "Manager", t.managerId, t.id,
    t.storeName + " — guided capture at " + n1(p.distanceFt) + " ft (" + p.tierLabel + ")"
    + (p.pass ? "" : " · gates not met"));
  save();
  arcClose();
  render();
  toast(p.pass ? "Placement-verified capture attached." : "Capture attached and flagged unverified.");
}

/* ==========================================================
   On-device AR diagnostics
   ------------------------------------------------------------
   The phone is the only place this code path can actually run, and devtools on
   a phone are painful, so every value the capture path depends on is rendered
   on screen with an inline "what good looks like" hint, plus a one-tap plain
   text copy so results can be pasted back.
   ========================================================== */
function arcDiagOpen(){
  ARC.open = true; ARC.task = null; ARC.diagProbeRunning = false;
  if(!ARC.diag) ARC.diag = arcDiagNew();
  const layer = arcEl("arlayer");
  layer.innerHTML = '<div id="arPanel" class="on"></div>';
  layer.classList.add("on"); layer.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
  arcDiagRender("Checking capabilities…");
  arcProbe().then(function(caps){
    const d = ARC.diag;
    d.xrPresent = !!navigator.xr;
    d.arSupported = caps.xr;
    d.secureContext = caps.secure;
    arcDiagRender(null);
  });
}
function arcDiagRow(label, value, state, hint){
  const cls = state === "ok" ? "pass" : state === "bad" ? "fail" : state === "warn" ? "neutral" : null;
  const shown = (value == null || value === "") ? "—" : String(value);
  return '<div style="display:flex;gap:10px;align-items:baseline;justify-content:space-between;'
    + 'padding:4px 0;border-bottom:1px solid var(--border);font-size:12.5px">'
    + '<span style="color:var(--text-2);flex:0 0 46%">'+esc(label)
    + (hint ? '<span style="display:block;color:var(--text-3);font-size:11px;line-height:1.35">'+esc(hint)+'</span>' : '')
    + '</span>'
    + '<span style="text-align:right;min-width:0;word-break:break-word">'
    + (cls ? '<span class="chip '+cls+'" style="margin-right:6px">'+(state==="ok"?"OK":state==="bad"?"BAD":"?")+'</span>' : '')
    + '<span class="mono" style="font-size:11.5px">'+esc(shown)+'</span></span></div>';
}
function arcDiagSection(title){
  return '<div class="sectlabel" style="margin:16px 0 4px">'+esc(title)+'</div>';
}
function arcDiagRender(busyMsg){
  const d = ARC.diag || arcDiagNew();
  const yes = v => v === true ? "ok" : v === false ? "bad" : null;
  const yn  = v => v == null ? "not measured yet" : (v ? "yes" : "no");
  let h = '<h2>AR capture diagnostics</h2>'
    + '<p>Runs the real single-frame capture path on this device. Tap <b>Run live XR probe</b>, '
    + 'point the phone at a wall for a couple of seconds, then read the results below.</p>';

  if(busyMsg) h += '<div class="banner" style="background:var(--accent-soft);border-left-color:var(--accent);margin:0 0 12px">'
    + '<div class="bb">'+esc(busyMsg)+'</div></div>';

  h += arcDiagSection("Environment");
  h += arcDiagRow("Secure context", yn(d.secureContext), yes(d.secureContext), "must be yes — https or localhost");
  h += arcDiagRow("Origin", d.origin);
  h += arcDiagRow("Screen angle", d.screenAngle + "°");
  h += arcDiagRow("Device pixel ratio", d.dpr);
  h += arcDiagRow("User agent", d.ua);

  h += arcDiagSection("WebXR support");
  h += arcDiagRow("navigator.xr present", yn(d.xrPresent), yes(d.xrPresent), "Android Chrome only");
  h += arcDiagRow("immersive-ar supported", yn(d.arSupported), yes(d.arSupported),
                  "no ⇒ ARCore missing or out of date");
  if(d.supportError) h += arcDiagRow("isSessionSupported error", d.supportError, "bad");

  h += arcDiagSection("Session features");
  h += arcDiagRow("Requested", d.requested.length ? d.requested.join(", ") : "— run the probe —");
  h += arcDiagRow("Granted", d.enabled.length ? d.enabled.join(", ") : "—",
                  d.enabled.length ? (d.enabled.indexOf("camera-access") >= 0 ? "ok" : "warn") : null,
                  "camera-access is the one that enables same-frame capture");
  h += arcDiagRow("Not granted", d.missing && d.missing.length ? d.missing.join(", ") : "none",
                  (d.missing && d.missing.indexOf("camera-access") >= 0) ? "bad" : null);
  h += arcDiagRow("XRWebGLBinding created", yn(d.bindingCreated), yes(d.bindingCreated));
  h += arcDiagRow("getCameraImage available", yn(d.getCameraImageAvailable), yes(d.getCameraImageAvailable));

  h += arcDiagSection("WebGL");
  h += arcDiagRow("Version", d.glVersion, d.glVersion && /WebGL 2/.test(d.glVersion) ? "ok" : null,
                  "WebGL 2 preferred");
  h += arcDiagRow("Vendor", d.glVendor);
  h += arcDiagRow("Renderer", d.glRenderer);
  h += arcDiagRow("Max texture size", d.glMaxTexture);

  h += arcDiagSection("View & projection");
  h += arcDiagRow("Frames observed", d.frames, d.frames > 0 ? "ok" : null);
  h += arcDiagRow("Viewport", d.viewportW + " × " + d.viewportH, d.viewportW ? "ok" : null);
  h += arcDiagRow("Viewport fx / fy", d.projFocalX + " / " + d.projFocalY, null,
                  "should be within a pixel of each other for square pixels");
  h += arcDiagRow("Viewport cx / cy", d.projCx + " / " + d.projCy, null, "≈ half the viewport");
  h += arcDiagRow("Frustum aspect (m[5]/m[0])", d.projAspect);

  h += arcDiagSection("Raw camera image");
  h += arcDiagRow("view.camera present", yn(d.cameraPresent), yes(d.cameraPresent),
                  "null ⇒ no same-frame capture, falls back to handover");
  h += arcDiagRow("Camera image size", d.cameraW ? (d.cameraW + " × " + d.cameraH) : "—",
                  d.cameraW ? "ok" : null, "often larger than the viewport — that is fine");
  h += arcDiagRow("Camera aspect", d.cameraAspect);
  h += arcDiagRow("Aspect agrees with frustum", yn(d.aspectAgrees), yes(d.aspectAgrees),
                  "disagreement is handled, but means the image is cropped vs the viewport");
  h += arcDiagRow("Aspect skew", d.aspectSkew == null ? "—" : (d.aspectSkew*100).toFixed(2) + "%");
  h += arcDiagRow("Camera fx / fy", d.camFocalX + " / " + d.camFocalY, null,
                  "these are what the poster is projected with");
  h += arcDiagRow("Camera cx / cy", d.camCx + " / " + d.camCy);

  h += arcDiagSection("Readback");
  h += arcDiagRow("Path used", d.readbackPath, d.readbackPath ? "ok" : null,
                  "direct = texture attached to our framebuffer; shader-blit = fallback");
  h += arcDiagRow("Framebuffer status", d.fboStatusName,
                  d.fboStatusName && /^FRAMEBUFFER_COMPLETE/.test(d.fboStatusName) ? "ok"
                    : (d.fboStatusName ? "bad" : null),
                  "want FRAMEBUFFER_COMPLETE");
  h += arcDiagRow("Readback time", d.readbackMs == null ? "—" : d.readbackMs + " ms",
                  d.readbackMs == null ? null : (d.readbackMs < 400 ? "ok" : "warn"),
                  "one-shot on shutter only, never per frame");
  h += arcDiagRow("Bytes read", d.readbackBytes ? d.readbackBytes.toLocaleString() : "—",
                  d.readbackBytes ? "ok" : null, "width × height × 4");
  h += arcDiagRow("GL error after readPixels", d.readGlError || "none",
                  d.readGlError ? "bad" : (d.readbackBytes ? "ok" : null));
  h += arcDiagRow("Impl. read format / type", (d.implReadFormat || "—") + " / " + (d.implReadType || "—"));

  h += arcDiagSection("Pixel sanity");
  h += arcDiagRow("First 8 pixels RGBA", d.firstPixels, null, "all zeros ⇒ silent failure");
  h += arcDiagRow("Mean luma", d.meanLuma, d.meanLuma == null ? null : (d.meanLuma > 2 ? "ok" : "bad"),
                  "a lit room should be well above 2");
  h += arcDiagRow("Max luma", d.maxLuma);
  h += arcDiagRow("Alpha range", d.alphaMin == null ? "—" : (d.alphaMin + " … " + d.alphaMax));
  h += arcDiagRow("All zero", yn(d.allZero), d.allZero == null ? null : (d.allZero ? "bad" : "ok"));
  h += arcDiagRow("All black", yn(d.allBlack), d.allBlack == null ? null : (d.allBlack ? "bad" : "ok"));

  h += arcDiagSection("Tracking");
  h += arcDiagRow("Hit-test results", d.hitResults, d.hitResults ? "ok" : null,
                  "0 ⇒ move the phone slowly so the wall is found");
  h += arcDiagRow("Distance", d.distanceFt == null ? "—" : d.distanceFt.toFixed(2) + " ft");
  h += arcDiagRow("Yaw / pitch / roll",
    [d.yawDeg, d.pitchDeg, d.rollDeg].map(v => v == null ? "—" : Number(v).toFixed(1)).join(" / ") + " °");
  h += arcDiagRow("depth-sensing granted", yn(d.depthGranted));
  h += arcDiagRow("Centre depth sample", d.depthSampleFt == null ? "—" : d.depthSampleFt.toFixed(2) + " ft");

  if(d.notes && d.notes.length){
    h += arcDiagSection("Notes");
    h += '<ul style="font-size:12.5px;color:var(--text-2);padding-left:18px;margin:0">'
      + d.notes.map(n => '<li>'+esc(n)+'</li>').join("") + '</ul>';
  }
  h += arcDiagSection("Last error");
  if(d.lastError){
    h += '<div class="mono" style="font-size:11.5px;color:var(--st-rework);white-space:pre-wrap;word-break:break-word">'
      + esc(d.lastError.where + " — " + d.lastError.name + ": " + d.lastError.message)
      + (d.lastError.stack ? "\n" + esc(d.lastError.stack) : "") + '</div>';
  } else {
    h += '<div style="font-size:12.5px;color:var(--text-3)">None.</div>';
  }

  h += '<div class="sectlabel" style="margin:16px 0 4px">Plain text report</div>'
    + '<textarea id="arDiagText" readonly style="height:120px;font-family:var(--mono);font-size:11px">'
    + esc(arcDiagText()) + '</textarea>';

  h += '<div class="pfoot">'
    + '<button class="btn primary" data-arc="diagprobe"'+(ARC.diagProbeRunning?' disabled':'')+'>'
    +   (ARC.diagProbeRunning ? "Probing…" : "Run live XR probe") + '</button>'
    + (ARC.diagProbeRunning ? '<button class="btn" data-arc="diagstop">Stop</button>' : '')
    + '<button class="btn" data-arc="diagcopy">Copy report</button>'
    + '<button class="btn" data-arc="diagselftest">Run geometry self-test</button>'
    + '<button class="btn ghost" data-arc="close">Close</button>'
    + '</div>';
  arcPanel(h);
  ARC.panel = "diag";
}
function arcDiagText(){
  const d = ARC.diag || arcDiagNew();
  const L = [];
  const p = (k, v) => L.push(k.padEnd(30, " ") + ": " + (v == null || v === "" ? "—" : String(v)));
  L.push("NIVA AR CAPTURE DIAGNOSTICS");
  L.push("generated " + new Date().toISOString());
  L.push("");
  p("userAgent", d.ua);
  p("origin", d.origin);
  p("secureContext", d.secureContext);
  p("screenAngle", d.screenAngle);
  p("devicePixelRatio", d.dpr);
  p("navigator.xr", d.xrPresent);
  p("immersive-ar supported", d.arSupported);
  p("features requested", d.requested.join(","));
  p("features granted", d.enabled.join(","));
  p("features NOT granted", (d.missing||[]).join(","));
  p("XRWebGLBinding created", d.bindingCreated);
  p("getCameraImage available", d.getCameraImageAvailable);
  p("gl version", d.glVersion);
  p("gl vendor", d.glVendor);
  p("gl renderer", d.glRenderer);
  p("gl maxTextureSize", d.glMaxTexture);
  p("frames observed", d.frames);
  p("viewport", d.viewportW + "x" + d.viewportH);
  p("viewport fx/fy", d.projFocalX + "/" + d.projFocalY);
  p("viewport cx/cy", d.projCx + "/" + d.projCy);
  p("frustum aspect", d.projAspect);
  p("view.camera present", d.cameraPresent);
  p("camera image", d.cameraW + "x" + d.cameraH);
  p("camera aspect", d.cameraAspect);
  p("aspect agrees", d.aspectAgrees);
  p("aspect skew", d.aspectSkew);
  p("camera fx/fy", d.camFocalX + "/" + d.camFocalY);
  p("camera cx/cy", d.camCx + "/" + d.camCy);
  p("readback path", d.readbackPath);
  p("framebuffer status", d.fboStatusName);
  p("readback ms", d.readbackMs);
  p("readback bytes", d.readbackBytes);
  p("gl error after read", d.readGlError || "none");
  p("impl read format/type", (d.implReadFormat||"-") + "/" + (d.implReadType||"-"));
  p("first 8 pixels", d.firstPixels);
  p("mean luma", d.meanLuma);
  p("max luma", d.maxLuma);
  p("alpha min/max", d.alphaMin + "/" + d.alphaMax);
  p("all zero", d.allZero);
  p("all black", d.allBlack);
  p("hit-test results", d.hitResults);
  p("distance ft", d.distanceFt);
  p("yaw/pitch/roll", [d.yawDeg,d.pitchDeg,d.rollDeg].join("/"));
  p("depth granted", d.depthGranted);
  p("centre depth ft", d.depthSampleFt);
  L.push("");
  L.push("NOTES:");
  (d.notes||[]).forEach(n => L.push("  - " + n));
  if(!d.notes || !d.notes.length) L.push("  (none)");
  L.push("");
  L.push("LAST ERROR:");
  if(d.lastError){
    L.push("  " + d.lastError.where + " — " + d.lastError.name + ": " + d.lastError.message);
    if(d.lastError.stack) L.push(d.lastError.stack.split("\n").map(s => "  " + s).join("\n"));
  } else L.push("  (none)");
  return L.join("\n");
}
function arcDiagCopy(){
  const txt = arcDiagText();
  const fallback = function(){
    try{
      const ta = arcEl("arDiagText");
      if(ta){
        ta.removeAttribute("readonly");
        ta.focus(); ta.select();
        if(ta.setSelectionRange) ta.setSelectionRange(0, txt.length);
        const ok = document.execCommand && document.execCommand("copy");
        ta.setAttribute("readonly", "readonly");
        toast(ok ? "Diagnostics copied." : "Copy blocked — the text is selected, copy it manually.", !ok);
        return;
      }
    }catch(e){}
    toast("Could not copy — select the plain text report and copy it manually.", true);
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast("Diagnostics copied."); }, fallback);
      return;
    }
  }catch(e){}
  fallback();
}
/* Live probe: a real immersive-ar session that exercises the exact single-frame
   path (binding -> getCameraImage -> framebuffer -> readPixels) once, then ends. */
function arcDiagProbe(){
  const d = ARC.diag = arcDiagNew();
  d.xrPresent = !!navigator.xr;
  if(!navigator.xr){
    d.notes.push("navigator.xr is absent — WebXR is unavailable in this browser.");
    arcDiagRender(null); return;
  }
  ARC.diagProbeRunning = true;
  arcDiagRender("Starting AR session — point the phone at a wall and move it slowly.");
  const layer = arcEl("arlayer");
  let glCanvas, gl;
  try{
    glCanvas = document.createElement("canvas");
    glCanvas.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0";
    layer.appendChild(glCanvas);
    gl = glCanvas.getContext("webgl2", { xrCompatible:true, alpha:true, antialias:false })
      || glCanvas.getContext("webgl", { xrCompatible:true, alpha:true, antialias:false });
    if(!gl) throw new Error("no WebGL context");
    d.glVersion = gl.getParameter(gl.VERSION);
    d.glVendor = gl.getParameter(gl.VENDOR);
    d.glRenderer = gl.getParameter(gl.RENDERER);
    d.glMaxTexture = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  }catch(e){
    arcDiagErr(d, "webgl-context", e);
    ARC.diagProbeRunning = false; arcDiagRender(null); return;
  }
  ARC.xr.glCanvas = glCanvas; ARC.xr.gl = gl;

  const OPT = ["dom-overlay","anchors","camera-access","depth-sensing","light-estimation"];
  d.requested = ["hit-test"].concat(OPT);
  const opts = { requiredFeatures:["hit-test"], optionalFeatures:OPT, domOverlay:{ root: layer },
                 depthSensing:{ usagePreference:["cpu-optimized"], dataFormatPreference:["luminance-alpha","float32"] } };
  const fallbackOpts = { requiredFeatures:["hit-test"],
                         optionalFeatures:["dom-overlay","anchors","camera-access"], domOverlay:{ root: layer } };

  navigator.xr.requestSession("immersive-ar", opts).catch(function(e){
    if(!arcRetryWithoutDepth(e)) throw e;
    d.notes.push("Session with depth-sensing refused (" + ((e && e.name)||"?") + "); retrying without it.");
    d.requested = ["hit-test","dom-overlay","anchors","camera-access"];
    return navigator.xr.requestSession("immersive-ar", fallbackOpts);
  }).then(function(session){
    d.arSupported = true;
    ARC.xr.session = session;
    const en = session.enabledFeatures ? Array.prototype.slice.call(session.enabledFeatures) : [];
    d.enabled = en;
    d.missing = d.requested.filter(function(f){ return en.indexOf(f) < 0; });
    d.depthGranted = en.indexOf("depth-sensing") >= 0;
    ARC.xr.depth = d.depthGranted;
    ARC.xr.camAccess = en.indexOf("camera-access") >= 0;
    session.addEventListener("end", function(){
      ARC.xr.session = null; ARC.xr.hitSource = null; ARC.xr.binding = null;
      ARC.diagProbeRunning = false;
      if(ARC.open) arcDiagRender(null);
    });
    session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
    if(ARC.xr.camAccess){
      try{
        ARC.xr.binding = new XRWebGLBinding(session, gl);
        d.bindingCreated = true;
        d.getCameraImageAvailable = typeof ARC.xr.binding.getCameraImage === "function";
      }catch(e){ arcDiagErr(d, "XRWebGLBinding", e); }
    } else {
      d.notes.push("camera-access was not granted — same-frame capture is unavailable on this device/browser.");
    }
    return Promise.all([session.requestReferenceSpace("viewer"), session.requestReferenceSpace("local")])
      .then(function(sp){
        ARC.xr.viewer = sp[0]; ARC.xr.local = sp[1];
        return session.requestHitTestSource({ space: sp[0] });
      }).then(function(hs){
        ARC.xr.hitSource = hs;
        ARC.diagFrames = 0; ARC.diagDidRead = false;
        session.requestAnimationFrame(arcDiagFrame);
      });
  }).catch(function(err){
    arcDiagErr(d, "requestSession", err);
    const nm = (err && err.name) || "";
    if(nm === "SecurityError"){
      d.notes.push("The AR session needs a real tap to start (user activation) and a secure origin. "
        + "Tap “Run live XR probe” directly rather than triggering it from a script.");
    } else if(nm === "InvalidStateError"){
      d.notes.push("An AR session is already running in this tab — close it and try again.");
    } else {
      d.arSupported = false;
      d.notes.push("The AR session could not start. On Android this usually means ARCore "
        + "(“Google Play Services for AR”) is missing or out of date, or the origin is not https.");
    }
    ARC.diagProbeRunning = false;
    arcDiagRender(null);
  });
}
function arcDiagFrame(time, frame){
  const d = ARC.diag;
  const session = ARC.xr.session;
  if(!session || !ARC.open){ return; }
  if(ARC.diagFrames < 90) session.requestAnimationFrame(arcDiagFrame);
  ARC.diagFrames++;
  d.frames = ARC.diagFrames;
  try{
    const gl = ARC.xr.gl, layer = session.renderState.baseLayer;
    if(gl && layer){
      gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
      gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    }
    const vp = frame.getViewerPose(ARC.xr.local);
    if(vp && vp.views && vp.views.length && layer){
      const view = vp.views[0];
      const port = layer.getViewport(view);
      if(port && port.width){
        d.viewportW = port.width; d.viewportH = port.height;
        const vi = GEO.intrinsicsFromProjection(view.projectionMatrix, port.width, port.height);
        if(vi){ d.projFocalX = +vi.fx.toFixed(2); d.projFocalY = +vi.fy.toFixed(2);
                d.projCx = +vi.cx.toFixed(2); d.projCy = +vi.cy.toFixed(2);
                d.projAspect = +vi.projAspect.toFixed(5); }
      }
      const cam = view.camera || null;
      d.cameraPresent = !!cam;
      if(cam){
        d.cameraW = cam.width; d.cameraH = cam.height;
        const ci = GEO.intrinsicsFromProjection(view.projectionMatrix, cam.width, cam.height);
        if(ci){
          d.cameraAspect = +ci.rasterAspect.toFixed(5);
          d.aspectSkew = +ci.aspectSkew.toFixed(5);
          d.aspectAgrees = ci.aspectSkew < 0.02;
          d.camFocalX = +ci.fx.toFixed(2); d.camFocalY = +ci.fy.toFixed(2);
          d.camCx = +ci.cx.toFixed(2); d.camCy = +ci.cy.toFixed(2);
        }
        // exactly one readback, at frame 20, so the timing is representative
        if(!ARC.diagDidRead && ARC.diagFrames >= 20 && ARC.xr.binding &&
           typeof ARC.xr.binding.getCameraImage === "function"){
          ARC.diagDidRead = true;
          let tex = null;
          try{ tex = ARC.xr.binding.getCameraImage(cam); }
          catch(e){ arcDiagErr(d, "getCameraImage", e); }
          if(tex){
            try{ arcReadTextureRGBA(gl, tex, cam.width, cam.height, d); }
            catch(e){ arcDiagErr(d, "readback", e); }
          } else {
            d.notes.push("getCameraImage returned null even though camera-access was granted.");
          }
          tex = null;
        }
      }
      if(d.depthGranted && frame.getDepthInformation){
        try{
          const di = frame.getDepthInformation(view);
          if(di && di.getDepthInMeters){
            const dm = di.getDepthInMeters(0.5, 0.5);
            if(dm > 0.05 && dm < 40) d.depthSampleFt = +GEO.mToFt(dm).toFixed(3);
          }
        }catch(e){}
      }
    }
    const res = ARC.xr.hitSource ? frame.getHitTestResults(ARC.xr.hitSource) : [];
    d.hitResults = res.length;
    if(res.length){
      const pose = res[0].getPose(ARC.xr.viewer);
      if(pose){
        const p = pose.transform.position, q = pose.transform.orientation;
        d.distanceFt = +GEO.mToFt(Math.sqrt(p.x*p.x + p.y*p.y + p.z*p.z)).toFixed(3);
        const ang = GEO.normalToAngles(GEO.quatRotate({x:q.x,y:q.y,z:q.z,w:q.w}, [0,1,0]));
        d.yawDeg = +ang.yawDeg.toFixed(2); d.pitchDeg = +ang.pitchDeg.toFixed(2);
      }
    }
    if(vp && vp.transform && vp.transform.orientation){
      const q = vp.transform.orientation;
      const right = GEO.quatRotate({x:q.x,y:q.y,z:q.z,w:q.w}, [1,0,0]);
      d.rollDeg = +(-GEO.deg(Math.asin(clamp(right[1], -1, 1)))).toFixed(2);
    }
  }catch(e){ arcDiagErr(d, "diag-frame", e); }

  if(ARC.diagFrames >= 90 || (ARC.diagDidRead && ARC.diagFrames >= 30)){
    try{ session.end(); }catch(e){ ARC.diagProbeRunning = false; arcDiagRender(null); }
  }
}

/* ---------- AR layer event wiring (kept off the global handler) ---------- */
document.getElementById("arlayer").addEventListener("click", function(e){
  const el = e.target.closest ? e.target.closest("[data-arc]") : null;
  if(!el) return;
  e.preventDefault(); e.stopPropagation();
  const a = el.dataset.arc;
  switch(a){
    case "close":   arcClose(); break;
    case "diagprobe":    arcDiagProbe(); break;
    case "diagstop":     if(ARC.xr.session){ try{ ARC.xr.session.end(); }catch(err){} }
                         else { ARC.diagProbeRunning = false; arcDiagRender(null); }
                         break;
    case "diagcopy":     arcDiagCopy(); break;
    case "diagselftest": arcClose(); openSelfTest(); break;
    case "restart": arcStopCamera();
                    if(ARC.raf){ cancelAnimationFrame(ARC.raf); ARC.raf = 0; }
                    if(ARC.xr.session){ try{ ARC.xr.session.end(); }catch(err){} }
                    arcProbe().then(arcStartPanel); break;
    case "tierA":   arcTierA(); break;
    case "tierB":   arcTierB(); break;
    case "tierC":   arcTierC(); break;
    case "calib":   if(!ARC.stream){ ARC.pendingCalib = true; arcTierB(); }
                    else arcCalibPanel();
                    break;
    case "calibsave":  arcCalibSave(); break;
    case "calibclear": try{ const all = arcCalibAll(); delete all[arcCalibKey()];
                         localStorage.setItem(CALIB_KEY, JSON.stringify(all)); }catch(err){}
                       ARC.focal = arcResolveFocal(); toast("Calibration cleared."); arcCalibPanel(); break;
    case "calibback":  arcPanel(null); if(ARC.tier === "B") arcLoop(); break;
    case "sensors": arcStartSensors().then(function(r){
                      if(r.ok) toast("Motion sensors live (" + ARC.sensors.src + ").");
                      else toast(r.why, true);
                    }); break;
    case "assume":  ARC.assumeLevel = !ARC.assumeLevel;
                    toast(ARC.assumeLevel
                      ? "Tilt and roll assumed level — the capture will be recorded as NOT verified."
                      : "Assumed-level override off.", ARC.assumeLevel);
                    break;
    case "mode2":   ARC.mode = "two";  arcResetHandles(); break;
    case "mode4":   ARC.mode = "quad"; arcResetHandles(); break;
    case "refpick": arcRefPanel(); break;
    case "refsave": {
      const sel = arcEl("ref_sel");
      ARC.refPreset = sel ? sel.value : "a4";
      ARC.refWmm = parseFloat((arcEl("ref_w")||{}).value) || 210;
      ARC.refHmm = parseFloat((arcEl("ref_h")||{}).value) || 0;
      const def = REF_PRESETS.filter(x=>x.key===ARC.refPreset)[0];
      ARC.mode = (def && def.quad) || ARC.refHmm > 0 ? "quad" : "two";
      arcPanel(null); arcResetHandles(); arcLoop();
      break;
    }
    case "refback": arcPanel(null); arcLoop(); break;
    case "recentre": ARC.nudge = {x:0, y:0}; break;
    case "shoot":   arcShoot(); break;
    case "manualshoot": arcManualShoot(); break;
    case "attach":  arcAttach(); break;
    case "retake":  ARC.capture = null; ARC.armT0 = 0; ARC.armed = false;
                    arcPanel(null);
                    ARC.busy = false; ARC.xr.pendingShot = null;
                    if(ARC.tier === "C") arcTierC();
                    // this click is a user gesture, so a fresh AR session is allowed
                    else if(ARC.tier === "A"){ arcStopCamera(); arcTierA(); }
                    else arcLoop();
                    break;
  }
});
