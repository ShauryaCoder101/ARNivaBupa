      const shot = ARC.xr.pendingShot; ARC.xr.pendingShot = null;
      arcHandoverCapture(arcGates(), arcTierKey(), shot.nudge,
        "the XR frame threw (" + ((e && e.message) || "unknown") + ")");
    }
  }
  arcTick();
}

/* ---------- the per-frame update shared by every tier ---------- */
function arcLoop(){
  if(!ARC.open || ARC.tier === "A") return;
  arcTick();
  ARC.raf = requestAnimationFrame(arcLoop);
}

/* ==========================================================
   Automatic reference detection — the camera-tier plumbing
   ------------------------------------------------------------
   DET does the pixels; this does the policy. Three rules shape all of it:

     1. NEVER run on the render loop. Detection is throttled by wall clock to
        4–10 Hz depending on what the device turns out to be capable of, and it
        is the only thing in the capture path allowed to cost tens of
        milliseconds. The overlay keeps drawing at display rate from the last
        result, so a slow detector makes the outline lag, never the preview.

     2. NEVER accept a detection silently. A confidently-wrong rectangle is
        worse than no rectangle at all, because it produces a plausible distance
        that no one questions. The merchandiser confirms the outline once; after
        that it stays locked only while it keeps agreeing with itself, and any
        jump big enough to be a different object breaks the lock and asks again.

     3. NEVER trap the user. Manual 4-handle is always one tap away and is
        seeded with whatever the detector last found, so "the box is nearly
        right" costs a drag rather than a restart.
   ========================================================== */

/* What this phone probably is. Neither hint is universal — deviceMemory is
   Chromium-only and hardwareConcurrency lies on some budget SoCs — so an
   unknown device is treated as MID, never as fast. The real answer comes from
   measuring the first few passes and degrading, below. */
function arcDeviceClass(){
  const c = (typeof navigator !== "undefined" && navigator.hardwareConcurrency) || 0;
  const m = (typeof navigator !== "undefined" && navigator.deviceMemory) || 0;
  if((c && c <= 4) || (m && m <= 2)) return "low";
  if((c && c <= 6) || (m && m <= 4)) return "mid";
  if(!c && !m) return "mid";
  return "high";
}
/* Progressive work-resolution / rate ladder. Index 0 is the most expensive.
   Each device class starts partway down it and can only ever move further down. */
const DET_LADDER = [
  { work:800, fps:10 }, { work:640, fps:8 }, { work:640, fps:5 },
  { work:512, fps:5 },  { work:400, fps:4 }
];
const DET_LADDER_START = { high:0, mid:1, low:3 };
const DET_HOLD_MS = 500;      // how long a locked outline survives a missed pass

function arcDetProfile(cls, step){
  const i = clamp((DET_LADDER_START[cls] == null ? 1 : DET_LADDER_START[cls]) + (step||0),
                  0, DET_LADDER.length - 1);
  return DET_LADDER[i];
}
/* getUserMedia constraints. Capping the camera on weak hardware is the single
   cheapest win available: every downstream cost — the drawImage, the readback,
   the luma pass — is linear in the frame the browser hands us. */
function arcCameraConstraints(cls){
  const big = { width:{ ideal:1280 }, height:{ ideal:720 } };
  const small = { width:{ ideal:640 }, height:{ ideal:480 }, frameRate:{ max:24 } };
  return Object.assign({ facingMode:{ ideal:"environment" } }, cls === "low" ? small : big);
}

function arcDetReset(hard){
  const d = ARC.det;
  d.quad = null; d.cand = null; d.conf = 0; d.stable = 0;
  d.locked = false; d.offered = false; d.err = null; d.seenAt = 0; d.note = "";
  d.cornerSigmaPx = null; d.support = 0; d.rms = null; d.radial = 0;
  d.flipped = false; d.wMm = 0; d.hMm = 0;
  if(hard){
    d.passes = 0; d.hits = 0; d.lastMs = 0; d.meanMs = 0; d.maxMs = 0;
    d.overruns = 0; d.degraded = 0; d.degradeNote = ""; d.step = 0; d.nextAt = 0;
  }
}
/* Sizes (or re-sizes) the work canvas and the DET workspace. The canvas is
   created once per session and every typed array inside the workspace is
   allocated once per RESOLUTION, so a steady-state pass allocates nothing but
   the ImageData the 2D context insists on minting (there is no reusable
   getImageData in the platform — noted, and the reason the work plane is kept
   as small as the geometry can tolerate). */
function arcDetFit(){
  const d = ARC.det, v = ARC.video;
  if(!v || !v.videoWidth) return false;
  const prof = arcDetProfile(d.cls, d.step);
  d.fps = prof.fps;
  const vw = v.videoWidth, vh = v.videoHeight;
  const long = Math.max(vw, vh);
  const k = long > prof.work ? prof.work/long : 1;
  // even dimensions: DET halves the plane for the detect pass
  const ww = Math.max(64, (Math.round(vw*k) >> 1) << 1);
  const wh = Math.max(64, (Math.round(vh*k) >> 1) << 1);
  if(!d.canvas){
    d.canvas = document.createElement("canvas");
    d.ctx = d.canvas.getContext("2d", { willReadFrequently:true, alpha:false });
  }
  if(d.workW !== ww || d.workH !== wh){
    d.canvas.width = ww; d.canvas.height = wh;
    d.workW = ww; d.workH = wh;
    if(!d.ws) d.ws = new DET.Workspace();
    d.ws.fit(ww, wh);
    arcDetReset(false);
  }
  d.scale = vw/ww;                       // work pixels -> video pixels
  return true;
}
function arcDetInit(){
  const d = ARC.det;
  d.cls = arcDeviceClass();
  d.step = 0;
  arcDetReset(true);
  d.on = true;
  arcDetFit();
}
function arcDetRelease(){
  const d = ARC.det;
  d.on = false; d.ws = null; d.canvas = null; d.ctx = null;
  d.workW = 0; d.workH = 0;
  arcDetReset(true);
}
/* Mean corner displacement between two quads, in the same coordinate space. */
function arcQuadDrift(a, b){
  if(!a || !b) return Infinity;
  let s = 0;
  for(let i=0; i<4; i++) s += Math.hypot(a[i*2]-b[i*2], a[i*2+1]-b[i*2+1]);
  return s/4;
}
function arcQuadDiag(q){
  return (Math.hypot(q[4]-q[0], q[5]-q[1]) + Math.hypot(q[6]-q[2], q[7]-q[3]))/2;
}
/* One throttled detection pass. Returns true if it actually ran. */
function arcDetStep(){
  const d = ARC.det;
  if(!d.on || ARC.tier !== "B" || ARC.mode !== "auto" || ARC.panel) return false;
  const v = ARC.video;
  if(!v || !v.videoWidth || v.readyState < 2) return false;
  const now = arcNow();
  if(now < d.nextAt) return false;
  if(!arcDetFit()) return false;
  d.nextAt = now + 1000/d.fps;

  const def = arcRefDef();
  const wMm = def.mm, hMm = def.hmm || def.mm;
  if(!(wMm > 0) || !(hMm > 0)) return false;

  const t0 = arcNow();
  let res = null, rr = null;
  try{
    d.ctx.drawImage(v, 0, 0, d.workW, d.workH);
    const img = d.ctx.getImageData(0, 0, d.workW, d.workH);
    DET.lumaFromRGBA(img.data, d.ws.luma, d.workW*d.workH);
    res = DET.detect(d.ws, {
      aspect: wMm/hMm,
      focalPx: ARC.focal.f ? ARC.focal.f/d.scale : null,   // intrinsics in WORK pixels
      cx: d.workW/2, cy: d.workH/2
    });
    if(res && res.quad){
      const out = new Float64Array(8);
      rr = DET.refine(d.ws.luma, d.workW, d.workH, res.quad, out, d.ws, {});
      res.refined = out;
    }
  }catch(e){
    d.note = "detector pass failed: " + ((e && e.message) || "unknown");
    res = null;
  }
  const ms = arcNow() - t0;

  /* ---- budget bookkeeping and graceful degradation ---- */
  d.passes++;
  d.lastMs = ms;
  d.meanMs = d.meanMs ? (d.meanMs*0.85 + ms*0.15) : ms;
  if(ms > d.maxMs) d.maxMs = ms;
  if(ms > DET_BUDGET_MS){
    d.overruns++;
    if(d.overruns >= DET_DEGRADE_RUN && d.step < DET_LADDER.length - 1){
      d.step++; d.overruns = 0; d.degraded++;
      const p = arcDetProfile(d.cls, d.step);
      d.degradeNote = "passes were averaging " + Math.round(d.meanMs) + " ms (budget "
        + DET_BUDGET_MS + " ms), so detection stepped down to " + p.work + " px at "
        + p.fps + " fps.";
      arcDetFit();
      toast("Detection slowed down to keep the preview smooth — " + p.work + " px / " + p.fps + " fps.");
    }
  } else if(d.overruns > 0){
    d.overruns--;
  }

  /* ---- what came back ---- */
  if(!res || !res.quad || !res.refined){
    d.cand = null;
    if(d.locked && (now - d.seenAt) > DET_HOLD_MS){
      d.locked = false; d.quad = null;
      d.note = "lost the reference — hold the phone steady, or adjust by hand.";
    }
    return true;
  }
  d.hits++;

  // work pixels -> video pixels, which is the space every measurement uses
  const q = new Float64Array(8);
  for(let i=0; i<8; i++) q[i] = res.refined[i]*d.scale;

  /* Score the REFINED quad, not the coarse one: refinement is exactly the step
     that turns a rough outline into something worth trusting, so the confidence
     the user is shown must reflect the corners actually being used. */
  const asp = res.flipped ? hMm/wMm : wMm/hMm;
  const fit = DET.rectFit(res.refined, asp, ARC.focal.f ? ARC.focal.f/d.scale : GEO.focalFromFov(d.workW, ASSUMED_HFOV_DEG),
                          d.workW/2, d.workH/2);
  const areaFrac = DET.quadArea(res.refined)/(d.workW*d.workH);
  const conf = fit
    ? DET.confidence({ ortho:fit.ortho, scale:fit.scale, areaFrac:areaFrac,
                       support:rr.support, rms:rr.rms })
    : 0;

  d.conf = conf;
  d.flipped = !!res.flipped;
  d.wMm = res.flipped ? hMm : wMm;
  d.hMm = res.flipped ? wMm : hMm;
  d.support = rr.support;
  d.rms = rr.rms;
  d.cornerSigmaPx = (rr.cornerSigma == null) ? null : rr.cornerSigma*d.scale;

  // where in the frame it sits, normalised to the half-diagonal — the barrel term
  let cxq = 0, cyq = 0;
  for(let i=0; i<4; i++){ cxq += q[i*2]; cyq += q[i*2+1]; }
  cxq /= 4; cyq /= 4;
  const vw = v.videoWidth, vh = v.videoHeight;
  d.radial = Math.hypot(cxq - vw/2, cyq - vh/2)/(Math.hypot(vw, vh)/2);

  if(d.locked){
    const drift = arcQuadDrift(q, d.quad);
    const diag = arcQuadDiag(d.quad) || 1;
    if(conf < DET_LOCK_CONF || drift > DET_REACQUIRE_FRAC*diag){
      /* Either it stopped looking like the reference, or it jumped far enough
         that it is probably a DIFFERENT object. Both mean the confirmation the
         user gave no longer applies to what is on screen. */
      d.locked = false; d.quad = null; d.offered = false; d.stable = 0;
      d.cand = q; d.seenAt = now;
      d.note = conf < DET_LOCK_CONF
        ? "the outline stopped matching the reference — confirm it again."
        : "the outline jumped to a different rectangle — confirm it again.";
      return true;
    }
    d.quad = q; d.seenAt = now; d.note = "";
    return true;
  }

  // not locked: build up agreement before offering anything
  if(conf < DET_ACCEPT_CONF){
    d.cand = null; d.stable = 0; d.offered = false;
    return true;
  }
  const diag = arcQuadDiag(q) || 1;
  d.stable = (d.cand && arcQuadDrift(q, d.cand) < DET_REACQUIRE_FRAC*diag) ? (d.stable + 1) : 0;
  d.cand = q; d.seenAt = now;
  d.offered = d.stable >= DET_STABLE_PASSES;
  return true;
}
/* The user has looked at the outline and said yes. This is the ONLY way a
   detection becomes a measurement. */
function arcDetConfirm(){
  const d = ARC.det;
  if(!d.cand){ toast("Nothing detected yet — point the camera at the reference.", true); return; }
  d.quad = d.cand; d.locked = true; d.note = "";
  toast("Reference locked — " + Math.round(d.conf*100) + "% confidence.");
}
/* …and this is the escape hatch, seeded so no work is thrown away. */
function arcDetToManual(){
  const d = ARC.det, m = arcMap();
  const src = d.quad || d.cand;
  ARC.mode = "quad";
  if(src){
    ARC.handles = [];
    for(let i=0; i<4; i++) ARC.handles.push(arcToCss(m, [src[i*2], src[i*2+1]]));
    arcRenderHandles();
    toast("Detected corners handed to the 4 handles — drag any that are off.");
  } else {
    arcResetHandles();
  }
}
/* Corner-position uncertainty in VIDEO pixels for the current mode. Auto gets
   the detector's own line-fit residual; the manual modes get the plain truth
   that a fingertip on a phone screen lands within a few CSS pixels of where it
   was aimed. */
const ARC_HANDLE_SIGMA_CSS = 3.0;
function arcCornerSigmaPx(){
  if(ARC.mode === "auto" && ARC.det.cornerSigmaPx != null) return ARC.det.cornerSigmaPx;
  const m = arcMap();
  return ARC_HANDLE_SIGMA_CSS/(m.s || 1);
}
/* The error bar the merchandiser actually sees, and the one recorded as
   evidence. Built from the live measurement, not from a constant. */
function arcRefError(quadVid, def){
  const v = ARC.video;
  const vw = (v && v.videoWidth) || 1280, vh = (v && v.videoHeight) || 720;
  let cx = 0, cy = 0;
  for(let i=0; i<4; i++){ cx += quadVid[i*2]; cy += quadVid[i*2+1]; }
  cx /= 4; cy /= 4;
  const radial = Math.hypot(cx - vw/2, cy - vh/2)/(Math.hypot(vw, vh)/2);
  /* The SMALLER dimension carries the larger relative tolerance, so quoting it
     is the conservative choice. */
  const wMm = (ARC.mode === "auto" && ARC.det.wMm) ? ARC.det.wMm : def.mm;
  const hMm = (ARC.mode === "auto" && ARC.det.hMm) ? ARC.det.hMm : (def.hmm || def.mm);
  const small = Math.min(wMm, hMm);
  const e = DET.errorEstimate({
    focalRelSigma: ARC.focal.relSigma,
    refMm: small, refTolMm: arcRefTolMm(def, small),
    cornerSigmaPx: arcCornerSigmaPx(),
    meanSidePx: DET.meanSide(quadVid),
    radialNorm: radial, barrelK: BARREL_K
  });
  e.radial = radial;
  return e;
}

function arcMeasureTierB(){
  const m = arcMap(), f = ARC.focal.f, def = arcRefDef();
  const realWft = GEO.mToFt(def.mm/1000);
  /* ---- automatic: the detected, confirmed, still-agreeing rectangle ---- */
  if(ARC.mode === "auto"){
    const d = ARC.det;
    ARC.meas.refError = null;
    if(!d.locked || !d.quad){
      ARC.meas.distFt = null; ARC.meas.yawVerified = false; ARC.meas.wallSeen = false;
      ARC.meas.distSrc = d.cand
        ? "rectangle found — confirm the outline before it counts"
        : (d.on ? "looking for the reference rectangle…" : "detector off");
      return;
    }
    const dst = [[d.quad[0],d.quad[1]],[d.quad[2],d.quad[3]],[d.quad[4],d.quad[5]],[d.quad[6],d.quad[7]]];
    const wFt = GEO.mToFt(d.wMm/1000), hFt = GEO.mToFt(d.hMm/1000);
    const src = [[-wFt/2,-hFt/2],[wFt/2,-hFt/2],[wFt/2,hFt/2],[-wFt/2,hFt/2]];
    const H = GEO.homography(src, dst);
    const pose = H ? GEO.poseFromHomography(H, f, m.vw/2, m.vh/2) : null;
    if(pose && isFinite(pose.distance) && pose.distance > 0.3 && pose.distance < 200){
      ARC.meas.distFt = pose.distance;
      ARC.meas.yawDeg = pose.yawDeg;
      ARC.meas.yawVerified = true;
      ARC.meas.homPitchDeg = pose.pitchDeg;
      ARC.meas.wallSeen = true;
      ARC.meas.refError = arcRefError(d.quad, def);
      ARC.meas.distSrc = "reference-scaled — auto-detected rectangle ("
        + def.label + (d.flipped ? ", landscape" : "") + ", "
        + Math.round(d.conf*100) + "% confidence)";
      return;
    }
    ARC.meas.distFt = null; ARC.meas.yawVerified = false; ARC.meas.wallSeen = false;
    ARC.meas.distSrc = "the detected outline does not solve to a pose — adjust it by hand";
    return;
  }
  ARC.meas.refError = null;
  if(ARC.mode === "quad" && ARC.handles.length === 4){
    const realHft = GEO.mToFt((def.hmm || def.mm)/1000);
    const dst = ARC.handles.map(function(p){ return arcToVid(m, p[0], p[1]); });
    const src = [[-realWft/2,-realHft/2],[realWft/2,-realHft/2],[realWft/2,realHft/2],[-realWft/2,realHft/2]];
    const H = GEO.homography(src, dst);
    const pose = H ? GEO.poseFromHomography(H, f, m.vw/2, m.vh/2) : null;
    if(pose && isFinite(pose.distance) && pose.distance > 0.3 && pose.distance < 200){
      ARC.meas.distFt = pose.distance;
      ARC.meas.yawDeg = pose.yawDeg;
      ARC.meas.yawVerified = true;
      ARC.meas.homPitchDeg = pose.pitchDeg;
      ARC.meas.wallSeen = true;
      ARC.meas.refError = arcRefError(
        new Float64Array([dst[0][0],dst[0][1],dst[1][0],dst[1][1],dst[2][0],dst[2][1],dst[3][0],dst[3][1]]),
        def);
      ARC.meas.distSrc = "reference-scaled — 4-handle quad (" + def.label + ")";
      return;
    }
    ARC.meas.wallSeen = false;
    ARC.meas.distFt = null; ARC.meas.yawVerified = false;
    ARC.meas.distSrc = "quad is degenerate — spread the four handles onto the real corners";
    return;
  }
  const a = arcToVid(m, ARC.handles[0][0], ARC.handles[0][1]);
  const b = arcToVid(m, ARC.handles[1][0], ARC.handles[1][1]);
  const px = Math.hypot(b[0]-a[0], b[1]-a[1]);
  const d = GEO.distanceFromWidth(realWft, f, px);
  ARC.meas.distFt = (isFinite(d) && d > 0.3 && d < 200) ? d : null;
  ARC.meas.yawDeg = null; ARC.meas.yawVerified = false;
  ARC.meas.wallSeen = ARC.meas.distFt != null;
  ARC.meas.distSrc = "reference-scaled — 2-handle (" + def.label + ")";
}

/* ==========================================================
   FLOOR-LINE — reference-free distance on a phone with no ARCore
   ------------------------------------------------------------
   d = h / tan θ.  Hold the phone at height h, tilt down by θ until the reticle
   sits on the line where the wall meets the floor, and that is the horizontal
   distance to the wall. Nothing is taped up, nothing of known size has to be in
   frame, and the only sensor involved is the one this phone was already proven
   to get right — the gravity vector behind "TILTED FORWARD 12°".

   THE AIMING PROBLEM, HONESTLY.
   While the reticle is on the floor line the wall is not framed; the moment the
   phone comes up to frame the wall, the floor line leaves the view. There is no
   way around that, so it is designed for rather than hidden:

     · AIMED DOWN  — the reading is LIVE. The existing distance row does the
       walking ("TOO CLOSE — move back 1.2 ft"), so the merchandiser walks
       themselves to 6 ft while still looking at the floor.
     · RAISED      — the last steady reading is HELD. It is labelled HELD, its
       age is shown, and the record says how old it was when the shutter fired.
       It is never dressed up as a live measurement.
     · MOVED       — a separate devicemotion listener watches gravity-removed
       acceleration between the latch and the shutter. One step invalidates the
       held reading outright; a jostle warns; a phone that reports no motion at
       all says so rather than implying the merchandiser stood still.

   The first ~600 ms after a latch is not counted, because raising the phone is
   itself a wrist movement that reads like a small step on the accelerometer.
   Everything after that is the merchandiser's own feet.
   ========================================================== */

/* ---- per-device eye height, stored exactly the way the focal calibration is:
        one key per device string, in its own localStorage blob, tolerant of a
        browser that refuses storage entirely. ---- */
function floorCalKey(){ return deviceString(); }
function floorCalAll(){
  try{ return JSON.parse(localStorage.getItem(FLOOR_CAL_KEY) || "{}") || {}; }catch(e){ return {}; }
}
function floorCalGet(){
  const r = floorCalAll()[floorCalKey()];
  return (r && r.hM > 0) ? r : null;
}
function floorCalSet(rec){
  try{
    const all = floorCalAll();
    all[floorCalKey()] = rec;
    localStorage.setItem(FLOOR_CAL_KEY, JSON.stringify(all));
  }catch(e){ toast("Could not save the height (storage unavailable).", true); }
}
function floorCalClear(){
  try{
    const all = floorCalAll();
    delete all[floorCalKey()];
    localStorage.setItem(FLOOR_CAL_KEY, JSON.stringify(all));
  }catch(e){}
}
/* The height in force, and how much it is worth. A calibration records its own
   uncertainty when it is solved (tape error + angle error), the same way the
   focal calibration does — so a merchandiser who calibrated properly gets a
   tighter error bar than one who did not, without anyone editing a constant. */
/* The stature on the signed-in user's own profile row, in cm, or null. Read
   through Session so a shared handset can never hand one merchandiser another
   merchandiser's height — that is exactly why the number lives on `profiles`
   and not in localStorage next to the device calibration. */
function myStatureCm(){
  let p = null;
  try{ p = Session.profile(); }catch(e){ p = null; }
  const v = (p && p.height_cm != null) ? Number(p.height_cm) : null;
  return (v != null && isFinite(v) && v >= STATURE_MIN_CM && v <= STATURE_MAX_CM) ? v : null;
}

/* THREE sources for h, in strict order of how much they are worth, and the one
   in force always says which it is:

     1. a tape calibration ON THIS DEVICE   — measured, ~± 2.3 %
     2. the user's own stature × HOLD_RATIO — derived,  ~± 4 %
     3. the stated default                  — a guess,  ± 8.5 %

   The calibration wins where it exists because it is a measurement of this
   person holding THIS phone, and it already carries its own solved uncertainty.
   Nothing is a constant: whichever branch runs writes hRelSigma, and
   GEO.floorLineError consumes it unchanged. */
function floorResolveHeight(){
  const f = ARC.floor, c = floorCalGet();
  if(c){
    f.hM = Number(c.hM);
    f.hRelSigma = (c.relSigma > 0) ? Number(c.relSigma) : FLOOR_DEFAULT_H_SIGMA;
    f.calibrated = true;
    f.hSrcKey = "device";
    f.hSrc = "measured on this phone — " + f.hM.toFixed(2) + " m, solved from "
           + Number(c.distFt).toFixed(1) + " ft at " + Number(c.thetaDeg).toFixed(1) + "°, "
           + fmtD(c.ts);
    return f;
  }
  const st = statureHold(myStatureCm());
  if(st){
    f.hM = st.hM;
    f.hRelSigma = st.relSigma;
    f.calibrated = false;          // NOT measured on this device, and never claims to be
    f.hSrcKey = "stature";
    f.hSrc = "from your height — " + st.statureCm.toFixed(0) + " cm × " + st.ratio.toFixed(3)
           + " (phone held at neck level) = " + f.hM.toFixed(2) + " m, ± "
           + (st.relSigma*100).toFixed(1) + "%";
    return f;
  }
  f.hM = FLOOR_DEFAULT_H_M;
  f.hRelSigma = FLOOR_DEFAULT_H_SIGMA;
  f.calibrated = false;
  f.hSrcKey = "default";
  f.hSrc = "stated default " + FLOOR_DEFAULT_H_M.toFixed(2) + " m — your height is not on file "
         + "and this phone has never been measured";
  return f;
}

/* ==========================================================
   THE ONE QUESTION
   ------------------------------------------------------------
   Asked once, on the first sign-in where `profiles.height_cm` is null, and
   never again unless the user goes looking for it. It is a question, not an
   onboarding flow: one field, two buttons, and skipping it is a real answer
   that costs a bigger error bar and nothing else.

   Merchandisers are prompted; managers and admins are not, because nobody who
   only approves photographs needs to tell the app how tall they are. The menu
   entry is offered to everyone, so a manager who does field work can still set
   theirs.

   The "already asked" flag is per USER and lives on the device: a shared
   handset must not decide that Sneha has been asked because Aditya was.
   ========================================================== */
function heightAskKey(){ return HEIGHT_ASK_KEY + ":" + (Session.userId() || "anon"); }
function heightAsked(){
  try{ return localStorage.getItem(heightAskKey()) === "1"; }catch(e){ return false; }
}
function heightMarkAsked(){
  try{ localStorage.setItem(heightAskKey(), "1"); }catch(e){ /* private mode: it asks again, which is not harmful */ }
}

/* Offline-first, like every other write here: the number is in force for the
   very next capture even with the radio dead, and the OUTBOX is what eventually
   tells the server. Nothing PATCHes profiles directly. */
function saveHeight(cm){
  const uid = Session.userId();
  if(!uid){ return false; }
  const v = Math.round(Number(cm));
  const st = statureHold(v);
  if(!st){
    toast("Enter a height between " + STATURE_MIN_CM + " and " + STATURE_MAX_CM + " cm.", true);
    return false;
  }
  Session.mergeProfile({ height_cm: v });
  for(let i = 0; i < USERS.length; i++) if(USERS[i].id === uid) USERS[i].heightCm = v;
  state.profiles = USERS;
  heightMarkAsked();
  save();
  Outbox.push("profile.patch", { id: uid, patch: { height_cm: v } },
              { label: "Save your height (" + v + " cm)" });
  /* If the capture screen is already open, the new h takes effect on the next
     frame rather than on the next capture. */
  if(ARC.open && ARC.floor.on) floorResolveHeight();
  closeModal();
  toast("Thanks. Distance is now worked out from a phone height of " + st.hM.toFixed(2)
      + " m (± " + (st.relSigma*100).toFixed(1) + "%) instead of a standard guess.");
  scheduleRender();
  return true;
}

function askHeight(manual){
  if(!signedIn()) return;
  if(!profileHeightSupported()){
    if(manual) toast("This project's database cannot store your height yet — ask your manager to apply "
                   + "the latest migration. Sizes will stay rough until then.", true);
    return;
  }
  const cur = myStatureCm();
  openModal({
    title: manual ? "Your height" : "One quick question",
    body: '<p style="margin:0 0 12px;font-size:13.5px;line-height:1.55;color:var(--text-2)">'
        + 'To show a poster at its real size the app has to know how high off the floor you hold '
        + 'the phone. It works that out from your height — <b>you only answer this once</b>.'
        + '</p>'
        + '<div class="field" style="max-width:220px"><label class="fl" for="hq_cm">How tall are you? (cm)</label>'
        + '<input id="hq_cm" type="number" inputmode="numeric" step="1" min="' + STATURE_MIN_CM + '" '
        + 'max="' + STATURE_MAX_CM + '" value="' + (cur || "") + '" placeholder="e.g. 170"></div>'
        + '<div class="hint" style="margin-top:10px">Hold the phone up at <b>neck level</b> when you take a '
        + 'measurement — that is the position this works from. Skip the question and the app falls back to a '
        + 'standard guess, marks every capture <b>rough</b>, and still works.</div>',
    actions: [
      { label:"Save", cls:"btn primary", act: function(){
          const el = $("#hq_cm");
          saveHeight(el ? el.value : null);
        } },
      { label: manual ? "Cancel" : "Skip for now", cls:"btn ghost", act: function(){
          if(!manual) heightMarkAsked();
          closeModal();
        } }
    ]
  });
}

/* Called once the profile is known — at boot and after a sign-in. Deliberately
   silent about every reason not to ask, because "we already asked", "there is
   nowhere to store it" and "this user does not take photographs" are all
   perfectly normal. */
function maybeAskHeight(){
  if(!signedIn() || !profileHeightSupported()) return;
  if(myRole() !== "Merchandiser") return;
  if(myStatureCm() != null) return;
  if(heightAsked()) return;
  askHeight(false);
}

/* ---- the gravity vector, from whichever sensor is actually reporting ---- */
function floorGravity(){
  const s = ARC.sensors, m = ARC.floor.motion;
  if(s.beta != null || s.gamma != null)
    return GEO.applyScreenAngle(GEO.gravityFromOrientation(s.alpha, s.beta, s.gamma), arcScreenAngle());
  if(m.g) return GEO.applyScreenAngle(m.g, arcScreenAngle());
  return null;
}
/* Depression of the OPTICAL AXIS below horizontal. Not the negated HUD pitch —
   see GEO.depressionFromGravity for why roll makes those two different. */
function floorDepressionDeg(){
  const g = floorGravity();
  if(!g) return null;
  const th = GEO.depressionFromGravity(g);
  return isFinite(th) ? th : null;
}

/* ---- movement between the measurement and the shutter ---- */
function floorMotionAttach(){
  const m = ARC.floor.motion;
  if(m.onMot || typeof window.DeviceMotionEvent === "undefined") return;
  m.onMot = function(e){
    const gi = e.accelerationIncludingGravity;
    if(gi && (gi.x != null || gi.y != null || gi.z != null)){
      const v = GEO.vnorm([-(gi.x||0), -(gi.y||0), -(gi.z||0)]);
      if(isFinite(v[0]) && isFinite(v[1]) && isFinite(v[2])) m.g = v;
    }
    /* Prefer the gravity-REMOVED vector where the UA offers one (iOS always
       does). Failing that, subtract the magnitude of gravity from the raw
       magnitude. That is crude — it under-reads a purely horizontal push — but
       it only has to separate "stood still" from "took a step", and it is never
       integrated into a displacement, which would drift uselessly. */
    let a = null;
    const la = e.acceleration;
    if(la && (la.x != null || la.y != null || la.z != null))
      a = Math.hypot(la.x||0, la.y||0, la.z||0);
    else if(gi && (gi.x != null || gi.y != null || gi.z != null))
      a = Math.abs(Math.hypot(gi.x||0, gi.y||0, gi.z||0) - 9.80665);
    if(a == null || !isFinite(a)) return;
    m.seen = true;
    const now = Date.now();
    // the raise itself is a wrist movement, not a step — do not charge it
    if(m.since && now - m.since < FLOOR_RAISE_GRACE_MS) return;
    if(a > m.peak) m.peak = a;
    if(a >= FLOOR_STEP_ACCEL && now - m.lastPeakAt >= FLOOR_STEP_GAP_MS){
      m.steps++; m.lastPeakAt = now;
    }
  };
  try{ window.addEventListener("devicemotion", m.onMot, true); m.on = true; }catch(e){ m.onMot = null; }
}
function floorMotionDetach(){
  const m = ARC.floor.motion;
  if(m.onMot){
    try{ window.removeEventListener("devicemotion", m.onMot, true); }catch(e){}
    m.onMot = null;
  }
  m.on = false;
}
/* Restart the movement account. `seen` deliberately survives: it records
   whether this device EVER reports motion, which is a property of the phone,
   not of this reading. */
function floorMotionMark(){
  const m = ARC.floor.motion;
  m.since = Date.now(); m.steps = 0; m.peak = 0; m.lastPeakAt = 0;
}

/* ---- the angular band ----
   ONE place decides whether an angle may be reported, so the HUD, the note on
   the record and the self-test can never disagree about it. */
function floorGuard(thetaDeg){
  if(thetaDeg == null || !isFinite(thetaDeg))
    return { ok:false, code:"nosensor",
             why:"No tilt reading from this phone yet — tap “Enable motion sensors”." };
  if(thetaDeg <= 0)
    return { ok:false, code:"up",
             why:"The phone is level or aiming upwards, so the line never reaches the floor. Tilt it DOWN." };
  if(thetaDeg < FLOOR_MIN_DEPRESSION)
    return { ok:false, code:"shallow",
             why:"Only " + thetaDeg.toFixed(0) + "° down — nearly straight ahead. At that angle the sum "
                + "divides by almost nothing and the distance runs away, so it will not be shown. "
                + "Tilt further down until the line sits where the wall meets the floor." };
  if(thetaDeg > FLOOR_MAX_DEPRESSION)
    return { ok:false, code:"steep",
             why:thetaDeg.toFixed(0) + "° down is almost straight at the ground — that is the floor by "
                + "your own feet, not the bottom of the wall. Raise the phone a little." };
  return { ok:true, code:"ok", why:"" };
}
/* Total 1σ on the depression angle: the jitter actually MEASURED off this
   phone's sensor over the last window, floored so a heavily filtered UA cannot
   claim to be perfect, added in quadrature with how precisely a person can put
   a reticle on a line across a room. */
function floorThetaSigma(){
  const f = ARC.floor;
  const jitter = Math.max(f.thetaSigma == null ? 0 : f.thetaSigma, FLOOR_PITCH_SIGMA_FLOOR);
  return arcQuad(jitter, FLOOR_AIM_SIGMA_DEG);
}

/* ---- one sampling pass, called from arcTick ---- */
function floorStep(){
  const f = ARC.floor;
  const now = Date.now();
  const raw = floorDepressionDeg();
  f.thetaRaw = raw;

  /* A short rolling window. The MEDIAN is what gets used, because one spike
     from a bump should not move the reading; the SPREAD of the window is the
     sensor noise term in the error budget, measured rather than assumed. */
  if(raw != null){
    f.samples.push({ t:now, th:raw });
    while(f.samples.length && now - f.samples[0].t > FLOOR_SAMPLE_MS) f.samples.shift();
    if(f.samples.length > 240) f.samples.splice(0, f.samples.length - 240);
  } else if(f.samples.length && now - f.samples[f.samples.length-1].t > FLOOR_SAMPLE_MS){
    f.samples.length = 0;
  }
  const n = f.samples.length;
  if(n >= 3){
    const v = f.samples.map(function(s){ return s.th; }).sort(function(a,b){ return a-b; });
    const med = (n % 2) ? v[(n-1)>>1] : (v[n/2-1] + v[n/2])/2;
    let s2 = 0;
    for(let i=0; i<n; i++){ const dv = f.samples[i].th - med; s2 += dv*dv; }
    f.theta = med;
    f.thetaSigma = Math.sqrt(s2/(n-1));
  } else if(raw != null){
    f.theta = raw; f.thetaSigma = null;
  } else {
    f.theta = null; f.thetaSigma = null;
  }

  const g = floorGuard(f.theta);
  if(!g.ok){
    f.live = null; f.why = g.why; f.code = g.code;
    return;
  }
  /* Mid-raise the window holds samples from BOTH the floor aim and the wall
     aim. Their median is a number that never corresponded to any real aim, yet
     it sits comfortably inside the band — so it would print as a confident live
     distance for the better part of a second. The spread gives it away: 18° of
     scatter is not sensor noise. Refuse rather than flash a fiction. */
  if(f.thetaSigma != null && f.thetaSigma > FLOOR_LIVE_SIGMA_DEG){
    f.live = null; f.code = "moving";
    f.why = "The phone is still swinging. Hold it steady with the line on the wall/floor join.";
    return;
  }
  const sTh = floorThetaSigma();
  const dFt = GEO.mToFt(GEO.floorLineDistance(f.hM, f.theta));
  if(!(isFinite(dFt) && dFt >= FLOOR_DIST_MIN_FT && dFt <= FLOOR_DIST_MAX_FT)){
    f.live = null; f.code = "range";
    f.why = isFinite(dFt)
      ? ("That angle works out to " + dFt.toFixed(0) + " ft, which is not a wall inside a shop — "
         + "check the line really is on the wall/floor join.")
      : "That angle does not solve to a distance at all.";
    return;
  }
  const err = GEO.floorLineError({ h:f.hM, heightRelSigma:f.hRelSigma,
                                   thetaDeg:f.theta, thetaSigmaDeg:sTh });
  f.live = { distFt:dFt, theta:f.theta, thetaSigma:sTh, err:err, at:now };
  f.why = ""; f.code = "ok";
  /* Latch only once the angle has STOPPED MOVING. A reading taken mid-swing is
     the one thing a held value must never be. Every fresh latch also restarts
     the movement account, so "have you moved?" is always measured from the
     reading that is actually on screen.

     ONCE THE TWO-STEP FLOW HAS MOVED ON TO FRAMING, LATCHING STOPS. The phone
     is on its way up to the wall; anywhere on that arc it can sit still for a
     moment at an angle that is inside the band but is NOT aimed at the floor
     join, and re-latching there would quietly replace a good reading with a
     fictional one. The manager HUD never leaves step "measure", so its
     behaviour is exactly what it was. */
  if(f.step !== "frame" && f.thetaSigma != null && f.thetaSigma <= FLOOR_LATCH_SIGMA_DEG){
    f.hold = { distFt:dFt, theta:f.theta, thetaSigma:sTh, err:err, at:now };
    floorMotionMark();
  }
}

/* Is the held reading still worth offering, and what has to be said about it? */
function floorHoldState(){
  const f = ARC.floor, m = f.motion;
  if(!f.hold)
    return { ok:false, code:"none", age:0,
             why:"Nothing measured yet. Tilt the phone down until the line sits where the wall meets the floor." };
  const age = Date.now() - f.hold.at;
  if(age > FLOOR_HOLD_MAX_MS)
    return { ok:false, code:"stale", age:age,
             why:"That reading is " + Math.round(age/1000) + " s old — too old to trust. "
                + "Tilt down onto the floor line again." };
  if(m.seen && m.steps >= 1)
    return { ok:false, code:"moved", age:age,
             why:"You have moved since that reading" + (m.steps > 1 ? " (" + m.steps + " steps)" : "")
                + ", so the distance no longer holds. Tilt down onto the floor line again." };
  let warn = "";
  if(!m.seen)
    warn = "This phone is not reporting movement, so the app cannot tell whether you walked after taking "
         + "that reading. If you moved at all, measure again.";
  else if(m.peak >= FLOOR_STIR_ACCEL)
    warn = "The phone was jostled after that reading. It does not look like a step, but if you shifted "
         + "your feet, measure again.";
  else if(age > FLOOR_HOLD_WARN_MS)
    warn = "That reading is " + Math.round(age/1000) + " s old.";
  return { ok:true, code:"held", age:age, why:"", warn:warn };
}

/* Three words for the three sources of h, for the provenance string that lands
   on the placement's distance_source column. */
function floorHSrcShort(f){
  return f.hSrcKey === "device"  ? "measured on this phone"
       : f.hSrcKey === "stature" ? "from their stated height"
       : "stated default";
}

/* ---- what the rest of the app sees ----
   Writes the SAME fields arcMeasureTierB writes, so arcGates(), the HUD, the
   ruler, the arming ring and arcBuildRecord are all untouched. There is exactly
   one distance gate and this feeds it. */
function floorMeasure(){
  const f = ARC.floor;
  ARC.meas.refError = null;
  ARC.meas.heldMs = null;
  ARC.meas.yawDeg = null; ARC.meas.yawVerified = false;
  ARC.meas.homPitchDeg = null;
  ARC.meas.floorReading = null;

  /* In the framing step a "live" reading is by definition not a reading of the
     floor join — the phone is pointed at the wall. Only the value captured when
     the button was pressed may be used, and it is labelled HELD. */
  if(f.live && f.step !== "frame"){
    f.state = "live"; f.warn = "";
    ARC.meas.distFt = f.live.distFt;
    ARC.meas.refError = f.live.err;
    ARC.meas.wallSeen = true;
    ARC.meas.floorReading = f.live;
    ARC.meas.distSrc = "floor-line, LIVE — reticle on the wall/floor join at "
      + f.live.theta.toFixed(1) + "° below horizontal, height "
      + f.hM.toFixed(2) + " m (" + floorHSrcShort(f) + ")";
    return;
  }
  const h = floorHoldState();
  if(h.ok){
    f.state = "held"; f.warn = h.warn;
    ARC.meas.distFt = f.hold.distFt;
    ARC.meas.refError = f.hold.err;
    ARC.meas.heldMs = h.age;
    ARC.meas.wallSeen = true;
    ARC.meas.floorReading = f.hold;
    ARC.meas.distSrc = "floor-line, HELD — measured " + (h.age/1000).toFixed(1)
      + " s earlier at " + f.hold.theta.toFixed(1) + "° below horizontal, height "
      + f.hM.toFixed(2) + " m (" + floorHSrcShort(f) + ")"
      + (f.motion.seen ? (f.motion.steps ? "; MOVED since" : "; no step detected since")
                       : "; this device reports no movement data");
    return;
  }
  f.state = h.code;
  f.warn = "";
  ARC.meas.distFt = null;
  ARC.meas.wallSeen = false;
  /* When there is nothing held at all, the useful thing to say is why the LIVE
     reading is refused (they are aiming wrong). Once something has been held,
     why it can no longer be used is the more useful thing. */
  ARC.meas.distSrc = (h.code === "none") ? (f.why || h.why) : h.why;
}

/* ---- step 1 of the field flow: take the reading and move on to framing ----
   The press does three things, and each of them is the honest version of
   something the old screen did implicitly:

     · it FREEZES the live reading. From here on floorStep stops latching, so
       nothing that happens while the phone is being raised can quietly replace
       a good measurement with one taken half way up the wall.
     · it RESTARTS the movement account, so "have you moved?" is measured from
       this reading and not from some earlier latch.
     · it RECORDS the squareness attestation. The instruction the merchandiser
       just read says "stand square to the wall"; pressing the button after
       reading it is the statement, and the record still says the yaw was stated
       rather than measured (yaw_verified = false). See arcFieldUI. */
function arcFloorTakeReading(){
  const f = ARC.floor;
  if(!f.live){ toast(arcPlainFloorWhy(f), true); return; }
  /* Freezing a reading taken from a spot the capture cannot be taken from would
     only mean being told to walk and then to measure again. Refuse it here as
     well as in the button's enabled state, so a stray tap cannot get past it —
     and refuse it on the SAME TEST the button uses, which is why the decision
     lives in floorReadingGate and not in this line. */
  const gate = floorReadingGate(f.live.distFt);
  if(!gate.ok){ toast(gate.why, true); return; }
  f.hold = { distFt:f.live.distFt, theta:f.live.theta, thetaSigma:f.live.thetaSigma,
             err:f.live.err, at:Date.now() };
  f.step = "frame";
  f.samples.length = 0;
  floorMotionMark();
  ARC.assumeSquare = true;
  ARC.armT0 = 0; ARC.armed = false;
  toast("Measured " + f.live.distFt.toFixed(1) + " ft. Straighten the phone up — keep your feet where they are."
        + gate.note);
}

/* ---- may this reading be frozen? ----
   ONE place decides, so the button's enabled state, the refusal on a stray tap
   and the self-test can never disagree about it — the same reason floorGuard
   exists one screen earlier. The two ways of asking used to be written out
   separately, and they drifted: the button was taught the derived standoff and
   this refusal was not, so in mockup mode it offered a press it then rejected
   with "Move in 6.0 ft first — you are too far from the wall", against a band
   the mode had already stopped using.

   VERIFICATION IS UNTOUCHED. There the capture is evidence measured against the
   manager's spec, so both directions are hard stops at t.standoffFt ± tol and
   the wording is verbatim what it always was.

   MOCKUP asks the only question the mode can ask — can the artwork be drawn
   complete from here?

     · TOO CLOSE stays a hard stop. Below the minimum the poster cannot fit the
       frame at all, so there is nothing to capture; and it is also where the
       floor-line reading itself is worst, since a near wall means a steep θ and
       ∂d/∂θ = -h/sin²θ is at its most unforgiving there. Refusing is a
       statement about the measurement, not about a preference.
     · TOO FAR is not refused, because there is nothing to refuse: standing
       further back sees MORE wall, and the mockup stays complete and honest.
       Once the artwork is small enough in frame to be worth mentioning, it is
       mentioned — one sentence, appended to the confirmation, after the reading
       has already been taken.

   `note` is advice and rides on a SUCCESS; `why` is a refusal. Exactly one of
   them is ever non-empty. */
function floorReadingGate(distFt){
  const t = ARC.task;
  const none = { ok:false, code:"none", why:arcPlainFloorWhy(ARC.floor), note:"" };
  if(distFt == null || !isFinite(distFt) || !t) return none;
  if(!MOCKUP){
    const d = distFt - t.standoffFt;
    if(d < -t.standoffTolFt)
      return { ok:false, code:"close", note:"",
               why:"Move back " + Math.abs(d).toFixed(1) + " ft first — you are too close to the wall." };
    if(d > t.standoffTolFt)
      return { ok:false, code:"far", note:"",
               why:"Move in " + d.toFixed(1) + " ft first — you are too far from the wall." };
    return { ok:true, code:"ok", why:"", note:"" };
  }
  /* No intrinsics, no fit, nothing to refuse ON. A phone that cannot say how
     much wall it sees must not invent a reason to reject a real measurement —
     the same fail-open the distance gate takes when `fit` is missing. */
  const fit = arcFit(distFt);
  if(!fit || !fit.view) return { ok:true, code:"ok", why:"", note:"" };
  const v = fit.view;
  if(!v.fits)
    return { ok:false, code:"close", note:"",
             why:"Move back first — from here you can only see "
               + (v.limit === "width"
                    ? fmtRoughFt(v.visibleWFt, fit.seeWSigma) + " ft of wall"
                    : fmtRoughFt(v.visibleHFt, fit.seeHSigma) + " ft of wall top to bottom")
               + ", and the poster is " + (v.limit === "width" ? t.widthFt : t.heightFt)
               + " ft. Stand about " + fmtRoughFt(fit.recommendedFt, fit.recSigma) + " ft back." };
  if(Math.max(v.fillW, v.fillH) < FRAME_FILL_LOOSE)
    return { ok:true, code:"far", why:"",
             note:" The poster will sit small in the shot from here — about "
                + fmtRoughFt(fit.recommendedFt, fit.recSigma) + " ft back fills it out." };
  return { ok:true, code:"ok", why:"", note:"" };
}

/* ---- entering and leaving the mode ---- */
function floorInit(){
  const f = ARC.floor;
  f.on = true;
  f.samples = []; f.live = null; f.hold = null;
  f.theta = null; f.thetaSigma = null; f.thetaRaw = null;
  f.state = "none"; f.why = ""; f.warn = ""; f.code = "none";
  f.calibrating = null;
  f.step = "measure";
  f.motion.seen = false; f.motion.g = null;
  floorMotionMark();
  floorResolveHeight();
  floorMotionAttach();
}
function floorRelease(){
  const f = ARC.floor;
  f.on = false;
  f.samples = []; f.live = null; f.hold = null; f.calibrating = null;
  f.theta = null; f.thetaSigma = null; f.step = "measure";
  floorMotionDetach();
}

/* ---- calibration: solve h from a distance the merchandiser measured once ----
   Deliberately NOT "type in your chest height". People do not know it, and the
   ones who guess guess badly. Standing a tape-measured distance from any wall
   and aiming at the floor line solves the same unknown from the same geometry
   the method itself uses, so a systematic aiming habit partly cancels out. */
function floorCalPanel(){
  const c = floorCalGet();
  const plain = (myRole() === "Merchandiser");
  const st = statureHold(myStatureCm());
  arcPanel('<h2>' + (plain ? "Optional: measure this phone exactly" : "Calibrate phone height (floor-line)") + '</h2>'
    + '<p>' + (plain
        ? (st
            ? 'The app already works your phone height out from your height (' + st.hM.toFixed(2)
              + ' m, give or take ' + (st.relSigma*100).toFixed(0) + '%), and that is good enough for a '
              + 'mock-up. This measures it exactly instead. It needs a tape measure and about five '
              + 'minutes, and you never have to do it.'
            : 'It works out distance from how far down you tilt the phone, so it needs to know how high '
              + 'off the floor you hold it. Easier: answer the one height question in the menu. This is '
              + 'the exact version, and it needs a tape measure.')
        : 'Floor-line distance is <span class="mono">d = h / tan θ</span>. θ comes from the phone; '
          + '<span class="mono">h</span> is solved here from one known distance, and its uncertainty is '
          + 'recorded with it and carried into every later error bar. A saved calibration takes '
          + 'precedence over the stature estimate (stature × <span class="mono">'
          + HOLD_RATIO.toFixed(3) + '</span>).') + '</p>'
    + '<ol><li>Find a wall with clear floor at the bottom of it.</li>'
    + '<li>Measure a distance from that wall with a tape (or use a fixture you know the size of) and stand there.</li>'
    + '<li>Tap start, then tilt the phone down until the line sits exactly where the wall meets the floor.</li>'
    + '<li>Hold still and tap save.</li></ol>'
    + '<div class="field"><label class="fl" for="fcal_d">Measured distance you are standing from the wall (ft)</label>'
    +   '<input id="fcal_d" type="number" step="0.05" min="1" max="30" value="5.0"></div>'
    + '<div class="hint">Around <b>5 ft</b> is the sweet spot: it puts the tilt near 45°, where the angle '
    + 'matters least and the solve is tightest.</div>'
    + (c ? '<div class="hint">Saved for this phone: <b class="num">' + Number(c.hM).toFixed(2) + ' m</b> '
        + '(± ' + (Number(c.relSigma||FLOOR_DEFAULT_H_SIGMA)*100).toFixed(1) + '%), from '
        + Number(c.distFt).toFixed(1) + ' ft at ' + Number(c.thetaDeg).toFixed(1) + '°, ' + fmtD(c.ts) + '.</div>' : '')
    + '<div class="pfoot"><button class="btn primary" data-arc="floorcalstart">Start — aim at the floor line</button>'
    + (c ? '<button class="btn danger" data-arc="floorcalclear">Clear</button>' : '')
    + '<button class="btn" data-arc="floorcalback">Back to camera</button></div>');
  ARC.panel = "floorcal";
}
function floorCalStart(){
  const dFt = parseFloat((arcEl("fcal_d")||{}).value);
  if(!(dFt >= 1 && dFt <= 30)){
    toast("Enter the distance you measured, in feet.", true);
    return;
  }
  ARC.floor.calibrating = { knownFt: dFt };
  arcPanel(null);
  if(ARC.tier === "B") arcLoop();
}
function floorCalSave(){
  const f = ARC.floor;
  const cal = f.calibrating;
  if(!cal){ return; }
  const th = f.theta;
  const g = floorGuard(th);
  if(!g.ok){ toast(g.why, true); return; }
  if(f.thetaSigma != null && f.thetaSigma > FLOOR_LATCH_SIGMA_DEG){
    toast("The phone is still moving — hold it steady on the floor line for a second.", true);
    return;
  }
  const dM = GEO.ftToM(cal.knownFt);
  const hM = GEO.floorLineHeight(dM, th);
  if(!(hM >= FLOOR_CAL_H_MIN_M && hM <= FLOOR_CAL_H_MAX_M)){
    toast("That solves to " + (isFinite(hM) ? hM.toFixed(2) + " m" : "nothing usable")
      + ", which is not a person holding a phone. Check the distance you typed and that the line is on "
      + "the wall/floor join.", true);
    return;
  }
  /* h = d·tan θ, so σh/h is the quadrature sum of the relative errors of the two
     things that went in: the tape reading, and the angle. The angle term is
     σθ/(sinθ·cosθ) — the same expression that appears in the distance error,
     because it is the same derivative rearranged. */
  const sTh = floorThetaSigma();
  const s = Math.sin(GEO.rad(th)), c = Math.cos(GEO.rad(th));
  const relSigma = arcQuad(CALIB_DIST_SIGMA_FT/cal.knownFt, GEO.rad(sTh)/(s*c));
  floorCalSet({ hM:hM, relSigma:relSigma, thetaDeg:th, thetaSigmaDeg:sTh,
                distFt:cal.knownFt, ts:new Date().toISOString(), device:deviceString() });
  f.calibrating = null;
  f.hold = null; f.samples = [];
  floorResolveHeight();
  toast("Height set: " + hM.toFixed(2) + " m (" + (hM*M_TO_FT).toFixed(2) + " ft), ± "
    + (relSigma*100).toFixed(1) + "%.");
}

/* ---- the status bar (renders into #arDetBar, alongside the detector's) ---- */
function floorBarHtml(){
  const f = ARC.floor;
  const plain = (myRole() === "Merchandiser");
  const rows = [];
  const row = function(cls, msg, btns){
    return '<div class="detrow"><span class="detmsg' + (cls ? " " + cls : "") + '">' + msg + '</span>'
         + (btns || "") + '</div>';
  };
  const a4Btn = '<button class="arbtn pe" data-arc="floorfallback">'
    + (plain ? "Use an A4 sheet instead" : "Fall back to reference scale") + '</button>';

  /* --- calibration in progress: this takes over the bar --- */
  if(f.calibrating){
    const th = f.theta;
    const g = floorGuard(th);
    const hM = g.ok ? GEO.floorLineHeight(GEO.ftToM(f.calibrating.knownFt), th) : NaN;
    const steady = (f.thetaSigma != null && f.thetaSigma <= FLOOR_LATCH_SIGMA_DEG);
    rows.push(row(g.ok ? "" : "warn",
      '<b>Setting your height</b> — stand ' + f.calibrating.knownFt.toFixed(1)
      + ' ft from the wall and put the line exactly where the wall meets the floor.'));
    rows.push(row(g.ok && steady ? "" : "warn",
      g.ok
        ? ('Tilt <b>' + th.toFixed(1) + '°</b> down' + (steady ? ' · steady' : ' · <b>hold still</b>')
           + ' → height <b>' + (isFinite(hM) ? hM.toFixed(2) + ' m' : '—') + '</b>')
        : esc(g.why),
      '<button class="arbtn pe' + (g.ok && steady ? ' on' : '') + '" data-arc="floorcalsave">Save</button>'
      + '<button class="arbtn pe" data-arc="floorcalcancel">Cancel</button>'));
    return rows.join("");
  }

  /* --- the height in force. Shouted about while it is a guess, because that is
         the single term that puts the reading over the 5 % budget; once it is
         measured it lives quietly in the chip strip instead. --- */
  if(f.hSrcKey === "default"){
    rows.push(row("warn",
      '<b>ROUGH</b> — using a standard ' + f.hM.toFixed(2) + ' m ('
      + (f.hM*M_TO_FT).toFixed(1) + ' ft) phone height, not yours. That alone is worth ± '
      + (FLOOR_DEFAULT_H_SIGMA*100).toFixed(0) + '%.',
      '<button class="arbtn pe on" data-arc="askheight">'
        + (plain ? "Tell it my height" : "Set stature") + '</button>'
      + '<button class="arbtn pe" data-arc="floorcal">'
        + (plain ? "Measure exactly" : "Calibrate height") + '</button>'));
  } else if(f.hSrcKey === "stature"){
    rows.push(row("",
      'h <b>' + f.hM.toFixed(2) + ' m</b> derived from stature × ' + HOLD_RATIO.toFixed(3)
      + ' (neck level, as instructed) — ± ' + (f.hRelSigma*100).toFixed(1) + '%.',
      '<button class="arbtn pe" data-arc="floorcal">'
        + (plain ? "Measure exactly" : "Calibrate height") + '</button>'));
  }

  /* --- the live / held distinction, said plainly --- */
  const err = ARC.meas.refError;
  const ePct = err ? (' · ± ' + err.pct.toFixed(1) + '%') : '';
  if(f.state === "live"){
    const shallow = f.theta < FLOOR_SHALLOW_WARN_DEG;
    rows.push(row(shallow ? "warn" : "",
      '<b>LIVE</b> — reading the floor line at ' + f.theta.toFixed(1) + '° down' + ePct
      + (shallow ? ' · shallow angle, the error grows fast here — tilt further down if you can' : '')
      + (plain ? ' · walk until the distance says OK, then raise the phone' : '')));
  } else if(f.state === "held"){
    const age = (ARC.meas.heldMs || 0)/1000;
    rows.push(row(f.warn ? "warn" : "",
      '<b>HELD</b> — this is not live. Measured <b>' + age.toFixed(0) + ' s ago</b> at '
      + f.hold.theta.toFixed(1) + '° down' + ePct
      + (f.warn ? ' · ' + esc(f.warn) : (f.motion.seen ? ' · you have not moved since' : '')),
      '<button class="arbtn pe" data-arc="floorremeasure">Measure again</button>'));
  } else {
    rows.push(row("warn", '<b>No distance</b> — ' + esc(ARC.meas.distSrc || f.why || ""),
      f.state === "nosensor" ? '<button class="arbtn pe" data-arc="sensors">Enable motion sensors</button>' : ""));
  }

  /* --- squareness: the one gate this method genuinely cannot see --- */
  if(ARC.meas.distFt != null && !ARC.assumeSquare){
    rows.push(row("warn",
      plain
        ? '<b>Last thing</b> — the app cannot tell whether you are facing the wall straight on, because '
          + 'there is nothing on it to look at. Stand square to the wall, then confirm.'
        : '<b>Yaw unmeasurable</b> — a bare wall offers no keystone. Confirm squareness by eye; the '
          + 'capture is recorded with <span class="mono">yaw_verified = false</span>.',
      '<button class="arbtn pe on" data-arc="square">'
        + (plain ? "I'm facing the wall square-on" : "Confirm square by eye") + '</button>'));
  }

  /* --- the honest fallback ---
     Spelled out while nothing is being measured, which is exactly when a hidden
     floor line is the likely cause; reduced to the button once a reading is
     coming, so the bar does not crowd the distance readout on a small screen. */
  const working = (f.state === "live" || f.state === "held");
  rows.push(row("",
    working
      ? (plain ? 'Floor line hidden further along the wall?' : 'Occluded floor line?')
      : (plain
          ? 'Shelving, stock or a plinth along the bottom of the wall? Then the floor line is hidden and '
            + 'this will not work — tape up an A4 sheet instead.'
          : 'If the wall/floor join is occluded (shelving, stock, skirting plinths — common in retail), '
            + 'reference scale from a taped A4 sheet is the fallback.'),
    a4Btn));
  return rows.join("");
}

/* ---- the reticle ---- */
function floorDrawReticle(ctx, cw, ch, g){
  const f = ARC.floor;
  const y = ch/2 + ARC.nudge.y;
  const live = (f.state === "live");
  const held = (f.state === "held");
  const colour = live ? "rgba(45,212,191,.95)" : held ? "rgba(148,163,184,.85)" : "rgba(251,191,36,.9)";
  ctx.save();
  ctx.strokeStyle = colour;
  ctx.lineWidth = live ? 2.5 : 2;
  if(!live) ctx.setLineDash([9,6]);
  ctx.beginPath();
  ctx.moveTo(cw*0.06, y); ctx.lineTo(cw*0.94, y);
  ctx.stroke();
  ctx.setLineDash([]);
  // end ticks, so the line reads as an instrument rather than a scratch
  ctx.beginPath();
  ctx.moveTo(cw*0.06, y-7); ctx.lineTo(cw*0.06, y+7);
  ctx.moveTo(cw*0.94, y-7); ctx.lineTo(cw*0.94, y+7);
  ctx.stroke();
  ctx.font = "800 11px ui-monospace, Menlo, monospace";
  ctx.textAlign = "center";
  ctx.fillStyle = colour;
  const label = (myRole() === "Merchandiser")
    ? (live ? "PUT THIS LINE WHERE THE WALL MEETS THE FLOOR"
            : held ? "HELD — MEASURED A MOMENT AGO" : "TILT DOWN ONTO THE WALL/FLOOR JOIN")
    : ((f.theta == null ? "θ —" : "θ " + f.theta.toFixed(1) + "°")
       + " · " + (live ? "LIVE" : held ? "HELD" : "NO READING"));
  ctx.fillText(label, cw/2, y - 12);
  ctx.restore();
  void g;
}

/* ---- the placement record ---- */
function floorBuildRecord(p){
  const f = ARC.floor, r = ARC.meas.floorReading;
  p.method = "floor-line";
  p.methodLabel = METHOD_META["floor-line"].label;
  p.floorHeightM   = +Number(f.hM).toFixed(3);
  p.floorHeightPct = +(f.hRelSigma*100).toFixed(2);
  p.floorCalibrated = !!f.calibrated;
  /* "device" (tape) / "stature" (profile height × HOLD_RATIO) / "default".
     floorCalibrated stays === (key "device") so every existing reader — the
     review screen's chip, the KPI notes, an already-stored note — keeps meaning
     what it meant before a third source existed. */
  p.floorHeightSrc = f.hSrcKey || (f.calibrated ? "device" : "default");
  p.floorHeightSource = f.hSrc;
  p.floorMotionSeen = !!f.motion.seen;
  if(r){
    p.floorThetaDeg      = +r.theta.toFixed(2);
    p.floorThetaSigmaDeg = +r.thetaSigma.toFixed(2);
    p.errorPct   = +r.err.pct.toFixed(2);
    p.errorTerms = { height:+(r.err.terms.height*100).toFixed(2),
                     pitch: +(r.err.terms.pitch*100).toFixed(2) };
    p.floorHeldS = +((ARC.meas.heldMs || 0)/1000).toFixed(1);
    p.floorLive  = (ARC.meas.heldMs == null);
    /* How many feet the answer moves per degree of aim, AT THE ANGLE USED. This
       is the number that makes a shallow reading obviously worse than a steep
       one, and it is computed, not looked up. */
    p.floorFtPerDeg = +Math.abs(GEO.mToFt(GEO.floorLineDDdTheta(f.hM, r.theta))*GEO.D2R).toFixed(3);
  }
}
/* MOCKUP MODE ONLY, so a verification record is byte-identical to what it was
   before any of this existed. */
function fitBuildRecord(p, g){
  const fit = g && g.fit;
  if(!fit || !isFinite(fit.recommendedFt)) return;
  p.fitRecommendedFt = +fit.recommendedFt.toFixed(2);
  p.fitMinimumFt     = +fit.minimumFt.toFixed(2);
  p.fitRelPct        = +(fit.relSigma*100).toFixed(1);
  p.fitLensEstimated = !!fit.intr.estimated;
  if(fit.view){
    p.visibleWFt = +fit.view.visibleWFt.toFixed(2);
    p.visibleHFt = +fit.view.visibleHFt.toFixed(2);
    p.fitsInView = !!fit.view.fits;
  }
  /* Check (b), and only if it was actually run. Nothing is inferred from (a). */
  const w = ARC.wall && ARC.wall.result;
  if(w){
    p.wallWFt          = +w.widthFt.toFixed(2);
    p.wallHFt          = w.heightFt == null ? null : +w.heightFt.toFixed(2);
    p.fitsOnWall       = !!w.fits;
    p.wallOverflowAck  = !!ARC.wall.ack;
    p.wallDistanceFt   = +w.distanceFt.toFixed(2);
  }
}
function fitNotes(p, notes){
  if(!MOCKUP || p.fitRecommendedFt == null) return;
  if(p.visibleWFt != null)
    notes.push("The frame covered about " + p.visibleWFt.toFixed(1) + " x " + p.visibleHFt.toFixed(1)
      + " ft of wall at this distance, +/- " + p.fitRelPct.toFixed(0) + "% (lens and distance combined"
      + (p.fitLensEstimated ? ", and the lens on this phone was never calibrated" : "") + "). "
      + "The standoff was DERIVED FROM THE POSTER, not from a fixed target: "
      + p.fitRecommendedFt.toFixed(1) + " ft is where a " + p.posterWFt + " x " + p.posterHFt
      + " ft poster fills " + Math.round(FRAME_FILL_TARGET*100) + "% of the frame, and below "
      + p.fitMinimumFt.toFixed(1) + " ft it cannot be drawn complete at all.");
  if(p.fitsOnWall === false)
    notes.push("THE POSTER DOES NOT FIT THE WALL. The merchandiser marked the usable wall as "
      + p.wallWFt.toFixed(1) + " ft wide" + (p.wallHFt ? " and " + p.wallHFt.toFixed(1) + " ft tall" : "")
      + "; the poster is " + p.posterWFt + " x " + p.posterHFt + " ft. "
      + (p.wallOverflowAck
          ? "They were shown the overflow and captured the mockup anyway, so a manager can see it."
          : "The overflow was measured but not acknowledged on the device."));
  else if(p.fitsOnWall === true)
    notes.push("The merchandiser marked the wall's own edges — " + p.wallWFt.toFixed(1) + " ft wide"
      + (p.wallHFt ? " by " + p.wallHFt.toFixed(1) + " ft tall" : "")
      + ", measured from " + Number(p.wallDistanceFt).toFixed(1) + " ft through the same lens — and the poster fits.");
  else
    notes.push("The wall's own EDGES WERE NOT MARKED. Nothing here says the wall is wide enough, only "
      + "that the poster fitted inside the camera frame; a frame can be looking at a narrow pier.");
  notes.push("[fit see=" + Number(p.visibleWFt || 0).toFixed(2) + "x" + Number(p.visibleHFt || 0).toFixed(2)
    + "ft rec=" + p.fitRecommendedFt.toFixed(2) + "ft min=" + p.fitMinimumFt.toFixed(2)
    + "ft err=" + p.fitRelPct.toFixed(1) + "% view=" + (p.fitsInView ? "yes" : "no")
    + " wall=" + (p.wallWFt == null ? "none"
        : p.wallWFt.toFixed(2) + "x" + Number(p.wallHFt || 0).toFixed(2) + "ft")
    + " onwall=" + (p.fitsOnWall == null ? "unknown" : (p.fitsOnWall ? "yes" : "no"))
    + " ack=" + (p.wallOverflowAck ? "yes" : "no") + "]");
}
function floorNotes(p, notes){
  if(p.method !== "floor-line") return;
  notes.push("Distance came from FLOOR-LINE TRIGONOMETRY (d = h / tan θ) — nothing of a known size was in "
    + "frame and nothing was taped to the wall. It assumes the floor is level and the wall vertical.");
  if(p.floorHeightSrc === "stature")
    notes.push("The phone height was DERIVED from the merchandiser's own stated stature (× "
      + HOLD_RATIO.toFixed(3) + ", the neck/shoulder fraction the capture screen instructs them to hold "
      + "at), NOT measured on this device. It is worth ± " + Number(p.floorHeightPct).toFixed(1)
      + "% — better than the stated default and looser than a tape calibration.");
  else if(!p.floorCalibrated)
    notes.push("The phone height was the stated default of " + FLOOR_DEFAULT_H_M.toFixed(2) + " m, NOT measured "
      + "on this device and not derived from anyone's height. That single term is worth ± "
      + (FLOOR_DEFAULT_H_SIGMA*100).toFixed(1) + "% and dominates the error bar above.");
  if(p.floorThetaDeg != null && p.floorThetaDeg < FLOOR_SHALLOW_WARN_DEG)
    notes.push("Aimed only " + p.floorThetaDeg.toFixed(1) + "° below horizontal, near the shallow end of the "
      + "usable band, where the answer moves " + p.floorFtPerDeg + " ft per degree of aim.");
  if(p.floorLive === false)
    notes.push("The distance was measured " + p.floorHeldS + " s BEFORE the shutter fired, with the phone "
      + "aimed down at the floor line, and held while the phone was raised to frame the wall. "
      + (p.floorMotionSeen
          ? "Movement sensing saw no step in between."
          : "This device reported no movement data, so whether the merchandiser walked in between is UNKNOWN."));
  if(p.floorThetaDeg != null)
    notes.push("[floor h=" + p.floorHeightM.toFixed(3) + "m/" + p.floorHeightPct.toFixed(2)
      + "% ang=" + p.floorThetaDeg.toFixed(2) + "deg/" + p.floorThetaSigmaDeg.toFixed(2)
      + "deg err=" + p.errorPct.toFixed(2) + "% (height " + p.errorTerms.height.toFixed(2)
      + " / pitch " + p.errorTerms.pitch.toFixed(2) + ") age=" + p.floorHeldS.toFixed(1)
      + "s cal=" + (p.floorHeightSrc || (p.floorCalibrated ? "device" : "default")) + "]");
}

/* ==========================================================
   POSTER FIT — where to stand, how much wall is in view, and
   whether the artwork can be drawn complete
   ------------------------------------------------------------
   TWO CHECKS THAT ARE NOT THE SAME CHECK, and are deliberately kept apart:

     (a) DOES IT FIT IN VIEW?  Automatic, every frame, no extra step. Poster
         against the frame at the current distance, from the intrinsics alone.
         Failing it is not a failure — it is "move back", and it is the ONLY
         hard block left in mockup mode, because below the minimum the poster
         genuinely cannot be drawn complete.

     (b) DOES IT FIT ON THE WALL?  Optional, on request, and it needs a human.
         The camera cannot see where a wall ENDS: a frame 12 ft across may be
         looking at a 7 ft pier with a doorway either side, and every number in
         (a) is still perfectly true. So the merchandiser drags lines onto the
         edges and THAT is converted through the same intrinsics. Failing it
         raises an alert, and is dismissible: a mockup of a poster that plainly
         overflows the wall is often the most useful thing to send a manager.

   (a) can never answer (b) and (b) is never assumed from (a). A capture that
   passed (a) with (b) never asked records exactly that, in words.
   ========================================================== */

/* A number is only as precise as the error bar under it. Round to a step no
   finer than the 1σ uncertainty, so "12.9 ft" is never printed off a lens the
   app has not measured and a distance worth ± 13 %. */
function roundToSigma(v, sigma){
  if(!isFinite(v)) return NaN;
  const s = isFinite(sigma) ? Math.abs(sigma) : 0;
  const step = (s >= 1) ? 1 : (s >= 0.35 ? 0.5 : 0.1);
  return Math.round(v/step)*step;
}
function fmtRoughFt(v, sigma){
  if(!isFinite(v)) return "—";
  const s = isFinite(sigma) ? Math.abs(sigma) : 0;
  const r = roundToSigma(v, s);
  return (s >= 1) ? r.toFixed(0) : r.toFixed(1);
}
/* How well the DISTANCE is known, straight out of the existing error machinery
   — floor-line writes GEO.floorLineError into ARC.meas.refError, reference
   scaling writes DET.errorEstimate into the same field, and both carry `rel`.
   The XR path has no modelled distance error anywhere in this app, so it
   contributes nothing rather than a number invented here; the focal term below
   still applies to it. */
function arcDistRelSigma(){
  const e = ARC.meas.refError;
  return (e && isFinite(e.rel)) ? e.rel : 0;
}
/* THE CAPTURE FRAME — not the preview, and the difference is not pedantry.

   #arStage renders the camera with object-fit:cover, so the preview is a CROP
   of what the shutter records: on a 9:16 stage showing a 1080×1920 stream the
   two agree, but on any other pairing the preview loses a band off one axis.
   The MOCKUP THE MANAGER RECEIVES is arcComposite's rasterisation of the FULL
   source frame, and the poster overlay is already projected in source pixels
   and mapped across (arcDrawOverlay maps video px → CSS, and a quad may
   legitimately extend past the stage edge). So the frame the fit is decided in
   has to be the one the artwork is finally drawn into; deciding it in the
   cropped preview would send the merchandiser several feet further back than
   the deliverable requires, which is the same species of mistake as the fixed
   6 ft standoff.

   fy = fx. Square pixels, and the whole overlay path takes a single focal
   length (arcPosterGeometry, arcIsoIntr); the one place two focals exist is
   arcComposite's aspect compensation, which is downstream of this. */
function arcViewIntrinsics(){
  if(ARC.tier === "A"){
    const ci = ARC.xr.camIntr, cam = ARC.xr.cam;
    if(ci && ci.fx > 0 && cam && cam.w > 0)
      return { fx:ci.fx, fy:(ci.fy > 0 ? ci.fy : ci.fx), w:cam.w, h:cam.h,
               relSigma:FOCAL_SIGMA_FLOOR, estimated:false,
               src:"XR view projection matrix, rasterised over the raw camera image" };
    if(ARC.xr.focalPx > 0 && ARC.xr.vpW > 0)
      return { fx:ARC.xr.focalPx, fy:ARC.xr.focalPx, w:ARC.xr.vpW, h:ARC.xr.vpH,
               relSigma:FOCAL_SIGMA_FLOOR, estimated:false, src:"XR view projection matrix" };
  } else if(ARC.tier === "B"){
    const m = arcMap();
    const f = (ARC.focal && ARC.focal.f > 0) ? ARC.focal.f : GEO.focalFromFov(m.vw, ASSUMED_HFOV_DEG);
    return { fx:f, fy:f, w:m.vw, h:m.vh,
             relSigma:(ARC.focal && ARC.focal.relSigma > 0) ? ARC.focal.relSigma : FOCAL_SIGMA_ASSUMED,
             estimated:!(ARC.focal && ARC.focal.estimated === false),
             src:(ARC.focal && ARC.focal.src) || ("assumed " + ASSUMED_HFOV_DEG + "° HFOV") };
  }
  /* No camera and no XR — tier C, or a stage that has not started yet. The gate
     still has to answer, so it answers off the stage at the assumed lens. */
  const st = arcEl("arStage");
  const w = st ? st.clientWidth : NOMINAL_FRAME_W, h = st ? st.clientHeight : NOMINAL_FRAME_H;
  const f = GEO.focalFromFov(w, ASSUMED_HFOV_DEG);
  return { fx:f, fy:f, w:w, h:h, relSigma:FOCAL_SIGMA_ASSUMED, estimated:true,
           src:"assumed " + ASSUMED_HFOV_DEG + "° HFOV" };
}
/* A nominal portrait phone at the assumed lens — see NOMINAL_FRAME_W. */
function nominalIntrinsics(){
  const f = GEO.focalFromFov(NOMINAL_FRAME_W, ASSUMED_HFOV_DEG);
  return { fx:f, fy:f, w:NOMINAL_FRAME_W, h:NOMINAL_FRAME_H,
           relSigma:FOCAL_SIGMA_ASSUMED, estimated:true,
           src:"assumed " + ASSUMED_HFOV_DEG + "° HFOV, portrait "
               + NOMINAL_FRAME_W + "×" + NOMINAL_FRAME_H };
}
/* Where the merchandiser is TOLD to stand, before any camera is open.
   VERIFICATION MODE IS UNTOUCHED: there the manager's per-task standoff and
   tolerance are the spec the evidence is measured against, and they win. */
function taskStandoff(t){
  if(!MOCKUP || !t) return { recommendedFt: t ? Number(t.standoffFt) : STANDOFF_FT,
                             minimumFt: null, derived: false, relSigma: 0 };
  const I = nominalIntrinsics();
  const st = GEO.posterStandoff({ widthFt:t.widthFt, heightFt:t.heightFt,
    frameW:I.w, frameH:I.h, fx:I.fx, fy:I.fy, fill:FRAME_FILL_TARGET });
  return { recommendedFt:st.recommendedFt, minimumFt:st.minimumFt,
           limit:st.limit, derived:true, relSigma:I.relSigma };
}
/* The live assessment, against the frame that is actually on screen. Null-safe:
   with no task it returns null, with no reading it still returns the two
   distances (which is what the guidance line needs while they walk). */
function arcFit(distanceFt){
  const t = ARC.task;
  if(!t) return null;
  const I = arcViewIntrinsics();
  if(!(I.fx > 0) || !(I.w > 0) || !(I.h > 0)) return null;
  const st = GEO.posterStandoff({ widthFt:t.widthFt, heightFt:t.heightFt,
    frameW:I.w, frameH:I.h, fx:I.fx, fy:I.fy, fill:FRAME_FILL_TARGET });
  const d = (distanceFt != null && isFinite(distanceFt) && distanceFt > 0) ? distanceFt : null;
  const view = d == null ? null
    : GEO.viewFit({ distanceFt:d, widthFt:t.widthFt, heightFt:t.heightFt,
                    frameW:I.w, frameH:I.h, fx:I.fx, fy:I.fy });
  /* The visible-wall figure inherits BOTH uncertainties — it is d·px/f, so the
     relative error of d and the relative error of f add in quadrature, the same
     way every other error in this file combines. On an uncalibrated phone the
     focal term alone is ± 12 %, which is why the readout says "about" and is
     rounded to a step no finer than its own error bar. */
  const rel = arcQuad(I.relSigma, arcDistRelSigma());
  /* AND THE PREVIEW, which is a CROP of the capture frame (object-fit:cover).
     The gate is decided in the capture frame because that is the mockup the
     manager receives — but between the true minimum and the point where the
     preview catches up, the merchandiser watches the artwork run off both
     edges of a screen that is telling them they are in a good spot. That is
     worth one sentence, and it is the same sentence either way: the fit is not
     in doubt, only which of the two frames they are looking at. */
  const stage = arcEl("arStage");
  const cw = stage ? stage.clientWidth : 0, ch = stage ? stage.clientHeight : 0;
  const fCss = arcDisplayFocalCss();
  const preview = (d != null && cw > 0 && ch > 0 && fCss > 0)
    ? GEO.viewFit({ distanceFt:d, widthFt:t.widthFt, heightFt:t.heightFt,
                    frameW:cw, frameH:ch, fx:fCss, fy:fCss })
    : null;
  return {
    intr: I, recommendedFt: st.recommendedFt, minimumFt: st.minimumFt, limit: st.limit,
    view: view, preview: preview, relSigma: rel,
    seeWSigma: view ? view.visibleWFt*rel : null,
    seeHSigma: view ? view.visibleHFt*rel : null,
    recSigma: st.recommendedFt*I.relSigma
  };
}

/* ---- (b) the wall's own edges ---- */
function arcWallStart(){
  const st = arcEl("arStage");
  const w = st ? st.clientWidth : 360, h = st ? st.clientHeight : 640;
  const W = ARC.wall;
  if(!W.movedX){ W.xL = w*0.18; W.xR = w*0.82; }
  if(!W.movedY){ W.yT = h*0.12; W.yB = h*0.88; }
  W.on = true;
}
function arcWallCancel(){ ARC.wall.on = false; }
/* Which of the four lines a finger is going for. Nearest wins; the verticals
   and the horizontals compete on their own axis, so a tap anywhere sensible
   grabs the line the merchandiser meant. */
function arcWallPick(x, y){
  const w = ARC.wall;
  const c = [ ["L", Math.abs(x - w.xL)], ["R", Math.abs(x - w.xR)],
              ["T", Math.abs(y - w.yT)], ["B", Math.abs(y - w.yB)] ];
  c.sort(function(a, b){ return a[1] - b[1]; });
  return c[0][0];
}
/* Pixel offsets -> real feet, through the same intrinsics the poster is drawn
   with. Returns null until the vertical pair has actually been dragged: two
   lines left at their defaults are not a measurement of anything, and recording
   them as one would be a lie the manager could not detect. */
function arcWallMeasure(){
  const t = ARC.task, w = ARC.wall, g = ARC.lastGates;
  const d = g ? g.distance : null;
  if(!t || !(d > 0) || !w.movedX) return null;
  const I = arcViewIntrinsics();
  /* The marks are CSS pixels on the STAGE, so they are converted with the
     STAGE's focal length and the stage centre — and the answer is the same one
     the capture frame would give, because object-fit:cover scales pixels and
     focal length by the identical factor and (x_b − x_a)/f is invariant under
     it. The principal point maps to the stage centre for the same reason. */
  const st = arcEl("arStage");
  const cw = st ? st.clientWidth : I.w, ch = st ? st.clientHeight : I.h;
  const fCss = arcDisplayFocalCss();
  const sw = GEO.spanFromPixels(d, w.xL, w.xR, cw/2, fCss);
  if(!sw) return null;
  const sh = w.movedY ? GEO.spanFromPixels(d, w.yT, w.yB, ch/2, fCss) : null;
  const heightFt = sh ? sh.ft : null;
  const fitsWidth  = GEO.fitsWithin(t.widthFt, sw.ft);
  const fitsHeight = heightFt == null ? null : GEO.fitsWithin(t.heightFt, heightFt);
  return { widthFt: sw.ft, heightFt: heightFt, distanceFt: d,
           alphaLeftDeg: sw.alphaADeg, alphaRightDeg: sw.alphaBDeg,
           fitsWidth: fitsWidth, fitsHeight: fitsHeight,
           fits: fitsWidth && fitsHeight !== false,
           estimated: !!I.estimated,
           relSigma: arcQuad(I.relSigma, arcDistRelSigma()), ts: Date.now() };
}
function arcWallCheck(){
  const r = arcWallMeasure();
  if(!r){
    toast(ARC.wall.movedX ? "There is no distance right now — measure again first."
                          : "Drag the two lines onto the edges of the wall first.", true);
    return;
  }
  const t = ARC.task;
  ARC.wall.result = r;
  ARC.wall.on = false;
  const n1 = v => Number(v).toFixed(1);
  if(r.fits){
    ARC.wall.ack = false;
    toast("It fits — you marked " + n1(r.widthFt) + " ft of wall"
      + (r.heightFt != null ? " by " + n1(r.heightFt) + " ft" : "")
      + " and the poster is " + t.widthFt + " × " + t.heightFt + " ft.");
    return;
  }
  ARC.wall.ack = false;
  const said = [];
  if(r.fitsWidth === false)
    said.push('This poster is <b class="num">' + t.widthFt + ' ft</b> wide but the wall is only '
      + '<b class="num">' + n1(r.widthFt) + ' ft</b>.');
  if(r.fitsHeight === false)
    said.push('It is <b class="num">' + t.heightFt + ' ft</b> tall and the wall is only '
      + '<b class="num">' + n1(r.heightFt) + ' ft</b>.');
  openModal({
    title: "The poster is bigger than this wall",
    body: '<p>' + said.join(" ") + '</p>'
      + '<p>Worked out from ' + n1(r.distanceFt) + ' ft away, off the lines you put on the wall edges'
      + (r.estimated ? ' and a lens this phone has never had measured — so treat it as approximate' : '')
      + '.</p>'
      + '<p>You can still take the mockup. It is usually the clearest way to show your manager '
      + 'that the artwork does not fit here.</p>',
    actions: [
      { label:"Mock it up anyway", cls:"btn primary", act:function(){
          ARC.wall.ack = true; closeModal();
          toast("Recorded — the mockup will say the poster overflows this wall.", true); } },
      { label:"Mark the wall again", cls:"btn", act:function(){ closeModal(); arcWallStart(); } }
    ]
  });
}

/* gate evaluation — one place, used by the HUD, the shutter and the record */
function arcGates(){
  const t = ARC.task, s = ARC.sensors;
  const tol = t.standoffTolFt, atol = t.angleTolDeg;
  const d = ARC.meas.distFt;
  // Tier A prefers its own measurements: pitch from the wall plane normal (which
  // is wall-relative, not gravity-relative), roll from the gravity-aligned XR
  // viewer pose. Tier B/C fall back to the device attitude sensors.
  let pitch = (ARC.tier === "A" && ARC.meas.xrPitchDeg != null) ? ARC.meas.xrPitchDeg : s.pitchDeg;
  let roll   = (ARC.tier === "A" && ARC.meas.xrRollDeg  != null) ? ARC.meas.xrRollDeg  : s.rollDeg;
  let assumed = false;
  if(ARC.assumeLevel && (pitch == null || roll == null)){
    if(pitch == null) pitch = 0;
    if(roll  == null) roll  = 0;
    assumed = true;
  }
  /* Squareness. A reference rectangle recovers yaw from its keystone and the XR
     path gets it from the wall plane; floor-line trigonometry measures distance
     and NOTHING else, and a bare wall offers no keystone to read, so on that
     path yaw is genuinely unmeasurable rather than merely absent. This is the
     exact shape of the assume-level override that already exists for a phone
     with no attitude sensor: the merchandiser states it, the gate accepts the
     stated value, and the record says it was stated and not measured
     (yaw_verified stays false, and the note says so in words). */
  let yaw = ARC.meas.yawVerified ? ARC.meas.yawDeg : null;
  let yawAssumed = false;
  if(ARC.assumeSquare && yaw == null){ yaw = 0; yawAssumed = true; }
  /* THE STANDOFF GATE — the one thing mockup mode changes about it.

     VERIFICATION is untouched: the capture is evidence measured against the
     manager's spec, so it still has to be taken from t.standoffFt ± tol, and
     both fields still come from the task.

     MOCKUP replaces that band with the only question the mode can actually ask:
     can the artwork be drawn complete from here? Any distance at or beyond the
     minimum passes — the merchandiser stands where the wall lets them stand —
     and the block below the minimum is not a policy, it is arithmetic. `fit` is
     computed in both modes because the visible-wall readout is honest
     information either way; only the gate is mode-dependent. */
  const fit = arcFit(d);
  const g = {
    distance: d, delta: (d==null?null:d - t.standoffFt),
    fit: fit,
    pitch: pitch, roll: roll, yaw: yaw, yawAssumed: yawAssumed,
    distOk: MOCKUP ? !!(d != null && fit && fit.view && fit.view.fits)
                   : (d != null && Math.abs(d - t.standoffFt) <= tol),
    pitchOk: pitch != null && Math.abs(pitch) <= atol,
    rollOk:  roll  != null && Math.abs(roll)  <= atol,
    yawOk:   yaw   != null && Math.abs(yaw)   <= atol,
    yawVerified: ARC.meas.yawVerified,
    attitudeAssumed: assumed,
    sensorsOn: s.on
  };
  g.all = g.distOk && g.pitchOk && g.rollOk && g.yawOk;
  return g;
}
/* Focal length of the LIVE overlay, in CSS pixels — lets the poster nudge be
   stored as an angle so it survives the switch to the capture frame. */
function arcDisplayFocalCss(){
  const st = arcEl("arStage");
  const cw = st ? st.clientWidth : 360;
  if(ARC.tier === "A"){
    const f = ARC.xr.focalPx || GEO.focalFromFov(cw, ASSUMED_HFOV_DEG);
    return f * (ARC.xr.vpW ? (cw/ARC.xr.vpW) : 1);
  }
  if(ARC.tier === "B" && ARC.focal.f) return ARC.focal.f * arcMap().s;
  return GEO.focalFromFov(cw, ASSUMED_HFOV_DEG);
}
