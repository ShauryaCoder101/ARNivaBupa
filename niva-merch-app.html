/* ============================================================================
   THE FIELD SEQUENCE — the merchandiser's task detail.
   ----------------------------------------------------------------------------
   The old screen was one long scroll that showed every field at once: store
   record, capture brief with standoff tolerances, BEFORE reference, check-in
   block, upload block, remarks, submitted images and the full audit trail —
   roughly nine cards deep on a 375px phone. A merchandiser has exactly one
   question at a time, so this is four screens with one decision on each:

       You're here  ->  Check in  ->  Photo  ->  Submit

   Everything that matters only sometimes — the manager's written instructions,
   the poster dimensions, what has happened so far — is behind a disclosure.
   Nothing about capture internals is shown at all; the measurement is still
   taken and still recorded, it is simply not this person's problem.
   ============================================================================ */
const FIELD_STEPS = [
  { k:"here",  label:"Job"      },
  { k:"check", label:"Check in" },
  { k:"shoot", label:byMode("Mockup","Photo") },
  { k:"send",  label:byMode("Send","Submit")  }
];
/* Which step the user has clicked to, per task. Session-only and deliberately
   NOT persisted: it is a scroll position, not a fact about the work. The
   signature drops the override the moment the underlying work moves on, so
   finishing a step advances the sequence by itself. */
const fieldStep = {};

/* The signature is deliberately COARSE: only a real lifecycle move (a status
   change, a check-in, a submission starting) invalidates where the user is
   standing. Adding or removing a photo must not: someone who has just taken
   one shot is usually about to take another, and being thrown onto a different
   screen mid-task is exactly the kind of thing that made the old build feel
   complicated. */
function fieldStepSig(t){
  return [t.status, t.checkIn?1:0, t.submitting?1:0].join("|");
}
function fieldDone(t){
  const w = ws(t.id);
  const open = (t.status === S.ASSIGNED || t.status === S.REWORK);
  return {
    here:  true,
    check: !open,
    shoot: !open && (w.after.length > 0 || t.afterImages.length > 0),
    send:  [S.SUBMITTED, S.APPROVED, S.CLOSED].indexOf(t.status) >= 0
  };
}
function fieldStepEnabled(t, i){
  const done = fieldDone(t);
  for(let j = 0; j < i; j++){ if(!done[FIELD_STEPS[j].k]) return false; }
  return true;
}
function fieldStepIndex(t){
  const rec = fieldStep[t.id];
  if(rec && rec.sig === fieldStepSig(t) && fieldStepEnabled(t, rec.step)) return rec.step;
  delete fieldStep[t.id];
  /* A job that has not been started yet opens on "You're here": confirming the
     shop and seeing what goes up is the first decision, before check-in.
     A job sent back for a fix opens there too, so the reason is read first.
     Once the visit is under way, land on whatever is still outstanding. */
  let derived = FIELD_STEPS.length - 1;
  if(t.status === S.ASSIGNED || t.status === S.REWORK){
    derived = 0;
  }else{
    const done = fieldDone(t);
    for(let i = 0; i < FIELD_STEPS.length; i++){
      if(!done[FIELD_STEPS[i].k]){ derived = i; break; }
    }
  }
  /* Remember it, so the sequence holds still until the work actually moves. */
  fieldStep[t.id] = { step: derived, sig: fieldStepSig(t) };
  return derived;
}
function fieldRail(t, cur){
  const done = fieldDone(t);
  return '<div class="seqrail">' + FIELD_STEPS.map(function(s, i){
    const on   = (i === cur);
    const fin  = done[s.k] && !on;
    const open = fieldStepEnabled(t, i);
    return '<button class="sq'+(on?" on":"")+(fin?" done":"")+'"'
      + (open ? '' : ' disabled')
      + ' data-act="fstep" data-id="'+t.id+'" data-s="'+i+'"'
      + ' aria-label="Step '+(i+1)+', '+esc(s.label)+'">'
      + '<i>'+(fin ? icon("check") : (i+1))+'</i><span>'+esc(s.label)+'</span></button>';
  }).join("") + '</div>';
}
/* Honest about what is still sitting on this phone, in words that do not
   assume you know what an outbox is. */
function fieldSyncBanner(t){
  const s = taskSync(t);
  if(!s) return "";
  const detail = s.kind === "failed"
    ? "The server refused part of this job. Nothing is lost — show this to your manager."
    : s.kind === "submitting"
      ? "Your photos are still going up from this phone. You can close the app; it carries on by itself."
      : "Some of your work is still on this phone. It will send itself as soon as you have signal.";
  return '<div class="readonly-note"'
    + (s.kind === "failed" ? ' style="background:var(--st-rework-bg);color:var(--st-rework)"' : '')
    + '><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
    + '<b>'+esc(s.label)+'</b>'
    + '<span style="flex:1;min-width:170px">'+esc(detail)+'</span>'
    + '<button class="btn sm" data-act="syncpanel">Details</button></div></div>';
}
function fieldReworkBanner(t){
  if(t.status !== S.REWORK || !t.reviewRemarks) return "";
  return '<div class="banner"><div class="bt">'
    + byMode("That wall was not suitable","Sent back — please fix")+'</div>'
    + '<div class="bb">'+esc(t.reviewRemarks)+'</div>'
    + '<div class="bb" style="color:var(--text-2);font-size:12.5px;margin-top:5px">'
    +   'From '+esc(userById(t.managerId).name)+'</div></div>';
}
/* The history, stripped of the machine detail. The full audit trail with GPS,
   device strings and per-event detail is still written and still shown on the
   manager's screen; the field gets "who did what, when". */
function fieldHistory(t){
  const evs = t.audit.slice().sort(function(a,b){ return new Date(a.ts) - new Date(b.ts); });
  if(!evs.length) return '<div class="dbd">Nothing yet.</div>';
  return '<div class="dbd"><div class="tl">' + evs.map(function(a, i){
      const unsent = !!(a.pending && Outbox.has(a.opId));
      return '<div class="ev '+(i === evs.length-1 ? "hi" : "")+'">'
        + '<div class="a">'+esc(auditActionLabel(a.action))
        + (unsent ? ' <span class="chip queued" style="font-size:10.5px;padding:1px 7px">still on this phone</span>' : '')
        + '</div>'
        + '<div class="m">'+esc(a.actor)+' · '+esc(fmtDT(a.ts))+'</div>'
        + '</div>';
    }).join("") + '</div></div>';
}
/* Instructions, dimensions and history: needed sometimes, not every time. */
function fieldExtras(t){
  const so = taskStandoff(t);
  const stand = Number(so.recommendedFt);
  const paces = isFinite(stand) ? Math.max(1, Math.round(stand / 2.5)) : 3;
  let h = '';
  if(t.instructions){
    h += '<details class="disc"><summary>'+icon("info")+'What your manager asked for</summary>'
      + '<div class="dbd">'+esc(t.instructions)+'</div></details>';
  }
  h += '<details class="disc"><summary>'+icon("poster")+'Size, and where to stand</summary>'
    + '<div class="dbd">'
    + byMode('The poster is <b class="num">'+t.widthFt+' ft × '+t.heightFt+' ft</b>. You are looking for an '
             + 'empty wall big enough to hold it — the sort of spot a '+esc(t.displayType).toLowerCase()
             + ' would go.<br><br>',
             'The poster is <b class="num">'+t.widthFt+' ft × '+t.heightFt+' ft</b>, going on the '
             + esc(t.displayType)+'.<br><br>')
    + 'When you take the photo, stand about <b class="num">'+(isFinite(stand)?stand.toFixed(0):"8")+' feet</b> back '
    + '(roughly '+paces+' big steps) and hold the phone straight. '
    + (so.derived && isFinite(so.minimumFt)
        ? 'That is worked out from the size of this poster — further back is fine, but closer than about '
          + '<b class="num">'+fmtRoughFt(so.minimumFt, so.minimumFt*so.relSigma)+' feet</b> and it will not '
          + 'fit in the picture at all. '
        : '')
    + 'The camera screen tells you when you are '
    + 'in the right spot — you do not need to measure anything yourself.'
    + '</div></details>';
  h += '<details class="disc"><summary>'+icon("clock")+'What has happened so far</summary>'
    + fieldHistory(t) + '</details>';
  return h;

    + '<div class="err">'+byMode("You need at least one mockup before you can send this.",

  body += '<div class="field" id="f_remarks"><label class="fl" for="m_remarks">'

function bindTaskDetail(t){
  const rem = $("#m_remarks");
  if(rem) rem.addEventListener("input", function(){ ws(t.id).remarks = rem.value; });
  const af = $("#afterFile");
  if(af) af.addEventListener("change", function(){
    const files = Array.prototype.slice.call(af.files||[]);
    if(!files.length) return;
    let pending = files.length;
    files.forEach(function(f){
      const rd = new FileReader();
      rd.onload = function(){
        ws(t.id).after.push(makeAfterMeta(t, rd.result));
        if(--pending === 0){ render(); toast(files.length+" image"+(files.length>1?"s":"")+" attached."); }
      };
      rd.onerror = function(){ if(--pending===0) render(); toast("Could not read a file.", true); };
      rd.readAsDataURL(f);
    });
  });

/* Stage a capture ON THIS DEVICE.

   The JPEG goes straight into the durable local blob store, keyed by the exact
   Storage path it will eventually occupy. That one decision is what makes the
   whole offline story work with no change to any view: `resolveImg()` finds the
   local bytes and renders them now, and the moment the outbox uploads the
   object and drops the local copy, the same call starts returning a signed URL
   instead. The path itself carries a fresh UUID per capture, which is required
   by 0003_storage.sql (the evidence bucket has NO update policy, so upsert is
   impossible) and is also what makes a retried upload idempotent.

   Nothing is sent to the server here. An after-image exists server-side only
   once the task is actually submitted. */
function makeAfterMeta(t, src, extra){
  const g = (t.checkIn) || ws(t.id).geo || {lat:t.lat, lng:t.lng};
  const path = "tasks/" + t.id + "/after/" + uuid4() + ".jpg";
  const meta = Object.assign({
    id: uuid4(), kind: "after", bucket: "evidence",
    path: path, src: "sb:evidence:" + path,
    cleanPath: null, cleanSrc: null,
    ts: new Date().toISOString(), lat: g.lat, lng: g.lng,
    by: me().id, device: deviceString(),
    placement: null, placementId: null, guided: false, local: true,
    fb: "gen:" + t.storeCode + ":AFTER:" + ((t.afterImages.length + ws(t.id).after.length) % 3)
  }, extra || {});
  Blobs.put("evidence/" + meta.path, src);
  if(meta.cleanData){
    meta.cleanPath = "tasks/" + t.id + "/clean/" + uuid4() + ".jpg";
    meta.cleanSrc  = "sb:evidence:" + meta.cleanPath;
    Blobs.put("evidence/" + meta.cleanPath, meta.cleanData);
    delete meta.cleanData;
  }
  /* The measurement gets its id here too, so the task_images row can point at
     the placement row before either has left the device. */
  if(meta.placement && !meta.placementId){
    meta.placementId = meta.placement.id || uuid4();
    meta.placement.id = meta.placementId;
  }
  save();
  return meta;
}
/* Best = highest verification tier, passing beats failing. */
function bestPlacement(images){
  let best = null;
  (images||[]).forEach(function(im){
    const p = im && im.placement; if(!p) return;
    if(!best) { best = p; return; }
    const a = tierMeta(p.tier).rank*2 + (p.pass?1:0);
    const b = tierMeta(best.tier).rank*2 + (best.pass?1:0);
    if(a > b) best = p;
  });
  return best;
}

/* ---------- check-in flow ---------- */
function doCheckIn(id){
  const t = taskById(id); if(!t) return;
  const w = ws(id);
  w.busy = true; render();
  let settled = false;
  const finish = function(res){
    if(settled) return; settled = true;
    w.busy = false; w.geo = res; render();
    if(res.error) toast(res.error, true);
    else if(res.distance > GEOFENCE_M) toast("Outside geofence — "+Math.round(res.distance)+" m from store.", true);
    else toast("Inside geofence — "+Math.round(res.distance)+" m from store.");
  };
  const bail = setTimeout(function(){
    finish({ error:"GPS timed out. Use “Simulate arriving at store” to continue the demo." });
  }, 6500);

  if(!navigator.geolocation){
    clearTimeout(bail);
    finish({ error:"This browser exposes no geolocation API. Use the simulated option." });
    return;
  }
  navigator.geolocation.getCurrentPosition(function(pos){
    clearTimeout(bail);
    const la = pos.coords.latitude, ln = pos.coords.longitude;
    finish({ lat:+la.toFixed(5), lng:+ln.toFixed(5), accuracy: pos.coords.accuracy || 20,
             distance: haversine(la,ln,t.lat,t.lng), source:"device", ts:new Date().toISOString() });
  }, function(err){
    clearTimeout(bail);
    // Denial / unavailable / file:// origin → simulated coordinate jittered near the store
    const sim = simCoord(t, 30 + Math.random()*90);
    finish({ lat:sim.lat, lng:sim.lng, accuracy:sim.accuracy, distance:sim.distance,
             source:"simulated", ts:new Date().toISOString(),
             note:"Device GPS unavailable ("+(err && err.message ? err.message : "denied")+") — simulated position used." });
  }, { enableHighAccuracy:true, timeout:6000, maximumAge:0 });
}
function simCoord(t, metres){
  const brg = Math.random()*Math.PI*2;
  const dLat = (metres*Math.cos(brg))/111320;
  const dLng = (metres*Math.sin(brg))/(111320*Math.cos(t.lat*Math.PI/180));
  const la = +(t.lat+dLat).toFixed(5), ln = +(t.lng+dLng).toFixed(5);
  return { lat:la, lng:ln, accuracy: Math.round(6+Math.random()*18), distance: haversine(la,ln,t.lat,t.lng) };
}
function doSimCheckIn(id){
  const t = taskById(id); if(!t) return;
  const sim = simCoord(t, 8 + Math.random()*55);
  ws(id).geo = { lat:sim.lat, lng:sim.lng, accuracy:sim.accuracy, distance:sim.distance,
                 source:"simulated", ts:new Date().toISOString() };
  ws(id).busy = false;
  render();
  toast("Simulated arrival — "+Math.round(sim.distance)+" m from store.");
}
function doStartWork(id){
  const t = taskById(id); if(!t) return;
  const w = ws(id);
  const fence = t.geofenceM || GEOFENCE_M;
  if(!w.geo || w.geo.error || w.geo.distance > fence){
    toast("Check in inside the "+fence+" m geofence first.", true); return;
  }
  t.checkIn = {
    ts:new Date().toISOString(), lat:w.geo.lat, lng:w.geo.lng,
    distance: Math.round(w.geo.distance), pass:true,
    accuracy: Math.round(w.geo.accuracy), device: deviceString(), source: w.geo.source
  };
  /* niva_tasks_transition_guard refuses Assigned -> In Progress unless a
     PASSING check-in is written in the SAME patch, so the fix travels with the
     status change rather than as a separate write that could drain first. */
  const group = uuid4();
  audit(t, "Checked in at store", "Geofence PASS · "+t.checkIn.distance+" m from store coordinates ("+w.geo.source+")",
        {lat:w.geo.lat, lng:w.geo.lng}, group);
  if(!transition(t, S.PROGRESS, {
      group: group,
      patch: {
        checkin_at: t.checkIn.ts, checkin_lat: t.checkIn.lat, checkin_lng: t.checkIn.lng,
        checkin_distance_m: t.checkIn.distance, checkin_accuracy_m: t.checkIn.accuracy,
        checkin_pass: true, checkin_device: t.checkIn.device, checkin_source: t.checkIn.source
      },
      localFields: { checkIn: t.checkIn },
      action:"Execution started", detail:"Status moved to In Progress" })) return;
  save(); render();
  toast(Outbox.pending() > 0
    ? byMode("Checked in. Marked on site on this phone — it syncs when there is a connection.",
             "Checked in. Task is In Progress locally — the check-in will sync when there is a connection.")
    : byMode("Checked in. You are marked on site.","Checked in. Task is now In Progress."));
}
function doSimAfter(id){
  const t = taskById(id); if(!t) return;
  const w = ws(id);
  const idx = w.after.length + t.afterImages.length;
  simulateCapture(t.storeCode, "AFTER", idx % 3, fmtDT(new Date().toISOString())).then(function(url){
    w.after.push(makeAfterMeta(t, url));
    save(); render(); toast("Simulated capture added (held on this device until you submit).");
  });
}
/* SUBMISSION — the one place the app is deliberately NOT optimistic.

   The task stays In Progress, with a visible "queued" badge, until every byte
   of evidence has actually landed in Storage and the server has accepted the
   status change. Showing "Submitted" the instant the button is pressed would
   be a lie in exactly the situation this app exists for: a merchandiser in a
   basement with no signal, who then walks out believing the job is filed.

   ORDER IS LOAD-BEARING. The evidence policies in 0002_rls.sql and
   0003_storage.sql both require the task to still be OPEN (In Progress /
   Rework Required) for the caller. So the group is:
       bytes -> placements -> task_images rows -> status patch -> notifications
   If any step fails permanently the whole group is cancelled together, the
   task stays In Progress and the captures stay on the device — never a task
   marked Submitted with half its evidence missing. */
function doSubmitExec(id){
  const t = taskById(id); if(!t) return;
  const w = ws(id);
  const rem = $("#m_remarks"); if(rem) w.remarks = rem.value;
  if(t.submitting){ toast("This submission is already queued — it will finish on its own.", true); return; }
  let bad = 0;
  const fa = $("#f_after"), fr = $("#f_remarks");
  if(!w.after.length){ if(fa) fa.classList.add("bad"); bad++; } else if(fa) fa.classList.remove("bad");
  if(!w.remarks.trim()){ if(fr) fr.classList.add("bad"); bad++; } else if(fr) fr.classList.remove("bad");
  if(bad){ toast(byMode("Add at least one mockup and a short note.",
                        "Add at least one after image and your remarks."), true); return; }

  const group   = uuid4();
  const remarks = w.remarks.trim();
  const g  = t.checkIn ? {lat:t.checkIn.lat, lng:t.checkIn.lng} : null;
  const pl = bestPlacement(w.after.concat(t.afterImages));
  const plNote = pl
    ? " · placement " + (pl.pass ? "VERIFIED" : "NOT VERIFIED") + " (" + pl.tierLabel + ", "
      + Number(pl.distanceFt).toFixed(2) + " ft)"
    : " · placement UNVERIFIED (no guided capture)";

  let bytes = 0;
  w.after.forEach(function(im){
    Outbox.push("image.upload", { bucket:"evidence", path:im.path, contentType:"image/jpeg" },
      { group:group, taskId:t.id, blobKey:"evidence/"+im.path, label:"Upload evidence photo" });
    bytes++;
    if(im.cleanPath){
      Outbox.push("image.upload", { bucket:"evidence", path:im.cleanPath, contentType:"image/jpeg" },
        { group:group, taskId:t.id, blobKey:"evidence/"+im.cleanPath, label:"Upload un-stamped frame" });
      bytes++;
    }
  });
  w.after.forEach(function(im){
    if(im.placement && im.placementId){
      Outbox.push("placement.insert", { row: placementRow(im.placement, t.id, im.placementId) },
        { group:group, taskId:t.id, label:"Record placement measurement" });
    }
  });
  w.after.forEach(function(im){
    Outbox.push("image.insert", { row: imageRow(im, t.id) },
      { group:group, taskId:t.id, label:"Attach evidence photo" });
  });

  t.merchRemarks = remarks;
  t.submitting = { group:group, images:w.after.length, bytes:bytes, at:new Date().toISOString() };

  if(!transition(t, S.SUBMITTED, {
    group: group,
    optimistic: false,                       // status flips only on server confirmation
    patch: { merch_remarks: remarks },
    action:"Execution submitted",
    detail: w.after.length+" after image"+(w.after.length>1?"s":"")+" uploaded by "+me().name
            +" · device "+deviceString()+" · "+new Date().toISOString()+plNote,
    gps: g
  })){ t.submitting = null; return; }

  notify("Task Submitted","Manager", t.managerId, t.id,
    t.storeName+" ("+t.storeCode+") submitted by "+me().name, group);
  notify("Approval Required","Manager", t.managerId, t.id,
    "Approval required for "+t.storeName+" · "+t.displayType, group);
  save(); render();
  toast(netUp()
    ? "Submitting — uploading " + bytes + " image" + (bytes===1?"":"s") + "…"
    : "No connection. Submission is queued on this device and will upload automatically.");
}
function doRemoveAfter(id, i){
  const t = taskById(id);
  /* Defence in depth: the UI hides this button during a submission, but the
     bytes behind it are already queued for upload, and deleting them would
     turn a recoverable retry into a permanent failure. */
  if(t && t.submitting){
    toast("This photo is already being uploaded and can no longer be removed.", true);
    return;
  }
  const w = ws(id);
  const im = w.after[i];
  if(im){
    if(im.path)      Blobs.del("evidence/" + im.path);
    if(im.cleanPath) Blobs.del("evidence/" + im.cleanPath);
  }
  w.after.splice(i,1); save(); render();
}
function doAssign(id){
  const t = taskById(id); if(!t) return;
  if(!MOCKUP && !t.beforeImage){ toast("Attach a BEFORE image before assigning.", true); return; }
  if(!t.assigneeId){ toast("This task has no merchandiser assigned. The server refuses to let a task leave Draft without one.", true); return; }
  const group = uuid4();
  if(!transition(t, S.ASSIGNED, {
    group: group,
    action:"Task assigned",
    detail:"Assigned to "+userById(t.assigneeId).name+" · execution "+fmtD(t.execDate)
  })) return;
  notify("Task Assigned","Merchandiser", t.assigneeId, t.id,
    t.storeName+" · "+t.displayType+" · due "+fmtD(t.execDate), group);
  save(); render(); toast("Assigned to "+userById(t.assigneeId).name+".");
}

/* ==========================================================
   13b. Guided poster capture (AR layer)
   ------------------------------------------------------------
   Tier A  WebXR immersive-ar + hit-test  -> genuinely measured
   Tier B  getUserMedia + known-width reference -> scaled (or estimated)
   Tier C  no camera / insecure context   -> manual entry, recorded unverified
   The layer lives outside render(); render() never touches #arlayer.
   ========================================================== */
const ARC = {

       depth:false, anchors:false, camAccess:false, focalPx:null, vpW:0, vpH:0,
       binding:null, readFB:null, blit:null, pixelBuf:null, pendingShot:null,
       cam:null, camIntr:null, requested:[], enabled:[] },
  diag:null,
  sensors:{ on:false, src:"none", pitchDeg:null, rollDeg:null, alpha:null, beta:null, gamma:null,
            onOri:null, onMot:null },
  focal:{ f:null, src:"—", estimated:true, relSigma:FOCAL_SIGMA_ASSUMED },
  refPreset:"a4", refCustomMm:0, refWmm:210, refHmm:0, refPhase:"after",
  /* Automatic reference detection. Everything measured about the detector lives
     here so the diagnostics panel can read it without reaching into the loop. */
  det:{ on:false, cls:"mid", step:0, work:640, fps:8,
        canvas:null, ctx:null, ws:null, workW:0, workH:0, scale:1,
        quad:null, cand:null, conf:0, stable:0, locked:false, offered:false,
        wMm:0, hMm:0, flipped:false, cornerSigmaPx:null, support:0, rms:null,
        radial:0, err:null, seenAt:0, note:"",
        nextAt:0, lastMs:0, meanMs:0, maxMs:0, passes:0, hits:0,
        overruns:0, degraded:0, degradeNote:"", bench:null },
  /* Floor-line trigonometry. Everything the method knows lives here so the HUD,
     the record builder and the diagnostics panel can read it without any of
     them reaching into the sampling loop. */
  floor:{ on:false, hM:null, hRelSigma:null, hSrc:"", hSrcKey:"default", calibrated:false,
          samples:[], theta:null, thetaSigma:null, thetaRaw:null,
          live:null, hold:null, state:"none", why:"", warn:"",
          calibrating:null,
          /* the two-step field flow: "measure" (line on the floor join) then
             "frame" (phone up, poster drawn). Only the merchandiser UI uses it;
             the manager HUD is unchanged and ignores it. */
          step:"measure",
          motion:{ on:false, onMot:null, seen:false, since:0, steps:0,
                   peak:0, stir:0, lastPeakAt:0 } },
  assumeSquare:false,
  /* OPTIONAL, AND NEVER A STEP. Distance and lens say how much wall is in

  wall:{ on:false, xL:0, xR:0, yT:0, yB:0, movedX:false, movedY:false,

  handles:[], quad:[],
  meas:{ distFt:null, yawDeg:null, yawVerified:false, distSrc:"", depthUsed:false, wallSeen:false },
  nudge:{x:0,y:0}, armT0:0, armed:false, posterImg:null, panel:null, busy:false,
  assumeLevel:false, pendingCalib:false, lastGates:null, capture:null

/* ---------- tiny helpers ---------- */
function arcEl(id){ return document.getElementById(id); }
function arcLoadImage(src){
  return new Promise(function(res, rej){
    if(!src){ rej(new Error("no artwork")); return; }
    const im = new Image();
    im.onload = function(){ res(im); };
    im.onerror = function(){ rej(new Error("artwork could not be decoded")); };
    im.src = resolveImg(src);
  });
}
function arcCalibKey(){
  const v = ARC.video;
  const res = (v && v.videoWidth) ? (v.videoWidth+"x"+v.videoHeight) : "unknown";
  return deviceString() + "|" + res;
}
function arcCalibAll(){
  try{ return JSON.parse(localStorage.getItem(CALIB_KEY) || "{}") || {}; }catch(e){ return {}; }
}
/* Exact match on device+resolution first. Failing that, ANY record for this
   device is still usable: arcResolveFocal() rescales f by the width ratio, and
   a focal length in pixels is linear in raster width. This matters now that the
   capture path caps getUserMedia resolution on weak hardware — without the
   fallback, capping the camera would silently throw away a calibration the
   merchandiser had already done and drop them back to the estimated tier. */
function arcCalibGet(){
  const all = arcCalibAll();
  const exact = all[arcCalibKey()];
  if(exact) return exact;
  const dev = deviceString() + "|";
  let best = null;
  Object.keys(all).forEach(function(k){
    if(k.indexOf(dev) !== 0) return;
    const r = all[k];
    if(!r || !(r.f > 0)) return;
    if(!best || String(r.ts) > String(best.ts)) best = r;
  });
  if(best) return Object.assign({}, best, { rescaled:true });
  return null;
}
function arcCalibSet(rec){
  try{
    const all = arcCalibAll();
    all[arcCalibKey()] = rec;
    localStorage.setItem(CALIB_KEY, JSON.stringify(all));
  }catch(e){ toast("Could not persist the calibration (storage unavailable).", true); }
}
/* Focal length in pixels, best source first. */
function arcResolveFocal(){
  const v = ARC.video;
  const vw = (v && v.videoWidth) ? v.videoWidth : 1280;
  try{
    const tr = ARC.stream && ARC.stream.getVideoTracks && ARC.stream.getVideoTracks()[0];
    if(tr){
      const st = tr.getSettings ? (tr.getSettings() || {}) : {};
      const cp = tr.getCapabilities ? (tr.getCapabilities() || {}) : {};
      // None of these are standardised; read them defensively where a UA offers them.
      const fov = st.fieldOfView || cp.fieldOfView || st.horizontalFieldOfView || cp.horizontalFieldOfView;
      const fovN = (fov && typeof fov === "object") ? fov.max : fov;
      if(fovN && fovN > 20 && fovN < 160){
        return { f: GEO.focalFromFov(vw, fovN),
                 src:"MediaStreamTrack field of view ("+Number(fovN).toFixed(0)+"°)",
                 estimated:false, relSigma: arcQuad(FOCAL_SIGMA_TRACK, FOCAL_SIGMA_FLOOR) };
      }
      if(st.focalLengthX && st.focalLengthX > 50){
        return { f: st.focalLengthX, src:"MediaStreamTrack focalLengthX",
                 estimated:false, relSigma: arcQuad(FOCAL_SIGMA_TRACK, FOCAL_SIGMA_FLOOR) };
      }
    }
  }catch(e){ /* capability probing is best-effort */ }
  const c = arcCalibGet();
  if(c && c.f > 0){
    const scaled = c.f * (vw / (c.vw || vw));
    /* A calibration knows how good it is: it was solved from a tape measure and
       two dragged handles, and both of those uncertainties were recorded when
       it was saved. Records written before that existed fall back to a
       deliberately pessimistic 2.5 %. */
    const sig = (c.relSigma > 0) ? c.relSigma : 0.025;
    return { f: scaled,
             src:"device calibration ("+c.refLabel+", "+fmtD(c.ts)+")"
                 + (c.rescaled ? ", rescaled from "+c.vw+"px" : ""),
             estimated:false, relSigma: arcQuad(sig, FOCAL_SIGMA_FLOOR) };
  }
  return { f: GEO.focalFromFov(vw, ASSUMED_HFOV_DEG),
           src:"assumed "+ASSUMED_HFOV_DEG+"° HFOV (estimated)", estimated:true,
           relSigma: FOCAL_SIGMA_ASSUMED };
}
/* quadrature sum — the only way independent relative errors ever combine here */
function arcQuad(){
  let s = 0;
  for(let i=0; i<arguments.length; i++){ const v = arguments[i] || 0; s += v*v; }
  return Math.sqrt(s);
}
/* video-pixel <-> CSS-pixel mapping for object-fit:cover */
function arcMap(){
  const st = arcEl("arStage"), v = ARC.video;
  const cw = st ? st.clientWidth : 360, ch = st ? st.clientHeight : 640;
  const vw = (v && v.videoWidth) ? v.videoWidth : cw;
  const vh = (v && v.videoHeight) ? v.videoHeight : ch;
  const s = Math.max(cw/vw, ch/vh);
  return { s:s, ox:(cw - vw*s)/2, oy:(ch - vh*s)/2, vw:vw, vh:vh, cw:cw, ch:ch };
}
const arcToCss = (m,p)=> [ m.ox + p[0]*m.s, m.oy + p[1]*m.s ];
const arcToVid = (m,x,y)=> [ (x - m.ox)/m.s, (y - m.oy)/m.s ];

/* affine-warp an image into a triangle — two of these make a quad */
function arcDrawTri(ctx, img, s, d){
  const A = [[s[0][0],s[0][1],1],[s[1][0],s[1][1],1],[s[2][0],s[2][1],1]];
  const sx = GEO.solveLinear(A, [d[0][0], d[1][0], d[2][0]]);
  const sy = GEO.solveLinear(A, [d[0][1], d[1][1], d[2][1]]);
  if(!sx || !sy) return;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(d[0][0], d[0][1]); ctx.lineTo(d[1][0], d[1][1]); ctx.lineTo(d[2][0], d[2][1]);
  ctx.closePath(); ctx.clip();
  ctx.transform(sx[0], sy[0], sx[1], sy[1], sx[2], sy[2]);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}
function arcDrawQuadImage(ctx, img, q){
  const w = img.width, h = img.height;
  arcDrawTri(ctx, img, [[0,0],[w,0],[w,h]], [q[0],q[1],q[2]]);
  arcDrawTri(ctx, img, [[0,0],[w,h],[0,h]], [q[0],q[2],q[3]]);
}
/* border + corner ticks + caption chip, drawn in the same space as the quad */
function arcDrawQuadChrome(ctx, q, caption, accent){
  ctx.save();
  ctx.lineWidth = 2; ctx.strokeStyle = accent || "#2dd4bf"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(q[0][0],q[0][1]);
  for(let i=1;i<4;i++) ctx.lineTo(q[i][0],q[i][1]);
  ctx.closePath(); ctx.stroke();
  // corner ticks: 14% along each adjacent edge
  ctx.lineWidth = 4;
  for(let i=0;i<4;i++){
    const p = q[i], a = q[(i+3)%4], b = q[(i+1)%4];
    const lerp = (u,v,f)=>[u[0]+(v[0]-u[0])*f, u[1]+(v[1]-u[1])*f];
    ctx.beginPath();
    const pa = lerp(p,a,0.14), pb = lerp(p,b,0.14);
    ctx.moveTo(pa[0],pa[1]); ctx.lineTo(p[0],p[1]); ctx.lineTo(pb[0],pb[1]);
    ctx.stroke();
  }
  if(caption){
    const cxm = (q[3][0]+q[2][0])/2, cym = (q[3][1]+q[2][1])/2;
    ctx.font = "700 13px ui-monospace, Menlo, monospace";
    const w = ctx.measureText(caption).width + 16;
    ctx.fillStyle = "rgba(4,10,18,.82)";
    ctx.fillRect(cxm - w/2, cym + 6, w, 24);
    ctx.fillStyle = accent || "#2dd4bf"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(caption, cxm, cym + 18);
  }
  ctx.restore();
}

/* ==========================================================
   WebXR raw camera access — read the passthrough frame back out of GL
   ------------------------------------------------------------
   XRWebGLBinding.getCameraImage() hands back an OPAQUE WebGLTexture that is
   valid only for the duration of the requestAnimationFrame callback that
   produced it. It cannot be cached, cannot be re-used on a later frame and
   cannot be passed to texImage2D. Everything below therefore runs inline in
   that one callback, and the texture is detached from our framebuffer before
   we return so no reference outlives the frame.
   ========================================================== */
const arcNow = () => (window.performance && performance.now) ? performance.now() : Date.now();

function arcDiagNew(){
  return {
    startedAt: new Date().toISOString(), ua: navigator.userAgent,
    origin: location.protocol + "//" + location.host,
    secureContext: window.isSecureContext !== false,
    screenAngle: arcScreenAngle(), dpr: window.devicePixelRatio || 1,
    xrPresent: !!navigator.xr, arSupported: null, supportError: null,
    requested: [], enabled: [], missing: [],
    glVersion: null, glVendor: null, glRenderer: null, glMaxTexture: null,
    frames: 0, viewportW: 0, viewportH: 0,
    projFocalX: null, projFocalY: null, projCx: null, projCy: null,
    bindingCreated: false, getCameraImageAvailable: null,
    cameraPresent: null, cameraW: 0, cameraH: 0,
    cameraAspect: null, projAspect: null, aspectSkew: null, aspectAgrees: null,
    camFocalX: null, camFocalY: null, camCx: null, camCy: null,
    fboStatus: null, fboStatusName: null, readbackPath: null,
    readbackMs: null, readbackBytes: null, readGlError: null,
    implReadFormat: null, implReadType: null,
    firstPixels: null, allZero: null, allBlack: null, meanLuma: null, maxLuma: null,
    alphaMin: null, alphaMax: null,
    hitResults: null, distanceFt: null, yawDeg: null, pitchDeg: null, rollDeg: null,
    depthGranted: null, depthSampleFt: null,
    lastError: null, notes: []
  };
}
function arcDiagErr(d, where, e){
  if(!d) return;
  d.lastError = { where: where, name: (e && e.name) || "", message: (e && e.message) || String(e),
                  stack: (e && e.stack) ? String(e.stack).split("\n").slice(0,6).join("\n") : "" };
}
function arcFbStatusName(gl, s){
  const names = ["FRAMEBUFFER_COMPLETE","FRAMEBUFFER_INCOMPLETE_ATTACHMENT",
                 "FRAMEBUFFER_INCOMPLETE_MISSING_ATTACHMENT","FRAMEBUFFER_INCOMPLETE_DIMENSIONS",
                 "FRAMEBUFFER_UNSUPPORTED","FRAMEBUFFER_INCOMPLETE_MULTISAMPLE"];
  for(let i=0;i<names.length;i++){ if(gl[names[i]] !== undefined && gl[names[i]] === s) return names[i]; }
  return "0x" + Number(s).toString(16);
}
function arcPixelBuf(w, h){
  const need = w*h*4;
  if(!ARC.xr.pixelBuf || ARC.xr.pixelBuf.length < need) ARC.xr.pixelBuf = new Uint8Array(need);
  return (ARC.xr.pixelBuf.length === need) ? ARC.xr.pixelBuf : ARC.xr.pixelBuf.subarray(0, need);
}
/* Cheap statistics so an all-black or all-transparent readback — the classic
   silent failure of this API — is caught instead of shipped as evidence. */
function arcAnalysePixels(buf, w, h){
  const n = w*h;
  const step = Math.max(1, Math.floor(n/20000));
  let sum = 0, max = 0, aMin = 255, aMax = 0, nonZero = 0, samples = 0;
  for(let i=0; i<n; i += step){
    const o = i*4, r = buf[o], g = buf[o+1], b = buf[o+2], a = buf[o+3];
    const l = 0.299*r + 0.587*g + 0.114*b;
    sum += l; if(l > max) max = l;
    if(a < aMin) aMin = a; if(a > aMax) aMax = a;
    if(r||g||b) nonZero++;
    samples++;
  }
  const first = [];
  for(let i=0; i<8 && i<n; i++){
    const o = i*4;
    first.push("["+buf[o]+","+buf[o+1]+","+buf[o+2]+","+buf[o+3]+"]");
  }
  return {
    firstPixels: first.join(" "), samples: samples,
    meanLuma: +(sum/Math.max(1,samples)).toFixed(2), maxLuma: +max.toFixed(1),
    alphaMin: aMin, alphaMax: aMax,
    allZero: nonZero === 0 && aMax === 0,
    allBlack: max < 2
  };
}
/* Shader blit fallback: sample the opaque texture into a texture we own, so the
   readback works even where attaching the camera texture directly is refused. */
function arcBlitInit(gl){
  if(ARC.xr.blit) return ARC.xr.blit;
  const mk = function(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error("shader: " + gl.getShaderInfoLog(s));
    return s;
  };
  const vs = mk(gl.VERTEX_SHADER,
    "attribute vec2 p; varying vec2 v; void main(){ v = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }");
  const fs = mk(gl.FRAGMENT_SHADER,
    "precision mediump float; uniform sampler2D s; varying vec2 v; void main(){ gl_FragColor = texture2D(s, v); }");
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error("link: " + gl.getProgramInfoLog(prog));
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  ARC.xr.blit = { prog:prog, buf:buf, loc: gl.getAttribLocation(prog,"p"),
                  samp: gl.getUniformLocation(prog,"s"), tex:null, fb:null, w:0, h:0 };
  return ARC.xr.blit;
}
/* Reads an (opaque) texture into a bottom-up RGBA Uint8Array. Returns null on
   failure and records exactly why in `d`. */
function arcReadTextureRGBA(gl, tex, w, h, d){
  const restore = ARC.xr.session && ARC.xr.session.renderState.baseLayer
    ? ARC.xr.session.renderState.baseLayer.framebuffer : null;
  const t0 = arcNow();
  let buf = null;
  try{
    if(gl.IMPLEMENTATION_COLOR_READ_FORMAT !== undefined){
      d.implReadFormat = "0x" + Number(gl.getParameter(gl.IMPLEMENTATION_COLOR_READ_FORMAT)).toString(16);
      d.implReadType   = "0x" + Number(gl.getParameter(gl.IMPLEMENTATION_COLOR_READ_TYPE)).toString(16);
    }
  }catch(e){ /* not fatal */ }

  // --- path 1: attach the camera texture straight to a framebuffer we own ---
  try{
    if(!ARC.xr.readFB) ARC.xr.readFB = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, ARC.xr.readFB);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    d.fboStatus = status; d.fboStatusName = arcFbStatusName(gl, status);
    if(status === gl.FRAMEBUFFER_COMPLETE){
      while(gl.getError() !== gl.NO_ERROR){ /* drain */ }
      const b = arcPixelBuf(w, h);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, b);
      const err = gl.getError();
      d.readGlError = err === gl.NO_ERROR ? null : ("0x" + Number(err).toString(16));
      if(err === gl.NO_ERROR){ buf = b; d.readbackPath = "direct"; }
    }
    // never keep a reference to the opaque texture past this callback
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, null, 0);
  }catch(e){ arcDiagErr(d, "direct-readback", e); }

  // --- path 2: shader blit into a texture we own, then read that ---
  if(!buf){
    try{
      const bl = arcBlitInit(gl);
      if(bl.w !== w || bl.h !== h){
        if(bl.tex) gl.deleteTexture(bl.tex);
        if(bl.fb)  gl.deleteFramebuffer(bl.fb);
        bl.tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, bl.tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        bl.fb = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, bl.fb);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, bl.tex, 0);
        bl.w = w; bl.h = h;
      } else {
        gl.bindFramebuffer(gl.FRAMEBUFFER, bl.fb);
      }
      const st2 = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
      d.fboStatusName = (d.fboStatusName || "") + " → blit:" + arcFbStatusName(gl, st2);
      if(st2 === gl.FRAMEBUFFER_COMPLETE){
        const prevVp = gl.getParameter(gl.VIEWPORT);
        gl.viewport(0, 0, w, h);
        gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
        gl.disable(gl.SCISSOR_TEST); gl.disable(gl.CULL_FACE);
        gl.useProgram(bl.prog);
        gl.bindBuffer(gl.ARRAY_BUFFER, bl.buf);
        gl.enableVertexAttribArray(bl.loc);
        gl.vertexAttribPointer(bl.loc, 2, gl.FLOAT, false, 0, 0);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, tex);          // sampling an opaque texture IS allowed
        gl.uniform1i(bl.samp, 0);
        // identity in GL space: quad (-1,-1)..(1,1) maps to texcoord (0,0)..(1,1),
        // so the blit result has the same row order the direct path would give
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        gl.bindTexture(gl.TEXTURE_2D, null);
        while(gl.getError() !== gl.NO_ERROR){ /* drain */ }
        const b2 = arcPixelBuf(w, h);
        gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, b2);
        const err2 = gl.getError();
        d.readGlError = err2 === gl.NO_ERROR ? null : ("0x" + Number(err2).toString(16));
        if(err2 === gl.NO_ERROR){ buf = b2; d.readbackPath = "shader-blit"; }
        if(prevVp) gl.viewport(prevVp[0], prevVp[1], prevVp[2], prevVp[3]);
      }
    }catch(e){ arcDiagErr(d, "blit-readback", e); }
  }

  try{ gl.bindFramebuffer(gl.FRAMEBUFFER, restore); }catch(e){}
  d.readbackMs = +(arcNow() - t0).toFixed(1);
  d.readbackBytes = buf ? w*h*4 : 0;
  if(buf){
    const st = arcAnalysePixels(buf, w, h);
    d.firstPixels = st.firstPixels; d.meanLuma = st.meanLuma; d.maxLuma = st.maxLuma;
    d.alphaMin = st.alphaMin; d.alphaMax = st.alphaMax;
    d.allZero = st.allZero; d.allBlack = st.allBlack;
  }
  return buf;
}
/* Full inline pipeline: opaque texture -> flipped, opaque canvas. */
function arcCameraImageToCanvas(gl, tex, w, h, d){
  const buf = arcReadTextureRGBA(gl, tex, w, h, d);
  if(!buf) return null;
  if(d.allZero || d.allBlack){
    d.notes.push("Readback succeeded but the image is black (mean luma "+d.meanLuma+
                 ") — treating it as a failure rather than storing a black photo.");
    return null;
  }
  const flipped = GEO.flipRowsRGBA(buf, w, h, true);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").putImageData(new ImageData(flipped, w, h), 0, 0);
  return c;
}

/* ---------- capability probe ---------- */
function arcProbe(){
  const out = { secure: window.isSecureContext !== false, media:false, xr:false, ori:false, oriGate:false };
  out.media = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  out.ori = typeof window.DeviceOrientationEvent !== "undefined";
  out.oriGate = out.ori && typeof window.DeviceOrientationEvent.requestPermission === "function";
  return new Promise(function(res){
    if(!out.secure || !navigator.xr || !navigator.xr.isSessionSupported){ res(out); return; }
    let settled = false;
    const t = setTimeout(function(){ if(!settled){ settled = true; res(out); } }, 2500);
    try{
      navigator.xr.isSessionSupported("immersive-ar").then(function(ok){
        if(settled) return; settled = true; clearTimeout(t); out.xr = !!ok; res(out);
      }, function(){ if(settled) return; settled = true; clearTimeout(t); res(out); });
    }catch(e){ clearTimeout(t); res(out); }
  });
}

/* ---------- sensors ---------- */
function arcStopSensors(){
  const s = ARC.sensors;
  if(s.onOri){
    window.removeEventListener("deviceorientationabsolute", s.onOri);
    window.removeEventListener("deviceorientation", s.onOri);
    s.onOri = null;
  }
  if(s.onMot){ window.removeEventListener("devicemotion", s.onMot); s.onMot = null; }
  s.on = false; s.src = "none"; s.pitchDeg = null; s.rollDeg = null;
}
function arcScreenAngle(){
  try{
    if(screen && screen.orientation && typeof screen.orientation.angle === "number") return screen.orientation.angle;
  }catch(e){}
  return (typeof window.orientation === "number") ? window.orientation : 0;
}
function arcStartSensors(){
  const s = ARC.sensors;
  return new Promise(function(res){
    if(typeof window.DeviceOrientationEvent === "undefined" &&
       typeof window.DeviceMotionEvent === "undefined"){
      res({ ok:false, why:"This browser exposes no motion or orientation sensors. Tilt and roll cannot be verified here." });
      return;
    }
    const attach = function(){
      let gotOri = false;
      s.onOri = function(e){
        if(e.alpha == null && e.beta == null && e.gamma == null) return;
        gotOri = true;
        s.alpha = e.alpha; s.beta = e.beta; s.gamma = e.gamma;
        const a = GEO.attitudeFromOrientation(e.alpha, e.beta, e.gamma, arcScreenAngle());
        s.pitchDeg = a.pitchDeg; s.rollDeg = a.rollDeg;
        s.on = true;
        s.src = e.absolute ? "deviceorientationabsolute" : "deviceorientation";
      };
      try{ window.addEventListener("deviceorientationabsolute", s.onOri, true); }catch(e){}
      try{ window.addEventListener("deviceorientation", s.onOri, true); }catch(e){}
      // gravity fallback if no orientation events arrive
      s.onMot = function(e){
        if(gotOri) return;
        const g = e.accelerationIncludingGravity;
        if(!g || (g.x == null && g.y == null && g.z == null)) return;
        const a = GEO.attitudeFromAccel(g.x, g.y, g.z, arcScreenAngle());
        s.pitchDeg = a.pitchDeg; s.rollDeg = a.rollDeg;
        s.on = true; s.src = "devicemotion gravity vector";
      };
      try{ window.addEventListener("devicemotion", s.onMot, true); }catch(e){}
      setTimeout(function(){
        if(s.on) res({ ok:true });
        else res({ ok:false, why:"Motion sensors are present but sent no readings. On a desktop machine there is usually no accelerometer at all." });
      }, 900);
    };
    const gate = window.DeviceOrientationEvent && typeof window.DeviceOrientationEvent.requestPermission === "function";
    if(gate){
      try{
        window.DeviceOrientationEvent.requestPermission().then(function(r){
          if(r !== "granted"){ res({ ok:false, why:"Motion access was denied. iOS only asks once per page load — reload and tap “Enable motion sensors” again." }); return; }
          if(window.DeviceMotionEvent && typeof window.DeviceMotionEvent.requestPermission === "function"){
            window.DeviceMotionEvent.requestPermission().then(attach, attach);
          } else attach();
        }, function(err){
          res({ ok:false, why:"Motion permission request failed ("+((err&&err.message)||"unknown")+"). It must be triggered by a tap on a secure origin." });
        });
      }catch(e){
        res({ ok:false, why:"Motion permission request threw: "+(e && e.message ? e.message : "unknown")+"." });
      }
    } else attach();
  });
}

/* ---------- panels ---------- */
function arcPanel(html){
  const p = arcEl("arPanel");
  if(!p) return;
  if(html === null){ p.classList.remove("on"); p.innerHTML = ""; ARC.panel = null; return; }
  p.innerHTML = '<div class="pnl">' + html + '</div>';
  p.classList.add("on");
}
/* ---------- preflight ----------
   TWO AUDIENCES, ONE PANEL.

   A merchandiser is standing in a shop holding a phone and needs one thing from
   this screen: what to do next. "WebXR immersive-ar + hit-test — NO" tells them
   nothing they can act on, "reference scaling will be estimated" reads like an
   accusation, and "Manual entry (unverified)" is a label written for an auditor.
   They get plain sentences and at most three buttons.

   A manager or an admin is the person who has to work out why one handset in a
   fleet behaves badly, so they keep the capability matrix verbatim. The AR
   diagnostics panel behind the gear menu keeps every number for everybody, and
   NOTHING about what is measured or recorded changes either way.

   THE EMPTY WALL (mockup mode). The poster is a file; the wall is bare. With
   ARCore the hit-test measures that bare wall directly and no reference is
   needed at all — the primary path, and the panel says so. Without ARCore the
   wall offers nothing to scale from, so a printed A4 sheet taped flat is the
   method, not a consolation prize, and it is spelled out in those words before
   the button is pressed. Typing the numbers is last, and is described as a
   guess because that is what it is.                                          */
function arcStartPanel(caps){
  const t = ARC.task;
  const cal = arcCalibGet();
  const plain = (myRole() === "Merchandiser");

  /* ---- the technical read-out: managers and admins only ---- */
  let rows = "";
  if(!plain){
    const line = (ok, label, note) =>
      '<div class="prow" style="display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:12.5px">'
      + '<span style="color:var(--text-2)">'+esc(label)+'</span>'
      + '<span><span class="chip '+(ok?"pass":"fail")+'">'+(ok?"YES":"NO")+'</span>'
      + (note?' <span style="font-size:11px;color:var(--text-3)">'+esc(note)+'</span>':'')+'</span></div>';
    rows += line(caps.secure, "Secure context (https / localhost)", caps.secure?"":"camera + sensors blocked");
    rows += line(caps.media,  "Camera (getUserMedia)");
    rows += line(caps.xr,     "WebXR immersive-ar + hit-test", caps.xr?"":"Android Chrome + ARCore only");
    rows += line(caps.ori,    "Motion / orientation sensors", caps.oriGate?"iOS asks for permission":"");
    rows += line(!!cal,       "Lens calibrated (focal length)",
                 cal?(Math.round(cal.f)+" px @ "+cal.vw+"w")
                    :byMode("reference scaling estimated; the drawn poster is scaled by f too",
                            "reference scaling will be estimated"));
    if(MOCKUP){
      const fcal = floorCalGet();
      const scm  = myStatureCm();
      const sh   = statureHold(scm);
      rows += line(!!fcal || !!sh, "Phone height h known (floor-line)",
                   fcal ? ("tape calibration " + Number(fcal.hM).toFixed(2)+" m ± "
                           +(Number(fcal.relSigma||FLOOR_DEFAULT_H_SIGMA)*100).toFixed(1)+"%")
                        : sh ? ("stature " + scm + " cm × " + HOLD_RATIO.toFixed(3) + " = "
                                + sh.hM.toFixed(2) + " m ± " + (sh.relSigma*100).toFixed(1) + "%")
                        : ("default "+FLOOR_DEFAULT_H_M.toFixed(2)+" m, ± "
                           +(FLOOR_DEFAULT_H_SIGMA*100).toFixed(0)+"% — over the 5% budget on its own"));
    }
    rows = '<div style="margin:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px 0">'
         + rows + '</div>';
  }

  /* ---- what is actually going to happen, in one paragraph ---- */
  let how = "";
  if(!caps.secure){
    how = plain
      ? '<div class="banner" style="margin:0 0 12px"><div class="bt">The camera is not available here</div>'
        + '<div class="bb">This page was not opened over a secure connection, so the phone will not let it use '
        + 'the camera or your location. Show this to your manager. You can still type the numbers in below.</div></div>'
      : '<div class="banner" style="margin:0 0 12px"><div class="bt">Camera unavailable</div><div class="bb">'
        + 'This page is not a secure context, so the browser will not hand out the camera, GPS or motion sensors. '
        + 'Serve it over <span class="mono">https</span> or from <span class="mono">http://localhost</span> — see <span class="mono">RUN.md</span>. '
        + 'Manual entry still works and is recorded as unverified.</div></div>';
  } else if(caps.xr && plain){
    how = '<div class="hint" style="margin:0 0 12px;font-size:13px;line-height:1.55">'
      + '<b>This phone can measure the wall by itself.</b> Nothing to tape up and nothing to carry — '
      + byMode('point it at the empty wall, walk to where it tells you, and the poster appears on the wall '
               + 'at its real size.',
               'point it at the wall, walk to where it tells you, and the poster is drawn at its real size.')
      + '</div>';
  } else if(caps.media && plain && MOCKUP){
    /* MOCKUP MODE, NO ARCore. The wall is bare, so there is nothing on it to
       measure against — but the floor is already there. Nothing to tape up and
       nothing to carry, which was the whole complaint about the A4 sheet. */
    /* Two sentences, two steps. This is the last screen before the camera and
       the merchandiser reads it standing in a shop, so it says what they will
       do, not how it works. */
    how = '<div class="hint" style="margin:0 0 12px;font-size:13px;line-height:1.55">'
      + '<b>1. Measure.</b> Hold the phone up at neck level and tilt it down until the line on screen '
      + 'sits where the wall meets the floor. Press the button.'
      + '<br><b>2. Frame.</b> Straighten the phone up without moving your feet. The poster appears on '
      + 'the wall at its real size. Press the button again to take the photo.'
      + '<br><br>Nothing to tape up and nothing to carry. If the bottom of the wall is hidden — shelving, '
      + 'stacked stock, a plinth — there is a link on the camera screen to use an A4 sheet instead.'
      + '</div>';
  } else if(caps.media && plain){
    how = '<div class="hint" style="margin:0 0 12px;font-size:13px;line-height:1.55">'
      + '<b>This phone cannot work out distance on its own,</b> so it needs something of a known size in the '
      + 'picture to measure against. '
      + '<b>Tape one sheet of A4 printer paper flat on the wall</b> and keep it in shot; the camera '
      + 'finds it by itself.'
      + '</div>';
  } else if(!caps.media && plain){
    how = '<div class="hint" style="margin:0 0 12px;font-size:13px;line-height:1.55">'
      + 'This device has no camera the app can use. You can still type the measurements in — it will be '
      + 'obvious to your manager that they were typed, not measured.</div>';
  }

  /* ---- the buttons ---- */
  let btns = '';
  if(caps.xr)    btns += '<button class="btn primary" data-arc="tierA">'
                       + (plain ? byMode("Point at the wall","Start") : "Start AR measurement")+'</button>';
  if(caps.media) btns += '<button class="btn'+(caps.xr?'':' primary')+'" data-arc="tierB">'
                       + (plain
                           ? (caps.xr
                               ? byMode("Measure off the floor instead", "Use the A4 sheet instead")
                               : byMode("Measure off the floor", "Use the camera"))
                           : byMode("Camera + floor-line (reference scale as fallback)",
                                    "Camera + reference scale"))+'</button>';
  btns += '<button class="btn'+((!caps.xr && !caps.media)?' primary':'')+'" data-arc="tierC">'
        + (plain ? "Type the numbers in" : "Manual entry (unverified)")+'</button>';
  /* Calibration costs a tape measure and five minutes. It only pays for itself
     on the camera path, so it is not put in front of someone who is about to
     use AR and will never touch a reference. */
  /* OPTIONAL REFINEMENTS, and nothing more than that. The tape calibration used
     to be pushed at the merchandiser on the capture screen itself, in a banner
     they could not dismiss. It is worth roughly ± 2.3 % against the ± 4 % the
     stature estimate already gives, so it is a refinement, not a prerequisite —
     it lives here, behind the word "optional", and never interrupts a capture.
     Managers and admins keep the technical labels. */
  if(caps.media && (!plain || !caps.xr)){
    if(MOCKUP)
      btns += '<button class="btn ghost" data-arc="floorcal">'
            + (plain ? "Optional: measure this phone exactly (tape measure)" : "Calibrate phone height (floor-line)…")+'</button>';
    btns += '<button class="btn ghost" data-arc="calib">'
          + (plain ? "Optional: sharpen the poster size (tape measure)" : "Calibrate lens (focal length)…")+'</button>';
  }
  btns += '<button class="btn ghost" data-arc="close">Cancel</button>';

  arcPanel('<h2>'+(plain ? byMode("Mock the poster up","Take the photo") : "Guided poster capture")+'</h2>'
    + '<p>'+esc(t.storeName)+' · <span class="mono">'+esc(t.storeCode)+'</span><br>'
    + (plain
        ? byMode('Poster <b class="num">'+t.widthFt+' × '+t.heightFt+' ft</b>. Find an empty wall big enough '
                 + 'for it, then stand about <b class="num">'
                 + fmtRoughFt(taskStandoff(t).recommendedFt, taskStandoff(t).recommendedFt*FOCAL_SIGMA_ASSUMED)
                 + ' ft</b> back '
                 + 'and hold the phone straight. The screen tells you when you are in the right spot.',
                 'Poster <b class="num">'+t.widthFt+' × '+t.heightFt+' ft</b>. Stand about '
                 + '<b class="num">'+Number(t.standoffFt).toFixed(1)+' ft</b> back and hold the phone straight. '
                 + 'The screen tells you when you are in the right spot.')
        : 'Poster <b class="num">'+t.widthFt+' × '+t.heightFt+' ft</b>, shot from <b class="num">'
          + Number(t.standoffFt).toFixed(1)+' ± '+t.standoffTolFt+' ft</b>, square within <b class="num">± '+t.angleTolDeg+'°</b>.')
    + '</p>'
    + rows
    + how
    + '<div class="pfoot">'+btns+'</div>');
  ARC.panel = "start";
}
function arcErrorPanel(title, body, retryTier){

/* ---------- open / close ---------- */
/* `phase` picks the DEFAULT reference: an after-shot is taken with the poster
   already on the wall, which makes the poster itself the best reference there
   is — nothing to carry, nothing to tape up, and it is centred in frame by
   construction. A before-shot has no poster yet, so it falls back to a printed
   A4 sheet, which is the one rectangle a merchandiser can reliably produce. */
function arcOpen(taskId, phase){
  const t = taskById(taskId);
  if(!t){ toast("Task not found.", true); return; }
  ARC.task = t; ARC.open = true; ARC.tier = null; ARC.armed = false; ARC.armT0 = 0;
  ARC.nudge = {x:0, y:0}; ARC.capture = null; ARC.busy = false;
  ARC.meas = { distFt:null, yawDeg:null, yawVerified:false, distSrc:"", depthUsed:false, wallSeen:false };
  ARC.mode = "two"; ARC.handles = []; ARC.quad = [];
  ARC.wall = { on:false, xL:0, xR:0, yT:0, yB:0, movedX:false, movedY:false,
               result:null, ack:false };
  /* MOCKUP MODE: the wall is empty by definition, so there is never a poster in
     frame to scale from — the A4 sheet is the reference whenever a reference is
     needed at all. Verification mode keeps the phase rule: an after-shot has
     the installed poster in it, and that is the best reference available.     */
  ARC.refPhase = MOCKUP ? "before" : ((phase === "before") ? "before" : "after");
  ARC.refPreset = MOCKUP ? "a4q" : ((ARC.refPhase === "before") ? "a4q" : "poster");
  ARC.refWmm = 210; ARC.refHmm = 297;
  arcDetRelease();
  floorRelease();
  ARC.assumeLevel = false; ARC.assumeSquare = false;
  ARC.pendingCalib = false; ARC.pendingFloorCalib = false;
  ARC.xr.focalPx = null; ARC.xr.vpW = 0; ARC.xr.vpH = 0;
  ARC.xr.pendingShot = null; ARC.xr.cam = null; ARC.xr.camIntr = null;
  ARC.xr.camAccess = false; ARC.xr.binding = null; ARC.xr.aspectWarned = false;
  ARC.diag = null;

  const layer = arcEl("arlayer");
  layer.innerHTML = arcShell(t);
  layer.classList.add("on");
  layer.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
  ARC.video = arcEl("arVideo");
  ARC.canvas = arcEl("arCanvas");
  ARC.ctx = ARC.canvas.getContext("2d");
  arcBindStage();

  arcLoadImage(t.posterArt && t.posterArt.src).then(function(im){ ARC.posterImg = im; },
    function(){ ARC.posterImg = null; toast("Poster artwork could not be decoded — the overlay will draw an outline only.", true); });

  arcProbe().then(arcStartPanel);
}
function arcClose(){
  ARC.open = false;
  if(ARC.raf){ cancelAnimationFrame(ARC.raf); ARC.raf = 0; }
  arcStopSensors();
  arcStopCamera();
  arcDetRelease();
  floorRelease();
  if(ARC.xr.session){ try{ ARC.xr.session.end(); }catch(e){} }
  ARC.xr.session = null; ARC.xr.hitSource = null;
  ARC.xr.binding = null; ARC.xr.pendingShot = null; ARC.xr.cam = null; ARC.xr.camIntr = null;
  // release the GL objects we own before dropping the context
  const gl0 = ARC.xr.gl;
  if(gl0){
    try{
      if(ARC.xr.readFB) gl0.deleteFramebuffer(ARC.xr.readFB);
      const bl = ARC.xr.blit;
      if(bl){
        if(bl.tex) gl0.deleteTexture(bl.tex);
        if(bl.fb) gl0.deleteFramebuffer(bl.fb);
        if(bl.buf) gl0.deleteBuffer(bl.buf);
        if(bl.prog) gl0.deleteProgram(bl.prog);
      }
    }catch(e){}
  }
  ARC.xr.readFB = null; ARC.xr.blit = null; ARC.xr.pixelBuf = null; ARC.xr.aspectWarned = false;
  if(ARC.xr.glCanvas && ARC.xr.glCanvas.parentNode) ARC.xr.glCanvas.parentNode.removeChild(ARC.xr.glCanvas);
  ARC.xr.glCanvas = null; ARC.xr.gl = null;
  const layer = arcEl("arlayer");
  layer.classList.remove("on"); layer.innerHTML = "";
  layer.setAttribute("aria-hidden","true");
  document.body.style.overflow = "";
  ARC.video = null; ARC.canvas = null; ARC.ctx = null;
}
function arcStopCamera(){
  try{
    if(ARC.stream) ARC.stream.getTracks().forEach(function(tr){ try{ tr.stop(); }catch(e){} });
  }catch(e){}
  ARC.stream = null;
  if(ARC.video){ try{ ARC.video.srcObject = null; }catch(e){} }
}

/* ---------- Tier B: camera ---------- */
function arcTierB(){
  const t = ARC.task;
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    arcErrorPanel("No camera API",
      (myRole() === "Merchandiser")
        ? "This browser will not let the app use a camera at all. Type the numbers in instead, or open the "
          + "link on a phone."
        : "This browser does not expose <span class=\"mono\">navigator.mediaDevices.getUserMedia</span>. "
          + "Use manual entry, or open the page on a phone over https.", null);
    return;
  }
  ARC.tier = "B";
  arcPanel('<h2>Starting the camera…</h2><p>If the browser asks, allow camera access. '
    + 'The rear camera is requested first and falls back to any available camera.</p>');
  const attempt = function(constraints){
    return navigator.mediaDevices.getUserMedia(constraints);
  };
  /* Ask for no more pixels than this device can actually process. Every cost in
     the detection pass is linear in the frame the browser hands back, and a
     budget Android that is handed 1280×720 will simply drop frames instead. */
  ARC.det.cls = arcDeviceClass();
  attempt({ video: arcCameraConstraints(ARC.det.cls), audio:false })
    .catch(function(){ return attempt({ video:{ facingMode:{ ideal:"environment" } }, audio:false }); })
    .catch(function(){ return attempt({ video:true, audio:false }); })
    .then(function(stream){
      ARC.stream = stream;
      ARC.video.srcObject = stream;
      const play = ARC.video.play();
      if(play && play.catch) play.catch(function(){});
      return new Promise(function(res, rej){
        let n = 0;
        const wait = function(){
          if(!ARC.open) return rej(new Error("cancelled"));
          if(ARC.video && ARC.video.videoWidth > 0) return res();
          // no dimensions means no frames — never fall through, or every pixel
          // measurement below would be scaled off a guessed resolution
          if(++n > 100) return rej(Object.assign(new Error("no frames"), { name:"NoFrameError" }));
          setTimeout(wait, 60);
        };
        wait();
      });
    })
    .then(function(){
      ARC.focal = arcResolveFocal();
      arcPanel(null);
      /* Automatic detection is the DEFAULT path, not an extra mode hidden behind
         a toggle. The whole point of the feature is that a merchandiser who is
         already holding the phone up gets a measurement without hunting for a
         known-width object and dragging handles on every single capture. The
         manual modes are still one tap away and are what a failed detection
         falls back to. */
      /* MOCKUP MODE, NO ARCore: floor-line is the DEFAULT and the A4 sheet is
         the fallback, not the other way round. The merchandiser rejected taping
         paper up in every shop, and on a bare wall the floor line is the only
         thing in the room whose geometry is already known. The sheet is still
         one tap away and is offered by name the moment the floor line cannot be
         seen — shelving, stock or a plinth at the base of the wall is a real and
         common case in retail, not a corner case.
         VERIFICATION MODE is untouched: there the poster is on the wall and the
         reference detector is still the right first move. */
      ARC.mode = MOCKUP ? "floor" : "auto";
      ARC.handles = [];
      if(ARC.mode === "floor") floorInit(); else arcDetInit();
      arcRenderHandles();
      arcStartSensors().then(function(r){
        if(!r.ok) toast("Tilt/roll unavailable — " + r.why, true);
      });
      arcLoop();
      if(ARC.pendingCalib){ ARC.pendingCalib = false; arcCalibPanel(); }
      else if(ARC.pendingFloorCalib){ ARC.pendingFloorCalib = false; floorCalPanel(); }
    })
    .catch(function(err){
      const name = (err && err.name) || "";
      let msg;
      if(name === "NotAllowedError" || name === "SecurityError"){
        msg = "Camera permission was denied. Open the site settings for this origin and allow the camera, then try again. "
            + "On iOS the prompt only appears on an <span class=\"mono\">https</span> origin.";
      } else if(name === "NotFoundError" || name === "OverconstrainedError"){
        msg = "No usable camera was found on this device.";
      } else if(name === "NotReadableError"){
        msg = "The camera is busy — another tab or app is holding it. Close that and try again.";
      } else if(name === "NoFrameError"){
        msg = "The camera opened but never delivered a frame, so its resolution is unknown and nothing can be "
            + "measured from it. This usually means the tab is in the background — bring it to the front and retry.";
      } else if(err && err.message === "cancelled"){
        return;   // the layer was closed while we were waiting
      } else {
        msg = "The camera could not be started (<span class=\"mono\">"+esc(name || "unknown error")+"</span>).";
      }
      arcErrorPanel("Camera unavailable", msg, "tierB");
    });
}

/* The reference's own dimensional tolerance in mm, for the dimension given.
   A preset either declares an absolute tolerance (a guillotined A4 sheet is
   good to half a millimetre whatever its size) or a proportional one (a printed
   poster is trimmed to roughly 1 % of its nominal size). */
function arcRefTolMm(def, dimMm){
  if(!def) return Math.max(0.5, 0.005*(dimMm||0));
  if(def.tolMm != null) return def.tolMm;
  return (def.tolPct != null ? def.tolPct : 0.005)*(dimMm||0);
}
/* The reference in force. "poster" is resolved from the TASK, not from the
   preset table: the installed poster is the highest-value reference on an
   after-shot because it needs no extra kit, it is already centred in frame, and
   its true size is on the brief. */
function arcRefDef(){
  const p = REF_PRESETS.filter(x=>x.key===ARC.refPreset)[0] || REF_PRESETS[0];
  if(p.key === "poster"){
    const t = ARC.task;
    if(!t) return REF_PRESETS.filter(x=>x.key==="a4q")[0];
    const wmm = t.widthFt*304.8, hmm = t.heightFt*304.8;
    return { key:"poster", quad:true, auto:true,
             label:"The poster itself ("+t.widthFt+" × "+t.heightFt+" ft)",
             mm:wmm, hmm:hmm, tolMm: arcRefTolMm(p, Math.min(wmm, hmm)) };
  }
  if(p.key === "custom"){
    return { key:"custom", label:"Custom "+ARC.refWmm+" mm", mm:ARC.refWmm,
             quad: ARC.refHmm > 0, hmm: ARC.refHmm, auto: ARC.refHmm > 0,
             tolMm: arcRefTolMm(p, ARC.refWmm) };
  }
  return Object.assign({}, p, { tolMm: arcRefTolMm(p, Math.min(p.mm, p.hmm || p.mm)) });
}
function arcResetHandles(){
  const st = arcEl("arStage");
  const w = st ? st.clientWidth : 360, h = st ? st.clientHeight : 640;
  if(ARC.mode === "quad"){
    ARC.handles = [ [w*0.30,h*0.34], [w*0.70,h*0.34], [w*0.70,h*0.62], [w*0.30,h*0.62] ];
  } else {
    ARC.handles = [ [w*0.30,h*0.48], [w*0.70,h*0.48] ];
  }
  arcRenderHandles();
}
function arcRenderHandles(){
  const box = arcEl("arHandles");
  if(!box) return;
  const labels = ARC.mode === "quad" ? ["1","2","3","4"] : ["A","B"];
  box.innerHTML = ARC.handles.map(function(p,i){
    return '<div class="arh" data-arch="'+i+'" style="left:'+p[0].toFixed(1)+'px;top:'+p[1].toFixed(1)+'px">'+labels[i]+'</div>';
  }).join("");
}

/* ---------- Tier A: WebXR ---------- */
/* True only for failures that a different feature set could plausibly fix. */
function arcRetryWithoutDepth(e){
  const n = (e && e.name) || "";
  return n === "NotSupportedError" || n === "TypeError" || n === "";
}
function arcTierA(){
  ARC.tier = "A";
  const d = ARC.diag = arcDiagNew();
  arcPanel('<h2>Starting the AR session…</h2><p>Point the phone at the wall and move it slowly so the '
    + 'runtime can find the surface. Grant the AR prompt if it appears.</p>');
  const layer = arcEl("arlayer");
  let glCanvas, gl;
  try{
    glCanvas = document.createElement("canvas");
    glCanvas.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0";
    layer.appendChild(glCanvas);
    // WebGL2 first: stricter, better-defined readPixels behaviour than WebGL1.
    gl = glCanvas.getContext("webgl2", { xrCompatible:true, alpha:true, antialias:false })
      || glCanvas.getContext("webgl", { xrCompatible:true, alpha:true, antialias:false })
      || glCanvas.getContext("experimental-webgl", { xrCompatible:true });
    if(!gl) throw new Error("no WebGL context");
    d.glVersion  = gl.getParameter(gl.VERSION);
    d.glVendor   = gl.getParameter(gl.VENDOR);
    d.glRenderer = gl.getParameter(gl.RENDERER);
    d.glMaxTexture = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  }catch(e){
    arcDiagErr(d, "webgl-context", e);
    arcErrorPanel("WebGL unavailable",
      "WebXR needs a WebGL context for its base layer and this browser would not give one ("
      + esc((e && e.message) || "unknown") + "). Fall back to camera + reference scale.", "tierB");
    return;
  }
  ARC.xr.glCanvas = glCanvas; ARC.xr.gl = gl;

  const OPTIONAL = ["dom-overlay","anchors","camera-access","depth-sensing","light-estimation"];
  const OPTIONAL_NO_DEPTH = ["dom-overlay","anchors","camera-access"];
  const base = { requiredFeatures:["hit-test"], domOverlay:{ root: layer } };
  const withDepth = Object.assign({}, base, {
    optionalFeatures: OPTIONAL,
    depthSensing:{ usagePreference:["cpu-optimized"], dataFormatPreference:["luminance-alpha","float32"] }
  });
  // Retried without the depthSensing init dict, which some runtimes reject outright.
  const noDepth = Object.assign({}, base, { optionalFeatures: OPTIONAL_NO_DEPTH });
  d.requested = ["hit-test"].concat(OPTIONAL);

  const start = function(opts){ return navigator.xr.requestSession("immersive-ar", opts); };
  start(withDepth).catch(function(e){
    // Only a feature/dict problem is worth retrying. SecurityError (no user
    // activation) and InvalidStateError would fail identically the second time
    // and retrying just buries the real cause under a misleading note.
    if(!arcRetryWithoutDepth(e)) throw e;
    d.notes.push("Session with depth-sensing refused (" + ((e && e.name) || "?") + "); retrying without it.");
    d.requested = ["hit-test"].concat(OPTIONAL_NO_DEPTH);
    return start(noDepth);
  }).then(function(session){
    ARC.xr.session = session;
    const en = (session.enabledFeatures ? Array.prototype.slice.call(session.enabledFeatures) : []);
    ARC.xr.enabled = en; ARC.xr.requested = d.requested;
    d.enabled = en;
    d.missing = d.requested.filter(function(f){ return en.indexOf(f) < 0; });
    if(!session.enabledFeatures) d.notes.push("session.enabledFeatures is not exposed by this runtime — feature grants are unknown.");
    ARC.xr.depth = en.indexOf("depth-sensing") >= 0;
    ARC.xr.anchors = en.indexOf("anchors") >= 0;
    ARC.xr.camAccess = en.indexOf("camera-access") >= 0;
    d.depthGranted = ARC.xr.depth;
    session.addEventListener("end", function(){
      ARC.xr.session = null; ARC.xr.hitSource = null; ARC.xr.binding = null; ARC.xr.pendingShot = null;
      if(ARC.open && !ARC.busy && !ARC.capture){ arcErrorPanel("AR session ended",
        "The AR session was closed before a capture was made.", "tierA"); }
    });
    session.updateRenderState({ baseLayer: new XRWebGLLayer(session, ARC.xr.gl) });
    // The binding must use the same xrCompatible context that backs the base layer.
    if(ARC.xr.camAccess){
      try{
        if(typeof XRWebGLBinding === "undefined") throw new Error("XRWebGLBinding is not defined");
        ARC.xr.binding = new XRWebGLBinding(session, ARC.xr.gl);
        d.bindingCreated = true;
        d.getCameraImageAvailable = typeof ARC.xr.binding.getCameraImage === "function";
        if(!d.getCameraImageAvailable) d.notes.push("camera-access was granted but XRWebGLBinding has no getCameraImage().");
      }catch(e){
        arcDiagErr(d, "XRWebGLBinding", e);
        ARC.xr.binding = null; ARC.xr.camAccess = false;
        d.notes.push("Could not create XRWebGLBinding — falling back to the handover capture path.");
      }
    } else {
      d.notes.push("camera-access not granted; single-frame capture unavailable, handover path will be used.");
    }
    return Promise.all([ session.requestReferenceSpace("viewer"), session.requestReferenceSpace("local") ])
      .then(function(spaces){
        ARC.xr.viewer = spaces[0]; ARC.xr.local = spaces[1];
        return session.requestHitTestSource({ space: spaces[0] });
      })
      .then(function(hs){
        ARC.xr.hitSource = hs;
        arcPanel(null);
        ARC.video.style.display = "none";
        arcStartSensors().then(function(){ /* roll still comes from the device */ });
        session.requestAnimationFrame(arcXRFrame);
      });
  }).catch(function(err){
    const name = (err && err.name) || "";
    let msg;
    if(name === "NotSupportedError"){
      msg = "This device reports immersive-ar but refused the session — the <span class=\"mono\">hit-test</span> feature is probably unavailable. ";
    } else if(name === "SecurityError"){
      msg = "The AR session was blocked. WebXR needs a secure origin and a user gesture. ";
    } else if(name === "InvalidStateError"){
      msg = "An AR session is already running in this tab. ";
    } else {
      msg = "The AR session could not start (<span class=\"mono\">"+esc(name || (err && err.message) || "unknown")+"</span>). ";
    }
    arcErrorPanel("AR unavailable",
      msg + ((myRole() === "Merchandiser")
        ? byMode("You can still do this with the camera — tape a plain A4 sheet flat on the wall and keep it in shot.",
                 "You can still use the camera; it measures a little less precisely.")
        : "Camera + reference scale still measures distance, just less precisely."), "tierB");
  });
}

function arcXRFrame(time, frame){
  if(!ARC.open || !ARC.xr.session) return;
  const session = ARC.xr.session;
  session.requestAnimationFrame(arcXRFrame);
  ARC.meas.centreDepthFt = null;   // never let a stale depth sample outlive its frame
  try{
    const gl = ARC.xr.gl;
    const layer = session.renderState.baseLayer;
    if(gl && layer){
      gl.bindFramebuffer(gl.FRAMEBUFFER, layer.framebuffer);
      gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    }
    // focal length + viewport straight out of the XR view
    const vp = frame.getViewerPose(ARC.xr.local);
    let view = null, port = null;
    const dg = ARC.diag;
    if(vp && vp.views && vp.views.length && layer){
      view = vp.views[0];
      port = layer.getViewport(view);
      if(port && port.width){
        ARC.xr.vpW = port.width; ARC.xr.vpH = port.height;
        const vi = GEO.intrinsicsFromProjection(view.projectionMatrix, port.width, port.height);
        if(vi){
          ARC.xr.focalPx = vi.fx;
          if(dg){ dg.viewportW = port.width; dg.viewportH = port.height;
                  dg.projFocalX = +vi.fx.toFixed(2); dg.projFocalY = +vi.fy.toFixed(2);
                  dg.projCx = +vi.cx.toFixed(2); dg.projCy = +vi.cy.toFixed(2);
                  dg.projAspect = +vi.projAspect.toFixed(5); }
        }
      }
      // raw camera image metadata — cheap, per frame; the pixels are NOT read here
      const cam = view.camera || null;
      ARC.xr.cam = cam ? { w: cam.width, h: cam.height } : null;
      if(dg){
        dg.cameraPresent = !!cam;
        if(cam){
          dg.cameraW = cam.width; dg.cameraH = cam.height;
          const ci = GEO.intrinsicsFromProjection(view.projectionMatrix, cam.width, cam.height);
          ARC.xr.camIntr = ci;
          if(ci){
            dg.cameraAspect = +ci.rasterAspect.toFixed(5);
            dg.aspectSkew = +ci.aspectSkew.toFixed(5);
            dg.aspectAgrees = ci.aspectSkew < 0.02;
            dg.camFocalX = +ci.fx.toFixed(2); dg.camFocalY = +ci.fy.toFixed(2);
            dg.camCx = +ci.cx.toFixed(2); dg.camCy = +ci.cy.toFixed(2);
            if(!dg.aspectAgrees && !ARC.xr.aspectWarned){
              ARC.xr.aspectWarned = true;
              dg.notes.push("Camera image aspect " + ci.rasterAspect.toFixed(4) +
                " disagrees with the view frustum aspect " + ci.projAspect.toFixed(4) +
                " by " + (ci.aspectSkew*100).toFixed(1) + "% — the poster is projected with " +
                "separate fx/fy so it stays geometrically correct, but the camera image may be cropped " +
                "relative to the viewport.");
              if(window.console && console.warn) console.warn("[NIVA] XR camera/viewport aspect mismatch", dg.notes[dg.notes.length-1]);
            }
          }
        } else { ARC.xr.camIntr = null; }
        dg.frames++;
      } else if(cam){
        ARC.xr.camIntr = GEO.intrinsicsFromProjection(view.projectionMatrix, cam.width, cam.height);
      } else { ARC.xr.camIntr = null; }

      if(ARC.xr.depth && frame.getDepthInformation){
        try{
          const di = frame.getDepthInformation(view);
          if(di && di.getDepthInMeters){
            const dm = di.getDepthInMeters(0.5, 0.5);
            if(dm > 0.05 && dm < 40){
              ARC.meas.centreDepthFt = GEO.mToFt(dm);
              if(dg) dg.depthSampleFt = +ARC.meas.centreDepthFt.toFixed(3);
            }
          }
        }catch(e){ /* depth buffers are flaky; hit-test remains authoritative */ }
      }
    }
    const results = ARC.xr.hitSource ? frame.getHitTestResults(ARC.xr.hitSource) : [];
    if(!results.length){
      ARC.meas.wallSeen = false;
      ARC.meas.distFt = null; ARC.meas.yawDeg = null; ARC.meas.yawVerified = false;
      ARC.meas.xrPitchDeg = null;      // no plane, no wall-relative pitch either
      ARC.meas.distSrc = "no surface detected";
    } else {
      const pose = results[0].getPose(ARC.xr.viewer);
      if(pose){
        const p = pose.transform.position;
        const q = pose.transform.orientation;
        const dM = Math.sqrt(p.x*p.x + p.y*p.y + p.z*p.z);
        const useDepth = ARC.xr.depth && ARC.meas.centreDepthFt != null;
        ARC.meas.distFt = useDepth ? ARC.meas.centreDepthFt : GEO.mToFt(dM);
        ARC.meas.depthUsed = !!useDepth;
        ARC.meas.distSrc = useDepth
          ? "WebXR depth buffer, centre sample (AR measured)"
          : "WebXR hit-test pose in viewer space (AR measured)";
        // the hit pose's +Y axis is the surface normal
        const n = GEO.quatRotate({x:q.x,y:q.y,z:q.z,w:q.w}, [0,1,0]);
        const ang = GEO.normalToAngles(n);
        ARC.meas.yawDeg = ang.yawDeg;
        ARC.meas.xrPitchDeg = ang.pitchDeg;   // wall-relative, the correct pitch gate
        ARC.meas.incidenceDeg = ang.incidenceDeg;
        ARC.meas.yawVerified = true;
        ARC.meas.wallSeen = true;
      }
    }
    /* Roll is only meaningful against gravity, and the local reference space is
       already gravity-aligned (+Y up), so the viewer pose gives it directly —
       no DeviceOrientationEvent needed in this tier. */
    if(vp && vp.transform && vp.transform.orientation){
      const q = vp.transform.orientation;
      const right = GEO.quatRotate({x:q.x,y:q.y,z:q.z,w:q.w}, [1,0,0]);
      ARC.meas.xrRollDeg = -GEO.deg(Math.asin(clamp(right[1], -1, 1)));
    }
    /* The shutter only raises a request; the readback has to happen HERE, while
       the opaque camera texture handed out by this callback is still valid. */
    if(ARC.xr.pendingShot) arcTrySingleFrame(frame, view);
  }catch(e){
    ARC.meas.wallSeen = false;
    ARC.meas.distSrc = "hit-test error: " + ((e && e.message) || "unknown");
    arcDiagErr(ARC.diag, "xr-frame", e);
    if(ARC.xr.pendingShot){
