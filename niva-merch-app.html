const VIEWS = {
  dashboard: viewDashboard, campaigns: viewCampaigns, campaign: viewCampaign,
  tasks: viewTasks, create: viewCreate, approvals: viewApprovals, review: viewReview,
  mytasks: viewMyTasks, task: viewTask, users: viewUsers, audit: viewAudit
};
/* Role gating, driven entirely by the session's profile row. This is a UI
   affordance only — the same rules are enforced by RLS and by the guard
   triggers, so a user who reaches a view they should not see still cannot read
   or write anything they should not. */
function allowedView(name){
  const r = myRole();
  if(r === "Merchandiser") return ["mytasks","task"].indexOf(name) >= 0;
  if(r === "Admin") return ["dashboard","campaigns","campaign","tasks","task","users","audit"].indexOf(name) >= 0;
  if(r === "Manager") return ["dashboard","campaigns","campaign","tasks","task","create","approvals","review"].indexOf(name) >= 0;
  return false;   // no session, or a role this build does not know
}
function homeView(){ return myRole()==="Merchandiser" ? "mytasks" : "dashboard"; }

function render(){
  renderGate();
  if(!signedIn()){
    /* Nothing behind the gate to draw yet, and no console noise. */
    const app = $("#app"); if(app) app.innerHTML = "";
    const nav = $("#nav"); if(nav) nav.innerHTML = "";
    renderChrome();
    return;
  }
  snapshotForm();   // preserve typed create-form values across a re-render
  if(!allowedView(view.name)) view = { name: homeView(), params:{} };
  const fn = VIEWS[view.name] || viewDashboard;
  let out;
  try{ out = fn(view.params) || {html:""}; }
  catch(e){
    out = { html: '<div class="card"><div class="bd">'+emptyState("Something went wrong rendering this view.")+'</div></div>' };
    if(window.console && console.warn) console.warn("[NIVA] render error", e);
  }
  $("#app").innerHTML = out.html;
  renderNav();
  renderChrome();
  if(typeof out.post === "function"){
    try{ out.post(); }catch(e){ if(window.console && console.warn) console.warn("[NIVA] post-render error", e); }
  }
}

/* ==========================================================
   17. Event wiring
   ========================================================== */
/* The login form is a real <form>, so Enter submits and password managers
   behave. It lives inside #gate, which is re-rendered wholesale, hence the
   delegated listener. */
document.addEventListener("submit", function(e){
  const f = e.target.closest && e.target.closest("#loginform");
  if(!f) return;
  e.preventDefault();
  doSignIn();
});

document.addEventListener("click", function(e){
  const bell = e.target.closest && e.target.closest("#bell");
  if(bell){ e.preventDefault(); toggleNotifs(); return; }
  const gear = e.target.closest && e.target.closest("#gear");
  if(gear){ e.preventDefault(); toggleMenu(); return; }
  const sync = e.target.closest && e.target.closest("#syncchip");
  if(sync){ e.preventDefault(); closePops(); openSyncPanel(); return; }

  const el = e.target.closest ? e.target.closest("[data-act]") : null;
  if(!el){
    if(ui.popOpen && !(e.target.closest && e.target.closest(".pop"))) closePops();
    return;
  }
  const act = el.dataset.act;
  const id  = el.dataset.id;

  switch(act){
    case "nav":        go(el.dataset.v, id ? {id:id} : {}); break;
    case "open":       go("task", {id:id}); break;
    case "botmore":    toggleMenu(); break;
    case "fstep":      {
      /* Move through the field sequence. Stored against a signature of the
         work's state, so completing a step drops the override and the
         sequence advances on its own. */
      const t = taskById(id);
      if(t){
        const s = parseInt(el.dataset.s, 10) || 0;
        if(fieldStepEnabled(t, s)){
          fieldStep[t.id] = { step:s, sig: fieldStepSig(t) };
          window.scrollTo(0,0);
          render();
        }
      }
      break;
    }
    case "back":       history.length>1 ? go(myRole()==="Merchandiser"?"mytasks":"tasks",{}) : go("dashboard",{}); break;
    case "gran":       ui.granularity = el.dataset.g; render(); break;
    case "createtask": doCreateTask(el.dataset.mode); break;
    case "simbefore":  {
      const lat = parseFloat(($("#c_lat")||{}).value) || 19.076;
      const lng = parseFloat(($("#c_lng")||{}).value) || 72.8777;
      const code = (($("#c_code")||{}).value || "NEW-STORE").toUpperCase();
      simulateCapture(code, "BEFORE", 0, fmtDT(new Date().toISOString())).then(function(url){
        draftBefore = { src:url, ts:new Date().toISOString(), lat:+lat.toFixed(5), lng:+lng.toFixed(5), device:deviceString() };
        render(); toast("Simulated BEFORE photo attached.");
      });
      break;
    }
    case "clearbefore": draftBefore = null; render(); break;
    case "simposter": {
      const w = parseFloat(($("#c_w")||{}).value) || 4;
      const h = parseFloat(($("#c_h")||{}).value) || 3;
      const camp = ($("#c_campaign")||{}).value || CAMPAIGNS[0].id;
      const seed = camp + "-" + ((($("#c_code")||{}).value) || "NEW").toUpperCase();
      snapshotForm();
      simulatePosterArt(seed, w, h, w.toFixed(1)+"×"+h.toFixed(1)+" ft").then(function(url){
        draftPoster = { src:url, ts:new Date().toISOString(), name:"simulated-key-visual.jpg" };
        render(); toast("Simulated poster artwork attached ("+w+" × "+h+" ft).");
      });
      break;
    }
    case "clearposter": draftPoster = null; render(); break;
    case "posterdefaults": applyPosterDefaults(false); break;
    case "arcapture":  arcOpen(id); break;
    case "syncpanel":  closePops(); openSyncPanel(); break;
    case "syncnow":    Outbox.kick(); Poller.now(); toast("Sync requested."); break;
    case "selftest":    closePops(); openSelfTest(); break;
    case "diagnostics": closePops(); arcDiagOpen(); break;
    case "capsmodal": {
      closePops();
      const cal = (function(){ try{ return JSON.parse(localStorage.getItem(CALIB_KEY)||"{}"); }catch(err){ return {}; } })();
      const keys = Object.keys(cal);
      const yn = b => '<span class="chip '+(b?"pass":"fail")+'">'+(b?"YES":"NO")+'</span>';
      openModal({ title:"Capture capability report",
        body:'<dl class="kv">'
          + '<dt>Secure context</dt><dd>'+yn(window.isSecureContext !== false)+'</dd>'
          + '<dt>getUserMedia</dt><dd>'+yn(!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia))+'</dd>'
          + '<dt>navigator.xr</dt><dd>'+yn(!!navigator.xr)+'</dd>'
          + '<dt>DeviceOrientation</dt><dd>'+yn(typeof window.DeviceOrientationEvent !== "undefined")+'</dd>'
          + '<dt>iOS motion gate</dt><dd>'+yn(!!(window.DeviceOrientationEvent && typeof window.DeviceOrientationEvent.requestPermission === "function"))+'</dd>'
          + '<dt>Geolocation</dt><dd>'+yn(!!navigator.geolocation)+'</dd>'
          + '<dt>Screen angle</dt><dd class="num">'+arcScreenAngle()+'°</dd>'
          + '<dt>Origin</dt><dd class="mono" style="font-size:12px">'+esc(location.protocol+"//"+location.host)+'</dd>'
          + '<dt>Calibrations</dt><dd class="num">'+keys.length+'</dd>'
          + '</dl>'
          + (keys.length ? '<div class="hint" style="margin-top:8px">'+keys.map(function(k){
              return esc(k)+' → f '+Math.round(cal[k].f)+' px';
            }).join("<br>")+'</div>' : '')
          + '<div class="hint" style="margin-top:10px">A live probe (including whether <span class="mono">immersive-ar</span> '
          + 'is actually supported) runs when you open guided capture.</div>',
        actions:[{label:"Close", cls:"btn"}] });
      break;
    }
    case "approve":    doApprove(id); break;
    case "reject":     doReject(id); break;
    case "close":      doClose(id); break;
    case "assign":     doAssign(id); break;
    case "checkin":    doCheckIn(id); break;
    case "simcheckin": doSimCheckIn(id); break;
    case "startwork":  doStartWork(id); break;
    case "simafter":   doSimAfter(id); break;
    case "rmafter":    doRemoveAfter(id, Number(el.dataset.i)); break;
    case "submitexec": doSubmitExec(id); break;
    case "markread":   markNotifsRead(); break;
    case "opennotif": {
      const n = state.notifications.filter(x=>x.id===id)[0];
      if(n && !n.read){
        n.read = true;
        /* Only read_at is writable on a notification (niva_notifications_guard
           refuses everything else), and only on your own. Broadcasts to a role
           have no per-user read flag server-side, so those stay local. */
        if(n.targetUserId === me().id)
          Outbox.push("notif.read", { ids:[n.id], at:new Date().toISOString() }, { label:"Mark notification read" });
        save();
      }
      if(n){ closePops(); if(n.taskId) go("task",{id:n.taskId}); else render(); }
      break;
    }
    case "signout":    closePops(); closeModal(); doSignOut(); break;
    case "syncpanel":  closePops(); openSyncPanel(); break;
    case "resyncnow":  closePops(); Outbox.kick(); Poller.now(); toast("Refreshing from the server."); break;
    case "myheight":   closePops(); askHeight(true); break;
    case "clearlocal": closePops(); doClearLocal(); break;
    case "statemodal": {
      closePops();
      const key = cacheKey();
      const bytes = key ? (lsGet(key)||"").length : 0;
      const obytes = (lsGet(OUTBOX_KEY)||"").length;
      openModal({ title:"Local state",
        body:'<dl class="kv"><dt>Render cache</dt><dd class="mono" style="font-size:11.5px">'+esc(key||"—")+'</dd>'
          + '<dt>Tasks cached</dt><dd class="num">'+state.tasks.length+'</dd>'
          + '<dt>Notifications</dt><dd class="num">'+state.notifications.length+'</dd>'
          + '<dt>Audit events</dt><dd class="num">'+state.tasks.reduce((a,t)=>a+t.audit.length,0)+'</dd>'
          + '<dt>Cache payload</dt><dd class="num">'+(bytes/1024).toFixed(1)+' KB</dd>'
          + '<dt>Outbox</dt><dd class="num">'+Outbox.pending()+' queued · '+Outbox.failures().length+' failed · '+(obytes/1024).toFixed(1)+' KB</dd>'
          + '<dt>Photos held locally</dt><dd class="num">'+Blobs.keys().length+'</dd>'
          + '<dt>Last server read</dt><dd>'+(state.syncedAt?esc(fmtDT(state.syncedAt)):"never")+'</dd>'
          + '<dt>Project</dt><dd class="mono" style="font-size:11.5px">'+esc(SB_BASE||"not configured")+'</dd></dl>'
          + '<div class="hint" style="margin-top:10px">The cache is a mirror of what the server let this account read. '
          + 'It is safe to clear — anything not yet synced is in the outbox, which is cleared separately and on purpose.</div>',
        actions:[{label:"Close", cls:"btn"}] });
      break;
    }
    case "scrim":      if(e.target === el) closeModal(); break;
    case "modalact": {
      const a = modalActions[Number(el.dataset.i)];
      if(a && a.act) a.act(); else closeModal();
      break;
    }
  }
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    if(ARC.open){ arcClose(); return; }
    closePops(); closeModal();
  }
});
let rzT = null;
window.addEventListener("resize", function(){
  clearTimeout(rzT); rzT = setTimeout(renderNav, 180);
});

/* ==========================================================
   18. Boot
   ------------------------------------------------------------
   Order matters here:
     1. restore the outbox, so queued work is known about before anything can
        add to it or clear it;
     2. pull locally-held photo bytes back into memory, so the first render of
        a task with un-uploaded captures shows the photographs and not a
        placeholder;
     3. restore the session from localStorage;
     4. render from the cache immediately — with no network, this is the whole
        app — and only then talk to the server.
   Nothing in steps 1–4 requires a connection.
   ========================================================== */
function boot(){
  state = blankState();

  if(!SB_CONFIGURED){
    /* Configuration state, not an error: no requests, no console output. */
    render();
    return;
  }

  Outbox.restore();
  Outbox.onChange(function(){ renderSyncChip(); });
  Session.onChange(function(st){
    renderGate(); renderSyncChip();
    /* A silent refresh can revive an expired session with no user action at
       all. The outbox parked itself when the token died, so wake it here —
       otherwise queued field work waits for a click that may never come. */
    if(st === "ready"){ Outbox.kick(); scheduleRender(); }
  });

  const hadSession = Session.restore();

  /* Ask the browser not to evict our IndexedDB under storage pressure. Purely
     best-effort — it is a request, not a guarantee, and nothing depends on it. */
  try{
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
  }catch(e){}

  Blobs.hydrate().then(function(){}, function(){}).then(function(){
    if(hadSession && Session.profile()){
      state = load();
      state.userId = Session.userId();
      view = { name: homeView(), params:{} };
      render();                    // cache first — usable with the radio off
      /* Only now, with the outbox restored AND the cache loaded, is it safe to
         say what is dead. Doing this before load() would sweep away the field
         workspace's un-submitted captures. */
      try{ Blobs.sweep(liveBlobKeys()); }catch(e){}
      legacyDataNotice();
      Outbox.kick();
      Poller.start();
      /* Refresh the profile too: a role can have been changed by an admin
         since this device last synced, and the cached copy must not outrank
         the server's. */
      Session.loadProfile().then(function(){ renderChrome(); maybeAskHeight(); }, function(){});
      Repo.refresh(true).then(function(){ render(); }, function(err){
        if(err && err.kind !== "auth" && err.kind !== "offline" && !state.everSynced)
          toast("Could not reach the server: " + errText(err), true);
        render();
      });
    }else{
      render();
    }
  });
}

/* Reconnect / visibility: drain the queue and catch up on other people's work
   the moment the device has a chance to. */
window.addEventListener("online", function(){
  renderSyncChip();
  if(signedIn()){ Outbox.kick(); Poller.now(); }
  toast("Back online — syncing.");
});
window.addEventListener("offline", function(){
  renderSyncChip();
  toast("Offline. Work is being saved on this device.", true);
});
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && signedIn()){ Outbox.kick(); Poller.now(); }
});
/* Last chance to flush the render cache (the outbox writes synchronously on
   every push, so it is already durable). */
window.addEventListener("pagehide", function(){ try{ save(); }catch(e){} });

/* An evidence object that 404s — the seed ships task_images metadata with no
   bytes — falls back to the procedural stand-in instead of a broken tile.
   `error` does not bubble, so this listens in the capture phase. */
window.addEventListener("error", function(e){
  const el = e && e.target;
  if(!el || el.tagName !== "IMG") return;
  const fb = el.getAttribute("data-fb");
  if(!fb || el.getAttribute("data-fb-used") === "1") return;
  el.setAttribute("data-fb-used", "1");
  try{ el.src = resolveImg(fb); }catch(err){}
}, true);

boot();

})();
