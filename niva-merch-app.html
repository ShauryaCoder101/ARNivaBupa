function arcNudgeNorm(){
  const f = arcDisplayFocalCss();
  if(!(f > 0)) return { ax:0, ay:0 };
  return { ax: ARC.nudge.x/f, ay: ARC.nudge.y/f };
}

function arcTick(){
  if(!ARC.open) return;
  if(ARC.panel) { arcDrawOverlay(null); return; }
  /* Two measurement sources, ONE gate. Whichever one runs, it writes the same
     ARC.meas fields and everything downstream — arcGates, the ruler, the arming
     ring, the shutter, arcBuildRecord — is unchanged and unaware. */
  if(ARC.tier === "B"){
    if(ARC.mode === "floor"){ floorStep(); floorMeasure(); }
    else { ARC.meas.heldMs = null; ARC.meas.floorReading = null; arcDetStep(); arcMeasureTierB(); }
  }
  const g = arcGates();
  ARC.lastGates = g;

  // arming: gates must hold continuously
  const now = Date.now();
  if(g.all){
    if(!ARC.armT0) ARC.armT0 = now;
  } else {
    ARC.armT0 = 0;
  }
  const held = ARC.armT0 ? (now - ARC.armT0) : 0;
  const prog = clamp(held/ARM_MS, 0, 1);
  ARC.armed = prog >= 1;

  arcRenderHud(g, prog);
  arcDrawOverlay(g);
}

/* ==========================================================
   THE FIELD BUILD OF THE CAPTURE SCREEN
   ------------------------------------------------------------
   Two steps and nothing else.

     STEP 1 — MEASURE.  Camera view, ONE horizontal line, ONE button. Stand
       square to the wall, hold the phone up at neck level, put the line where
       the wall meets the floor, press. That press captures the depression angle
       and solves d = h / tan θ.

     STEP 2 — FRAME.  Straighten the phone up without moving your feet. The
       poster is drawn on the wall at its true size. One button takes the photo.

   Between them, one plain line says whether they are standing in the right
   place. Warnings appear only when something is actually wrong.

   WHY THE HOLD INSTRUCTION IS PART OF THE MEASUREMENT, not decoration:
   h is derived as stature × HOLD_RATIO, and HOLD_RATIO describes a POSTURE
   (neck/shoulder level, 0.82 of stature). The number is only worth its ± 4 %
   because the person was told where to hold the phone. Removing the instruction
   would not make the screen simpler, it would make the distance a guess — so
   the instruction and the little figure beside it are shown on every capture,
   not once during onboarding. See HOLD_RATIO in section 1.

   WHY PRESSING "MEASURE" IS ALSO THE SQUARENESS ATTESTATION:
   floor-line trigonometry measures distance and nothing else, and a bare wall
   has no keystone to read yaw from, so squareness can only ever be stated. The
   old screen asked for it in a separate permanent red panel ("CAN'T TELL IF
   YOU'RE SQUARE ON") that a merchandiser had to dismiss on every capture. Here
   the step-1 instruction says "stand square to the wall" and pressing the
   button after reading it is the statement. The record is unchanged and still
   honest: yaw_verified stays false, yawAssumed stays true, and the placement
   note still says the squareness was confirmed by eye and not measured. */
function arcFieldUI(){ return myRole() === "Merchandiser"; }

/* A stick figure holding a phone level with its neck, with a dashed datum line
   through both. Inline because there is no asset pipeline and no CDN. */
const HOLD_CUE_SVG =
  '<svg class="cue" viewBox="0 0 30 40" fill="none" stroke="currentColor" stroke-width="1.5" '
  + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<circle cx="9" cy="6.5" r="4"/>'
  + '<path d="M9 10.5v12"/>'
  + '<path d="M9 22.5l-3.5 11M9 22.5l3.5 11"/>'
  + '<path d="M9 14h5.5l3-1.5"/>'
  + '<rect x="17.5" y="9" width="7.5" height="10.5" rx="1.4"/>'
  + '<path d="M2 14h26" stroke-dasharray="2 2.5" opacity=".55"/>'
  + '</svg>';

/* The tilt/roll gates, said the way a person holding a phone would say them.
   Returns [] when nothing is wrong, which is the only time they are shown. */
function arcPlainAttitude(g){
  const w = [];
  if(g.pitch == null || g.roll == null){
    w.push("This phone is not telling the app how it is being held.");
    return w;
  }
  if(!g.pitchOk) w.push(g.pitch < 0
    ? "The phone is leaning forward — bring the top of it back towards you."
    : "The phone is leaning back — tip the top of it away from you.");
  if(!g.rollOk) w.push("The phone is tipped to one side — level it up.");
  return w;
}
/* Why there is no reading, in words a merchandiser can act on. */
function arcPlainFloorWhy(f){
  switch(f.code){
    case "nosensor": return "This phone has not given the app a tilt reading yet.";
    case "up":       return "Tilt the phone down — the line is above the floor.";
    case "shallow":  return "Tilt further down, until the line sits right where the wall meets the floor.";
    case "steep":    return "That is the floor by your own feet — raise the phone a little.";
    case "moving":   return "Hold still for a moment.";
    case "range":    return "That does not look like the bottom of a wall — check the line is on the join.";
    default:         return "Put the line where the wall meets the floor.";
  }
}

function arcRenderSimple(g, prog){
  const t = ARC.task;
  const f = ARC.floor;
  const floorMode = (ARC.tier === "B" && ARC.mode === "floor");
  const measuring = floorMode && f.step === "measure";
  const hint = arcEl("arSimpleHint"), warnEl = arcEl("arSimpleWarn"),
        btn  = arcEl("arSimpleBtn"),  foot   = arcEl("arSimpleFoot"),
        alt  = arcEl("arSimpleAlt"),  dEl    = arcEl("arDist"),
        seeEl = arcEl("arSee");
  const fit = g.fit;
  const marking = !!ARC.wall.on;

  /* ---- the one line about where they are standing ---- */
  if(dEl){
    if(g.distance == null){
      /* No number, so no line about the number. Whatever is wrong is already
         being said once, in the warning slot, and saying "no distance yet"
         underneath it is the kind of duplication this screen exists to remove.
         The XR path is the exception: there "looking for the wall" is an
         instruction (keep moving the phone), not a restatement. */
      const looking = (ARC.tier === "A");
      dEl.className = "arstat";
      dEl.style.display = looking ? "" : "none";
      dEl.innerHTML = looking ? "Looking for the wall — move the phone slowly" : "";
    } else {
      dEl.style.display = "";
      /* MOCKUP: the line is derived from the poster, so it can say WHY. "Move
         back 0.9 ft" was an instruction to hit a number nobody could see; "you
         can only see 7.8 ft of wall" is the reason, in the unit the merchandiser
         is standing in. VERIFICATION keeps the ± band verbatim — there the
         number IS the spec. */
      const useFit = MOCKUP && fit && fit.view;
      const ok = useFit ? fit.view.fits : (Math.abs(g.delta) <= t.standoffTolFt);
      dEl.className = "arstat " + (ok ? "ok" : "no");
      /* A HELD reading is not a live one, and the field build must not let the
         big green number imply the phone is still looking at the floor. Same
         tag the instrument panel uses, worded for someone standing in a shop.
         The moment it goes stale or they take a step, floorHoldState pulls the
         distance out from under this and the warning slot says why. */
      const held = (ARC.meas.heldMs != null)
        ? '<span class="heldtag">MEASURED A MOMENT AGO</span> ' : '';
      let dTxt;
      if(useFit){
        const v = fit.view;
        dTxt = v.fits
          ? "Good spot — you are " + g.distance.toFixed(1) + " ft back"
          : (v.limit === "width"
              ? "Move back — from here you can only see "
                + fmtRoughFt(v.visibleWFt, fit.seeWSigma) + " ft of wall"
              : "Move back — from here you can only see "
                + fmtRoughFt(v.visibleHFt, fit.seeHSigma) + " ft of wall top to bottom");
      } else {
        dTxt = ok
          ? "Good spot — you are " + g.distance.toFixed(1) + " ft back"
          : (g.delta < 0 ? "Move back " + Math.abs(g.delta).toFixed(1) + " ft"
                         : "Move in "   + g.delta.toFixed(1) + " ft");
      }
      dEl.innerHTML = held + esc(dTxt);
    }
  }

  /* ---- the ONE extra line the fit maths earns ----
     Either how much wall is in view, or — when it is not enough — where to
     stand so the poster fits. Never both: one short sentence, plain text, no
     chip and no diagnostic strip. "about" is not politeness; on an
     uncalibrated phone the focal term alone is ± 12 %, and fmtRoughFt rounds
     the figure to a step no finer than its own error bar so the sentence
     cannot claim precision the measurement chain does not have. */
  if(seeEl){
    let seeTxt = "";
    if(fit){
      if(g.distance != null && fit.view && (!MOCKUP || fit.view.fits)){
        seeTxt = (MOCKUP && fit.preview && !fit.preview.fits)
          ? ("Off the edges of the screen, but still in the photo — step back to about "
             + fmtRoughFt(fit.recommendedFt, fit.recSigma) + " ft.")
          : ("You can see about " + fmtRoughFt(fit.view.visibleWFt, fit.seeWSigma)
             + " × " + fmtRoughFt(fit.view.visibleHFt, fit.seeHSigma)
             + " ft of wall from here.");
      } else if(MOCKUP && isFinite(fit.recommendedFt)){
        seeTxt = "For a " + t.widthFt + " × " + t.heightFt + " ft poster, stand about "
               + fmtRoughFt(fit.recommendedFt, fit.recSigma) + " ft back.";
      }
    }
    if(seeEl.dataset.h !== seeTxt){ seeEl.dataset.h = seeTxt; seeEl.textContent = seeTxt; }
  }

  /* ---- the instruction ---- */
  let hintHtml = "";
  if(marking){
    hintHtml = '<span>Drag the two upright lines onto the <b>left and right edges of the wall</b>. '
      + 'If the height is tight, drag the top and bottom ones onto the ceiling and the skirting.</span>';
  } else if(measuring){
    hintHtml = HOLD_CUE_SVG
      + '<span>Stand square to the wall and <b>hold the phone up at neck level</b>. '
      + 'Tilt it down until the line sits where the wall meets the floor, then press Measure.</span>';
  } else if(floorMode){
    hintHtml = '<span>Now <b>straighten the phone up</b> without moving your feet. '
      + 'The poster is drawn on the wall at its real size.</span>';
  } else if(ARC.tier === "A"){
    hintHtml = '<span>Point at the empty wall and walk to where the line above tells you. '
      + 'Hold the phone straight and the poster appears at its real size.</span>';
  } else {
    /* Which rectangle to point at is an INSTRUCTION, not the preset chip the
       field build removed: that chip said "a4 sheet 210 x 297 mm - taped flat"
       on every frame, forever. This says it once, in the words that tell them
       where to look, and follows whatever reference is actually in force - the
       installed poster on a verification after-shot, the taped sheet otherwise. */
    const refWord = (ARC.refPreset === "poster") ? "the poster on the wall" : "the A4 sheet";
    hintHtml = '<span>Keep all of ' + refWord + ' in shot and hold the phone straight. '
      + 'The poster is drawn at its real size once you are in the right spot.</span>';
  }
  if(hint && hint.dataset.h !== hintHtml){ hint.dataset.h = hintHtml; hint.innerHTML = hintHtml; }

  /* ---- warnings: only what is wrong, right now ---- */
  const warn = [];
  const footBtns = [];
  if(marking && g.distance == null) warn.push("The measurement no longer holds — measure again.");
  /* iOS will not hand out DeviceOrientation without a user gesture, and the
     gesture has to be a real tap on a real button. Without this the field build
     would be a dead end on every iPhone, so it is the one control that survives
     in both steps — and it disappears the moment the sensors are live. */
  if(!ARC.sensors.on && ARC.tier !== "A")
    footBtns.push('<button class="arbtn pe on" data-arc="sensors">Turn on the motion sensors</button>');
  if(measuring){
    if(!f.live) warn.push(arcPlainFloorWhy(f));
  } else {
    if(floorMode && g.distance == null){
      /* HELD went stale or they walked. floorHoldState already worked out
         which; say it in one clause and offer the only useful action. */
      warn.push(f.state === "moved" ? "You moved — measure again."
              : f.state === "stale" ? "That measurement is too old — measure again."
              : "The measurement no longer holds — measure again.");
    } else if(floorMode && f.warn){
      warn.push(f.warn);
    }
    arcPlainAttitude(g).forEach(function(s){ warn.push(s); });
    if(!ARC.assumeLevel && (g.pitch == null || g.roll == null))
      footBtns.push('<button class="arbtn pe" data-arc="assume">I am holding it straight</button>');
    /* Only offered while the DETECTOR is the thing that is failing. Once they
       are dragging the four handles themselves, offering to hand them the
       handles again is noise. */
    if(!floorMode && ARC.tier === "B" && ARC.mode === "auto" && !ARC.det.locked)
      footBtns.push('<button class="arbtn pe" data-arc="detmanual">Outline it by hand</button>');
  }
  /* The height in force, said once and QUIETLY — and only while it is the
     stated default, which is the one case the merchandiser can fix. It goes in
     the footer rather than the amber warning, because it is a standing caveat
     about accuracy and not something to do right now; mixing it into the
     warning line would bury the instruction that IS urgent. */
  if(floorMode && f.hSrcKey === "default"){
    footBtns.push('<span class="rough">Sizes are rough — the app is guessing how high you hold the phone.</span>'
      + '<button class="arbtn pe on" data-arc="askheight">Tell it my height</button>');
  }
  const warnHtml = warn.length ? esc(warn.join(" ")) : "";
  if(warnEl && warnEl.dataset.h !== warnHtml){ warnEl.dataset.h = warnHtml; warnEl.innerHTML = warnHtml; }
  const footHtml = footBtns.join("");
  if(foot && foot.dataset.h !== footHtml){ foot.dataset.h = footHtml; foot.innerHTML = footHtml; }

  /* ---- the one button ---- */
  if(btn){
    let label, act, on, p = 0;
    if(marking){
      /* The wall-marking detour borrows the one button rather than adding a
         second: the flow is still measure, then frame, then shoot. */
      label = "Check the fit"; act = "wallcheck";
      on = !!(g.distance != null && ARC.wall.movedX);
    } else if(measuring){
      /* THE WALKING HAPPENS HERE, while the reading is LIVE and the floor line
         is still in view — that is the one moment the distance responds to the
         merchandiser's feet. So the button waits for them to be in the band
         rather than letting them freeze a reading they will then be told to
         walk away from. The line above ("Move back 0.9 ft") is what they act
         on; this button simply is not offered until it says they are there. */
      label = "Measure"; act = "floormeasure"; on = !!(f.live && g.distOk);
    } else if(floorMode && g.distance == null){
      label = "Measure again"; act = "floorremeasure"; on = true;
    } else {
      label = "Take the photo"; act = "shoot"; on = !!ARC.armed; p = prog;
    }
    if(btn.dataset.l !== label){ btn.dataset.l = label; btn.textContent = label; }
    if(btn.dataset.arc !== act) btn.dataset.arc = act;
    btn.disabled = !on;
    btn.style.setProperty("--p", (p*100).toFixed(0) + "%");
  }

  /* ---- the fallback, one unobtrusive line, only where it applies ----
     Two-way, because a merchandiser who taps it by mistake would otherwise be
     stuck taping paper to a wall for the rest of the capture: the only other
     route back is the mode buttons, and those are exactly what the field build
     removed. Never a co-equal choice — one underlined line, and only on the
     phones that have no ARCore. */
  let altTxt = "", altAct = "floorfallback";
  if(marking){
    altTxt = "Cancel"; altAct = "wallcancel";
  } else if(floorMode && (measuring || !MOCKUP)){
    altTxt = "Can’t see where the wall meets the floor?";
  } else if(floorMode){
    /* STEP 2 ONLY, and still exactly one underlined line — the same
       presentation the A4 fallback gets, because it is the same kind of thing:
       an escape hatch most captures never need. The A4 fallback is about
       MEASURING and belongs to step 1, where it stays; "Measure again" is the
       route back to it from here. */
    altTxt = "Check the wall is wide enough"; altAct = "wallmark";
  } else if(MOCKUP && ARC.tier === "B"){
    altTxt = "Back to measuring off the floor";
    altAct = "modefloor";
  }
  if(alt && alt.dataset.h !== altTxt){
    alt.dataset.h = altTxt;
    alt.textContent = altTxt;
    alt.dataset.arc = altAct;
    alt.style.display = altTxt ? "" : "none";
  }
}

function arcRenderHud(g, prog){
  const t = ARC.task;
  const simple = arcFieldUI();
  const hud = arcEl("arHud");
  if(hud) hud.classList.toggle("simple", simple);
  const n1 = v => (v==null||!isFinite(v)) ? "—" : Number(v).toFixed(1);
  const tierKey = arcTierKey();
  const tm = tierMeta(tierKey);
  const badge = arcEl("arTier");
  if(badge && !simple){
    badge.className = "tierbadge " + tm.cls;
    /* Tier letters are a reviewer's vocabulary. The person holding the phone is
       told what the phone is doing instead. The tier itself is unchanged and
       still lands on the placement row. */
    /* Tier Be is reached two different ways now — an assumed focal length, and
       floor-line trigonometry — and they do not deserve the same words. The
       tier letter on the record is untouched either way. */
    const floorNow = (ARC.tier === "B" && ARC.mode === "floor");
    badge.textContent = (myRole() === "Merchandiser")
      ? (floorNow
          ? (ARC.floor.calibrated ? "Measuring off the floor" : "Rough — height not set")
          : (TIER_FIELD_LABEL[tierKey] || TIER_FIELD_LABEL.C))
      : (floorNow ? tm.label + " · floor-line" : tm.label);
  }

  // distance
  const dEl = arcEl("arDist");
  /* The error bar is derived per reading (focal uncertainty + the reference's
     own dimensional tolerance + measured corner scatter + how far off-axis the
     reference sits), so it moves as the merchandiser moves. It is shown next to
     the number rather than buried, because a ±1 % reading and a ±9 % reading
     look identical otherwise. */
  const err = ARC.meas.refError;
  const eTxt = err ? ('  ·  ± ' + err.pct.toFixed(1) + '%') : '';
  if(dEl && !simple){
    dEl.style.display = "";
    if(g.distance == null){
      dEl.className = "arstat";
      dEl.innerHTML = (ARC.tier === "A" ? "LOOKING FOR THE WALL — move the phone slowly" : "NO READING")
        + '<span class="sub">'+esc(ARC.meas.distSrc || "")+'</span>';
    } else if(Math.abs(g.delta) <= t.standoffTolFt){
      dEl.className = "arstat ok";
      dEl.innerHTML = "DISTANCE OK — " + g.distance.toFixed(1) + " ft"
        + '<span class="sub">target ' + Number(t.standoffFt).toFixed(1) + ' ± ' + t.standoffTolFt + ' ft' + eTxt + '</span>';
    } else if(g.delta < 0){
      dEl.className = "arstat no";
      dEl.innerHTML = "TOO CLOSE — move back " + Math.abs(g.delta).toFixed(1) + " ft"
        + '<span class="sub">' + g.distance.toFixed(1) + ' ft of ' + Number(t.standoffFt).toFixed(1) + ' ft' + eTxt + '</span>';
    } else {
      dEl.className = "arstat no";
      dEl.innerHTML = "TOO FAR — move in " + g.delta.toFixed(1) + " ft"
        + '<span class="sub">' + g.distance.toFixed(1) + ' ft of ' + Number(t.standoffFt).toFixed(1) + ' ft' + eTxt + '</span>';
    }
    /* A HELD reading is not a live one, and the big number must never imply it
       is. The tag rides on the same row so it cannot be missed, and the sub-line
       says how long ago the phone was actually aimed at the floor. */
    if(ARC.meas.heldMs != null && g.distance != null){
      dEl.innerHTML = '<span class="heldtag">HELD ' + Math.round(ARC.meas.heldMs/1000) + ' s AGO</span> '
        + dEl.innerHTML;
    }
  }
  // ruler
  const lo = 0, hi = Math.max(t.standoffFt*2, t.standoffFt + 4);
  const pct = v => clamp((v - lo)/(hi - lo), 0, 1)*100;
  const band = simple ? null : arcEl("arRulerBand");
  if(band){
    const a = pct(t.standoffFt - t.standoffTolFt), b = pct(t.standoffFt + t.standoffTolFt);
    band.style.left = a.toFixed(2)+"%"; band.style.width = Math.max(1.2, b-a).toFixed(2)+"%";
  }
  const ticks = simple ? null : arcEl("arRulerTicks");
  if(ticks && ticks.dataset.built !== "1"){
    let h = "";
    for(let v=0; v<=hi; v+=(hi>14?4:2)){
      h += '<i style="left:'+pct(v).toFixed(2)+'%"></i><span style="left:'+pct(v).toFixed(2)+'%">'+v+'</span>';
    }
    ticks.innerHTML = h; ticks.dataset.built = "1";
  }
  const nd = simple ? null : arcEl("arNeedle");
  if(nd) nd.style.left = (g.distance == null ? 50 : pct(g.distance)).toFixed(2)+"%";

  // angles
  const setStat = function(id, ok, text, sub){
    const el = simple ? null : arcEl(id); if(!el) return;
    el.className = "arstat " + (ok === null ? "" : (ok ? "ok" : "no"));
    el.innerHTML = esc(text) + (sub ? '<span class="sub">'+esc(sub)+'</span>' : "");
  };
  if(g.pitch == null) setStat("arPitch", null, "TILT — no sensor", ARC.sensors.on?"":"tap Enable motion sensors");
  else if(g.pitchOk)  setStat("arPitch", true, "LEVEL " + n1(g.pitch) + "°");
  else setStat("arPitch", false, (g.pitch < 0 ? "TILTED FORWARD " : "TILTED BACK ") + Math.abs(g.pitch).toFixed(0) + "° — straighten up");

  if(g.roll == null) setStat("arRoll", null, "ROLL — no sensor");
  else if(g.rollOk)  setStat("arRoll", true, "ROLL " + n1(g.roll) + "°");
  else setStat("arRoll", false, "ROLLED " + Math.abs(g.roll).toFixed(0) + "° — level the phone");

  const pfy = (myRole() === "Merchandiser");
  const floorMode = (ARC.tier === "B" && ARC.mode === "floor");
  if(!g.yawVerified && g.yawAssumed) setStat("arYaw", true,
    pfy ? "FACING THE WALL — you said so" : "SQUARE — stated, not measured",
    pfy ? "nothing on the wall to check it against" : "yaw_verified = false on the record");
  else if(!g.yawVerified) setStat("arYaw", null,
    pfy ? "CAN'T TELL IF YOU'RE SQUARE ON" : "YAW UNVERIFIED",
    floorMode
      ? (pfy ? "confirm it below once you're square" : "unmeasurable on a bare wall — confirm by eye")
      : ARC.tier === "B"
        ? (pfy ? "mark all 4 corners and it can" : "switch to 4-handle quad mode to check")
        : (pfy ? "still looking for the wall"    : "no wall plane yet"));
  else if(g.yawOk)   setStat("arYaw", true, (pfy ? "STRAIGHT ON " : "SQUARE ") + n1(g.yaw) + "°");
  else setStat("arYaw", false, (pfy ? "AT AN ANGLE " : "OFF-AXIS ") + Math.abs(g.yaw).toFixed(0)
    + "° — move round so you face the wall");

  // bubble level
  const bub = simple ? null : arcEl("arBubble");
  if(bub){
    const rng = Math.max(12, t.angleTolDeg*4);
    const bx = clamp((g.roll  || 0)/rng, -1, 1) * 34;
    const by = clamp(-(g.pitch || 0)/rng, -1, 1) * 34;
    bub.style.transform = "translate(" + bx.toFixed(1) + "px," + by.toFixed(1) + "px)";
    bub.className = (g.pitchOk && g.rollOk) ? "ok" : "";
  }
  // arming ring + shutter
  const C = 2*Math.PI*35;
  const arm = simple ? null : arcEl("arArm");
  const prg = arm ? arm.querySelector(".prg") : null;
  if(prg) prg.setAttribute("stroke-dashoffset", (C*(1-prog)).toFixed(1));
  const sh = simple ? null : arcEl("arShutter");
  if(sh){
    sh.disabled = !ARC.armed;
    sh.className = "pe" + (ARC.armed ? " armed" : "");
    sh.title = ARC.armed ? "Capture" : "Shutter locks until every gate holds for " + (ARM_MS/1000).toFixed(1) + " s";
  }
  // chips + tools
  const chips = simple ? null : arcEl("arChips");
  if(chips){
    const bits = [];
    bits.push('<span class="archip">f ' + (ARC.tier==="A"
      ? (ARC.xr.focalPx ? Math.round(ARC.xr.focalPx)+" px · XR proj" : "XR")
      : (ARC.focal.f ? Math.round(ARC.focal.f)+" px" : "—")) + '</span>');
    if(ARC.tier === "A"){
      bits.push('<span class="archip">hit-test</span>');
      if(ARC.xr.depth) bits.push('<span class="archip">depth</span>');
      if(ARC.xr.anchors) bits.push('<span class="archip">anchors</span>');
    }
    if(ARC.tier === "B" && ARC.mode === "floor"){
      bits.push('<span class="archip">h ' + ARC.floor.hM.toFixed(2) + ' m'
        + (ARC.floor.calibrated ? '' : ' (default)') + '</span>');
      bits.push('<span class="archip">θ '
        + (ARC.floor.theta == null ? '—' : ARC.floor.theta.toFixed(1) + '°') + '</span>');
    }
    else if(ARC.tier === "B") bits.push('<span class="archip">' + esc(arcRefDef().label) + '</span>');
    if(ARC.tier === "B" && ARC.mode === "auto" && ARC.det.passes){
      bits.push('<span class="archip">detect ' + Math.round(ARC.det.meanMs) + ' ms · '
        + ARC.det.workW + '×' + ARC.det.workH + ' · ' + ARC.det.fps + ' fps'
        + (ARC.det.degraded ? ' ↓' : '') + '</span>');
    }
    if(ARC.sensors.on) bits.push('<span class="archip">' + esc(ARC.sensors.src) + '</span>');
    bits.push('<span class="archip">screen ' + arcScreenAngle() + '°</span>');
    chips.innerHTML = bits.join("");
  }
  arcRenderDetBar();
  if(simple){ arcRenderSimple(g, prog); return; }
  const tools = arcEl("arTools");
  const attitudeLive = (g.pitch != null && g.roll != null && !g.attitudeAssumed);
  const key = [ARC.tier, ARC.mode, ARC.sensors.on?1:0, ARC.assumeLevel?1:0,
               attitudeLive?1:0, ARC.focal.estimated?1:0,
               ARC.assumeSquare?1:0, ARC.floor.calibrated?1:0].join("|");
  if(tools && tools.dataset.tier !== key){
    tools.dataset.tier = key;
    let h = "";
    /* Same controls, same handlers; only the words change for the field. */
    const pf = (myRole() === "Merchandiser");
    if(!ARC.sensors.on && ARC.tier !== "A") h += '<button class="arbtn pe" data-arc="sensors">Enable motion sensors</button>';
    if(!attitudeLive) h += '<button class="arbtn pe'+(ARC.assumeLevel?" on":"")+'" data-arc="assume">'
      + (pf ? "I am holding it straight" : "Assume level (not verified)") + '</button>';
    if(ARC.tier === "B"){
      /* Floor-line first, because on a phone with no ARCore pointed at an empty
         wall it is the method that needs nothing carried to site. */
      h += '<button class="arbtn pe'+(ARC.mode==="floor"?" on":"")+'" data-arc="modefloor">'
        + (pf ? "Measure off the floor" : "Floor-line (no reference)") + '</button>';
      if(ARC.mode === "floor"){
        h += '<button class="arbtn pe'+(ARC.assumeSquare?" on":"")+'" data-arc="square">'
          + (pf ? "I'm facing the wall" : "Square by eye") + '</button>';
        h += '<button class="arbtn pe" data-arc="floorcal">'
          + (pf ? (ARC.floor.calibrated ? "Redo my height" : "Set my height — sizes are rough")
                : (ARC.floor.calibrated ? "Re-calibrate height" : "Calibrate height — default in use")) + '</button>';
      }
      if(ARC.mode !== "floor"){
        h += '<button class="arbtn pe'+(ARC.mode==="auto"?" on":"")+'" data-arc="modeauto">'
          + (pf ? "Find it for me" : "Auto-detect") + '</button>';
        h += '<button class="arbtn pe'+(ARC.mode==="two"?" on":"")+'" data-arc="mode2">'
          + (pf ? "Mark 2 points" : "2-handle") + '</button>';
        h += '<button class="arbtn pe'+(ARC.mode==="quad"?" on":"")+'" data-arc="mode4">'
          + (pf ? "Mark 4 corners" : "4-handle quad") + '</button>';
        h += '<button class="arbtn pe" data-arc="refpick">'
          + (pf ? "Change what I am using" : "Reference…") + '</button>';
      }
      /* In floor mode the lens plays no part in the DISTANCE; it only scales the
         poster that gets drawn. Saying "sizes are rough" there would point at
         the wrong calibration. */
      h += '<button class="arbtn pe" data-arc="calib">'
        + (ARC.mode === "floor"
            ? (pf ? (ARC.focal.estimated ? "Sharpen the poster size" : "Redo the camera setup")
                  : (ARC.focal.estimated ? "Calibrate lens (overlay scale only)" : "Re-calibrate lens"))
            : (pf ? (ARC.focal.estimated ? "Set this phone up — sizes are rough" : "Set this phone up again")
                  : (ARC.focal.estimated ? "Calibrate — readings are estimated" : "Re-calibrate"))) + '</button>';
    }
    h += '<button class="arbtn pe" data-arc="recentre">Re-centre poster</button>';
    tools.innerHTML = h;
  }
}

/* ---------- a synthetic frame with a rectangle at a KNOWN pose ----------
   Used by the geometry self-test (which asserts that the recovered distance and
   yaw match the ones it rendered) and by the on-device benchmark (which needs a
   realistic edge structure to time, and cannot assume a camera is present).
   Corners are rendered with 3×3 supersampling, because the sub-pixel edge
   refinement is exactly the thing being measured and a hard-aliased edge would
   flatter it. Returns the ground-truth quad. */
function arcDetSynth(ws, o){
  const W = ws.w, H = ws.h;
  const q = GEO.posterQuad({
    focalPx: o.focalPx, cx: W/2, cy: H/2,
    u0: W/2 + (o.uOff||0), v0: H/2 + (o.vOff||0),
    distance: o.distFt, widthFt: o.wFt, heightFt: o.hFt,
    yawDeg: o.yawDeg||0, pitchDeg: o.pitchDeg||0, rollDeg: o.rollDeg||0
  });
  const fg = o.fg == null ? 225 : o.fg, bg = o.bg == null ? 70 : o.bg;
  const rnd = mulberry(o.seed || 7);
  const L = ws.luma;
  for(let i=0; i<W*H; i++){
    const v = bg + (o.noise ? (rnd()*2-1)*o.noise : 0);
    L[i] = v;
  }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for(let i=0; i<4; i++){
    x0 = Math.min(x0, q[i][0]); x1 = Math.max(x1, q[i][0]);
    y0 = Math.min(y0, q[i][1]); y1 = Math.max(y1, q[i][1]);
  }
  x0 = clamp(Math.floor(x0)-2, 0, W-1); x1 = clamp(Math.ceil(x1)+2, 0, W-1);
  y0 = clamp(Math.floor(y0)-2, 0, H-1); y1 = clamp(Math.ceil(y1)+2, 0, H-1);
  const inside = function(x, y){
    let sign = 0;
    for(let i=0; i<4; i++){
      const a = q[i], b = q[(i+1)&3];
      const cr = (b[0]-a[0])*(y-a[1]) - (b[1]-a[1])*(x-a[0]);
      if(cr === 0) continue;
      const sg = cr > 0 ? 1 : -1;
      if(sign === 0) sign = sg; else if(sg !== sign) return false;
    }
    return true;
  };
  for(let y=y0; y<=y1; y++){
    for(let x=x0; x<=x1; x++){
      let acc = 0;
      for(let sy=0; sy<3; sy++) for(let sx=0; sx<3; sx++){
        if(inside(x + (sx+0.5)/3, y + (sy+0.5)/3)) acc++;
      }
      if(!acc) continue;
      const a = acc/9;
      L[y*W+x] = bg + (fg-bg)*a + (o.noise ? (rnd()*2-1)*o.noise : 0);
    }
  }
  // clutter the detector must not prefer
  if(o.clutter){
    for(let k=0; k<o.clutter; k++){
      const cx0 = Math.floor(rnd()*W*0.9), cy0 = Math.floor(rnd()*H*0.9);
      const cw = 8 + Math.floor(rnd()*60), ch = 4 + Math.floor(rnd()*40);
      const v = Math.floor(rnd()*90);
      for(let y=cy0; y<Math.min(H, cy0+ch); y++)
        for(let x=cx0; x<Math.min(W, cx0+cw); x++) L[y*W+x] = v;
    }
  }
  return q;
}

/* Times the real detector on THIS device, on a frame we control, so the
   ms-per-pass number in the diagnostics panel is a measurement rather than a
   claim — and so it can be read on a phone that has no camera permission yet. */
function arcDetBenchmark(){
  const cls = arcDeviceClass();
  const prof = arcDetProfile(cls, 0);
  const W = (prof.work >> 1) << 1, H = ((Math.round(prof.work*9/16)) >> 1) << 1;
  const ws = new DET.Workspace();
  ws.fit(W, H);
  const f = GEO.focalFromFov(W, ASSUMED_HFOV_DEG);
  arcDetSynth(ws, { focalPx:f, distFt:6, wFt:4, hFt:3, yawDeg:12, noise:4, clutter:4, seed:23 });

  /* A pass is not just the maths. Every real pass also pays a drawImage from
     the video plus a getImageData off the 2D context, and on weak hardware that
     readback is frequently the LARGER half. Benchmarking only DET would produce
     a comfortable number that the live loop then fails to reproduce, so the
     synthetic frame is pushed through a real canvas round-trip here — exactly
     what arcDetStep() times — and both halves are reported separately so a slow
     phone's actual bottleneck is identifiable. */
  const src = document.createElement("canvas");
  src.width = W; src.height = H;
  const sctx = src.getContext("2d");
  const id = sctx.createImageData(W, H);
  for(let i=0, j=0; i<W*H; i++, j+=4){
    const v = ws.luma[i];
    id.data[j] = v; id.data[j+1] = v; id.data[j+2] = v; id.data[j+3] = 255;
  }
  sctx.putImageData(id, 0, 0);

  const work = document.createElement("canvas");
  work.width = W; work.height = H;
  const wctx = work.getContext("2d", { willReadFrequently:true, alpha:false });
  const out = new Float64Array(8);
  const one = function(){
    const t0 = arcNow();
    wctx.drawImage(src, 0, 0, W, H);
    const img = wctx.getImageData(0, 0, W, H);
    DET.lumaFromRGBA(img.data, ws.luma, W*H);
    const t1 = arcNow();
    const r = DET.detect(ws, { aspect:4/3, focalPx:f, cx:W/2, cy:H/2 });
    if(r && r.quad) DET.refine(ws.luma, W, H, r.quad, out, ws, {});
    const t2 = arcNow();
    return { ms: t2 - t0, read: t1 - t0, comp: t2 - t1, hit: !!(r && r.quad) };
  };
  for(let i=0; i<4; i++) one();                   // let the JIT settle
  const times = [], reads = [], comps = [];
  let hits = 0;
  for(let i=0; i<24; i++){
    const r = one();
    times.push(r.ms); reads.push(r.read); comps.push(r.comp);
    if(r.hit) hits++;
  }
  const med = a => { const b = a.slice().sort(function(x,y){ return x-y; }); return b[Math.floor(b.length/2)]; };
  const sorted = times.slice().sort(function(a,b){ return a-b; });
  const m = med(times);
  ARC.det.bench = {
    cls: cls, w: W, h: H, detectW: W>>1, detectH: H>>1, runs: times.length, hits: hits,
    median: +m.toFixed(2), p90: +sorted[Math.floor(sorted.length*0.9)].toFixed(2),
    min: +sorted[0].toFixed(2), max: +sorted[sorted.length-1].toFixed(2),
    readbackMs: +med(reads).toFixed(2), computeMs: +med(comps).toFixed(2),
    fps: prof.fps, budget: DET_BUDGET_MS,
    headroom: +(DET_BUDGET_MS/Math.max(m, 0.01)).toFixed(2), ts: new Date().toISOString()
  };
  if(ARC.panel === "diag") arcDiagRender(null);
  toast("Detector benchmark: " + m.toFixed(1) + " ms median at " + W + "×" + H
    + " (budget " + DET_BUDGET_MS + " ms).", m > DET_BUDGET_MS);
  return ARC.det.bench;
}

/* The confirm / correct affordance. Rendered every tick but only written when
   the text actually changes — innerHTML on every frame would fight the
   compositor on exactly the phones this feature exists for. */
function arcRenderDetBar(){
  const box = arcEl("arDetBar");
  if(!box) return;
  const d = ARC.det;
  let html = "";
  if(ARC.tier === "B" && ARC.mode === "floor"){
    /* The floor-line status bar IS the diagnostic console the field build
       exists to get rid of — the ROUGH banner, the LIVE/HELD row with its error
       percentage, the squareness panel and the spelled-out fallback. In the
       field build every one of those facts is either shown as one plain line by
       arcRenderSimple or is not something a merchandiser can act on. Managers
       and admins keep the bar verbatim. */
    html = arcFieldUI() ? "" : floorBarHtml();
  } else if(ARC.tier === "B" && ARC.mode === "auto"){
    const pct = Math.round(d.conf*100);
    const meter = '<span class="conf'+(d.conf >= DET_LOCK_CONF ? ' hi' : '')+'">'
      + '<i style="width:'+clamp(pct,0,100)+'%"></i></span>';
    const barrel = (d.radial > BARREL_WARN_R);
    const pd = (myRole() === "Merchandiser");
    if(d.locked){
      html = '<div class="detrow">'+meter
        + '<span class="detmsg">'
        + (pd ? '<b>Locked on</b> · '+pct+'% sure'
              : '<b>Reference locked</b> · '+pct+'% · corners ± '
                + (d.cornerSigmaPx == null ? '—' : d.cornerSigmaPx.toFixed(2)+' px'))
        + '</span>'
        + '<button class="arbtn pe" data-arc="detmanual">Adjust by hand</button>'
        + '<button class="arbtn pe" data-arc="detdrop">'+(pd?"Look again":"Re-detect")+'</button></div>';
      if(barrel) html += '<div class="detrow"><span class="detmsg warn">'
        + '<b>Off-centre</b> — the reference is '+Math.round(d.radial*100)
        + '% of the way to the frame corner, where lens distortion adds error. '
        + 'Turn to put it nearer the middle.</span></div>';
    } else if(d.offered && d.cand){
      html = '<div class="detrow">'+meter
        + '<span class="detmsg"><b>Rectangle found</b> · '+pct+'% — is the outline on the '
        + esc(arcRefDef().label).toLowerCase()+'?</span>'
        + '<button class="arbtn pe on" data-arc="detconfirm">Use this</button>'
        + '<button class="arbtn pe" data-arc="detmanual">Adjust by hand</button>'
        + '<button class="arbtn pe" data-arc="detreject">No</button></div>';
    } else if(pd){
      /* Field build: the reference's catalogue label ("a4 sheet 210 × 297 mm —
         taped flat") is the preset chip in prose. The merchandiser was told
         which sheet to tape up on the screen before this one; here they only
         need to know what to point at. The "outline by hand" escape lives in
         the footer next to the button, not on a second row. */
      html = '<div class="detrow"><span class="detmsg">'
        + esc(d.note || ("Get all of " + (ARC.refPreset === "poster" ? "the poster" : "the sheet")
              + " in shot, well lit, and hold still.")) + '</span></div>';
    } else {
      html = '<div class="detrow"><span class="detmsg">'
        + esc(d.note || "Point the camera so the whole " + arcRefDef().label.toLowerCase()
              + " is in frame and well lit.")
        + '</span><button class="arbtn pe" data-arc="detmanual">Outline by hand</button></div>';
    }
  }
  if(box.dataset.h !== html){ box.dataset.h = html; box.innerHTML = html; }
}

/* ---------- overlay drawing ---------- */
function arcPosterGeometry(g, focalPx, cx, cy, uOff, vOff){
  const t = ARC.task;
  return GEO.posterQuad({
    focalPx: focalPx, cx: cx, cy: cy,
    u0: cx + (uOff||0), v0: cy + (vOff||0),
    distance: g.distance, widthFt: t.widthFt, heightFt: t.heightFt,
    yawDeg: g.yawVerified ? g.yaw : 0,
    pitchDeg: g.pitch || 0,
    rollDeg: g.roll || 0
  });
}
function arcDrawOverlay(g){
  const cv = ARC.canvas, ctx = ARC.ctx;
  if(!cv || !ctx) return;
  const st = arcEl("arStage");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = st.clientWidth, ch = st.clientHeight;
  if(cv.width !== Math.round(cw*dpr) || cv.height !== Math.round(ch*dpr)){
    cv.width = Math.round(cw*dpr); cv.height = Math.round(ch*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cw,ch);
  if(!g) return;

  // crosshair
  const ccx = cw/2 + ARC.nudge.x, ccy = ch/2 + ARC.nudge.y;
  ctx.save();
  ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(ccx-14, ccy); ctx.lineTo(ccx+14, ccy);
  ctx.moveTo(ccx, ccy-14); ctx.lineTo(ccx, ccy+14); ctx.stroke();
  ctx.restore();

  /* The reticle belongs to the measuring step. In the field build's framing step
     the phone is pointed at the wall and a line across the middle of the frame
     would be pointing at nothing. */
  const floorFraming = (ARC.mode === "floor" && ARC.tier === "B"
                        && arcFieldUI() && ARC.floor.step === "frame");
  if(ARC.mode === "floor" && ARC.tier === "B" && !floorFraming) floorDrawReticle(ctx, cw, ch, g);

  if(ARC.mode === "auto" && ARC.tier === "B"){
    const d = ARC.det, q = d.locked ? d.quad : d.cand;
    if(q){
      const m = arcMap();
      const pts = [];
      for(let i=0; i<4; i++) pts.push(arcToCss(m, [q[i*2], q[i*2+1]]));
      ctx.save();
      ctx.lineWidth = d.locked ? 2.5 : 2;
      ctx.strokeStyle = d.locked ? "rgba(45,212,191,.95)" : "rgba(251,191,36,.9)";
      if(!d.locked) ctx.setLineDash([7,5]);
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for(let i=1; i<4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath(); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = d.locked ? "rgba(45,212,191,.95)" : "rgba(251,191,36,.9)";
      for(let i=0; i<4; i++){
        ctx.beginPath(); ctx.arc(pts[i][0], pts[i][1], d.locked ? 4 : 3.2, 0, 2*Math.PI); ctx.fill();
      }
      let lx = 0, ly = 0;
      for(let i=0; i<4; i++){ lx += pts[i][0]; ly += pts[i][1]; }
      ctx.font = "800 11px ui-monospace, Menlo, monospace";
      ctx.textAlign = "center";
      ctx.fillText((d.locked ? "REFERENCE " : "CANDIDATE ") + Math.round(d.conf*100) + "%",
                   lx/4, ly/4 - 6);
      ctx.restore();
    }
  }
  if(ARC.mode === "quad" && ARC.tier === "B" && ARC.handles.length === 4){
    ctx.save(); ctx.strokeStyle = "rgba(45,212,191,.8)"; ctx.lineWidth = 2; ctx.setLineDash([6,5]);
    ctx.beginPath(); ctx.moveTo(ARC.handles[0][0], ARC.handles[0][1]);
    for(let i=1;i<4;i++) ctx.lineTo(ARC.handles[i][0], ARC.handles[i][1]);
    ctx.closePath(); ctx.stroke(); ctx.restore();
  } else if(ARC.tier === "B" && ARC.handles.length === 2){
    ctx.save(); ctx.strokeStyle = "rgba(45,212,191,.8)"; ctx.lineWidth = 2; ctx.setLineDash([6,5]);
    ctx.beginPath(); ctx.moveTo(ARC.handles[0][0], ARC.handles[0][1]);
    ctx.lineTo(ARC.handles[1][0], ARC.handles[1][1]); ctx.stroke(); ctx.restore();
  }

  if(g.distance == null){ if(ARC.wall.on) arcDrawWall(ctx, cw, ch); return; }
  /* Step 1 is a measurement, not a preview. The phone is aimed at the floor, so
     drawing the poster there would lay it on the ground. */
  if(arcFieldUI() && ARC.tier === "B" && ARC.mode === "floor" && ARC.floor.step === "measure"){
    if(ARC.wall.on) arcDrawWall(ctx, cw, ch);
    return;
  }

  // XR draws straight in CSS px; camera tiers project in video px then map across.
  const nn = arcNudgeNorm();
  let quadCss;
  if(ARC.tier === "A"){
    const fCss = arcDisplayFocalCss();
    quadCss = arcPosterGeometry(g, fCss, cw/2, ch/2, nn.ax*fCss, nn.ay*fCss);
  } else {
    const m = arcMap();
    const f = ARC.focal.f;
    const q = arcPosterGeometry(g, f, m.vw/2, m.vh/2, nn.ax*f, nn.ay*f);
    quadCss = q.map(function(p){ return arcToCss(m, p); });
  }

  const caption = ARC.task.widthFt.toFixed(1) + " ft × " + ARC.task.heightFt.toFixed(1)
                + " ft @ " + g.distance.toFixed(1) + " ft";
  if(g.all){
    if(ARC.posterImg){
      ctx.save(); ctx.globalAlpha = 0.85;
      arcDrawQuadImage(ctx, ARC.posterImg, quadCss);
      ctx.restore();
    }
    arcDrawQuadChrome(ctx, quadCss, caption, "#2dd4bf");
  } else {
    ctx.save(); ctx.globalAlpha = 0.35; ctx.setLineDash([8,6]);
    arcDrawQuadChrome(ctx, quadCss, null, "#94a3b8");
    ctx.restore();
    ctx.save();
    ctx.font = "700 12px ui-monospace, Menlo, monospace"; ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillText((myRole() === "Merchandiser")
      ? "the poster appears once you are in the right spot"
      : "poster unlocks when all gates pass", ccx, ccy + 26);
    ctx.restore();
  }
  /* Last, so the wall edges sit ON TOP of the artwork they are being compared
     against — the whole point is to see the overhang. */
  if(ARC.wall.on) arcDrawWall(ctx, cw, ch);
}
/* The four draggable edges, plus the live span they enclose. The horizontal
   pair is drawn faint until it has been moved, because until then it is a
   default and not an answer — and arcWallMeasure refuses to report a height
   it was never given. */
function arcDrawWall(ctx, cw, ch){
  const w = ARC.wall, t = ARC.task;
  const midY = ch/2, midX = cw/2;
  ctx.save();
  ctx.lineWidth = 2; ctx.strokeStyle = "rgba(251,191,36,.95)"; ctx.setLineDash([9,6]);
  ctx.beginPath(); ctx.moveTo(w.xL, 0); ctx.lineTo(w.xL, ch);
  ctx.moveTo(w.xR, 0); ctx.lineTo(w.xR, ch); ctx.stroke();
  ctx.globalAlpha = w.movedY ? 1 : 0.3;
  ctx.beginPath(); ctx.moveTo(0, w.yT); ctx.lineTo(cw, w.yT);
  ctx.moveTo(0, w.yB); ctx.lineTo(cw, w.yB); ctx.stroke();
  ctx.globalAlpha = 1; ctx.setLineDash([]);
  ctx.fillStyle = "rgba(251,191,36,.95)";
  [w.xL, w.xR].forEach(function(x){
    ctx.beginPath(); ctx.arc(x, midY, 9, 0, 2*Math.PI); ctx.fill();
  });
  ctx.globalAlpha = w.movedY ? 1 : 0.45;
  [w.yT, w.yB].forEach(function(y){
    ctx.beginPath(); ctx.arc(midX, y, 9, 0, 2*Math.PI); ctx.fill();
  });
  ctx.globalAlpha = 1;
  const r = arcWallMeasure();
  if(r && t){
    const label = r.widthFt.toFixed(1) + " ft wide"
      + (r.heightFt != null ? " × " + r.heightFt.toFixed(1) + " ft tall" : "")
      + "  ·  poster " + t.widthFt + " × " + t.heightFt + " ft";
    ctx.font = "800 12px ui-monospace, Menlo, monospace";
    ctx.textAlign = "center";
    const tw = ctx.measureText(label).width;
    const y = Math.max(20, midY - 26);
    ctx.fillStyle = "rgba(6,10,16,.82)";
    ctx.fillRect(midX - tw/2 - 8, y - 13, tw + 16, 20);
    ctx.fillStyle = r.fits ? "#5eead4" : "#fbbf24";
    ctx.fillText(label, midX, y + 2);
  }
  ctx.restore();
}

/* ---------- stage interaction: handle drag + poster nudge ---------- */
function arcBindStage(){
  const st = arcEl("arStage");
  if(!st) return;
  let drag = null;
  st.addEventListener("pointerdown", function(e){
    if(ARC.panel) return;
    /* While the wall is being marked the stage belongs to the four lines: the
       poster nudge would otherwise swallow every drag. */
    if(ARC.wall.on){
      const r0 = st.getBoundingClientRect();
      drag = { kind:"wall", which: arcWallPick(e.clientX - r0.left, e.clientY - r0.top) };
      try{ st.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
      return;
    }
    const h = e.target.closest ? e.target.closest("[data-arch]") : null;
    if(h){ drag = { kind:"handle", i:Number(h.dataset.arch) }; }
    else  { drag = { kind:"nudge", x:e.clientX, y:e.clientY, nx:ARC.nudge.x, ny:ARC.nudge.y }; }
    try{ st.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  st.addEventListener("pointermove", function(e){
    if(!drag) return;
    const r = st.getBoundingClientRect();
    if(drag.kind === "wall"){
      const w = ARC.wall;
      const x = clamp(e.clientX - r.left, 0, r.width);
      const y = clamp(e.clientY - r.top,  0, r.height);
      if(drag.which === "L"){ w.xL = Math.min(x, w.xR - 24); w.movedX = true; }
      else if(drag.which === "R"){ w.xR = Math.max(x, w.xL + 24); w.movedX = true; }
      else if(drag.which === "T"){ w.yT = Math.min(y, w.yB - 24); w.movedY = true; }
      else { w.yB = Math.max(y, w.yT + 24); w.movedY = true; }
    } else if(drag.kind === "handle"){
      ARC.handles[drag.i] = [ clamp(e.clientX - r.left, 4, r.width-4), clamp(e.clientY - r.top, 4, r.height-4) ];
      arcRenderHandles();
    } else {
      ARC.nudge.x = clamp(drag.nx + (e.clientX - drag.x), -r.width/2,  r.width/2);
      ARC.nudge.y = clamp(drag.ny + (e.clientY - drag.y), -r.height/2, r.height/2);
    }
  });
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
    st.addEventListener(ev, function(){ drag = null; });
  });
}

    +   '<input id="cal_d" type="number" step="0.05" min="0.5" max="60" value="5.0"></div>'
    + (cal ? '<div class="hint">Current calibration: <b class="num">'+Math.round(cal.f)+' px</b> at '
        + cal.vw+'×'+cal.vh+' ('+esc(cal.refLabel)+', '+fmtD(cal.ts)+') — '
        + 'HFOV ≈ '+GEO.fovFromFocal(cal.vw, cal.f).toFixed(1)+'°.</div>' : '')
    + '<div class="pfoot"><button class="btn primary" data-arc="calibsave">Solve &amp; save</button>'
    + (cal ? '<button class="btn danger" data-arc="calibclear">Clear</button>' : '')
    + '<button class="btn" data-arc="calibback">Back to camera</button></div>');
  ARC.panel = "calib";
  const sel = arcEl("cal_ref");
  if(sel) sel.addEventListener("change", function(){
    const p = REF_PRESETS.filter(x=>x.key===sel.value)[0];
    if(p && p.mm) arcEl("cal_mm").value = p.mm;
  });
}
function arcCalibSave(){
  const mm = parseFloat((arcEl("cal_mm")||{}).value);
  const dFt = parseFloat((arcEl("cal_d")||{}).value);
  const sel = arcEl("cal_ref");
  if(!(mm > 5) || !(dFt > 0.5)){ toast("Enter a real width in mm and a measured distance in ft.", true); return; }
  if(ARC.handles.length < 2){ toast("Switch to 2-handle mode and place the handles first.", true); return; }
  const m = arcMap();
  const a = arcToVid(m, ARC.handles[0][0], ARC.handles[0][1]);
  const b = arcToVid(m, ARC.handles[1][0], ARC.handles[1][1]);
  const px = Math.hypot(b[0]-a[0], b[1]-a[1]);
  if(!(px > 12)){ toast("Handles are too close together to solve a focal length.", true); return; }
  const realWft = GEO.mToFt(mm/1000);
  const f = GEO.focalFromCalibration(px, dFt, realWft);
  const hfov = GEO.fovFromFocal(m.vw, f);
  if(!(f > 50) || !(hfov > 15 && hfov < 170)){
    toast("That solves to an implausible "+hfov.toFixed(0)+"° field of view — re-check the distance and handles.", true);
    return;
  }
  /* f = px·d/W, so σf/f is the quadrature sum of the relative errors of the two
     things the user supplied: the tape reading, and the pixel width they got by
     dragging two handles (two independent handles ⇒ √2 · per-handle σ). Storing
     it means every later reading can quote a real error bar instead of a guess. */
  const relSigma = arcQuad(CALIB_DIST_SIGMA_FT/dFt,
                           Math.SQRT2*CALIB_EDGE_SIGMA_PX/px,
                           (arcRefTolMm(REF_PRESETS.filter(p=>p.key===(sel?sel.value:"a4"))[0], mm))/mm);
  arcCalibSet({ f:f, vw:m.vw, vh:m.vh, refLabel: sel ? (sel.options[sel.selectedIndex].text) : (mm+" mm"),
                mm:mm, distFt:dFt, pixelWidth:px, relSigma:relSigma,
                ts:new Date().toISOString(), device:deviceString() });
  ARC.focal = arcResolveFocal();
  toast("Calibrated: f = "+Math.round(f)+" px (HFOV "+hfov.toFixed(1)+"°), ± "
    + (ARC.focal.relSigma*100).toFixed(1) + "%.");
  arcPanel(null);
  if(ARC.tier !== "B"){ arcTierB(); } else { arcLoop(); }
}
