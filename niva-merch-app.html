   inside placements.note (see FLOOR_NOTE_RE) rather than in a column that might
   not exist, and is parsed back out on the way in, so a manager reviewing a

   `field` is the plain-language line, mirroring TIER_FIELD_LABEL. */

   has to say so explicitly, because it shares tier 'Be' with the estimated-
   focal reference path. */
function methodFromTier(tier){
  return isARTier(tier) ? "xr-hit-test" : (tier === "C" ? "manual" : "reference-scale");
}

function mulberry(seed){ let a = seed>>>0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0;

function fmtD(iso){

function ago(iso){
  const t = new Date(iso).getTime(); if(isNaN(t)) return "";
  let s = Math.floor((Date.now()-t)/1000);
  if(s<0) s=0;
  if(s<60) return s+"s ago";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}
function haversine(a1,o1,a2,o2){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLa=toR(a2-a1), dLo=toR(o2-o1);
  const s = Math.sin(dLa/2)**2 + Math.cos(toR(a1))*Math.cos(toR(a2))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));

const gps = (la,ln)=> (la==null||ln==null) ? "—" : Number(la).toFixed(5)+", "+Number(ln).toFixed(5);

/* ==========================================================
   2b. GEO — hand-rolled sensor / projective geometry
   ------------------------------------------------------------
   Frame conventions used throughout:
     GL  frame (WebXR / our reporting frame): x right, y up,   z toward the viewer
     CV  frame (image projection):            x right, y down, z forward (into scene)
   Wall normals are always reported in the GL frame, pointing TOWARD the camera.
   ========================================================== */
const GEO = (function(){
  const D2R = Math.PI/180, R2D = 180/Math.PI;
  const deg = r => r*R2D;
  const rad = d => d*D2R;
  const mToFt = m => m*M_TO_FT;
  const ftToM = f => f/M_TO_FT;

  /* ---- pinhole camera ---- */
  // f in pixels from a horizontal field of view over `px` pixels
  function focalFromFov(px, fovDeg){ return (px/2)/Math.tan(rad(fovDeg)/2); }
  function fovFromFocal(px, f){ return deg(2*Math.atan((px/2)/f)); }
  // d = realWidth * f / apparentWidthPx   (units of d follow units of realWidth)
  function distanceFromWidth(realWidth, focalPx, apparentPx){
    if(!(apparentPx > 0) || !(focalPx > 0)) return NaN;
    return realWidth*focalPx/apparentPx;
  }
  // one-time calibration solve: f = pixelWidth * knownDistance / realWidth
  function focalFromCalibration(pixelWidth, knownDistance, realWidth){
    if(!(realWidth > 0)) return NaN;
    return pixelWidth*knownDistance/realWidth;
  }
  // angular size (radians) of a span W at distance D
  function angularSize(W, D){ return 2*Math.atan(W/(2*D)); }
  // the two equivalent forms the brief calls for
  function pixelWidthFromAngle(theta, focalPx){ return 2*focalPx*Math.tan(theta/2); }
  function posterPixelWidth(W, D, focalPx){ return focalPx*W/D; }

  /* ---- how much wall is in frame, and where to stand for a given poster ----

     The same pinhole relation as everything above, read the other way round. A
     frame `px` pixels wide with focal length f subtends 2·atan(px/2f), so on a
     plane a perpendicular distance d away it spans

         S_visible = d · px / f

     exactly — px/f is a TANGENT, not a small-angle approximation, and d·tan is
     the true span on a plane parallel to the sensor. Everything below is that
     identity rearranged: a poster W wide occupies the fraction W/S_visible of
     the frame, and the distance at which it occupies a chosen fraction is
     d = f·W/(fill·px).

     THE FIT TEST IS NOT A PREDICTION ABOUT THE LENS. It is fed the SAME f that
     posterQuad() is drawn with, so "the poster fits in view" is the statement
     that the quad the overlay draws lands inside the frame. If f is wrong the
     drawing and the test are wrong together, and stay consistent — which is the
     only guarantee worth having on a fleet where f is an assumed 66 %.        */
  const FIT_EPS = 1e-9;   // exactly-fills must count as fitting, not as 1 + 1 ulp
  function fitsWithin(need, have){
    if(!isFinite(need) || !isFinite(have)) return false;
    return have + FIT_EPS >= need;
  }
  function visibleSpan(d, px, focalPx){
    if(!(d > 0) || !(px > 0) || !(focalPx > 0)) return NaN;
    return d*px/focalPx;
  }
  function distanceForFill(spanFt, fillFrac, px, focalPx){
    if(!(spanFt > 0) || !(fillFrac > 0) || !(px > 0) || !(focalPx > 0)) return NaN;
    return focalPx*spanFt/(fillFrac*px);
  }
  /* Recommended and minimum standoff for one poster in one frame.

     BOTH DIMENSIONS ARE CHECKED and the FURTHER of the two wins, because a
     poster that fits across the frame but runs off the top is not in the shot.
     On the phone the field build actually runs on — portrait, wide FOV across
     the narrow dimension — the width is what binds, and a 9 × 8 ft poster comes
     out at 9.9 ft. Turn the same frame on its side and the height binds and the
     answer grows, which is correct and not a special case. */
  function posterStandoff(o){
    const fx = (o.fx > 0) ? o.fx : NaN;
    const fy = (o.fy > 0) ? o.fy : fx;
    const fill = (o.fill > 0 && o.fill <= 1) ? o.fill : FRAME_FILL_TARGET;
    const dw = distanceForFill(o.widthFt,  fill, o.frameW, fx);
    const dh = distanceForFill(o.heightFt, fill, o.frameH, fy);
    const wOk = isFinite(dw), hOk = isFinite(dh);
    if(!wOk && !hOk) return { recommendedFt:NaN, minimumFt:NaN, limit:null, fill:fill };
    const rec = (wOk && hOk) ? Math.max(dw, dh) : (wOk ? dw : dh);
    const mw = distanceForFill(o.widthFt,  FRAME_FILL_FULL, o.frameW, fx);
    const mh = distanceForFill(o.heightFt, FRAME_FILL_FULL, o.frameH, fy);
    const min = (isFinite(mw) && isFinite(mh)) ? Math.max(mw, mh) : (isFinite(mw) ? mw : mh);
    return { recommendedFt: rec, minimumFt: min, fill: fill,
             limit: (wOk && hOk) ? (dw >= dh ? "width" : "height") : (wOk ? "width" : "height"),
             recommendedWidthFt: dw, recommendedHeightFt: dh };
  }
  /* What one distance actually buys: the wall span in view, and whether the
     poster is inside it. `limit` names the dimension that is tightest — the one
     the merchandiser has to be told about. */
  function viewFit(o){
    const fx = (o.fx > 0) ? o.fx : NaN;
    const fy = (o.fy > 0) ? o.fy : fx;
    const vw = visibleSpan(o.distanceFt, o.frameW, fx);
    const vh = visibleSpan(o.distanceFt, o.frameH, fy);
    const fillW = (vw > 0) ? o.widthFt/vw  : Infinity;
    const fillH = (vh > 0) ? o.heightFt/vh : Infinity;
    const fitsWidth  = fitsWithin(o.widthFt,  vw);
    const fitsHeight = fitsWithin(o.heightFt, vh);
    return {
      visibleWFt: vw, visibleHFt: vh,
      fillW: fillW, fillH: fillH,
      fitsWidth: fitsWidth, fitsHeight: fitsHeight,
      fits: fitsWidth && fitsHeight,
      limit: (fillW >= fillH) ? "width" : "height"
    };
  }
  /* The real span between two marks the merchandiser dragged onto the wall.
     Each mark is a pixel column (or row); its angle off the optical axis is
     α = atan((x − c)/f), and on a plane a perpendicular distance d away the
     lateral offset of that ray is d·tan α, so

         span = d · (tan α_b − tan α_a)

     Written through the angles on purpose: it is the form that makes the
     standing assumption visible — d is the PERPENDICULAR distance and the wall
     is parallel to the sensor, which is the squareness the capture gates
     already require and the merchandiser already attests. It also hands back
     the two α's, which is what a reviewer needs to see how far off-axis the
     marks were. */
  function spanFromPixels(d, a, b, centre, focalPx){
    if(!(d > 0) || !(focalPx > 0)) return null;
    if(!isFinite(a) || !isFinite(b) || !isFinite(centre)) return null;
    const aa = Math.atan((a - centre)/focalPx), ab = Math.atan((b - centre)/focalPx);
    return { ft: Math.abs(d*(Math.tan(ab) - Math.tan(aa))),
             alphaADeg: deg(aa), alphaBDeg: deg(ab) };
  }

  /* ---- small vector helpers ---- */
  function vlen(v){ return Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]); }
  function vnorm(v){ const m = vlen(v) || 1; return [v[0]/m, v[1]/m, v[2]/m]; }
  function vdot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
  function vcross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
  function vsub(a,b){ return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]; }
  function vscale(a,s){ return [a[0]*s,a[1]*s,a[2]*s]; }
  function vadd(a,b){ return [a[0]+b[0],a[1]+b[1],a[2]+b[2]]; }
  // rotate v by quaternion q ({x,y,z,w}) — v' = v + 2w(q×v) + 2q×(q×v)
  function quatRotate(q, v){
    const u = [q.x,q.y,q.z];
    const uv = vcross(u,v), uuv = vcross(u,uv);
    return vadd(v, vadd(vscale(uv, 2*q.w), vscale(uuv, 2)));
  }

  /* ---- wall normal -> camera-relative angles ----
     Input: wall normal in the GL camera frame. Output angles describe how the
     CAMERA is oriented relative to the wall:
       yawDeg   > 0  camera is turned to its left  (off-axis in yaw)
       pitchDeg > 0  camera is aiming up
       incidenceDeg  total angle between the optical axis and the wall normal   */
  function normalToAngles(n){
    let v = vnorm(n);
    if(v[2] < 0) v = [-v[0],-v[1],-v[2]];      // force "toward camera"
    const z = Math.max(v[2], 1e-9);
    return {
      yawDeg:       deg(Math.atan2(-v[0], z)),
      pitchDeg:     deg(Math.atan2(-v[1], z)),
      incidenceDeg: deg(Math.acos(clamp(v[2], -1, 1)))
    };
  }
  // inverse of normalToAngles — used to build the poster basis
  function anglesToNormal(yawDeg, pitchDeg){
    return vnorm([-Math.tan(rad(yawDeg)), -Math.tan(rad(pitchDeg)), 1]);
  }

  /* ---- device attitude ----
     DeviceOrientationEvent gives intrinsic Z-X'-Y'' (alpha,beta,gamma) taking the
     device frame to the world frame (world Z up). The third row of that matrix is
     the world "up" axis expressed in device coordinates, so gravity-down in the
     device frame is its negation. Working from the gravity vector (rather than
     comparing beta to 90) stays correct through the beta = ±90 gimbal degeneracy. */
  function gravityFromOrientation(alpha, beta, gamma){
    const a = rad(alpha||0), b = rad(beta||0), g = rad(gamma||0);
    const cb = Math.cos(b), sb = Math.sin(b), cg = Math.cos(g), sg = Math.sin(g);
    return [ cb*sg, -sb, -cb*cg ];             // unit, points "down" in device axes
  }
  // rotate a device-frame vector into the current screen frame
  function applyScreenAngle(d, screenAngleDeg){
    const t = rad(screenAngleDeg||0), c = Math.cos(t), s = Math.sin(t);
    return [ d[0]*c + d[1]*s, -d[0]*s + d[1]*c, d[2] ];
  }
  /* Gravity (screen frame, unit, pointing down) -> camera attitude.
       pitchDeg > 0  camera aiming up   (device tipped back)
       rollDeg  > 0  device rolled clockwise as seen by the user           */
  function tiltFromGravity(d){
    const v = vnorm(d);
    return {
      pitchDeg: deg(Math.atan2(v[2], -v[1])),
      rollDeg:  deg(Math.atan2(-v[0], -v[1]))
    };
  }
  function attitudeFromOrientation(alpha, beta, gamma, screenAngleDeg){
    return tiltFromGravity(applyScreenAngle(gravityFromOrientation(alpha,beta,gamma), screenAngleDeg));
  }
  // devicemotion fallback: accelerationIncludingGravity is the proper acceleration,
  // i.e. it points UP when the device is at rest, so down = -normalise(a).
  function attitudeFromAccel(ax, ay, az, screenAngleDeg){
    const d = vnorm([-(ax||0), -(ay||0), -(az||0)]);
    return tiltFromGravity(applyScreenAngle(d, screenAngleDeg));
  }

  /* ---- floor-line trigonometry (reference-free distance) ----

     depressionFromGravity() is NOT tiltFromGravity().pitchDeg negated, and the
     difference is the whole reason it exists. tiltFromGravity reports the pitch
     of the screen's own vertical axis: atan2(g_z, -g_y). Roll bleeds part of
     -g_y into g_x, so a phone held 30° off-level reads its 40° of depression as
     44° — and at 40° a 4° error is a 14 % distance error.

     The angle the trigonometry actually needs is the elevation of the OPTICAL
     AXIS, and the rear camera looks along -z. With g the unit gravity-down
     vector, sin(elevation) = (-ẑ)·(-g) = g_z, so the depression below
     horizontal is asin(-g_z) — a function of g_z alone, and therefore invariant
     under both roll and the screen-angle compensation (which only mixes x,y).
     A merchandiser tilting the phone down one-handed is rolled by several
     degrees whether they mean to be or not, so this matters in the field and
     not just on paper. */
  function depressionFromGravity(g){
    const v = vnorm(g);
    return deg(Math.asin(clamp(-v[2], -1, 1)));
  }
  /* d = h / tan θ, in whatever unit h is given in. Returns NaN outside the open
     interval (0°, 90°): at 0 the ray never meets the floor and at 90 it lands on
     the user's own shoes. The usable BAND is much narrower than that and is
     enforced by the caller (floorGuard) — this is only the hard singularity. */
  function floorLineDistance(h, thetaDeg){
    if(!(h > 0) || !isFinite(thetaDeg) || thetaDeg <= 0 || thetaDeg >= 90) return NaN;
    const t = Math.tan(rad(thetaDeg));
    if(!(t > 0)) return NaN;
    return h/t;
  }
  /* The calibration solve, the same identity rearranged: stand a MEASURED
     distance from a wall, aim at the floor line, and the height falls out. */
  function floorLineHeight(d, thetaDeg){
    if(!(d > 0) || !isFinite(thetaDeg) || thetaDeg <= 0 || thetaDeg >= 90) return NaN;
    return d*Math.tan(rad(thetaDeg));
  }
  /* ∂d/∂θ in units-of-h per RADIAN. Negative: tilting further down brings the
     floor line — and therefore the wall — nearer. Worth having as its own
     function because it is the term that decides whether a reading is usable,
     and because the self-test can check it against a hand-computed value. */
  function floorLineDDdTheta(h, thetaDeg){
    if(!(h > 0) || !isFinite(thetaDeg) || thetaDeg <= 0 || thetaDeg >= 90) return NaN;
    const s = Math.sin(rad(thetaDeg));
    return -h/(s*s);
  }
  /* The honest error bar, derived from the two real terms and nothing else.

       relative σ_d = √( (σ_h/h)² + (σ_θ / (sin θ · cos θ))² )

     The second term is ∂d/∂θ · σ_θ divided through by d = h·cot θ, which
     collapses to σ_θ/(sinθ·cosθ) = 2σ_θ/sin(2θ). It bottoms out at 2σ_θ at
     θ = 45° and roughly quadruples by θ = 12°, which is why shallow aim is
     called out rather than silently reported.
     σ_θ is supplied by the caller as the quadrature sum of the MEASURED sensor
     jitter and how well a person can put a reticle on a line. */
  function floorLineError(t){
    const hRel  = Math.max(0, t.heightRelSigma || 0);
    const th    = t.thetaDeg;
    const sTh   = rad(Math.max(0, t.thetaSigmaDeg || 0));
    let pitch = Infinity;
    if(isFinite(th) && th > 0 && th < 90){
      const s = Math.sin(rad(th)), c = Math.cos(rad(th));
      pitch = (s*c > 0) ? sTh/(s*c) : Infinity;
    }
    const rel = Math.sqrt(hRel*hRel + pitch*pitch);
    return {
      rel: rel, pct: rel*100,
      terms: { height: hRel, pitch: pitch },
      dDdThetaPerDeg: floorLineDDdTheta(t.h == null ? 1 : t.h, th)*D2R
    };
  }

  /* ---- linear algebra: dense n×n solve, partial pivoting ---- */
  function solveLinear(A, b){
    const n = b.length;
    const M = [];
    for(let i=0;i<n;i++) M.push(A[i].slice(0, n).concat([b[i]]));
    for(let c=0;c<n;c++){
      let p = c;
      for(let r=c+1;r<n;r++) if(Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      if(Math.abs(M[p][c]) < 1e-12) return null;   // singular
      const tmp = M[c]; M[c] = M[p]; M[p] = tmp;
      for(let r=0;r<n;r++){
        if(r === c) continue;
        const f = M[r][c]/M[c][c];
        if(!f) continue;
        for(let k=c;k<=n;k++) M[r][k] -= f*M[c][k];
      }
    }
    const x = [];
    for(let i=0;i<n;i++) x.push(M[i][n]/M[i][i]);
    return x;
  }

  /* ---- homography: 4 model points (plane coords) -> 4 image points ----
     Solves the 8 unknowns of H with h33 pinned to 1 (DLT, exact for 4 points). */
  function homography(src, dst){
    if(!src || !dst || src.length !== 4 || dst.length !== 4) return null;
    const A = [], b = [];
    for(let i=0;i<4;i++){
      const X = src[i][0], Y = src[i][1], u = dst[i][0], v = dst[i][1];
      A.push([X, Y, 1, 0, 0, 0, -u*X, -u*Y]); b.push(u);
      A.push([0, 0, 0, X, Y, 1, -v*X, -v*Y]); b.push(v);
    }
    const h = solveLinear(A, b);
    if(!h) return null;
    for(let i=0;i<8;i++) if(!isFinite(h[i])) return null;
    return [[h[0],h[1],h[2]],[h[3],h[4],h[5]],[h[6],h[7],1]];
  }
  function applyH(H, p){
    const w = H[2][0]*p[0] + H[2][1]*p[1] + H[2][2];
    return [ (H[0][0]*p[0] + H[0][1]*p[1] + H[0][2])/w,
             (H[1][0]*p[0] + H[1][1]*p[1] + H[1][2])/w ];
  }
  /* Decompose H (model plane -> image) with known intrinsics into the plane's
     pose. Model coordinates must be CENTRED on the outlined rectangle and in
     real units, so the translation is the camera->rectangle-centre vector and
     falls out in those same units. Returns GL-frame normal + camera angles +
     the line-of-sight distance to the rectangle centre. */
  function poseFromHomography(H, focalPx, cx, cy){
    if(!H || !(focalPx > 0)) return null;
    const col = j => [ (H[0][j] - cx*H[2][j])/focalPx,
                       (H[1][j] - cy*H[2][j])/focalPx,
                        H[2][j] ];
    const b1 = col(0), b2 = col(1), b3 = col(2);
    const n1 = vlen(b1), n2 = vlen(b2);
    if(!(n1 > 1e-12 && n2 > 1e-12)) return null;
    let lam = 2/(n1 + n2);
    if(b3[2] < 0) lam = -lam;                       // keep the plane in front of the camera
    const r1r = vscale(b1, lam), r2r = vscale(b2, lam), t = vscale(b3, lam);
    // Gram-Schmidt back to an orthonormal basis
    const r1 = vnorm(r1r);
    const r2 = vnorm(vsub(r2r, vscale(r1, vdot(r1, r2r))));
    const r3 = vcross(r1, r2);                      // plane normal, CV frame, away from camera
    const nGL = vnorm([ r3[0], -r3[1], -r3[2] ]);   // CV -> GL, now toward the camera
    const ang = normalToAngles(nGL);
    return {
      normal: nGL, yawDeg: ang.yawDeg, pitchDeg: ang.pitchDeg, incidenceDeg: ang.incidenceDeg,
      rollDeg: -deg(Math.atan2(r1[1], r1[0])),
      distance: vlen(t), depth: t[2]
    };
  }

  /* ---- poster placement ----
     Projects a W×H rectangle lying on the wall, centred on the image point
     (u0,v0) at line-of-sight distance D, into image pixels. Square-on and
     centred this reduces exactly to width = f·W/D. */
  function posterQuad(o){
    const f = o.focalPx, cx = o.cx, cy = o.cy;
    const fy = (o.focalPxY != null ? o.focalPxY : f);        // anisotropic when the raster is
    const u0 = (o.u0 == null ? cx : o.u0), v0 = (o.v0 == null ? cy : o.v0);
    const ray = vnorm([ (u0-cx)/f, (v0-cy)/fy, 1 ]);         // CV frame
    const C   = vscale(ray, o.distance);
    // Wall axes in the CV frame. nGL points OUT of the wall toward the camera;
    // GL->CV is (x,-y,-z), and Zw must point INTO the wall, so negate that too:
    // Zw = -(nGL.x, -nGL.y, -nGL.z) = (-nGL.x, nGL.y, nGL.z).
    const nGL = anglesToNormal(o.yawDeg||0, o.pitchDeg||0);
    const Zw  = vnorm([ -nGL[0], nGL[1], nGL[2] ]);
    const rollR = rad(o.rollDeg || 0);
    let down = [ Math.sin(rollR), Math.cos(rollR), 0 ];      // screen-down, de-rolled
    let Yw = vsub(down, vscale(Zw, vdot(down, Zw)));
    if(vlen(Yw) < 1e-6) Yw = vsub([0,1,0], vscale(Zw, vdot([0,1,0], Zw)));
    Yw = vnorm(Yw);
    const Xw = vcross(Yw, Zw);
    const hw = o.widthFt/2, hh = o.heightFt/2;
    const corners = [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]];   // TL, TR, BR, BL
    const out = [];
    for(let i=0;i<4;i++){
      const P = vadd(C, vadd(vscale(Xw, corners[i][0]), vscale(Yw, corners[i][1])));
      const z = P[2] > 1e-6 ? P[2] : 1e-6;
      out.push([ cx + f*P[0]/z, cy + fy*P[1]/z ]);
    }
    return out;
  }

  /* ---- pinhole intrinsics out of a GL projection matrix ----
     A projection matrix maps camera space to NDC and carries no resolution of its
     own, so the same matrix describes the XR viewport AND the raw camera image —
     only the raster it is sampled onto differs. Column-major GL frustum:
        m[0]=2n/(r-l)  m[5]=2n/(t-b)  m[8]=(r+l)/(r-l)  m[9]=(t+b)/(t-b)  m[11]=-1
     For a camera-space point (X,Y,Z) with d = -Z:
        x_ndc = m[0]·X/d - m[8]        y_ndc = m[5]·Y_gl/d - m[9]

        u = (W·m[0]/2)·(X/d) + W·(1-m[8])/2
        v = (H·m[5]/2)·(Y_cv/d) + H·(1+m[9])/2

     Pixels are square iff W/H equals m[5]/m[0]; that equality is ASSERTED at
     runtime rather than assumed, because nothing guarantees the raw camera image
     shares the viewport's aspect ratio. */
  function intrinsicsFromProjection(m, W, H){
    if(!m || m.length < 16 || !(W > 0) || !(H > 0)) return null;
    const fx = W*m[0]/2, fy = H*m[5]/2;
    if(!(fx > 0) || !(fy > 0)) return null;
    const projAspect = m[0] !== 0 ? (m[5]/m[0]) : NaN;
    const rasterAspect = W/H;

/* ==========================================================
   2b-bis. DET — automatic reference-rectangle detection
   ------------------------------------------------------------
   Hand-rolled, allocation-free-after-warmup, and deliberately dumb: it finds
   ONE high-contrast quadrilateral per pass and hands its four corners to the
   homography path that already exists in GEO. It does not track, it does not
   learn, and it never decides on its own that a reading is trustworthy — the
   merchandiser confirms the outline before it counts.

   The pipeline, in the order the cost is paid:

     1. the caller draws the video into a small work canvas and hands us the
        LUMA plane for it (work resolution, long side ~480–800 px);
     2. box-downsample ×2 into the DETECT plane (~240–400 px long side);
     3. 1-2-1 separable blur, then a Sobel magnitude image;
     4. a histogram percentile picks the edge threshold, so a dim scene and a
        bright one get the same fraction of edge pixels;
     5. one 3×3 dilation closes the 1–2 px gaps that would otherwise split the
        rectangle's outline into four open arcs;
     6. Moore-neighbourhood border following walks every closed edge blob.
        Both the outer and the inner wall of the outline "ring" get traced,
        which is a feature: the true rectangle lies between them, and step 8
        removes the offset either way;
     7. Douglas–Peucker at three tolerances; a contour that reduces to exactly
        four convex vertices of plausible area becomes a candidate;
     8. candidates are scored by how well they fit a RECTANGLE OF THE KNOWN
        ASPECT RATIO under the known intrinsics (see rectFit) — not by how
        rectangular they look in the image, which perspective ruins;
     9. the winner's corners are re-derived at WORK resolution by fitting a
        line to sub-pixel edge crossings along each side and intersecting
        adjacent lines. Corner localisation is a direct term in the distance
        error budget, so this step is the difference between ~1 % and ~4 %.

   Everything here is a pure function over typed arrays. `Workspace` owns every
   buffer and is reused for the life of a capture session — the only per-pass
   allocations are a handful of 8-element corner arrays.
   ========================================================== */
const DET = (function(){
  "use strict";

  /* 8-neighbourhood, clockwise from east, in screen coordinates (y grows down). */
  const DX = [ 1, 1, 0,-1,-1,-1, 0, 1];
  const DY = [ 0, 1, 1, 1, 0,-1,-1,-1];

  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;

  /* ---------- workspace: every buffer, allocated once ---------- */
  function Workspace(){
    this.w = 0; this.h = 0; this.sw = 0; this.sh = 0;
    this.luma = null;      // work resolution, Uint8ClampedArray
    this.small = null;     // detect resolution
    this.blur = null; this.tmp = null;
    this.mag = null;       // Uint16Array
    this.bin = null; this.dil = null; this.visited = null;
    this.hist = new Int32Array(256);
    this.poly = null;      // Int32Array(maxPts*2) — one contour at a time
    this.keep = null;      // Uint8Array(maxPts)
    this.stack = new Int32Array(512);
    this.maxPts = 0;
    this.px = new Float64Array(64);   // refinement: edge points for one side
    this.py = new Float64Array(64);
  }
  /* Size the workspace for a work plane of w×h whose detect plane is w/2×h/2.
     Returns true when a (re)allocation happened. */
  Workspace.prototype.fit = function(w, h){
    const sw = Math.max(8, w >> 1), sh = Math.max(8, h >> 1);
    if(this.w === w && this.h === h) return false;
    this.w = w; this.h = h; this.sw = sw; this.sh = sh;
    const N = w*h, M = sw*sh;
    this.luma    = new Uint8ClampedArray(N);
    this.small   = new Uint8ClampedArray(M);
    this.blur    = new Uint8ClampedArray(M);
    this.tmp     = new Uint8ClampedArray(M);
    this.mag     = new Uint16Array(M);
    this.bin     = new Uint8Array(M);
    this.dil     = new Uint8Array(M);
    this.visited = new Uint8Array(M);
    this.maxPts  = Math.max(1024, 4*(sw + sh) + 512);
    this.poly    = new Int32Array(this.maxPts*2);
    this.keep    = new Uint8Array(this.maxPts);
    return true;
  };

  /* ---------- stage 1: RGBA -> luma (ITU-R BT.601, integer) ---------- */
  function lumaFromRGBA(rgba, out, n){
    for(let i=0, j=0; i<n; i++, j+=4){
      out[i] = (77*rgba[j] + 150*rgba[j+1] + 29*rgba[j+2]) >> 8;
    }
    return out;
  }

  /* ---------- stage 2: 2×2 box downsample ---------- */
  function downsample2(src, w, h, out, sw, sh){
    for(let y=0; y<sh; y++){
      const s0 = (y*2)*w, s1 = (y*2+1)*w, d = y*sw;
      for(let x=0; x<sw; x++){
        const a = x*2;

  }

  /* ---------- stage 3: separable 1-2-1 blur ---------- */
  function blur121(src, w, h, tmp, out){
    for(let y=0; y<h; y++){
      const r = y*w;
      tmp[r] = (src[r]*3 + src[r+1] + 2) >> 2;
      for(let x=1; x<w-1; x++) tmp[r+x] = (src[r+x-1] + 2*src[r+x] + src[r+x+1] + 2) >> 2;
      tmp[r+w-1] = (src[r+w-1]*3 + src[r+w-2] + 2) >> 2;
    }
    for(let x=0; x<w; x++) out[x] = (tmp[x]*3 + tmp[x+w] + 2) >> 2;
    for(let y=1; y<h-1; y++){
      const r = y*w, a = r-w, b = r+w;
      for(let x=0; x<w; x++) out[r+x] = (tmp[a+x] + 2*tmp[r+x] + tmp[b+x] + 2) >> 2;
    }
    const l = (h-1)*w;
    for(let x=0; x<w; x++) out[l+x] = (tmp[l+x]*3 + tmp[l-w+x] + 2) >> 2;

  }

  /* ---------- stage 4: Sobel magnitude, |gx| + |gy| ----------
     The L1 norm rather than the L2: it is within 8 % of the true magnitude for
     any gradient direction, and the threshold below is a percentile, so a
     uniform 8 % scaling cancels out completely. */
  function sobel(src, w, h, mag){
    mag.fill(0);
    let max = 0;
    for(let y=1; y<h-1; y++){
      const r = y*w, a = r-w, b = r+w;
      for(let x=1; x<w-1; x++){
        const i = r+x;
        const gx = (src[a+x+1] + 2*src[i+1] + src[b+x+1]) - (src[a+x-1] + 2*src[i-1] + src[b+x-1]);
        const gy = (src[b+x-1] + 2*src[b+x] + src[b+x+1]) - (src[a+x-1] + 2*src[a+x] + src[a+x+1]);
        const m = (gx < 0 ? -gx : gx) + (gy < 0 ? -gy : gy);
        mag[i] = m;
        if(m > max) max = m;
      }

  }

  /* ---------- stage 4b: percentile threshold ----------
     Wants `frac` of the pixels above the cut, but never accepts a cut below
     `floor`: on a blank wall the top 9 % of gradients are pure sensor noise and
     tracing them would burn the whole frame budget on garbage contours. */
  function percentileThreshold(mag, n, frac, floor, hist){
    hist.fill(0);
    for(let i=0; i<n; i++){
      let v = mag[i] >> 2;                 // Sobel L1 maxes at 4·255; 256 bins
      if(v > 255) v = 255;
      hist[v]++;
    }
    const want = Math.round(n*frac);
    let acc = 0, bin = 255;
    for(let b=255; b>=0; b--){
      acc += hist[b];
      if(acc >= want){ bin = b; break; }
    }
    return Math.max(floor, bin << 2);

  function threshold(mag, n, t, bin){
    for(let i=0; i<n; i++) bin[i] = mag[i] >= t ? 1 : 0;
    return bin;

  /* ---------- stage 5: separable 3×3 dilation ---------- */
  function dilate3(src, w, h, tmp, out){
    for(let y=0; y<h; y++){

      for(let x=0; x<w; x++){
        const a = x > 0 ? src[r+x-1] : 0, b = src[r+x], c = x < w-1 ? src[r+x+1] : 0;

    let cx = sx, cy = sy, dir = 5;      // entered from the west ⇒ sweep from NW

     halves. Indices wrap, so no rotation of the chain is needed. */
  function segDist2(pts, i, ax, ay, bx, by){

    if(L2 < 1e-9){ const ex = px-ax, ey = py-ay; return ex*ex + ey*ey; }

    stack[sp++] = a; stack[sp++] = b;
    while(sp > 0){
      const j = stack[--sp], i = stack[--sp];
      const len = (j - i + n) % n;
      if(len < 2) continue;
      const ax = pts[i*2], ay = pts[i*2+1], bx = pts[j*2], by = pts[j*2+1];
      let worst = -1, wi = -1;
      for(let s=1; s<len; s++){
        const k = (i + s) % n;
        const d = segDist2(pts, k, ax, ay, bx, by);

      }
      if(worst > eps2 && wi >= 0){

  function dpQuad(pts, n, eps, keep, stack, quad){

    keep.fill(0, 0, n);
    let i0 = 0, best = -1;
    for(let i=1; i<n; i++){
      const dx = pts[i*2]-pts[0], dy = pts[i*2+1]-pts[1];
      const d = dx*dx + dy*dy;
      if(d > best){ best = d; i0 = i; }
    }
    let j0 = 0; best = -1;
    for(let i=0; i<n; i++){
      const dx = pts[i*2]-pts[i0*2], dy = pts[i*2+1]-pts[i0*2+1];
      const d = dx*dx + dy*dy;
      if(d > best){ best = d; j0 = i; }
    }
    if(i0 === j0) return false;
    keep[i0] = 1; keep[j0] = 1;
    const eps2 = eps*eps;
    dpHalf(pts, n, i0, j0, eps2, keep, stack);
    dpHalf(pts, n, j0, i0, eps2, keep, stack);

    for(let i=0; i<n; i++){
      if(!keep[i]) continue;
      if(c === 4) return false;          // more than four ⇒ not our rectangle

  function quadArea(q){

    for(let i=0; i<4; i++){

      s += q[i*2]*q[j*2+1] - q[j*2]*q[i*2+1];
    }
    return Math.abs(s)/2;
  }
  function isConvex(q){
    let sign = 0;
    for(let i=0; i<4; i++){
      const a = i, b = (i+1)&3, c = (i+2)&3;
      const cr = (q[b*2]-q[a*2])*(q[c*2+1]-q[b*2+1]) - (q[b*2+1]-q[a*2+1])*(q[c*2]-q[b*2]);
      if(Math.abs(cr) < 1e-9) return false;      // three collinear corners

  function minSide(q){
    let m = Infinity;
    for(let i=0; i<4; i++){
      const j = (i+1)&3;
      const d = Math.hypot(q[j*2]-q[i*2], q[j*2+1]-q[i*2+1]);
      if(d < m) m = d;
    }
    return m;
  }

    let s = 0;
    for(let i=0; i<4; i++){

    }

  /* Reorder into TL, TR, BR, BL as seen on screen. Sorting by polar angle about
     the centroid fixes the winding (a convex quad's corners are monotone in
     angle); rotating the cycle to start at the top-left-most corner fixes the
     phase. A rectangle is 180°-symmetric, so the remaining ambiguity only ever
     flips the recovered ROLL, which this code path never consumes. */
  function orderQuad(q, out){
    let cx = 0, cy = 0;
    for(let i=0; i<4; i++){ cx += q[i*2]; cy += q[i*2+1]; }
    cx /= 4; cy /= 4;
    const idx = [0,1,2,3].sort(function(a,b){
      return Math.atan2(q[a*2+1]-cy, q[a*2]-cx) - Math.atan2(q[b*2+1]-cy, q[b*2]-cx);
    });
    let start = 0, best = Infinity;
    for(let k=0; k<4; k++){
      const i = idx[k];
      const s = q[i*2] + q[i*2+1];
      if(s < best){ best = s; start = k; }
    }
    for(let k=0; k<4; k++){
      const i = idx[(start + k) & 3];
      out[k*2] = q[i*2]; out[k*2+1] = q[i*2+1];
    }
    return out;

  /* ---------- the rectangularity test ----------
     Under perspective a real rectangle is a trapezoid, so "does it look square"
     is worthless. What IS invariant: with correct intrinsics, the homography
     that maps the model rectangle onto the detected quad must have its first
     two columns (once back-projected through K) orthogonal and equal in length,
     because they are the first two columns of a rotation matrix. Those two
     residuals ARE the test, and they only vanish for the right aspect ratio —
     which is also how the portrait/landscape ambiguity gets resolved. */
  function rectFit(q, aspect, f, cx, cy){
    if(!(aspect > 0) || !(f > 0)) return null;
    const hw = aspect/2, hh = 0.5;
    const src = [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]];
    const dst = [[q[0],q[1]],[q[2],q[3]],[q[4],q[5]],[q[6],q[7]]];
    const H = GEO.homography(src, dst);
    if(!H) return null;
    const col = function(j){
      return [ (H[0][j] - cx*H[2][j])/f, (H[1][j] - cy*H[2][j])/f, H[2][j] ];
    };
    const b1 = col(0), b2 = col(1);
    const n1 = GEO.vlen(b1), n2 = GEO.vlen(b2);
    if(!(n1 > 1e-12) || !(n2 > 1e-12)) return null;
    return {
      ortho: Math.abs(GEO.vdot(b1, b2))/(n1*n2),   // 0 for a true rectangle
      scale: Math.abs(n1 - n2)/((n1 + n2)/2)       // 0 for the right aspect
    };
  }

  /* ---------- confidence ----------
     Five independent reasons to disbelieve a detection, weighted by how often
     each one is the thing that is actually wrong in the field.

     `rms` earns its place: the ortho/scale residuals only ask "is this quad a
     rectangle of the right shape under this lens", and a quad that has latched
     onto a shelf edge running alongside the reference is still a perfectly
     valid rectangle — just the wrong one. What gives that away is the line fit
     along the sides suddenly getting worse. In testing, an outline corrupted by
     abutting clutter fitted its edges 3–5× less tightly than a clean one while
     scoring identically on every other term. */
  const CONF_W = { rect:0.36, scale:0.24, area:0.14, support:0.13, rms:0.13 };
  const CONF_RMS_BAD = 0.40;      // px of line-fit residual that zeroes the term

    const cScale = clamp01(1 - (p.scale  || 0)/0.25);
    const a = p.areaFrac || 0;

                : a < 0.05 ? (a - 0.01)/0.04
                : a <= 0.55 ? 1
                : a < 0.85 ? (0.85 - a)/0.30 : 0;

    // unrefined candidates have no residual yet; not knowing is not evidence of badness
    const cRms = (p.rms == null) ? 1 : clamp01(1 - p.rms/CONF_RMS_BAD);
    return clamp01(CONF_W.rect*cRect + CONF_W.scale*cScale
