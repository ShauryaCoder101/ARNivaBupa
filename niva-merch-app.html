<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NIVA — Merchandising Execution Console</title>
<style>
/* ============================================================
   NIVA design tokens — full light palette on bare :root.
   Dark mode overrides ONLY token values.
   ============================================================ */
:root{
  --bg:              #f4f6f9;
  --bg-sunken:       #eaeef4;
  --surface:         #ffffff;
  --surface-2:       #f8fafc;
  --surface-3:       #eef2f7;
  --border:          #dde3ec;
  --border-strong:   #c6d0de;
  --text:            #16202e;
  --text-2:          #47566b;
  --text-3:          #7a8798;
  --accent:          #0d9488;   /* vivid teal — the one saturated accent */
  --accent-hover:    #0f766e;
  --accent-soft:     #d7f2ee;
  --accent-ink:      #08514a;
  --indigo:          #1e2a44;   /* deep indigo/slate base */
  --indigo-2:        #27354f;
  --indigo-ink:      #aebbd2;
  --indigo-text:     #eef2f9;

  --st-draft:        #6b7684;
  --st-draft-bg:     #eceff3;
  --st-assigned:     #2563eb;
  --st-assigned-bg:  #e0ebff;
  --st-progress:     #b45309;
  --st-progress-bg:  #fdf0d5;
  --st-submitted:    #6d28d9;
  --st-submitted-bg: #ede4fd;
  --st-rework:       #be123c;
  --st-rework-bg:    #ffe1e7;
  --st-approved:     #15803d;
  --st-approved-bg:  #d9f2e0;
  --st-closed:       #0f6b46;
  --st-closed-bg:    #d2f0e3;

  --ok:              #15803d;
  --fail:            #be123c;
  --shadow:          0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.04);
  --shadow-lg:       0 4px 6px -2px rgba(16,24,40,.06), 0 12px 24px -6px rgba(16,24,40,.12);
  --r:               8px;
  --r-lg:            12px;
  --t:               150ms cubic-bezier(.4,0,.2,1);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:              #0e131b;
    --bg-sunken:       #090d14;
    --surface:         #151c27;
    --surface-2:       #1a2331;
    --surface-3:       #212c3d;
    --border:          #26313f;
    --border-strong:   #38455a;
    --text:            #e6ecf5;
    --text-2:          #a4b1c4;
    --text-3:          #74839a;
    --accent:          #2dd4bf;
    --accent-hover:    #5eead4;
    --accent-soft:     #10352f;
    --accent-ink:      #99f6e4;
    --indigo:          #111826;
    --indigo-2:        #182131;
    --indigo-ink:      #8b9ab5;
    --indigo-text:     #e6ecf5;

    --st-draft:        #a0acbb; --st-draft-bg:     #232c37;
    --st-assigned:     #7dabff; --st-assigned-bg:  #16264a;
    --st-progress:     #f0b451; --st-progress-bg:  #3a2a10;
    --st-submitted:    #b795f7; --st-submitted-bg: #2a1c4a;
    --st-rework:       #fb7185; --st-rework-bg:    #401320;
    --st-approved:     #57d98a; --st-approved-bg:  #10331f;
    --st-closed:       #4fd6a5; --st-closed-bg:    #0d3327;

    --ok:              #57d98a;
    --fail:            #fb7185;
    --shadow:          0 1px 2px rgba(0,0,0,.4);
    --shadow-lg:       0 12px 32px -8px rgba(0,0,0,.6);
  }
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
code,kbd,.mono{font-family:var(--mono)}
button{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}

/* ---------- Shell ---------- */
.shell{display:flex; min-height:100vh}
aside#sidebar{
  width:236px; flex:0 0 236px; background:var(--indigo); color:var(--indigo-text);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px 14px}
.brand .logo{width:30px;height:30px;flex:0 0 30px}
.brand b{font-size:16px;letter-spacing:.02em}
.brand small{display:block;font-size:10.5px;color:var(--indigo-ink);letter-spacing:.09em;text-transform:uppercase;font-weight:600;margin-top:-2px}
.navgroup{padding:6px 10px 2px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--indigo-ink);font-weight:700;margin-top:10px}
nav.nav{padding:4px 10px 16px; overflow:auto; flex:1}
.navitem{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;margin:1px 0;border:0;border-radius:var(--r);background:transparent;
  color:var(--indigo-ink);cursor:pointer;transition:background var(--t),color var(--t);font-size:13.5px;
}
.navitem:hover{background:var(--indigo-2);color:var(--indigo-text)}
.navitem.on{background:var(--indigo-2);color:#fff;font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
.navitem svg{width:16px;height:16px;flex:0 0 16px;opacity:.9}
.navitem .cnt{margin-left:auto;background:var(--accent);color:#04302c;font-size:11px;font-weight:700;
  border-radius:99px;padding:1px 7px;line-height:1.5}
.sidefoot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:var(--indigo-ink)}

.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
header#topbar{
  position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:10px 20px;min-height:56px;
}
.crumb{font-size:13px;color:var(--text-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--text)}
.spacer{flex:1}
main#app{padding:20px 22px 60px;flex:1;min-width:0}

/* ---------- Controls ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text);padding:7px 12px;border-radius:var(--r);
  cursor:pointer;font-size:13px;font-weight:500;transition:background var(--t),border-color var(--t),color var(--t),box-shadow var(--t);
  white-space:nowrap;
}
.btn:hover{background:var(--surface-3);border-color:var(--text-3)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#022f2b;font-weight:650}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#022f2b}
.btn.danger{background:var(--st-rework-bg);border-color:transparent;color:var(--st-rework);font-weight:600}
.btn.danger:hover{background:var(--st-rework);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--text)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:var(--r);border:1px solid transparent;background:transparent;cursor:pointer;
  color:var(--text-2);transition:background var(--t),color var(--t);position:relative;
}
.iconbtn:hover{background:var(--surface-3);color:var(--text)}
.iconbtn svg{width:18px;height:18px}
.dot{position:absolute;top:3px;right:2px;min-width:16px;height:16px;border-radius:99px;background:var(--st-rework);
  color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ---- session + sync chrome (replaces the old role switcher) ---- */
.whochip{display:flex;flex-direction:column;line-height:1.25;padding:0 4px 0 8px;min-width:0;max-width:210px}
.whochip .n{font-size:12.5px;font-weight:640;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whochip .r{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
.syncchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:99px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font:inherit;font-size:11.5px;
  cursor:pointer;white-space:nowrap;transition:background var(--t),border-color var(--t)}
.syncchip:hover{background:var(--surface-3)}
.syncchip i{width:8px;height:8px;border-radius:99px;background:var(--ok);flex:none}
.syncchip.busy i{background:var(--st-progress)}
.syncchip.off  i{background:var(--text-3)}
.syncchip.bad  i{background:var(--fail)}
.syncchip.bad{border-color:var(--st-rework-bg);color:var(--st-rework)}
@media (max-width:720px){ .syncchip .lbl{display:none} .whochip{max-width:120px} }

/* ---- gate: login / setup / session-expired ---- */
.gate{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;align-items:center;
  justify-content:center;padding:24px;overflow:auto}
.gate .panel{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:26px 26px 22px}
.gate .brandrow{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.gate .brandrow svg{width:34px;height:34px}
.gate h1{font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
.gate p.sub{margin:0 0 18px;font-size:13px;color:var(--text-2);line-height:1.5}
.gate label{display:block;font-size:11.5px;font-weight:600;color:var(--text-2);margin:0 0 5px}
.gate input{width:100%;padding:9px 11px;font:inherit;font-size:14px;border-radius:var(--r);
  border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text)}
.gate input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.gate .fieldrow{margin-bottom:13px}
.gate .err{margin:0 0 13px;padding:9px 11px;border-radius:var(--r);background:var(--st-rework-bg);
  color:var(--st-rework);font-size:12.5px;line-height:1.45}
.gate .note{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);
  font-size:11.5px;color:var(--text-3);line-height:1.55}
.gate pre{background:var(--surface-3);border:1px solid var(--border);border-radius:var(--r);
  padding:11px 12px;font-family:var(--mono);font-size:11.5px;overflow:auto;margin:8px 0;color:var(--text)}
.gate .panel.wide{max-width:640px}
.queuebanner{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--r);
  background:var(--st-progress-bg);color:var(--st-progress);font-size:12.5px;line-height:1.5;margin-bottom:12px}
.queuebanner.bad{background:var(--st-rework-bg);color:var(--st-rework)}
.queuebanner b{font-weight:700}

input,select,textarea{
  font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);
  border-radius:var(--r);padding:7px 9px;width:100%;transition:border-color var(--t),box-shadow var(--t);
}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:78px;line-height:1.5}
select{cursor:pointer}
label.fl{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin:0 0 5px;letter-spacing:.01em}
label.fl .req{color:var(--st-rework)}
.field{margin-bottom:14px}
.field.bad input,.field.bad select,.field.bad textarea,.field.bad .dropzone{border-color:var(--st-rework)}
.err{display:none;color:var(--st-rework);font-size:12px;margin-top:4px;font-weight:500}
.field.bad .err{display:block}
.hint{color:var(--text-3);font-size:11.5px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card>.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.card>.hd h3{margin:0;font-size:13.5px;font-weight:650;letter-spacing:.01em}
.card>.bd{padding:16px}
.card>.bd.tight{padding:0}
.pagehd{display:flex;align-items:flex-end;gap:14px;margin:0 0 18px;flex-wrap:wrap}
.pagehd h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
.pagehd p{margin:3px 0 0;color:var(--text-2);font-size:13px}
.sectlabel{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);font-weight:700;margin:22px 0 9px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 16px 14px;box-shadow:var(--shadow)}
.kpi .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:700}
.kpi .v{font-size:28px;font-weight:660;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.kpi .s{font-size:11.5px;color:var(--text-3);margin-top:3px}
.kpi.accent .v{color:var(--accent)}

/* ---------- Table ---------- */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{
  text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);
  font-weight:700;padding:9px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);
  position:sticky;top:0;
}
table.tbl td{padding:8px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
table.tbl tbody tr{transition:background var(--t)}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl tbody tr.clickable{cursor:pointer}
table.tbl tr:last-child td{border-bottom:0}
.tblwrap{overflow:auto;max-height:none}
.stack{display:flex;flex-direction:column;line-height:1.3}
.stack .sub{font-size:11.5px;color:var(--text-3)}

/* ---------- Chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:2px 9px;
  border-radius:99px;white-space:nowrap;letter-spacing:.01em}
.chip::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor;flex:0 0 6px}
.chip.plain::before{display:none}
.s-Draft{background:var(--st-draft-bg);color:var(--st-draft)}
.s-Assigned{background:var(--st-assigned-bg);color:var(--st-assigned)}
.s-Progress{background:var(--st-progress-bg);color:var(--st-progress)}
.s-Submitted{background:var(--st-submitted-bg);color:var(--st-submitted)}
.s-Rework{background:var(--st-rework-bg);color:var(--st-rework)}
.s-Approved{background:var(--st-approved-bg);color:var(--st-approved)}
.s-Closed{background:var(--st-closed-bg);color:var(--st-closed)}
.chip.pass{background:var(--st-approved-bg);color:var(--st-approved)}
.chip.fail{background:var(--st-rework-bg);color:var(--st-rework)}
.chip.neutral{background:var(--surface-3);color:var(--text-2)}
/* "still on this device" — deliberately NOT a success colour */
.chip.queued{background:var(--st-progress-bg);color:var(--st-progress)}
.chip.queued::before{animation:qpulse 1.6s ease-in-out infinite}
@keyframes qpulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){ .chip.queued::before{animation:none} }
.tag{display:inline-block;font-size:11px;font-family:var(--mono);background:var(--surface-3);color:var(--text-2);
  padding:1px 6px;border-radius:5px;letter-spacing:-.01em}

/* ---------- Progress ---------- */
.bar{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;display:flex}
.bar > span{display:block;height:100%;transition:width var(--t)}
.barlegend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:9px;font-size:11.5px;color:var(--text-2)}
.barlegend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}

.rowbar{display:grid;grid-template-columns:132px 1fr 62px;gap:12px;align-items:center;padding:7px 0}
.rowbar .lbl{font-size:12.5px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowbar .pct{text-align:right;font-size:12px;color:var(--text-2)}

/* ---------- Images ---------- */
.shot{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--border);background:var(--surface-3)}
.shot img{display:block;width:100%;height:auto}
.shot .cap{
  position:absolute;left:0;right:0;bottom:0;padding:16px 9px 6px;font-size:10.5px;line-height:1.35;
  font-family:var(--mono);color:#fff;background:linear-gradient(to top,rgba(4,10,18,.9),rgba(4,10,18,0));
  letter-spacing:-.01em;
}
.shot .tagtop{position:absolute;top:6px;left:6px;font-size:10px;font-weight:800;letter-spacing:.1em;
  background:rgba(4,10,18,.72);color:#fff;padding:2px 7px;border-radius:5px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}

.cmp{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--border);
  user-select:none;touch-action:none;background:#0b1220}
.cmp img{display:block;width:100%;height:auto;pointer-events:none}
.cmp .top{position:absolute;inset:0;overflow:hidden}
.cmp .top img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .handle{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);cursor:ew-resize;transform:translateX(-1px)}
.cmp .handle::after{content:"";position:absolute;top:50%;left:50%;width:30px;height:30px;transform:translate(-50%,-50%);
  border-radius:99px;background:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.cmp .handle::before{content:"◀ ▶";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:9px;color:#022f2b;z-index:2;font-weight:800}
.cmp .mk{position:absolute;top:8px;font-size:10px;font-weight:800;letter-spacing:.1em;background:rgba(4,10,18,.72);
  color:#fff;padding:2px 7px;border-radius:5px;z-index:3}

.dropzone{border:1px dashed var(--border-strong);border-radius:var(--r);padding:14px;text-align:center;
  background:var(--surface-2);transition:border-color var(--t),background var(--t)}
.dropzone:hover{border-color:var(--accent)}
.dropzone .btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:9px}

/* ---------- Timeline ---------- */
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--border)}
.tl .ev{position:relative;padding:0 0 14px}
.tl .ev::before{content:"";position:absolute;left:-18px;top:5px;width:9px;height:9px;border-radius:99px;
  background:var(--surface);border:2px solid var(--border-strong)}
.tl .ev.hi::before{border-color:var(--accent);background:var(--accent)}
.tl .ev .a{font-size:13px;font-weight:600}
.tl .ev .m{font-size:11.5px;color:var(--text-3);font-family:var(--mono)}
.tl .ev .d{font-size:12.5px;color:var(--text-2);margin-top:2px}

/* ---------- KV ---------- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;align-items:baseline}
.kv dt{color:var(--text-3);font-size:12px;font-weight:600}
.kv dd{margin:0}

/* ---------- Notifications ---------- */
.pop{position:absolute;top:46px;right:14px;width:340px;max-width:calc(100vw - 24px);background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);z-index:60;overflow:hidden}
.pop .ph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);
  font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
.pop .plist{max-height:min(420px,60vh);overflow:auto}
.nrow{display:flex;gap:9px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--t)}
.nrow:hover{background:var(--surface-2)}
.nrow.unread{background:var(--accent-soft)}
.nrow .ni{width:8px;height:8px;border-radius:99px;margin-top:6px;flex:0 0 8px;background:var(--border-strong)}
.nrow.unread .ni{background:var(--accent)}
.nrow .nt{font-size:12.8px;font-weight:600}
.nrow .nb{font-size:12px;color:var(--text-2)}
.nrow .nm{font-size:11px;color:var(--text-3);font-family:var(--mono);margin-top:2px}
.menuitem{display:block;width:100%;text-align:left;padding:9px 12px;background:transparent;border:0;cursor:pointer;
  font-size:13px;transition:background var(--t)}
.menuitem:hover{background:var(--surface-2)}

/* ---------- Modal / toast ---------- */
/* Above #arlayer (200), because the height question can be opened from inside
   the capture screen and a dialog nobody can see is worse than no dialog. */
.scrim{position:fixed;inset:0;background:rgba(10,16,26,.45);z-index:240;display:flex;align-items:center;
  justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  width:min(520px,100%);max-height:86vh;overflow:auto}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:650;font-size:15px}
.modal .mb{padding:18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
/* …and toasts stay above the scrim, because saveHeight answers a bad value with
   a toast and it has to be readable over the dialog that produced it. */
#toasts{position:fixed;right:16px;bottom:16px;z-index:260;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--indigo);color:var(--indigo-text);padding:10px 14px;border-radius:var(--r);
  box-shadow:var(--shadow-lg);font-size:13px;max-width:340px;border-left:3px solid var(--accent);
  animation:tin 180ms ease-out}
.toast.bad{border-left-color:var(--st-rework)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Merchandiser mobile frame ---------- */
.mobile{max-width:470px;margin:0 auto}
.mobile .devicehd{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-3);
  letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:8px;justify-content:center}
.mtask{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:12px 13px;margin-bottom:9px;cursor:pointer;box-shadow:var(--shadow);
  transition:border-color var(--t),transform var(--t)}
.mtask:hover{border-color:var(--accent)}
.mtask .t{font-weight:640;font-size:14px}
.mtask .s{font-size:12px;color:var(--text-3);margin-top:1px}
.mtask .r{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}

.geobox{border-radius:var(--r);padding:12px 14px;border:1px solid var(--border);background:var(--surface-2)}
.geobox.ok{background:var(--st-approved-bg);border-color:transparent}
.geobox.no{background:var(--st-rework-bg);border-color:transparent}
.geobox .big{font-size:22px;font-weight:660;letter-spacing:-.02em}

.banner{border-radius:var(--r);padding:12px 14px;background:var(--st-rework-bg);border-left:3px solid var(--st-rework);margin-bottom:16px}
.banner .bt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--st-rework)}
.banner .bb{font-size:13.5px;margin-top:4px;color:var(--text)}

.empty{text-align:center;padding:46px 20px;color:var(--text-3);font-size:13px}
.empty svg{width:34px;height:34px;opacity:.4;margin-bottom:10px}

.split{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
.split3{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.seg{display:inline-flex;background:var(--surface-3);border-radius:var(--r);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;font-size:12.5px;cursor:pointer;
  color:var(--text-2);transition:background var(--t),color var(--t);font-weight:550}
.seg button.on{background:var(--surface);color:var(--text);font-weight:650;box-shadow:var(--shadow)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input,.filters select{width:auto;min-width:150px}

/* ============================================================
   Guided poster capture — tier badges, placement blocks, AR layer
   ============================================================ */
.tierbadge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap;line-height:1.5}
.tier-arx{background:var(--accent-soft); color:var(--accent-ink); box-shadow:inset 0 0 0 1px var(--accent)}
.tier-ar {background:var(--st-approved-bg); color:var(--st-approved)}
.tier-ref{background:var(--st-assigned-bg); color:var(--st-assigned)}
.tier-est{background:var(--st-progress-bg); color:var(--st-progress)}
.tier-unv{background:var(--st-rework-bg);   color:var(--st-rework)}
#arDetBar{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
#arDetBar .detrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
#arDetBar .detmsg{font-size:11.5px;color:#cbd5e1;line-height:1.35;flex:1;min-width:120px}
#arDetBar .detmsg b{color:#5eead4}
#arDetBar .detmsg.warn b{color:#fbbf24}
#arDetBar .conf{position:relative;height:5px;border-radius:3px;background:rgba(148,163,184,.3);overflow:hidden;min-width:64px;flex:0 0 84px}
#arDetBar .conf i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:#fbbf24;transition:width 140ms linear}
#arDetBar .conf.hi i{background:#2dd4bf}

.pverify{border-radius:var(--r);border:1px solid var(--border);background:var(--surface-2);padding:12px 14px}
.pverify.pass{background:var(--st-approved-bg);border-color:transparent}
.pverify.fail{background:var(--st-rework-bg);border-color:transparent}
.pverify .prow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:4px 0;font-size:12.5px}
.pverify .prow .pl{color:var(--text-2);font-size:12px}
.pverify .prow b{font-variant-numeric:tabular-nums}
.pverify .phd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pverify .phd .big{font-size:21px;font-weight:660;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

.postercard{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.posterthumb{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--surface-3);
  max-width:170px;flex:0 0 auto}
.posterthumb img{display:block;width:100%;height:auto}

/* ---------- AR capture layer ---------- */
#arlayer{position:fixed;inset:0;z-index:200;display:none;background:#05080d;color:#eef4fb;
  font-family:var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#arlayer.on{display:block}
#arStage{position:absolute;inset:0;overflow:hidden;background:#05080d}
#arVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#05080d}
#arCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#arHud{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none}
#arHud .pe{pointer-events:auto}
.arbar{display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:linear-gradient(to bottom,rgba(4,8,14,.86),rgba(4,8,14,0))}
.arbar.bottom{margin-top:auto;background:linear-gradient(to top,rgba(4,8,14,.9),rgba(4,8,14,0));
  flex-direction:column;align-items:stretch;gap:10px;padding:16px 12px 20px}
.arbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(255,255,255,.24);
  background:rgba(10,18,28,.66);color:#eef4fb;padding:7px 11px;border-radius:var(--r);cursor:pointer;
  font-size:12.5px;font-weight:600;white-space:nowrap;backdrop-filter:blur(6px)}
.arbtn:hover{background:rgba(24,38,54,.8)}
.arbtn.on{background:var(--accent);border-color:var(--accent);color:#022f2b}
.arbtn:disabled{opacity:.4;cursor:not-allowed}
.arbtn svg{width:15px;height:15px}
#arTitle{font-size:12.5px;font-weight:650;line-height:1.25;min-width:0;overflow:hidden}
#arTitle small{display:block;font-size:10.5px;opacity:.65;font-family:var(--mono)}

.arstat{border-radius:10px;padding:9px 12px;font-size:14.5px;font-weight:700;letter-spacing:.01em;
  background:rgba(10,18,28,.72);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px)}
.arstat.ok{background:rgba(21,128,61,.82);border-color:rgba(120,240,170,.5)}
.arstat.no{background:rgba(190,18,60,.82);border-color:rgba(255,150,175,.5)}
.arstat .sub{display:block;font-size:11px;font-weight:500;opacity:.85;margin-top:2px;font-family:var(--mono)}
/* A held reading is not a live one. The tag rides inside the distance row so the
   big number can never be read as "this is what the phone sees right now". */
.arstat .heldtag{display:inline-block;background:#fbbf24;color:#2a1a00;border-radius:5px;
  padding:1px 6px;font-size:10.5px;font-weight:800;letter-spacing:.04em;font-family:var(--mono);
  vertical-align:2px;margin-right:6px;white-space:nowrap}

.arrow2{display:flex;gap:8px;flex-wrap:wrap}
.arrow2 .arstat{flex:1;min-width:132px;font-size:12.5px;padding:7px 10px}

/* distance ruler */
#arRuler{position:relative;height:38px;border-radius:8px;background:rgba(10,18,28,.72);
  border:1px solid rgba(255,255,255,.14);overflow:hidden;backdrop-filter:blur(6px)}
#arRulerBand{position:absolute;top:0;bottom:0;background:rgba(45,212,191,.28);border-left:1px solid rgba(45,212,191,.9);
  border-right:1px solid rgba(45,212,191,.9)}
#arRulerTicks{position:absolute;inset:0}
#arRulerTicks i{position:absolute;top:0;width:1px;height:7px;background:rgba(255,255,255,.3)}
#arRulerTicks span{position:absolute;top:9px;transform:translateX(-50%);font-size:9px;opacity:.6;font-family:var(--mono)}
#arNeedle{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.8);
  transform:translateX(-1px);transition:left 90ms linear}
#arNeedle::after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
  border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:6px solid #fff}

/* bubble level */
#arLevel{position:absolute;right:12px;top:96px;width:96px;height:96px;border-radius:99px;
  background:rgba(10,18,28,.6);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px)}
#arLevel .ring{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;
  border-radius:99px;border:1px dashed rgba(255,255,255,.45)}
#arLevel .cx,#arLevel .cy{position:absolute;background:rgba(255,255,255,.34)}
#arLevel .cx{left:8px;right:8px;top:50%;height:1px}
#arLevel .cy{top:8px;bottom:8px;left:50%;width:1px}
#arBubble{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:99px;
  background:var(--st-rework);box-shadow:0 0 10px rgba(0,0,0,.5);transition:transform 90ms linear,background 160ms}
#arBubble.ok{background:#2dd4bf}

/* shutter + arming ring */
#arShutterWrap{position:relative;width:78px;height:78px;margin:0 auto}
#arArm{position:absolute;inset:0;transform:rotate(-90deg)}
#arArm circle{fill:none;stroke-width:4}
#arArm .trk{stroke:rgba(255,255,255,.22)}
#arArm .prg{stroke:#2dd4bf;stroke-linecap:round;transition:stroke-dashoffset 80ms linear}
#arShutter{position:absolute;left:9px;top:9px;width:60px;height:60px;border-radius:99px;border:0;
  background:#4b5563;color:#0b1220;cursor:not-allowed;display:flex;align-items:center;justify-content:center}
#arShutter.armed{background:#2dd4bf;cursor:pointer;box-shadow:0 0 22px rgba(45,212,191,.55)}
#arShutter svg{width:26px;height:26px}

/* draggable reference handles */
.arh{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:99px;
  border:2px solid #fff;background:rgba(45,212,191,.32);cursor:grab;touch-action:none;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.8)}
.arh:active{cursor:grabbing;background:rgba(45,212,191,.6)}

#arPanel{position:absolute;inset:0;overflow:auto;background:rgba(6,10,16,.96);padding:20px 16px;
  display:none;-webkit-user-select:text;user-select:text}
#arPanel.on{display:block}
#arPanel .pnl{max-width:520px;margin:0 auto;background:var(--surface);color:var(--text);
  border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-lg)}
#arPanel h2{margin:0 0 6px;font-size:17px;font-weight:650}
#arPanel p{margin:0 0 10px;font-size:13.5px;color:var(--text-2);line-height:1.55}
#arPanel .mono{font-size:12.5px}
#arPanel ol,#arPanel ul{margin:0 0 12px;padding-left:20px;font-size:13px;color:var(--text-2);line-height:1.6}
#arPanel .pfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

#arChips{display:flex;gap:6px;flex-wrap:wrap;font-size:11px}
.archip{background:rgba(10,18,28,.7);border:1px solid rgba(255,255,255,.16);border-radius:99px;
  padding:2px 8px;font-family:var(--mono);font-size:10.5px;backdrop-filter:blur(6px)}

/* ---------- the field build of the capture screen: one line, one button ----------
   A merchandiser standing in a shop can act on exactly two things: where they
   are standing, and how they are holding the phone. Focal lengths, detector
   timings, sensor sources, screen angles, tier letters and a choice between
   three ways of marking a rectangle are none of those, so the field build does
   not draw them. The elements still exist and are still written on the
   manager/admin path — this is a change of what is PRESENTED, not of what is
   measured or recorded. */
#arSimple{display:none;flex-direction:column;gap:9px}
#arHud.simple #arSimple{display:flex}
#arHud.simple #arChips,
#arHud.simple #arRuler,
#arHud.simple #arTools,
#arHud.simple #arAngles,
#arHud.simple #arTier,
#arHud.simple #arLevel,
#arHud.simple #arShutterWrap{display:none}
#arHud.simple .arbar.bottom{gap:9px;padding:14px 12px 18px}
/* The ONE extra line the fit maths earns: how much wall is in view, or where to
   stand so the poster fits. Quiet, under the distance line, never a chip. */
#arSee{font-size:12px;line-height:1.4;color:#b8c7d8;padding:0 2px}
#arSee:empty{display:none}
#arSimpleHint{font-size:13.5px;line-height:1.45;color:#dbe6f2;background:rgba(10,18,28,.74);
  border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 12px;
  display:flex;gap:11px;align-items:center;backdrop-filter:blur(6px)}
#arSimpleHint:empty{display:none}
#arSimpleHint b{color:#5eead4}
#arSimpleHint .cue{flex:0 0 auto;width:30px;height:40px;color:#5eead4}
#arSimpleWarn{font-size:13px;line-height:1.45;font-weight:650;color:#2a1a00;background:#fbbf24;
  border-radius:10px;padding:9px 12px}
#arSimpleWarn:empty{display:none}
/* The button carries the arming progress as a fill rather than a separate ring:
   it still cannot be pressed until every gate has held for the full ARM_MS, but
   the waiting reads as the button filling up instead of as an instrument. */
#arSimpleBtn{display:block;width:100%;border:0;border-radius:12px;padding:15px 16px;
  font-size:16px;font-weight:800;letter-spacing:.01em;color:#022f2b;cursor:pointer;
  font-family:inherit;background:#2dd4bf}
#arSimpleBtn:disabled{cursor:not-allowed;color:#cbd5e1;
  background:linear-gradient(90deg,rgba(45,212,191,.5) 0 var(--p,0%),#39424f var(--p,0%) 100%)}
#arSimpleFoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#arSimpleFoot:empty{display:none}
#arSimpleFoot .rough{flex:1;min-width:150px;font-size:11.5px;line-height:1.35;color:#cbd5e1}
#arSimpleAlt{display:block;width:100%;background:none;border:0;color:#9fb2c6;font-family:inherit;
  font-size:12px;text-decoration:underline;padding:3px 0 0;cursor:pointer;text-align:center}
#arSimpleAlt:empty{display:none}

@media (max-width:1180px){ .split{grid-template-columns:1fr} }
@media (max-width:900px){
  .shell{flex-direction:column}
  aside#sidebar{width:auto;flex:none;height:auto;position:static;flex-direction:row;align-items:center;
    overflow-x:auto;gap:4px;padding:0 8px}
  .brand{padding:10px 10px 10px 6px;flex:0 0 auto}
  .brand .txt{display:none}
  .navgroup{display:none}
  nav.nav{display:flex;padding:6px 0;gap:4px;flex:1;overflow-x:auto}
  .navitem{white-space:nowrap;width:auto;margin:0}
  .navitem.on{box-shadow:inset 0 -2px 0 var(--accent)}
  .sidefoot{display:none}
  main#app{padding:16px 12px 60px}
  header#topbar{padding:10px 12px}
  .grid2,.grid3{grid-template-columns:1fr}
  .split3{grid-template-columns:1fr}
}
@media (max-width:620px){ .kpis{grid-template-columns:repeat(2,1fr)} .crumb{display:none} }

/* ============================================================================
   FIELD LAYER — mobile.
   Everything below is additive: new selectors, plus a mobile breakpoint that
   overrides the desktop rules above rather than editing them. The desktop
   console at >=1180px is untouched by any of it.

   Two audiences share this file. The manager console is legitimately dense and
   only gets a responsive pass (things stop overflowing, tables scroll inside
   themselves, controls become thumb-sized). The merchandiser side is
   restructured: a bottom bar instead of a sidebar, job cards instead of table
   rows, and a four-step sequence instead of one long scroll.
   ============================================================================ */

/* ---- the page body must never scroll sideways, at any width ---- */
html{overflow-x:hidden}
body{overflow-x:hidden;max-width:100%}
.mainwrap,main#app{max-width:100%;min-width:0}
img,svg,video,canvas{max-width:100%}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
pre,.mono{overflow-wrap:anywhere}
/* The AR capture layer sizes its own surfaces and is not this layer's
   business — opt it out of every global above. */
#arlayer img,#arlayer svg,#arlayer video,#arlayer canvas{max-width:none}
#arlayer .mono,#arlayer pre{overflow-wrap:normal}

/* ---- bottom bar: the merchandiser's whole navigation ---- */
.botnav{
  display:none; position:fixed; left:0; right:0; bottom:0; z-index:70;
  background:var(--surface); border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -2px 10px rgba(10,16,26,.10);
}
.botnav .row{display:flex; align-items:stretch}
.botnav.many .row{overflow-x:auto; scrollbar-width:none}
.botnav.many .row::-webkit-scrollbar{display:none}
.botitem{
  flex:1 1 0; min-width:60px; min-height:56px; position:relative;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  border:0; background:transparent; color:var(--text-2); cursor:pointer;
  font-size:11px; font-weight:650; letter-spacing:.01em; padding:8px 4px 9px;
  -webkit-tap-highlight-color:transparent;
}
/* a manager's five destinations have to fit 375px without a sideways swipe;
   the scroller behind them is only a safety net for anything narrower */
.botnav.many .botitem{flex:1 0 64px;min-width:64px;font-size:10px;padding:8px 2px 9px}
.botnav.many .botitem span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.botitem svg{width:22px;height:22px;stroke-width:1.85}
.botitem.on{color:var(--accent)}
.botitem.on::before{
  content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:32px; height:3px; border-radius:0 0 3px 3px; background:var(--accent);
}
.botitem .cnt{
  position:absolute; top:5px; left:50%; margin-left:5px; background:var(--st-rework); color:#fff;
  font-size:10px; font-weight:800; border-radius:99px; padding:0 5px; line-height:16px;
  min-width:16px; text-align:center;
}

/* ---- job cards: what a merchandiser sees instead of a table row ---- */
.joblist{display:block}
.jobcard{
  display:block; width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--border); border-left:3px solid var(--border);
  border-radius:var(--r-lg); box-shadow:var(--shadow); margin-bottom:10px;
  overflow:hidden; cursor:pointer; transition:border-color var(--t), box-shadow var(--t);
}
.jobcard:hover{border-color:var(--border-strong)}
.jobcard.now{border-left-color:var(--accent)}
.jobcard.fix{border-left-color:var(--st-rework)}
.jobcard.wait{border-left-color:var(--st-submitted)}
.jobcard.done{border-left-color:var(--st-approved)}
.jc-b{padding:14px 15px 12px}
.jc-store{font-size:16.5px;font-weight:680;letter-spacing:-.012em;line-height:1.25;color:var(--text)}
.jc-where{font-size:13px;color:var(--text-2);margin-top:2px}
.jc-what{
  display:flex; gap:9px; align-items:flex-start; margin-top:11px; padding:9px 11px;
  border-radius:var(--r); background:var(--surface-3); color:var(--text); font-size:13.5px; line-height:1.4;
}
.jc-what svg{width:17px;height:17px;flex:0 0 17px;margin-top:1px;color:var(--text-2)}
.jc-what b{font-weight:660}
.jc-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}
.jc-act{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  border-top:1px solid var(--border); background:var(--surface-2); padding:9px 11px 9px 15px;
}
.jc-when{font-size:12.5px;color:var(--text-2);font-weight:550}
.jc-act .btn{min-height:44px}

/* plain-language status pill — no tiers, no capture modes, no error percentages */
.plain{
  display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:680;
  padding:4px 10px; border-radius:99px; background:var(--surface-3); color:var(--text-2);
  white-space:nowrap; letter-spacing:.005em;
}
.plain.ok{background:var(--st-approved-bg);color:var(--st-approved)}
.plain.go{background:var(--accent-soft);color:var(--accent-ink)}
.plain.warn{background:var(--st-progress-bg);color:var(--st-progress)}
.plain.stop{background:var(--st-rework-bg);color:var(--st-rework)}
.plain.wait{background:var(--st-submitted-bg);color:var(--st-submitted)}
/* inside a tinted geobox the pill shares the box's own tint, so lift it */
.geobox .plain{background:var(--surface)}

/* ---- the four-step sequence ---- */
.seqrail{
  display:flex; align-items:stretch; gap:2px; margin:0 0 14px; padding:4px;
  background:var(--surface); border:1px solid var(--border); border-radius:99px; box-shadow:var(--shadow);
}
.seqrail .sq{
  flex:1 1 0; min-width:0; min-height:46px; display:flex; align-items:center; justify-content:center; gap:7px;
  border:0; background:transparent; border-radius:99px; padding:0 8px; cursor:pointer;
  font-size:12.5px; font-weight:650; color:var(--text-2); white-space:nowrap; overflow:hidden;
}
.seqrail .sq i{
  width:19px; height:19px; flex:0 0 19px; border-radius:99px; background:var(--surface-3); color:var(--text-2);
  display:flex; align-items:center; justify-content:center; font-style:normal; font-size:10.5px; font-weight:800;
}
.seqrail .sq.done{color:var(--accent)}
.seqrail .sq.done i{background:var(--accent);color:#022f2b}
.seqrail .sq.on{background:var(--accent);color:#022f2b;flex:2 1 0}
.seqrail .sq.on i{background:rgba(2,47,43,.22);color:#022f2b}
.seqrail .sq:disabled{opacity:.42;cursor:default}
.seqrail .sq svg{width:12px;height:12px;stroke-width:3.2}

.steptitle{margin:0 0 3px;font-size:21px;font-weight:690;letter-spacing:-.018em;line-height:1.2}
.stepsub{margin:0 0 14px;font-size:13.5px;color:var(--text-2);line-height:1.5}

.here{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  box-shadow:var(--shadow); padding:15px 15px 14px; margin-bottom:12px;
}
.here .hs{font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.22}
.here .hw{font-size:13.5px;color:var(--text-2);margin-top:3px}
.bigfact{
  display:flex; gap:11px; align-items:flex-start; padding:12px 14px; border-radius:var(--r);
  background:var(--accent-soft); color:var(--accent-ink); margin-top:13px;
}
.bigfact svg{width:19px;height:19px;flex:0 0 19px;margin-top:1px;opacity:.85}
.bigfact .bn{font-size:15px;font-weight:680;line-height:1.32}
.bigfact .bs{font-size:12.5px;opacity:.85;margin-top:2px;line-height:1.4}

/* progressive disclosure — the things that matter only sometimes */
.disc{
  border:1px solid var(--border); border-radius:var(--r-lg); background:var(--surface);
  margin-bottom:10px; overflow:hidden;
}
.disc>summary{
  list-style:none; cursor:pointer; padding:13px 15px; min-height:48px;
  display:flex; align-items:center; gap:10px; font-size:13.5px; font-weight:640; color:var(--text);
}
.disc>summary::-webkit-details-marker{display:none}
.disc>summary::after{
  content:""; margin-left:auto; flex:none; width:8px; height:8px;
  border-right:2px solid var(--text-3); border-bottom:2px solid var(--text-3);
  transform:rotate(45deg) translate(-2px,-2px); transition:transform var(--t);
}
.disc[open]>summary::after{transform:rotate(-135deg)}
.disc>summary svg{width:17px;height:17px;color:var(--text-3);flex:none}
.disc .dbd{padding:0 15px 15px;font-size:13.5px;color:var(--text-2);line-height:1.62}
.disc .dbd .tl{margin-top:2px}

/* one obvious primary action, always within thumb reach */
.actionbar{
  position:sticky; bottom:0; z-index:35; display:flex; gap:8px; margin:18px 0 0; padding:20px 0 4px;
  background:linear-gradient(to top,var(--bg) 0,var(--bg) 76%,rgba(128,128,128,0) 100%);
}
.actionbar .btn{flex:1 1 auto;min-height:52px;font-size:15px;font-weight:690;justify-content:center}
.actionbar .btn.back{flex:0 0 52px;min-width:52px;padding:0}
.actionbar .btn.back svg{width:19px;height:19px}
/* A short step must not leave its action stranded halfway up the screen: the
   screen fills the viewport and the bar is pushed to the bottom of it. */
.fieldscreen{display:flex;flex-direction:column;min-height:calc(100vh - 160px)}
.fieldscreen>.actionbar{margin-top:auto}

.stepnote{font-size:12.5px;color:var(--text-2);line-height:1.55;margin-top:10px}
.photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.photocell{position:relative}
.photocell .rm{
  position:absolute;top:6px;right:6px;min-height:34px;padding:6px 10px;font-size:12px;
  background:rgba(4,10,18,.78);color:#fff;border-color:transparent;
}
.readonly-note{
  border-radius:var(--r); padding:12px 14px; background:var(--st-progress-bg); color:var(--st-progress);
  font-size:13px; line-height:1.55; margin-bottom:12px;
}
.outcome{
  border-radius:var(--r-lg); padding:16px; background:var(--surface); border:1px solid var(--border);
  border-left:3px solid var(--accent); box-shadow:var(--shadow); margin-bottom:12px;
}
.outcome .ot{font-size:16.5px;font-weight:680;letter-spacing:-.01em}
.outcome .ob{font-size:13.5px;color:var(--text-2);margin-top:5px;line-height:1.55}
.outcome.wait{border-left-color:var(--st-submitted)}
.outcome.ok{border-left-color:var(--st-approved)}
.outcome.fix{border-left-color:var(--st-rework)}

/* updates strip — the notification bell, folded into the job list */
.updates{
  background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--st-assigned);
  border-radius:var(--r-lg); box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden;
}
.updates .uh{
  display:flex; align-items:center; gap:9px; padding:11px 13px; font-size:12.5px; font-weight:700;
  letter-spacing:.02em; color:var(--text);
}
.updates .uh>svg{width:18px;height:18px;flex:none;color:var(--st-assigned)}
.updates .uh .btn{margin-left:auto}
.updates .ur{
  display:block; width:100%; text-align:left; border:0; border-top:1px solid var(--border);
  background:transparent; padding:11px 13px; cursor:pointer; min-height:48px;
}
.updates .ur:hover{background:var(--surface-2)}
.updates .ur .ut{font-size:13px;font-weight:640;color:var(--text)}
.updates .ur .ub{font-size:12.5px;color:var(--text-2);margin-top:2px;line-height:1.45}
.updates .ur .um{font-size:11.5px;color:var(--text-3);margin-top:3px}

/* ---- approvals queue: dense by design, but it has to fit a phone ---- */
.apv{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.apv-thumb{width:132px;flex:0 0 132px}
.apv-body{flex:1 1 200px;min-width:0}
.apv-acts{display:flex;flex-direction:column;gap:7px}
@media (max-width:760px){
  .apv{gap:12px;align-items:flex-start}
  .apv-thumb{width:88px;flex:0 0 88px}
  .apv-body{flex:1 1 140px}
  .apv-acts{flex:1 1 100%;flex-direction:row;flex-wrap:wrap}
  .apv-acts .btn{flex:1 1 46%}
}

/* ============================================================================
   TABLET — 761px to 1000px keeps the existing horizontal nav strip, but the
   dense widgets stop being dense.
   ============================================================================ */
@media (max-width:1000px){
  .tblwrap table.tbl{min-width:620px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
}
@media (max-width:900px){
  .filters input,.filters select{min-width:0;flex:1 1 190px}
  .rowbar{grid-template-columns:110px 1fr 52px;gap:10px}
  .shots{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .posterthumb{max-width:132px}
}

/* ============================================================================
   MOBILE — <=760px. The sidebar goes away entirely and the bottom bar takes
   over; the topbar keeps only where-you-are and an honest sync indicator.
   ============================================================================ */
@media (max-width:760px){
  aside#sidebar{display:none}
  .botnav{display:block}
  .shell{flex-direction:column;min-height:100vh}

  header#topbar{padding:8px 6px 8px 12px;gap:8px;min-height:60px}
  main#app{padding:14px 12px calc(80px + env(safe-area-inset-bottom,0px))}

  /* topbar: where they are, plus sync. Nothing else. */
  #whochip{display:none}
  #bell{display:none}
  #gear{display:none}          /* the overflow menu lives behind "More" */
  .crumb{
    display:block; font-size:15.5px; font-weight:670; letter-spacing:-.01em; color:var(--text);
    flex:1; min-width:0;
  }
  .crumb .cwho{display:none}   /* name + role belong in the menu, not the chrome */
  /* the sync indicator keeps its words. A bare coloured dot is not an honest
     status when the answer might be "3 photos are still on this phone". */
  .syncchip{height:44px;padding:0 14px;font-size:12px;flex:0 1 auto;max-width:52%}
  .syncchip .lbl{display:inline;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .syncchip i{width:9px;height:9px}

  /* touch targets */
  .btn{min-height:44px;padding:10px 15px;font-size:14px;border-radius:10px}
  /* 44px is the floor for anything a thumb has to hit, "small" included */
  .btn.sm{min-height:44px;padding:9px 13px;font-size:13px}
  .photocell .rm{min-height:44px}
  .iconbtn{width:44px;height:44px}
  .menuitem{min-height:48px;display:flex;align-items:center;font-size:14px;padding:12px 14px}
  .seg{width:100%;display:flex}
  .seg button{flex:1;min-height:40px;font-size:13px}
  input,select,textarea{min-height:44px;font-size:16px;padding:10px 12px}  /* 16px: iOS will not zoom */
  textarea{min-height:110px}
  .nrow{min-height:52px}

  /* AR capture layer keeps its own metrics — not this layer's business */
  #arlayer .btn{min-height:auto;padding:7px 12px;font-size:13px;border-radius:var(--r)}
  #arlayer input,#arlayer select,#arlayer textarea{min-height:auto;font-size:14px;padding:7px 9px}

  /* legibility in daylight: stop using the faintest ink for anything real */
  .hint{color:var(--text-2);font-size:12.5px}
  .kpi .s{color:var(--text-2)}

  /* density */
  .pagehd{gap:8px;margin-bottom:14px}
  .pagehd h1{font-size:19px}
  .pagehd p{font-size:12.5px}
  .card>.hd{padding:11px 13px}
  .card>.bd{padding:13px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi{padding:13px 13px 11px;border-radius:var(--r-lg)}
  .kpi .v{font-size:23px}
  .split,.split3,.grid2,.grid3{grid-template-columns:1fr}
  .shots{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}
  .rowbar{grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0}
  .rowbar .lbl{grid-column:1;white-space:normal}
  .filters{gap:8px}
  .filters input,.filters select{flex:1 1 100%;width:100%}
  .kv{grid-template-columns:1fr;gap:0}
  .kv dt{margin-top:9px}
  .kv dd{margin:1px 0 0}
  .kv dt:first-of-type{margin-top:0}
  .postercard{gap:11px}
  .posterthumb{max-width:104px}
  .mobile{max-width:100%}
  .tl{padding-left:18px}

  /* popovers become sheets anchored above the bottom bar */
  /* !important because toggleNotifs/toggleMenu set a pixel width inline */
  .pop{
    position:fixed; top:auto; left:8px; right:8px; max-width:none;
    width:auto !important;
    bottom:calc(64px + env(safe-area-inset-bottom,0px));
  }
  .pop .plist{max-height:min(52vh,420px)}
  /* toasts move to the top: the bottom of a phone screen belongs to the bottom
     bar and the step's primary action, and a toast must never cover either */
  #toasts{left:12px;right:12px;bottom:auto;top:calc(68px + env(safe-area-inset-top,0px))}
  .toast{max-width:none}
  .scrim{padding:0;align-items:flex-end}
  .modal{width:100%;max-height:90vh;border-radius:var(--r-lg) var(--r-lg) 0 0}
  .modal .mf{position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap}
  .modal .mf .btn{flex:1 1 auto}

  /* the sequence's primary action sits above the bottom bar */
  .actionbar{
    bottom:calc(56px + env(safe-area-inset-bottom,0px));
    margin-left:-12px; margin-right:-12px; padding:12px 12px 10px;
  }
  .steptitle{font-size:20px}
  .seqrail .sq:not(.on) span{display:none}
  .seqrail .sq:not(.on){flex:0 0 46px;gap:0}
}

@media (max-width:400px){
  .jc-store{font-size:15.5px}
  .here .hs{font-size:17.5px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .photogrid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}
</style>
</head>
<body>
<div class="shell">
  <aside id="sidebar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="8" fill="#0d9488"/>
        <path d="M9 23V9l14 14V9" stroke="#04211f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="txt"><b>NIVA</b><small>Field Ops</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">Supabase backend<br>offline-first · v3</div>
  </aside>
  <div class="mainwrap">
    <header id="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <!-- The "Viewing as" role switcher that used to live here has been
           removed. Role is read from the authenticated user's profiles.role
           and cannot be chosen in the UI. -->
      <button class="syncchip" id="syncchip" type="button" title="Sync status"></button>
      <div class="whochip" id="whochip"></div>
      <button class="iconbtn" id="bell" title="Notifications" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      </button>
      <button class="iconbtn" id="gear" title="Menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
      </button>
    </header>
    <main id="app"></main>
  </div>
</div>
<!-- Bottom bar. Hidden above 760px, where the sidebar does this job. It is a
     sibling of .shell rather than a child so it can be position:fixed without
     inheriting the shell's flex context. -->
<nav class="botnav" id="botnav" aria-label="Main navigation"></nav>
<div id="pops"></div>
<div id="modals"></div>
<!-- Setup panel / login screen / session-expired prompt. Rendered over
     everything else; the app shell behind it keeps its state. -->
<div id="gate"></div>
<div id="arlayer" aria-hidden="true"></div>
<div id="toasts"></div>

<script>
"use strict";
(function(){

/* ============================================================================
   0. SUPABASE CONFIGURATION  —  the only two values you need to edit
   ----------------------------------------------------------------------------
   Paste your project's URL and its **anon** key below.

   The anon key is PUBLISHABLE BY DESIGN. It is a JWT with the `anon` role and
   it carries no authority of its own: every table in this schema has
   `enable row level security` + `force row level security`, and every policy is
   granted `to authenticated`, so a request holding nothing but the anon key can
   read and write exactly nothing. Authority comes from the user's own access
   token, minted by GoTrue when they sign in, and is bounded by their
   `profiles.role`. Shipping this key in a static HTML file is the intended
   deployment model.

   The **service_role** key is the opposite of that: it bypasses RLS entirely.
   It must NEVER appear in this file, in any file served to a browser, in a
   commit, or in a build artefact. If you ever paste one here, treat it as
   compromised and rotate it in the Supabase dashboard immediately.

   Find both values in your project at:
     Dashboard -> Project Settings -> API
       "Project URL"          -> SUPABASE_URL
       "Project API keys" -> `anon` `public`  -> SUPABASE_ANON

   Leave the placeholders in place and the app boots into a setup panel instead
   of erroring.
   ========================================================================== */
const SUPABASE_URL  = "https://azuxbwwlrxvotmncmcvu.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6dXhid3dscnh2b3RtbmNtY3Z1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MDQzNDUsImV4cCI6MjEwMzM4MDM0NX0.1EL8UuqHkEDu1mC3r1eeDjscbYbEj8_w9NPOf4Aa5YQ";

/* Signed-URL lifetime for private evidence photos, and the point at which a
   cached one is considered stale enough to re-sign. */
const SIGNED_URL_TTL_S     = 900;   // ask the Storage API for 15 minutes
const SIGNED_URL_REFRESH_S = 660;   // re-sign once 11 minutes have passed
/* How often the dashboard asks the server for other people's activity. */
const POLL_INTERVAL_MS     = 45000;

/* ==========================================================
   0b. APP MODE  —  poster mockup (site survey)  vs  installation verification
   ------------------------------------------------------------
   There are two products in this file, and this one constant decides which of
   them ships.

     "mockup"        SITE SURVEY. The poster is a FILE and is never installed.
                     A manager uploads the artwork with its true size in feet
                     and assigns stores. A merchandiser visits an assigned
                     store, finds an EMPTY WALL that could hold it, and the app
                     superimposes the artwork on that wall at true scale. The
                     manager later browses those mockups and shortlists which
                     walls are suitable. There is no "before", no proof of
                     installation and no rework cycle.

     "verification"  INSTALLATION VERIFICATION — the original product. A poster
                     is physically installed, photographed from spec, and the
                     capture is the evidence that it happened: before/after
                     comparison, verification tiers, placement-verified KPIs,
                     completion records, and a rework loop when a manager
                     rejects the work.

   NOTHING IS DELETED FOR "mockup". Every line of the verification product is
   still here and still RUNS: placements are still measured, tiers are still
   assigned, the same audit events are still written, the same rows still reach
   the same tables, the AR engine is untouched. What the mode changes is what is
   SHOWN and how it is WORDED. Set APP_MODE = "verification" and today's build
   comes back whole, with no other edit anywhere in the file.

   THE DATABASE KNOWS NOTHING ABOUT THIS FLAG, and must not. `task_status`
   keeps its own names — Draft / Assigned / In Progress / Submitted /
   Rework Required / Approved / Closed — niva_tasks_transition_guard keeps
   enforcing the same edges, and RLS keeps keying off them. Mockup mode
   relabels them for humans only, in statusLabel():

       Draft            ->  "Draft"
       Assigned         ->  "To visit"
       In Progress      ->  "On site"
       Submitted        ->  "Mockup captured"
       Approved         ->  "Wall suitable"
       Rework Required  ->  "Wall not suitable"
       Closed           ->  "Done"

   So the manager's two decisions read as a shortlist — "Wall suitable" and
   "Not suitable" — while travelling down the existing Approve / Reject edges.
   Rejecting still demands a reason and still routes through doReject(); it
   simply stops being phrased as a demand to redo the work.

   `notification_kind` is a Postgres ENUM, so those strings are never rewritten
   either: they are relabelled on the way out by notifLabel(). Audit action text
   is likewise stored verbatim and relabelled by auditActionLabel(), so an event
   row is byte-identical in both modes and rows written before a flip still read
   correctly after it.

   Grep for MOCKUP to find every gate.
   ========================================================== */
const APP_MODE = "mockup";                    // "mockup" | "verification"
const MOCKUP   = (APP_MODE === "mockup");
/* Choose between two literals by mode. Reads at the call site as
   byMode(what the survey says, what the verifier says). */
function byMode(mockup, verification){ return MOCKUP ? mockup : verification; }

/* ==========================================================
   1. Constants & domain model
   ========================================================== */
const LS_KEY = "niva.state.v2";              // legacy prototype blob (detected once, for the migration notice)
const LEGACY_NOTICE_KEY = "niva.legacy.notice.v1";
const CACHE_KEY_PREFIX = "niva.cache.v3.";   // per-user render cache
const SESSION_KEY = "niva.session.v1";       // GoTrue tokens
const OUTBOX_KEY  = "niva.outbox.v1";        // durable write queue
const SIGN_KEY    = "niva.signcache.v1";     // signed-URL cache
const LS_KEY_V1 = "niva.state.v1";
const CALIB_KEY = "niva.calib.v1";
const GEOFENCE_M = 150;

/* Guided-capture defaults. Managers may override these per task. */
const STANDOFF_FT     = 6.0;   // target camera-to-wall distance
const STANDOFF_TOL_FT = 0.5;   // ± band
const ANGLE_TOL_DEG   = 5;     // ± per axis
const ARM_MS          = 800;   // gates must hold continuously this long
const ASSUMED_HFOV_DEG= 66;    // last-resort smartphone horizontal FOV

/* ---- MOCKUP MODE: the standoff comes from the POSTER, not from a constant ----

   STANDOFF_FT above is a VERIFICATION number and stays one. It says "photograph
   the installed poster from 6 ft" because that is the spec the evidence is
   measured against, and a manager may override it per task. In MOCKUP mode
   there is no installed poster and no evidence: a merchandiser is holding a
   phone in front of a BARE wall, and the only thing that matters is whether the
   artwork can be DRAWN COMPLETE on it. That is a property of the poster and the
   lens, not of a policy — so it is derived, not configured.

   A frame `px` pixels wide with focal length f sees, at a perpendicular
   distance d,

       S_visible = d · px / f                      (GEO.visibleSpan)

   At 6 ft a 66°-HFOV phone therefore sees about 7.8 ft of wall, and a 9 × 8 ft
   poster CANNOT be drawn complete from there. The old fixed gate was not merely
   wrong for that task, it was unsatisfiable — which is exactly what the
   merchandiser hit. Rearranged, the distance at which a poster W wide fills a
   chosen fraction of the frame is

       d = f · W / (fill · px)                     (GEO.distanceForFill)

   giving the two numbers this mode uses instead of a constant:

     · RECOMMENDED — fill = FRAME_FILL_TARGET. The poster is big in frame with
       room around it to see the wall it is sitting on. 9 × 8 ft on a portrait
       phone lands at 9.9 ft.
     · MINIMUM — fill = 1, the poster exactly filling the frame. Below this the
       capture is not off-spec, it is IMPOSSIBLE, and it is the only hard block
       left in mockup mode. 9 × 8 ft lands at 6.9 ft, which is why 6 ft could
       never have worked.

   Everything from the minimum outwards is allowed: the merchandiser stands
   where the wall lets them stand. */
const FRAME_FILL_TARGET = 0.70;   // poster/frame width fraction at the recommended distance
const FRAME_FILL_FULL   = 1.00;   // …and at the minimum workable distance
/* …and the fraction below which standing further back is worth ONE SENTENCE and
   never a refusal. Half the target fill, so it starts at twice the recommended
   distance: the mockup is still complete and still honest — the artwork simply
   sits small in a lot of wall. A merchandiser who has backed up that far has
   usually done it because the aisle made them, and refusing a capture for a
   preference is precisely the mistake the fixed standoff made. */
const FRAME_FILL_LOOSE  = 0.35;
/* The one place a recommendation must be quoted before any camera is open — the
   brief a merchandiser reads before walking into the store. Portrait, at the
   assumed lens, because that is the phone the app falls back to. The LIVE
   capture screen never uses this: it measures the frame it actually has. */
const NOMINAL_FRAME_W   = 1080;
const NOMINAL_FRAME_H   = 1920;

/* ---- reference-scale error budget ----
   Distance from a reference is D = f·W/w_px, so every one of these is a
   RELATIVE standard deviation feeding a quadrature sum. They are declared here
   rather than buried in a "± 2 %" string, so the number the merchandiser reads
   is derived from the actual measurement chain and moves when the chain changes
   — calibrate the device and the reported error drops on its own. */
const FOCAL_SIGMA_FLOOR   = 0.012;  // focus breathing: a phone's focal length genuinely
                                    // moves ~1 % between near and far focus
const FOCAL_SIGMA_TRACK   = 0.030;  // MediaStreamTrack FOV, reported in whole degrees
const FOCAL_SIGMA_ASSUMED = 0.120;  // an assumed 66° HFOV across the whole Android fleet
const CALIB_DIST_SIGMA_FT = 0.0417; // ±0.5 in on the tape, plus where the user stood
const CALIB_EDGE_SIGMA_PX = 1.5;    // per handle, dragging onto an edge by eye
/* Uncorrected radial distortion, as a fraction of scale at the frame corner.
   Phone ISPs correct most of it; this is a conservative residual, and it is why
   the HUD nudges the reference back toward the middle of the frame. */
const BARREL_K            = 0.030;
const BARREL_WARN_R       = 0.55;   // normalised radius at which we start nagging

/* ---- floor-line (reference-free) distance ----
   THE METHOD. Hold the phone at height h above the floor, tilt it down by θ
   below horizontal until the reticle sits on the line where the wall meets the
   floor, and the horizontal distance to the wall is

       d = h / tan θ

   Nothing is taped to the wall and nothing of a known size has to be in frame.
   The only inputs are the eye height (calibrated once per device) and the
   depression angle, which comes from the gravity vector the phone already
   reports and which is known-good on iOS.

   TWO ASSUMPTIONS, both stated to the merchandiser and neither measurable from
   a single view: the floor is LEVEL and the wall is VERTICAL. A sloping floor
   biases θ by the slope; a wall that leans changes where the floor line is. In
   a retail interior both hold to a fraction of a degree, but a ramp, a raised
   plinth or a stepped shopfront break them, which is why the fallback exists.

   ERROR. d = h·cot θ, so
       ∂d/∂h = cot θ  = d/h        →  σ_h/h passes straight through
       ∂d/∂θ = -h/sin²θ            →  relative σ_θ/(sin θ · cos θ)
   The pitch term is minimised at θ = 45° (where it is exactly 2σ_θ) and blows
   up at both ends of the range — which is what the angular band below guards.
   Nothing here is a constant "± n %": see GEO.floorLineError. */
const FLOOR_DEFAULT_H_M       = 1.45;   // a phone framing a wall sits about here on an
                                        // adult of average height — chest/shoulder, not eye
const FLOOR_DEFAULT_H_SIGMA   = 0.085;  // relative. Stature spread plus how differently two
                                        // people hold a phone. On its own this misses 5 %,
                                        // which is exactly why the default is badged ROUGH.
const FLOOR_CAL_H_MIN_M       = 0.60;   // a solved height outside this band is not a person
const FLOOR_CAL_H_MAX_M       = 2.20;   //   holding a phone; refuse rather than persist it
const FLOOR_AIM_SIGMA_DEG     = 0.55;   // how precisely a person puts a reticle on a line seen
                                        // across a room — the irreducible part of σ_θ
const FLOOR_PITCH_SIGMA_FLOOR = 0.25;   // sensor floor: DeviceOrientation is quantised and
                                        // filtered, so measured jitter can read implausibly low
const FLOOR_MIN_DEPRESSION    = 10;     // below this tan θ → 0 and the distance explodes
const FLOOR_MAX_DEPRESSION    = 75;     // above this they are aiming at their own feet
const FLOOR_SHALLOW_WARN_DEG  = 18;     // still reported, but the error bar is growing fast
const FLOOR_DIST_MIN_FT       = 1.0;    // sanity band on the result itself
const FLOOR_DIST_MAX_FT       = 60.0;
const FLOOR_SAMPLE_MS         = 700;    // window the depression median + jitter are taken over
const FLOOR_LATCH_SIGMA_DEG   = 1.20;   // a reading is only latched once it has stopped moving
const FLOOR_LIVE_SIGMA_DEG    = 3.00;   // above this the window is not describing ONE aim at all —
                                        // mid-raise it blends the floor angle with the wall angle and
                                        // the median lands somewhere plausible but entirely fictional,
                                        // so no live distance is offered until it settles
const FLOOR_HOLD_MAX_MS       = 25000;  // a held reading older than this is not offered at all
const FLOOR_HOLD_WARN_MS      = 8000;   // …and is called out before that
const FLOOR_STEP_ACCEL        = 1.80;   // m/s² of gravity-removed acceleration that reads as a STEP
const FLOOR_STIR_ACCEL        = 0.60;   // …and as merely being jostled
const FLOOR_STEP_GAP_MS       = 260;    // two peaks closer together than this are one step
const FLOOR_RAISE_GRACE_MS    = 600;    // raising the phone off the floor line is itself a wrist
                                        // movement that reads like a small step; don't charge it
const FLOOR_CAL_KEY           = "niva.floorcal.v1";

/* ---- h from the person, not from a walk round the shop ----
   The tape calibration above is the best answer and stays the best answer, but
   it costs a tape measure, a clear wall and five minutes, so in practice it was
   skipped and every capture ran on the 1.45 m default at ± 8.5 % — over budget
   before the angle term is even counted.

   A stature typed once on the profile sits between the two.

   A RATIO, NOT A SUBTRACTION.
   The obvious move is h = stature − (some constant). It is wrong, and wrong in
   a way that gets worse at the ends of the range where it matters most. Human
   body proportions are stable as FRACTIONS of stature, not as fixed distances:
   a 1.90 m adult's shoulder is not 37 cm below the top of their head while a
   1.50 m adult's is too — both sit at roughly the same PROPORTION of their own
   height. A flat offset therefore under-reads tall people and over-reads short
   ones, systematically, and no amount of widening the error bar fixes a bias.

       h  =  stature · HOLD_RATIO

   HOLD_RATIO IS ONLY VALID BECAUSE THE UI GIVES THE INSTRUCTION.
   A ratio describes a POSTURE. "Neck / shoulder level" is 0.82 of stature;
   "eye level" is 0.936. Neither is a fact about a person holding a phone until
   somebody tells them where to hold it — a merchandiser left to their own
   devices will frame a wall from anywhere between the sternum and the eyes,
   which is a 15 % spread and useless. So the capture screen says, in words and
   with a small figure, "hold the phone up at neck level", and THAT is what
   makes this number mean anything. If the instruction is ever removed from the
   UI, this constant stops being derived and becomes a guess: change both or
   neither.

   Switching posture is deliberately one line — reassign HOLD_RATIO below.

   THE UNCERTAINTY, DERIVED RATHER THAN QUOTED.
   Three independent terms, in metres, added in quadrature and divided by h at
   the end so the relative figure comes out stature-dependent on its own:

       σ_h = √( (HOLD_RATIO·σ_stature)²      … they mis-state their own height
              + (stature·σ_ratio)²           … their proportions are not the mean
              + σ_comply² )                  … they do not hit the landmark exactly

       σ_h/h  = what GEO.floorLineError consumes, unchanged

   That lands near ± 4 % for a median adult — comfortably better than the ± 8.5 %
   stated default and honestly worse than a ± 2.3 % tape calibration, which is
   the ordering the UI is allowed to claim. Nothing here is hardcoded into the
   error bar; statureHold() computes it and floorResolveHeight() propagates it. */
const HOLD_RATIO_NECK       = 0.82;   // neck / shoulder (acromial) height as a fraction of
                                      //   stature — the posture the capture screen INSTRUCTS
const HOLD_RATIO_EYE        = 0.936;  // eye height as a fraction of stature — the posture you
                                      //   would use if the screen said "hold it up to your eyes"
const HOLD_RATIO            = HOLD_RATIO_NECK;   // ← the one line to change
const HOLD_RATIO_SIGMA      = 0.011;  // between-person spread of that ratio, absolute on the
                                      //   ratio itself (~1.3 % of it). Proportions vary far less
                                      //   than statures do, which is the whole reason for a ratio
const HOLD_COMPLY_SIGMA_M   = 0.05;   // how precisely someone actually puts the phone on the
                                      //   landmark they were just told to use. The single largest
                                      //   term, and the one the on-screen instruction shrinks
const STATURE_SIGMA_M       = 0.02;   // how well people know their own height
const STATURE_MIN_CM        = 120;    // matches the CHECK in 0006_profile_height.sql
const STATURE_MAX_CM        = 220;
const HEIGHT_ASK_KEY        = "niva.heightask.v1";  // per-user "not now", so it asks once

/* stature (cm) -> the phone-holding height and its 1σ, or null if the stature is
   outside the band the database itself will accept. Pure, so the self-test can
   pin both the ratio and the propagation. `ratio` is an override for the
   posture, used by the self-test to check the eye-level swap without editing a
   constant; production always passes nothing and gets HOLD_RATIO. */
function statureHold(cm, ratio){
  const S = Number(cm)/100;
  const R = (ratio > 0) ? Number(ratio) : HOLD_RATIO;
  if(!(isFinite(S) && cm >= STATURE_MIN_CM && cm <= STATURE_MAX_CM)) return null;
  const hM = S*R;
  const sigmaM = Math.sqrt(Math.pow(R*STATURE_SIGMA_M, 2)
                         + Math.pow(S*HOLD_RATIO_SIGMA, 2)
                         + Math.pow(HOLD_COMPLY_SIGMA_M, 2));
  return { hM: hM, sigmaM: sigmaM, relSigma: sigmaM/hM, ratio: R, statureCm: Number(cm) };
}

/* ---- detector budget ----
   The numbers the "degrade gracefully" rule is measured against. */
const DET_BUDGET_MS       = 30;     // one pass; over this consistently ⇒ step down
const DET_DEGRADE_RUN     = 6;      // consecutive overruns before stepping down
const DET_ACCEPT_CONF     = 0.55;   // below this the outline is not even offered
const DET_LOCK_CONF       = 0.62;   // below this a confirmed lock is dropped
const DET_REACQUIRE_FRAC  = 0.15;   // corner jump (× quad diagonal) that breaks a lock
const DET_STABLE_PASSES   = 2;      // consecutive agreeing passes before offering
const M_TO_FT         = 3.28084;

/* Known-size references the merchandiser can scale from (millimetres).
   `tolMm` is the reference's own DIMENSIONAL uncertainty — how far its true
   size may be from the nominal one printed here. It is a real term in the
   distance error budget (see DET.errorEstimate), which is why a guillotined
   sheet of office paper and a shopfitter's "900 mm" shelf carry very different
   numbers. `auto` marks the rectangles the detector is allowed to look for. */
const REF_PRESETS = [
  {key:"poster", label:"The installed poster itself", mm:0, quad:true, hmm:0,
                 auto:true, dynamic:true, tolPct:0.010},
  {key:"a4q",    label:"A4 sheet 210 × 297 mm — taped flat", mm:210, hmm:297,
                 quad:true, auto:true, tolMm:0.5},
  {key:"a4",     label:"A4 sheet — short edge", mm:210,   quad:false, tolMm:0.5},
  {key:"a4l",    label:"A4 sheet — long edge",  mm:297,   quad:false, tolMm:0.5},
  {key:"card",   label:"Credit card — long edge", mm:85.6, quad:false, tolMm:0.2},
  {key:"shelf",  label:"Shelf face 900 × 400 mm", mm:900,  quad:true, hmm:400,
                 auto:true, tolMm:6},
  {key:"door",   label:"Door leaf 900 × 2100 mm", mm:900,  quad:true, hmm:2100,
                 auto:true, tolMm:10},
  {key:"frame",  label:"A1 poster frame 594 × 841 mm", mm:594, quad:true, hmm:841,
                 auto:true, tolMm:2},
  {key:"custom", label:"Custom…",               mm:0,     quad:false, tolPct:0.005}
];
/* THE EMPTY-WALL PROBLEM.

   In MOCKUP MODE the poster is a file and is never installed, so the
   merchandiser is always pointing the camera at a BARE wall. That kills the
   poster-as-reference source outright: there is no poster in the frame to scale
   from, and offering it would be offering something that cannot occur.

   What is left, in order:
     · ARCore (Android Chrome) — the hit-test measures the wall plane itself.
       No reference of any kind is needed. This is the primary path.
     · No ARCore (iOS, older Android) — a blank wall gives the camera nothing
       whose size it knows, so a printed A4 sheet taped flat to the wall is the
       ONLY way to get a scale. It is not a fallback here, it is the method.
     · Manual entry — a typed guess, and genuinely the last resort.

   The preset stays in REF_PRESETS so verification mode is untouched; it is
   simply not offered while APP_MODE is "mockup". */
function refPresets(){
  return MOCKUP ? REF_PRESETS.filter(function(p){ return p.key !== "poster"; }) : REF_PRESETS;
}

   back out of the SAME XR frame that produced the measurement (raw camera
   access); without it the photo came from the session-handover fallback. */
/* `verified` is the ONE definition of what counts for the placement KPI, and it
   is mirrored by the placements.is_verified generated column in the database

   standing as an AR one: the distance came from a real measurement against a

const TIER_META = {

/* The same eight tiers, said in words a person holding the phone can act on.

const TIER_FIELD_LABEL = {
  Asd:"Phone is measuring the wall", As:"Phone is measuring the wall",
  Ad: "Phone is measuring the wall", A: "Phone is measuring the wall",
  Bq: "Measuring from the sheet",    B: "Measuring from the sheet",

const tierMeta = k => TIER_META[k] || TIER_META.C;

/* ==========================================================
   DISTANCE METHOD — a SECOND axis, deliberately not a tier
   ----------------------------------------------------------
   A tier answers "how good is this evidence?". A method answers "where did the
   number come from?". They used to be the same question because there were only
   ever two answers — AR measured it, or a reference of known size did. Floor-
   line trigonometry is a third, and it needs to be distinguishable on the
   placement record without pretending to be a new tier.

   IT IS NOT A NEW TIER, AND THAT IS ON PURPOSE. `placements.tier` is a Postgres
   ENUM — public.verification_tier ('Asd','As','Ad','A','Bq','B','Be','C') — and
   `placements.tier_rank` is a stored generated column that CASEs over exactly
   those eight labels. A ninth letter is therefore a schema migration (alter
   type … add value, plus a rewrite of tier_rank), and 0005_retier_reference_
   scale.sql is not even applied yet. So floor-line captures record an EXISTING
   tier letter — 'Be', the tier that already means "a real capture whose
   measurement chain is not tight enough to count as verified evidence" — and

   schema and the pending one: 'Be' is unverified in each.
