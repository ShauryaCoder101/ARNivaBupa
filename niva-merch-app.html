/* The reference-scale evidence is written into placements.note as a compact
   [ref …] tag, because the database has no columns for it yet (0005_*.sql part
   2 adds them; the client will not name columns that might not exist, since a
   PostgREST insert naming an unknown column fails 400 and the outbox treats
   that as permanent). Parsing it back means a manager reviewing a placement
   FETCHED FROM THE SERVER still sees the error bar and what it was scaled
   from, instead of only the device that captured it. Anything unparseable is
   simply ignored — the note stays readable either way. */
const REF_NOTE_RE = /\[ref (\S+) ([\d.]+)x([\d.]+)mm (?:auto conf=([\d.]+)|manual) err=([\d.]+)% \(focal ([\d.]+) \/ dim ([\d.]+) \/ corner ([\d.]+) \/ barrel ([\d.]+)\) r=([\d.]+)\]/;
function refEvidenceFromNote(note, p){
  if(!note) return p;
  const m = REF_NOTE_RE.exec(note);
  if(!m) return p;
  p.refSource = m[1];
  p.refWmm = Number(m[2]); p.refHmm = Number(m[3]);
  p.refAuto = m[4] != null;
  if(m[4] != null) p.refConfidence = Number(m[4]);
  p.errorPct = Number(m[5]);
  p.errorTerms = { focal:Number(m[6]), refDim:Number(m[7]),
                   corner:Number(m[8]), barrel:Number(m[9]) };
  p.radialOffset = Number(m[10]);
  if(!p.refLabel){
    const def = REF_PRESETS.filter(x => x.key === p.refSource)[0];
    p.refLabel = def ? def.label : p.refSource;
  }
  return p;
}

/* The floor-line evidence rides in placements.note for exactly the reason the
   [ref …] tag does: there are no columns for it, a PostgREST insert naming an
   unknown column fails 400 PGRST204, and the outbox treats a 400 as permanent —
   so a client that got ahead of its database would LOSE captures rather than
   degrade. Everything needed to re-derive the error bar is in the tag: the eye
   height and its uncertainty, the depression angle and its uncertainty, the two
   error terms, how old the reading was when the shutter fired, and whether the
   height came from a calibration or from the stated default.
   Deliberately ASCII — a note is plain text on a round trip through Postgres,
   an outbox blob and a render cache, and none of those need a degree sign. */
const FLOOR_NOTE_RE = /\[floor h=([\d.]+)m\/([\d.]+)% ang=([\d.]+)deg\/([\d.]+)deg err=([\d.]+)% \(height ([\d.]+) \/ pitch ([\d.]+)\) age=([\d.]+)s cal=(device|stature|default)\]/;
function floorEvidenceFromNote(note, p){
  if(!note) return p;
  const m = FLOOR_NOTE_RE.exec(note);
  if(!m) return p;
  p.method = "floor-line";
  p.floorHeightM      = Number(m[1]);
  p.floorHeightPct    = Number(m[2]);
  p.floorThetaDeg     = Number(m[3]);
  p.floorThetaSigmaDeg= Number(m[4]);
  p.errorPct          = Number(m[5]);
  p.errorTerms        = { height:Number(m[6]), pitch:Number(m[7]) };
  p.floorHeldS        = Number(m[8]);
  p.floorHeightSrc    = m[9];
  p.floorCalibrated   = (m[9] === "device");
  return p;
}
/* THE MOCKUP FIT EVIDENCE rides in placements.note for the same reason [ref …]
   and [floor …] do, and the reason is not tidiness: there is no column for any
   of it, a PostgREST insert naming an unknown column fails 400 PGRST204, and
   the outbox treats a 400 as PERMANENT — so a client that got ahead of its
   database would LOSE captures rather than degrade. Everything needed to
   re-derive the decision is in the tag: what the frame covered, the two derived
   distances, the combined 1σ, whether the poster fitted the FRAME, and
   separately whether it fitted the WALL the merchandiser marked (or that they
   never marked one), and whether they were told it did not fit and shot it
   anyway. `wall=none` and `onwall=unknown` are the honest values when check (b)
   was never run; a zero wall height means the ceiling/skirting pair was left
   alone, which is not the same as a wall 0 ft tall.
   ASCII throughout — a note is plain text on a round trip through Postgres, an
   outbox blob and a render cache. */
const FIT_NOTE_RE = /\[fit see=([\d.]+)x([\d.]+)ft rec=([\d.]+)ft min=([\d.]+)ft err=([\d.]+)% view=(yes|no) wall=(?:none|([\d.]+)x([\d.]+)ft) onwall=(yes|no|unknown) ack=(yes|no)\]/;
function fitEvidenceFromNote(note, p){
  if(!note) return p;
  const m = FIT_NOTE_RE.exec(note);
  if(!m) return p;
  p.visibleWFt       = Number(m[1]);
  p.visibleHFt       = Number(m[2]);
  p.fitRecommendedFt = Number(m[3]);
  p.fitMinimumFt     = Number(m[4]);
  p.fitRelPct        = Number(m[5]);
  p.fitsInView       = (m[6] === "yes");
  p.wallWFt          = m[7] == null ? null : Number(m[7]);
  p.wallHFt          = (m[8] == null || Number(m[8]) === 0) ? null : Number(m[8]);
  p.fitsOnWall       = (m[9] === "unknown") ? null : (m[9] === "yes");
  p.wallOverflowAck  = (m[10] === "yes");
  return p;
}
function mapPlacement(r){
  if(!r) return null;
  const p = {
    id:r.id, taskId:r.task_id,
    tier:r.tier, tierLabel:r.tier_label, captureMode:r.capture_mode,
    distanceFt:num(r.distance_ft), targetFt:num(r.target_ft), tolFt:num(r.tol_ft),
    distanceOk:!!r.distance_ok, distanceSource:r.distance_source||"—",
    pitchDeg:num(r.pitch_deg), rollDeg:num(r.roll_deg), yawDeg:num(r.yaw_deg),
    angleTolDeg:num(r.angle_tol_deg),
    pitchOk:!!r.pitch_ok, rollOk:!!r.roll_ok, yawOk:!!r.yaw_ok, yawVerified:!!r.yaw_verified,
    angleSource:r.angle_source||"", attitudeAssumed:!!r.attitude_assumed,
    focalPx:(r.focal_px==null?null:Number(r.focal_px)), focalSource:r.focal_source||"—",
    posterWFt:num(r.poster_w_ft), posterHFt:num(r.poster_h_ft),
    pass:!!r.passed, geofencePass:r.geofence_pass, geofenceM:r.geofence_m,
    armMs:r.arm_ms, note:r.note||"",
    ts:r.captured_at||r.recorded_at, recordedAt:r.recorded_at, createdBy:r.created_by||null
  };
  refEvidenceFromNote(p.note, p);
  floorEvidenceFromNote(p.note, p);
  fitEvidenceFromNote(p.note, p);
  /* The method is a second axis and has no column of its own. Floor-line says
     so in the note; everything else is implied by the tier it already carries,
     so rows written before methods existed still classify correctly. */
  if(!p.method) p.method = methodFromTier(p.tier);
  p.methodLabel = methodMeta(p.method).label;
  if(r.camera_w){
    p.cameraImage = { w:r.camera_w, h:r.camera_h, readbackMs:num(r.camera_readback_ms),
                      path:r.camera_path, aspectAgrees:r.camera_aspect_agrees };
    if(r.camera_diagnostics && Object.keys(r.camera_diagnostics).length)
      p.cameraImage.diagnostics = r.camera_diagnostics;
  }
  return p;
}
/* The inverse. `id` is generated on the CLIENT so a retried POST collides with
   itself (23505 on placements_pkey, which the outbox treats as "already
   landed") instead of writing a second measurement for the same capture. */
function placementRow(p, taskId, id){
  const row = {
    id: id || p.id || uuid4(), task_id: taskId,
    tier: p.tier, tier_label: p.tierLabel || tierMeta(p.tier).label,
    capture_mode: p.captureMode || "manual",
    distance_ft: p.distanceFt, target_ft: p.targetFt, tol_ft: p.tolFt,
    distance_ok: !!p.distanceOk, distance_source: p.distanceSource || null,
    pitch_deg: p.pitchDeg, roll_deg: p.rollDeg, yaw_deg: p.yawDeg,
    angle_tol_deg: p.angleTolDeg,
    pitch_ok: !!p.pitchOk, roll_ok: !!p.rollOk, yaw_ok: !!p.yawOk, yaw_verified: !!p.yawVerified,
    angle_source: p.angleSource || null, attitude_assumed: !!p.attitudeAssumed,
    focal_px: p.focalPx, focal_source: p.focalSource || null,
    poster_w_ft: p.posterWFt, poster_h_ft: p.posterHFt,
    passed: !!p.pass,
    geofence_pass: (p.geofencePass == null) ? null : !!p.geofencePass,
    geofence_m: (p.geofenceM == null) ? null : Math.round(p.geofenceM),
    arm_ms: (p.armMs == null) ? ARM_MS : Math.round(p.armMs),
    note: p.note || "",
    captured_at: p.ts || new Date().toISOString()
  };
  const ci = p.cameraImage;
  if(ci){
    row.camera_w = ci.w; row.camera_h = ci.h;
    row.camera_readback_ms = (ci.readbackMs == null) ? null : Number(ci.readbackMs);
    row.camera_path = ci.path || null;
    row.camera_aspect_agrees = (ci.aspectAgrees == null) ? null : !!ci.aspectAgrees;
    row.camera_diagnostics = ci.diagnostics || {};
  }
  return row;
}

function mapImage(r, storeCode, idx){

/* ==========================================================
   5. State — a local cache that syncs, not a local database
   ------------------------------------------------------------
   The render path is still synchronous and still reads one `state` object.
   What changed is where that object comes from and what a write to it means:

     READ   Repo.prime() pulls the RLS-filtered rows once at sign-in and
            Repo.refresh() re-pulls them on a timer, on reconnect and after a
            successful drain. Everything renders from the cache, so the app
            works with the radio off.

     WRITE  Nothing writes to PostgREST directly. Every mutation applies to the
            local cache AND appends to the durable Outbox, which is the only
            thing that talks to the server. The UI never claims a write reached
            the database until the outbox says it did.

   The one place local state is deliberately NOT optimistic is submission: a
   task stays In Progress, with an honest "queued" badge, until its evidence
   bytes have actually landed in Storage and the server has accepted the
   status change.
   ========================================================== */
let state = null;
let view  = { name:"dashboard", params:{} };
let ui    = { granularity:"Region", taskFilter:{q:"",status:"",region:"",campaign:""}, popOpen:null,
              login:{ busy:false, error:"", email:"" } };

function blankState(){
  return { v:3, userId:null, tasks:[], notifications:[],
           profiles:[], campaigns:[], stores:[],
           kpis:null, rollup:{}, campaignRollup:[], rollupAt:null,
           ws:{}, syncedAt:null, everSynced:false };
}

/* ---------- identity: role comes from the profile row, nowhere else ---------- */
const me = function(){
  const p = Session.profile();
  if(!p) return { id:null, name:"Not signed in", role:null, title:"" };
  return { id:p.id, name:p.full_name || p.name || p.id, role:p.role, title:p.title || "" };
};
const myRole = function(){ const p = Session.profile(); return p ? p.role : null; };
const signedIn = function(){ return SB_CONFIGURED && !!Session.profile() && Session.state !== "signedout"; };

const taskById    = id => state.tasks.filter(t=>t.id===id)[0];
const campaignById= id => CAMPAIGNS.filter(c=>c.id===id)[0] || {name:"—", poster:null};

/* Defensive fill-in for tasks arriving from an older cache or from a row whose
   store is not visible to this session. Idempotent. */
function normalizeTask(t){
  if(!t || typeof t !== "object") return t;
  const d = posterDefaults(t.campaignId);
  if(t.widthFt  == null) t.widthFt  = d.w;
  if(t.heightFt == null) t.heightFt = d.h;
  if(t.standoffFt    == null) t.standoffFt    = d.standoff;
  if(t.standoffTolFt == null) t.standoffTolFt = d.tol;
  if(t.angleTolDeg   == null) t.angleTolDeg   = d.angleTol;
  if(t.geofenceM == null) t.geofenceM = GEOFENCE_M;
  if(!Array.isArray(t.afterImages)) t.afterImages = [];
  if(!Array.isArray(t.audit)) t.audit = [];
  if(t.placement === undefined) t.placement = null;
  if(t.posterArt === undefined) t.posterArt = null;
  t.afterImages.forEach(function(im){ if(im && im.placement === undefined) im.placement = null; });
  return t;
}

/* ---------- render cache persistence ---------- */
function cacheKey(){ const u = (state && state.userId) || Session.userId(); return u ? (CACHE_KEY_PREFIX + u) : null; }
function save(){
  if(!state) return;
  const k = cacheKey(); if(!k) return;
  lsSet(k, JSON.stringify({
    v:3, userId: state.userId, tasks: state.tasks, notifications: state.notifications,
    profiles: USERS, campaigns: CAMPAIGNS, stores: STORES,
    kpis: state.kpis, rollup: state.rollup, campaignRollup: state.campaignRollup,
    rollupAt: state.rollupAt, ws: state.ws, syncedAt: state.syncedAt,
    everSynced: !!state.everSynced
  }));
}
function load(){
  const uid = Session.userId();
  const fresh = blankState();
  fresh.userId = uid;
  if(!uid) return fresh;
  const p = lsJSON(CACHE_KEY_PREFIX + uid, null);
  if(!p || p.v !== 3 || !Array.isArray(p.tasks)) return fresh;
  USERS     = Array.isArray(p.profiles)  ? p.profiles  : [];
  CAMPAIGNS = Array.isArray(p.campaigns) ? p.campaigns : [];
  STORES    = Array.isArray(p.stores)    ? p.stores    : [];
  fresh.tasks           = p.tasks;
  fresh.notifications   = Array.isArray(p.notifications) ? p.notifications : [];
  fresh.profiles = USERS; fresh.campaigns = CAMPAIGNS; fresh.stores = STORES;
  fresh.kpis            = p.kpis || null;
  fresh.rollup          = p.rollup || {};
  fresh.campaignRollup  = p.campaignRollup || [];
  fresh.rollupAt        = p.rollupAt || null;
  fresh.ws              = p.ws || {};
  fresh.syncedAt        = p.syncedAt || null;
  fresh.everSynced      = !!p.everSynced;
  fresh.tasks.forEach(function(t){
    if(!Array.isArray(t.afterImages)) t.afterImages = [];
    if(!Array.isArray(t.audit)) t.audit = [];
    /* A `submitting` marker outlives the queue it describes if the tab died
       between the last op draining and the cache being written. Left alone it
       would wedge the task in "Submitting…" with nothing to submit. The outbox
       is restored before this runs, so it can answer authoritatively. */
    if(t.submitting && !Outbox.groupPending(t.submitting.group)){
      const stuck = Outbox.failures().some(function(it){ return it.group === t.submitting.group; });
      if(!stuck) t.submitting = null;
    }
    (t.audit || []).forEach(function(a){
      if(a && a.pending && !Outbox.has(a.opId)) a.pending = false;
    });
  });
  return fresh;
}

let renderT = null;
function scheduleRender(){
  if(renderT) return;
  renderT = setTimeout(function(){ renderT = null; try{ render(); }catch(e){} }, 60);
}

/* ==========================================================
   5b. Repository — PostgREST reads, assembled into the render shape
   ========================================================== */
const Repo = (function(){
  let inflight = null;
  let lastError = null;
  let mastersAt = 0;

  function note(e){
    if(e && e.kind === "auth") Session.markExpired();
    lastError = e;
    throw e;
  }

  function fetchMasters(){
    /* Same optimistic-then-downgrade dance as Session.loadProfile: a project
       without 0006 applied must not lose its whole master read over one
       column. See profileCols() for why the column can legitimately be absent. */
    const profiles = function(){
      return REST.select("profiles", "select=" + profileCols() + "&order=full_name")
        .catch(function(err){
          if(!profileHeightMissing(err)) throw err;
          return REST.select("profiles", "select=" + profileCols() + "&order=full_name");
        });
    };
    return Promise.all([
      profiles(),
      REST.select("stores",    "select=*&order=name"),
      REST.select("campaigns", "select=*&order=starts_on.desc")
    ]).then(function(r){
      /* An empty array here is RLS doing its job, not a failure. A
         merchandiser legitimately sees a couple of colleagues and one
         campaign. Only overwrite the cache when the request SUCCEEDED — a
         thrown error leaves the previous cache untouched. */
      USERS     = r[0].map(mapProfile);
      STORES    = r[1].map(mapStore);
      CAMPAIGNS = r[2].map(mapCampaign);
      state.profiles = USERS; state.stores = STORES; state.campaigns = CAMPAIGNS;
      mastersAt = Date.now();
    });
  }

  function fetchWork(){
    return Promise.all([
      REST.select("tasks",         "select=*&order=created_at.desc"),
      REST.select("placements",    "select=*&order=recorded_at.desc"),
      REST.select("task_images",   "select=*&order=recorded_at.asc"),
      REST.select("audit_events",  "select=*&order=occurred_at.desc&limit=800"),
      REST.select("notifications", "select=*&order=occurred_at.desc&limit=120")
    ]).then(function(r){ assemble(r[0], r[1], r[2], r[3], r[4]); });
  }

  /* The dashboard aggregates come from the server's own rollup functions
     (niva_dashboard_kpis / niva_dashboard_rollup / niva_campaign_rollup)
     rather than from counting task rows in the browser. For a merchandiser
     that is the same number either way; for an admin it is the difference
     between one small response and every task row in the country. */
  function fetchRollups(){
    return Promise.all([
      REST.rpc("niva_dashboard_kpis",   {}),
      REST.rpc("niva_dashboard_rollup", { p_granularity:"Region" }),
      REST.rpc("niva_dashboard_rollup", { p_granularity:"State"  }),
      REST.rpc("niva_dashboard_rollup", { p_granularity:"City"   }),
      REST.rpc("niva_campaign_rollup",  {})
    ]).then(function(r){
      state.kpis           = (Array.isArray(r[0]) ? r[0][0] : r[0]) || null;
      state.rollup         = { Region: r[1] || [], State: r[2] || [], City: r[3] || [] };
      state.campaignRollup = Array.isArray(r[4]) ? r[4] : [];
      state.rollupAt       = new Date().toISOString();
    });
  }

  /* Fold five flat result sets into the denormalised task objects the views
     expect, preserving anything that is local-only. */
  function assemble(taskRows, placeRows, imgRows, auditRows, notifRows){
    const placeById = Object.create(null);
    placeRows.forEach(function(r){ const p = mapPlacement(r); placeById[p.id] = p; });

    const prevById = Object.create(null);
    (state.tasks || []).forEach(function(t){ prevById[t.id] = t; });

    /* Audit entries this device wrote that the server has not accepted yet.
       A poll must not erase the merchandiser's own timeline just because their
       write is still in the queue behind a photo upload. Keyed by task. */
    const localAudit = Object.create(null);
    (state.tasks || []).forEach(function(t){
      (t.audit || []).forEach(function(a){
        if(a && a.pending && Outbox.has(a.opId)) (localAudit[t.id] = localAudit[t.id] || []).push(a);
      });
    });

    const tasks = [];
    const byId  = Object.create(null);
    taskRows.forEach(function(r){
      const prev = prevById[r.id];
      /* A poll can race a write we just made: the read may have started before
         our PATCH committed. `updated_at` settles it — never move a task
         backwards in time. */
      let t;
      if(prev && prev.updatedAt && r.updated_at && new Date(r.updated_at) < new Date(prev.updatedAt)){
        t = prev; t.afterImages = []; t.audit = []; t.beforeImage = null; t.posterArt = null;
      }else{
        t = mapTask(r);
        if(prev){
          t.submitting    = prev.submitting || null;
          t.pendingFields = prev.pendingFields || null;
          t.lastError     = prev.lastError || null;
        }
      }
      tasks.push(t); byId[t.id] = t;
    });

    const seq = Object.create(null);
    imgRows.forEach(function(r){
      const t = byId[r.task_id]; if(!t) return;
      const k = r.task_id + "|" + r.kind;
      const n = seq[k] = (seq[k] == null ? 0 : seq[k] + 1);
      const im = mapImage(r, t.storeCode, n);
      im.placement = im.placementId ? (placeById[im.placementId] || null) : null;
      if(r.kind === "before"){ if(!t.beforeImage) t.beforeImage = im; }
      else if(r.kind === "poster"){ t.posterArt = im; }
      else t.afterImages.push(im);
    });

    auditRows.forEach(function(r){
      const t = byId[r.task_id]; if(!t) return;
      t.audit.push(mapAudit(r));
    });

    tasks.forEach(function(t){
      (localAudit[t.id] || []).forEach(function(a){ t.audit.push(a); });
      t.audit.sort(function(a,b){ return new Date(a.ts) - new Date(b.ts); });
      t.placement = t.bestPlacementId ? (placeById[t.bestPlacementId] || null)
                                      : bestPlacement(t.afterImages);
      normalizeTask(t);
      applyOverlay(t);
    });

    /* Same rule for notifications this device raised and has not yet flushed. */
    const stillQueued = (state.notifications || []).filter(function(n){
      return n && n.pending && Outbox.has(n.opId);
    });
    const fromServer = notifRows.map(mapNotif);
    const seen = Object.create(null);
    fromServer.forEach(function(n){ seen[n.id] = 1; });

    state.tasks         = tasks;
    state.notifications = stillQueued.filter(function(n){ return !seen[n.id]; }).concat(fromServer);
    state.syncedAt      = new Date().toISOString();
    state.everSynced    = true;
    lastError           = null;
  }

  return {
    lastError: function(){ return lastError; },
    /* Did the last attempt to READ from the server fail for a transport
       reason? The write queue being empty says nothing about this: a device
       with nothing queued and a dead radio is not "synced", it is stale, and
       the chrome has to say so. Cleared by the next successful assemble(). */
    unreachable: function(){
      return !!(lastError && (lastError.kind === "offline" || lastError.kind === "timeout"
                           || lastError.kind === "server"  || lastError.kind === "ratelimit"));
    },
    busy: function(){ return !!inflight; },
    /* full=true also re-reads the profile/store/campaign masters. */
    refresh: function(full){
      if(!SB_CONFIGURED) return Promise.reject(SbError("config", "Not configured."));
      if(Session.state !== "ready") return Promise.reject(SbError("auth", "No session."));
      if(inflight) return inflight;
      const needMasters = full || !mastersAt || (Date.now() - mastersAt > 600000) || !STORES.length;
      inflight = (needMasters ? fetchMasters() : Promise.resolve())
        .then(fetchWork)
        .then(fetchRollups)
        .then(function(){ inflight = null; save(); },
              function(e){ inflight = null; save(); return note(e); });
      return inflight;
    },
    prime: function(){ return this.refresh(true); },
    /* Merge one authoritative task row back into the cache, keeping the local
       sub-collections that the row itself does not carry. */
    mergeTaskRow: function(row){
      const fresh = mapTask(row);
      const i = state.tasks.map(function(t){ return t.id; }).indexOf(fresh.id);
      if(i < 0){ normalizeTask(fresh); state.tasks.unshift(fresh); return fresh; }
      const old = state.tasks[i];
      fresh.beforeImage   = old.beforeImage;
      fresh.posterArt     = old.posterArt;
      fresh.afterImages   = old.afterImages;
      fresh.audit         = old.audit;
      fresh.pendingFields = old.pendingFields;
      fresh.submitting    = old.submitting;
      fresh.lastError     = old.lastError;
      fresh.placement     = old.placement;
      if(fresh.bestPlacementId){
        const hit = old.afterImages.filter(function(im){
          return im.placement && im.placement.id === fresh.bestPlacementId; })[0];
        if(hit) fresh.placement = hit.placement;
      }
      if(!fresh.placement) fresh.placement = bestPlacement(fresh.afterImages);
      normalizeTask(fresh);
      /* A confirmed row for group A must not visually undo an optimistic change
         from group B that is still in the queue behind it. */
      applyOverlay(fresh);
      state.tasks[i] = fresh;
      return fresh;
    }
  };
})();

/* Re-apply values that are queued but not yet confirmed, so a server row that
   predates our write does not visually undo the user's action. Cleared as soon
   as the group has drained. */
function applyOverlay(t){
  const pf = t.pendingFields;
  if(!pf) return;
  if(!pf.group || Outbox.groupPending(pf.group) === 0){ t.pendingFields = null; return; }
  Object.keys(pf.fields).forEach(function(k){ t[k] = pf.fields[k]; });
}

/* ==========================================================
   5c. Sync — what the outbox does to local state when a write lands
   ========================================================== */
const Sync = {
  onStoreInserted: function(it, row){
    const s = mapStore(row);
    const i = STORES.map(function(x){ return x.id; }).indexOf(s.id);
    if(i >= 0) STORES[i] = s; else STORES.push(s);
    state.stores = STORES; save();
  },
  onIdRemapped: function(oldId, newId){
    STORES.forEach(function(s){ if(s.id === oldId) s.id = newId; });
    state.tasks.forEach(function(t){ if(t.storeId === oldId) t.storeId = newId; });
    save();
  },
  onTaskInserted: function(it, row){
    Repo.mergeTaskRow(row); save(); scheduleRender();
  },
  onTaskPatched: function(it, row, alreadyApplied){
    const t = Repo.mergeTaskRow(row);
    if(t){
      if(t.pendingFields && t.pendingFields.group === it.group) t.pendingFields = null;
      if(t.submitting && t.submitting.group === it.group){
        t.submitting = null;
        clearWs(t.id);
        toast("Submission synced — " + t.storeName + " is now with your manager.");
      }
      t.lastError = null;
    }
    save(); scheduleRender();
  },
  onPlacementInserted: function(it, row){
    const t = taskById(row.task_id); if(!t) return;
    const p = mapPlacement(row);
    (t.afterImages || []).forEach(function(im){ if(im.placementId === p.id) im.placement = p; });
    ((state.ws[row.task_id] || {}).after || []).forEach(function(im){ if(im.placementId === p.id) im.placement = p; });
    save();
  },
  onImageInserted: function(it, row){
    const t = taskById(row.task_id); if(!t) return;
    if(row.kind === "after"){
      if(!t.afterImages.some(function(x){ return x.id === row.id; })){
        t.afterImages.push(mapImage(row, t.storeCode, t.afterImages.length));
      }
      t.placement = bestPlacement(t.afterImages);
    }else if(row.kind === "before"){ t.beforeImage = mapImage(row, t.storeCode, 0); }
    else if(row.kind === "poster"){ t.posterArt = mapImage(row, t.storeCode, 0); }
    save(); scheduleRender();
  },
  /* The server's copy of the caller's own profile row is now authoritative for
     whatever it just accepted. Adopt it rather than assuming the PATCH landed
     verbatim — the guard trigger is allowed to rewrite a column on the way in,
     and if it ever does, the app should be showing what the database has. */
  onProfilePatched: function(it, row){
    if(!row || row.id !== Session.userId()) return;
    Session.mergeProfile(row);
    const i = USERS.map(function(u){ return u.id; }).indexOf(row.id);
    if(i >= 0) USERS[i] = mapProfile(row);
    state.profiles = USERS;
    save(); scheduleRender();
  },
  onUploaded: function(it){
    /* The bytes are on the server now; Signer will mint a URL on next render
       and Outbox drops the local copy. */
    if(it.payload && it.payload.path) Signer.forget(it.payload.path);
    scheduleRender();
  },
  onOpFailed: function(it, err){
    const t = it.taskId ? taskById(it.taskId) : null;
    if(t){ t.lastError = it.lastError; t.submitting = null; t.pendingFields = null; }
    toast("Sync failed: " + (it.label || it.kind) + " — " + errText(err), true);
    save(); scheduleRender();
  }
};

/* ==========================================================
   5d. Field workspace — captures held on the device before submission
   ------------------------------------------------------------
   In the prototype this was an in-memory object, so a reload lost every photo
   taken since check-in. It is now part of the persisted cache (with the JPEG
   bytes in IndexedDB), which is what makes "capture in a basement, submit
   tomorrow" actually work.
   ========================================================== */
function ws(id){
  if(!state.ws) state.ws = {};
  if(!state.ws[id]) state.ws[id] = { after:[], remarks:"", geo:null, busy:false };
  const w = state.ws[id];
  if(!Array.isArray(w.after)) w.after = [];
  if(typeof w.remarks !== "string") w.remarks = "";
  w.busy = !!w.busy;
  return w;
}
function clearWs(id){
  const w = state.ws && state.ws[id];
  if(w && w.after) w.after.forEach(function(im){
    if(im.path) Blobs.del("evidence/" + im.path);
    if(im.cleanPath) Blobs.del("evidence/" + im.cleanPath);
  });
  if(state.ws) delete state.ws[id];
  save();
}

/* Every locally-held JPEG that something still points at. Used once, at boot,
   to drop bytes nothing references any more — a device that has been in the
   field for months otherwise grows an IndexedDB full of already-uploaded
   evidence.

   GETTING THIS WRONG DESTROYS UNSYNCED EVIDENCE, so it is deliberately
   over-inclusive. A capture sitting in the field workspace has NOT been queued
   yet (the upload op is only pushed at submit time), so the outbox alone is
   not the answer — ws() captures, failed-but-retryable items and locally
   created before/poster images all count as live. */
function liveBlobKeys(){
  const out = Object.create(null);
  const add = function(k){ if(k) out[k] = 1; };

  Outbox.items().forEach(function(it){ add(it.blobKey); });
  Outbox.failures().forEach(function(it){ add(it.blobKey); });

  const ws0 = (state && state.ws) || {};
  Object.keys(ws0).forEach(function(id){
    ((ws0[id] && ws0[id].after) || []).forEach(function(im){
      if(im && im.path)      add("evidence/" + im.path);
      if(im && im.cleanPath) add("evidence/" + im.cleanPath);
    });
  });

  ((state && state.tasks) || []).forEach(function(t){
    [t.beforeImage, t.posterArt].concat(t.afterImages || []).forEach(function(im){
      if(!im || !im.path) return;
      add((im.bucket || "evidence") + "/" + im.path);
      if(im.cleanPath) add((im.bucket || "evidence") + "/" + im.cleanPath);
    });
  });
  return Object.keys(out);
}

/* ---------- state machine ---------- */
/* The client map still exists, but only to grey out buttons. The database is
   the authority: niva_tasks_transition_guard re-checks every edge, who may
   traverse it, and the separation-of-duties rule. A rejection surfaces as the
   server's own message. */
function canTransition(from,to){ return (TRANSITIONS[from]||[]).indexOf(to) >= 0; }

/* Returns the outbox group id (truthy) or false, so the existing
   `if(!transition(...)) return;` call sites keep working unchanged. */
function transition(task, to, opts){
  opts = opts || {};
  if(!canTransition(task.status, to)){
    toast("Illegal transition: "+statusLabel(task.status)+" → "+statusLabel(to), true);
    return false;
  }
  const group = opts.group || uuid4();
  const patch = Object.assign({ status: to }, opts.patch || {});
  Outbox.push("task.patch", { taskId: task.id, patch: patch },
              { group: group, taskId: task.id, label: "Status → " + to });
  if(opts.optimistic !== false){
    const fields = Object.assign({ status: to }, opts.localFields || {});
    Object.keys(fields).forEach(function(k){ task[k] = fields[k]; });
    task.pendingFields = { group: group, fields: fields };
  }
  audit(task, opts.action || ("Status → "+to), opts.detail || "", opts.gps || null, group);
  return group;
}

/* The local copy carries the outbox op id that will make it real. That is what
   lets Repo.assemble() tell "this entry has not reached the server yet, keep
   showing it" apart from "this entry is gone", instead of a poll wiping the
   field's own timeline out from under them. */
function audit(task, action, detail, g, group){
  const u = me();
  const ts = new Date().toISOString();
  const opId = Outbox.push("audit.insert", { row: auditRow(task.id, action, detail, g, ts) },
                           { group: group || null, taskId: task.id, label: action });
  task.audit.push({ ts:ts, actor:u.name, actorId:u.id, role:u.role,
                    action:action, detail:detail||"", gps:g||null,
                    pending:true, opId:opId });
}

function notify(type, targetRole, targetUserId, taskId, body, group){
  const n = { id: uuid4(), type:type, targetRole:targetRole||null,
              targetUserId:targetUserId||null, taskId:taskId||null, body:body,
              ts:new Date().toISOString(), read:false, pending:true };
  n.opId = Outbox.push("notif.insert", { row: notifRow(n) },
                       { group: group||null, taskId: taskId||null, label: "Notify · " + type });
  state.notifications.unshift(n);
  if(state.notifications.length > 120) state.notifications.length = 120;
}

function myNotifs(){
  const u = me();
  if(!u.id) return [];
  return state.notifications.filter(function(n){
    if(u.role === "Admin") return true;
    if(n.targetUserId) return n.targetUserId === u.id;
    return n.targetRole === u.role;
  });
}

/* ---------- derived metrics ---------- */
function counts(tasks){
  const c = {}; ALL_STATUS.forEach(s=>c[s]=0);
  tasks.forEach(t=>{ c[t.status] = (c[t.status]||0)+1; });
  return c;
}
function kpis(tasks){
  const c = counts(tasks);
  const total = tasks.length;
  const done = c[S.APPROVED] + c[S.CLOSED];
  const pending = c[S.DRAFT] + c[S.ASSIGNED];
  return {
    total: total, completed: done, pending: pending,
    inProgress: c[S.PROGRESS] + c[S.SUBMITTED], rework: c[S.REWORK],
    pct: total ? Math.round(done/total*100) : 0, c: c
  };
}
/* RLS already decided what this session may see. Filtering again in the client
   could only ever HIDE rows the server said were visible, which would be
   misleading rather than protective — so there is no filter here any more. */
function visibleTasks(){ return state.tasks.slice(); }

/* ---- which numbers the dashboard is allowed to trust ----
   niva_dashboard_kpis / niva_dashboard_rollup / niva_campaign_rollup are the
   authority: they count exactly the rows this session can see, using the
   STORED is_verified / is_same_frame / tier_rank columns, so the definition of
   "placement verified" cannot drift between the browser and a report. For an
   Admin that is one small response instead of a national task dump.

   What the server cannot know is what is still sitting in this device's
   outbox. Showing its numbers while a submission is queued would understate
   the user's own work, which is the same class of lie as overstating it. So
   the moment anything is queued, the dashboard counts locally and SAYS SO.   */
function rollupSource(){
  const queued = Outbox.pending();
  if(queued){
    return { kind:"local",
             why: queued + " change" + (queued===1?"":"s") + " on this device "
                + (queued===1?"has":"have") + " not reached the server yet, so these are counted locally." };
  }
  if(state.rollupAt && state.kpis){
    return { kind:"server",
             why:"Counted by the server across every row your account can see · " + fmtDT(state.rollupAt) };
  }
  return { kind:"local",
           why: state.everSynced
             ? "The server rollup is unavailable, so these are counted from this device's cache."
             : "Not synced yet — counted from this device's cache." };
}

/* The nine dashboard tiles, in one shape, from either source. */
function kpisFull(tasks){
  const k = kpis(tasks);
  const submitted = tasks.filter(t => [S.SUBMITTED,S.REWORK,S.APPROVED,S.CLOSED].indexOf(t.status) >= 0);
  k.submissions = submitted.length;
  k.verified    = submitted.filter(t => placementVerified(t.placement)).length;
  k.sameFrame   = submitted.filter(t => placementSingleFrame(t.placement)).length;
  k.unverified  = submitted.filter(t => placementUnverified(t.placement)).length;
  return k;
}
function serverKpisFull(){
  const r = state.kpis; if(!r) return null;
  const n = v => Number(v) || 0;
  const c = {};
  c[S.DRAFT]=n(r.draft); c[S.ASSIGNED]=n(r.assigned); c[S.PROGRESS]=n(r.executing);
  c[S.SUBMITTED]=n(r.submitted); c[S.REWORK]=n(r.rework);
  c[S.APPROVED]=n(r.approved); c[S.CLOSED]=n(r.closed);
  return { total:n(r.total_planned), completed:n(r.completed), pending:n(r.pending),
           inProgress:n(r.in_progress), rework:n(r.rework), pct:n(r.pct_complete), c:c,
           submissions:n(r.submissions), verified:n(r.placement_verified),
           sameFrame:n(r.same_frame), unverified:n(r.unverified) };
}
/* One rollup row (server or local) -> { name, c, total, done }. */
function serverBuckets(gran){
  const rows = (state.rollup && state.rollup[gran]) || [];
  const n = v => Number(v) || 0;
  return rows.map(function(r){
    const c = {};
    c[S.DRAFT]=n(r.draft); c[S.ASSIGNED]=n(r.assigned); c[S.PROGRESS]=n(r.executing);
    c[S.SUBMITTED]=n(r.submitted); c[S.REWORK]=n(r.rework);
    c[S.APPROVED]=n(r.approved); c[S.CLOSED]=n(r.closed);
    return { name: r.bucket == null ? "—" : String(r.bucket), c: c,
             total: n(r.total_planned), done: n(r.completed) };
  });
}
function localBuckets(tasks, gran){
  const keyFor = t => gran==="Region" ? t.region : (gran==="State" ? t.state : t.city);
  const groups = {};
  tasks.forEach(function(t){ const kk = keyFor(t); (groups[kk] = groups[kk] || []).push(t); });
  return Object.keys(groups).sort(function(a,b){
    return groups[b].length - groups[a].length || a.localeCompare(b);
  }).map(function(name){
    const g = groups[name], c = counts(g);
    return { name:name, c:c, total:g.length, done:c[S.APPROVED]+c[S.CLOSED] };
  });
}
/* Per-campaign totals, server-first, keyed by campaign id. */
function campaignRollupById(){
  const out = Object.create(null);
  ((state && state.campaignRollup) || []).forEach(function(r){
    if(r && r.campaign_id) out[r.campaign_id] = r;
  });
  return out;
}

/* ==========================================================
   5e. Polling
   ------------------------------------------------------------
   Supabase Realtime speaks Phoenix channels over a WebSocket. Driving that by
   hand — join, heartbeat, `postgres_changes` config, per-topic RLS token
   refresh, reconnect/backoff — is several hundred lines that cannot be tested
   against anything but a live project, for an app whose dashboard is already
   authoritative through a server-side rollup. So this build POLLS: the rollup
   RPCs and the task list are re-read on an interval, on reconnect, when the
   tab becomes visible again, and after the outbox drains. Latency to another
   user's change is therefore up to POLL_INTERVAL_MS, not instant. That is a
   deliberate, documented trade — see MIGRATION.md.
   ========================================================== */
const Poller = (function(){
  let t = null, ticks = 0, stopped = false;
  function arm(ms){
    if(t) clearTimeout(t);
    if(stopped) return;
    t = setTimeout(run, ms == null ? POLL_INTERVAL_MS : ms);
  }
  function run(){
    if(stopped) return;
    if(!SB_CONFIGURED || Session.state !== "ready") return arm();
    if(typeof document !== "undefined" && document.visibilityState === "hidden") return arm();
    if(typeof navigator !== "undefined" && navigator.onLine === false) return arm();
    ticks++;
    Repo.refresh(ticks % 10 === 0).then(function(){ scheduleRender(); arm(); },
                                        function(){ arm(); });
  }
  return {
    start: function(){ stopped = false; arm(POLL_INTERVAL_MS); },
    stop:  function(){ stopped = true; if(t) clearTimeout(t); t = null; },
    now:   function(){ arm(0); }
  };
})();

/* ---------- per-task sync state ----------
   The status chip says what the SERVER believes. This says what this device is
   still holding, which is a different fact and, in a shop with no signal, the
   more important one. Nothing here ever claims a write landed: `submitting`
   means bytes are still going up, `queued` means edits are still in the queue,
   `failed` means the server refused something and a human has to look.        */
function taskSync(t){
  if(!t) return null;
  const queued = Outbox.pendingFor(t.id);
  const failed = Outbox.failures().filter(function(it){ return it.taskId === t.id; }).length;
  if(failed){
    return { cls:"fail", label: failed + " change" + (failed===1?"":"s") + " refused",
             kind:"failed",
             detail: t.lastError || "The server refused part of this task's sync. Open the sync panel to retry or discard." };
  }
  if(t.submitting){
    const left = Outbox.groupPending(t.submitting.group);
    return { cls:"queued", label: left ? ("Submitting · " + left + " step" + (left===1?"":"s") + " left") : "Submitting · finishing",
             kind:"submitting",
             detail: "This submission is queued on this device with " + t.submitting.images
                   + " image" + (t.submitting.images===1?"":"s") + " (" + t.submitting.bytes
                   + " upload" + (t.submitting.bytes===1?"":"s") + "). The task stays In Progress until the server has the evidence AND accepts the status change." };
  }
  if(queued){
    return { cls:"queued", label: queued + " queued", kind:"queued",
             detail: queued + " change" + (queued===1?"":"s") + " on this device "
                   + (queued===1?"has":"have") + " not reached the server yet." };
  }
  return null;
}

/* ==========================================================
   7. Donut (hand-rolled SVG arcs)
   ========================================================== */
function donut(tasksCounts, total){
  const R=62, r=42, cx=76, cy=76;
  const segs = ALL_STATUS.filter(s=>tasksCounts[s]>0);
  const sum = total || segs.reduce((a,s)=>a+tasksCounts[s],0) || 1;
  let a0 = -Math.PI/2, paths = "";
  segs.forEach(function(s){
    const frac = tasksCounts[s]/sum;
    let a1 = a0 + frac*Math.PI*2;
    const full = frac >= 0.9999;
    if(full) a1 = a0 + Math.PI*2 - 0.0001;
    const large = (a1-a0) > Math.PI ? 1 : 0;
    const x0=cx+R*Math.cos(a0), y0=cy+R*Math.sin(a0);
    const x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1);
    const x2=cx+r*Math.cos(a1), y2=cy+r*Math.sin(a1);
    const x3=cx+r*Math.cos(a0), y3=cy+r*Math.sin(a0);
    paths += '<path d="M'+x0.toFixed(2)+' '+y0.toFixed(2)
      + ' A'+R+' '+R+' 0 '+large+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)
      + ' L'+x2.toFixed(2)+' '+y2.toFixed(2)
      + ' A'+r+' '+r+' 0 '+large+' 0 '+x3.toFixed(2)+' '+y3.toFixed(2)
      + ' Z" fill="'+STATUS_HEX[s]+'"><title>'+esc(s)+': '+tasksCounts[s]+'</title></path>';
    a0 = a1;
  });
  const done = (tasksCounts[S.APPROVED]||0)+(tasksCounts[S.CLOSED]||0);
  return '<svg viewBox="0 0 152 152" width="152" height="152" role="img" aria-label="Status breakdown">'
    + '<circle cx="76" cy="76" r="52" fill="none"/>' + paths
    + '<text x="76" y="72" text-anchor="middle" font-size="25" font-weight="700" fill="currentColor" style="font-variant-numeric:tabular-nums">'+(sum?Math.round(done/sum*100):0)+'%</text>'
    + '<text x="76" y="90" text-anchor="middle" font-size="10" fill="currentColor" opacity=".55" letter-spacing="1">COMPLETE</text>'
    + '</svg>';
}

function bindFilters(){
  const wire = (id, key) => {
    const el = $("#"+id); if(!el) return;
    const ev = el.tagName === "INPUT" ? "input" : "change";
    el.addEventListener(ev, function(){
      ui.taskFilter[key] = el.value;
      render();
      const again = $("#"+id);
      if(again && ev === "input"){ again.focus(); const v=again.value; again.value=""; again.value=v; }
    });
  };
  wire("fq","q"); wire("fstatus","status"); wire("fregion","region"); wire("fcamp","campaign");
}

function bindCreate(){
  const pick = $("#c_pick");
  if(pick) pick.addEventListener("change", function(){
    const t = taskById(pick.value); if(!t) return;
    $("#c_store").value=t.storeName; $("#c_code").value=t.storeCode;
    $("#c_city").value=t.city; $("#c_state").value=t.state; $("#c_region").value=t.region;
    $("#c_lat").value=t.lat; $("#c_lng").value=t.lng;
    if(!$("#c_type").value) $("#c_type").value=t.displayType;
    toast("Prefilled from "+t.storeCode+" — GPS auto-filled.");
  });
  const file = $("#c_file");
  if(file) file.addEventListener("change", function(){
    const f = file.files && file.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = function(){
      draftBefore = { src: rd.result, ts:new Date().toISOString(),
        lat: parseFloat($("#c_lat").value)||null, lng: parseFloat($("#c_lng").value)||null,
        device: deviceString() };
      render(); toast("Before image attached.");
    };
    rd.onerror = function(){ toast("Could not read that file.", true); };
    rd.readAsDataURL(f);
  });
  const pf = $("#c_poster");
  if(pf) pf.addEventListener("change", function(){
    const f = pf.files && pf.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = function(){
      draftPoster = { src: rd.result, ts:new Date().toISOString(), name: f.name || "artwork" };
      render(); toast("Poster artwork attached.");
    };
    rd.onerror = function(){ toast("Could not read that file.", true); };
    rd.readAsDataURL(f);
  });
  const camp = $("#c_campaign");
  if(camp) camp.addEventListener("change", function(){ applyPosterDefaults(false); });
  restoreForm();
  // first paint of a blank form: seed the capture spec from the campaign
  if(!draftForm) applyPosterDefaults(true);
}
function applyPosterDefaults(silent){
  const camp = $("#c_campaign"); if(!camp) return;
  const d = posterDefaults(camp.value);
  const put = function(id, v){ const el = $("#"+id); if(el) el.value = v; };
  put("c_w", d.w); put("c_h", d.h);
  put("c_stand", d.standoff.toFixed(1)); put("c_tol", d.tol); put("c_atol", d.angleTol);
  snapshotForm();
  if(!silent) toast("Capture spec set from " + campaignById(camp.value).name + " defaults.");
}

function doCreateTask(mode){
  const g = id => { const el=$("#"+id); return el ? String(el.value).trim() : ""; };
  const need = ["c_store","c_code","c_city","c_state","c_region","c_assignee","c_date","c_type",
                "c_w","c_h","c_stand","c_tol","c_atol","c_lat","c_lng","c_instr"];
  let bad = 0;
  need.forEach(function(id){
    const f = $("#f_"+id); if(!f) return;
    const ok = g(id) !== "";
    f.classList.toggle("bad", !ok);
    if(!ok) bad++;
  });
  // numeric sanity
  [["c_lat",-90,90],["c_lng",-180,180],["c_w",0.1,500],["c_h",0.1,500],
   ["c_stand",1,60],["c_tol",0.05,10],["c_atol",1,30]].forEach(function(r){
    const f=$("#f_"+r[0]); const v=parseFloat(g(r[0]));
    if(g(r[0])!=="" && (isNaN(v) || v<r[1] || v>r[2])){
      f.classList.add("bad");
      $(".err",f).textContent = "Enter a number between "+r[1]+" and "+r[2]+".";
      bad++;
    }
  });
  /* Absent entirely in mockup mode — see the panel gate in viewCreate(). */
  const fb = $("#f_before");
  if(fb){ if(!draftBefore){ fb.classList.add("bad"); bad++; } else { fb.classList.remove("bad"); } }
  const fp = $("#f_poster");
  if(fp){ if(!draftPoster){ fp.classList.add("bad"); bad++; } else { fp.classList.remove("bad"); } }

  if(bad){
    toast(bad+" field"+(bad>1?"s":"")+" need attention.", true);
    const first = $(".field.bad"); if(first) first.scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }

  const lat = +parseFloat(g("c_lat")).toFixed(5), lng = +parseFloat(g("c_lng")).toFixed(5);
  const campaignId = g("c_campaign") || (CAMPAIGNS[0] && CAMPAIGNS[0].id);
  if(!campaignId){ toast("No campaign is visible to your account, so a task cannot be created.", true); return; }
  const camp = campaignById(campaignId);
  const code = g("c_code").toUpperCase();
  const group = uuid4();

  /* The prototype invented store fields inline on the task. A real task needs
     a real `stores` row, so: reuse the one with this code if it is already
     visible, otherwise queue an insert with a client-generated id. If that id
     collides with a store that exists but is invisible to us, the outbox reads
     back the server's row and rewrites every reference to it. */
  let store = storeByCode(code);
  let storeIsNew = false;
  if(!store){
    store = { id: uuid4(), code: code, name: g("c_store"), city: g("c_city"),
              state: g("c_state"), stateCode: g("c_state").slice(0,2).toUpperCase(),
              region: g("c_region"), lat: lat, lng: lng, geofenceM: GEOFENCE_M, active: true };
    storeIsNew = true;
    STORES.push(store);
    Outbox.push("store.upsert", { row: storeRow(store) },
                { group: group, label: "Create store " + code });
  }

  const t = normalizeTask({
    id: uuid4(),
    taskCode: (camp.code ? camp.code + "-" : "") + code + "-" + uuid4().slice(0,4).toUpperCase(),
    campaignId: campaignId, storeId: store.id,
    storeName: store.name, storeCode: store.code,
    city: store.city, state: store.state, stateCode: store.stateCode, region: store.region,
    lat: store.lat, lng: store.lng, geofenceM: store.geofenceM,
    assigneeId: g("c_assignee") || null,
    /* tasks_insert_mgr requires manager_id = auth.uid(), for admins too. */
    managerId: me().id,
    execDate: g("c_date"), displayType: g("c_type"),
    widthFt: parseFloat(g("c_w")), heightFt: parseFloat(g("c_h")),
    standoffFt:    +parseFloat(g("c_stand")).toFixed(2),
    standoffTolFt: +parseFloat(g("c_tol")).toFixed(2),
    angleTolDeg:   +parseFloat(g("c_atol")).toFixed(1),
    placement: null,
    instructions: g("c_instr"),
    status: S.DRAFT, createdAt: new Date().toISOString(),
    beforeImage: null, posterArt: null,
    afterImages: [], checkIn: null, merchRemarks:"", reviewRemarks:"",
    submittedAt:null, approvedAt:null, closedAt:null, completionRef:null, audit:[],
    pendingFields: null, submitting: null, lastError: null
  });
  state.tasks.unshift(t);
  t.pendingFields = { group: group, fields: { status: S.DRAFT } };
  Outbox.push("task.insert", { row: taskInsertRow(t) },
              { group: group, taskId: t.id, label: "Create task " + t.taskCode });

  /* Evidence and artwork can only be written once the task row exists (the
     storage policies join on the task id in the path), so these are queued
     AFTER the insert and drain in order. */
  if(draftBefore){
    const bpath = "tasks/" + t.id + "/before/" + uuid4() + ".jpg";
    t.beforeImage = { id: uuid4(), kind:"before", bucket:"evidence", path: bpath,
                      src: "sb:evidence:" + bpath, cleanPath:null, cleanSrc:null,
                      ts: draftBefore.ts, lat: lat, lng: lng, by: me().id,
                      device: draftBefore.device || deviceString(), guided:false,
                      placementId:null, placement:null, local:true,
                      fb: "gen:" + code + ":BEFORE:0" };
    Blobs.put("evidence/" + bpath, draftBefore.src);
    Outbox.push("image.upload", { bucket:"evidence", path:bpath, contentType:"image/jpeg" },
      { group:group, taskId:t.id, blobKey:"evidence/"+bpath, label:"Upload BEFORE photo" });
    Outbox.push("image.insert", { row: imageRow(t.beforeImage, t.id) },
      { group:group, taskId:t.id, label:"Attach BEFORE photo" });
  }
  if(draftPoster){
    /* poster-artwork is the PUBLIC bucket and its write policy is owner-only:
       niva_artwork_write demands the campaign's owner or an admin. A manager
       who does not own this campaign will get a 403 here, and the outbox
       surfaces that as a named failure rather than a silent drop. */
    const ppath = "campaigns/" + campaignId + "/" + uuid4() + ".jpg";
    t.posterArt = { id: uuid4(), kind:"poster", bucket:"poster-artwork", path: ppath,
                    src: "sbp:poster-artwork:" + ppath, cleanPath:null, cleanSrc:null,
                    ts: draftPoster.ts, lat:null, lng:null, by: me().id,
                    device:"", guided:false, placementId:null, placement:null, local:true,
                    name: draftPoster.name || "key-visual.jpg", fb:null };
    Blobs.put("poster-artwork/" + ppath, draftPoster.src);
    Outbox.push("image.upload", { bucket:"poster-artwork", path:ppath, contentType:"image/jpeg" },
      { group:group, taskId:t.id, blobKey:"poster-artwork/"+ppath, label:"Upload campaign key visual" });
    Outbox.push("image.insert", { row: imageRow(t.posterArt, t.id) },
      { group:group, taskId:t.id, label:"Attach campaign key visual" });
  }

  audit(t, "Task created", "Draft created for "+t.storeName+" · "+t.displayType
        + (storeIsNew ? " · new store record " + code : ""), null, group);
  if(draftBefore) audit(t, "Before image attached", "Baseline store photo captured and geo-tagged", null, group);
  audit(t, "Capture brief set",
    "Poster "+t.widthFt+" × "+t.heightFt+" ft · standoff "+t.standoffFt.toFixed(1)+" ± "+t.standoffTolFt+" ft · angle ± "+t.angleTolDeg+"°",
    null, group);

  if(mode === "assign"){
    transition(t, S.ASSIGNED, {
      group: group,
      action:"Task assigned",
      detail:"Assigned to "+userById(t.assigneeId).name+" · execution "+fmtD(t.execDate)
    });
    notify("Task Assigned","Merchandiser", t.assigneeId, t.id,
      t.storeName+" · "+t.displayType+" · due "+fmtD(t.execDate), group);
  }
  draftBefore = null; draftPoster = null; draftForm = null;
  save();
  toast(netUp()
    ? (mode==="assign" ? "Task created and assigned — syncing." : "Task saved as draft — syncing.")
    : "Saved on this device. It will be created on the server when you reconnect.");
  go("task", {id:t.id});
}

function bindComparator(){
  const cmp = $("#cmp"); if(!cmp) return;
  const top = $("#cmpTop"), handle = $("#cmpHandle"), bimg = $("#cmpBeforeImg");
  let dragging = false;
  function sizeTop(){
    // the clipped BEFORE layer must render at the container's full size
    if(bimg){ bimg.style.width = cmp.clientWidth + "px"; bimg.style.height = cmp.clientHeight + "px"; }
  }
  function set(clientX){
    const r = cmp.getBoundingClientRect();
    const pct = clamp((clientX - r.left)/r.width, 0, 1)*100;
    top.style.width = pct + "%";
    handle.style.left = pct + "%";
  }
  cmp.addEventListener("pointerdown", function(e){
    dragging = true;
    if(cmp.setPointerCapture) { try{ cmp.setPointerCapture(e.pointerId); }catch(err){} }
    set(e.clientX);
  });
  cmp.addEventListener("pointermove", function(e){ if(dragging) set(e.clientX); });
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
    cmp.addEventListener(ev, function(){ dragging = false; });
  });
  const imgs = $$("img", cmp);
  imgs.forEach(function(im){ if(im.complete) sizeTop(); else im.addEventListener("load", sizeTop); });
  window.addEventListener("resize", sizeTop);
  sizeTop();
}

function doApprove(id){
  const t = taskById(id); if(!t) return;
  /* Refused by niva_tasks_transition_guard (NIVA_SELF_APPROVAL) and again by
     the tasks_update_field policy. Checked here too so the human gets the
     reason before the round trip, not after. */
  if(t.assigneeId && t.assigneeId === me().id){
    toast("You cannot approve a task assigned to you. Approval has to come from a different user.", true);
    return;
  }
  const remarks = ($("#rev_remarks") && $("#rev_remarks").value.trim()) || "";
  const group = uuid4();
  if(!transition(t, S.APPROVED, {
      group: group,
      patch: { review_remarks: remarks },
      localFields: { reviewRemarks: remarks, approvedAt: new Date().toISOString() },
      action:"Execution approved",
      detail: remarks || "Geofence "+((t.checkIn&&t.checkIn.pass)?"PASS":"FAIL")+" · imagery verified against brief"
  })) return;
  /* notification_kind is a database enum: the stored value stays "Task
     Approved" in both modes and is relabelled by notifLabel() on the way out. */
  notify("Task Approved","Merchandiser", t.assigneeId, t.id,
    byMode(t.storeName+" — this wall is suitable ("+me().name+")",
           t.storeName+" was approved by "+me().name), group);
  save(); render();
  openModal({
    title: byMode("Wall shortlisted","Execution approved"),
    body:'<p style="margin:0 0 10px;color:var(--text-2)">'+esc(t.storeName)+' ('+esc(t.storeCode)+') '
      + byMode('is on the shortlist.','is approved.')+'</p>'
      + '<p style="margin:0;color:var(--text-2)">'
      + byMode('Mark the survey done to move this store to <b>Done</b>. Nothing further is needed from the field.',
               'Generate the completion record to move this task to <b>Closed</b>. '
               + 'The record captures the geo-verified before/after evidence, timestamps and the approving manager.')
      + '</p>',
    actions:[
      {label:"Later", cls:"btn"},
      {label: byMode("Mark survey done","Generate completion record"), cls:"btn primary", act:function(){ doClose(id); }}
    ]
  });
}
function doClose(id){
  const t = taskById(id); if(!t) return;
  /* completion_ref is minted by the FSM trigger, not by us — the prototype
     generated it client-side, which meant the reference on the certificate was
     whatever the browser felt like. It now arrives with the confirmed row. */
  const group = uuid4();
  if(!transition(t, S.CLOSED, {
      group: group,
      localFields: { closedAt: new Date().toISOString() },
      action:"Task closed",
      detail:"Completion record generated by the server on close"
  })) return;
  notify("Task Closed","Manager", t.managerId, t.id,
    byMode(t.storeName+" survey closed", t.storeName+" closed"), group);
  save(); closeModal(); go("task",{id:t.id});
  toast(netUp() ? byMode("Closing — the server issues the reference.",
                         "Closing — the completion record is generated by the server.")
                : byMode("Close queued. It finishes when this device reconnects.",
                         "Close queued. The completion record is issued when this device reconnects."));
}
function doReject(id){
  const t = taskById(id); if(!t) return;
  const el = $("#rev_remarks");
  const remarks = el ? el.value.trim() : "";
  const f = $("#f_rev");
  if(!remarks){
    if(f) f.classList.add("bad");
    if(el) el.focus();
    toast(byMode("Say why this wall is not suitable.","Rejection remarks are required."), true);
    return;
  }
  if(f) f.classList.remove("bad");
  const group = uuid4();
  if(!transition(t, S.REWORK, {
      group: group,
      patch: { review_remarks: remarks },
      localFields: { reviewRemarks: remarks },
      action:"Rework required", detail:remarks })) return;
  /* Still the Submitted -> Rework Required edge, still the "Rework Required"
     notification_kind enum value. In mockup mode both simply read as a
     shortlist decision rather than as a demand to redo the work. */
  notify("Rework Required","Merchandiser", t.assigneeId, t.id,
    byMode(t.storeName+" — this wall was not suitable",
           t.storeName+" was returned for rework"), group);
  save(); go("approvals",{});
  toast(byMode("Wall marked not suitable.","Task returned for rework."));
}

/* ==========================================================
   13. Views — Merchandiser
   ========================================================== */
/* ============================================================================
   FIELD LANGUAGE
   ----------------------------------------------------------------------------
   Everything a merchandiser reads goes through here. Tier letters, capture
   modes, focal sources, standoff tolerances, geofence radii and per-axis angle
   errors are all still recorded — `placement`, `TIER_META` and the capture
   pipeline are untouched — they are simply not shown to the person holding the
   phone. That vocabulary exists for the manager's review screen and for the
   audit trail, and it is useless to someone standing in a shop.
   ============================================================================ */

/* What the field sees instead of a status enum. */
function fieldStatus(t){
  switch(t.status){
    /* MOCKUP MODE: "Rework Required" is the manager saying this WALL does not
       work, not that the merchandiser did the job wrong. It stays actionable —
       the Rework Required -> In Progress edge is how a second wall in the same
       shop gets mocked up — but it is never phrased as a reprimand. */
    case S.REWORK:    return { cls:"stop", text:byMode("Wall not suitable","Needs fixing"), group:"now"  };
    case S.ASSIGNED:  return { cls:"go",   text:"Not started",    group:"now"  };
    case S.PROGRESS:  return t.submitting
                           ? { cls:"warn", text:"Sending",        group:"now"  }
                           : { cls:"warn", text:"In progress",    group:"now"  };
    case S.SUBMITTED: return { cls:"wait", text:byMode("With your manager","Sent for check"), group:"wait" };
    case S.APPROVED:  return { cls:"ok",   text:byMode("Wall suitable","Approved"), group:"done" };
    case S.CLOSED:    return { cls:"ok",   text:byMode("Done","Finished"), group:"done" };
    default:          return { cls:"",     text:"Not ready yet",  group:"wait" };
  }
}
/* The one obvious next action, in the imperative. */
function fieldNext(t){
  switch(t.status){
    case S.ASSIGNED:  return { label:"Check in",  primary:true  };
    case S.REWORK:    return { label:byMode("Try another wall","Fix it"), primary:true };
    case S.PROGRESS:  return t.submitting
                           ? { label:"Open",      primary:false }
                           : { label:"Continue",  primary:true  };
    default:          return { label:"Open",      primary:false };
  }
}
/* A photo's verdict, in words a person can act on. Reads the recorded
   measurement; changes nothing about how it was measured. */
function fieldPhotoVerdict(im){
  const p = im && im.placement;
  if(p && p.pass)  return { cls:"ok",   text:byMode("Mockup ready","Photo accepted") };
  if(p && !p.pass) return { cls:"warn", text:byMode("Not square to the wall — your manager will still see it",
                                                    "Not lined up — your manager will look") };
  return { cls:"", text:byMode("Photo added — poster not drawn to scale","Photo added") };
}

    { k:"done", label:byMode("Decided","Finished"), cls:"done" }
  ];
  const todo = mine.filter(t=>fieldStatus(t).group === "now").length;

  let html = '<div class="mobile">'
    + '<div class="pagehd" style="margin-bottom:12px"><div><h1>My jobs</h1>'
    + '<p>'+(todo
        ? '<span class="num">'+todo+'</span> job'+(todo===1?"":"s")+' need'+(todo===1?"s":"")+' you today'
        : 'Nothing waiting on you right now')+'</p></div></div>';

  /* The notification bell used to live in the topbar, five controls deep.
     Field updates belong where the field is already looking. */
  html += fieldUpdatesStrip();

  if(!mine.length){
    return { html: html + '<div class="card"><div class="bd">'+emptyState("No jobs assigned to you yet.")+'</div></div></div>' };
  }

  groups.forEach(function(g){
    const list = mine.filter(t=>fieldStatus(t).group === g.k);
    if(!list.length) return;
    list.sort(function(a,b){ return String(a.execDate).localeCompare(String(b.execDate)) || a.storeName.localeCompare(b.storeName); });
    html += '<div class="sectlabel" style="margin-top:16px">'+esc(g.label)+' · <span class="num">'+list.length+'</span></div>';
    html += '<div class="joblist">' + list.map(jobCard).join("") + '</div>';
  });
  return { html: html + '</div>' };
}

/* The bell, folded into the list. Unread first; nothing at all when there is
   nothing to say. */
function fieldUpdatesStrip(){
  const all = myNotifs();
  const unread = all.filter(n=>!n.read);
  if(!unread.length) return "";
  return '<div class="updates">'
    + '<div class="uh">'+icon("bell")+'<span>'+unread.length+' update'+(unread.length===1?"":"s")+'</span>'
    +   '<button class="btn sm ghost" data-act="markread">Clear</button></div>'
    + unread.slice(0,4).map(function(n){
        return '<button class="ur" data-act="opennotif" data-id="'+n.id+'">'
          + '<div class="ut">'+esc(notifLabel(n.type))+'</div>'
          + '<div class="ub">'+esc(n.body)+'</div>'
          + '<div class="um">'+esc(ago(n.ts))+'</div></button>';
      }).join("")
    + '</div>';
}

/* Placement verification read-out — used by the review panel and task detail. */
function placementBlock(p, t){
  if(!p){
    return '<div class="pverify"><div class="phd"><span class="tierbadge tier-unv">No guided capture</span></div>'
      + '<div style="font-size:12.5px;color:var(--text-2)">This submission was made with plain file upload or the '
      + 'simulator, so distance and squareness were never measured.</div></div>';
  }
  const tm = tierMeta(p.tier);
  const n1 = v => (v==null || !isFinite(v)) ? "—" : Number(v).toFixed(1);
  const n2 = v => (v==null || !isFinite(v)) ? "—" : Number(v).toFixed(2);
  // tolerances are often 0.75 / 0.05 — don't round them away
  const nt = v => (v==null || !isFinite(v)) ? "—" : String(+Number(v).toFixed(2));
  const tgt = p.targetFt != null ? p.targetFt : (t ? t.standoffFt : STANDOFF_FT);
  const delta = (p.distanceFt!=null && tgt!=null) ? (p.distanceFt - tgt) : null;
  const row = function(label, value, ok, sub){
    return '<div class="prow"><span class="pl">'+esc(label)+(sub?' <span style="opacity:.65">'+esc(sub)+'</span>':'')+'</span>'
      + '<span><b>'+value+'</b> '
      + (ok===null ? '<span class="chip neutral plain" style="margin-left:6px">unverified</span>'
                   : '<span class="chip '+(ok?"pass":"fail")+'" style="margin-left:6px">'+(ok?"PASS":"FAIL")+'</span>')
      + '</span></div>';
  };
  return '<div class="pverify '+(p.pass?"pass":"fail")+'">'
    + '<div class="phd"><span class="big">'+n2(p.distanceFt)+' ft</span>'
    +   '<span style="font-size:11.5px;opacity:.75">measured</span>'
    +   '<div style="flex:1"></div><span class="tierbadge '+tm.cls+'">'+esc(p.tierLabel||tm.label)+'</span></div>'
    + ((MOCKUP && p.fitMinimumFt != null)
        /* MOCKUP: there is no spec to be within, so quoting one would be a
           fiction. The pass/fail is the fit, and the two derived numbers are
           what it was decided against. */
        ? row("Distance from the wall",
              n2(p.distanceFt)+' ft <span style="opacity:.6">fits from '+nt(p.fitMinimumFt)
                +' ft out · best near '+nt(p.fitRecommendedFt)+' ft</span>',
              p.distanceOk)
        : row("Standoff distance", n2(p.distanceFt)+' ft <span style="opacity:.6">vs '+nt(tgt)+' ± '+nt(p.tolFt)+'</span>',
              p.distanceOk, delta==null?"":"("+(delta>=0?"+":"")+delta.toFixed(2)+" ft)"))
    + row("Tilt (pitch)",  n1(p.pitchDeg)+'°', p.pitchOk, "± "+nt(p.angleTolDeg)+"°")
    + row("Roll",          n1(p.rollDeg)+'°',  p.rollOk,  "± "+nt(p.angleTolDeg)+"°")
    + row("Yaw (obliqueness)", p.yawVerified ? n1(p.yawDeg)+'°' : '<span style="opacity:.6">not measured</span>',
          p.yawVerified ? p.yawOk : null, "± "+nt(p.angleTolDeg)+"°")
    + '<div class="prow"><span class="pl">Photo provenance</span><span>'
    +   (p.captureMode === "single-frame"
        ? '<span class="chip pass">SAME FRAME AS THE MEASUREMENT</span>'
        : p.captureMode === "handover"
          ? '<span class="chip neutral">measured, then re-opened the camera</span>'
          : '<span class="chip neutral">'+esc(p.captureMode || "—")+'</span>')
    + '</span></div>'
    + (p.errorPct != null
        ? '<div class="prow"><span class="pl">Estimated distance error <span style="opacity:.65">1σ, derived</span></span>'
          + '<span><b>± '+p.errorPct.toFixed(1)+' %</b>'
          + '<span class="chip '+(p.errorPct <= 5 ? "pass" : "fail")+'" style="margin-left:6px">'
          + (p.errorPct <= 5 ? "WITHIN 5%" : "OVER 5%")+'</span></span></div>'
        : '')
    + '<div class="prow"><span class="pl">How the distance was measured</span>'
    +   '<span><span class="tierbadge '+methodMeta(p.method || methodFromTier(p.tier)).cls+'">'
    +   esc(p.methodLabel || methodMeta(p.method || methodFromTier(p.tier)).label)+'</span></span></div>'
    /* The two fit checks, never merged: what the CAMERA could see, and what the
       merchandiser said the WALL was. The second is blank unless they ran it,
       and says so, because "not asked" is not "passed". */
    + (p.visibleWFt != null
        ? '<div class="prow"><span class="pl">Wall in view when shot <span style="opacity:.65">from the lens and the distance</span></span>'
          + '<span><b>'+Number(p.visibleWFt).toFixed(1)+' × '+Number(p.visibleHFt).toFixed(1)+' ft</b>'
          + (p.fitRelPct != null ? ' <span style="opacity:.6">± '+Number(p.fitRelPct).toFixed(0)+' %</span>' : '')
          + '<span class="chip '+(p.fitsInView ? "pass" : "fail")+'" style="margin-left:6px">'
          + (p.fitsInView ? "POSTER FITS THE FRAME" : "POSTER RAN OFF THE FRAME")+'</span></span></div>'
        : '')
    + (p.fitMinimumFt != null
        ? '<div class="prow"><span class="pl">Wall the merchandiser marked <span style="opacity:.65">the wall\u2019s own edges</span></span>'
          + '<span>'
          + (p.fitsOnWall == null
              ? '<span class="chip neutral plain">not marked</span>'
              : '<b>'+Number(p.wallWFt).toFixed(1)+(p.wallHFt ? ' × '+Number(p.wallHFt).toFixed(1) : '')+' ft</b>'
                + '<span class="chip '+(p.fitsOnWall ? "pass" : "fail")+'" style="margin-left:6px">'
                + (p.fitsOnWall ? "POSTER FITS THE WALL" : "POSTER OVERFLOWS THE WALL")+'</span>'
                + (p.wallOverflowAck ? '<span class="chip neutral plain" style="margin-left:6px">shot anyway, deliberately</span>' : ''))
          + '</span></div>'
        : '')
    + (p.method === "floor-line"
        ? '<div class="prow"><span class="pl">Phone height <span style="opacity:.65">h in d = h / tan θ</span></span>'
          + '<span><b>'+(p.floorHeightM == null ? "—" : Number(p.floorHeightM).toFixed(2)+' m')+'</b>'
          + '<span class="chip '+(p.floorCalibrated ? "pass" : (p.floorHeightSrc === "stature" ? "neutral" : "fail"))+'" style="margin-left:6px">'
          + (p.floorCalibrated ? "MEASURED ON THIS PHONE"
              : p.floorHeightSrc === "stature" ? "FROM THEIR STATED HEIGHT"
              : "ROUGH DEFAULT")+'</span></span></div>'
          + '<div class="prow"><span class="pl">Aim below horizontal <span style="opacity:.65">θ</span></span>'
          + '<span><b>'+(p.floorThetaDeg == null ? "—" : Number(p.floorThetaDeg).toFixed(1)+'°')+'</b>'
          + (p.floorThetaSigmaDeg != null ? ' <span style="opacity:.6">± '+Number(p.floorThetaSigmaDeg).toFixed(2)+'°</span>' : '')
          + (p.floorFtPerDeg != null ? ' <span class="chip neutral plain" style="margin-left:6px">'
              + p.floorFtPerDeg+' ft per degree</span>' : '')
          + '</span></div>'
          + '<div class="prow"><span class="pl">Reading at the shutter</span><span>'
          + (p.floorLive === false
              ? '<span class="chip fail">HELD '+Number(p.floorHeldS||0).toFixed(1)+' s</span>'
                + (p.floorMotionSeen === false
                    ? '<span class="chip fail" style="margin-left:6px">MOVEMENT UNKNOWN</span>'
                    : '<span class="chip pass" style="margin-left:6px">NO STEP DETECTED</span>')
              : '<span class="chip pass">LIVE — aimed at the floor line</span>')
          + '</span></div>'
        : '')
    + (p.refLabel
        ? '<div class="prow"><span class="pl">Scale reference'
          + (p.refAuto ? ' <span style="opacity:.65">auto-detected</span>' : ' <span style="opacity:.65">outlined by hand</span>')
          + '</span><span><b>'+esc(p.refLabel)+'</b>'
          + (p.refConfidence != null
              ? '<span class="chip neutral plain" style="margin-left:6px">'+Math.round(p.refConfidence*100)+'% conf</span>'
              : '')
          + '</span></div>'
        : '')
    + '<div class="prow" style="border-top:1px solid rgba(128,128,128,.22);margin-top:6px;padding-top:8px">'
    +   '<span class="pl">Verification</span>'
    +   '<span><span class="chip '+(p.pass?"pass":"fail")+'">'+(p.pass?"ALL GATES PASSED":"GATES NOT MET")+'</span></span></div>'
    + '<div style="font-size:11.5px;color:var(--text-2);margin-top:8px;line-height:1.5">'
    +   '<span class="mono">distance:</span> '+esc(p.distanceSource||"—")+'<br>'
    +   '<span class="mono">focal:</span> '+esc(p.focalSource||"—")+(p.focalPx?(' · '+Math.round(p.focalPx)+' px'):'')
    +   '<br><span class="mono">photo:</span> '+esc(CAPTURE_MODES[p.captureMode] || p.captureMode || "—")
    +   (p.cameraImage
        ? '<br><span class="mono">camera image:</span> '+p.cameraImage.w+'×'+p.cameraImage.h
          + (p.cameraImage.readbackMs != null ? ' · readback '+p.cameraImage.readbackMs+' ms' : '')
          + (p.cameraImage.path ? ' · '+esc(p.cameraImage.path) : '')
        : '')
    +   (p.errorTerms && p.method === "floor-line"
        ? '<br><span class="mono">error budget:</span> phone height ± '+p.errorTerms.height
          + ' % · aim angle ± '+p.errorTerms.pitch+' % (added in quadrature; the angle term is '
          + 'σ<sub>θ</sub>/(sin θ · cos θ), which is why a shallow aim costs so much)'
        : p.errorTerms
        ? '<br><span class="mono">error budget:</span> focal ± '+p.errorTerms.focal+' % · reference size ± '
          + p.errorTerms.refDim+' % · corner localisation ± '+p.errorTerms.corner
          + ' % · lens distortion ± '+p.errorTerms.barrel+' % (added in quadrature)'
        : '')
    +   (p.floorHeightSource ? '<br><span class="mono">height:</span> '+esc(p.floorHeightSource) : '')
    +   (p.detectWork ? '<br><span class="mono">detector:</span> '+esc(p.detectWork)
          + (p.detectMs != null ? ' · '+p.detectMs+' ms/pass' : '')
          + (p.refCornerRmsPx != null ? ' · edge residual '+p.refCornerRmsPx+' px' : '')
          + (p.detectDegraded ? ' · stepped down' : '') : '')
    +   (p.note ? '<br><span style="color:var(--st-rework)">'+esc(p.note)+'</span>' : '')
    + '</div></div>';
}
