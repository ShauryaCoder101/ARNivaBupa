    return groups[b].length - groups[a].length || a.localeCompare(b);
  }).map(function(name){
    const g = groups[name], c = counts(g);
    return { name:name, c:c, total:g.length, done:c[S.APPROVED]+c[S.CLOSED] };
  });
}
/* Per-campaign totals, server-first, keyed by campaign id. */
function campaignRollupById(){
  const out = Object.create(null);
  ((state && state.campaignRollup) || []).forEach(function(r){
    if(r && r.campaign_id) out[r.campaign_id] = r;
  });
  return out;
}

/* ==========================================================
   5e. Polling
   ------------------------------------------------------------
   Supabase Realtime speaks Phoenix channels over a WebSocket. Driving that by
   hand — join, heartbeat, `postgres_changes` config, per-topic RLS token
   refresh, reconnect/backoff — is several hundred lines that cannot be tested
   against anything but a live project, for an app whose dashboard is already
   authoritative through a server-side rollup. So this build POLLS: the rollup
   RPCs and the task list are re-read on an interval, on reconnect, when the
   tab becomes visible again, and after the outbox drains. Latency to another
   user's change is therefore up to POLL_INTERVAL_MS, not instant. That is a
   deliberate, documented trade — see MIGRATION.md.
   ========================================================== */
const Poller = (function(){
  let t = null, ticks = 0, stopped = false;
  function arm(ms){
    if(t) clearTimeout(t);
    if(stopped) return;
    t = setTimeout(run, ms == null ? POLL_INTERVAL_MS : ms);
  }
  function run(){
    if(stopped) return;
    if(!SB_CONFIGURED || Session.state !== "ready") return arm();
    if(typeof document !== "undefined" && document.visibilityState === "hidden") return arm();
    if(typeof navigator !== "undefined" && navigator.onLine === false) return arm();
    ticks++;
    Repo.refresh(ticks % 10 === 0).then(function(){ scheduleRender(); arm(); },
                                        function(){ arm(); });
  }
  return {
    start: function(){ stopped = false; arm(POLL_INTERVAL_MS); },
    stop:  function(){ stopped = true; if(t) clearTimeout(t); t = null; },
    now:   function(){ arm(0); }
  };
})();

const icon = (k, cls)=> '<svg class="'+(cls||"")+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+ICONS[k]+'</svg>';
const chip = s => '<span class="chip '+STATUS_CLASS[s]+'">'+esc(s)+'</span>';

/* ---------- per-task sync state ----------
   The status chip says what the SERVER believes. This says what this device is
   still holding, which is a different fact and, in a shop with no signal, the
   more important one. Nothing here ever claims a write landed: `submitting`
   means bytes are still going up, `queued` means edits are still in the queue,
   `failed` means the server refused something and a human has to look.        */
function taskSync(t){
  if(!t) return null;
  const queued = Outbox.pendingFor(t.id);
  const failed = Outbox.failures().filter(function(it){ return it.taskId === t.id; }).length;
  if(failed){
    return { cls:"fail", label: failed + " change" + (failed===1?"":"s") + " refused",
             kind:"failed",
             detail: t.lastError || "The server refused part of this task's sync. Open the sync panel to retry or discard." };
  }
  if(t.submitting){
    const left = Outbox.groupPending(t.submitting.group);
    return { cls:"queued", label: left ? ("Submitting · " + left + " step" + (left===1?"":"s") + " left") : "Submitting · finishing",
             kind:"submitting",
             detail: "This submission is queued on this device with " + t.submitting.images
                   + " image" + (t.submitting.images===1?"":"s") + " (" + t.submitting.bytes
                   + " upload" + (t.submitting.bytes===1?"":"s") + "). The task stays In Progress until the server has the evidence AND accepts the status change." };
  }
  if(queued){
    return { cls:"queued", label: queued + " queued", kind:"queued",
             detail: queued + " change" + (queued===1?"":"s") + " on this device "
                   + (queued===1?"has":"have") + " not reached the server yet." };
  }
  return null;
}
function taskSyncChip(t){
  const s = taskSync(t);
  if(!s) return "";
  return '<span class="chip '+s.cls+'" title="'+esc(s.detail)+'">'+esc(s.label)+'</span>';
}
function taskSyncBanner(t){
  const s = taskSync(t);
  if(!s) return "";
  const colour = s.kind === "failed" ? "var(--st-rework)" : "var(--st-progress)";
  return '<div class="card" style="margin-bottom:14px;border-left:3px solid '+colour+'"><div class="bd">'
    + '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
    +   '<span class="chip '+s.cls+'">'+esc(s.label)+'</span>'
    +   '<div style="flex:1;min-width:200px;font-size:12.5px;color:var(--text-2)">'+esc(s.detail)+'</div>'
    +   '<button class="btn sm" data-act="syncpanel">Sync status</button>'
    + '</div></div></div>';
}

/* The bar and legend take a per-status COUNT MAP, not a task array, so the
   same widgets can be driven either by rows this device holds or by the
   server's own rollup (which returns counts and no rows at all). */
function progressBarC(c, total){
  const n = total || 1;
  let html = '<div class="bar">';
  ALL_STATUS.forEach(function(s){
    if(!c[s]) return;
    html += '<span style="width:'+(c[s]/n*100).toFixed(2)+'%;background:'+STATUS_HEX[s]+'" title="'+esc(s)+': '+c[s]+'"></span>';
  });
  return html + '</div>';
}
function barLegendC(c){
  return '<div class="barlegend">' + ALL_STATUS.filter(s=>c[s]).map(function(s){
    return '<span><i style="background:'+STATUS_HEX[s]+'"></i>'+esc(s)+' <b class="num">'+c[s]+'</b></span>';
  }).join("") + '</div>';
}
function progressBar(tasks){ return progressBarC(counts(tasks), tasks.length); }
function barLegend(tasks){ return barLegendC(counts(tasks)); }
function shotHTML(img, label){
  if(!img) return '<div class="shot" style="padding:28px;text-align:center;color:var(--text-3);font-size:12px">No image</div>';
  /* data-fb is what the capture-phase `error` listener in section 18 reads: an
     evidence object that 404s (seed.sql ships task_images metadata with no
     bytes) swaps to the procedural stand-in instead of showing a broken tile.
     Without this attribute that handler can never fire. */
  return '<div class="shot">'
    + (label ? '<span class="tagtop">'+esc(label)+'</span>' : "")

/* ==========================================================
   7. Donut (hand-rolled SVG arcs)
   ========================================================== */
function donut(tasksCounts, total){
  const R=62, r=42, cx=76, cy=76;
  const segs = ALL_STATUS.filter(s=>tasksCounts[s]>0);
  const sum = total || segs.reduce((a,s)=>a+tasksCounts[s],0) || 1;
  let a0 = -Math.PI/2, paths = "";
  segs.forEach(function(s){
    const frac = tasksCounts[s]/sum;
    let a1 = a0 + frac*Math.PI*2;
    const full = frac >= 0.9999;
    if(full) a1 = a0 + Math.PI*2 - 0.0001;
    const large = (a1-a0) > Math.PI ? 1 : 0;
    const x0=cx+R*Math.cos(a0), y0=cy+R*Math.sin(a0);
    const x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1);
    const x2=cx+r*Math.cos(a1), y2=cy+r*Math.sin(a1);
    const x3=cx+r*Math.cos(a0), y3=cy+r*Math.sin(a0);
    paths += '<path d="M'+x0.toFixed(2)+' '+y0.toFixed(2)
      + ' A'+R+' '+R+' 0 '+large+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)
      + ' L'+x2.toFixed(2)+' '+y2.toFixed(2)
      + ' A'+r+' '+r+' 0 '+large+' 0 '+x3.toFixed(2)+' '+y3.toFixed(2)
      + ' Z" fill="'+STATUS_HEX[s]+'"><title>'+esc(s)+': '+tasksCounts[s]+'</title></path>';
    a0 = a1;
  });
  const done = (tasksCounts[S.APPROVED]||0)+(tasksCounts[S.CLOSED]||0);
  return '<svg viewBox="0 0 152 152" width="152" height="152" role="img" aria-label="Status breakdown">'
    + '<circle cx="76" cy="76" r="52" fill="none"/>' + paths
    + '<text x="76" y="72" text-anchor="middle" font-size="25" font-weight="700" fill="currentColor" style="font-variant-numeric:tabular-nums">'+(sum?Math.round(done/sum*100):0)+'%</text>'
    + '<text x="76" y="90" text-anchor="middle" font-size="10" fill="currentColor" opacity=".55" letter-spacing="1">COMPLETE</text>'
    + '</svg>';
}

  const totalC = {};

  html += '<div class="card"><div class="hd"><h3>Progress by '+esc(gran)+'</h3><div class="spacer" style="flex:1"></div>'

        return '<div class="rowbar"><div class="lbl" title="'+esc(b.name)+'">'+esc(b.name)+'</div>'
          + progressBarC(b.c, b.total)

  html += '<div class="card"><div class="hd"><h3>Status Breakdown</h3></div>'

          + (f.a.detail ? '<div class="d">'+esc(f.a.detail)+'</div>' : "")
          + '</div>';
      }).join("")
    + '</div></div></div>';

  return { html: html };
}

function taskTable(tasks, title, withFilters){
  let list = tasks.slice();
  let filterHTML = "";
  if(withFilters){
    const f = ui.taskFilter;
    if(f.q){
      const q = f.q.toLowerCase();
      list = list.filter(t => (t.storeName+" "+t.storeCode+" "+t.city+" "+t.state).toLowerCase().indexOf(q) >= 0);
    }
    if(f.status)   list = list.filter(t=>t.status===f.status);
    if(f.region)   list = list.filter(t=>t.region===f.region);
    if(f.campaign) list = list.filter(t=>t.campaignId===f.campaign);
    filterHTML = '<div class="filters">'
      + '<input id="fq" placeholder="Search store, code, city…" value="'+esc(f.q)+'">'
      + '<select id="fstatus"><option value="">All statuses</option>'+ALL_STATUS.map(s=>'<option '+(f.status===s?"selected":"")+'>'+esc(s)+'</option>').join("")+'</select>'
      + '<select id="fregion"><option value="">All regions</option>'+REGIONS.map(s=>'<option '+(f.region===s?"selected":"")+'>'+esc(s)+'</option>').join("")+'</select>'
      + '<select id="fcamp"><option value="">All campaigns</option>'+CAMPAIGNS.map(c=>'<option value="'+c.id+'" '+(f.campaign===c.id?"selected":"")+'>'+esc(c.name)+'</option>').join("")+'</select>'
      + '<span style="color:var(--text-3);font-size:12px" class="num">'+list.length+' of '+tasks.length+'</span>'
      + '</div>';
  }
  list.sort((a,b)=> ALL_STATUS.indexOf(a.status) - ALL_STATUS.indexOf(b.status) || a.storeName.localeCompare(b.storeName));

  let html = filterHTML + '<div class="card"><div class="hd"><h3>'+esc(title)+'</h3></div><div class="bd tight"><div class="tblwrap">';
  if(!list.length){ return html + emptyState("No tasks match the current filters.") + '</div></div></div>'; }
  html += '<table class="tbl"><thead><tr>'
    + '<th>Store</th><th>Location</th><th>Display</th><th>Merchandiser</th><th>Exec date</th><th>Status</th><th></th>'
    + '</tr></thead><tbody>';
  html += list.map(function(t){
    return '<tr class="clickable" data-act="open" data-id="'+t.id+'">'
      + '<td><div class="stack"><b>'+esc(t.storeName)+'</b><span class="sub mono">'+esc(t.storeCode)+'</span></div></td>'
      + '<td><div class="stack">'+esc(t.city)+'<span class="sub">'+esc(t.state)+' · '+esc(t.region)+'</span></div></td>'
      + '<td>'+esc(t.displayType)+'<div class="sub num" style="font-size:11.5px;color:var(--text-3)">'+t.widthFt+' × '+t.heightFt+' ft</div></td>'
      + '<td>'+esc(userById(t.assigneeId).name)+'</td>'
      + '<td class="num">'+fmtD(t.execDate)+'</td>'
      + '<td>'+chip(t.status)+(function(){ const c = taskSyncChip(t); return c ? '<div style="margin-top:4px">'+c+'</div>' : ''; })()+'</td>'
      + '<td style="text-align:right"><span style="color:var(--text-3)">›</span></td>'
      + '</tr>';
  }).join("");
  html += '</tbody></table></div></div></div>';
  return html;
}

function bindFilters(){
  const wire = (id, key) => {
    const el = $("#"+id); if(!el) return;
    const ev = el.tagName === "INPUT" ? "input" : "change";
    el.addEventListener(ev, function(){
      ui.taskFilter[key] = el.value;
      render();
      const again = $("#"+id);
      if(again && ev === "input"){ again.focus(); const v=again.value; again.value=""; again.value=v; }
    });
  };
  wire("fq","q"); wire("fstatus","status"); wire("fregion","region"); wire("fcamp","campaign");
}

    + '</div>'
    + '<div class="hint">Upload the print-ready key visual. The merchandiser never gets to rescale it: '
    + 'its on-screen size is derived from the measured distance, so the overlay is the verification.</div>'
    + '</div></div>'

    + '<div class="card" style="margin-top:14px"><div class="bd">'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
    + '<button class="btn primary" data-act="createtask" data-mode="assign">'+icon("check")+'Create &amp; assign</button>'
    + '<button class="btn" data-act="createtask" data-mode="draft">Save as draft</button>'
    + '</div>'
    + '<div class="hint" style="margin-top:9px">“Create &amp; assign” moves the task Draft → Assigned and notifies the merchandiser.</div>'
    + '</div></div></div>';

  html += '</div>';
  return { html: html, post: bindCreate };
}
function fField(id, label, control, req){
  return '<div class="field" id="f_'+id+'"><label class="fl" for="'+id+'">'+esc(label)
    + (req?' <span class="req">*</span>':'')+'</label>'+control
    + '<div class="err">This field is required.</div></div>';
}
function bindCreate(){
  const pick = $("#c_pick");
  if(pick) pick.addEventListener("change", function(){
    const t = taskById(pick.value); if(!t) return;
    $("#c_store").value=t.storeName; $("#c_code").value=t.storeCode;
    $("#c_city").value=t.city; $("#c_state").value=t.state; $("#c_region").value=t.region;
    $("#c_lat").value=t.lat; $("#c_lng").value=t.lng;
    if(!$("#c_type").value) $("#c_type").value=t.displayType;
    toast("Prefilled from "+t.storeCode+" — GPS auto-filled.");
  });
  const file = $("#c_file");
  if(file) file.addEventListener("change", function(){
    const f = file.files && file.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = function(){
      draftBefore = { src: rd.result, ts:new Date().toISOString(),
        lat: parseFloat($("#c_lat").value)||null, lng: parseFloat($("#c_lng").value)||null,
        device: deviceString() };
      render(); toast("Before image attached.");
    };
    rd.onerror = function(){ toast("Could not read that file.", true); };
    rd.readAsDataURL(f);
  });
  const pf = $("#c_poster");
  if(pf) pf.addEventListener("change", function(){
    const f = pf.files && pf.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = function(){
      draftPoster = { src: rd.result, ts:new Date().toISOString(), name: f.name || "artwork" };
      render(); toast("Poster artwork attached.");
    };
    rd.onerror = function(){ toast("Could not read that file.", true); };
    rd.readAsDataURL(f);
  });
  const camp = $("#c_campaign");
  if(camp) camp.addEventListener("change", function(){ applyPosterDefaults(false); });
  restoreForm();
  // first paint of a blank form: seed the capture spec from the campaign
  if(!draftForm) applyPosterDefaults(true);
}
function applyPosterDefaults(silent){
  const camp = $("#c_campaign"); if(!camp) return;
  const d = posterDefaults(camp.value);
  const put = function(id, v){ const el = $("#"+id); if(el) el.value = v; };
  put("c_w", d.w); put("c_h", d.h);
  put("c_stand", d.standoff.toFixed(1)); put("c_tol", d.tol); put("c_atol", d.angleTol);
  snapshotForm();
  if(!silent) toast("Capture spec set from " + campaignById(camp.value).name + " defaults.");
}

function doCreateTask(mode){
  const g = id => { const el=$("#"+id); return el ? String(el.value).trim() : ""; };
  const need = ["c_store","c_code","c_city","c_state","c_region","c_assignee","c_date","c_type",
                "c_w","c_h","c_stand","c_tol","c_atol","c_lat","c_lng","c_instr"];
  let bad = 0;
  need.forEach(function(id){
    const f = $("#f_"+id); if(!f) return;
    const ok = g(id) !== "";
    f.classList.toggle("bad", !ok);
    if(!ok) bad++;
  });
  // numeric sanity
  [["c_lat",-90,90],["c_lng",-180,180],["c_w",0.1,500],["c_h",0.1,500],
   ["c_stand",1,60],["c_tol",0.05,10],["c_atol",1,30]].forEach(function(r){
    const f=$("#f_"+r[0]); const v=parseFloat(g(r[0]));
    if(g(r[0])!=="" && (isNaN(v) || v<r[1] || v>r[2])){
      f.classList.add("bad");
      $(".err",f).textContent = "Enter a number between "+r[1]+" and "+r[2]+".";
      bad++;
    }
  });
  const fb = $("#f_before");
  if(!draftBefore){ fb.classList.add("bad"); bad++; } else { fb.classList.remove("bad"); }
  const fp = $("#f_poster");
  if(fp){ if(!draftPoster){ fp.classList.add("bad"); bad++; } else { fp.classList.remove("bad"); } }

  if(bad){
    toast(bad+" field"+(bad>1?"s":"")+" need attention.", true);
    const first = $(".field.bad"); if(first) first.scrollIntoView({behavior:"smooth", block:"center"});
    return;
  }

  const lat = +parseFloat(g("c_lat")).toFixed(5), lng = +parseFloat(g("c_lng")).toFixed(5);
  const campaignId = g("c_campaign") || (CAMPAIGNS[0] && CAMPAIGNS[0].id);
  if(!campaignId){ toast("No campaign is visible to your account, so a task cannot be created.", true); return; }
  const camp = campaignById(campaignId);
  const code = g("c_code").toUpperCase();
  const group = uuid4();

  /* The prototype invented store fields inline on the task. A real task needs
     a real `stores` row, so: reuse the one with this code if it is already
     visible, otherwise queue an insert with a client-generated id. If that id
     collides with a store that exists but is invisible to us, the outbox reads
     back the server's row and rewrites every reference to it. */
  let store = storeByCode(code);
  let storeIsNew = false;
  if(!store){
    store = { id: uuid4(), code: code, name: g("c_store"), city: g("c_city"),
              state: g("c_state"), stateCode: g("c_state").slice(0,2).toUpperCase(),
              region: g("c_region"), lat: lat, lng: lng, geofenceM: GEOFENCE_M, active: true };
    storeIsNew = true;
    STORES.push(store);
    Outbox.push("store.upsert", { row: storeRow(store) },
                { group: group, label: "Create store " + code });
  }

  const t = normalizeTask({
    id: uuid4(),
    taskCode: (camp.code ? camp.code + "-" : "") + code + "-" + uuid4().slice(0,4).toUpperCase(),
    campaignId: campaignId, storeId: store.id,
    storeName: store.name, storeCode: store.code,
    city: store.city, state: store.state, stateCode: store.stateCode, region: store.region,
    lat: store.lat, lng: store.lng, geofenceM: store.geofenceM,
    assigneeId: g("c_assignee") || null,
    /* tasks_insert_mgr requires manager_id = auth.uid(), for admins too. */
    managerId: me().id,
    execDate: g("c_date"), displayType: g("c_type"),
    widthFt: parseFloat(g("c_w")), heightFt: parseFloat(g("c_h")),
    standoffFt:    +parseFloat(g("c_stand")).toFixed(2),
    standoffTolFt: +parseFloat(g("c_tol")).toFixed(2),
    angleTolDeg:   +parseFloat(g("c_atol")).toFixed(1),
    placement: null,
    instructions: g("c_instr"),
    status: S.DRAFT, createdAt: new Date().toISOString(),
    beforeImage: null, posterArt: null,
    afterImages: [], checkIn: null, merchRemarks:"", reviewRemarks:"",
    submittedAt:null, approvedAt:null, closedAt:null, completionRef:null, audit:[],
    pendingFields: null, submitting: null, lastError: null
  });
  state.tasks.unshift(t);
  t.pendingFields = { group: group, fields: { status: S.DRAFT } };
  Outbox.push("task.insert", { row: taskInsertRow(t) },
              { group: group, taskId: t.id, label: "Create task " + t.taskCode });

  /* Evidence and artwork can only be written once the task row exists (the
     storage policies join on the task id in the path), so these are queued
     AFTER the insert and drain in order. */
  if(draftBefore){
    const bpath = "tasks/" + t.id + "/before/" + uuid4() + ".jpg";
    t.beforeImage = { id: uuid4(), kind:"before", bucket:"evidence", path: bpath,
                      src: "sb:evidence:" + bpath, cleanPath:null, cleanSrc:null,
                      ts: draftBefore.ts, lat: lat, lng: lng, by: me().id,
                      device: draftBefore.device || deviceString(), guided:false,
                      placementId:null, placement:null, local:true,
                      fb: "gen:" + code + ":BEFORE:0" };
    Blobs.put("evidence/" + bpath, draftBefore.src);
    Outbox.push("image.upload", { bucket:"evidence", path:bpath, contentType:"image/jpeg" },
      { group:group, taskId:t.id, blobKey:"evidence/"+bpath, label:"Upload BEFORE photo" });
    Outbox.push("image.insert", { row: imageRow(t.beforeImage, t.id) },
      { group:group, taskId:t.id, label:"Attach BEFORE photo" });
  }
  if(draftPoster){
    /* poster-artwork is the PUBLIC bucket and its write policy is owner-only:
       niva_artwork_write demands the campaign's owner or an admin. A manager
       who does not own this campaign will get a 403 here, and the outbox
       surfaces that as a named failure rather than a silent drop. */
    const ppath = "campaigns/" + campaignId + "/" + uuid4() + ".jpg";
    t.posterArt = { id: uuid4(), kind:"poster", bucket:"poster-artwork", path: ppath,
                    src: "sbp:poster-artwork:" + ppath, cleanPath:null, cleanSrc:null,
                    ts: draftPoster.ts, lat:null, lng:null, by: me().id,
                    device:"", guided:false, placementId:null, placement:null, local:true,
                    name: draftPoster.name || "key-visual.jpg", fb:null };
    Blobs.put("poster-artwork/" + ppath, draftPoster.src);
    Outbox.push("image.upload", { bucket:"poster-artwork", path:ppath, contentType:"image/jpeg" },
      { group:group, taskId:t.id, blobKey:"poster-artwork/"+ppath, label:"Upload campaign key visual" });
    Outbox.push("image.insert", { row: imageRow(t.posterArt, t.id) },
      { group:group, taskId:t.id, label:"Attach campaign key visual" });
  }

  audit(t, "Task created", "Draft created for "+t.storeName+" · "+t.displayType
        + (storeIsNew ? " · new store record " + code : ""), null, group);
  if(draftBefore) audit(t, "Before image attached", "Baseline store photo captured and geo-tagged", null, group);
  audit(t, "Capture brief set",
    "Poster "+t.widthFt+" × "+t.heightFt+" ft · standoff "+t.standoffFt.toFixed(1)+" ± "+t.standoffTolFt+" ft · angle ± "+t.angleTolDeg+"°",
    null, group);

  if(mode === "assign"){
    transition(t, S.ASSIGNED, {
      group: group,
      action:"Task assigned",
      detail:"Assigned to "+userById(t.assigneeId).name+" · execution "+fmtD(t.execDate)
    });
    notify("Task Assigned","Merchandiser", t.assigneeId, t.id,
      t.storeName+" · "+t.displayType+" · due "+fmtD(t.execDate), group);
  }
  draftBefore = null; draftPoster = null; draftForm = null;
  save();
  toast(netUp()
    ? (mode==="assign" ? "Task created and assigned — syncing." : "Task saved as draft — syncing.")
    : "Saved on this device. It will be created on the server when you reconnect.");
  go("task", {id:t.id});
}

      + '<div style="display:flex;gap:8px;flex-wrap:wrap">'

      + '<button class="btn danger" data-act="reject" data-id="'+t.id+'">Reject / Rework</button>'
      + '</div>'

      + '</div></div>';
  } else if(t.status === S.APPROVED){
    html += '<div class="card"><div class="hd"><h3>Completion record</h3></div><div class="bd">'
      + '<div style="font-size:13px;color:var(--text-2);margin-bottom:10px">This execution is approved. Generate the completion record to close it out.</div>'

      + '<dl class="kv"><dt>Record</dt><dd class="mono">'+esc(t.completionRef)+'</dd>'
      + '<dt>Closed</dt><dd>'+esc(fmtDT(t.closedAt))+'</dd></dl></div></div>';
  }
  html += '</div></div>';

  return { html: html, post: function(){ bindComparator(); } };
}

function bindComparator(){
  const cmp = $("#cmp"); if(!cmp) return;
  const top = $("#cmpTop"), handle = $("#cmpHandle"), bimg = $("#cmpBeforeImg");
  let dragging = false;
  function sizeTop(){
    // the clipped BEFORE layer must render at the container's full size
    if(bimg){ bimg.style.width = cmp.clientWidth + "px"; bimg.style.height = cmp.clientHeight + "px"; }
  }
  function set(clientX){
    const r = cmp.getBoundingClientRect();
    const pct = clamp((clientX - r.left)/r.width, 0, 1)*100;
    top.style.width = pct + "%";
    handle.style.left = pct + "%";
  }
  cmp.addEventListener("pointerdown", function(e){
    dragging = true;
    if(cmp.setPointerCapture) { try{ cmp.setPointerCapture(e.pointerId); }catch(err){} }
    set(e.clientX);
  });
  cmp.addEventListener("pointermove", function(e){ if(dragging) set(e.clientX); });
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
    cmp.addEventListener(ev, function(){ dragging = false; });
  });
  const imgs = $$("img", cmp);
  imgs.forEach(function(im){ if(im.complete) sizeTop(); else im.addEventListener("load", sizeTop); });
  window.addEventListener("resize", sizeTop);
  sizeTop();
}

function doApprove(id){
  const t = taskById(id); if(!t) return;
  /* Refused by niva_tasks_transition_guard (NIVA_SELF_APPROVAL) and again by
     the tasks_update_field policy. Checked here too so the human gets the
     reason before the round trip, not after. */
  if(t.assigneeId && t.assigneeId === me().id){
    toast("You cannot approve a task assigned to you. Approval has to come from a different user.", true);
    return;
  }
  const remarks = ($("#rev_remarks") && $("#rev_remarks").value.trim()) || "";
  const group = uuid4();
  if(!transition(t, S.APPROVED, {
      group: group,
      patch: { review_remarks: remarks },
      localFields: { reviewRemarks: remarks, approvedAt: new Date().toISOString() },
      action:"Execution approved",
      detail: remarks || "Geofence "+((t.checkIn&&t.checkIn.pass)?"PASS":"FAIL")+" · imagery verified against brief"
  })) return;
  notify("Task Approved","Merchandiser", t.assigneeId, t.id, t.storeName+" was approved by "+me().name, group);
  save(); render();
  openModal({
    title:"Execution approved",
    body:'<p style="margin:0 0 10px;color:var(--text-2)">'+esc(t.storeName)+' ('+esc(t.storeCode)+') is approved.</p>'
      + '<p style="margin:0;color:var(--text-2)">Generate the completion record to move this task to <b>Closed</b>. '
      + 'The record captures the geo-verified before/after evidence, timestamps and the approving manager.</p>',
    actions:[
      {label:"Later", cls:"btn"},
      {label:"Generate completion record", cls:"btn primary", act:function(){ doClose(id); }}
    ]
  });
}
function doClose(id){
  const t = taskById(id); if(!t) return;
  /* completion_ref is minted by the FSM trigger, not by us — the prototype
     generated it client-side, which meant the reference on the certificate was
     whatever the browser felt like. It now arrives with the confirmed row. */
  const group = uuid4();
  if(!transition(t, S.CLOSED, {
      group: group,
      localFields: { closedAt: new Date().toISOString() },
      action:"Task closed",
      detail:"Completion record generated by the server on close"
  })) return;
  notify("Task Closed","Manager", t.managerId, t.id, t.storeName+" closed", group);
  save(); closeModal(); go("task",{id:t.id});
  toast(netUp() ? "Closing — the completion record is generated by the server."
                : "Close queued. The completion record is issued when this device reconnects.");
}
function doReject(id){
  const t = taskById(id); if(!t) return;
  const el = $("#rev_remarks");
  const remarks = el ? el.value.trim() : "";
  const f = $("#f_rev");
  if(!remarks){
    if(f) f.classList.add("bad");
    if(el) el.focus();
    toast("Rejection remarks are required.", true);
    return;
  }
  if(f) f.classList.remove("bad");
  const group = uuid4();
  if(!transition(t, S.REWORK, {
      group: group,
      patch: { review_remarks: remarks },
      localFields: { reviewRemarks: remarks },
      action:"Rework required", detail:remarks })) return;
  notify("Rework Required","Merchandiser", t.assigneeId, t.id, t.storeName+" was returned for rework", group);
  save(); go("approvals",{});
  toast("Task returned for rework.");
}

/* ============================================================================
   FIELD LANGUAGE
   ----------------------------------------------------------------------------
   Everything a merchandiser reads goes through here. Tier letters, capture
   modes, focal sources, standoff tolerances, geofence radii and per-axis angle
   errors are all still recorded — `placement`, `TIER_META` and the capture
   pipeline are untouched — they are simply not shown to the person holding the
   phone. That vocabulary exists for the manager's review screen and for the
   audit trail, and it is useless to someone standing in a shop.
   ============================================================================ */

/* What the field sees instead of a status enum. */
function fieldStatus(t){
  switch(t.status){
    case S.REWORK:    return { cls:"stop", text:"Needs fixing",   group:"now"  };
    case S.ASSIGNED:  return { cls:"go",   text:"Not started",    group:"now"  };
    case S.PROGRESS:  return t.submitting
                           ? { cls:"warn", text:"Sending",        group:"now"  }
                           : { cls:"warn", text:"In progress",    group:"now"  };
    case S.SUBMITTED: return { cls:"wait", text:"Sent for check", group:"wait" };
    case S.APPROVED:  return { cls:"ok",   text:"Approved",       group:"done" };
    case S.CLOSED:    return { cls:"ok",   text:"Finished",       group:"done" };
    default:          return { cls:"",     text:"Not ready yet",  group:"wait" };
  }
}
/* The one obvious next action, in the imperative. */
function fieldNext(t){
  switch(t.status){
    case S.ASSIGNED:  return { label:"Check in",  primary:true  };
    case S.REWORK:    return { label:"Fix it",    primary:true  };
    case S.PROGRESS:  return t.submitting
                           ? { label:"Open",      primary:false }
                           : { label:"Continue",  primary:true  };
    default:          return { label:"Open",      primary:false };
  }
}
/* A photo's verdict, in words a person can act on. Reads the recorded
   measurement; changes nothing about how it was measured. */
function fieldPhotoVerdict(im){
  const p = im && im.placement;
  if(p && p.pass)  return { cls:"ok",   text:"Photo accepted" };
  if(p && !p.pass) return { cls:"warn", text:"Not lined up — your manager will look" };
  return { cls:"", text:"Photo added" };
}

/* Placement verification read-out — used by the review panel and task detail. */
function placementBlock(p, t){
  if(!p){
    return '<div class="pverify"><div class="phd"><span class="tierbadge tier-unv">No guided capture</span></div>'
      + '<div style="font-size:12.5px;color:var(--text-2)">This submission was made with plain file upload or the '
      + 'simulator, so distance and squareness were never measured.</div></div>';
  }
  const tm = tierMeta(p.tier);
  const n1 = v => (v==null || !isFinite(v)) ? "—" : Number(v).toFixed(1);
  const n2 = v => (v==null || !isFinite(v)) ? "—" : Number(v).toFixed(2);
  // tolerances are often 0.75 / 0.05 — don't round them away
  const nt = v => (v==null || !isFinite(v)) ? "—" : String(+Number(v).toFixed(2));
  const tgt = p.targetFt != null ? p.targetFt : (t ? t.standoffFt : STANDOFF_FT);
  const delta = (p.distanceFt!=null && tgt!=null) ? (p.distanceFt - tgt) : null;
  const row = function(label, value, ok, sub){
    return '<div class="prow"><span class="pl">'+esc(label)+(sub?' <span style="opacity:.65">'+esc(sub)+'</span>':'')+'</span>'
      + '<span><b>'+value+'</b> '
      + (ok===null ? '<span class="chip neutral plain" style="margin-left:6px">unverified</span>'
                   : '<span class="chip '+(ok?"pass":"fail")+'" style="margin-left:6px">'+(ok?"PASS":"FAIL")+'</span>')
      + '</span></div>';
  };
  return '<div class="pverify '+(p.pass?"pass":"fail")+'">'
    + '<div class="phd"><span class="big">'+n2(p.distanceFt)+' ft</span>'
    +   '<span style="font-size:11.5px;opacity:.75">measured</span>'
    +   '<div style="flex:1"></div><span class="tierbadge '+tm.cls+'">'+esc(p.tierLabel||tm.label)+'</span></div>'
    + row("Standoff distance", n2(p.distanceFt)+' ft <span style="opacity:.6">vs '+nt(tgt)+' ± '+nt(p.tolFt)+'</span>',
          p.distanceOk, delta==null?"":"("+(delta>=0?"+":"")+delta.toFixed(2)+" ft)")
    + row("Tilt (pitch)",  n1(p.pitchDeg)+'°', p.pitchOk, "± "+nt(p.angleTolDeg)+"°")
    + row("Roll",          n1(p.rollDeg)+'°',  p.rollOk,  "± "+nt(p.angleTolDeg)+"°")
    + row("Yaw (obliqueness)", p.yawVerified ? n1(p.yawDeg)+'°' : '<span style="opacity:.6">not measured</span>',
          p.yawVerified ? p.yawOk : null, "± "+nt(p.angleTolDeg)+"°")
    + '<div class="prow"><span class="pl">Photo provenance</span><span>'
    +   (p.captureMode === "single-frame"
        ? '<span class="chip pass">SAME FRAME AS THE MEASUREMENT</span>'
        : p.captureMode === "handover"
          ? '<span class="chip neutral">measured, then re-opened the camera</span>'
          : '<span class="chip neutral">'+esc(p.captureMode || "—")+'</span>')
    + '</span></div>'
    + '<div class="prow" style="border-top:1px solid rgba(128,128,128,.22);margin-top:6px;padding-top:8px">'
    +   '<span class="pl">Verification</span>'
    +   '<span><span class="chip '+(p.pass?"pass":"fail")+'">'+(p.pass?"ALL GATES PASSED":"GATES NOT MET")+'</span></span></div>'
    + '<div style="font-size:11.5px;color:var(--text-2);margin-top:8px;line-height:1.5">'
    +   '<span class="mono">distance:</span> '+esc(p.distanceSource||"—")+'<br>'
    +   '<span class="mono">focal:</span> '+esc(p.focalSource||"—")+(p.focalPx?(' · '+Math.round(p.focalPx)+' px'):'')
    +   '<br><span class="mono">photo:</span> '+esc(CAPTURE_MODES[p.captureMode] || p.captureMode || "—")
    +   (p.cameraImage
        ? '<br><span class="mono">camera image:</span> '+p.cameraImage.w+'×'+p.cameraImage.h
          + (p.cameraImage.readbackMs != null ? ' · readback '+p.cameraImage.readbackMs+' ms' : '')
          + (p.cameraImage.path ? ' · '+esc(p.cameraImage.path) : '')
        : '')
    +   (p.note ? '<br><span style="color:var(--st-rework)">'+esc(p.note)+'</span>' : '')
    + '</div></div>';
}

/* ============================================================================
   THE FIELD SEQUENCE — the merchandiser's task detail.
   ----------------------------------------------------------------------------
   The old screen was one long scroll that showed every field at once: store
   record, capture brief with standoff tolerances, BEFORE reference, check-in
   block, upload block, remarks, submitted images and the full audit trail —
   roughly nine cards deep on a 375px phone. A merchandiser has exactly one
   question at a time, so this is four screens with one decision on each:

       You're here  ->  Check in  ->  Photo  ->  Submit

   Everything that matters only sometimes — the manager's written instructions,
   the poster dimensions, what has happened so far — is behind a disclosure.
   Nothing about capture internals is shown at all; the measurement is still
   taken and still recorded, it is simply not this person's problem.
   ============================================================================ */
const FIELD_STEPS = [
  { k:"here",  label:"Job"      },
  { k:"check", label:"Check in" },
  { k:"shoot", label:"Photo"    },
  { k:"send",  label:"Submit"   }
];
/* Which step the user has clicked to, per task. Session-only and deliberately
   NOT persisted: it is a scroll position, not a fact about the work. The
   signature drops the override the moment the underlying work moves on, so
   finishing a step advances the sequence by itself. */
const fieldStep = {};

/* The signature is deliberately COARSE: only a real lifecycle move (a status
   change, a check-in, a submission starting) invalidates where the user is
   standing. Adding or removing a photo must not: someone who has just taken
   one shot is usually about to take another, and being thrown onto a different
   screen mid-task is exactly the kind of thing that made the old build feel
   complicated. */
function fieldStepSig(t){
  return [t.status, t.checkIn?1:0, t.submitting?1:0].join("|");
}
function fieldDone(t){
  const w = ws(t.id);
  const open = (t.status === S.ASSIGNED || t.status === S.REWORK);
  return {
    here:  true,
    check: !open,
    shoot: !open && (w.after.length > 0 || t.afterImages.length > 0),
    send:  [S.SUBMITTED, S.APPROVED, S.CLOSED].indexOf(t.status) >= 0
  };
}
function fieldStepEnabled(t, i){
  const done = fieldDone(t);
  for(let j = 0; j < i; j++){ if(!done[FIELD_STEPS[j].k]) return false; }
  return true;
}
function fieldStepIndex(t){
  const rec = fieldStep[t.id];
  if(rec && rec.sig === fieldStepSig(t) && fieldStepEnabled(t, rec.step)) return rec.step;
  delete fieldStep[t.id];
  /* A job that has not been started yet opens on "You're here": confirming the
     shop and seeing what goes up is the first decision, before check-in.
     A job sent back for a fix opens there too, so the reason is read first.
     Once the visit is under way, land on whatever is still outstanding. */
  let derived = FIELD_STEPS.length - 1;
  if(t.status === S.ASSIGNED || t.status === S.REWORK){
    derived = 0;
  }else{
    const done = fieldDone(t);
    for(let i = 0; i < FIELD_STEPS.length; i++){
      if(!done[FIELD_STEPS[i].k]){ derived = i; break; }
    }
  }
  /* Remember it, so the sequence holds still until the work actually moves. */
  fieldStep[t.id] = { step: derived, sig: fieldStepSig(t) };
  return derived;
}
function fieldRail(t, cur){
  const done = fieldDone(t);
  return '<div class="seqrail">' + FIELD_STEPS.map(function(s, i){
    const on   = (i === cur);
    const fin  = done[s.k] && !on;
    const open = fieldStepEnabled(t, i);
    return '<button class="sq'+(on?" on":"")+(fin?" done":"")+'"'
      + (open ? '' : ' disabled')
      + ' data-act="fstep" data-id="'+t.id+'" data-s="'+i+'"'
      + ' aria-label="Step '+(i+1)+', '+esc(s.label)+'">'
      + '<i>'+(fin ? icon("check") : (i+1))+'</i><span>'+esc(s.label)+'</span></button>';
  }).join("") + '</div>';
}
/* Honest about what is still sitting on this phone, in words that do not
   assume you know what an outbox is. */
function fieldSyncBanner(t){
  const s = taskSync(t);
  if(!s) return "";
  const detail = s.kind === "failed"
    ? "The server refused part of this job. Nothing is lost — show this to your manager."
    : s.kind === "submitting"
      ? "Your photos are still going up from this phone. You can close the app; it carries on by itself."
      : "Some of your work is still on this phone. It will send itself as soon as you have signal.";
  return '<div class="readonly-note"'
    + (s.kind === "failed" ? ' style="background:var(--st-rework-bg);color:var(--st-rework)"' : '')
    + '><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
    + '<b>'+esc(s.label)+'</b>'
    + '<span style="flex:1;min-width:170px">'+esc(detail)+'</span>'
    + '<button class="btn sm" data-act="syncpanel">Details</button></div></div>';
}
function fieldReworkBanner(t){
  if(t.status !== S.REWORK || !t.reviewRemarks) return "";
  return '<div class="banner"><div class="bt">Sent back — please fix</div>'
    + '<div class="bb">'+esc(t.reviewRemarks)+'</div>'
    + '<div class="bb" style="color:var(--text-2);font-size:12.5px;margin-top:5px">'
    +   'From '+esc(userById(t.managerId).name)+'</div></div>';
}
/* The history, stripped of the machine detail. The full audit trail with GPS,
   device strings and per-event detail is still written and still shown on the
   manager's screen; the field gets "who did what, when". */
function fieldHistory(t){
  const evs = t.audit.slice().sort(function(a,b){ return new Date(a.ts) - new Date(b.ts); });
  if(!evs.length) return '<div class="dbd">Nothing yet.</div>';
  return '<div class="dbd"><div class="tl">' + evs.map(function(a, i){
      const unsent = !!(a.pending && Outbox.has(a.opId));
      return '<div class="ev '+(i === evs.length-1 ? "hi" : "")+'">'
        + '<div class="a">'+esc(a.action)
        + (unsent ? ' <span class="chip queued" style="font-size:10.5px;padding:1px 7px">still on this phone</span>' : '')
        + '</div>'
        + '<div class="m">'+esc(a.actor)+' · '+esc(fmtDT(a.ts))+'</div>'
        + '</div>';
    }).join("") + '</div></div>';
}
/* Instructions, dimensions and history: needed sometimes, not every time. */
function fieldExtras(t){
  const stand = Number(t.standoffFt);
  const paces = isFinite(stand) ? Math.max(1, Math.round(stand / 2.5)) : 3;
  let h = '';
  if(t.instructions){
    h += '<details class="disc"><summary>'+icon("info")+'What your manager asked for</summary>'
      + '<div class="dbd">'+esc(t.instructions)+'</div></details>';
  }
  h += '<details class="disc"><summary>'+icon("poster")+'Size, and where to stand</summary>'
    + '<div class="dbd">The poster is <b class="num">'+t.widthFt+' ft × '+t.heightFt+' ft</b>, going on the '
    + esc(t.displayType)+'.<br><br>'
    + 'When you take the photo, stand about <b class="num">'+(isFinite(stand)?stand.toFixed(0):"8")+' feet</b> back '
    + '(roughly '+paces+' big steps) and hold the phone straight. The camera screen tells you when you are '
    + 'in the right spot — you do not need to measure anything yourself.'
    + '</div></details>';
  h += '<details class="disc"><summary>'+icon("clock")+'What has happened so far</summary>'
    + fieldHistory(t) + '</details>';
  return h;

/* ---------- step 2: check in ---------- */
function fieldViewCheck(t){

      + '</div>'

    body += '<div class="geobox" style="margin-bottom:12px;font-size:13.5px;line-height:1.55">'
      + 'Tap <b>Find me</b> and your phone will confirm you are at the shop. It takes a few seconds.'

  /* Once the position is good enough, "try again" stops being worth a slot in

  if(ready) body += '<div style="margin:0 0 12px">'+find+'</div>';

  body += '<details class="disc"><summary>'+icon("info")+'Location not working?</summary>'

function fieldPhotoGrid(t, shots, editable){

    const v = fieldPhotoVerdict(im);

function fieldViewSend(t){
  const w = ws(t.id);
  const back = '<button class="btn back" data-act="fstep" data-id="'+t.id+'" data-s="2" aria-label="Back">'+icon("back")+'</button>';

  /* Already gone in, one way or another. */
  if(t.status === S.SUBMITTED || t.status === S.APPROVED || t.status === S.CLOSED){
    let body = '<h2 class="steptitle">'+(t.status === S.SUBMITTED ? "Sent" : "Finished")+'</h2>';
    if(t.status === S.SUBMITTED){
      body += '<div class="outcome wait"><div class="ot">With your manager</div>'
        + '<div class="ob">Sent '+esc(fmtDT(t.submittedAt))+'. Nothing more to do — you will get an update '
        + 'when it is approved, or if something needs fixing.</div></div>';
    } else if(t.status === S.APPROVED){
      body += '<div class="outcome ok"><div class="ot">Approved</div>'
        + '<div class="ob">'+esc(userById(t.managerId).name)+' approved this on '+esc(fmtDT(t.approvedAt))+'.</div></div>';
    } else {
      body += '<div class="outcome ok"><div class="ot">Job closed</div>'
        + '<div class="ob">Reference <span class="mono">'+esc(t.completionRef)+'</span>'
        + (t.closedAt ? ' · '+esc(fmtDT(t.closedAt)) : '')+'.</div></div>';
    }
    body += fieldPhotoGrid(t, t.afterImages, false);
    if(t.merchRemarks){
      body += '<div class="card" style="margin-bottom:10px"><div class="hd"><h3>What you wrote</h3></div>'
        + '<div class="bd" style="font-size:13.5px;color:var(--text-2)">'+esc(t.merchRemarks)+'</div></div>';
    }
    body += '<details class="disc"><summary>'+icon("clock")+'What has happened so far</summary>'+fieldHistory(t)+'</details>';
    return { body: body,
      actions: back + '<button class="btn primary" data-act="nav" data-v="mytasks">Back to my jobs</button>' };
  }

  /* Draining. Deliberately read-only: pulling an image out from under an
     upload that is already queued would destroy the bytes the queue is about
     to send. */
  if(t.submitting){
    const left = Outbox.groupPending(t.submitting.group);
    let body = '<h2 class="steptitle">Sending</h2>'
      + '<div class="readonly-note"><b>Not sent yet.</b> Your '
      +   t.submitting.bytes + ' photo upload' + (t.submitting.bytes === 1 ? '' : 's')
      +   ' and the status change are still on this phone'
      +   (netUp() ? '' : ' — and this phone has no signal right now') + '. '
      +   (left ? 'About <b class="num">'+left+'</b> step'+(left===1?'':'s')+' left. ' : 'Finishing the last step. ')
      +   'It is safe to close the app: it picks up where it left off.'
      + '</div>'
      + fieldPhotoGrid(t, w.after, false);
    if(w.remarks){
      body += '<div class="card" style="margin-bottom:10px"><div class="hd"><h3>What you wrote</h3></div>'
        + '<div class="bd" style="font-size:13.5px;color:var(--text-2)">'+esc(w.remarks)+'</div></div>';
    }
    return { body: body,
      actions: back
        + '<button class="btn" data-act="syncpanel">See what is left</button>'
        + (netUp() ? '<button class="btn primary" data-act="syncnow">Try now</button>' : '') };
  }

  const n = w.after.length;
  let body = '<h2 class="steptitle">Send it in</h2>'
    + '<p class="stepsub">Your manager checks the photo and either approves it or asks for a fix.</p>';

  body += '<div class="field" id="f_after">'
    + (n
        ? '<div class="outcome ok" style="margin-bottom:10px"><div class="ot">'
          + n + ' photo' + (n === 1 ? '' : 's') + ' ready</div>'
          + '<div class="ob">Taken at this shop and held on this phone until you send.</div></div>'
          + fieldPhotoGrid(t, w.after, false)
        : '<div class="outcome fix" style="margin-bottom:10px"><div class="ot">No photo yet</div>'
          + '<div class="ob">Go back a step and photograph the finished display.</div></div>')
    + '<div class="err">You need at least one photo before you can send this.</div></div>';

  body += '<div class="field" id="f_remarks"><label class="fl" for="m_remarks">Anything to say about this job?'
    + ' <span class="req">*</span></label>'
    + '<textarea id="m_remarks" placeholder="What you put up, anything that was different, and who at the shop signed off.">'
    + esc(w.remarks)+'</textarea>'
    + '<div class="err">Write a short note before you send.</div></div>';

  body += '<div class="stepnote">Sending records your name, your check-in location, the time, and the phone you '
    + 'used. If you have no signal it waits on the phone and goes as soon as you do.</div>';

  return { body: body,
    actions: back + '<button class="btn primary" data-act="submitexec" data-id="'+t.id+'">'+icon("check")+'Send to manager</button>' };
}

function merchTaskDetail(t){
  const cur  = fieldStepIndex(t);
  const step = [fieldViewHere, fieldViewCheck, fieldViewShoot, fieldViewSend][cur](t);

  return fieldReworkBanner(t)
    + fieldSyncBanner(t)
    + fieldRail(t, cur)
    + step.body
    + '<div class="actionbar">' + step.actions + '</div>';
}

function bindTaskDetail(t){
  const rem = $("#m_remarks");
  if(rem) rem.addEventListener("input", function(){ ws(t.id).remarks = rem.value; });
  const af = $("#afterFile");
  if(af) af.addEventListener("change", function(){
    const files = Array.prototype.slice.call(af.files||[]);
    if(!files.length) return;
    let pending = files.length;
    files.forEach(function(f){
      const rd = new FileReader();
      rd.onload = function(){
        ws(t.id).after.push(makeAfterMeta(t, rd.result));
        if(--pending === 0){ render(); toast(files.length+" image"+(files.length>1?"s":"")+" attached."); }
      };
      rd.onerror = function(){ if(--pending===0) render(); toast("Could not read a file.", true); };
      rd.readAsDataURL(f);
    });
  });
  bindComparator();
}
/* Stage a capture ON THIS DEVICE.

   The JPEG goes straight into the durable local blob store, keyed by the exact
   Storage path it will eventually occupy. That one decision is what makes the
   whole offline story work with no change to any view: `resolveImg()` finds the
   local bytes and renders them now, and the moment the outbox uploads the
   object and drops the local copy, the same call starts returning a signed URL
   instead. The path itself carries a fresh UUID per capture, which is required
   by 0003_storage.sql (the evidence bucket has NO update policy, so upsert is
   impossible) and is also what makes a retried upload idempotent.

   Nothing is sent to the server here. An after-image exists server-side only
   once the task is actually submitted. */
function makeAfterMeta(t, src, extra){
  const g = (t.checkIn) || ws(t.id).geo || {lat:t.lat, lng:t.lng};
  const path = "tasks/" + t.id + "/after/" + uuid4() + ".jpg";
  const meta = Object.assign({
    id: uuid4(), kind: "after", bucket: "evidence",
    path: path, src: "sb:evidence:" + path,
    cleanPath: null, cleanSrc: null,
    ts: new Date().toISOString(), lat: g.lat, lng: g.lng,
    by: me().id, device: deviceString(),
    placement: null, placementId: null, guided: false, local: true,
    fb: "gen:" + t.storeCode + ":AFTER:" + ((t.afterImages.length + ws(t.id).after.length) % 3)
  }, extra || {});
  Blobs.put("evidence/" + meta.path, src);
  if(meta.cleanData){
    meta.cleanPath = "tasks/" + t.id + "/clean/" + uuid4() + ".jpg";
    meta.cleanSrc  = "sb:evidence:" + meta.cleanPath;
    Blobs.put("evidence/" + meta.cleanPath, meta.cleanData);
    delete meta.cleanData;
  }
  /* The measurement gets its id here too, so the task_images row can point at
     the placement row before either has left the device. */
  if(meta.placement && !meta.placementId){
    meta.placementId = meta.placement.id || uuid4();
    meta.placement.id = meta.placementId;
  }
  save();
  return meta;
}
/* Best = highest verification tier, passing beats failing. */
function bestPlacement(images){
  let best = null;
  (images||[]).forEach(function(im){
    const p = im && im.placement; if(!p) return;
    if(!best) { best = p; return; }
    const a = tierMeta(p.tier).rank*2 + (p.pass?1:0);
    const b = tierMeta(best.tier).rank*2 + (best.pass?1:0);
    if(a > b) best = p;
  });
  return best;
}

/* ---------- check-in flow ---------- */
function doCheckIn(id){
  const t = taskById(id); if(!t) return;
  const w = ws(id);
  w.busy = true; render();
  let settled = false;
  const finish = function(res){
    if(settled) return; settled = true;
    w.busy = false; w.geo = res; render();
    if(res.error) toast(res.error, true);
    else if(res.distance > GEOFENCE_M) toast("Outside geofence — "+Math.round(res.distance)+" m from store.", true);
    else toast("Inside geofence — "+Math.round(res.distance)+" m from store.");
  };
  const bail = setTimeout(function(){
    finish({ error:"GPS timed out. Use “Simulate arriving at store” to continue the demo." });
  }, 6500);

  if(!navigator.geolocation){
    clearTimeout(bail);
    finish({ error:"This browser exposes no geolocation API. Use the simulated option." });
    return;
  }
  navigator.geolocation.getCurrentPosition(function(pos){
    clearTimeout(bail);
    const la = pos.coords.latitude, ln = pos.coords.longitude;
    finish({ lat:+la.toFixed(5), lng:+ln.toFixed(5), accuracy: pos.coords.accuracy || 20,
             distance: haversine(la,ln,t.lat,t.lng), source:"device", ts:new Date().toISOString() });
  }, function(err){
    clearTimeout(bail);
    // Denial / unavailable / file:// origin → simulated coordinate jittered near the store
    const sim = simCoord(t, 30 + Math.random()*90);
    finish({ lat:sim.lat, lng:sim.lng, accuracy:sim.accuracy, distance:sim.distance,
             source:"simulated", ts:new Date().toISOString(),
             note:"Device GPS unavailable ("+(err && err.message ? err.message : "denied")+") — simulated position used." });
  }, { enableHighAccuracy:true, timeout:6000, maximumAge:0 });
}
function simCoord(t, metres){
  const brg = Math.random()*Math.PI*2;
  const dLat = (metres*Math.cos(brg))/111320;
  const dLng = (metres*Math.sin(brg))/(111320*Math.cos(t.lat*Math.PI/180));
  const la = +(t.lat+dLat).toFixed(5), ln = +(t.lng+dLng).toFixed(5);
  return { lat:la, lng:ln, accuracy: Math.round(6+Math.random()*18), distance: haversine(la,ln,t.lat,t.lng) };
}
function doSimCheckIn(id){

                 source:"simulated", ts:new Date().toISOString() };

function doStartWork(id){

function doSimAfter(id){

/* SUBMISSION — the one place the app is deliberately NOT optimistic.

   The task stays In Progress, with a visible "queued" badge, until every byte
   of evidence has actually landed in Storage and the server has accepted the
   status change. Showing "Submitted" the instant the button is pressed would
   be a lie in exactly the situation this app exists for: a merchandiser in a
   basement with no signal, who then walks out believing the job is filed.

   ORDER IS LOAD-BEARING. The evidence policies in 0002_rls.sql and
   0003_storage.sql both require the task to still be OPEN (In Progress /
   Rework Required) for the caller. So the group is:
       bytes -> placements -> task_images rows -> status patch -> notifications
   If any step fails permanently the whole group is cancelled together, the
   task stays In Progress and the captures stay on the device — never a task
   marked Submitted with half its evidence missing. */
function doSubmitExec(id){
  const t = taskById(id); if(!t) return;
  const w = ws(id);
  const rem = $("#m_remarks"); if(rem) w.remarks = rem.value;
  if(t.submitting){ toast("This submission is already queued — it will finish on its own.", true); return; }
  let bad = 0;
  const fa = $("#f_after"), fr = $("#f_remarks");
  if(!w.after.length){ if(fa) fa.classList.add("bad"); bad++; } else if(fa) fa.classList.remove("bad");
  if(!w.remarks.trim()){ if(fr) fr.classList.add("bad"); bad++; } else if(fr) fr.classList.remove("bad");
  if(bad){ toast("Add at least one after image and your remarks.", true); return; }

  const group   = uuid4();
  const remarks = w.remarks.trim();
  const g  = t.checkIn ? {lat:t.checkIn.lat, lng:t.checkIn.lng} : null;
  const pl = bestPlacement(w.after.concat(t.afterImages));
  const plNote = pl
    ? " · placement " + (pl.pass ? "VERIFIED" : "NOT VERIFIED") + " (" + pl.tierLabel + ", "
      + Number(pl.distanceFt).toFixed(2) + " ft)"
    : " · placement UNVERIFIED (no guided capture)";

  let bytes = 0;
  w.after.forEach(function(im){
    Outbox.push("image.upload", { bucket:"evidence", path:im.path, contentType:"image/jpeg" },
      { group:group, taskId:t.id, blobKey:"evidence/"+im.path, label:"Upload evidence photo" });
    bytes++;
    if(im.cleanPath){
      Outbox.push("image.upload", { bucket:"evidence", path:im.cleanPath, contentType:"image/jpeg" },
        { group:group, taskId:t.id, blobKey:"evidence/"+im.cleanPath, label:"Upload un-stamped frame" });
      bytes++;
    }
  });
  w.after.forEach(function(im){
    if(im.placement && im.placementId){
      Outbox.push("placement.insert", { row: placementRow(im.placement, t.id, im.placementId) },
        { group:group, taskId:t.id, label:"Record placement measurement" });
    }
  });
  w.after.forEach(function(im){
    Outbox.push("image.insert", { row: imageRow(im, t.id) },
      { group:group, taskId:t.id, label:"Attach evidence photo" });
  });

  t.merchRemarks = remarks;
  t.submitting = { group:group, images:w.after.length, bytes:bytes, at:new Date().toISOString() };

  if(!transition(t, S.SUBMITTED, {
    group: group,
    optimistic: false,                       // status flips only on server confirmation
    patch: { merch_remarks: remarks },
    action:"Execution submitted",
    detail: w.after.length+" after image"+(w.after.length>1?"s":"")+" uploaded by "+me().name
            +" · device "+deviceString()+" · "+new Date().toISOString()+plNote,
    gps: g
  })){ t.submitting = null; return; }

  notify("Task Submitted","Manager", t.managerId, t.id,
    t.storeName+" ("+t.storeCode+") submitted by "+me().name, group);
  notify("Approval Required","Manager", t.managerId, t.id,
    "Approval required for "+t.storeName+" · "+t.displayType, group);
  save(); render();
  toast(netUp()
    ? "Submitting — uploading " + bytes + " image" + (bytes===1?"":"s") + "…"
    : "No connection. Submission is queued on this device and will upload automatically.");
}
function doRemoveAfter(id, i){
  const t = taskById(id);
  /* Defence in depth: the UI hides this button during a submission, but the
     bytes behind it are already queued for upload, and deleting them would
     turn a recoverable retry into a permanent failure. */
  if(t && t.submitting){
    toast("This photo is already being uploaded and can no longer be removed.", true);
    return;
  }
  const w = ws(id);
  const im = w.after[i];
  if(im){
    if(im.path)      Blobs.del("evidence/" + im.path);
    if(im.cleanPath) Blobs.del("evidence/" + im.cleanPath);
  }
  w.after.splice(i,1); save(); render();
}
function doAssign(id){
  const t = taskById(id); if(!t) return;
  if(!t.beforeImage){ toast("Attach a BEFORE image before assigning.", true); return; }
  if(!t.assigneeId){ toast("This task has no merchandiser assigned. The server refuses to let a task leave Draft without one.", true); return; }
  const group = uuid4();
  if(!transition(t, S.ASSIGNED, {
    group: group,
    action:"Task assigned",
    detail:"Assigned to "+userById(t.assigneeId).name+" · execution "+fmtD(t.execDate)
  })) return;
  notify("Task Assigned","Merchandiser", t.assigneeId, t.id,
    t.storeName+" · "+t.displayType+" · due "+fmtD(t.execDate), group);

}

function arcCalibKey(){

/* Focal length in pixels, best source first. */
function arcResolveFocal(){
  const v = ARC.video;
  const vw = (v && v.videoWidth) ? v.videoWidth : 1280;
  try{
    const tr = ARC.stream && ARC.stream.getVideoTracks && ARC.stream.getVideoTracks()[0];
    if(tr){
      const st = tr.getSettings ? (tr.getSettings() || {}) : {};
      const cp = tr.getCapabilities ? (tr.getCapabilities() || {}) : {};
      // None of these are standardised; read them defensively where a UA offers them.
      const fov = st.fieldOfView || cp.fieldOfView || st.horizontalFieldOfView || cp.horizontalFieldOfView;
      const fovN = (fov && typeof fov === "object") ? fov.max : fov;
      if(fovN && fovN > 20 && fovN < 160){
        return { f: GEO.focalFromFov(vw, fovN), src:"MediaStreamTrack field of view ("+Number(fovN).toFixed(0)+"°)", estimated:false };
      }
      if(st.focalLengthX && st.focalLengthX > 50){
        return { f: st.focalLengthX, src:"MediaStreamTrack focalLengthX", estimated:false };
      }
    }
  }catch(e){ /* capability probing is best-effort */ }
  const c = arcCalibGet();
  if(c && c.f > 0){
    const scaled = c.f * (vw / (c.vw || vw));
    return { f: scaled, src:"device calibration ("+c.refLabel+", "+fmtD(c.ts)+")", estimated:false };
  }
  return { f: GEO.focalFromFov(vw, ASSUMED_HFOV_DEG),
           src:"assumed "+ASSUMED_HFOV_DEG+"° HFOV (estimated)", estimated:true };
}
/* video-pixel <-> CSS-pixel mapping for object-fit:cover */
function arcMap(){
  const st = arcEl("arStage"), v = ARC.video;

  const vw = (v && v.videoWidth) ? v.videoWidth : cw;
  const vh = (v && v.videoHeight) ? v.videoHeight : ch;
  const s = Math.max(cw/vw, ch/vh);
  return { s:s, ox:(cw - vw*s)/2, oy:(ch - vh*s)/2, vw:vw, vh:vh, cw:cw, ch:ch };

const arcToCss = (m,p)=> [ m.ox + p[0]*m.s, m.oy + p[1]*m.s ];

function arcDrawTri(ctx, img, s, d){
  const A = [[s[0][0],s[0][1],1],[s[1][0],s[1][1],1],[s[2][0],s[2][1],1]];
  const sx = GEO.solveLinear(A, [d[0][0], d[1][0], d[2][0]]);
  const sy = GEO.solveLinear(A, [d[0][1], d[1][1], d[2][1]]);
  if(!sx || !sy) return;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(d[0][0], d[0][1]); ctx.lineTo(d[1][0], d[1][1]); ctx.lineTo(d[2][0], d[2][1]);
  ctx.closePath(); ctx.clip();
  ctx.transform(sx[0], sy[0], sx[1], sy[1], sx[2], sy[2]);
  ctx.drawImage(img, 0, 0);

function arcDrawQuadImage(ctx, img, q){
  const w = img.width, h = img.height;
  arcDrawTri(ctx, img, [[0,0],[w,0],[w,h]], [q[0],q[1],q[2]]);

/* border + corner ticks + caption chip, drawn in the same space as the quad */
function arcDrawQuadChrome(ctx, q, caption, accent){
  ctx.save();
  ctx.lineWidth = 2; ctx.strokeStyle = accent || "#2dd4bf"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(q[0][0],q[0][1]);
  for(let i=1;i<4;i++) ctx.lineTo(q[i][0],q[i][1]);
  ctx.closePath(); ctx.stroke();
  // corner ticks: 14% along each adjacent edge
  ctx.lineWidth = 4;
  for(let i=0;i<4;i++){
    const p = q[i], a = q[(i+3)%4], b = q[(i+1)%4];
    const lerp = (u,v,f)=>[u[0]+(v[0]-u[0])*f, u[1]+(v[1]-u[1])*f];
    ctx.beginPath();
    const pa = lerp(p,a,0.14), pb = lerp(p,b,0.14);
    ctx.moveTo(pa[0],pa[1]); ctx.lineTo(p[0],p[1]); ctx.lineTo(pb[0],pb[1]);
    ctx.stroke();
  }

    const cxm = (q[3][0]+q[2][0])/2, cym = (q[3][1]+q[2][1])/2;
    ctx.font = "700 13px ui-monospace, Menlo, monospace";
    const w = ctx.measureText(caption).width + 16;
    ctx.fillStyle = "rgba(4,10,18,.82)";
    ctx.fillRect(cxm - w/2, cym + 6, w, 24);
    ctx.fillStyle = accent || "#2dd4bf"; ctx.textAlign = "center"; ctx.textBaseline = "middle";

function arcPixelBuf(w, h){

/* Cheap statistics so an all-black or all-transparent readback — the classic
   silent failure of this API — is caught instead of shipped as evidence. */
function arcAnalysePixels(buf, w, h){
  const n = w*h;
  const step = Math.max(1, Math.floor(n/20000));
  let sum = 0, max = 0, aMin = 255, aMax = 0, nonZero = 0, samples = 0;
  for(let i=0; i<n; i += step){
    const o = i*4, r = buf[o], g = buf[o+1], b = buf[o+2], a = buf[o+3];
    const l = 0.299*r + 0.587*g + 0.114*b;
    sum += l; if(l > max) max = l;
    if(a < aMin) aMin = a; if(a > aMax) aMax = a;
    if(r||g||b) nonZero++;
    samples++;

    const o = i*4;
    first.push("["+buf[o]+","+buf[o+1]+","+buf[o+2]+","+buf[o+3]+"]");
  }
  return {
    firstPixels: first.join(" "), samples: samples,
    meanLuma: +(sum/Math.max(1,samples)).toFixed(2), maxLuma: +max.toFixed(1),
    alphaMin: aMin, alphaMax: aMax,
    allZero: nonZero === 0 && aMax === 0,

/* Shader blit fallback: sample the opaque texture into a texture we own, so the
   readback works even where attaching the camera texture directly is refused. */
function arcBlitInit(gl){
  if(ARC.xr.blit) return ARC.xr.blit;
  const mk = function(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error("shader: " + gl.getShaderInfoLog(s));
    return s;

    "attribute vec2 p; varying vec2 v; void main(){ v = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }");
  const fs = mk(gl.FRAGMENT_SHADER,
    "precision mediump float; uniform sampler2D s; varying vec2 v; void main(){ gl_FragColor = texture2D(s, v); }");
  const prog = gl.createProgram();

  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error("link: " + gl.getProgramInfoLog(prog));

  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

function arcReadTextureRGBA(gl, tex, w, h, d){

    }
  }catch(e){ /* not fatal */ }

  // --- path 1: attach the camera texture straight to a framebuffer we own ---
  try{
    if(!ARC.xr.readFB) ARC.xr.readFB = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, ARC.xr.readFB);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    d.fboStatus = status; d.fboStatusName = arcFbStatusName(gl, status);
    if(status === gl.FRAMEBUFFER_COMPLETE){
      while(gl.getError() !== gl.NO_ERROR){ /* drain */ }
      const b = arcPixelBuf(w, h);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, b);
      const err = gl.getError();
      d.readGlError = err === gl.NO_ERROR ? null : ("0x" + Number(err).toString(16));
      if(err === gl.NO_ERROR){ buf = b; d.readbackPath = "direct"; }
    }
    // never keep a reference to the opaque texture past this callback
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, null, 0);
  }catch(e){ arcDiagErr(d, "direct-readback", e); }

  // --- path 2: shader blit into a texture we own, then read that ---
  if(!buf){
    try{
      const bl = arcBlitInit(gl);
      if(bl.w !== w || bl.h !== h){
        if(bl.tex) gl.deleteTexture(bl.tex);
        if(bl.fb)  gl.deleteFramebuffer(bl.fb);
        bl.tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, bl.tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        bl.fb = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, bl.fb);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, bl.tex, 0);
        bl.w = w; bl.h = h;
      } else {
        gl.bindFramebuffer(gl.FRAMEBUFFER, bl.fb);
      }
      const st2 = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
      d.fboStatusName = (d.fboStatusName || "") + " → blit:" + arcFbStatusName(gl, st2);
      if(st2 === gl.FRAMEBUFFER_COMPLETE){
        const prevVp = gl.getParameter(gl.VIEWPORT);
        gl.viewport(0, 0, w, h);
        gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
        gl.disable(gl.SCISSOR_TEST); gl.disable(gl.CULL_FACE);
        gl.useProgram(bl.prog);
        gl.bindBuffer(gl.ARRAY_BUFFER, bl.buf);
        gl.enableVertexAttribArray(bl.loc);
        gl.vertexAttribPointer(bl.loc, 2, gl.FLOAT, false, 0, 0);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, tex);          // sampling an opaque texture IS allowed
        gl.uniform1i(bl.samp, 0);
        // identity in GL space: quad (-1,-1)..(1,1) maps to texcoord (0,0)..(1,1),
        // so the blit result has the same row order the direct path would give
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        gl.bindTexture(gl.TEXTURE_2D, null);
        while(gl.getError() !== gl.NO_ERROR){ /* drain */ }
        const b2 = arcPixelBuf(w, h);
        gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, b2);
        const err2 = gl.getError();
        d.readGlError = err2 === gl.NO_ERROR ? null : ("0x" + Number(err2).toString(16));
        if(err2 === gl.NO_ERROR){ buf = b2; d.readbackPath = "shader-blit"; }
        if(prevVp) gl.viewport(prevVp[0], prevVp[1], prevVp[2], prevVp[3]);
      }
    }catch(e){ arcDiagErr(d, "blit-readback", e); }
  }

  try{ gl.bindFramebuffer(gl.FRAMEBUFFER, restore); }catch(e){}
  d.readbackMs = +(arcNow() - t0).toFixed(1);
  d.readbackBytes = buf ? w*h*4 : 0;
  if(buf){
    const st = arcAnalysePixels(buf, w, h);
    d.firstPixels = st.firstPixels; d.meanLuma = st.meanLuma; d.maxLuma = st.maxLuma;
    d.alphaMin = st.alphaMin; d.alphaMax = st.alphaMax;
    d.allZero = st.allZero; d.allBlack = st.allBlack;
  }
  return buf;
}
/* Full inline pipeline: opaque texture -> flipped, opaque canvas. */
function arcCameraImageToCanvas(gl, tex, w, h, d){
  const buf = arcReadTextureRGBA(gl, tex, w, h, d);
  if(!buf) return null;
  if(d.allZero || d.allBlack){
    d.notes.push("Readback succeeded but the image is black (mean luma "+d.meanLuma+
                 ") — treating it as a failure rather than storing a black photo.");
    return null;
  }
  const flipped = GEO.flipRowsRGBA(buf, w, h, true);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").putImageData(new ImageData(flipped, w, h), 0, 0);
  return c;
}

/* ---------- capability probe ---------- */
function arcProbe(){
  const out = { secure: window.isSecureContext !== false, media:false, xr:false, ori:false, oriGate:false };
  out.media = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  out.ori = typeof window.DeviceOrientationEvent !== "undefined";
  out.oriGate = out.ori && typeof window.DeviceOrientationEvent.requestPermission === "function";
  return new Promise(function(res){
    if(!out.secure || !navigator.xr || !navigator.xr.isSessionSupported){ res(out); return; }
    let settled = false;
    const t = setTimeout(function(){ if(!settled){ settled = true; res(out); } }, 2500);
    try{
      navigator.xr.isSessionSupported("immersive-ar").then(function(ok){
        if(settled) return; settled = true; clearTimeout(t); out.xr = !!ok; res(out);
      }, function(){ if(settled) return; settled = true; clearTimeout(t); res(out); });
    }catch(e){ clearTimeout(t); res(out); }
  });
}

/* ---------- sensors ---------- */
function arcStopSensors(){
  const s = ARC.sensors;
  if(s.onOri){
    window.removeEventListener("deviceorientationabsolute", s.onOri);
    window.removeEventListener("deviceorientation", s.onOri);
    s.onOri = null;
  }
  if(s.onMot){ window.removeEventListener("devicemotion", s.onMot); s.onMot = null; }
  s.on = false; s.src = "none"; s.pitchDeg = null; s.rollDeg = null;
}
function arcScreenAngle(){
  try{
    if(screen && screen.orientation && typeof screen.orientation.angle === "number") return screen.orientation.angle;
  }catch(e){}
  return (typeof window.orientation === "number") ? window.orientation : 0;
}
function arcStartSensors(){
  const s = ARC.sensors;
  return new Promise(function(res){
    if(typeof window.DeviceOrientationEvent === "undefined" &&
       typeof window.DeviceMotionEvent === "undefined"){
      res({ ok:false, why:"This browser exposes no motion or orientation sensors. Tilt and roll cannot be verified here." });
      return;
    }
    const attach = function(){
      let gotOri = false;
      s.onOri = function(e){
        if(e.alpha == null && e.beta == null && e.gamma == null) return;
        gotOri = true;
        s.alpha = e.alpha; s.beta = e.beta; s.gamma = e.gamma;
        const a = GEO.attitudeFromOrientation(e.alpha, e.beta, e.gamma, arcScreenAngle());
        s.pitchDeg = a.pitchDeg; s.rollDeg = a.rollDeg;
        s.on = true;
        s.src = e.absolute ? "deviceorientationabsolute" : "deviceorientation";
      };
      try{ window.addEventListener("deviceorientationabsolute", s.onOri, true); }catch(e){}
      try{ window.addEventListener("deviceorientation", s.onOri, true); }catch(e){}
      // gravity fallback if no orientation events arrive
      s.onMot = function(e){
        if(gotOri) return;
        const g = e.accelerationIncludingGravity;
        if(!g || (g.x == null && g.y == null && g.z == null)) return;
        const a = GEO.attitudeFromAccel(g.x, g.y, g.z, arcScreenAngle());
        s.pitchDeg = a.pitchDeg; s.rollDeg = a.rollDeg;
        s.on = true; s.src = "devicemotion gravity vector";
      };
      try{ window.addEventListener("devicemotion", s.onMot, true); }catch(e){}
      setTimeout(function(){
        if(s.on) res({ ok:true });
        else res({ ok:false, why:"Motion sensors are present but sent no readings. On a desktop machine there is usually no accelerometer at all." });
      }, 900);
    };
    const gate = window.DeviceOrientationEvent && typeof window.DeviceOrientationEvent.requestPermission === "function";
    if(gate){
      try{
        window.DeviceOrientationEvent.requestPermission().then(function(r){
          if(r !== "granted"){ res({ ok:false, why:"Motion access was denied. iOS only asks once per page load — reload and tap “Enable motion sensors” again." }); return; }
          if(window.DeviceMotionEvent && typeof window.DeviceMotionEvent.requestPermission === "function"){
            window.DeviceMotionEvent.requestPermission().then(attach, attach);
          } else attach();
        }, function(err){
          res({ ok:false, why:"Motion permission request failed ("+((err&&err.message)||"unknown")+"). It must be triggered by a tap on a secure origin." });
        });
      }catch(e){
        res({ ok:false, why:"Motion permission request threw: "+(e && e.message ? e.message : "unknown")+"." });
      }
    } else attach();
  });
}

/* ---------- open / close ---------- */
function arcOpen(taskId){
  const t = taskById(taskId);
  if(!t){ toast("Task not found.", true); return; }
  ARC.task = t; ARC.open = true; ARC.tier = null; ARC.armed = false; ARC.armT0 = 0;
  ARC.nudge = {x:0, y:0}; ARC.capture = null; ARC.busy = false;
  ARC.meas = { distFt:null, yawDeg:null, yawVerified:false, distSrc:"", depthUsed:false, wallSeen:false };
  ARC.mode = "two"; ARC.handles = []; ARC.quad = [];
  ARC.refPreset = "a4"; ARC.refWmm = 210; ARC.refHmm = 0;
  ARC.assumeLevel = false; ARC.pendingCalib = false;
  ARC.xr.focalPx = null; ARC.xr.vpW = 0; ARC.xr.vpH = 0;
  ARC.xr.pendingShot = null; ARC.xr.cam = null; ARC.xr.camIntr = null;
  ARC.xr.camAccess = false; ARC.xr.binding = null; ARC.xr.aspectWarned = false;
  ARC.diag = null;

  const layer = arcEl("arlayer");
  layer.innerHTML = arcShell(t);
  layer.classList.add("on");
  layer.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
  ARC.video = arcEl("arVideo");
  ARC.canvas = arcEl("arCanvas");
  ARC.ctx = ARC.canvas.getContext("2d");
  arcBindStage();

  arcLoadImage(t.posterArt && t.posterArt.src).then(function(im){ ARC.posterImg = im; },
    function(){ ARC.posterImg = null; toast("Poster artwork could not be decoded — the overlay will draw an outline only.", true); });

  arcProbe().then(arcStartPanel);
}
function arcClose(){
  ARC.open = false;
  if(ARC.raf){ cancelAnimationFrame(ARC.raf); ARC.raf = 0; }
  arcStopSensors();
  arcStopCamera();
  if(ARC.xr.session){ try{ ARC.xr.session.end(); }catch(e){} }
  ARC.xr.session = null; ARC.xr.hitSource = null;
  ARC.xr.binding = null; ARC.xr.pendingShot = null; ARC.xr.cam = null; ARC.xr.camIntr = null;
  // release the GL objects we own before dropping the context
  const gl0 = ARC.xr.gl;
  if(gl0){
    try{
      if(ARC.xr.readFB) gl0.deleteFramebuffer(ARC.xr.readFB);
      const bl = ARC.xr.blit;
      if(bl){
        if(bl.tex) gl0.deleteTexture(bl.tex);
        if(bl.fb) gl0.deleteFramebuffer(bl.fb);
        if(bl.buf) gl0.deleteBuffer(bl.buf);
        if(bl.prog) gl0.deleteProgram(bl.prog);
      }
    }catch(e){}
  }
  ARC.xr.readFB = null; ARC.xr.blit = null; ARC.xr.pixelBuf = null; ARC.xr.aspectWarned = false;
  if(ARC.xr.glCanvas && ARC.xr.glCanvas.parentNode) ARC.xr.glCanvas.parentNode.removeChild(ARC.xr.glCanvas);
  ARC.xr.glCanvas = null; ARC.xr.gl = null;
  const layer = arcEl("arlayer");
  layer.classList.remove("on"); layer.innerHTML = "";
  layer.setAttribute("aria-hidden","true");
  document.body.style.overflow = "";
  ARC.video = null; ARC.canvas = null; ARC.ctx = null;
}
function arcStopCamera(){
  try{
    if(ARC.stream) ARC.stream.getTracks().forEach(function(tr){ try{ tr.stop(); }catch(e){} });
  }catch(e){}
  ARC.stream = null;
  if(ARC.video){ try{ ARC.video.srcObject = null; }catch(e){} }
}

/* ---------- Tier B: camera ---------- */
function arcTierB(){
  const t = ARC.task;
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    arcErrorPanel("No camera API",
      "This browser does not expose <span class=\"mono\">navigator.mediaDevices.getUserMedia</span>. "
      + "Use manual entry, or open the page on a phone over https.", null);
    return;
  }
  ARC.tier = "B";
  arcPanel('<h2>Starting the camera…</h2><p>If the browser asks, allow camera access. '
    + 'The rear camera is requested first and falls back to any available camera.</p>');
  const attempt = function(constraints){
    return navigator.mediaDevices.getUserMedia(constraints);
  };
  attempt({ video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1280 }, height:{ ideal:720 } }, audio:false })
    .catch(function(){ return attempt({ video:true, audio:false }); })
    .then(function(stream){
      ARC.stream = stream;
      ARC.video.srcObject = stream;
      const play = ARC.video.play();
      if(play && play.catch) play.catch(function(){});
      return new Promise(function(res, rej){
        let n = 0;
        const wait = function(){
          if(!ARC.open) return rej(new Error("cancelled"));
          if(ARC.video && ARC.video.videoWidth > 0) return res();
          // no dimensions means no frames — never fall through, or every pixel
          // measurement below would be scaled off a guessed resolution
          if(++n > 100) return rej(Object.assign(new Error("no frames"), { name:"NoFrameError" }));
          setTimeout(wait, 60);
        };
        wait();
      });
    })
    .then(function(){
      ARC.focal = arcResolveFocal();
      arcPanel(null);
      ARC.mode = "two";
      arcResetHandles();
      arcStartSensors().then(function(r){
        if(!r.ok) toast("Tilt/roll unavailable — " + r.why, true);
      });
      arcLoop();
      if(ARC.pendingCalib){ ARC.pendingCalib = false; arcCalibPanel(); }
    })
    .catch(function(err){
      const name = (err && err.name) || "";
      let msg;
      if(name === "NotAllowedError" || name === "SecurityError"){
        msg = "Camera permission was denied. Open the site settings for this origin and allow the camera, then try again. "
            + "On iOS the prompt only appears on an <span class=\"mono\">https</span> origin.";
      } else if(name === "NotFoundError" || name === "OverconstrainedError"){
        msg = "No usable camera was found on this device.";
      } else if(name === "NotReadableError"){
        msg = "The camera is busy — another tab or app is holding it. Close that and try again.";
      } else if(name === "NoFrameError"){
        msg = "The camera opened but never delivered a frame, so its resolution is unknown and nothing can be "
            + "measured from it. This usually means the tab is in the background — bring it to the front and retry.";
      } else if(err && err.message === "cancelled"){
        return;   // the layer was closed while we were waiting
      } else {
        msg = "The camera could not be started (<span class=\"mono\">"+esc(name || "unknown error")+"</span>).";
      }
      arcErrorPanel("Camera unavailable", msg, "tierB");
    });
}

function arcResetHandles(){

  const w = st ? st.clientWidth : 360, h = st ? st.clientHeight : 640;
  if(ARC.mode === "quad"){
    ARC.handles = [ [w*0.30,h*0.34], [w*0.70,h*0.34], [w*0.70,h*0.62], [w*0.30,h*0.62] ];

    ARC.handles = [ [w*0.30,h*0.48], [w*0.70,h*0.48] ];
