     throwing and taking the whole suite down with it. */
  const t0 = (state && state.tasks && state.tasks[0])
    || normalizeTask({ campaignId: null, taskCode: "SELFTEST", status: S.DRAFT });
  T("seeded task carries a standoff target", t0.standoffFt > 0, true);
  T("seeded task carries poster dimensions", t0.widthFt > 0 && t0.heightFt > 0, true);
  T("blankPlacement is a failing record", blankPlacement().pass, false);
  T("placementVerified accepts a calibrated 2-handle pass too",
    placementVerified({ pass:true, tier:"B" }), true);
  T("placementAR keeps AR separable from verification",
    placementAR({ tier:"Bq" }) === false && placementAR({ tier:"A" }) === true, true);
  T("AR still outranks reference scale for bestPlacement",
    tierMeta("A").rank > tierMeta("Bq").rank, true);
  T("same-frame provenance stays AR-only",
    placementSingleFrame({ pass:true, tier:"Bq", captureMode:"single-frame" }), false);
  T("TIER_META is the single verification definition",
    Object.keys(TIER_META).filter(k => TIER_META[k].verified).sort().join(","),
    "A,Ad,As,Asd,B,Bq", 0, "mirrored by placements.is_verified in 0005_*.sql");
  T("placementVerified accepts Tier A passes",
    placementVerified({ pass:true, tier:"A" }), true);
  T("placementUnverified flags a missing record", placementUnverified(null), true);

  /* ==========================================================
     Reference-rectangle detector
     ----------------------------------------------------------
     Two kinds of assertion here. The cheap ones pin the primitives (ordering,
     convexity, area, the rectangularity residual, the error algebra) to values
     that can be checked by hand. The expensive ones render a rectangle at a
     KNOWN pose, run the whole detect → refine → homography → pose chain over
     the pixels, and assert that the distance and yaw that come back are the
     ones that went in. That end-to-end pair is the only thing that can catch a
     sign error or an off-by-one that every unit test would happily agree with.
     ========================================================== */
  (function detectorTests(){
    const sq = new Float64Array([90,70, 10,10, 10,70, 90,10]);   // scrambled
    const ord = new Float64Array(8);
    DET.orderQuad(sq, ord);
    T("orderQuad → TL,TR,BR,BL regardless of input winding",
      Array.prototype.join.call(ord, ","), "10,10,90,10,90,70,10,70", 0);
    T("quadArea of an 80×60 rectangle", DET.quadArea(ord), 4800, 1e-9);
    T("meanSide of an 80×60 rectangle", DET.meanSide(ord), 70, 1e-9);
    T("isConvex accepts a rectangle", DET.isConvex(ord), true);
    T("isConvex rejects a bow-tie",
      DET.isConvex(new Float64Array([10,10, 90,70, 90,10, 10,70])), false);
    T("isConvex rejects three collinear corners",
      DET.isConvex(new Float64Array([10,10, 50,10, 90,10, 50,70])), false);
    T("minSide picks the short edge", DET.minSide(ord), 60, 1e-9);

    /* --- rectangularity: the residual that survives perspective --- */
    const W = 640, H = 360, f = GEO.focalFromFov(W, ASSUMED_HFOV_DEG);
    const truth = GEO.posterQuad({ focalPx:f, cx:W/2, cy:H/2, distance:6,
                                   widthFt:4, heightFt:3, yawDeg:20, pitchDeg:6 });
    const flat = new Float64Array([truth[0][0],truth[0][1], truth[1][0],truth[1][1],
                                   truth[2][0],truth[2][1], truth[3][0],truth[3][1]]);
    const fitOK = DET.rectFit(flat, 4/3, f, W/2, H/2);
    T("rectFit: a true 4:3 rectangle has no orthogonality residual", fitOK.ortho, 0, 1e-9,
      "b1·b2 = 0 because they are columns of a rotation matrix");
    T("rectFit: …and no scale residual", fitOK.scale, 0, 1e-9, "|b1| = |b2|");
    const fitBad = DET.rectFit(flat, 3/4, f, W/2, H/2);
    T("rectFit: the WRONG aspect ratio does not fit", fitBad.scale > 0.3, true,
      null, "this is what resolves portrait vs landscape");
    T("confidence prefers the correct aspect",
      DET.confidence({ ortho:fitOK.ortho, scale:fitOK.scale, areaFrac:0.2, support:0.9 })
        > DET.confidence({ ortho:fitBad.ortho, scale:fitBad.scale, areaFrac:0.2, support:0.9 }), true);
    T("confidence is dragged down by a vanishing rectangle",
      DET.confidence({ ortho:0, scale:0, areaFrac:0.001, support:1 }) < 0.9, true);
    T("confidence is dragged down by a poor edge fit",
      DET.confidence({ ortho:0, scale:0, areaFrac:0.2, support:1, rms:0.40 })
        < DET.confidence({ ortho:0, scale:0, areaFrac:0.2, support:1, rms:0.02 }), true,
      null, "a quad latched onto abutting clutter is still a rectangle — the line fit is what tells");
    T("an unrefined candidate is not penalised for having no residual yet",
      DET.confidence({ ortho:0, scale:0, areaFrac:0.2, support:1 }),
      DET.confidence({ ortho:0, scale:0, areaFrac:0.2, support:1, rms:0 }), 1e-12);
    T("confidence never exceeds 1",
      DET.confidence({ ortho:0, scale:0, areaFrac:0.2, support:1, rms:0 }) <= 1, true);

    /* --- contour following + polygon approximation, on a shape we drew --- */
    (function(){
      const bw = 40, bh = 30, bin = new Uint8Array(bw*bh), vis = new Uint8Array(bw*bh);
      for(let y=8; y<22; y++) for(let x=10; x<30; x++) bin[y*bw+x] = 1;   // 20×14 filled
      const pts = new Int32Array(4096);
      const cnt = DET.traceContour(bin, bw, bh, 10, 8, pts, 2048, vis);
      T("traceContour walks the whole border of a 20×14 block", cnt, 2*(20+14) - 4, 0,
        "perimeter pixels of a filled rectangle");
      const quad = new Float64Array(8), keep = new Uint8Array(4096), stack = new Int32Array(512);
      const ok = DET.dpQuad(pts, cnt, 2, keep, stack, quad);
      T("dpQuad reduces that border to exactly 4 vertices", ok, true);
      const q4 = new Float64Array(8);
      if(ok) DET.orderQuad(quad, q4);
      T("dpQuad lands on the true corners", ok ? DET.quadArea(q4) : NaN, 19*13, 1e-9,
        "the border runs through pixel centres, so the polygon is 19 × 13");
    })();

    /* --- workspace reuse: the allocation contract --- */
    (function(){
      const ws = new DET.Workspace();
      T("Workspace.fit allocates on first call", ws.fit(64, 64), true);
      T("Workspace.fit is a no-op at the same size", ws.fit(64, 64), false,
        null, "buffers are reused across passes; nothing is allocated per frame");
      T("Workspace.fit re-allocates when the size changes", ws.fit(96, 64), true);
      T("Workspace sizes the detect plane at half", ws.sw + "x" + ws.sh, "48x32", 0);
    })();

    /* --- the error budget, against hand-computed arithmetic ---
       focal 2 %, A4 short edge 210 ± 0.5 mm, σc 0.4 px over 200 px sides,
       reference half-way to the frame corner with k = 0.03:
         focal  = 0.0200000
         refDim = 0.5/210            = 0.00238095
         corner = 0.4/(√2·200)       = 0.00141421
         barrel = 0.03·0.5²          = 0.00750000
         total  = √(Σ squares)       = 0.02153877  ⇒ 2.1539 % */
    (function(){
      const e = DET.errorEstimate({ focalRelSigma:0.02, refMm:210, refTolMm:0.5,
        cornerSigmaPx:0.4, meanSidePx:200, radialNorm:0.5, barrelK:0.03 });
      T("errorEstimate: focal term", e.terms.focal, 0.02, 1e-12);
      T("errorEstimate: reference-dimension term", e.terms.refDim, 0.00238095, 1e-8, "0.5 mm / 210 mm");
      T("errorEstimate: corner term", e.terms.corner, 0.00141421, 1e-8, "σc / (√2·L̄)");
      T("errorEstimate: barrel term", e.terms.barrel, 0.0075, 1e-12, "k·r²");
      T("errorEstimate: quadrature total", e.pct, 2.1539, 1e-3, "hand-computed");
      const e0 = DET.errorEstimate({ focalRelSigma:0.02, refMm:210, refTolMm:0.5,
        cornerSigmaPx:0.4, meanSidePx:200, radialNorm:0, barrelK:0.03 });
      T("errorEstimate: centring the reference removes the barrel term", e0.terms.barrel, 0, 1e-12);
      T("errorEstimate: …and shrinks the total", e0.pct, 2.0191, 1e-3);
      const e2 = DET.errorEstimate({ focalRelSigma:0.02, refMm:210, refTolMm:0.5,
        cornerSigmaPx:0.4, meanSidePx:400, radialNorm:0, barrelK:0.03 });
      T("errorEstimate: a reference twice as big halves the corner term",
        e2.terms.corner, e0.terms.corner/2, 1e-12);
      const eEst = DET.errorEstimate({ focalRelSigma:FOCAL_SIGMA_ASSUMED, refMm:210, refTolMm:0.5,
        cornerSigmaPx:0.4, meanSidePx:200, radialNorm:0, barrelK:0.03 });
      T("errorEstimate: an assumed focal length dominates everything else",
        eEst.pct > 11.9 && eEst.pct < 12.3, true,
        null, eEst.pct.toFixed(2) + "% — which is exactly why tier Be is not verified");
      T("errorEstimate is never negative",
        DET.errorEstimate({ focalRelSigma:0, refMm:0, refTolMm:0, cornerSigmaPx:null,
                            meanSidePx:0, radialNorm:0 }).pct, 0, 1e-12);
    })();

    /* --- the [ref …] note tag survives a server round trip ---
       placements has no columns for this evidence yet, so the note IS the
       transport. If the writer and the reader ever disagree, a manager
       reviewing a synced capture silently loses the error bar. */
    (function(){
      const note = "Yaw obliqueness not verified. [ref poster 1219.2x914.4mm auto conf=0.987 "
        + "err=2.24% (focal 2 / dim 1 / corner 0.04 / barrel 0.01) r=0.034] "
        + "Distance was scaled from the INSTALLED POSTER's briefed size.";
      const p = refEvidenceFromNote(note, {});
      T("note tag round-trip: reference source", p.refSource, "poster", 0);
      T("note tag round-trip: reference size mm", p.refWmm + "x" + p.refHmm, "1219.2x914.4", 0);
      T("note tag round-trip: auto-detected flag", p.refAuto, true);
      T("note tag round-trip: confidence", p.refConfidence, 0.987, 1e-9);
      T("note tag round-trip: error percentage", p.errorPct, 2.24, 1e-9);
      T("note tag round-trip: error terms", p.errorTerms.focal + "/" + p.errorTerms.refDim
        + "/" + p.errorTerms.corner + "/" + p.errorTerms.barrel, "2/1/0.04/0.01", 0);
      T("note tag round-trip: radial offset", p.radialOffset, 0.034, 1e-9);
      T("note tag round-trip: a manual capture is not marked auto",
        refEvidenceFromNote("[ref a4q 210x297mm manual err=3.1% (focal 2 / dim 0.24 / corner 0.9 / barrel 0) r=0.1]", {}).refAuto,
        false);
      T("note tag round-trip: a note without the tag changes nothing",
        Object.keys(refEvidenceFromNote("just prose, no tag", {})).length, 0, 0);
      T("note tag round-trip: a null note is safe",
        Object.keys(refEvidenceFromNote(null, {})).length, 0, 0);
    })();

    /* --- arcQuad, the only way relative errors combine --- */
    T("arcQuad(3,4) is the Pythagorean 5", arcQuad(3, 4), 5, 1e-12);
    T("arcQuad ignores missing terms", arcQuad(0.02, 0, null), 0.02, 1e-12);

    /* --- reference tolerances --- */
    T("A4 quad tolerance is half a millimetre",
      arcRefTolMm(REF_PRESETS.filter(p=>p.key==="a4q")[0], 210), 0.5, 1e-9);
    T("the poster's tolerance is proportional to its size",
      arcRefTolMm(REF_PRESETS.filter(p=>p.key==="poster")[0], 914.4), 9.144, 1e-6,
      "3 ft printed to ±1 %");

    /* --- the degradation ladder --- */
    T("a low-end device starts further down the ladder than a fast one",
      arcDetProfile("low", 0).work < arcDetProfile("high", 0).work, true);
    T("degrading never raises the work resolution",
      arcDetProfile("mid", 1).work <= arcDetProfile("mid", 0).work, true);
    T("the ladder bottoms out instead of running off the end",
      arcDetProfile("low", 99).work, arcDetProfile("low", 4).work, 0);
    T("every rung is inside the frame budget's reach",
      arcDetProfile("low", 99).fps <= arcDetProfile("high", 0).fps, true);

    /* --- end to end: render a known pose, measure it back --- */
    (function(){
      const ws = new DET.Workspace();
      const WW = 640, HH = 360;
      ws.fit(WW, HH);
      const fw = GEO.focalFromFov(WW, ASSUMED_HFOV_DEG);
      const cases = [
        { name:"poster 4×3 ft square-on at 6 ft", wFt:4, hFt:3, distFt:6, yawDeg:0,  seed:11 },
        { name:"poster 4×3 ft at 6 ft, yaw 20°",  wFt:4, hFt:3, distFt:6, yawDeg:20, seed:12 },
        { name:"A4 sheet at 3 ft, yaw -15°",
          wFt:GEO.mToFt(0.210), hFt:GEO.mToFt(0.297), distFt:3, yawDeg:-15, seed:13 }
      ];
      const out = new Float64Array(8);
      cases.forEach(function(c){
        arcDetSynth(ws, { focalPx:fw, distFt:c.distFt, wFt:c.wFt, hFt:c.hFt,
                          yawDeg:c.yawDeg, noise:4, clutter:3, seed:c.seed });
        const asp = c.wFt/c.hFt;
        const r = DET.detect(ws, { aspect:asp, focalPx:fw, cx:WW/2, cy:HH/2 });
        if(!r || !r.quad){
          T("detector finds " + c.name, false, true, null, "no quad returned");
          return;
        }
        T("detector finds " + c.name, true, true);
        const rr = DET.refine(ws.luma, WW, HH, r.quad, out, ws, {});
        const dst = [[out[0],out[1]],[out[2],out[3]],[out[4],out[5]],[out[6],out[7]]];
        const mw = r.flipped ? c.hFt : c.wFt, mh = r.flipped ? c.wFt : c.hFt;
        const src = [[-mw/2,-mh/2],[mw/2,-mh/2],[mw/2,mh/2],[-mw/2,mh/2]];
        const Hm = GEO.homography(src, dst);
        const pose = Hm ? GEO.poseFromHomography(Hm, fw, WW/2, HH/2) : null;
        T("  …recovers the distance it was rendered at",
          pose ? pose.distance : NaN, c.distFt, c.distFt*0.02,
          "within 2 % of " + c.distFt.toFixed(1) + " ft");
        T("  …recovers the yaw it was rendered at",
          pose ? pose.yawDeg : NaN, c.yawDeg, 2.0, "within 2°");
        T("  …with sub-pixel edge residual", rr.rms != null && rr.rms < 1.2, true,
          null, rr.rms == null ? "no lines fitted" : rr.rms.toFixed(3) + " px");
        T("  …and reports a corner σ the error budget can use",
          rr.cornerSigma != null && rr.cornerSigma > 0 && rr.cornerSigma < 2, true,
          null, rr.cornerSigma == null ? "null" : rr.cornerSigma.toFixed(3) + " px");
      });

      /* A blank wall must produce NOTHING. A detector that hallucinates a
         rectangle on an empty frame is worse than one that never fires. */
      ws.luma.fill(128);
      const blank = DET.detect(ws, { aspect:4/3, focalPx:fw, cx:WW/2, cy:HH/2 });
      T("a featureless frame yields no rectangle", !!(blank && blank.quad), false);

      /* Orientation ambiguity: render A4 LANDSCAPE but ask for portrait. */
      arcDetSynth(ws, { focalPx:fw, distFt:3, wFt:GEO.mToFt(0.297), hFt:GEO.mToFt(0.210),
                        noise:4, seed:21 });
      const rot = DET.detect(ws, { aspect:210/297, focalPx:fw, cx:WW/2, cy:HH/2 });
      T("a landscape reference is recognised as the same sheet rotated",
        !!(rot && rot.quad && rot.flipped), true,
        null, "both orientations are scored; the better rectFit wins");
    })();
  })();

  /* ==========================================================
     Floor-line trigonometry — the reference-free method
     ----------------------------------------------------------
     Four kinds of assertion:
       1. known h/θ pairs recover known distances, and the calibration solve
          inverts the measurement solve exactly;
       2. the error DERIVATIVE ∂d/∂θ = -h/sin²θ against values computed by
          hand, and against a numerical difference of the function it
          differentiates — which is the only check that catches a sign error
          or a stray degree/radian conversion;
       3. the degenerate-angle guards at both ends of the band;
       4. the depression angle is roll-invariant, which the HUD pitch is not —
          the single reason GEO.depressionFromGravity exists.
     ========================================================== */
  (function floorLineTests(){
    const R2 = Math.SQRT2;

    /* --- 1. known pairs, hand-computable --- */
    // 45°: tan 45 = 1, so d == h exactly.
    T("floor-line: h=1.5 m at 45° → d = 1.5 m", GEO.floorLineDistance(1.5, 45), 1.5, 1e-12,
      "tan 45° = 1");
    // 30°: tan 30 = 1/√3, so d = h·√3.
    T("floor-line: h=1.5 m at 30° → d = h·√3", GEO.floorLineDistance(1.5, 30), 1.5*Math.sqrt(3), 1e-12);
    // 60°: tan 60 = √3, so d = h/√3.
    T("floor-line: h=1.5 m at 60° → d = h/√3", GEO.floorLineDistance(1.5, 60), 1.5/Math.sqrt(3), 1e-12);
    // The field case the whole feature exists for: 6 ft standoff.
    const hField = 1.45, dField = GEO.ftToM(6);
    const thField = GEO.deg(Math.atan(hField/dField));
    T("floor-line: the 6 ft field case needs 38.4° of tilt", thField, 38.4098, 1e-3,
      "atan(1.45 / 1.8288)");
    T("  …and that tilt returns 6.00 ft", GEO.mToFt(GEO.floorLineDistance(hField, thField)), 6, 1e-9);
    T("floor-line: shallow aim reaches across a big store",
      GEO.mToFt(GEO.floorLineDistance(1.45, 12)), 22.3810, 1e-3);

    /* --- the calibration solve is the same identity rearranged --- */
    T("floor-line: floorLineHeight inverts floorLineDistance",
      GEO.floorLineHeight(GEO.floorLineDistance(1.62, 37), 37), 1.62, 1e-12);
    T("floor-line: floorLineDistance inverts floorLineHeight",
      GEO.floorLineDistance(GEO.floorLineHeight(2.4, 52), 52), 2.4, 1e-12);
    // calibration at a measured 5 ft, for a person holding the phone at 1.45 m
    const thCal = GEO.deg(Math.atan(1.45/GEO.ftToM(5)));
    T("floor-line: calibrating at 5 ft solves the height back out",
      GEO.floorLineHeight(GEO.ftToM(5), thCal), 1.45, 1e-12);
    T("  …and 5 ft really does sit near the 45° sweet spot", thCal, 43.5746, 1e-3,
      "which is why the calibration copy suggests it");

    /* --- 2. the derivative, against hand-computed values --- */
    // At 30°, sin 30 = 1/2, so -h/sin²θ = -4h. At 45°, sin²45 = 1/2, so -2h.
    T("floor-line: ∂d/∂θ = -h/sin²θ at 30° is -4h", GEO.floorLineDDdTheta(1.5, 30), -6, 1e-12,
      "-1.5/0.25");
    T("floor-line: …at 45° is -2h", GEO.floorLineDDdTheta(1.5, 45), -3, 1e-12, "-1.5/0.5");
    T("floor-line: …at 90° is -h", GEO.floorLineDDdTheta(1.5, 90 - 1e-9), -1.5, 1e-6);
    T("floor-line: …is always negative — tilting down brings the wall nearer",
      GEO.floorLineDDdTheta(1.45, 12) < 0 && GEO.floorLineDDdTheta(1.45, 70) < 0, true);
    T("floor-line: …and is ~17× larger at 12° than at 60°",
      GEO.floorLineDDdTheta(1.45, 12)/GEO.floorLineDDdTheta(1.45, 60),
      Math.pow(Math.sin(GEO.rad(60))/Math.sin(GEO.rad(12)), 2), 1e-9,
      "sin²60 / sin²12 = 17.4 — this is what a shallow aim costs");
    // numerical check: the analytic derivative must match a central difference
    (function(){
      const h = 1.45, th = 33, e = 1e-5;
      const num = (GEO.floorLineDistance(h, th+e) - GEO.floorLineDistance(h, th-e))/(2*GEO.rad(e));
      T("floor-line: analytic ∂d/∂θ matches a central difference",
        GEO.floorLineDDdTheta(h, th), num, 1e-6, "catches a stray deg/rad conversion");
    })();

    /* --- the error budget the merchandiser is shown --- */
    // With no height error at all, the whole budget is σθ/(sinθ·cosθ); at 45°
    // that collapses to exactly 2σθ in radians.
    const e45 = GEO.floorLineError({ h:1.45, heightRelSigma:0, thetaDeg:45, thetaSigmaDeg:0.5 });
    T("floor-line error: at 45° the angle term is exactly 2σ_θ",
      e45.rel, 2*GEO.rad(0.5), 1e-12, "sinθ·cosθ = 1/2");
    T("  …which is 1.745 % for half a degree of aim", e45.pct, 1.7453, 1e-3);
    T("floor-line error: terms add in quadrature and nothing else",
      GEO.floorLineError({ h:1.45, heightRelSigma:0.03, thetaDeg:45, thetaSigmaDeg:0.5 }).rel,
      Math.sqrt(0.03*0.03 + Math.pow(2*GEO.rad(0.5), 2)), 1e-12);
    T("floor-line error: an uncertain height passes straight through at 45°",
      GEO.floorLineError({ h:1.45, heightRelSigma:0.04, thetaDeg:45, thetaSigmaDeg:0 }).rel, 0.04, 1e-12,
      "∂d/∂h = cot θ = d/h, so σ_h/h is scale-free");
    T("floor-line error: the angle term is symmetric about 45°",
      GEO.floorLineError({ h:1, heightRelSigma:0, thetaDeg:30, thetaSigmaDeg:0.5 }).rel,
      GEO.floorLineError({ h:1, heightRelSigma:0, thetaDeg:60, thetaSigmaDeg:0.5 }).rel, 1e-12,
      "sinθ·cosθ = sin(2θ)/2");
    T("floor-line error: a 12° aim costs 1/sin(24°) = 2.46× a 45° one",
      GEO.floorLineError({ h:1.45, heightRelSigma:0, thetaDeg:12, thetaSigmaDeg:0.6 }).pct
        / GEO.floorLineError({ h:1.45, heightRelSigma:0, thetaDeg:45, thetaSigmaDeg:0.6 }).pct,
      1/Math.sin(GEO.rad(24)), 1e-9, "2σ/sin 2θ — the error is symmetric about 45°");
    T("floor-line error: a CALIBRATED phone meets the 5 % field budget at 6 ft",
      GEO.floorLineError({ h:hField, heightRelSigma:0.023, thetaDeg:thField,
                           thetaSigmaDeg:arcQuad(FLOOR_PITCH_SIGMA_FLOOR, FLOOR_AIM_SIGMA_DEG) }).pct <= 5,
      true, null,
      GEO.floorLineError({ h:hField, heightRelSigma:0.023, thetaDeg:thField,
                           thetaSigmaDeg:arcQuad(FLOOR_PITCH_SIGMA_FLOOR, FLOOR_AIM_SIGMA_DEG) }).pct.toFixed(2) + " %");
    T("floor-line error: the UNCALIBRATED default does NOT, which is why it is badged ROUGH",
      GEO.floorLineError({ h:FLOOR_DEFAULT_H_M, heightRelSigma:FLOOR_DEFAULT_H_SIGMA, thetaDeg:thField,
                           thetaSigmaDeg:arcQuad(FLOOR_PITCH_SIGMA_FLOOR, FLOOR_AIM_SIGMA_DEG) }).pct > 5,
      true, null,
      GEO.floorLineError({ h:FLOOR_DEFAULT_H_M, heightRelSigma:FLOOR_DEFAULT_H_SIGMA, thetaDeg:thField,
                           thetaSigmaDeg:arcQuad(FLOOR_PITCH_SIGMA_FLOOR, FLOOR_AIM_SIGMA_DEG) }).pct.toFixed(2) + " %");

    /* --- 3. degenerate angles: the singularities, then the policy band --- */
    T("floor-line: θ = 0 is refused outright (tan θ → 0, d → ∞)",
      isFinite(GEO.floorLineDistance(1.45, 0)), false);
    T("floor-line: a negative θ is refused (the ray never meets the floor)",
      isFinite(GEO.floorLineDistance(1.45, -5)), false);
    T("floor-line: θ = 90 is refused (aimed at their own feet)",
      isFinite(GEO.floorLineDistance(1.45, 90)), false);
    T("floor-line: θ > 90 is refused", isFinite(GEO.floorLineDistance(1.45, 100)), false);
    T("floor-line: a zero height is refused", isFinite(GEO.floorLineDistance(0, 40)), false);
    T("floor-line: the derivative refuses the same degenerate angles",
      isFinite(GEO.floorLineDDdTheta(1.45, 0)) || isFinite(GEO.floorLineDDdTheta(1.45, 90)), false);
    T("floor-line: the error at θ → 0 is infinite, not a small number",
      isFinite(GEO.floorLineError({ h:1.45, heightRelSigma:0.02, thetaDeg:0, thetaSigmaDeg:0.5 }).rel),
      false, null, "a NaN here would print as a plausible ± and be believed");
    // the policy band, which is much narrower than the singularity
    T("floorGuard: refuses a horizon aim and says why",
      floorGuard(FLOOR_MIN_DEPRESSION - 0.5).code, "shallow", 0);
    T("floorGuard: refuses aiming at your own feet and says why",
      floorGuard(FLOOR_MAX_DEPRESSION + 0.5).code, "steep", 0);
    T("floorGuard: refuses a level or upward aim", floorGuard(0).code, "up", 0);
    T("floorGuard: refuses a missing sensor rather than assuming level",
      floorGuard(null).code, "nosensor", 0);
    T("floorGuard: accepts the bottom of the band", floorGuard(FLOOR_MIN_DEPRESSION).ok, true);
    T("floorGuard: accepts the top of the band", floorGuard(FLOOR_MAX_DEPRESSION).ok, true);
    T("floorGuard: accepts the 6 ft field case", floorGuard(thField).ok, true);
    T("floorGuard: every refusal carries a reason the field can act on",
      [0, -3, FLOOR_MIN_DEPRESSION-1, FLOOR_MAX_DEPRESSION+1, null]
        .every(function(v){ const g = floorGuard(v); return !g.ok && g.why.length > 20; }), true);
    T("floorGuard: the band never reaches either singularity",
      FLOOR_MIN_DEPRESSION > 0 && FLOOR_MAX_DEPRESSION < 90, true);
    // …and the band really does keep the error inside a usable range
    T("floor-line: at the shallow edge of the band the error is still bounded",
      GEO.floorLineError({ h:1.45, heightRelSigma:0.023, thetaDeg:FLOOR_MIN_DEPRESSION,
                           thetaSigmaDeg:0.6 }).pct < 15, true, null,
      GEO.floorLineError({ h:1.45, heightRelSigma:0.023, thetaDeg:FLOOR_MIN_DEPRESSION,
                           thetaSigmaDeg:0.6 }).pct.toFixed(2) + " % — reported, but loudly");

    /* --- 3b. h from stature: the RATIO derivation and its error propagation ---
       The thing being pinned is that h is a FRACTION of stature and not a fixed
       subtraction, because a subtraction is biased at both ends of the height
       range and no error bar fixes a bias. The uncertainty constants are pinned
       too: they are an error budget, and a silent change to one of them should
       break a test rather than quietly move every capture's reported accuracy. */
    (function statureTests(){
      const s170 = statureHold(170), s150 = statureHold(150), s190 = statureHold(190);
      T("stature: h = stature × HOLD_RATIO at 170 cm", s170.hM, 1.70*HOLD_RATIO, 1e-12,
        "1.70 × " + HOLD_RATIO + " = " + (1.70*HOLD_RATIO).toFixed(4) + " m");
      T("stature: …and at 150 cm", s150.hM, 1.50*HOLD_RATIO, 1e-12);
      T("stature: …and at 190 cm", s190.hM, 1.90*HOLD_RATIO, 1e-12);
      T("stature: h/stature is the SAME at every height — that is what a ratio means",
        (s150.hM/1.50 === s170.hM/1.70) && (s170.hM/1.70 === s190.hM/1.90), true);
      /* The discriminating case. A flat offset would make this difference the
         full 0.40 m of stature difference; a ratio scales it by HOLD_RATIO. */
      T("stature: 40 cm of extra stature moves h by 40 cm × the ratio, NOT by 40 cm",
        s190.hM - s150.hM, 0.40*HOLD_RATIO, 1e-12,
        "a subtraction would give 0.4000; a ratio gives " + (0.40*HOLD_RATIO).toFixed(4));
      T("stature: a flat-offset model would disagree by over 7 cm across the range",
        Math.abs((s190.hM - s150.hM) - 0.40) > 0.07, true,
        null, "the bias a constant offset bakes in at the ends of the range");

      /* Posture is a one-line change, and the two documented postures differ. */
      const eye170 = statureHold(170, HOLD_RATIO_EYE);
      T("stature: the eye-level posture is a ratio swap and nothing else",
        eye170.hM, 1.70*HOLD_RATIO_EYE, 1e-12);
      T("stature: eye level sits above neck level, as it must", eye170.hM > s170.hM, true,
        null, HOLD_RATIO_EYE + " vs " + HOLD_RATIO_NECK);
      T("stature: HOLD_RATIO defaults to the posture the capture screen instructs",
        HOLD_RATIO, HOLD_RATIO_NECK, 0, "\"hold the phone up at neck level\"");

      /* --- the error budget --- */
      const hand = Math.sqrt(Math.pow(HOLD_RATIO*STATURE_SIGMA_M, 2)
                           + Math.pow(1.70*HOLD_RATIO_SIGMA, 2)
                           + Math.pow(HOLD_COMPLY_SIGMA_M, 2));
      T("stature error: sigma_h is the quadrature sum of the three terms, in metres",
        s170.sigmaM, hand, 1e-12);
      T("stature error: …and is SMALLER than adding them linearly",
        s170.sigmaM < (HOLD_RATIO*STATURE_SIGMA_M + 1.70*HOLD_RATIO_SIGMA + HOLD_COMPLY_SIGMA_M), true,
        null, "catches a sum where a quadrature sum belongs");
      T("stature error: the relative figure is sigma_h / h, ~4 % for a median adult",
        s170.relSigma, 0.040061, 1e-5,
        (s170.relSigma*100).toFixed(2) + " % — pins the three constants");
      T("stature error: it is relatively WORSE for a shorter person",
        s150.relSigma > s170.relSigma && s170.relSigma > s190.relSigma, true, null,
        (s150.relSigma*100).toFixed(2) + " % / " + (s170.relSigma*100).toFixed(2)
          + " % / " + (s190.relSigma*100).toFixed(2) + " % at 150 / 170 / 190 cm");
      T("stature error: better than the stated default it replaces",
        s170.relSigma < FLOOR_DEFAULT_H_SIGMA, true, null,
        (s170.relSigma*100).toFixed(2) + " % vs " + (FLOOR_DEFAULT_H_SIGMA*100).toFixed(1) + " %");
      T("stature error: and honestly WORSE than a tape calibration, at every height",
        [s150, s170, s190].every(function(s){ return s.relSigma > 0.023; }), true, null,
        "0.023 is the calibrated figure the 5 % budget was proved against");

      /* --- propagation into the distance the merchandiser is actually shown --- */
      const fieldErrPct = function(h, hRel){
        const th = GEO.deg(Math.atan(h/GEO.ftToM(6)));
        return GEO.floorLineError({ h:h, heightRelSigma:hRel, thetaDeg:th,
                 thetaSigmaDeg:arcQuad(FLOOR_PITCH_SIGMA_FLOOR, FLOOR_AIM_SIGMA_DEG) }).pct;
      };
      const eStat = fieldErrPct(s170.hM, s170.relSigma);
      const eCal  = fieldErrPct(s170.hM, 0.023);
      const eDef  = fieldErrPct(FLOOR_DEFAULT_H_M, FLOOR_DEFAULT_H_SIGMA);
      T("stature: a median adult at 6 ft meets the 5 % field budget", eStat <= 5, true, null,
        eStat.toFixed(2) + " % at " + GEO.deg(Math.atan(s170.hM/GEO.ftToM(6))).toFixed(1) + " deg");
      T("stature: …strictly between the tape-calibrated and the default paths",
        eCal < eStat && eStat < eDef, true, null,
        "tape " + eCal.toFixed(2) + " % < stature " + eStat.toFixed(2)
          + " % < default " + eDef.toFixed(2) + " %");
      T("stature: nothing is hardcoded — the height term IS the propagated sigma",
        GEO.floorLineError({ h:s170.hM, heightRelSigma:s170.relSigma, thetaDeg:45,
                             thetaSigmaDeg:0 }).rel, s170.relSigma, 1e-12);
      T("stature: the shortest adult in the band is still reported honestly, not hidden",
        fieldErrPct(s150.hM, s150.relSigma) < 6, true, null,
        fieldErrPct(s150.hM, s150.relSigma).toFixed(2)
          + " % at 150 cm — over 5 %, and the record says so rather than rounding it away");

      /* --- the band the database itself enforces --- */
      T("stature: below the CHECK constraint is refused, not clamped",
        statureHold(STATURE_MIN_CM - 1), null);
      T("stature: above it is refused too", statureHold(STATURE_MAX_CM + 1), null);
      T("stature: the boundaries themselves are accepted",
        !!statureHold(STATURE_MIN_CM) && !!statureHold(STATURE_MAX_CM), true);
      T("stature: a missing height is not a zero height", statureHold(null), null);
      T("stature: a value typed in inches is refused", statureHold(68), null,
        null, "the mistake a bare number input actually produces");
      T("stature: a value typed in millimetres is refused", statureHold(1720), null);
      T("stature: nonsense is refused", statureHold("tall"), null);

      /* --- provenance survives the round trip through placements.note --- */
      const nStat = "[floor h=1.394m/4.01% ang=37.32deg/0.60deg err=4.56% (height 4.01 / pitch 2.19) "
                  + "age=2.0s cal=stature]";
      const pStat = floorEvidenceFromNote(nStat, {});
      T("stature note: the third source round-trips", pStat.floorHeightSrc, "stature", 0);
      T("stature note: …and never claims to be a device calibration",
        pStat.floorCalibrated, false);
      T("stature note: the height and its sigma come back off the tag",
        pStat.floorHeightM === 1.394 && pStat.floorHeightPct === 4.01, true);
      const pDev = floorEvidenceFromNote(
        "[floor h=1.500m/2.30% ang=39.00deg/0.60deg err=3.10% (height 2.30 / pitch 2.08) "
        + "age=1.0s cal=device]", {});
      T("stature note: an existing device-calibrated note is unchanged by the new source",
        pDev.floorCalibrated === true && pDev.floorHeightSrc === "device", true);
      T("stature note: the three sources are worded differently for the reviewer",
        floorHSrcShort({hSrcKey:"device"}) !== floorHSrcShort({hSrcKey:"stature"})
        && floorHSrcShort({hSrcKey:"stature"}) !== floorHSrcShort({hSrcKey:"default"}), true);
    })();

    /* --- 4. depression is roll-invariant; the HUD pitch is not --- */
    // gravity for a camera aiming 40° down, held perfectly upright
    const dep = 40, sd = Math.sin(GEO.rad(dep)), cd = Math.cos(GEO.rad(dep));
    const gUp = [0, -cd, -sd];
    T("depressionFromGravity: recovers 40° from an upright phone",
      GEO.depressionFromGravity(gUp), 40, 1e-9);
    T("  …and tiltFromGravity agrees while there is no roll",
      -GEO.tiltFromGravity(gUp).pitchDeg, 40, 1e-9);
    // the SAME physical aim, rolled 30° about the optical axis: x,y rotate, z does not
    const rr = GEO.rad(30);
    const gRoll = [ 0*Math.cos(rr) - (-cd)*Math.sin(rr), 0*Math.sin(rr) + (-cd)*Math.cos(rr), -sd ];
    T("depressionFromGravity: SAME 40° when the phone is rolled 30°",
      GEO.depressionFromGravity(gRoll), 40, 1e-9,
      "asin(-g_z) — roll only mixes x and y");
    T("  …whereas the HUD pitch reads 4.1° too steep, which is a 13 % distance error",
      -GEO.tiltFromGravity(gRoll).pitchDeg, 44.0953, 1e-3,
      "this is precisely why the method does not reuse it");
    T("  …and the distances they would report differ by more than 10 %",
      Math.abs(GEO.floorLineDistance(1.45, 44.0953) - GEO.floorLineDistance(1.45, 40))
        / GEO.floorLineDistance(1.45, 40) > 0.10, true);
    T("depressionFromGravity: a level phone is 0° down",
      GEO.depressionFromGravity([0, -1, 0]), 0, 1e-9);
    T("depressionFromGravity: a phone aimed straight down is 90°",
      GEO.depressionFromGravity([0, 0, -1]), 90, 1e-9);
    T("depressionFromGravity: aiming UP reports a negative depression",
      GEO.depressionFromGravity([0, -cd, sd]), -40, 1e-9);
    T("depressionFromGravity: survives the beta = ±90 gimbal the same way tilt does",
      GEO.depressionFromGravity(GEO.gravityFromOrientation(0, 78, 0)), 12, 1e-6,
      "the HUD's own 'TILTED FORWARD 12°' case");
    T("depressionFromGravity: screen rotation does not change it",
      GEO.depressionFromGravity(GEO.applyScreenAngle(gRoll, 90)),
      GEO.depressionFromGravity(gRoll), 1e-12,
      "applyScreenAngle only mixes x and y");
    void R2;

    /* --- the method axis, and the note tag that carries it --- */
    T("METHOD_META covers every method arcMethodKey can produce",
      ["xr-hit-test","reference-scale","floor-line","manual"]
        .every(function(k){ return !!METHOD_META[k]; }), true);
    T("methodFromTier: AR tiers imply the AR method",
      methodFromTier("Asd") + "," + methodFromTier("A"), "xr-hit-test,xr-hit-test", 0);
    T("methodFromTier: hand-typed implies manual", methodFromTier("C"), "manual", 0);
    T("methodFromTier: everything else implies reference scale",
      methodFromTier("Bq") + "," + methodFromTier("Be"), "reference-scale,reference-scale", 0);
    T("floor-line is tier Be, so is_verified is untouched in BOTH schema states",
      TIER_META.Be.verified, false, 0,
      "unverified in 0001 (AR only) and in the pending 0005 (AR + Bq/B)");
    T("floor-line does not add a ninth verification_tier enum value",
      Object.keys(TIER_META).length, 8, 0, "a ninth would be a migration");
    (function(){
      const note = "Distance came from FLOOR-LINE TRIGONOMETRY (d = h / tan θ). "
        + "[floor h=1.452m/2.30% ang=38.41deg/0.61deg err=3.12% (height 2.30 / pitch 2.11) "
        + "age=4.2s cal=device] Yaw obliqueness not verified.";
      const p = floorEvidenceFromNote(note, {});
      T("floor note tag round-trip: method", p.method, "floor-line", 0);
      T("floor note tag round-trip: height and its sigma",
        p.floorHeightM + "/" + p.floorHeightPct, "1.452/2.3", 0);
      T("floor note tag round-trip: angle and its sigma",
        p.floorThetaDeg + "/" + p.floorThetaSigmaDeg, "38.41/0.61", 0);
      T("floor note tag round-trip: error percentage", p.errorPct, 3.12, 1e-9);
      T("floor note tag round-trip: error terms",
        p.errorTerms.height + "/" + p.errorTerms.pitch, "2.3/2.11", 0);
      T("floor note tag round-trip: how stale the reading was", p.floorHeldS, 4.2, 1e-9);
      T("floor note tag round-trip: calibrated flag", p.floorCalibrated, true);
      T("floor note tag round-trip: a default-height capture is not marked calibrated",
        floorEvidenceFromNote("[floor h=1.450m/8.50% ang=40.00deg/0.60deg err=8.90% "
          + "(height 8.50 / pitch 2.63) age=0.0s cal=default]", {}).floorCalibrated, false);
      T("floor note tag round-trip: a reference-scale note is not read as floor-line",
        floorEvidenceFromNote("[ref a4q 210x297mm manual err=3.1% (focal 2 / dim 0.24 "
          + "/ corner 0.9 / barrel 0) r=0.1]", {}).method, undefined, 0);
      T("floor note tag round-trip: a null note is safe",
        Object.keys(floorEvidenceFromNote(null, {})).length, 0, 0);
      T("the two note tags coexist without either shadowing the other",
        (function(){
          const both = "[ref a4q 210x297mm manual err=3.1% (focal 2 / dim 0.24 / corner 0.9 "
            + "/ barrel 0) r=0.1] [floor h=1.500m/2.00% ang=45.00deg/0.50deg err=2.62% "
            + "(height 2.00 / pitch 1.70) age=0.0s cal=device]";
          const q = refEvidenceFromNote(both, {});
          floorEvidenceFromNote(both, q);
          return q.refSource === "a4q" && q.method === "floor-line";
        })(), true);
    })();

    /* --- an end-to-end accuracy sweep, run the way the field runs it ---
       For a grid of heights, true distances and height-calibration qualities:
       solve the exact θ, perturb it by one σ, and check the recovered distance
       lands inside the error bar the app would have printed. This is the
       assertion that would fail if the geometry, the derivative or the budget
       ever drifted apart from one another. */
    (function(){
      const sTh = arcQuad(FLOOR_PITCH_SIGMA_FLOOR, FLOOR_AIM_SIGMA_DEG);
      const H_SIGMA = 0.023;              // what a careful 5 ft calibration is worth
      let band = 0, within5 = 0, checked = 0;
      let worstAngleRatio = 0, worstHeightErr = 0, worstPct = 0, bestPct = 100;
      [1.25, 1.45, 1.70].forEach(function(h){
        [4, 6, 8, 12].forEach(function(dFt){
          const dM = GEO.ftToM(dFt);
          const th = GEO.deg(Math.atan(h/dM));
          if(!floorGuard(th).ok) return;
          band++; checked++;
          const est = GEO.floorLineError({ h:h, heightRelSigma:H_SIGMA, thetaDeg:th, thetaSigmaDeg:sTh });
          if(est.pct <= 5) within5++;
          worstPct = Math.max(worstPct, est.pct);
          bestPct  = Math.min(bestPct,  est.pct);
          /* Each term is checked against the EXACT nonlinear function, one at a
             time. Perturbing both at once would be a 1.41σ event, not a 1σ one,
             and would "fail" a budget that is perfectly correct. */
          const exactTh = Math.abs(GEO.floorLineDistance(h, th + sTh) - dM)/dM;
          worstAngleRatio = Math.max(worstAngleRatio, Math.abs(exactTh/est.terms.pitch - 1));
          const exactH = Math.abs(GEO.floorLineDistance(h*(1+H_SIGMA), th) - dM)/dM;
          worstHeightErr = Math.max(worstHeightErr, Math.abs(exactH - est.terms.height));
        });
      });
      T("floor-line sweep: every grid point (3 heights × 4 distances) is inside the band",
        band, 12, 0);
      T("floor-line sweep: the angle term matches the exact function to better than 5 %",
        worstAngleRatio < 0.05, true, null,
        "worst linearisation gap " + (worstAngleRatio*100).toFixed(2) + " %");
      T("floor-line sweep: the height term is exact, not linearised",
        worstHeightErr < 1e-12, true, null, "sigma_h/h passes straight through cot theta");
      T("floor-line sweep: a calibrated phone meets 5 % at every grid point",
        within5, checked, 0,
        checked + "/" + checked + " · best " + bestPct.toFixed(2)
          + " % · worst " + worstPct.toFixed(2) + " %");
      /* How it degrades: the same 6 ft standoff, aimed from progressively lower
         heights so theta gets shallower. The point of the assertion is the
         MONOTONICITY — the error must grow as the aim flattens, or the budget is
         not tracking the derivative it claims to. */
      (function(){
        let prev = 0, monotonic = true, worst = 0;
        [45, 40, 30, 20, 15, FLOOR_MIN_DEPRESSION].forEach(function(th){
          const e = GEO.floorLineError({ h:1.45, heightRelSigma:H_SIGMA,
                                         thetaDeg:th, thetaSigmaDeg:sTh });
          if(e.pct < prev) monotonic = false;
          prev = e.pct; worst = e.pct;
        });
        T("floor-line sweep: the error grows monotonically as the aim flattens",
          monotonic, true, null,
          "45 deg (the minimum) -> " + FLOOR_MIN_DEPRESSION + " deg, ending at "
            + worst.toFixed(2) + " %");
      })();
    })();
  })();

  /* --- POSTER FIT: the derived standoff, the visible wall, the two checks ---
     Everything here is pure and frame-agnostic, so the SAME numbers hold in
     both APP_MODEs; the one mode-dependent assertion is taskStandoff's
     contract, which is asserted as a contract rather than as a number. */
  (function(){
    const NW = NOMINAL_FRAME_W, NH = NOMINAL_FRAME_H;
    const fN = GEO.focalFromFov(NW, ASSUMED_HFOV_DEG);         // 831.527 px
    const nom = function(wFt, hFt, fill){
      return GEO.posterStandoff({ widthFt:wFt, heightFt:hFt, frameW:NW, frameH:NH,
                                  fx:fN, fy:fN, fill:fill });
    };
    const seen = function(dFt, wFt, hFt){
      return GEO.viewFit({ distanceFt:dFt, widthFt:wFt, heightFt:hFt,
                           frameW:NW, frameH:NH, fx:fN, fy:fN });
    };

    /* ---- visible wall from intrinsics ---- */
    T("focalFromFov(1080px, 66°) — the nominal portrait phone", fN, 831.5271, 1e-3);
    T("visibleSpan: 6 ft away a 66° phone sees only 7.79 ft of wall",
      GEO.visibleSpan(6, NW, fN), 7.7929, 1e-3,
      "d·px/f — the exact reason a 9 ft poster could not be shot from the old 6 ft standoff");
    T("visibleSpan is linear in distance",
      GEO.visibleSpan(12, NW, fN)/GEO.visibleSpan(6, NW, fN), 2, 1e-12);
    T("visibleSpan agrees with posterPixelWidth on the frame fraction",
      GEO.posterPixelWidth(9, 10, fN)/NW, 9/GEO.visibleSpan(10, NW, fN), 1e-12,
      "f·W/d over px  ==  W over d·px/f");
    T("visibleSpan rejects a nonsense distance", isFinite(GEO.visibleSpan(0, NW, fN)), false,
      null, "guarded, not silently Infinity");
    T("distanceForFill inverts visibleSpan",
      GEO.visibleSpan(GEO.distanceForFill(9, 0.7, NW, fN), NW, fN), 9/0.7, 1e-9);

    /* ---- recommended / minimum standoff, several poster sizes ---- */
    const s98 = nom(9, 8);
    T("standoff 9×8 ft: recommended 9.90 ft", s98.recommendedFt, 9.8991, 1e-3,
      "f·W/(0.70·px) — the user's failing case, and it is nowhere near 6 ft");
    T("standoff 9×8 ft: minimum 6.93 ft", s98.minimumFt, 6.9294, 1e-3, "the poster exactly fills the frame");
    T("standoff 9×8 ft: the width is what binds on a portrait frame", s98.limit, "width");
    T("standoff 9×8 ft: the OLD fixed 6 ft standoff was below the minimum",
      STANDOFF_FT < s98.minimumFt, true, null,
      "6 ft < " + s98.minimumFt.toFixed(2) + " ft — the gate was unsatisfiable, not merely wrong");
    const s43 = nom(4, 3);
    T("standoff 4×3 ft: recommended 4.40 ft", s43.recommendedFt, 4.3996, 1e-3);
    T("standoff 4×3 ft: minimum 3.08 ft", s43.minimumFt, 3.0797, 1e-3);
    const s310 = nom(3, 10);
    T("standoff 3×10 ft: a TALL poster is height-limited, not width-limited", s310.limit, "height");
    T("standoff 3×10 ft: recommended 6.19 ft comes from the height", s310.recommendedFt, 6.1870, 1e-3,
      "width alone would have said 3.30 ft, and the top would have run off frame");
    T("standoff 3×10 ft: minimum 4.33 ft", s310.minimumFt, 4.3309, 1e-3);
    const s124 = nom(12, 4);
    T("standoff 12×4 ft: recommended 13.20 ft", s124.recommendedFt, 13.1988, 1e-3);
    T("recommended is always further out than the minimum",
      [s98, s43, s310, s124].every(function(x){ return x.recommendedFt > x.minimumFt; }), true, null,
      "fill target " + FRAME_FILL_TARGET + " < 1");
    T("a width-limited poster's recommended/minimum ratio is exactly 1/fill",
      s98.recommendedFt/s98.minimumFt, 1/FRAME_FILL_TARGET, 1e-12);
    T("a bigger poster always needs more room",
      nom(12, 8).recommendedFt > s98.recommendedFt && s98.recommendedFt > s43.recommendedFt, true);
    /* Turn the same frame on its side and an 8 ft height becomes the binding
       dimension. Correct physics, not a special case. */
    (function(){
      const fL = GEO.focalFromFov(1920, ASSUMED_HFOV_DEG);
      const land = GEO.posterStandoff({ widthFt:9, heightFt:8, frameW:1920, frameH:1080,
                                        fx:fL, fy:fL, fill:FRAME_FILL_TARGET });
      T("standoff 9×8 ft on a LANDSCAPE frame flips to height-limited", land.limit, "height");
      T("…and lands further back, at 15.64 ft", land.recommendedFt, 15.6431, 1e-3);
    })();

    /* ---- does it fit in view (check a) ---- */
    const at6 = seen(6, 9, 8);
    T("viewFit 9×8 ft at 6 ft: does NOT fit", at6.fits, false);
    T("viewFit 9×8 ft at 6 ft: the width is the problem", at6.limit, "width");
    T("viewFit 9×8 ft at 6 ft: 7.79 ft of wall in view", at6.visibleWFt, 7.7929, 1e-3);
    const atRec = seen(s98.recommendedFt, 9, 8);
    T("viewFit 9×8 ft at the recommended distance: fits", atRec.fits, true);
    T("…filling exactly the fill target across the frame", atRec.fillW, FRAME_FILL_TARGET, 1e-12);
    T("…and comfortably inside it top to bottom", atRec.fillH < 0.5, true,
      null, "fillH " + atRec.fillH.toFixed(3));
    /* THE BOUNDARY. Exactly filling the frame must COUNT as fitting — this is
       the definition of the minimum, and a float that lands on 1+1ulp must not
       turn a legal capture into an impossible one. */
    const atMin = seen(s98.minimumFt, 9, 8);
    T("viewFit at exactly the minimum: fillW is exactly 1", atMin.fillW, 1, 1e-12);
    T("viewFit at exactly the minimum: FITS (the boundary is inclusive)", atMin.fits, true);
    T("viewFit a hair inside the minimum: does not fit",
      seen(s98.minimumFt*(1 - 1e-6), 9, 8).fits, false);
    T("viewFit a hair outside the minimum: fits",
      seen(s98.minimumFt*(1 + 1e-6), 9, 8).fits, true);
    T("viewFit 3×10 ft at its minimum is HEIGHT-tight, not width-tight",
      seen(s310.minimumFt, 3, 10).fillH, 1, 1e-12);

    /* THE PREVIEW IS A CROP, and the two frames can disagree. A 400×914 stage
       showing a 1080×1920 stream is scaled by cover to fill the HEIGHT, so it
       shows less width than the shutter records — and a poster that exactly
       fills the capture frame overflows the preview. The gate follows the
       capture frame; the field UI says which one they are looking at. */
    (function(){
      const cw = 400, ch = 914, sCover = Math.max(cw/NW, ch/NH);
      const fCss = fN*sCover;
      const capture = seen(s98.minimumFt, 9, 8);
      const preview = GEO.viewFit({ distanceFt:s98.minimumFt, widthFt:9, heightFt:8,
                                    frameW:cw, frameH:ch, fx:fCss, fy:fCss });
      T("at the minimum the poster fits the CAPTURE frame", capture.fits, true);
      T("…and overflows the cover-cropped PREVIEW", preview.fits, false, null,
        "preview sees " + preview.visibleWFt.toFixed(2) + " ft where the shutter records 9.00 ft");
      T("…while at the recommended distance both agree",
        GEO.viewFit({ distanceFt:s98.recommendedFt, widthFt:9, heightFt:8,
                      frameW:cw, frameH:ch, fx:fCss, fy:fCss }).fits, true);
      /* Marks are converted with the DISPLAY focal, and (Δx)/f is invariant
         under the cover scale — so a wall marked on screen measures the same
         as the same two features measured in capture pixels. */
      const ox = (cw - NW*sCover)/2, toVid = function(x){ return (x - ox)/sCover; };
      T("a span marked on the stage measures the same as it does in the capture frame",
        GEO.spanFromPixels(10, 100, 300, cw/2, fCss).ft,
        GEO.spanFromPixels(10, toVid(100), toVid(300), NW/2, fN).ft, 1e-9,
        "object-fit:cover scales pixels and focal length together, so (Δx)/f is invariant");
    })();

    /* ---- the wall's own edges (check b) ---- */
    const c0 = NW/2;
    const sym = GEO.spanFromPixels(10, 200, 880, c0, fN);
    T("spanFromPixels: two marks 680 px apart at 10 ft span 8.18 ft",
      sym.ft, 8.1777, 1e-3, "d·(tan α_right − tan α_left)");
    T("spanFromPixels: the right mark sits 22.24° off axis", sym.alphaBDeg, 22.2390, 1e-3);
    T("spanFromPixels: symmetric marks give equal and opposite angles",
      sym.alphaADeg, -sym.alphaBDeg, 1e-12);
    T("spanFromPixels across the whole frame == visibleSpan",
      GEO.spanFromPixels(10, 0, NW, c0, fN).ft, GEO.visibleSpan(10, NW, fN), 1e-9);
    T("spanFromPixels: marks both off to one side still measure their own span",
      GEO.spanFromPixels(10, 700, 1000, c0, fN).ft, 3.6078, 1e-3);
    T("spanFromPixels: order of the two marks does not change the span",
      GEO.spanFromPixels(10, 1000, 700, c0, fN).ft,
      GEO.spanFromPixels(10, 700, 1000, c0, fN).ft, 1e-12);
    T("spanFromPixels scales linearly with distance",
      GEO.spanFromPixels(20, 200, 880, c0, fN).ft/sym.ft, 2, 1e-12);
    T("spanFromPixels refuses to invent a span with no distance",
      GEO.spanFromPixels(0, 200, 880, c0, fN), null);

    /* ---- the fit comparison itself, including the exactly-fits boundary ---- */
    T("fitsWithin: a 9 ft poster does not fit a 7.2 ft wall", GEO.fitsWithin(9, 7.2), false);
    T("fitsWithin: a 9 ft poster fits a 9 ft wall EXACTLY", GEO.fitsWithin(9, 9), true);
    T("fitsWithin: 0.1 ft short is short", GEO.fitsWithin(9, 8.9), false);
    T("fitsWithin: a float hair over the boundary still fits",
      GEO.fitsWithin(9, 9*(1 - 1e-15)), true, null, "1 ulp of slack, and no more");
    T("fitsWithin: NaN is never a fit", GEO.fitsWithin(9, NaN), false);

    /* ---- honest precision ---- */
    T("roundToSigma: ± 1.7 ft rounds to whole feet", roundToSigma(12.857, 1.67), 13, 1e-12);
    T("roundToSigma: ± 0.4 ft rounds to the nearest half foot", roundToSigma(12.6, 0.4), 12.5, 1e-12);
    T("roundToSigma: a tight error bar keeps a tenth", roundToSigma(9.899, 0.1), 9.9, 1e-12);
    T("fmtRoughFt drops the decimal once the error bar is a foot wide",
      fmtRoughFt(12.857, 1.67), "13", null, "no false precision on an uncalibrated lens");

    /* ---- and the contract the two modes agree on ---- */
    (function(){
      const t9 = { widthFt:9, heightFt:8, standoffFt:STANDOFF_FT };
      const so = taskStandoff(t9);
      T("taskStandoff derives the standoff in mockup mode and only there",
        so.derived, MOCKUP, null, "APP_MODE = " + APP_MODE);
      T("taskStandoff: mockup derives 9.90 ft, verification keeps the task's 6.0 ft",
        so.recommendedFt, MOCKUP ? 9.8991 : STANDOFF_FT, 1e-3);
    })();
  })();

  /* --- FREEZING THE READING: the button and the refusal must agree ---------
     The regression this block exists for: the Measure button's enabled state
     was taught the derived mockup standoff and arcFloorTakeReading's own
     refusal was not, so in mockup mode the button offered a press that was then
     rejected with "Move in 6.0 ft first — you are too far from the wall" and
     the merchandiser could not get past step 1 at any distance.

     The load-bearing assertion is the LAST one: for every distance, the gate
     that enables the button and the gate that freezes the reading return the
     same answer. It is mode-independent, so it holds in both builds and would
     have failed on the code it replaces.

     ARC state is borrowed and put back — the suite runs against a live app, and
     ARC.task belongs to whatever capture the user may have open. */
  (function readingGateTests(){
    const savedTask = ARC.task, savedTier = ARC.tier, savedDist = ARC.meas.distFt;
    try{
      ARC.task = normalizeTask({ campaignId:null, taskCode:"SELFTEST-FIT", status:S.DRAFT,
                                 widthFt:9, heightFt:8, standoffFt:STANDOFF_FT,
                                 standoffTolFt:STANDOFF_TOL_FT, angleTolDeg:ANGLE_TOL_DEG });
      /* Tier C with no stage in the DOM: arcViewIntrinsics falls back to the
         nominal portrait frame at the assumed lens, so the numbers below are the
         ones the poster-fit block already pins. */
      ARC.tier = "C";
      const t = ARC.task;
      const distOkAt = function(d){ ARC.meas.distFt = d; return arcGates().distOk; };
      /* The near edge means different things in the two modes — the minimum
         workable distance in mockup, the bottom of the manager's band in
         verification — but "just inside it is refused, just outside it is
         allowed" is the same statement either way. */
      const fit = arcFit(12);
      const edge = MOCKUP ? fit.minimumFt : (t.standoffFt - t.standoffTolFt);

      T("freeze gate: a reading that does not exist is never freezable",
        floorReadingGate(null).ok, false);
      const gNear = floorReadingGate(3);
      T("freeze gate: standing too close is a hard stop in BOTH modes", gNear.ok, false,
        null, MOCKUP ? "3 ft is inside the " + edge.toFixed(2) + " ft minimum — the poster cannot fit the frame"
                     : "3 ft is below the manager's band");
      T("freeze gate: …named as the near direction", gNear.code, "close", 0);
      T("freeze gate: …and the refusal says what to do about it",
        gNear.why.length > 20, true);
      T("freeze gate: a hair inside the near edge is refused",
        floorReadingGate(edge*(1 - 1e-6)).ok, false, null, "edge " + edge.toFixed(4) + " ft");
      T("freeze gate: …and a hair outside it is allowed",
        floorReadingGate(edge*(1 + 1e-6)).ok, true);

      /* THE FAILING CASE, at the distance a 9 × 8 ft poster actually needs. */
      const g12 = floorReadingGate(12);
      T("freeze gate: THE BUG — 12 ft from a 9×8 ft poster freezes in mockup, not in verification",
        g12.ok, MOCKUP, null,
        "12 ft is " + Math.abs(12 - t.standoffFt).toFixed(1) + " ft outside the old ± "
          + t.standoffTolFt + " ft band, and the poster needs " + fit.minimumFt.toFixed(2) + " ft");
      T("freeze gate: …and in mockup it is an ordinary good spot, with nothing to add",
        MOCKUP ? (g12.code === "ok" && g12.why === "" && g12.note === "") : (g12.code === "far"),
        true);

      /* FAR: the same direction in both modes, and the whole of the change is
         what each mode does about it. */
      const g30 = floorReadingGate(30);
      T("freeze gate: standing well back is the FAR case in both modes", g30.code, "far", 0);
      T("freeze gate: …but only verification refuses it", g30.ok, MOCKUP);
      T("freeze gate: mockup answers far with advice, verification with a refusal",
        (g30.note !== "") === MOCKUP && (g30.why !== "") === !MOCKUP, true,
        null, "exactly one of note/why is ever non-empty");
      const gGood = floorReadingGate(MOCKUP ? fit.recommendedFt : t.standoffFt);
      T("freeze gate: the recommended distance is silent — no refusal and no advice",
        gGood.ok && gGood.why === "" && gGood.note === "", true);

      /* The invariant the bug violated. */
      const disagreed = [];
      [2, 3, 4, 5, 5.6, 6, 6.5, 6.93, 7, 8, 9.9, 12, 18, 30, 45].forEach(function(d){
        if(floorReadingGate(d).ok !== distOkAt(d)) disagreed.push(d.toFixed(2));
      });
      T("freeze gate: every distance the button offers can actually be frozen, and no other",
        disagreed.length, 0, 0,
        disagreed.length ? "disagreed at " + disagreed.join(", ") + " ft"
                         : "15 distances from 2 to 45 ft, arcGates().distOk == floorReadingGate().ok");
    } finally {
      ARC.task = savedTask; ARC.tier = savedTier; ARC.meas.distFt = savedDist;
    }
  })();

  /* --- geofence helper still intact --- */
  T("haversine ~111.2 km per degree of latitude",
    haversine(0, 0, 1, 0)/1000, 111.19, 0.05);

  const failed = R.filter(r => !r.ok);
  if(window.console){
    if(console.table) console.table(R.map(r => ({ test:r.name, got:r.got, want:r.want, pass:r.ok })));
    console.log("[NIVA self-test] " + (R.length - failed.length) + "/" + R.length + " passed");
  }
  return { rows:R, failed:failed };
}
function openSelfTest(){
  let res;
  try{ res = runSelfTest(); }
  catch(e){
    openModal({ title:"Self-test crashed",
      body:'<pre class="mono" style="white-space:pre-wrap;font-size:12px">'+esc(String(e && e.stack || e))+'</pre>',
      actions:[{label:"Close", cls:"btn"}] });
    return;
  }
  const rows = res.rows.map(function(r){
    return '<tr><td style="font-size:12px">'+esc(r.name)+(r.note?'<div class="sub" style="color:var(--text-3);font-size:11px">'+esc(r.note)+'</div>':'')+'</td>'
      + '<td class="mono num" style="font-size:11.5px">'+esc(String(r.got))+'</td>'
      + '<td class="mono num" style="font-size:11.5px">'+esc(String(r.want))+'</td>'
      + '<td><span class="chip '+(r.ok?"pass":"fail")+'">'+(r.ok?"PASS":"FAIL")+'</span></td></tr>';
  }).join("");
  openModal({
    title: "Geometry self-test — " + (res.rows.length - res.failed.length) + "/" + res.rows.length + " passed",
    body: '<div style="margin-bottom:10px">'
        + '<span class="chip '+(res.failed.length?"fail":"pass")+'">'
        + (res.failed.length ? res.failed.length+" FAILING" : "ALL GREEN")+'</span> '
        + '<span class="hint" style="display:inline">Full table also written to the console.</span></div>'
        + '<div class="tblwrap" style="max-height:52vh;overflow:auto"><table class="tbl">'
        + '<thead><tr><th>Assertion</th><th>Got</th><th>Expected</th><th></th></tr></thead>'
        + '<tbody>'+rows+'</tbody></table></div>',
    actions:[{label:"Close", cls:"btn"}]
  });
}

/* ==========================================================
   14c. The gate — setup panel, login screen, session-expired prompt
   ------------------------------------------------------------
   Exactly one of three things can be in front of the app:

     unconfigured  the two constants at the top of this file are still
                   placeholders. Show what to paste and where. This is a
                   configuration state, not an error: nothing is logged to the
                   console and no request is attempted.

     signed out    a real email + password form.

     expired       the refresh token no longer works. The app SHELL STAYS
                   MOUNTED behind this: the local cache, the field workspace
                   and every queued write are untouched, and the outbox is
                   paused rather than drained under a dead token. Sign in as
                   the same user and the queue resumes exactly where it was.
   ========================================================== */
const NIVA_LOGO = '<svg viewBox="0 0 32 32" fill="none" aria-hidden="true">'
  + '<rect x="1" y="1" width="30" height="30" rx="8" fill="#0d9488"/>'
  + '<path d="M9 23V9l14 14V9" stroke="#04211f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function gateEl(){ return $("#gate"); }

function renderGate(){
  const el = gateEl();
  if(!el) return;
  if(!SB_CONFIGURED){ el.innerHTML = setupPanelHTML(); return; }
  if(Session.state === "expired"){ el.innerHTML = loginPanelHTML(true); focusLogin(); return; }
  if(!signedIn()){ el.innerHTML = loginPanelHTML(false); focusLogin(); return; }
  el.innerHTML = "";
}
function focusLogin(){
  const f = $("#lg_email") && !$("#lg_email").value ? $("#lg_email") : $("#lg_pw");
  if(f && document.activeElement !== f){ try{ f.focus(); }catch(e){} }
}

function setupPanelHTML(){
  return '<div class="gate"><div class="panel wide">'
    + '<div class="brandrow">' + NIVA_LOGO + '<div><h1>NIVA Field Ops — setup required</h1></div></div>'
    + '<p class="sub">This build talks to a Supabase project, and the two constants at the top of '
    + '<span class="mono">niva-merch-app.html</span> are still placeholders. Paste your project values and reload.</p>'
    + '<pre>const SUPABASE_URL  = "https://YOUR-PROJECT.supabase.co";\nconst SUPABASE_ANON = "YOUR-ANON-KEY";</pre>'
    + '<p class="sub" style="margin-top:14px">Find both in the Supabase dashboard under '
    + '<b>Project Settings → API</b>: <b>Project URL</b> and the <b>anon</b> <span class="mono">public</span> key.</p>'
    + '<div class="note">'
    + 'The <b>anon</b> key is publishable by design — every table in this schema runs '
    + '<span class="mono">force row level security</span> with policies granted only to '
    + '<span class="mono">authenticated</span>, so a request holding nothing but this key can read and write '
    + 'nothing. Authority comes from the signed-in user’s own token.<br><br>'
    + 'The <b>service_role</b> key bypasses RLS entirely and must never be pasted here, or into anything a browser loads.'
    + '<br><br>Before this will work, apply <span class="mono">supabase/migrations/0001…0004</span> and '
    + '<span class="mono">supabase/seed.sql</span> — see <span class="mono">supabase/README.md</span> and '
    + '<span class="mono">MIGRATION.md</span>.'
    + '</div></div></div>';
}

function loginPanelHTML(expired){
  const L = ui.login;
  const who = Session.user();
  return '<div class="gate"><div class="panel">'
    + '<div class="brandrow">' + NIVA_LOGO
    + '<div><h1>' + (expired ? "Session expired" : "NIVA Field Ops") + '</h1></div></div>'
    + (expired
        ? '<p class="sub">Your sign-in expired' + (who && who.email ? ' for <b>' + esc(who.email) + '</b>' : '')
          + '. Nothing has been lost: '
          + (Outbox.pending()
              ? '<b>' + Outbox.pending() + ' queued change' + (Outbox.pending()===1?'':'s') + '</b> and every capture on this device are still here, '
              : 'your local work is still here, ')
          + 'and syncing resumes as soon as you sign back in.</p>'
        : '<p class="sub">Sign in with your NIVA account. Your role and what you can see are decided by the server, not by this app.</p>')
    + (L.error ? '<div class="err">' + esc(L.error) + '</div>' : '')
    + '<form id="loginform" autocomplete="on">'
    + '<div class="fieldrow"><label for="lg_email">Email</label>'
    + '<input id="lg_email" name="email" type="email" autocomplete="username" spellcheck="false" '
    + 'inputmode="email" value="' + esc(L.email || (who && who.email) || "") + '"'
    + (expired && who && who.email ? ' readonly' : '') + '></div>'
    + '<div class="fieldrow"><label for="lg_pw">Password</label>'
    + '<input id="lg_pw" name="password" type="password" autocomplete="current-password"></div>'
    + '<button class="btn primary" type="submit" style="width:100%;justify-content:center" '
    + (L.busy ? 'disabled' : '') + '>' + (L.busy ? "Signing in…" : (expired ? "Sign in and resume" : "Sign in")) + '</button>'
    + '</form>'
    + (expired ? '<button class="btn ghost sm" data-act="signout" style="width:100%;justify-content:center;margin-top:8px">'
                 + 'Sign out and keep queued work on this device</button>' : '')
    + '<div class="note">' + (netUp()
        ? 'Signing in needs a connection. Once you are in, the app keeps working without one.'
        : '<b>This device is offline.</b> Signing in needs a connection — reconnect and try again.')
      + '</div>'
    + '</div></div>';
}

function doSignIn(){
  const L = ui.login;
  if(L.busy) return;
  const email = ($("#lg_email") || {}).value || "";
  const pw    = ($("#lg_pw") || {}).value || "";
  L.email = email;
  if(!email.trim() || !pw){ L.error = "Enter your email and password."; renderGate(); return; }
  L.busy = true; L.error = ""; renderGate();

  const resuming = Session.state === "expired";
  const prevUid  = Session.userId();

  Session.signIn(email, pw).then(function(){
    L.busy = false; L.error = ""; L.email = "";
    if(resuming && prevUid && Session.userId() !== prevUid){
      /* Different account on a device that still holds someone else's queued
         work. The outbox is tagged per user and will not drain under the wrong
         identity, so say so plainly rather than pretending it synced. */
      toast("Signed in as a different user. Work queued by the previous account stays on this device until they sign in.", true);
    }
    afterSignIn();
  }, function(err){
    L.busy = false;
    L.error = signInMessage(err);
    renderGate();
  });
}

/* GoTrue's failure modes, told apart so the human knows what to do. */
function signInMessage(err){
  const raw = String((err && err.message) || "").toLowerCase();
  const code = String((err && err.code) || "").toLowerCase();
  if(err && err.kind === "offline")
    return "Could not reach the server. Check your connection and try again.";
  if(err && err.kind === "timeout")
    return "The server did not answer in time. Try again.";
  if(err && err.kind === "server")
    return "The authentication service returned an error (" + err.status + "). Try again shortly.";
  if(err && err.nivaCode === "NIVA_NO_PROFILE")
    return "That login worked, but the account has no profile row in this project. An administrator has to create one before you can use the app.";
  if(code.indexOf("email_not_confirmed") >= 0 || raw.indexOf("not confirmed") >= 0)
    return "This email address has not been confirmed yet. Open the confirmation link, or turn off email confirmation in the Supabase dashboard for a demo project.";
  if(code.indexOf("invalid_credentials") >= 0 || code === "invalid_grant" ||
     raw.indexOf("invalid login") >= 0 || raw.indexOf("invalid_grant") >= 0)
    return "That email and password do not match an account in this project.";
  if(err && err.status === 429)
    return "Too many attempts. Wait a minute and try again.";
  if(err && err.kind === "config")
    return "This build has no Supabase project configured.";
  return (err && err.message) ? err.message : "Sign-in failed.";
}

/* Everything that has to happen once there is a session and a profile. */
function afterSignIn(){
  state = load();
  state.userId = Session.userId();
  view = { name: myRole()==="Merchandiser" ? "mytasks" : "dashboard", params:{} };
  renderGate();
  render();
  legacyDataNotice();
  maybeAskHeight();
  Outbox.kick();
  Poller.start();
  Repo.prime().then(function(){ render(); }, function(err){
    /* Cached data is still on screen. Only say something if there is nothing
       to show at all. */
    if(!state.everSynced) toast("Signed in, but could not load data: " + errText(err), true);
    render();
  });
}

/* Only `read_at` is writable on a notification, and only on rows addressed to
   you personally: niva_notifications_guard raises on any other column, and the
   notifications_update_own policy scopes it to target_user_id = auth.uid().
   Role broadcasts therefore have no server-side read state — those are marked
   read locally only, which is honest and is what the schema supports. */
function markNotifsRead(){
  const mine = [];
  myNotifs().forEach(function(n){
    if(!n.read && n.targetUserId === me().id) mine.push(n.id);
    n.read = true;
  });
  if(mine.length) Outbox.push("notif.read", { ids: mine, at: new Date().toISOString() },
                              { label: "Mark " + mine.length + " notification(s) read" });
  save(); toggleNotifs(); renderChrome();
}

/* Drop the local mirror and re-read from the server. Deliberately does NOT
   touch the outbox: unsynced work is not "demo data" and must never be thrown
   away by a refresh button. */
function doClearLocal(){
  const queued = Outbox.pending() + Outbox.failures().length;
  openModal({
    title: "Clear local cache?",
    body: '<p style="margin:0 0 10px;color:var(--text-2)">This drops this device’s copy of the tasks, '
      + 'audit trail and dashboard rollups and re-reads them from the server.</p>'
      + (queued
          ? '<p style="margin:0;color:var(--st-progress)"><b>' + queued + ' unsynced change'
            + (queued===1?'':'s') + ' and any photographs waiting to upload are kept.</b> '
            + 'They stay in the outbox and continue syncing.</p>'
          : '<p style="margin:0;color:var(--text-2)">There is nothing waiting to sync.</p>'),
    actions: [
      { label:"Cancel", cls:"btn" },
      { label:"Clear and re-read", cls:"btn primary", act: function(){
          closeModal();
          const k = cacheKey(); if(k) lsDel(k);
          Signer.clear();
          const ws0 = state.ws;                      // captures are unsynced work: keep them
          state = blankState(); state.userId = Session.userId(); state.ws = ws0;
          USERS = []; CAMPAIGNS = []; STORES = [];
          render();
          Repo.prime().then(function(){ render(); toast("Re-read from the server."); },
                            function(err){ render(); toast("Could not re-read: " + errText(err), true); });
        } }
    ]
  });
}

/* A device that ran the localStorage-only prototype still has its blob sitting
   there. It is NOT migrated: those rows have client-invented ids, no store
   master, no auth user to own them, and every RLS policy keys off a real
   auth.uid(). Inventing a mapping would be fabricating evidence. So say
   plainly that it is stranded, offer to remove it, and never mention it
   again. */
function legacyDataNotice(){
  if(lsGet(LEGACY_NOTICE_KEY)) return;
  const hasV2 = !!lsGet(LS_KEY), hasV1 = !!lsGet(LS_KEY_V1);
  if(!hasV2 && !hasV1) return;
  lsSet(LEGACY_NOTICE_KEY, "1");
  openModal({
    title: "Data from the old offline prototype is on this device",
    body: '<p style="margin:0 0 10px;color:var(--text-2)">This browser still holds the '
      + '<span class="mono">' + (hasV2 ? "niva.state.v2" : "niva.state.v1") + '</span> blob written by the '
      + 'pre-Supabase build. It has <b>not</b> been imported and it is not shown anywhere in this app.</p>'
      + '<p style="margin:0 0 10px;color:var(--text-2)">It cannot be imported honestly: those tasks were '
      + 'invented in the browser, they name no real store or user row, and none of them carry a server-side '
      + 'audit trail. Uploading them would put unverifiable records next to measured evidence.</p>'
      + '<p style="margin:0;color:var(--text-2)">Everything you do from now on lives in the project you are '
      + 'signed in to. You can safely remove the old blob.</p>',
    actions: [
      { label:"Keep it for now", cls:"btn" },
      { label:"Remove old prototype data", cls:"btn danger", act: function(){
          lsDel(LS_KEY); lsDel(LS_KEY_V1); closeModal(); toast("Old prototype data removed.");
        } }
    ]
  });
}

function doSignOut(){
  const queued = Outbox.pending();
  const finish = function(){
    Poller.stop();
    state = blankState();
    USERS = []; CAMPAIGNS = []; STORES = [];
    view = { name:"dashboard", params:{} };
    ui.login = { busy:false, error:"", email:"" };
    closePops(); closeModal();
    renderGate(); render();
  };
  if(queued){
    openModal({
      title: "Sign out with " + queued + " unsynced change" + (queued===1?"":"s") + "?",
      body: '<p style="margin:0 0 10px;color:var(--text-2)">'
        + 'There ' + (queued===1?'is':'are') + ' <b>' + queued + '</b> change'
        + (queued===1?'':'s') + ' queued on this device that ' + (queued===1?'has':'have')
        + ' not reached the server, including any photographs taken since your last sync.</p>'
        + '<p style="margin:0;color:var(--text-2)">Signing out keeps them. They stay queued against your account '
        + 'and resume the next time you sign in <b>on this device</b>. They are not sent from anywhere else.</p>',
      actions: [
        { label:"Stay signed in", cls:"btn" },
        { label:"Sign out and keep the queue", cls:"btn primary", act: function(){
            closeModal(); Session.signOut().then(finish, finish); } }

  }
  Session.signOut().then(finish, finish);
}

/* ---------- sync status: honest about what has and has not reached the server ---------- */
function syncStatus(){
  if(!SB_CONFIGURED)                  return { cls:"off", label:"Not configured", detail:"No Supabase project is configured in this build." };
  if(!signedIn())                     return { cls:"off", label:"Signed out", detail:"Sign in to sync." };
  if(Session.state === "expired")     return { cls:"bad", label:"Sign-in expired", detail:"Syncing is paused until you sign in again. Nothing has been lost." };
  const failed  = Outbox.failures().length;
  const pending = Outbox.pending();
  if(failed)                          return { cls:"bad", label: failed + " failed", detail:"Some changes were refused by the server and need your attention." };
  if(!netUp())                        return { cls:"off", label: pending ? ("Offline · " + pending + " queued") : "Offline",
                                                detail:"This device has no connection. Work is being saved locally and will sync automatically." };
  /* The browser thinks it is online but the server did not answer — a captive
     portal, a tunnel, 2G in a basement. An empty write queue does NOT make
     that "Synced": what is on screen is stale and the user has to know. */
  if(Repo.unreachable())              return { cls:"off",
                                                label: pending ? ("No server · " + pending + " queued") : "Can't reach the server",
                                                detail:"The last attempt to reach the server failed (" + errText(Repo.lastError())
                                                     + "). What you can see is this device's last copy"
                                                     + (state.syncedAt ? ", read " + ago(state.syncedAt) + "." : ".")
                                                     + (pending ? " " + pending + " change" + (pending===1?"":"s") + " are queued and will sync automatically." : "") };
  if(pending)                         return { cls:"busy", label: pending + " syncing", detail: pending + " change" + (pending===1?"":"s") + " still to reach the server." };
  if(Repo.busy())                     return { cls:"busy", label:"Refreshing", detail:"Reading the latest data from the server." };
  if(!state.everSynced)               return { cls:"busy", label:"Not synced yet",
                                                detail:"This device has not completed a read from the server yet." };
  return { cls:"", label:"Synced", detail:"Everything on this device has reached the server · read " + ago(state.syncedAt) + "." };
}

function openSyncPanel(){
  const s = syncStatus();
  const items = Outbox.items();
  const fails = Outbox.failures();
  const last  = Outbox.lastSynced();
  const rows = function(list, isFail){
    if(!list.length) return '<div class="hint" style="padding:8px 0">Nothing here.</div>';
    return '<div class="tblwrap" style="max-height:30vh;overflow:auto"><table class="tbl"><tbody>'
      + list.slice(0,40).map(function(it){
        const t = it.taskId ? taskById(it.taskId) : null;
        return '<tr><td style="font-size:12px"><b>'+esc(it.label||it.kind)+'</b>'
          + (t ? '<div class="sub" style="color:var(--text-3);font-size:11px">'+esc(t.storeName)+'</div>' : '')
          + (it.lastError ? '<div class="sub" style="color:var(--st-rework);font-size:11px">'+esc(it.lastError)+'</div>' : '')
          + '</td><td class="num mono" style="font-size:11px;white-space:nowrap">'+esc(fmtDT(it.createdAt))+'</td>'
          + '<td class="num" style="font-size:11px">'+(isFail ? "failed" : (it.tries ? it.tries+" tr" : "queued"))+'</td></tr>';
      }).join("") + '</tbody></table></div>';
  };
  const acts = [{label:"Close", cls:"btn"}];
  if(fails.length){
    acts.unshift({ label:"Discard failed", cls:"btn danger", act:function(){
      Outbox.discardFailed(); closeModal(); render(); toast("Failed changes discarded."); }});
    acts.unshift({ label:"Retry failed", cls:"btn primary", act:function(){
      Outbox.retryFailed(); closeModal(); render(); toast("Retrying "+fails.length+" change"+(fails.length===1?"":"s")+"."); }});
  }else if(items.length){
    acts.unshift({ label:"Sync now", cls:"btn primary", act:function(){
      Outbox.kick(); Poller.now(); closeModal(); toast("Sync requested."); }});
  }else{
    acts.unshift({ label:"Refresh from server", cls:"btn primary", act:function(){
      Poller.now(); closeModal(); toast("Refreshing."); }});
  }
  openModal({
    title:"Sync status",
    body: '<dl class="kv">'
      + '<dt>State</dt><dd><span class="chip '+(s.cls==="bad"?"fail":(s.cls?"neutral plain":"pass"))+'">'+esc(s.label)+'</span></dd>'
      + '<dt>Connection</dt><dd>'+(netUp()?"Online":"Offline")+'</dd>'
      + '<dt>Queued writes</dt><dd class="num">'+items.length+'</dd>'
      + '<dt>Failed writes</dt><dd class="num">'+fails.length+'</dd>'
      + '<dt>Last successful write</dt><dd>'+(last ? esc(fmtDT(last))+' · '+esc(ago(last)) : "never")+'</dd>'
      + '<dt>Last read from server</dt><dd>'+(state.syncedAt ? esc(fmtDT(state.syncedAt))+' · '+esc(ago(state.syncedAt)) : "never")+'</dd>'
      + '<dt>Local photos held</dt><dd class="num">'+Blobs.keys().length+'</dd>'
      + '<dt>Durable storage</dt><dd>'+(STORAGE_OK ? "yes" : '<span style="color:var(--st-rework)">NO — private mode or quota; queued work may not survive a reload</span>')+'</dd>'
      + '</dl>'
      + '<div class="sectlabel" style="margin-top:14px">Waiting to sync</div>' + rows(items, false)
      + (fails.length ? '<div class="sectlabel" style="margin-top:14px">Refused by the server</div>' + rows(fails, true)
                        + '<div class="hint" style="margin-top:8px">These were rejected on purpose — an illegal status change, a '
                        + 'permission the server does not grant you, or evidence the database will not let anyone edit. '
                        + 'Retrying will not help unless the underlying situation changed.</div>' : ''),
    actions: acts
  });
}
