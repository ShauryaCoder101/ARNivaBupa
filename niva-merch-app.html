   store first, so an image that has not uploaded yet still renders from the
   device — and the moment the outbox uploads it, the local copy is dropped and
   the same call transparently starts returning a signed URL.
   ========================================================== */
const Blobs = (function(){
  const mem = Object.create(null);       // key -> data URL, the synchronous read path
  let dbp = null;
  let idbBroken = false;

  function db(){
    if(idbBroken) return Promise.reject(SbError("permanent", "IndexedDB unavailable"));
    if(dbp) return dbp;
    dbp = new Promise(function(res, rej){
      let req;
      try{ req = indexedDB.open("niva.blobs", 1); }
      catch(e){ idbBroken = true; return rej(e); }
      req.onupgradeneeded = function(){
        try{ req.result.createObjectStore("img"); }catch(e){}
      };
      req.onsuccess = function(){ res(req.result); };
      req.onerror   = function(){ idbBroken = true; rej(req.error); };
      req.onblocked = function(){ idbBroken = true; rej(new Error("blocked")); };
    });
    dbp.catch(function(){ idbBroken = true; });
    return dbp;
  }
  function tx(mode, fn){
    return db().then(function(d){
      return new Promise(function(res, rej){
        const t = d.transaction("img", mode);
        const s = t.objectStore("img");
        let out;
        try{ out = fn(s); }catch(e){ return rej(e); }
        t.oncomplete = function(){ res(out && out.result !== undefined ? out.result : out); };
        t.onerror    = function(){ rej(t.error); };
        t.onabort    = function(){ rej(t.error); };
      });
    });
  }
  const LS_FALLBACK = "niva.blob.";

  return {
    /* Synchronous read — this is what the render path uses. */
    get: function(key){ return mem[key] || null; },
    has: function(key){ return !!mem[key]; },
    keys: function(){ return Object.keys(mem); },
    put: function(key, dataUrl){
      mem[key] = dataUrl;
      return tx("readwrite", function(s){ s.put(dataUrl, key); }).catch(function(){
        // No IndexedDB (Safari private mode, locked-down enterprise policy).
        // Fall back to localStorage and be honest if that fails too.
        if(!lsSet(LS_FALLBACK + key, dataUrl)){
          try{ toast("This capture is held in memory only — it will not survive a reload.", true); }catch(e){}
        }
      });
    },
    del: function(key){
      delete mem[key];
      lsDel(LS_FALLBACK + key);
      return tx("readwrite", function(s){ s.delete(key); }).catch(function(){});
    },
    /* Pull everything back into memory at boot, before the first render. */
    hydrate: function(){
      let n = 0;
      try{
        for(let i = 0; i < localStorage.length; i++){
          const k = localStorage.key(i);
          if(k && k.indexOf(LS_FALLBACK) === 0){ mem[k.slice(LS_FALLBACK.length)] = lsGet(k); n++; }
        }
      }catch(e){}
      return tx("readonly", function(s){
        const out = [];
        const req = s.openCursor();
        req.onsuccess = function(){
          const c = req.result;
          if(!c) return;
          mem[c.key] = c.value; out.push(c.key);
          c.continue();
        };
        return { get result(){ return out; } };
      }).then(function(keys){ return (keys ? keys.length : 0) + n; },
              function(){ return n; });
    },
    /* Drop anything the outbox no longer references, so a long-lived device
       does not accumulate uploaded bytes forever. */
    sweep: function(liveKeys){
      const live = Object.create(null);
      (liveKeys || []).forEach(function(k){ live[k] = 1; });
      const self = this;
      Object.keys(mem).forEach(function(k){ if(!live[k]) self.del(k); });
    }
  };
})();

/* ==========================================================
   2e. Session — GoTrue email + password
   ------------------------------------------------------------
   The access token lives in localStorage next to the refresh token, which is
   what supabase-js does and what makes "close the tab, come back tomorrow"
   work. A silent refresh is scheduled a minute before expiry; if it fails for
   a network reason it backs off and retries, and if it fails for an auth
   reason the session is marked EXPIRED rather than dropped — the outbox and
   the local cache stay exactly where they are, and the user is asked to sign
   in again. Nothing captured in the field is ever thrown away by a token.
   ========================================================== */
const Session = (function(){
  let s = null;            // { access_token, refresh_token, expires_at, user:{id,email} }
  let profile = null;      // the profiles row — the ONLY source of role
  let state = "signedout"; // "signedout" | "ready" | "expired"
  let timer = null;
  let refreshing = null;
  let backoff = 0;
  const subs = [];

  function emit(){ subs.slice().forEach(function(f){ try{ f(state); }catch(e){} }); }

  function persist(){
    if(!s){ lsDel(SESSION_KEY); return; }
    lsSet(SESSION_KEY, JSON.stringify({
      access_token: s.access_token, refresh_token: s.refresh_token,
      expires_at: s.expires_at, user: s.user, profile: profile
    }));
  }

  function adopt(body){
    const now = Math.floor(Date.now() / 1000);
    s = {
      access_token:  body.access_token,
      refresh_token: body.refresh_token,
      expires_at:    body.expires_at || (now + (body.expires_in || 3600)),
      user:          body.user ? { id: body.user.id, email: body.user.email } : (s ? s.user : null)
    };
    backoff = 0;
    persist();
    schedule();
  }

  function schedule(){
    if(timer){ clearTimeout(timer); timer = null; }
    if(!s) return;
    const now = Math.floor(Date.now() / 1000);
    let inS = (s.expires_at - 60) - now;         // refresh a minute early
    if(backoff) inS = Math.max(inS, backoff);
    if(inS < 5) inS = 5;
    if(inS > 3000) inS = 3000;                   // re-arm at least every 50 min
    timer = setTimeout(function(){ refresh().catch(function(){}); }, inS * 1000);
  }

  function refresh(){
    if(refreshing) return refreshing;
    if(!s || !s.refresh_token) return Promise.reject(SbError("auth", "No refresh token."));
    refreshing = sbRequest("/auth/v1/token?grant_type=refresh_token", {
      method: "POST", token: null, body: { refresh_token: s.refresh_token }, timeout: 15000
    }).then(function(r){
      refreshing = null;
      adopt(r.body);
      if(state === "expired"){ state = "ready"; emit(); }
      return s;
    }, function(err){
      refreshing = null;
      if(err.retryable){
        // The token is probably fine; we just cannot reach GoTrue. Try again.
        backoff = backoff ? Math.min(backoff * 2, 300) : 15;
        schedule();
      }else{
        state = "expired"; emit();
      }
      throw err;
    });
    return refreshing;
  }

  return {
    get state(){ return state; },
    token: function(){ return s ? s.access_token : null; },
    user:  function(){ return s ? s.user : null; },
    userId: function(){ return s && s.user ? s.user.id : null; },
    profile: function(){ return profile; },
    role: function(){ return profile ? profile.role : null; },
    onChange: function(f){ subs.push(f); },

    /* Whether a stored session exists at all — decides login screen vs app. */
    restore: function(){
      const raw = lsJSON(SESSION_KEY, null);
      if(!raw || !raw.access_token || !raw.refresh_token) return false;
      s = { access_token: raw.access_token, refresh_token: raw.refresh_token,
            expires_at: raw.expires_at || 0, user: raw.user || null };
      profile = raw.profile || null;
      const now = Math.floor(Date.now() / 1000);
      state = "ready";
      if(s.expires_at <= now + 30){
        // Token already dead. Try a refresh; stay "ready" optimistically so the
        // cached app is usable offline, and let the 401 path demote us.
        refresh().catch(function(){});
      }else schedule();
      return true;
    },

    signIn: function(email, password){
      return sbRequest("/auth/v1/token?grant_type=password", {
        method: "POST", token: null, timeout: 20000,
        body: { email: String(email || "").trim(), password: String(password || "") }
      }).then(function(r){
        adopt(r.body);
        return Session.loadProfile();
      }).then(function(){
        state = "ready"; persist(); emit();
        return profile;
      });
    },

    /* Role comes from here and from nowhere else. */
    loadProfile: function(){
      const uid = Session.userId();
      if(!uid) return Promise.reject(SbError("auth", "No session."));
      return REST.select("profiles", "select=id,full_name,role,title,region,is_active&id=eq." +
                          encodeURIComponent(uid) + "&limit=1")
        .then(function(rows){
          if(!rows.length){
            throw SbError("permanent", "Signed in, but this account has no profile row in the project.",
                          { nivaCode: "NIVA_NO_PROFILE" });
          }
          profile = rows[0];
          persist();
          return profile;
        });
    },

    /* Called by the outbox / repo when a request comes back 401. Does not drop
       the session: queued work and the local cache must survive. */
    markExpired: function(){
      if(state === "expired") return;
      state = "expired"; emit();
      refresh().catch(function(){});
    },

    signOut: function(){
      const had = s;
      if(timer){ clearTimeout(timer); timer = null; }
      const done = function(){
        s = null; profile = null; state = "signedout";
        lsDel(SESSION_KEY); emit();
      };
      if(had){
        return sbRequest("/auth/v1/logout", { method: "POST", timeout: 8000 })
          .then(done, done);
      }
      done();
      return Promise.resolve();
    },

    /* Force a refresh now (used when a 401 arrives mid-drain). */
    forceRefresh: refresh
  };
})();

/* ==========================================================
   2f. Signed-URL cache for private evidence
   ------------------------------------------------------------
   The evidence bucket is private, so every photo needs a signed URL. Signing
   inside the render path would mean a network round trip per <img> on every
   re-render, which on the approvals screen is dozens of requests for the same
   dozen objects. So: one batched sign per tick for whatever is newly visible,
   answers cached until they are close to expiry, and the cache persisted so a
   reload does not re-sign everything either.
   ========================================================== */
const Signer = (function(){
  let cache = lsJSON(SIGN_KEY, {});      // path -> { url, at }
  const wanted = Object.create(null);
  const failed = Object.create(null);
  let flushT = null, persistT = null;

  function persist(){
    if(persistT) return;
    persistT = setTimeout(function(){
      persistT = null;
      const now = Date.now();
      const keep = {};
      Object.keys(cache).forEach(function(p){
        if(now - cache[p].at < SIGNED_URL_TTL_S * 1000) keep[p] = cache[p];
      });
      cache = keep;
      lsSet(SIGN_KEY, JSON.stringify(cache));
    }, 1500);
  }

  function flush(){
    flushT = null;
    const paths = Object.keys(wanted).slice(0, 100);
    if(!paths.length) return;
    paths.forEach(function(p){ delete wanted[p]; });
    if(!SB_CONFIGURED || Session.state !== "ready"){ return; }
    Storage.signMany("evidence", paths, SIGNED_URL_TTL_S).then(function(rows){
      let any = false;
      rows.forEach(function(row){
        const p = String(row.path || "").replace(/^\/+/, "");
        if(row.signedURL || row.signedUrl){
          const rel = row.signedURL || row.signedUrl;
          cache[p] = { url: SB_BASE + "/storage/v1" + (rel.indexOf("/") === 0 ? rel : "/" + rel), at: Date.now() };
          delete failed[p];
          any = true;
        }else{
          // Missing object (the seed ships metadata with no bytes) or no
          // permission. Either way, stop asking; the caller falls back.
          failed[p] = Date.now();
        }
      });
      persist();
      if(any) scheduleRerender();
    }, function(err){
      if(err.kind === "auth") Session.markExpired();
      // Do not mark paths failed on a transport error — try again next render.
      paths.forEach(function(p){ delete failed[p]; });
    });
  }

  let rerenderT = null;
  function scheduleRerender(){
    if(rerenderT) return;
    rerenderT = setTimeout(function(){ rerenderT = null; try{ render(); }catch(e){} }, 120);
  }

  return {
    /* Synchronous: a usable URL now, or null plus a queued sign. */
    urlFor: function(path){
      const hit = cache[path];
      const now = Date.now();
      if(hit){
        if(now - hit.at < SIGNED_URL_REFRESH_S * 1000) return hit.url;
        wanted[path] = 1;                    // stale-while-revalidate
        if(!flushT) flushT = setTimeout(flush, 40);
        return hit.url;
      }
      if(failed[path] && now - failed[path] < 60000) return null;
      wanted[path] = 1;
      if(!flushT) flushT = setTimeout(flush, 40);
      return null;
    },
    forget: function(path){ delete cache[path]; delete failed[path]; },
    clear: function(){ cache = {}; lsDel(SIGN_KEY); }
  };
})();

/* ==========================================================
   2g. Outbox — the durable write queue
   ------------------------------------------------------------
   Every mutation in this app goes in here first and is applied to the server
   second. That inversion is the whole offline story: a merchandiser in a shop
   basement gets the same UX as one on 5G, and the queue survives a reload, a
   browser restart, an expired token and a flat battery.

   IDEMPOTENCY. Retrying a write whose response was lost must not create a
   second row. Every insert carries a CLIENT-GENERATED uuid primary key, so a
   duplicate POST comes back 409 / 23505 on the *_pkey constraint and is
   treated as success. Storage uploads use a fresh uuid filename per capture and
   never set upsert, so a duplicate PUT is likewise a benign 409. The one table
   that cannot work this way is `audit_events` (bigint identity PK), so a retry
   there first probes for an identical row before re-posting.

   ORDERING. Items drain strictly FIFO and are tagged with a `group`. A group is
   an atomic-ish unit of work: a submission is
     [upload bytes] -> [insert placements] -> [insert image rows] -> [patch task]
   because the storage policy and the RLS policies both require the task to
   still be open when the evidence lands. If any item in a group fails
   permanently the rest of that group is cancelled together, so a task can never
   end up Submitted with half its evidence missing.
   ========================================================== */
const Outbox = (function(){
  let items = [];
  let dead  = [];
  let draining = false;
  let timer = null;
  let lastSyncedAt = lsJSON("niva.lastsync.v1", null);
  const subs = [];

  function emit(){
    subs.slice().forEach(function(f){ try{ f(); }catch(e){} });
  }
  function persist(){
    lsSet(OUTBOX_KEY, JSON.stringify({ v: 1, items: items, dead: dead.slice(0, 50) }));
    emit();
  }
  function restore(){
    const p = lsJSON(OUTBOX_KEY, null);
    if(p && Array.isArray(p.items)) items = p.items;
    if(p && Array.isArray(p.dead))  dead  = p.dead;
  }

  function online(){
    return (typeof navigator === "undefined" || navigator.onLine !== false);
  }

  /* Which of my queued bytes are still needed — used to sweep IndexedDB. */
  function liveBlobKeys(){
    const out = [];
    items.forEach(function(it){ if(it.blobKey) out.push(it.blobKey); });
    return out;
  }

  function cancelGroup(group, reason){
    if(!group) return;
    const keep = [];
    items.forEach(function(it){
      if(it.group === group){
        it.lastError = it.lastError || reason;
        dead.unshift(it);
      }else keep.push(it);
    });
    items = keep;
  }

  function retryDelay(tries){
    const base = Math.min(60000, 1000 * Math.pow(2, Math.max(0, tries - 1)));
    return base + Math.floor(Math.random() * 400);
  }

  /* ---- per-kind execution ---- */
  function run(it){
    switch(it.kind){
      case "store.upsert":   return runStoreUpsert(it);
      case "task.insert":    return REST.insert("tasks", it.payload.row).then(afterTaskInsert(it));
      case "task.patch":     return runTaskPatch(it);
      case "placement.insert":
        return REST.insert("placements", it.payload.row).then(function(rows){
          Sync.onPlacementInserted(it, rows[0] || it.payload.row);
        });
      case "image.upload":   return runUpload(it);
      case "image.insert":
        return REST.insert("task_images", it.payload.row).then(function(rows){
          Sync.onImageInserted(it, rows[0] || it.payload.row);
        });
      case "audit.insert":   return runAudit(it);
      case "notif.insert":
        return REST.insert("notifications", it.payload.row).then(function(){});
      case "notif.read":
        return REST.patch("notifications",
          "id=in.(" + it.payload.ids.map(encodeURIComponent).join(",") + ")",
          { read_at: it.payload.at }).then(function(){});
      case "image.delete":
        return REST.remove("task_images", "id=eq." + encodeURIComponent(it.payload.id))
          .then(function(){}, function(e){ if(e.kind === "permanent" || e.status === 404) return; throw e; });
    }
    return Promise.reject(SbError("permanent", "Unknown outbox op: " + it.kind));
  }

  function benignDuplicate(err){
    return err.kind === "conflict" &&
      (/_pkey/.test(String(err.message)) || /Key \(id\)/.test(String(err.details)) ||
       /resource already exists|The resource already exists|Duplicate/i.test(String(err.message)));
  }

  function afterTaskInsert(it){
    return function(rows){ Sync.onTaskInserted(it, rows[0] || it.payload.row); };
  }

  /* A store created offline may collide with one that already exists (the
     unique index is on lower(store_code), not on the id we invented). When it
     does, adopt the server's row and rewrite every queued reference to our id. */
  function runStoreUpsert(it){
    return REST.insert("stores", it.payload.row).then(function(rows){
      Sync.onStoreInserted(it, rows[0] || it.payload.row);
    }, function(err){
      if(err.kind !== "conflict") throw err;
      if(benignDuplicate(err)){ Sync.onStoreInserted(it, it.payload.row); return; }
      return REST.select("stores", "select=*&store_code=eq." +
                         encodeURIComponent(it.payload.row.store_code) + "&limit=1")
        .then(function(rows){
          if(!rows.length) throw err;
          remapId(it.payload.row.id, rows[0].id);
          Sync.onStoreInserted(it, rows[0]);
        });
    });
  }

  /* PATCHing a status that the server has already applied comes back as
     NIVA_ILLEGAL_TRANSITION. That is not a failure — it is a duplicate. Ask the
     server what the status actually is and reconcile. */
  function runTaskPatch(it){
    const q = "id=eq." + encodeURIComponent(it.payload.taskId);
    return REST.patch("tasks", q, it.payload.patch).then(function(rows){
      if(!rows.length){
        // RLS matched no row for the UPDATE. Either someone else moved it out
        // from under us or we may no longer touch it. Find out before deciding.
        return REST.select("tasks", "select=*&" + q + "&limit=1").then(function(cur){
          if(!cur.length) throw SbError("forbidden", "The server did not accept the change and the task is no longer visible to you.");
          Sync.onTaskPatched(it, cur[0], true);
        });
      }
      Sync.onTaskPatched(it, rows[0], false);
    }, function(err){
      const target = it.payload.patch && it.payload.patch.status;
      if(target && (err.nivaCode === "NIVA_ILLEGAL_TRANSITION" || err.kind === "forbidden")){
        return REST.select("tasks", "select=*&" + q + "&limit=1").then(function(cur){
          if(cur.length && cur[0].status === target){
            Sync.onTaskPatched(it, cur[0], true);   // already applied — benign
            return;
          }
          throw err;
        }, function(){ throw err; });
      }
      throw err;
    });
  }

  /* Does this object already exist in the bucket? Asking the sign endpoint is
     the cheapest existence check that works on a PRIVATE bucket: it answers
     per-path with either a signedURL or an error, and it needs no policy we do
     not already rely on for rendering evidence. */
  function objectExists(bucket, path){
    return Storage.signMany(bucket, [path], 60).then(function(rows){
      for(let i = 0; i < rows.length; i++){
        const p = String(rows[i].path || "").replace(/^\/+/, "");
        if(p === path && (rows[i].signedURL || rows[i].signedUrl)) return true;
      }
      return false;
    }, function(err){
      if(err && err.retryable) throw err;      // transport problem — not an answer
      return false;
    });
  }

  function runUpload(it){
    const data = Blobs.get(it.blobKey);
    if(!data){
      /* The bytes are gone. Three ways that happens, and they are NOT the same:
           a) this exact object already uploaded on an earlier attempt and the
              blob was dropped, but a LATER item in the group failed and the
              user has re-queued the submission;
           b) the browser evicted IndexedDB;
           c) a sweep raced us.
         (a) is recoverable and common on a flaky link, so ask the server
         whether the object is already there before declaring evidence lost.
         Only if it genuinely is not do we fail — and we fail loudly, because
         silently "succeeding" would mark a task submitted with no photo. */
      return objectExists(it.payload.bucket, it.payload.path).then(function(there){
        if(there){ Sync.onUploaded(it); return; }
        throw SbError("permanent", "The captured image bytes are no longer on this device and never reached the server.");
      });
    }
    return Storage.upload(it.payload.bucket, it.payload.path, data, it.payload.contentType)
      .then(function(){ Sync.onUploaded(it); },
            function(err){
              if(err.kind === "conflict"){ Sync.onUploaded(it); return; }   // already there
              throw err;
            });
  }

  /* audit_events has a server-assigned identity PK, so it is the one write we
     cannot make idempotent by construction. On any retry, look first. */
  function runAudit(it){
    const row = it.payload.row;
    const probe = function(){
      /* `tries` is incremented before run(), so the FIRST attempt arrives here
         with tries === 1. Probing then would be a wasted round trip on every
         audit event, and worse, could collapse two genuinely distinct events
         that share a task, an action and a millisecond. Only a real RETRY
         needs to look first. */
      if(it.tries <= 1) return Promise.resolve(false);
      let q = "select=id&limit=1&occurred_at=eq." + encodeURIComponent(row.occurred_at) +
              "&action=eq." + encodeURIComponent(row.action);
      if(row.task_id) q += "&task_id=eq." + encodeURIComponent(row.task_id);
      return REST.select("audit_events", q).then(function(rows){ return rows.length > 0; },
                                                 function(){ return false; });
    };
    return probe().then(function(exists){
      if(exists) return;
      return REST.insert("audit_events", row, { returning: "minimal" }).then(function(){});
    });
  }

  /* Rewrite a provisional client id everywhere it is still referenced. */
  function remapId(oldId, newId){
    if(!oldId || !newId || oldId === newId) return;
    const walk = function(o){
      if(!o || typeof o !== "object") return;
      Object.keys(o).forEach(function(k){
        if(o[k] === oldId) o[k] = newId;
        else if(o[k] && typeof o[k] === "object") walk(o[k]);
      });
    };
    items.forEach(walk);
    Sync.onIdRemapped(oldId, newId);
  }

  /* Parking on a transient blocker (no session, no radio) used to be a dead
     end: step() returned and only an explicit kick() could ever restart it. A
     silent token refresh, or a network that came back without firing an
     `online` event, therefore left durable work sitting in the queue
     indefinitely. Every transient bail now re-arms a slow heartbeat, so the
     queue is self-healing even if nothing else in the app notices. */
  const PARK_MS = 15000;
  function park(){ schedule(PARK_MS); }

  function step(){
    if(draining) return;
    if(!items.length){ draining = false; return; }
    if(!SB_CONFIGURED) return;                     // never resolvable at runtime
    if(Session.state !== "ready"){ return park(); }
    if(!online()){ return park(); }

    const it = items[0];
    if(it.userId && it.userId !== Session.userId()) {
      // Queued by a different account on this device. Never drain it under the
      // wrong identity; park it until that user signs back in.
      const mine = items.filter(function(x){ return !x.userId || x.userId === Session.userId(); });
      if(!mine.length) return;                     // all of it belongs to someone else — nothing to do

      items = mine.concat(items.filter(function(x){ return x.userId && x.userId !== Session.userId(); }));
      persist();
      return schedule(0);
    }
    if(it.nextAt && it.nextAt > Date.now()){ return schedule(it.nextAt - Date.now()); }

    draining = true;
    it.tries = (it.tries || 0) + 1;
    emit();

    let p;
    try{ p = run(it); }catch(e){ p = Promise.reject(e); }

    Promise.resolve(p).then(function(){
      draining = false;
      items.shift();
      it.lastError = null;
      lastSyncedAt = new Date().toISOString();
      lsSet("niva.lastsync.v1", JSON.stringify(lastSyncedAt));
      if(it.blobKey && it.kind === "image.upload") Blobs.del(it.blobKey);
      persist();
      schedule(0);
    }, function(err){
      draining = false;
      if(benignDuplicate(err)){
        // A retry of something that already landed.
        items.shift(); persist(); schedule(0); return;
      }
      if(err.kind === "auth"){
        it.lastError = errText(err);
        Session.markExpired();
        persist();
        return;                              // paused until re-auth
      }
      if(err.retryable){
        /* One delay, used for both the stored deadline and the timer. Calling
           retryDelay() twice would jitter them apart and wake step() early for
           nothing. */
        const wait = retryDelay(it.tries);
        it.lastError = errText(err);
        it.nextAt = Date.now() + wait;
        persist();
        schedule(wait);
        return;
      }
      // Permanent. Take the whole group down together and tell the human.
      it.lastError = errText(err) + (err.hint ? " (" + err.hint + ")" : "");
      it.failedAt = new Date().toISOString();
      items.shift();
      dead.unshift(it);
      if(it.group) cancelGroup(it.group, "Cancelled because an earlier step in the same submission failed.");
      Sync.onOpFailed(it, err);
      persist();
      schedule(0);
    });
  }

  function schedule(ms){
    if(timer) clearTimeout(timer);
    timer = setTimeout(function(){ timer = null; step(); }, Math.max(0, ms || 0));
  }

  return {
    restore: restore,
    onChange: function(f){ subs.push(f); },
    /* push(kind, payload, opts) -> the op id */
    push: function(kind, payload, opts){
      opts = opts || {};
      const it = {
        id: uuid4(), userId: Session.userId(), group: opts.group || null,
        kind: kind, payload: payload, blobKey: opts.blobKey || null,
        label: opts.label || kind, taskId: opts.taskId || null,
        createdAt: new Date().toISOString(), tries: 0, nextAt: 0, lastError: null
      };
      items.push(it);
      persist();
      schedule(0);
      return it.id;
    },
    kick: function(){ schedule(0); },
    pending: function(){ return items.length; },
    pendingFor: function(taskId){
      let n = 0; items.forEach(function(it){ if(it.taskId === taskId) n++; }); return n;
    },
    groupPending: function(group){
      let n = 0; items.forEach(function(it){ if(it.group === group) n++; }); return n;
    },
    items: function(){ return items.slice(); },
    failures: function(){ return dead.slice(); },
    /* Is this op still un-landed? The render layer asks so it can keep showing
       a locally-created audit entry or notification that the server has not
       accepted yet, instead of having a poll silently erase it. */
    has: function(opId){
      if(!opId) return false;
      for(let i = 0; i < items.length; i++) if(items[i].id === opId) return true;
      for(let j = 0; j < dead.length;  j++) if(dead[j].id  === opId) return true;
      return false;
    },
    lastSynced: function(){ return lastSyncedAt; },
    busy: function(){ return draining; },
    liveBlobKeys: liveBlobKeys,
    retryFailed: function(){
      const back = dead.splice(0, dead.length);
      back.reverse().forEach(function(it){
        it.tries = 0; it.nextAt = 0; it.lastError = null; delete it.failedAt;
        items.push(it);
      });
      persist(); schedule(0);
    },
    discardFailed: function(){
      dead.forEach(function(it){ if(it.blobKey) Blobs.del(it.blobKey); });
      dead = []; persist();
    },
    /* Wipe everything belonging to nobody / to this user (sign-out reset). */
    clearAll: function(){
      items.forEach(function(it){ if(it.blobKey) Blobs.del(it.blobKey); });
      items = []; dead = []; persist();
    }
  };
})();

/* ==========================================================
   3. Programmatic placeholder imagery (canvas -> data URL)
   ========================================================== */
const IMG_CACHE = Object.create(null);
function genShot(code, kind, idx){
  const key = code+"|"+kind+"|"+idx;
  if(IMG_CACHE[key]) return IMG_CACHE[key];
  const W=560,H=380;
  const c = document.createElement("canvas"); c.width=W; c.height=H;
  const x = c.getContext("2d");
  const hue = hashCode(code) % 360;
  const after = kind === "AFTER";
  const sat = after ? 46 : 12;
  const lit = after ? 34 : 26;

  const g = x.createLinearGradient(0,0,W,H);
  g.addColorStop(0, "hsl("+hue+","+sat+"%,"+(lit+12)+"%)");
  g.addColorStop(1, "hsl("+((hue+40)%360)+","+sat+"%,"+(lit-8)+"%)");
  x.fillStyle=g; x.fillRect(0,0,W,H);

  // floor
  x.fillStyle = "rgba(0,0,0,.28)"; x.fillRect(0,H-72,W,72);
  // shelving / fixture
  const rnd = mulberry(hashCode(code+kind+idx));
  x.strokeStyle="rgba(255,255,255,.16)"; x.lineWidth=2;
  for(let i=1;i<5;i++){ const y=44+i*54; x.beginPath(); x.moveTo(28,y); x.lineTo(W-28,y); x.stroke(); }
  // products
  for(let r=0;r<4;r++){
    for(let i=0;i<9;i++){
      if(!after && rnd()<0.42) continue;
      const w = 30+rnd()*14, h = 26+rnd()*16;
      const px = 34 + i*(W-80)/9 + rnd()*4, py = 44+r*54 - h;
      x.fillStyle = after
        ? "hsl("+((hue + i*9)%360)+",68%,"+(52+rnd()*16)+"%)"
        : "hsla(0,0%,"+(58+rnd()*22)+"%,.72)";
      x.fillRect(px,py,w,h);
      x.fillStyle="rgba(255,255,255,.20)"; x.fillRect(px,py,w,5);
    }
  }
  if(after){
    // branding header panel
    x.fillStyle="hsl("+hue+",74%,46%)"; x.fillRect(24,18,W-48,42);
    x.fillStyle="rgba(255,255,255,.94)";
    x.font="700 21px system-ui, sans-serif"; x.textAlign="center";
    x.fillText("BRAND DISPLAY INSTALLED", W/2, 46);
  }
  // vignette
  const vg = x.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.92);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.45)");
  x.fillStyle=vg; x.fillRect(0,0,W,H);

  // label plate
  x.textAlign="left";
  x.fillStyle="rgba(6,12,20,.78)"; x.fillRect(0,H-46,W,46);
  x.fillStyle= after ? "#5eead4" : "#cbd5e1";
  x.font="800 17px ui-monospace, Menlo, monospace";
  x.fillText(kind + (idx>0 ? " #"+(idx+1) : ""), 14, H-24);
  x.fillStyle="#e2e8f0"; x.font="600 13px ui-monospace, Menlo, monospace";
  x.fillText(code, 14, H-8);
  x.textAlign="right"; x.fillStyle="rgba(226,232,240,.6)"; x.font="500 11px ui-monospace, Menlo, monospace";
  x.fillText("NIVA SAMPLE IMAGE", W-14, H-8);

  const url = c.toDataURL("image/jpeg", 0.68);
  IMG_CACHE[key] = url;
  return url;
}
// Simulated live capture (used by both Manager before-photo and Merchandiser after-photo)
function simulateCapture(code, kind, idx, meta){
  const base = genShot(code, kind, (idx||0));
  return new Promise(function(resolve){
    const im = new Image();
    im.onload = function(){
      const c = document.createElement("canvas"); c.width=im.width; c.height=im.height;
      const x = c.getContext("2d");
      x.drawImage(im,0,0);
      x.fillStyle="rgba(6,12,20,.62)"; x.fillRect(0,0,c.width,26);
      x.fillStyle="#5eead4"; x.font="700 12px ui-monospace, Menlo, monospace"; x.textAlign="left";
      x.fillText("● SIMULATED CAPTURE  " + (meta||""), 10, 18);
      resolve(c.toDataURL("image/jpeg", 0.7));
    };
    im.onerror = function(){ resolve(base); };
    im.src = base;
  });
}
/* Poster artwork placeholder — drawn at the poster's true aspect ratio so the
   overlay geometry is exercised end-to-end even without a real upload. */
function genPoster(seed, wFt, hFt){
  const w = Math.max(0.25, Number(wFt)||4), h = Math.max(0.25, Number(hFt)||3);
  const key = "poster|"+seed+"|"+w+"|"+h;
  if(IMG_CACHE[key]) return IMG_CACHE[key];
  const long = 760, ar = w/h;
  const W = ar >= 1 ? long : Math.round(long*ar);
  const H = ar >= 1 ? Math.round(long/ar) : long;
  const c = document.createElement("canvas"); c.width=W; c.height=H;
  const x = c.getContext("2d");
  const hue = hashCode(String(seed)) % 360;
  const rnd = mulberry(hashCode(String(seed)+"poster"));

  const g = x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,"hsl("+hue+",72%,46%)");
  g.addColorStop(1,"hsl("+((hue+38)%360)+",76%,30%)");
  x.fillStyle=g; x.fillRect(0,0,W,H);

  // diagonal light sweep
  x.save(); x.globalAlpha=.10; x.fillStyle="#fff";
  x.beginPath(); x.moveTo(0,H*0.72); x.lineTo(W,H*0.30); x.lineTo(W,H); x.lineTo(0,H); x.closePath(); x.fill();
  x.restore();

  const pad = Math.round(Math.min(W,H)*0.055);
  // brand block
  const bbH = Math.round(H*0.15);
  x.fillStyle="rgba(6,12,20,.88)"; x.fillRect(pad,pad,W-pad*2,bbH);
  x.fillStyle="#fff"; x.textAlign="left";
  x.font="800 "+Math.round(bbH*0.44)+"px system-ui, sans-serif";
  x.fillText("NIVA", pad+Math.round(bbH*0.30), pad+Math.round(bbH*0.63));
  x.fillStyle="hsl("+hue+",85%,62%)";
  x.font="700 "+Math.round(bbH*0.24)+"px ui-monospace, Menlo, monospace";
  x.fillText("KEY VISUAL", pad+Math.round(bbH*0.30)+Math.round(bbH*1.55), pad+Math.round(bbH*0.60));

  // headline
  x.fillStyle="#fff"; x.textAlign="center";
  const hlY = pad+bbH+Math.round(H*0.14);
  x.font="800 "+Math.round(Math.min(W*0.115,H*0.14))+"px system-ui, sans-serif";
  x.fillText("FRESH", W/2, hlY);
  x.font="800 "+Math.round(Math.min(W*0.115,H*0.14))+"px system-ui, sans-serif";
  x.fillText("EVERY DAY", W/2, hlY+Math.round(Math.min(W*0.125,H*0.155)));

  // product silhouette — a bottle, centred in the lower two-thirds
  const cx0 = W/2, baseY = H-pad-Math.round(H*0.14);
  const bh = Math.round(H*0.34), bw = Math.round(Math.min(W*0.22, bh*0.46));
  x.fillStyle="rgba(6,12,20,.82)";
  x.beginPath();
  x.moveTo(cx0-bw/2, baseY);
  x.lineTo(cx0-bw/2, baseY-bh*0.62);
  x.quadraticCurveTo(cx0-bw/2, baseY-bh*0.80, cx0-bw*0.19, baseY-bh*0.84);
  x.lineTo(cx0-bw*0.19, baseY-bh*0.97);
  x.lineTo(cx0+bw*0.19, baseY-bh*0.97);
  x.lineTo(cx0+bw*0.19, baseY-bh*0.84);
  x.quadraticCurveTo(cx0+bw/2, baseY-bh*0.80, cx0+bw/2, baseY-bh*0.62);
  x.lineTo(cx0+bw/2, baseY); x.closePath(); x.fill();
  x.fillStyle="hsl("+((hue+18)%360)+",88%,58%)";
  x.fillRect(cx0-bw/2, baseY-bh*0.46, bw, Math.round(bh*0.17));
  x.fillStyle="rgba(255,255,255,.22)";
  x.fillRect(cx0-bw*0.34, baseY-bh*0.60, Math.round(bw*0.14), Math.round(bh*0.42));
  for(let i=0;i<3;i++){
    x.fillStyle="rgba(255,255,255,"+(0.10+rnd()*0.06).toFixed(3)+")";
    x.beginPath(); x.arc(cx0+(rnd()-0.5)*W*0.7, baseY-bh*(0.3+rnd()), Math.round(W*0.035), 0, Math.PI*2); x.fill();
  }

  // footer strip with the true physical size
  const fH = Math.round(H*0.085);
  x.fillStyle="rgba(6,12,20,.9)"; x.fillRect(0,H-fH,W,fH);
  x.fillStyle="#8fe6db"; x.textAlign="left";
  x.font="700 "+Math.round(fH*0.44)+"px ui-monospace, Menlo, monospace";
  x.fillText(w.toFixed(1)+" ft × "+h.toFixed(1)+" ft", Math.round(fH*0.5), H-Math.round(fH*0.32));
  x.textAlign="right"; x.fillStyle="rgba(226,232,240,.55)";
  x.font="500 "+Math.round(fH*0.36)+"px ui-monospace, Menlo, monospace";
  x.fillText("SAMPLE ARTWORK", W-Math.round(fH*0.5), H-Math.round(fH*0.32));

  const url = c.toDataURL("image/jpeg", 0.76);
  IMG_CACHE[key] = url;
  return url;
}
/* Mirrors simulateCapture(): stamps the generated artwork as an on-device "capture". */
function simulatePosterArt(seed, wFt, hFt, meta){
  const base = genPoster(seed, wFt, hFt);
  return new Promise(function(resolve){
    const im = new Image();
    im.onload = function(){
      const c = document.createElement("canvas"); c.width=im.width; c.height=im.height;
      const x = c.getContext("2d");
      x.drawImage(im,0,0);
      x.fillStyle="rgba(6,12,20,.62)"; x.fillRect(0,0,c.width,24);
      x.fillStyle="#5eead4"; x.font="700 11px ui-monospace, Menlo, monospace"; x.textAlign="left";
      x.fillText("● SIMULATED ARTWORK  " + (meta||""), 9, 16);
      resolve(c.toDataURL("image/jpeg", 0.74));
    };
    im.onerror = function(){ resolve(base); };
    im.src = base;
  });
}
/* A neutral 4:3 tile shown while a signed URL is being minted. Inline so it
   costs no request and cannot itself fail. */
const IMG_PENDING = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380">' +
  '<rect width="560" height="380" fill="#1b2430"/>' +
  '<g fill="none" stroke="#31435a" stroke-width="3">' +
  '<rect x="222" y="152" width="116" height="82" rx="8"/><path d="M232 226l30-28 22 20 26-30 28 38"/></g>' +
  '<circle cx="302" cy="176" r="8" fill="#31435a"/>' +
  '<text x="280" y="272" fill="#5b7391" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle">loading evidence…</text></svg>');

/* The single choke point every <img src> in this app goes through.
   Sentinels:
     gen:CODE:KIND:IDX     procedurally generated placeholder (offline demo)
     poster:SEED:W:H       procedurally generated key visual
     sb:evidence:<path>    PRIVATE object — local bytes if not uploaded yet,
                           otherwise a cached signed URL
     sbp:<bucket>:<path>   PUBLIC object (poster-artwork), no signing needed */
function resolveImg(src){
  if(!src) return "";
  if(src.indexOf("gen:")===0){
    const p = src.split(":");           // gen:CODE:KIND:IDX
    return genShot(p[1], p[2], Number(p[3]||0));
  }
  if(src.indexOf("poster:")===0){
    const p = src.split(":");           // poster:SEED:W:H
    return genPoster(p[1], Number(p[2]), Number(p[3]));
  }
  if(src.indexOf("sbp:")===0){
    const i = src.indexOf(":", 4);
    return Storage.publicUrl(src.slice(4, i), src.slice(i+1));
  }
  if(src.indexOf("sb:")===0){
    const i = src.indexOf(":", 3);
    const bucket = src.slice(3, i), path = src.slice(i+1);
    // Bytes still on this device (captured offline, or queued for upload).
    const local = Blobs.get(bucket + "/" + path);
    if(local) return local;
    if(bucket !== "evidence") return Storage.publicUrl(bucket, path);
    return Signer.urlFor(path) || IMG_PENDING;
  }
  return src;
}

/* ==========================================================
   4. Directory & campaign master  (mirrors of Supabase tables)
   ------------------------------------------------------------
   The prototype hard-coded these. They are now caches of `public.profiles`,
   `public.campaigns` and `public.stores`, filled by Repo.prime() and persisted
   with the rest of the render cache so every view still renders with no
   network. Nothing here is authoritative: RLS decides which rows a given
   session can see at all, and an EMPTY ARRAY IS A LEGITIMATE ANSWER — a
   merchandiser genuinely sees a handful of profiles and one campaign. It is
   never reported as a load failure.
   ========================================================== */
let USERS     = [];   // mapProfile rows
let CAMPAIGNS = [];   // mapCampaign rows
let STORES    = [];   // mapStore rows

const userById    = id => USERS.filter(u=>u.id===id)[0] || {id:id, name:"Unknown user", role:"—", title:""};
const storeById   = id => STORES.filter(s=>s.id===id)[0] || null;
const storeByCode = c  => STORES.filter(s=>String(s.code).toUpperCase()===String(c||"").toUpperCase())[0] || null;
const merchandisers = () => USERS.filter(u=>u.role==="Merchandiser" && u.active !== false);
const posterDefaults = cid => (campaignById(cid).poster) ||
  { w:4.0, h:3.0, standoff:STANDOFF_FT, tol:STANDOFF_TOL_FT, angleTol:ANGLE_TOL_DEG };

/* ---- placement verification record ----
   Written by the guided capture flow and, for the seed, synthesised here so the
   approvals panel and dashboard KPI have something to render on first run. */
function blankPlacement(){
  return { tier:"C", tierLabel:"Unverified", distanceFt:null, targetFt:STANDOFF_FT, tolFt:STANDOFF_TOL_FT,
           distanceOk:false, distanceSource:"manual entry",
           pitchDeg:null, rollDeg:null, yawDeg:null, angleTolDeg:ANGLE_TOL_DEG,
           pitchOk:false, rollOk:false, yawOk:false, yawVerified:false,
           focalPx:null, focalSource:"—", posterWFt:null, posterHFt:null,
           captureMode:"manual", pass:false, ts:null, note:"" };
}
/* A capture only counts as "placement verified" if every gate passed AND the
   distance came from a real AR measurement rather than a scale estimate. */
function placementVerified(p){ return !!(p && p.pass && isARTier(p.tier)); }
/* The strongest outcome: verified AND the photo is the very frame that was measured. */
function placementSingleFrame(p){ return !!(placementVerified(p) && p.captureMode === "single-frame"); }
function placementUnverified(p){ return !p || p.tier === "C"; }

/* ==========================================================
   4b. Row mapping — PostgREST rows <-> the shapes the views render
   ------------------------------------------------------------
   The render layer is deliberately untouched: it still reads camelCase objects
   with the store fields inlined on the task. Rather than rewrite three thousand
   lines of synchronous view code to be async and snake_case, everything that
   crosses the wire is translated here, in one place, in both directions.

   The enum labels need no translation at all — 0001_schema.sql was written so
   that `task_status`, `verification_tier`, `capture_mode` and
   `notification_kind` are byte-identical to the JS constants in section 1.

   Anything the database owns (recorded_at, created_by, actor_*, the generated
   is_verified / tier_rank columns, best_placement_id, the lifecycle stamps) is
   READ but never written. Sending it is at best ignored and at worst raises
   NIVA_READONLY_FIELD.
   ========================================================== */
const num = v => (v == null || v === "") ? null : Number(v);

function mapProfile(r){
  return { id:r.id, name:r.full_name, role:r.role, title:r.title||"",
           region:r.region||null, active: r.is_active !== false };
}
function mapCampaign(r){
  return { id:r.id, code:r.code, name:r.name, brand:r.brand,
           start:r.starts_on, end:r.ends_on, note:r.note||"", ownerId:r.owner_id||null,
           poster:{ w:num(r.poster_w_ft), h:num(r.poster_h_ft), standoff:num(r.standoff_ft),
                    tol:num(r.standoff_tol_ft), angleTol:num(r.angle_tol_deg) } };
}
function mapStore(r){
  return { id:r.id, code:r.store_code, name:r.name, city:r.city, state:r.state,
           stateCode:r.state_code, region:r.region, lat:num(r.lat), lng:num(r.lng),
           geofenceM: r.geofence_m == null ? GEOFENCE_M : Number(r.geofence_m),
           active: r.is_active !== false };
}
function storeRow(s){
  return { id:s.id, store_code:String(s.code||"").toUpperCase(), name:s.name, city:s.city,
           state:s.state, state_code:s.stateCode, region:s.region,
           lat:Number(s.lat), lng:Number(s.lng),
           geofence_m: s.geofenceM == null ? GEOFENCE_M : Math.round(s.geofenceM) };
}

function mapPlacement(r){
  if(!r) return null;
  const p = {
    id:r.id, taskId:r.task_id,
    tier:r.tier, tierLabel:r.tier_label, captureMode:r.capture_mode,
    distanceFt:num(r.distance_ft), targetFt:num(r.target_ft), tolFt:num(r.tol_ft),
    distanceOk:!!r.distance_ok, distanceSource:r.distance_source||"—",
    pitchDeg:num(r.pitch_deg), rollDeg:num(r.roll_deg), yawDeg:num(r.yaw_deg),
    angleTolDeg:num(r.angle_tol_deg),
    pitchOk:!!r.pitch_ok, rollOk:!!r.roll_ok, yawOk:!!r.yaw_ok, yawVerified:!!r.yaw_verified,
    angleSource:r.angle_source||"", attitudeAssumed:!!r.attitude_assumed,
    focalPx:(r.focal_px==null?null:Number(r.focal_px)), focalSource:r.focal_source||"—",
    posterWFt:num(r.poster_w_ft), posterHFt:num(r.poster_h_ft),
    pass:!!r.passed, geofencePass:r.geofence_pass, geofenceM:r.geofence_m,
    armMs:r.arm_ms, note:r.note||"",
    ts:r.captured_at||r.recorded_at, recordedAt:r.recorded_at, createdBy:r.created_by||null
  };
  if(r.camera_w){
    p.cameraImage = { w:r.camera_w, h:r.camera_h, readbackMs:num(r.camera_readback_ms),
                      path:r.camera_path, aspectAgrees:r.camera_aspect_agrees };
    if(r.camera_diagnostics && Object.keys(r.camera_diagnostics).length)
      p.cameraImage.diagnostics = r.camera_diagnostics;
  }
  return p;
}
/* The inverse. `id` is generated on the CLIENT so a retried POST collides with
   itself (23505 on placements_pkey, which the outbox treats as "already
   landed") instead of writing a second measurement for the same capture. */
function placementRow(p, taskId, id){
  const row = {
    id: id || p.id || uuid4(), task_id: taskId,
    tier: p.tier, tier_label: p.tierLabel || tierMeta(p.tier).label,
    capture_mode: p.captureMode || "manual",
    distance_ft: p.distanceFt, target_ft: p.targetFt, tol_ft: p.tolFt,
    distance_ok: !!p.distanceOk, distance_source: p.distanceSource || null,
    pitch_deg: p.pitchDeg, roll_deg: p.rollDeg, yaw_deg: p.yawDeg,
    angle_tol_deg: p.angleTolDeg,
    pitch_ok: !!p.pitchOk, roll_ok: !!p.rollOk, yaw_ok: !!p.yawOk, yaw_verified: !!p.yawVerified,
    angle_source: p.angleSource || null, attitude_assumed: !!p.attitudeAssumed,
    focal_px: p.focalPx, focal_source: p.focalSource || null,
    poster_w_ft: p.posterWFt, poster_h_ft: p.posterHFt,
    passed: !!p.pass,
    geofence_pass: (p.geofencePass == null) ? null : !!p.geofencePass,
    geofence_m: (p.geofenceM == null) ? null : Math.round(p.geofenceM),
    arm_ms: (p.armMs == null) ? ARM_MS : Math.round(p.armMs),
    note: p.note || "",
    captured_at: p.ts || new Date().toISOString()
  };
  const ci = p.cameraImage;
  if(ci){
    row.camera_w = ci.w; row.camera_h = ci.h;
    row.camera_readback_ms = (ci.readbackMs == null) ? null : Number(ci.readbackMs);
    row.camera_path = ci.path || null;
    row.camera_aspect_agrees = (ci.aspectAgrees == null) ? null : !!ci.aspectAgrees;
    row.camera_diagnostics = ci.diagnostics || {};
  }
  return row;
}

function mapImage(r, storeCode, idx){
  const out = {
    id: r.id, kind: r.kind, bucket: r.bucket_id,
    src: (r.kind === "poster" ? "sbp:" : "sb:") + r.bucket_id + ":" + r.storage_path,
    cleanSrc: r.clean_storage_path ? ("sb:" + r.bucket_id + ":" + r.clean_storage_path) : null,
    path: r.storage_path, cleanPath: r.clean_storage_path || null,
    ts: r.captured_at || r.recorded_at,
    lat: num(r.lat), lng: num(r.lng), by: r.uploaded_by, device: r.device || "",
    guided: !!r.is_guided, placementId: r.placement_id || null, placement: null,
    name: String(r.storage_path||"").split("/").pop()
  };
  /* seed.sql ships task_images metadata with no bytes in the bucket. Rather
     than show a broken tile, fall back to the procedural stand-in the prototype
     already generates (README section 7 suggests exactly this). */
  out.fb = (r.kind === "poster") ? null
         : "gen:" + (storeCode || "NIVA") + ":" + (r.kind === "before" ? "BEFORE" : "AFTER") + ":" + ((idx||0) % 3);
  return out;
}
function imageRow(im, taskId){
  return {
    id: im.id, task_id: taskId, kind: im.kind || "after",
    bucket_id: im.bucket || "evidence",
    storage_path: im.path, clean_storage_path: im.cleanPath || null,
    placement_id: im.placementId || null,
    lat: (im.lat == null) ? null : Number(im.lat),
    lng: (im.lng == null) ? null : Number(im.lng),
    device: im.device || null, is_guided: !!im.guided,
    captured_at: im.ts || new Date().toISOString(),
    uploaded_by: Session.userId()
  };
}

function mapAudit(r){
  return { id:r.id, ts:r.occurred_at||r.recorded_at, recordedAt:r.recorded_at,
           actor:r.actor_name, actorId:r.actor_id, role:r.actor_role||"—",
           action:r.action, detail:r.detail||"", taskId:r.task_id||null,
           gps:(r.gps_lat==null||r.gps_lng==null)?null:{lat:num(r.gps_lat), lng:num(r.gps_lng)} };
}
/* actor_id / actor_name / actor_role are NOT sent: niva_stamp_audit_actor()
   fills them from the caller's own profile and raises NIVA_ACTOR_MISMATCH if
   you claim someone else. occurred_at IS sent — it is the DEVICE time of the
   original action, which for an event queued offline is hours before the
   server's recorded_at. Keeping both is the point. */
function auditRow(taskId, action, detail, g, ts){
  return { task_id: taskId || null, action: action, detail: detail || "",
           gps_lat: g ? Number(g.lat) : null, gps_lng: g ? Number(g.lng) : null,
           occurred_at: ts || new Date().toISOString() };
}

function mapNotif(r){
  return { id:r.id, type:r.kind, targetRole:r.target_role||null,
           targetUserId:r.target_user_id||null, taskId:r.task_id||null,
           body:r.body, ts:r.occurred_at||r.recorded_at, read: !!r.read_at };
}
function notifRow(n){
  return { id:n.id, kind:n.type, target_role:n.targetRole||null,
           target_user_id:n.targetUserId||null, task_id:n.taskId||null,
           body:n.body, created_by:Session.userId(), occurred_at:n.ts };
}

function mapTask(r){
  const st = storeById(r.store_id) || {};
  return {
    id: r.id, taskCode: r.task_code, campaignId: r.campaign_id, storeId: r.store_id,
    storeName: st.name || "Store not visible", storeCode: st.code || "—",
    city: st.city || "—", state: st.state || "—", stateCode: st.stateCode || "—",
    region: st.region || "—", lat: st.lat, lng: st.lng,
    geofenceM: (st.geofenceM == null) ? GEOFENCE_M : st.geofenceM,
    assigneeId: r.assignee_id, managerId: r.manager_id, createdBy: r.created_by,
    execDate: r.exec_date, displayType: r.display_type,
    widthFt: num(r.width_ft), heightFt: num(r.height_ft),
    standoffFt: num(r.standoff_ft), standoffTolFt: num(r.standoff_tol_ft),
    angleTolDeg: num(r.angle_tol_deg),
    instructions: r.instructions || "", status: r.status,
    merchRemarks: r.merch_remarks || "", reviewRemarks: r.review_remarks || "",
    createdAt: r.created_at, updatedAt: r.updated_at,
    submittedAt: r.submitted_at, approvedAt: r.approved_at, closedAt: r.closed_at,
    completionRef: r.completion_ref, bestPlacementId: r.best_placement_id,
    checkIn: r.checkin_at ? {
      ts:r.checkin_at, lat:num(r.checkin_lat), lng:num(r.checkin_lng),
      distance:r.checkin_distance_m, accuracy:r.checkin_accuracy_m,
      pass:!!r.checkin_pass, device:r.checkin_device||"", source:r.checkin_source||"device"
    } : null,
    /* filled in by Repo.assemble() from the sibling tables */
    beforeImage: null, posterArt: null, afterImages: [], placement: null, audit: [],
    /* client-only sync overlay — never sent anywhere */
    pendingFields: null, submitting: null, lastError: null
  };
}
/* Only the columns a client is ever allowed to originate. The tasks_insert_mgr
   policy pins status to Draft and requires every lifecycle column to be null,
   so they are not even present here. */
function taskInsertRow(t){
  return {
    id: t.id, task_code: t.taskCode, campaign_id: t.campaignId, store_id: t.storeId,
    assignee_id: t.assigneeId || null, manager_id: t.managerId,
    created_by: Session.userId(),
    exec_date: t.execDate, display_type: t.displayType,
    width_ft: t.widthFt, height_ft: t.heightFt,
    standoff_ft: t.standoffFt, standoff_tol_ft: t.standoffTolFt, angle_tol_deg: t.angleTolDeg,
    instructions: t.instructions || "", status: S.DRAFT,
    merch_remarks: "", review_remarks: ""
  };
}

/* ==========================================================
   5. State — a local cache that syncs, not a local database
   ------------------------------------------------------------
   The render path is still synchronous and still reads one `state` object.
   What changed is where that object comes from and what a write to it means:

     READ   Repo.prime() pulls the RLS-filtered rows once at sign-in and
            Repo.refresh() re-pulls them on a timer, on reconnect and after a
            successful drain. Everything renders from the cache, so the app
            works with the radio off.

     WRITE  Nothing writes to PostgREST directly. Every mutation applies to the
            local cache AND appends to the durable Outbox, which is the only
            thing that talks to the server. The UI never claims a write reached
            the database until the outbox says it did.

   The one place local state is deliberately NOT optimistic is submission: a
   task stays In Progress, with an honest "queued" badge, until its evidence
   bytes have actually landed in Storage and the server has accepted the
   status change.
   ========================================================== */
let state = null;
let view  = { name:"dashboard", params:{} };
let ui    = { granularity:"Region", taskFilter:{q:"",status:"",region:"",campaign:""}, popOpen:null,
              login:{ busy:false, error:"", email:"" } };

function blankState(){
  return { v:3, userId:null, tasks:[], notifications:[],
           profiles:[], campaigns:[], stores:[],
           kpis:null, rollup:{}, campaignRollup:[], rollupAt:null,
           ws:{}, syncedAt:null, everSynced:false };
}

/* ---------- identity: role comes from the profile row, nowhere else ---------- */
const me = function(){
  const p = Session.profile();
  if(!p) return { id:null, name:"Not signed in", role:null, title:"" };
  return { id:p.id, name:p.full_name || p.name || p.id, role:p.role, title:p.title || "" };
};
const myRole = function(){ const p = Session.profile(); return p ? p.role : null; };
const signedIn = function(){ return SB_CONFIGURED && !!Session.profile() && Session.state !== "signedout"; };

const taskById    = id => state.tasks.filter(t=>t.id===id)[0];
const campaignById= id => CAMPAIGNS.filter(c=>c.id===id)[0] || {name:"—", poster:null};

/* Defensive fill-in for tasks arriving from an older cache or from a row whose
   store is not visible to this session. Idempotent. */
function normalizeTask(t){
  if(!t || typeof t !== "object") return t;
  const d = posterDefaults(t.campaignId);
  if(t.widthFt  == null) t.widthFt  = d.w;
  if(t.heightFt == null) t.heightFt = d.h;
  if(t.standoffFt    == null) t.standoffFt    = d.standoff;
  if(t.standoffTolFt == null) t.standoffTolFt = d.tol;
  if(t.angleTolDeg   == null) t.angleTolDeg   = d.angleTol;
  if(t.geofenceM == null) t.geofenceM = GEOFENCE_M;
  if(!Array.isArray(t.afterImages)) t.afterImages = [];
  if(!Array.isArray(t.audit)) t.audit = [];
  if(t.placement === undefined) t.placement = null;
  if(t.posterArt === undefined) t.posterArt = null;
  t.afterImages.forEach(function(im){ if(im && im.placement === undefined) im.placement = null; });
  return t;
}

/* ---------- render cache persistence ---------- */
function cacheKey(){ const u = (state && state.userId) || Session.userId(); return u ? (CACHE_KEY_PREFIX + u) : null; }
function save(){
  if(!state) return;
  const k = cacheKey(); if(!k) return;
  lsSet(k, JSON.stringify({
    v:3, userId: state.userId, tasks: state.tasks, notifications: state.notifications,
    profiles: USERS, campaigns: CAMPAIGNS, stores: STORES,
    kpis: state.kpis, rollup: state.rollup, campaignRollup: state.campaignRollup,
    rollupAt: state.rollupAt, ws: state.ws, syncedAt: state.syncedAt,
    everSynced: !!state.everSynced
  }));
}
function load(){
  const uid = Session.userId();
  const fresh = blankState();
  fresh.userId = uid;
  if(!uid) return fresh;
  const p = lsJSON(CACHE_KEY_PREFIX + uid, null);
  if(!p || p.v !== 3 || !Array.isArray(p.tasks)) return fresh;
  USERS     = Array.isArray(p.profiles)  ? p.profiles  : [];
  CAMPAIGNS = Array.isArray(p.campaigns) ? p.campaigns : [];
  STORES    = Array.isArray(p.stores)    ? p.stores    : [];
  fresh.tasks           = p.tasks;
  fresh.notifications   = Array.isArray(p.notifications) ? p.notifications : [];
  fresh.profiles = USERS; fresh.campaigns = CAMPAIGNS; fresh.stores = STORES;
  fresh.kpis            = p.kpis || null;
  fresh.rollup          = p.rollup || {};
  fresh.campaignRollup  = p.campaignRollup || [];
  fresh.rollupAt        = p.rollupAt || null;
  fresh.ws              = p.ws || {};
  fresh.syncedAt        = p.syncedAt || null;
  fresh.everSynced      = !!p.everSynced;
  fresh.tasks.forEach(function(t){
    if(!Array.isArray(t.afterImages)) t.afterImages = [];
    if(!Array.isArray(t.audit)) t.audit = [];
    /* A `submitting` marker outlives the queue it describes if the tab died
       between the last op draining and the cache being written. Left alone it
       would wedge the task in "Submitting…" with nothing to submit. The outbox
       is restored before this runs, so it can answer authoritatively. */
    if(t.submitting && !Outbox.groupPending(t.submitting.group)){
      const stuck = Outbox.failures().some(function(it){ return it.group === t.submitting.group; });
      if(!stuck) t.submitting = null;
    }
    (t.audit || []).forEach(function(a){
      if(a && a.pending && !Outbox.has(a.opId)) a.pending = false;
    });
  });
  return fresh;
}

let renderT = null;
function scheduleRender(){
  if(renderT) return;
  renderT = setTimeout(function(){ renderT = null; try{ render(); }catch(e){} }, 60);
}

/* ==========================================================
   5b. Repository — PostgREST reads, assembled into the render shape
   ========================================================== */
const Repo = (function(){
  let inflight = null;
  let lastError = null;
  let mastersAt = 0;

  function note(e){
    if(e && e.kind === "auth") Session.markExpired();
    lastError = e;
    throw e;
  }

  function fetchMasters(){
    return Promise.all([
      REST.select("profiles",  "select=id,full_name,role,title,region,is_active&order=full_name"),
      REST.select("stores",    "select=*&order=name"),
      REST.select("campaigns", "select=*&order=starts_on.desc")
    ]).then(function(r){
      /* An empty array here is RLS doing its job, not a failure. A
         merchandiser legitimately sees a couple of colleagues and one
         campaign. Only overwrite the cache when the request SUCCEEDED — a
         thrown error leaves the previous cache untouched. */
      USERS     = r[0].map(mapProfile);
      STORES    = r[1].map(mapStore);
      CAMPAIGNS = r[2].map(mapCampaign);
      state.profiles = USERS; state.stores = STORES; state.campaigns = CAMPAIGNS;
      mastersAt = Date.now();
    });
  }

  function fetchWork(){
    return Promise.all([
      REST.select("tasks",         "select=*&order=created_at.desc"),
      REST.select("placements",    "select=*&order=recorded_at.desc"),
      REST.select("task_images",   "select=*&order=recorded_at.asc"),
      REST.select("audit_events",  "select=*&order=occurred_at.desc&limit=800"),
      REST.select("notifications", "select=*&order=occurred_at.desc&limit=120")
    ]).then(function(r){ assemble(r[0], r[1], r[2], r[3], r[4]); });
  }

  /* The dashboard aggregates come from the server's own rollup functions
     (niva_dashboard_kpis / niva_dashboard_rollup / niva_campaign_rollup)
     rather than from counting task rows in the browser. For a merchandiser
     that is the same number either way; for an admin it is the difference
     between one small response and every task row in the country. */
  function fetchRollups(){
    return Promise.all([
      REST.rpc("niva_dashboard_kpis",   {}),
      REST.rpc("niva_dashboard_rollup", { p_granularity:"Region" }),
      REST.rpc("niva_dashboard_rollup", { p_granularity:"State"  }),
      REST.rpc("niva_dashboard_rollup", { p_granularity:"City"   }),
      REST.rpc("niva_campaign_rollup",  {})
    ]).then(function(r){
      state.kpis           = (Array.isArray(r[0]) ? r[0][0] : r[0]) || null;
      state.rollup         = { Region: r[1] || [], State: r[2] || [], City: r[3] || [] };
      state.campaignRollup = Array.isArray(r[4]) ? r[4] : [];
      state.rollupAt       = new Date().toISOString();
    });
  }

  /* Fold five flat result sets into the denormalised task objects the views
     expect, preserving anything that is local-only. */
  function assemble(taskRows, placeRows, imgRows, auditRows, notifRows){
    const placeById = Object.create(null);
    placeRows.forEach(function(r){ const p = mapPlacement(r); placeById[p.id] = p; });

    const prevById = Object.create(null);
    (state.tasks || []).forEach(function(t){ prevById[t.id] = t; });

    /* Audit entries this device wrote that the server has not accepted yet.
       A poll must not erase the merchandiser's own timeline just because their
       write is still in the queue behind a photo upload. Keyed by task. */
    const localAudit = Object.create(null);
    (state.tasks || []).forEach(function(t){
      (t.audit || []).forEach(function(a){
        if(a && a.pending && Outbox.has(a.opId)) (localAudit[t.id] = localAudit[t.id] || []).push(a);
      });
    });

    const tasks = [];
    const byId  = Object.create(null);
    taskRows.forEach(function(r){
      const prev = prevById[r.id];
      /* A poll can race a write we just made: the read may have started before
         our PATCH committed. `updated_at` settles it — never move a task
         backwards in time. */
      let t;
      if(prev && prev.updatedAt && r.updated_at && new Date(r.updated_at) < new Date(prev.updatedAt)){
        t = prev; t.afterImages = []; t.audit = []; t.beforeImage = null; t.posterArt = null;
      }else{
        t = mapTask(r);
        if(prev){
          t.submitting    = prev.submitting || null;
          t.pendingFields = prev.pendingFields || null;
          t.lastError     = prev.lastError || null;
        }
      }
      tasks.push(t); byId[t.id] = t;
    });

    const seq = Object.create(null);
    imgRows.forEach(function(r){
      const t = byId[r.task_id]; if(!t) return;
      const k = r.task_id + "|" + r.kind;
      const n = seq[k] = (seq[k] == null ? 0 : seq[k] + 1);
      const im = mapImage(r, t.storeCode, n);
      im.placement = im.placementId ? (placeById[im.placementId] || null) : null;
      if(r.kind === "before"){ if(!t.beforeImage) t.beforeImage = im; }
      else if(r.kind === "poster"){ t.posterArt = im; }
      else t.afterImages.push(im);
    });

    auditRows.forEach(function(r){
      const t = byId[r.task_id]; if(!t) return;
      t.audit.push(mapAudit(r));
    });

    tasks.forEach(function(t){
      (localAudit[t.id] || []).forEach(function(a){ t.audit.push(a); });
      t.audit.sort(function(a,b){ return new Date(a.ts) - new Date(b.ts); });
      t.placement = t.bestPlacementId ? (placeById[t.bestPlacementId] || null)
                                      : bestPlacement(t.afterImages);
      normalizeTask(t);
      applyOverlay(t);
    });

    /* Same rule for notifications this device raised and has not yet flushed. */
    const stillQueued = (state.notifications || []).filter(function(n){
      return n && n.pending && Outbox.has(n.opId);
    });
    const fromServer = notifRows.map(mapNotif);
    const seen = Object.create(null);
    fromServer.forEach(function(n){ seen[n.id] = 1; });

    state.tasks         = tasks;
    state.notifications = stillQueued.filter(function(n){ return !seen[n.id]; }).concat(fromServer);
    state.syncedAt      = new Date().toISOString();
    state.everSynced    = true;
    lastError           = null;
  }

  return {
    lastError: function(){ return lastError; },
    /* Did the last attempt to READ from the server fail for a transport
       reason? The write queue being empty says nothing about this: a device
       with nothing queued and a dead radio is not "synced", it is stale, and
       the chrome has to say so. Cleared by the next successful assemble(). */
    unreachable: function(){
      return !!(lastError && (lastError.kind === "offline" || lastError.kind === "timeout"
                           || lastError.kind === "server"  || lastError.kind === "ratelimit"));
    },
    busy: function(){ return !!inflight; },
    /* full=true also re-reads the profile/store/campaign masters. */
    refresh: function(full){
      if(!SB_CONFIGURED) return Promise.reject(SbError("config", "Not configured."));
      if(Session.state !== "ready") return Promise.reject(SbError("auth", "No session."));
      if(inflight) return inflight;
      const needMasters = full || !mastersAt || (Date.now() - mastersAt > 600000) || !STORES.length;
      inflight = (needMasters ? fetchMasters() : Promise.resolve())
        .then(fetchWork)
        .then(fetchRollups)
        .then(function(){ inflight = null; save(); },
              function(e){ inflight = null; save(); return note(e); });
      return inflight;
    },
    prime: function(){ return this.refresh(true); },
    /* Merge one authoritative task row back into the cache, keeping the local
       sub-collections that the row itself does not carry. */
    mergeTaskRow: function(row){
      const fresh = mapTask(row);
      const i = state.tasks.map(function(t){ return t.id; }).indexOf(fresh.id);
      if(i < 0){ normalizeTask(fresh); state.tasks.unshift(fresh); return fresh; }
      const old = state.tasks[i];
      fresh.beforeImage   = old.beforeImage;
      fresh.posterArt     = old.posterArt;
      fresh.afterImages   = old.afterImages;
      fresh.audit         = old.audit;
      fresh.pendingFields = old.pendingFields;
      fresh.submitting    = old.submitting;
      fresh.lastError     = old.lastError;
      fresh.placement     = old.placement;
      if(fresh.bestPlacementId){
        const hit = old.afterImages.filter(function(im){
          return im.placement && im.placement.id === fresh.bestPlacementId; })[0];
        if(hit) fresh.placement = hit.placement;
      }
      if(!fresh.placement) fresh.placement = bestPlacement(fresh.afterImages);
      normalizeTask(fresh);
      /* A confirmed row for group A must not visually undo an optimistic change
         from group B that is still in the queue behind it. */
      applyOverlay(fresh);
      state.tasks[i] = fresh;
      return fresh;
    }
  };
})();

/* Re-apply values that are queued but not yet confirmed, so a server row that
   predates our write does not visually undo the user's action. Cleared as soon
   as the group has drained. */
function applyOverlay(t){
  const pf = t.pendingFields;
  if(!pf) return;
  if(!pf.group || Outbox.groupPending(pf.group) === 0){ t.pendingFields = null; return; }
  Object.keys(pf.fields).forEach(function(k){ t[k] = pf.fields[k]; });
}

/* ==========================================================
   5c. Sync — what the outbox does to local state when a write lands
   ========================================================== */
const Sync = {
  onStoreInserted: function(it, row){
    const s = mapStore(row);
    const i = STORES.map(function(x){ return x.id; }).indexOf(s.id);
    if(i >= 0) STORES[i] = s; else STORES.push(s);
    state.stores = STORES; save();
  },
  onIdRemapped: function(oldId, newId){
    STORES.forEach(function(s){ if(s.id === oldId) s.id = newId; });
    state.tasks.forEach(function(t){ if(t.storeId === oldId) t.storeId = newId; });
    save();
  },
  onTaskInserted: function(it, row){
    Repo.mergeTaskRow(row); save(); scheduleRender();
  },
  onTaskPatched: function(it, row, alreadyApplied){
    const t = Repo.mergeTaskRow(row);
    if(t){
      if(t.pendingFields && t.pendingFields.group === it.group) t.pendingFields = null;
      if(t.submitting && t.submitting.group === it.group){
        t.submitting = null;
        clearWs(t.id);
        toast("Submission synced — " + t.storeName + " is now with your manager.");
      }
      t.lastError = null;
    }
    save(); scheduleRender();
  },
  onPlacementInserted: function(it, row){
    const t = taskById(row.task_id); if(!t) return;
    const p = mapPlacement(row);
    (t.afterImages || []).forEach(function(im){ if(im.placementId === p.id) im.placement = p; });
    ((state.ws[row.task_id] || {}).after || []).forEach(function(im){ if(im.placementId === p.id) im.placement = p; });
    save();
  },
  onImageInserted: function(it, row){
    const t = taskById(row.task_id); if(!t) return;
    if(row.kind === "after"){
      if(!t.afterImages.some(function(x){ return x.id === row.id; })){
        t.afterImages.push(mapImage(row, t.storeCode, t.afterImages.length));
      }
      t.placement = bestPlacement(t.afterImages);
    }else if(row.kind === "before"){ t.beforeImage = mapImage(row, t.storeCode, 0); }
    else if(row.kind === "poster"){ t.posterArt = mapImage(row, t.storeCode, 0); }
    save(); scheduleRender();
  },
  onUploaded: function(it){
    /* The bytes are on the server now; Signer will mint a URL on next render
       and Outbox drops the local copy. */
    if(it.payload && it.payload.path) Signer.forget(it.payload.path);
    scheduleRender();
  },
  onOpFailed: function(it, err){
    const t = it.taskId ? taskById(it.taskId) : null;
    if(t){ t.lastError = it.lastError; t.submitting = null; t.pendingFields = null; }
    toast("Sync failed: " + (it.label || it.kind) + " — " + errText(err), true);
    save(); scheduleRender();
  }
};

/* ==========================================================
   5d. Field workspace — captures held on the device before submission
   ------------------------------------------------------------
   In the prototype this was an in-memory object, so a reload lost every photo
   taken since check-in. It is now part of the persisted cache (with the JPEG
   bytes in IndexedDB), which is what makes "capture in a basement, submit
   tomorrow" actually work.
   ========================================================== */
function ws(id){
  if(!state.ws) state.ws = {};
  if(!state.ws[id]) state.ws[id] = { after:[], remarks:"", geo:null, busy:false };
  const w = state.ws[id];
  if(!Array.isArray(w.after)) w.after = [];
  if(typeof w.remarks !== "string") w.remarks = "";
  w.busy = !!w.busy;
  return w;
}
function clearWs(id){
  const w = state.ws && state.ws[id];
  if(w && w.after) w.after.forEach(function(im){
    if(im.path) Blobs.del("evidence/" + im.path);
    if(im.cleanPath) Blobs.del("evidence/" + im.cleanPath);
  });
  if(state.ws) delete state.ws[id];
  save();
}

/* Every locally-held JPEG that something still points at. Used once, at boot,
   to drop bytes nothing references any more — a device that has been in the
   field for months otherwise grows an IndexedDB full of already-uploaded
   evidence.

   GETTING THIS WRONG DESTROYS UNSYNCED EVIDENCE, so it is deliberately
   over-inclusive. A capture sitting in the field workspace has NOT been queued
   yet (the upload op is only pushed at submit time), so the outbox alone is
   not the answer — ws() captures, failed-but-retryable items and locally
   created before/poster images all count as live. */
function liveBlobKeys(){
  const out = Object.create(null);
  const add = function(k){ if(k) out[k] = 1; };

  Outbox.items().forEach(function(it){ add(it.blobKey); });
  Outbox.failures().forEach(function(it){ add(it.blobKey); });

  const ws0 = (state && state.ws) || {};
  Object.keys(ws0).forEach(function(id){
    ((ws0[id] && ws0[id].after) || []).forEach(function(im){
      if(im && im.path)      add("evidence/" + im.path);
      if(im && im.cleanPath) add("evidence/" + im.cleanPath);
    });
  });

  ((state && state.tasks) || []).forEach(function(t){
    [t.beforeImage, t.posterArt].concat(t.afterImages || []).forEach(function(im){
      if(!im || !im.path) return;
      add((im.bucket || "evidence") + "/" + im.path);
      if(im.cleanPath) add((im.bucket || "evidence") + "/" + im.cleanPath);
    });
  });
  return Object.keys(out);
}

/* ---------- state machine ---------- */
/* The client map still exists, but only to grey out buttons. The database is
   the authority: niva_tasks_transition_guard re-checks every edge, who may
   traverse it, and the separation-of-duties rule. A rejection surfaces as the
   server's own message. */
function canTransition(from,to){ return (TRANSITIONS[from]||[]).indexOf(to) >= 0; }

/* Returns the outbox group id (truthy) or false, so the existing
   `if(!transition(...)) return;` call sites keep working unchanged. */
function transition(task, to, opts){
  opts = opts || {};
  if(!canTransition(task.status, to)){
    toast("Illegal transition: "+task.status+" → "+to, true);
    return false;
  }
  const group = opts.group || uuid4();
  const patch = Object.assign({ status: to }, opts.patch || {});
  Outbox.push("task.patch", { taskId: task.id, patch: patch },
              { group: group, taskId: task.id, label: "Status → " + to });
  if(opts.optimistic !== false){
    const fields = Object.assign({ status: to }, opts.localFields || {});
    Object.keys(fields).forEach(function(k){ task[k] = fields[k]; });
    task.pendingFields = { group: group, fields: fields };
  }
  audit(task, opts.action || ("Status → "+to), opts.detail || "", opts.gps || null, group);
  return group;
}

/* The local copy carries the outbox op id that will make it real. That is what
   lets Repo.assemble() tell "this entry has not reached the server yet, keep
   showing it" apart from "this entry is gone", instead of a poll wiping the
   field's own timeline out from under them. */
function audit(task, action, detail, g, group){
  const u = me();
  const ts = new Date().toISOString();
  const opId = Outbox.push("audit.insert", { row: auditRow(task.id, action, detail, g, ts) },
                           { group: group || null, taskId: task.id, label: action });
  task.audit.push({ ts:ts, actor:u.name, actorId:u.id, role:u.role,
                    action:action, detail:detail||"", gps:g||null,
                    pending:true, opId:opId });
}

function notify(type, targetRole, targetUserId, taskId, body, group){
  const n = { id: uuid4(), type:type, targetRole:targetRole||null,
              targetUserId:targetUserId||null, taskId:taskId||null, body:body,
              ts:new Date().toISOString(), read:false, pending:true };
  n.opId = Outbox.push("notif.insert", { row: notifRow(n) },
                       { group: group||null, taskId: taskId||null, label: "Notify · " + type });
  state.notifications.unshift(n);
  if(state.notifications.length > 120) state.notifications.length = 120;
}

function myNotifs(){
  const u = me();
  if(!u.id) return [];
  return state.notifications.filter(function(n){
    if(u.role === "Admin") return true;
    if(n.targetUserId) return n.targetUserId === u.id;
    return n.targetRole === u.role;
  });
}

/* ---------- derived metrics ---------- */
function counts(tasks){
  const c = {}; ALL_STATUS.forEach(s=>c[s]=0);
  tasks.forEach(t=>{ c[t.status] = (c[t.status]||0)+1; });
  return c;
}
function kpis(tasks){
  const c = counts(tasks);
  const total = tasks.length;
  const done = c[S.APPROVED] + c[S.CLOSED];
  const pending = c[S.DRAFT] + c[S.ASSIGNED];
  return {
    total: total, completed: done, pending: pending,
    inProgress: c[S.PROGRESS] + c[S.SUBMITTED], rework: c[S.REWORK],
    pct: total ? Math.round(done/total*100) : 0, c: c
  };
}
/* RLS already decided what this session may see. Filtering again in the client
   could only ever HIDE rows the server said were visible, which would be
   misleading rather than protective — so there is no filter here any more. */
function visibleTasks(){ return state.tasks.slice(); }

/* ---- which numbers the dashboard is allowed to trust ----
   niva_dashboard_kpis / niva_dashboard_rollup / niva_campaign_rollup are the
   authority: they count exactly the rows this session can see, using the
   STORED is_verified / is_same_frame / tier_rank columns, so the definition of
   "placement verified" cannot drift between the browser and a report. For an
   Admin that is one small response instead of a national task dump.

   What the server cannot know is what is still sitting in this device's
   outbox. Showing its numbers while a submission is queued would understate
   the user's own work, which is the same class of lie as overstating it. So
   the moment anything is queued, the dashboard counts locally and SAYS SO.   */
function rollupSource(){
  const queued = Outbox.pending();
  if(queued){
    return { kind:"local",
             why: queued + " change" + (queued===1?"":"s") + " on this device "
                + (queued===1?"has":"have") + " not reached the server yet, so these are counted locally." };
  }
  if(state.rollupAt && state.kpis){
    return { kind:"server",
             why:"Counted by the server across every row your account can see · " + fmtDT(state.rollupAt) };
  }
  return { kind:"local",
           why: state.everSynced
             ? "The server rollup is unavailable, so these are counted from this device's cache."
             : "Not synced yet — counted from this device's cache." };
}

/* The nine dashboard tiles, in one shape, from either source. */
function kpisFull(tasks){
  const k = kpis(tasks);
  const submitted = tasks.filter(t => [S.SUBMITTED,S.REWORK,S.APPROVED,S.CLOSED].indexOf(t.status) >= 0);
  k.submissions = submitted.length;
  k.verified    = submitted.filter(t => placementVerified(t.placement)).length;
  k.sameFrame   = submitted.filter(t => placementSingleFrame(t.placement)).length;
  k.unverified  = submitted.filter(t => placementUnverified(t.placement)).length;
  return k;
}
function serverKpisFull(){
  const r = state.kpis; if(!r) return null;
  const n = v => Number(v) || 0;
  const c = {};
  c[S.DRAFT]=n(r.draft); c[S.ASSIGNED]=n(r.assigned); c[S.PROGRESS]=n(r.executing);
  c[S.SUBMITTED]=n(r.submitted); c[S.REWORK]=n(r.rework);
  c[S.APPROVED]=n(r.approved); c[S.CLOSED]=n(r.closed);
  return { total:n(r.total_planned), completed:n(r.completed), pending:n(r.pending),
           inProgress:n(r.in_progress), rework:n(r.rework), pct:n(r.pct_complete), c:c,
           submissions:n(r.submissions), verified:n(r.placement_verified),
           sameFrame:n(r.same_frame), unverified:n(r.unverified) };
}
/* One rollup row (server or local) -> { name, c, total, done }. */
function serverBuckets(gran){
  const rows = (state.rollup && state.rollup[gran]) || [];
  const n = v => Number(v) || 0;
  return rows.map(function(r){
    const c = {};
    c[S.DRAFT]=n(r.draft); c[S.ASSIGNED]=n(r.assigned); c[S.PROGRESS]=n(r.executing);
    c[S.SUBMITTED]=n(r.submitted); c[S.REWORK]=n(r.rework);
    c[S.APPROVED]=n(r.approved); c[S.CLOSED]=n(r.closed);
    return { name: r.bucket == null ? "—" : String(r.bucket), c: c,
             total: n(r.total_planned), done: n(r.completed) };
  });
}
function localBuckets(tasks, gran){
  const keyFor = t => gran==="Region" ? t.region : (gran==="State" ? t.state : t.city);
  const groups = {};
  tasks.forEach(function(t){ const kk = keyFor(t); (groups[kk] = groups[kk] || []).push(t); });
  return Object.keys(groups).sort(function(a,b){
