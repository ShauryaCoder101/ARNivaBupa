                 + CONF_W.rms*cRms);
  }

  /* ---------- sub-pixel edge refinement ----------
     For each side, walk 18 stations between 12 % and 88 % of its length (the
     corners themselves are where the edge model breaks down), scan ±R px along
     the side's normal for the strongest luminance step, refine that peak to
     sub-pixel with a 3-point parabola, then fit a total-least-squares line to
     the surviving stations. Corners come back as line–line intersections, so a
     corner is never worse than the two lines that made it — and a line fitted
     to 18 points is far better than any single pixel. */
  function sampleBil(luma, w, h, x, y){
    if(x < 0) x = 0; else if(x > w-1.001) x = w-1.001;
    if(y < 0) y = 0; else if(y > h-1.001) y = h-1.001;
    const x0 = x|0, y0 = y|0, fx = x-x0, fy = y-y0, i = y0*w + x0;
    const a = luma[i], b = luma[i+1], c = luma[i+w], d = luma[i+w+1];
    return a + (b-a)*fx + (c-a)*fy + (a-b-c+d)*fx*fy;
  }
  /* Total-least-squares line through (px,py)[0..m). Returns point + unit dir. */
  function fitLine(px, py, m){
    let mx = 0, my = 0;
    for(let i=0; i<m; i++){ mx += px[i]; my += py[i]; }
    mx /= m; my /= m;
    let sxx = 0, syy = 0, sxy = 0;
    for(let i=0; i<m; i++){
      const dx = px[i]-mx, dy = py[i]-my;
      sxx += dx*dx; syy += dy*dy; sxy += dx*dy;
    }
    // principal eigenvector of [[sxx,sxy],[sxy,syy]]
    const tr = sxx + syy, det = sxx*syy - sxy*sxy;
    const disc = Math.max(0, tr*tr/4 - det);
    const lam = tr/2 + Math.sqrt(disc);
    let dx = sxy, dy = lam - sxx;
    if(Math.abs(dx) + Math.abs(dy) < 1e-12){ dx = lam - syy; dy = sxy; }
    const L = Math.hypot(dx, dy) || 1;
    dx /= L; dy /= L;
    let rss = 0;
    for(let i=0; i<m; i++){
      const ex = px[i]-mx, ey = py[i]-my;
      const perp = ex*(-dy) + ey*dx;
      rss += perp*perp;
    }
    return { x:mx, y:my, dx:dx, dy:dy, rms: Math.sqrt(rss/m), m:m };
  }
  function intersect(a, b){
    const cr = a.dx*b.dy - a.dy*b.dx;
    if(Math.abs(cr) < 1e-9) return null;
    const s = ((b.x - a.x)*b.dy - (b.y - a.y)*b.dx)/cr;
    return [ a.x + s*a.dx, a.y + s*a.dy ];
  }
  const REFINE = { samples:18, radius:7, minGrad:9, centreBias:0.30, t0:0.12, t1:0.88,
                   radius1:11, radius2:4, minGrad1:7 };
  /* `quad` is in WORK-plane pixels. Writes refined corners into `out`. */
  function refineQuad(luma, w, h, quad, out, ws, opt){
    const o = opt || {};
    const N = o.samples || REFINE.samples;
    const R = o.radius  || REFINE.radius;
    const minG = o.minGrad == null ? REFINE.minGrad : o.minGrad;
    const lines = [];
    let attempted = 0, accepted = 0;
    for(let s=0; s<4; s++){
      const e = (s+1) & 3;
      const ax = quad[s*2], ay = quad[s*2+1], bx = quad[e*2], by = quad[e*2+1];
      const L = Math.hypot(bx-ax, by-ay);
      if(!(L > 6)){ lines.push(null); continue; }
      const ux = (bx-ax)/L, uy = (by-ay)/L;
      const nx = -uy, ny = ux;                       // unit normal
      let m = 0;
      for(let k=0; k<N; k++){
        attempted++;
        const t = REFINE.t0 + (REFINE.t1 - REFINE.t0)*(N === 1 ? 0.5 : k/(N-1));
        const sx = ax + (bx-ax)*t, sy = ay + (by-ay)*t;
        let bestG = 0, bestU = 0, bestRaw = 0;
        let gm1 = 0, g0 = 0, gp1 = 0;
        // gradient along the normal, sampled at half-pixel offsets
        let prev = null;
        const gAt = function(u){
          const p = sampleBil(luma, w, h, sx + (u+0.5)*nx, sy + (u+0.5)*ny);
          const q = sampleBil(luma, w, h, sx + (u-0.5)*nx, sy + (u-0.5)*ny);
          const d = p - q;
          return d < 0 ? -d : d;
        };
        for(let u=-R; u<=R; u++){
          const g = gAt(u);
          const weighted = g*(1 - REFINE.centreBias*Math.abs(u)/R);
          if(weighted > bestG){ bestG = weighted; bestU = u; bestRaw = g; }
        }
        if(bestRaw < minG) continue;
        gm1 = gAt(bestU-1); g0 = bestRaw; gp1 = gAt(bestU+1);
        const den = gm1 - 2*g0 + gp1;
        let sub = 0;
        if(Math.abs(den) > 1e-6){
          sub = 0.5*(gm1 - gp1)/den;
          if(sub > 1) sub = 1; else if(sub < -1) sub = -1;
        }
        const u = bestU + sub;
        if(m < ws.px.length){
          ws.px[m] = sx + u*nx; ws.py[m] = sy + u*ny; m++;
          accepted++;
        }
        void prev;
      }
      if(m < 5){ lines.push(null); continue; }
      let ln = fitLine(ws.px, ws.py, m);
      // one round of outlier rejection — a passing shopper, a shadow, a shelf
      if(ln.rms > 0.35){
        const cut = 2.2*ln.rms;
        let k = 0;
        for(let i=0; i<m; i++){
          const ex = ws.px[i]-ln.x, ey = ws.py[i]-ln.y;
          if(Math.abs(ex*(-ln.dy) + ey*ln.dx) <= cut){ ws.px[k] = ws.px[i]; ws.py[k] = ws.py[i]; k++; }
        }
        if(k >= 5 && k < m) ln = fitLine(ws.px, ws.py, k);
      }
      lines.push(ln);
    }
    let ok = 0, rss = 0, mTot = 0, sinSum = 0, sinN = 0;
    for(let i=0; i<4; i++){
      const prev = lines[(i+3) & 3], cur = lines[i];
      let p = null;
      if(prev && cur){
        p = intersect(prev, cur);
        if(p){
          const sin = Math.abs(prev.dx*cur.dy - prev.dy*cur.dx);
          sinSum += sin; sinN++;
        }
      }
      if(p && isFinite(p[0]) && isFinite(p[1])
         && Math.hypot(p[0]-quad[i*2], p[1]-quad[i*2+1]) < 3.5*(o.radius || REFINE.radius)){
        out[i*2] = p[0]; out[i*2+1] = p[1]; ok++;
      } else {
        out[i*2] = quad[i*2]; out[i*2+1] = quad[i*2+1];
      }
    }
    for(let i=0; i<4; i++){
      const ln = lines[i];
      if(!ln) continue;
      rss += ln.rms*ln.rms*ln.m; mTot += ln.m;
    }
    const rms = mTot ? Math.sqrt(rss/mTot) : null;
    const perLine = mTot ? (mTot/4) : 0;
    const sinAvg = sinN ? (sinSum/sinN) : 1;
    /* A corner is where two fitted lines meet. Each line's own position is
       uncertain by rms/√m perpendicular to itself; two of them, crossing at
       angle θ, put the intersection out by √2·(rms/√m)/|sin θ|. The 0.15 px
       floor is the interpolation limit — no amount of averaging beats it. */
    const cornerSigma = (rms != null && perLine >= 5)
      ? Math.max(0.15, Math.SQRT2*(rms/Math.sqrt(perLine))/Math.max(0.2, sinAvg))
      : null;
    return {
      corners: ok, rms: rms, support: attempted ? accepted/attempted : 0,
      cornerSigma: cornerSigma, samplesPerLine: perLine
    };
  }

  /* Two-stage refinement. The coarse quad comes off a DILATED edge image at half
     resolution, so its sides can sit 8–12 px away from the truth — beyond the
     tight scan radius that gives good sub-pixel precision. Stage 1 casts a wide
     net to get within a couple of pixels; stage 2 re-scans narrowly from there,
     where a nearby shelf edge or shadow can no longer out-vote the real one.
     Cost is ~0.4 ms; skipping it costs several percent of distance accuracy on
     obliquely-viewed references. */
  function refine(luma, w, h, quad, out, ws, opt){
    const o = opt || {};
    const mid = new Float64Array(8);
    const r1 = refineQuad(luma, w, h, quad, mid, ws,
      { radius: o.radius1 || REFINE.radius1, minGrad: o.minGrad1 == null ? REFINE.minGrad1 : o.minGrad1,
        samples: o.samples });
    const r2 = refineQuad(luma, w, h, mid, out, ws,
      { radius: o.radius2 || REFINE.radius2, minGrad: o.minGrad, samples: o.samples });
    r2.stage1 = r1;
    /* If the narrow second pass lost the edge (support collapsed), stage 1 is
       still better than the coarse quad — keep it rather than a bad tighten. */
    if(r2.support < 0.45 && r1.support >= r2.support){
      out.set(mid);
      r1.stage1 = null; r1.usedStage = 1;
      return r1;
    }
    r2.usedStage = 2;
    return r2;
  }

  /* ---------- the pass ----------
     gray:   luma at WORK resolution (ws.luma, already filled by the caller)
     aspect: the reference rectangle's width/height. Both orientations are
             tried; `flipped` says the long edge ran horizontally.
     Corners come back in WORK-plane pixels. */
  const EPS_FRACS = [0.015, 0.030, 0.050];
  const LEVELS = [0.09, 0.045];
  function detect(ws, opt){
    const o = opt || {};
    const w = ws.w, h = ws.h, sw = ws.sw, sh = ws.sh, M = sw*sh;
    const aspect = o.aspect > 0 ? o.aspect : 1;
    // intrinsics expressed in DETECT-plane pixels
    const f  = (o.focalPx || GEO.focalFromFov(w, 66)) * (sw/w);
    const cx = (o.cx == null ? w/2 : o.cx) * (sw/w);
    const cy = (o.cy == null ? h/2 : o.cy) * (sh/h);
    const minArea = (o.minAreaFrac == null ? 0.012 : o.minAreaFrac) * M;
    const maxArea = (o.maxAreaFrac == null ? 0.88  : o.maxAreaFrac) * M;

    downsample2(ws.luma, w, h, ws.small, sw, sh);
    blur121(ws.small, sw, sh, ws.tmp, ws.blur);
    sobel(ws.blur, sw, sh, ws.mag);

    const raw = new Float64Array(8), ord = new Float64Array(8);
    let bestQ = null, bestScore = -1, bestParts = null, bestFlip = false;
    let contours = 0, candidates = 0, level = -1;

    for(let li=0; li<LEVELS.length; li++){
      const t = percentileThreshold(ws.mag, M, LEVELS[li], o.gradFloor == null ? 26 : o.gradFloor, ws.hist);
      threshold(ws.mag, M, t, ws.bin);
      dilate3(ws.bin, sw, sh, ws.dil, ws.bin);      // tmp=dil, result back in bin
      ws.visited.fill(0);
      level = li;

      for(let y=1; y<sh-1 && contours < 400; y++){
        const row = y*sw;
        for(let x=1; x<sw-1; x++){
          const i = row + x;
          if(!ws.bin[i] || ws.visited[i] || ws.bin[i-1]) continue;
          const n = traceContour(ws.bin, sw, sh, x, y, ws.poly, ws.maxPts, ws.visited);
          if(n < 24) continue;
          contours++;
          if(contours >= 400) break;
          for(let e=0; e<EPS_FRACS.length; e++){
            /* Tolerance scales with the CONTOUR, never with an absolute pixel count.
               An absolute cap silently disabled the coarse levels on smaller detect
               planes: the dilation rounds each corner by a fixed 2-3 px, which is a
               much larger fraction of a small rectangle, so DP kept a fifth vertex
               there and the reference was never offered on exactly the low-end
               devices this feature exists for. */
            const eps = Math.max(1.4, EPS_FRACS[e]*n);
            if(!dpQuad(ws.poly, n, eps, ws.keep, ws.stack, raw)) continue;
            const area = quadArea(raw);
            if(area < minArea || area > maxArea) continue;
            if(!isConvex(raw)) continue;
            if(minSide(raw) < 10) continue;
            orderQuad(raw, ord);
            candidates++;
            for(let flip=0; flip<2; flip++){
              const asp = flip ? 1/aspect : aspect;
              const fit = rectFit(ord, asp, f, cx, cy);
              if(!fit) continue;
              const parts = { ortho:fit.ortho, scale:fit.scale, areaFrac:area/M, support:null };
              const c = confidence(parts);
              if(c > bestScore){
                bestScore = c; bestParts = parts; bestFlip = !!flip;
                bestQ = bestQ || new Float64Array(8);
                bestQ.set(ord);
              }
              if(Math.abs(aspect - 1) < 1e-6) break;    // square: no ambiguity
            }
          }
        }
      }
      if(bestScore >= (o.acceptScore == null ? 0.55 : o.acceptScore)) break;
    }

    if(!bestQ) return { quad:null, score:0, contours:contours, candidates:candidates, level:level };
    // detect plane -> work plane
    const k = w/sw;
    const q = new Float64Array(8);
    for(let i=0; i<8; i++) q[i] = bestQ[i]*k;
    return {
      quad: q, score: bestScore, parts: bestParts, flipped: bestFlip,
      contours: contours, candidates: candidates, level: level,
      areaFrac: bestParts ? bestParts.areaFrac : 0
    };
  }

  /* ---------- error budget ----------
     Distance from a reference rectangle is D = f·W/w_px, so the relative error
     is the quadrature sum of the relative errors of everything on the right.
     Every term below is a measured or declared quantity — nothing is a
     hardcoded "±2 %".

       focal    σf/f from whatever produced the focal length (a device
                calibration knows its own tape-measure and handle error; an
                assumed field of view does not, and stays Tier Be)
       refDim   the reference's own dimensional tolerance ÷ its size
       corner   corner localisation: each side's length comes from two corners
                each uncertain by σc, and the pose averages the two parallel
                sides, so the scale error is σc/(√2·L̄)
       barrel   uncorrected radial distortion, which grows as r² from the
                optical centre — the reason the HUD nudges the reference back
                toward the middle of the frame */
  function errorEstimate(t){
    const focal  = Math.max(0, t.focalRelSigma || 0);
    const refDim = (t.refMm > 0) ? Math.max(0, t.refTolMm || 0)/t.refMm : 0;
    const corner = (t.meanSidePx > 0 && t.cornerSigmaPx != null)
      ? t.cornerSigmaPx/(Math.SQRT2*t.meanSidePx) : 0;
    const r = Math.max(0, Math.min(1.4, t.radialNorm || 0));
    const barrel = (t.barrelK == null ? 0.03 : t.barrelK)*r*r;
    const rel = Math.sqrt(focal*focal + refDim*refDim + corner*corner + barrel*barrel);
    return {
      rel: rel, pct: rel*100,
      terms: { focal:focal, refDim:refDim, corner:corner, barrel:barrel }
    };
  }

  return {
    Workspace: Workspace,
    lumaFromRGBA: lumaFromRGBA, downsample2: downsample2, blur121: blur121,
    sobel: sobel, percentileThreshold: percentileThreshold, threshold: threshold,
    dilate3: dilate3, traceContour: traceContour, dpQuad: dpQuad,
    quadArea: quadArea, isConvex: isConvex, minSide: minSide, meanSide: meanSide,
    orderQuad: orderQuad, rectFit: rectFit, confidence: confidence,
    fitLine: fitLine, intersect: intersect, sampleBil: sampleBil,
    refineQuad: refineQuad, refine: refine, detect: detect, errorEstimate: errorEstimate,
    REFINE: REFINE
  };
})();

/* ==========================================================
   2c. Supabase transport — a hand-rolled typed client
   ------------------------------------------------------------
   No SDK, no CDN, no bundler. Three HTTP surfaces:
     GoTrue    /auth/v1/...      email+password sessions
     PostgREST /rest/v1/...      tables + rpc
     Storage   /storage/v1/...   object upload + signed URLs

   Everything below returns a Promise and rejects with an SbError carrying a
   `kind` the caller can branch on, because "the network is down" and "the
   database refused this on purpose" have to be handled completely differently
   in a field app: the first is queued and retried, the second must be shown to
   the human and never retried.
   ========================================================== */

const SB_BASE = String(SUPABASE_URL || "").replace(/\/+$/, "");
const SB_CONFIGURED = (function(){
  if(!SB_BASE || !SUPABASE_ANON) return false;
  if(!/^https?:\/\//i.test(SB_BASE)) return false;
  if(SB_BASE.indexOf("YOUR-PROJECT") >= 0) return false;
  if(String(SUPABASE_ANON).indexOf("YOUR-ANON-KEY") >= 0) return false;
  return true;
})();

function uuid4(){
  const c = (typeof crypto !== "undefined") ? crypto : null;
  if(c && typeof c.randomUUID === "function"){ try{ return c.randomUUID(); }catch(e){} }
  const b = new Uint8Array(16);
  if(c && typeof c.getRandomValues === "function") c.getRandomValues(b);
  else for(let i=0;i<16;i++) b[i] = Math.floor(Math.random()*256);
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  let h = "";
  for(let i=0;i<16;i++) h += (b[i] < 16 ? "0" : "") + b[i].toString(16);
  return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20);
}

/* ---------- localStorage that never throws ---------- */
let STORAGE_OK = true;
let STORAGE_WARNED = false;
function lsGet(k){
  try{ return localStorage.getItem(k); }
  catch(e){ STORAGE_OK = false; return null; }
}
function lsSet(k, v){
  try{ localStorage.setItem(k, v); return true; }
  catch(e){
    STORAGE_OK = false;
    if(!STORAGE_WARNED){
      STORAGE_WARNED = true;
      try{ toast("Local storage is unavailable (private mode or quota). Queued work may not survive a reload.", true); }catch(e2){}
    }
    return false;
  }
}
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function lsJSON(k, dflt){
  const raw = lsGet(k); if(!raw) return dflt;
  try{ const v = JSON.parse(raw); return (v == null) ? dflt : v; }catch(e){ return dflt; }
}

/* ---------- error taxonomy ---------- */
/* kind:
     "config"     the app has no project URL/key           — not retryable
     "offline"    fetch never reached a server             — retryable
     "timeout"    request aborted on our own deadline      — retryable
     "server"     5xx                                      — retryable
     "ratelimit"  408 / 429                                — retryable
     "auth"       401, the access token is dead            — retry after re-auth
     "forbidden"  403, RLS or a guard trigger said no      — NOT retryable
     "conflict"   409 / 23505, the row or object is there  — usually benign
     "permanent"  any other 4xx                            — NOT retryable       */
function SbError(kind, message, meta){
  const e = new Error(message || kind);
  e.name      = "SbError";
  e.kind      = kind;
  e.status    = (meta && meta.status) || 0;
  e.code      = (meta && meta.code) || null;
  e.nivaCode  = (meta && meta.nivaCode) || null;
  e.hint      = (meta && meta.hint) || "";
  e.details   = (meta && meta.details) || "";
  e.retryable = (kind === "offline" || kind === "timeout" || kind === "server" || kind === "ratelimit");
  return e;
}

/* The database raises named exceptions. Turn them into sentences a
   merchandiser standing in a shop can act on, instead of "request failed". */
const NIVA_MSG = {
  NIVA_ILLEGAL_TRANSITION: "The server refused that status change — the task has already moved on. Refreshing from the server.",
  NIVA_SELF_APPROVAL:      "You cannot approve a task that is assigned to you. Approval has to come from a different user.",
  NIVA_FORBIDDEN:          "Your role does not permit that action on this task.",
  NIVA_GEOFENCE:           "The server requires a passing geofenced check-in before execution can start.",
  NIVA_ROLE_ESCALATION:    "Only an administrator can change a role.",
  NIVA_READONLY_FIELD:     "That field is owned by the server and cannot be written from the app.",
  NIVA_IMMUTABLE:          "This record is write-once evidence. It can never be edited or deleted — correct it by appending a new record.",
  NIVA_ACTOR_MISMATCH:     "The server refused to record that in another user's name.",
  NIVA_NO_PROFILE:         "Your login has no profile row in this project. An administrator has to create one.",
  NIVA_INVALID:            "The server rejected that as invalid."
};
function errText(e){
  if(!e) return "Unknown error.";
  if(e.nivaCode && NIVA_MSG[e.nivaCode]) return NIVA_MSG[e.nivaCode];
  switch(e.kind){
    case "config":    return "Supabase is not configured in this build.";
    case "offline":   return "No connection to the server.";
    case "timeout":   return "The server did not answer in time.";
    case "auth":      return "Your session has expired. Sign in again to continue.";
    case "forbidden": return "The server refused that (row-level security). " + (e.message || "");
    case "server":    return "The server had an internal error (" + e.status + ").";
    case "ratelimit": return "The server is rate-limiting this device. Retrying shortly.";
  }
  return e.message || "Request failed.";
}

function sbParseBody(res){
  const ct = String((res.headers && res.headers.get && res.headers.get("content-type")) || "");
  if(res.status === 204) return Promise.resolve(null);
  return res.text().then(function(t){
    if(!t) return null;
    if(ct.indexOf("json") >= 0 || /^[\[{]/.test(t.trim())){
      try{ return JSON.parse(t); }catch(e){ return { message: t }; }
    }
    return { message: t };
  }, function(){ return null; });
}

function sbHttpError(res, parsed){
  const st = res.status;
  const p  = parsed || {};
  const msg = String(p.message || p.msg || p.error_description || p.error || p.hint || ("HTTP " + st));
  const details = String(p.details || "");
  const code = p.code || p.error_code || null;
  const m = /NIVA_[A-Z_]+/.exec(msg + " " + details + " " + String(p.hint || ""));
  const nivaCode = m ? m[0] : null;
  let kind;
  if(st === 401) kind = "auth";
  else if(st === 403) kind = "forbidden";
  else if(st === 409 || String(code) === "23505" || /duplicate key|already exists/i.test(msg)) kind = "conflict";
  else if(st === 408 || st === 429) kind = "ratelimit";
  else if(st >= 500) kind = "server";
  else kind = "permanent";
  return SbError(kind, msg, { status: st, code: code, nivaCode: nivaCode,
                              hint: p.hint || "", details: details });
}

/* One request. `token:null` sends no Authorization header at all (sign-in). */
function sbRequest(path, opts){
  opts = opts || {};
  if(!SB_CONFIGURED) return Promise.reject(SbError("config", "Supabase is not configured."));
  if(typeof fetch !== "function") return Promise.reject(SbError("config", "This browser has no fetch()."));

  const url = (path.indexOf("http") === 0) ? path : SB_BASE + path;
  const headers = Object.assign({}, opts.headers || {});
  headers["apikey"] = SUPABASE_ANON;
  if(opts.token !== null){
    const tok = (opts.token !== undefined) ? opts.token : Session.token();
    if(tok) headers["Authorization"] = "Bearer " + tok;
  }
  let body = opts.body;
  const isBinary = body && typeof body === "object" &&
                   (typeof Blob !== "undefined" && body instanceof Blob ||
                    typeof ArrayBuffer !== "undefined" && body instanceof ArrayBuffer);
  if(body !== undefined && body !== null && !isBinary && typeof body !== "string"){
    if(!headers["Content-Type"]) headers["Content-Type"] = "application/json";
    body = JSON.stringify(body);
  }

  let ctl = null, timer = null;
  try{ if(typeof AbortController === "function") ctl = new AbortController(); }catch(e){}
  const deadline = opts.timeout || 25000;

  let p;
  try{
    p = fetch(url, { method: opts.method || "GET", headers: headers, body: body,
                     signal: ctl ? ctl.signal : undefined, cache: "no-store" });
  }catch(e){
    return Promise.reject(SbError("offline", "Network unreachable — " + ((e && e.message) || "no connection")));
  }
  if(ctl) timer = setTimeout(function(){ try{ ctl.abort(); }catch(e){} }, deadline);

  return p.then(function(res){
    if(timer) clearTimeout(timer);
    return sbParseBody(res).then(function(parsed){
      if(res.ok) return { status: res.status, body: parsed, res: res };
      throw sbHttpError(res, parsed);
    });
  }, function(err){
    if(timer) clearTimeout(timer);
    if(err && err.name === "SbError") throw err;
    if(err && err.name === "AbortError") throw SbError("timeout", "The request timed out after " + Math.round(deadline/1000) + "s.");
    throw SbError("offline", "Network unreachable — " + ((err && err.message) || "no connection"));
  });
}

/* ---------- PostgREST ---------- */
const REST = {
  /* GET a table. `query` is an already-encoded PostgREST query string.
     An empty array is a legitimate answer: RLS filters silently, it does not
     error. Callers must never turn [] into "loading failed". */
  select: function(table, query){
    return sbRequest("/rest/v1/" + table + (query ? "?" + query : ""))
      .then(function(r){ return Array.isArray(r.body) ? r.body : []; });
  },
  insert: function(table, rows, opts){
    opts = opts || {};
    const prefer = ["return=" + (opts.returning || "representation")];
    if(opts.resolution) prefer.push("resolution=" + opts.resolution);
    return sbRequest("/rest/v1/" + table, {
      method: "POST", body: rows, headers: { "Prefer": prefer.join(",") }
    }).then(function(r){ return Array.isArray(r.body) ? r.body : (r.body ? [r.body] : []); });
  },
  patch: function(table, query, patch){
    return sbRequest("/rest/v1/" + table + "?" + query, {
      method: "PATCH", body: patch, headers: { "Prefer": "return=representation" }
    }).then(function(r){ return Array.isArray(r.body) ? r.body : (r.body ? [r.body] : []); });
  },
  remove: function(table, query){
    return sbRequest("/rest/v1/" + table + "?" + query, { method: "DELETE" }).then(function(){ return true; });
  },
  rpc: function(fn, args){
    return sbRequest("/rest/v1/rpc/" + fn, { method: "POST", body: args || {} })
      .then(function(r){ return r.body; });
  }
};

/* ---------- Storage ---------- */
function dataUrlToBlob(dataUrl){
  const i = String(dataUrl).indexOf(",");
  if(i < 0) return null;
  const head = dataUrl.slice(0, i);
  const type = (/data:([^;,]+)/.exec(head) || [null, "application/octet-stream"])[1];
  const isB64 = head.indexOf(";base64") >= 0;
  const raw = dataUrl.slice(i + 1);
  let bytes;
  if(isB64){
    const bin = atob(raw);
    bytes = new Uint8Array(bin.length);
    for(let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
  }else{
    const s = decodeURIComponent(raw);
    bytes = new Uint8Array(s.length);
    for(let k = 0; k < s.length; k++) bytes[k] = s.charCodeAt(k) & 0xff;
  }
  return new Blob([bytes], { type: type });
}

const Storage = {
  /* Upload with NO upsert. 0003_storage.sql deliberately installs no UPDATE
     policy on the evidence bucket, so every capture must carry a fresh UUID
     filename. A retry of the same op re-POSTs the same path and gets a 409,
     which the outbox treats as "already landed" — that is what makes the
     upload idempotent across a flaky connection. */
  upload: function(bucket, path, dataUrl, contentType){
    const blob = dataUrlToBlob(dataUrl);
    if(!blob) return Promise.reject(SbError("permanent", "Capture bytes were not a data URL."));
    return sbRequest("/storage/v1/object/" + bucket + "/" + path, {
      method: "POST", body: blob, timeout: 60000,
      headers: { "Content-Type": contentType || blob.type || "image/jpeg", "cache-control": "3600" }
    }).then(function(r){ return r.body; });
  },
  /* Batch-sign. One round trip for a whole page of evidence thumbnails. */
  signMany: function(bucket, paths, expiresIn){
    if(!paths.length) return Promise.resolve([]);
    return sbRequest("/storage/v1/object/sign/" + bucket, {
      method: "POST", body: { expiresIn: expiresIn || SIGNED_URL_TTL_S, paths: paths }
    }).then(function(r){ return Array.isArray(r.body) ? r.body : []; });
  },
  publicUrl: function(bucket, path){
    return SB_BASE + "/storage/v1/object/public/" + bucket + "/" + path;
  }
};

/* ==========================================================
   2d. Durable local blob store (IndexedDB, localStorage fallback)
   ------------------------------------------------------------
   A capture taken with no signal has to survive a page reload AND a browser
   restart. localStorage is a 5 MB string bucket, which a couple of full-
   resolution JPEG data URLs will blow straight through, so the bytes live in
   IndexedDB keyed by their eventual Storage path. `resolveImg()` reads this
   store first, so an image that has not uploaded yet still renders from the
   device — and the moment the outbox uploads it, the local copy is dropped and
   the same call transparently starts returning a signed URL.
   ========================================================== */
const Blobs = (function(){
  const mem = Object.create(null);       // key -> data URL, the synchronous read path
  let dbp = null;
  let idbBroken = false;

  function db(){
    if(idbBroken) return Promise.reject(SbError("permanent", "IndexedDB unavailable"));
    if(dbp) return dbp;
    dbp = new Promise(function(res, rej){
      let req;
      try{ req = indexedDB.open("niva.blobs", 1); }
      catch(e){ idbBroken = true; return rej(e); }
      req.onupgradeneeded = function(){
        try{ req.result.createObjectStore("img"); }catch(e){}
      };
      req.onsuccess = function(){ res(req.result); };
      req.onerror   = function(){ idbBroken = true; rej(req.error); };
      req.onblocked = function(){ idbBroken = true; rej(new Error("blocked")); };
    });
    dbp.catch(function(){ idbBroken = true; });
    return dbp;
  }
  function tx(mode, fn){
    return db().then(function(d){
      return new Promise(function(res, rej){
        const t = d.transaction("img", mode);
        const s = t.objectStore("img");
        let out;
        try{ out = fn(s); }catch(e){ return rej(e); }
        t.oncomplete = function(){ res(out && out.result !== undefined ? out.result : out); };
        t.onerror    = function(){ rej(t.error); };
        t.onabort    = function(){ rej(t.error); };
      });
    });
  }
  const LS_FALLBACK = "niva.blob.";

  return {
    /* Synchronous read — this is what the render path uses. */
    get: function(key){ return mem[key] || null; },
    has: function(key){ return !!mem[key]; },
    keys: function(){ return Object.keys(mem); },
    put: function(key, dataUrl){
      mem[key] = dataUrl;
      return tx("readwrite", function(s){ s.put(dataUrl, key); }).catch(function(){
        // No IndexedDB (Safari private mode, locked-down enterprise policy).
        // Fall back to localStorage and be honest if that fails too.
        if(!lsSet(LS_FALLBACK + key, dataUrl)){
          try{ toast("This capture is held in memory only — it will not survive a reload.", true); }catch(e){}
        }
      });
    },
    del: function(key){
      delete mem[key];
      lsDel(LS_FALLBACK + key);
      return tx("readwrite", function(s){ s.delete(key); }).catch(function(){});
    },
    /* Pull everything back into memory at boot, before the first render. */
    hydrate: function(){
      let n = 0;
      try{
        for(let i = 0; i < localStorage.length; i++){
          const k = localStorage.key(i);
          if(k && k.indexOf(LS_FALLBACK) === 0){ mem[k.slice(LS_FALLBACK.length)] = lsGet(k); n++; }
        }
      }catch(e){}
      return tx("readonly", function(s){
        const out = [];
        const req = s.openCursor();
        req.onsuccess = function(){
          const c = req.result;
          if(!c) return;
          mem[c.key] = c.value; out.push(c.key);
          c.continue();
        };
        return { get result(){ return out; } };
      }).then(function(keys){ return (keys ? keys.length : 0) + n; },
              function(){ return n; });
    },
    /* Drop anything the outbox no longer references, so a long-lived device
       does not accumulate uploaded bytes forever. */
    sweep: function(liveKeys){
      const live = Object.create(null);
      (liveKeys || []).forEach(function(k){ live[k] = 1; });
      const self = this;
      Object.keys(mem).forEach(function(k){ if(!live[k]) self.del(k); });
    }
  };
})();

/* ---------- the profile column list, and the one column that may be absent ----------
   `height_cm` arrives with supabase/migrations/0006_profile_height.sql. Naming
   it in a select against a project that has not applied 0006 yet is a 400 from
   PostgREST ("column profiles.height_cm does not exist") — and that select is
   the one that runs at SIGN-IN, so getting this wrong locks every user out of a
   database that is otherwise perfectly healthy.

   So it is asked for optimistically ONCE, and the first refusal that names the
   column downgrades the list for the rest of the session. The app then behaves
   exactly as it did before 0006: no stature is known, h falls back to the badged
   default, and the height question is not asked (there is nowhere to put the
   answer). Nothing is silently dropped — profileHeightSupported() is what the
   UI reads before offering to store anything. */
let PROFILE_COLS_FULL = "id,full_name,role,title,region,is_active,height_cm";
let PROFILE_COLS_BASE = "id,full_name,role,title,region,is_active";
let PROFILE_HEIGHT_COL = true;
function profileCols(){ return PROFILE_HEIGHT_COL ? PROFILE_COLS_FULL : PROFILE_COLS_BASE; }
function profileHeightSupported(){ return PROFILE_HEIGHT_COL; }
/* True when this error is "that column is not there", and nothing else. A
   network failure, a 401 or an RLS-filtered empty result must NOT downgrade. */
function profileHeightMissing(err){
  if(!PROFILE_HEIGHT_COL || !err) return false;
  if(err.kind === "offline" || err.kind === "timeout" || err.kind === "auth" || err.retryable) return false;
  const s = [err.message, err.details, err.hint, err.code].join(" ");
  if(!/height_cm/.test(s)) return false;
  PROFILE_HEIGHT_COL = false;
  return true;
}

/* ==========================================================
   2e. Session — GoTrue email + password
   ------------------------------------------------------------
   The access token lives in localStorage next to the refresh token, which is
   what supabase-js does and what makes "close the tab, come back tomorrow"
   work. A silent refresh is scheduled a minute before expiry; if it fails for
   a network reason it backs off and retries, and if it fails for an auth
   reason the session is marked EXPIRED rather than dropped — the outbox and
   the local cache stay exactly where they are, and the user is asked to sign
   in again. Nothing captured in the field is ever thrown away by a token.
   ========================================================== */
const Session = (function(){
  let s = null;            // { access_token, refresh_token, expires_at, user:{id,email} }
  let profile = null;      // the profiles row — the ONLY source of role
  let state = "signedout"; // "signedout" | "ready" | "expired"
  let timer = null;
  let refreshing = null;
  let backoff = 0;
  const subs = [];

  function emit(){ subs.slice().forEach(function(f){ try{ f(state); }catch(e){} }); }

  function persist(){
    if(!s){ lsDel(SESSION_KEY); return; }
    lsSet(SESSION_KEY, JSON.stringify({
      access_token: s.access_token, refresh_token: s.refresh_token,
      expires_at: s.expires_at, user: s.user, profile: profile
    }));
  }

  function adopt(body){
    const now = Math.floor(Date.now() / 1000);
    s = {
      access_token:  body.access_token,
      refresh_token: body.refresh_token,
      expires_at:    body.expires_at || (now + (body.expires_in || 3600)),
      user:          body.user ? { id: body.user.id, email: body.user.email } : (s ? s.user : null)
    };
    backoff = 0;
    persist();
    schedule();
  }

  function schedule(){
    if(timer){ clearTimeout(timer); timer = null; }
    if(!s) return;
    const now = Math.floor(Date.now() / 1000);
    let inS = (s.expires_at - 60) - now;         // refresh a minute early
    if(backoff) inS = Math.max(inS, backoff);
    if(inS < 5) inS = 5;
    if(inS > 3000) inS = 3000;                   // re-arm at least every 50 min
    timer = setTimeout(function(){ refresh().catch(function(){}); }, inS * 1000);
  }

  function refresh(){
    if(refreshing) return refreshing;
    if(!s || !s.refresh_token) return Promise.reject(SbError("auth", "No refresh token."));
    refreshing = sbRequest("/auth/v1/token?grant_type=refresh_token", {
      method: "POST", token: null, body: { refresh_token: s.refresh_token }, timeout: 15000
    }).then(function(r){
      refreshing = null;
      adopt(r.body);
      if(state === "expired"){ state = "ready"; emit(); }
      return s;
    }, function(err){
      refreshing = null;
      if(err.retryable){
        // The token is probably fine; we just cannot reach GoTrue. Try again.
        backoff = backoff ? Math.min(backoff * 2, 300) : 15;
        schedule();
      }else{
        state = "expired"; emit();
      }
      throw err;
    });
    return refreshing;
  }

  return {
    get state(){ return state; },
    token: function(){ return s ? s.access_token : null; },
    user:  function(){ return s ? s.user : null; },
    userId: function(){ return s && s.user ? s.user.id : null; },
    profile: function(){ return profile; },
    role: function(){ return profile ? profile.role : null; },
    onChange: function(f){ subs.push(f); },

    /* Whether a stored session exists at all — decides login screen vs app. */
    restore: function(){
      const raw = lsJSON(SESSION_KEY, null);
      if(!raw || !raw.access_token || !raw.refresh_token) return false;
      s = { access_token: raw.access_token, refresh_token: raw.refresh_token,
            expires_at: raw.expires_at || 0, user: raw.user || null };
      profile = raw.profile || null;
      const now = Math.floor(Date.now() / 1000);
      state = "ready";
      if(s.expires_at <= now + 30){
        // Token already dead. Try a refresh; stay "ready" optimistically so the
        // cached app is usable offline, and let the 401 path demote us.
        refresh().catch(function(){});
      }else schedule();
      return true;
    },

    signIn: function(email, password){
      return sbRequest("/auth/v1/token?grant_type=password", {
        method: "POST", token: null, timeout: 20000,
        body: { email: String(email || "").trim(), password: String(password || "") }
      }).then(function(r){
        adopt(r.body);
        return Session.loadProfile();
      }).then(function(){
        state = "ready"; persist(); emit();
        return profile;
      });
    },

    /* Role comes from here and from nowhere else. */
    loadProfile: function(){
      const uid = Session.userId();
      if(!uid) return Promise.reject(SbError("auth", "No session."));
      const q = function(cols){
        return REST.select("profiles", "select=" + cols + "&id=eq." +
                            encodeURIComponent(uid) + "&limit=1");
      };
      const take = function(rows){
        if(!rows.length){
          throw SbError("permanent", "Signed in, but this account has no profile row in the project.",
                        { nivaCode: "NIVA_NO_PROFILE" });
        }
        /* A downgraded read must not erase a height this device already knows
           about and may still have queued — only a read that actually carried
           the column is allowed to overwrite it. */
        const prev = profile;
        profile = rows[0];
        if(!profileHeightSupported() && prev && prev.height_cm != null)
          profile.height_cm = prev.height_cm;
        persist();
        return profile;
      };
      return q(profileCols()).then(take, function(err){
        if(!profileHeightMissing(err)) throw err;
        return q(profileCols()).then(take);
      });
    },

    /* Merge a patch into the cached profile row. The ONLY caller is the height
       question; `role` is filtered out here as well as by the server's guard
       trigger, so a bug in a future caller cannot make the client believe it
       has a role the database never granted. */
    mergeProfile: function(patch){
      if(!profile || !patch) return null;
      Object.keys(patch).forEach(function(k){
        if(k === "role" || k === "id") return;
        profile[k] = patch[k];
      });
      persist();
      return profile;
    },

    /* Called by the outbox / repo when a request comes back 401. Does not drop
       the session: queued work and the local cache must survive. */
    markExpired: function(){
      if(state === "expired") return;
      state = "expired"; emit();
      refresh().catch(function(){});
    },

    signOut: function(){
      const had = s;
      if(timer){ clearTimeout(timer); timer = null; }
      const done = function(){
        s = null; profile = null; state = "signedout";
        lsDel(SESSION_KEY); emit();
      };
      if(had){
        return sbRequest("/auth/v1/logout", { method: "POST", timeout: 8000 })
          .then(done, done);
      }
      done();
      return Promise.resolve();
    },

    /* Force a refresh now (used when a 401 arrives mid-drain). */
    forceRefresh: refresh
  };
})();

/* ==========================================================
   2f. Signed-URL cache for private evidence
   ------------------------------------------------------------
   The evidence bucket is private, so every photo needs a signed URL. Signing
   inside the render path would mean a network round trip per <img> on every
   re-render, which on the approvals screen is dozens of requests for the same
   dozen objects. So: one batched sign per tick for whatever is newly visible,
   answers cached until they are close to expiry, and the cache persisted so a
   reload does not re-sign everything either.
   ========================================================== */
const Signer = (function(){
  let cache = lsJSON(SIGN_KEY, {});      // path -> { url, at }
  const wanted = Object.create(null);
  const failed = Object.create(null);
  let flushT = null, persistT = null;

  function persist(){
    if(persistT) return;
    persistT = setTimeout(function(){
      persistT = null;
      const now = Date.now();
      const keep = {};
      Object.keys(cache).forEach(function(p){
        if(now - cache[p].at < SIGNED_URL_TTL_S * 1000) keep[p] = cache[p];
      });
      cache = keep;
      lsSet(SIGN_KEY, JSON.stringify(cache));
    }, 1500);
  }

  function flush(){
    flushT = null;
    const paths = Object.keys(wanted).slice(0, 100);
    if(!paths.length) return;
    paths.forEach(function(p){ delete wanted[p]; });
    if(!SB_CONFIGURED || Session.state !== "ready"){ return; }
    Storage.signMany("evidence", paths, SIGNED_URL_TTL_S).then(function(rows){
      let any = false;
      rows.forEach(function(row){
        const p = String(row.path || "").replace(/^\/+/, "");
        if(row.signedURL || row.signedUrl){
          const rel = row.signedURL || row.signedUrl;
          cache[p] = { url: SB_BASE + "/storage/v1" + (rel.indexOf("/") === 0 ? rel : "/" + rel), at: Date.now() };
          delete failed[p];
          any = true;
        }else{
          // Missing object (the seed ships metadata with no bytes) or no
          // permission. Either way, stop asking; the caller falls back.
          failed[p] = Date.now();
        }
      });
      persist();
      if(any) scheduleRerender();
    }, function(err){
      if(err.kind === "auth") Session.markExpired();
      // Do not mark paths failed on a transport error — try again next render.
      paths.forEach(function(p){ delete failed[p]; });
    });
  }

  let rerenderT = null;
  function scheduleRerender(){
    if(rerenderT) return;
    rerenderT = setTimeout(function(){ rerenderT = null; try{ render(); }catch(e){} }, 120);
  }

  return {
    /* Synchronous: a usable URL now, or null plus a queued sign. */
    urlFor: function(path){
      const hit = cache[path];
      const now = Date.now();
      if(hit){
        if(now - hit.at < SIGNED_URL_REFRESH_S * 1000) return hit.url;
        wanted[path] = 1;                    // stale-while-revalidate
        if(!flushT) flushT = setTimeout(flush, 40);
        return hit.url;
      }
      if(failed[path] && now - failed[path] < 60000) return null;
      wanted[path] = 1;
      if(!flushT) flushT = setTimeout(flush, 40);
      return null;
    },
    forget: function(path){ delete cache[path]; delete failed[path]; },
    clear: function(){ cache = {}; lsDel(SIGN_KEY); }
  };
})();

/* ==========================================================
   2g. Outbox — the durable write queue
   ------------------------------------------------------------
   Every mutation in this app goes in here first and is applied to the server
   second. That inversion is the whole offline story: a merchandiser in a shop
   basement gets the same UX as one on 5G, and the queue survives a reload, a
   browser restart, an expired token and a flat battery.

   IDEMPOTENCY. Retrying a write whose response was lost must not create a
   second row. Every insert carries a CLIENT-GENERATED uuid primary key, so a
   duplicate POST comes back 409 / 23505 on the *_pkey constraint and is
   treated as success. Storage uploads use a fresh uuid filename per capture and
   never set upsert, so a duplicate PUT is likewise a benign 409. The one table
   that cannot work this way is `audit_events` (bigint identity PK), so a retry
   there first probes for an identical row before re-posting.

   ORDERING. Items drain strictly FIFO and are tagged with a `group`. A group is
   an atomic-ish unit of work: a submission is
     [upload bytes] -> [insert placements] -> [insert image rows] -> [patch task]
   because the storage policy and the RLS policies both require the task to
   still be open when the evidence lands. If any item in a group fails
   permanently the rest of that group is cancelled together, so a task can never
   end up Submitted with half its evidence missing.
   ========================================================== */
const Outbox = (function(){
  let items = [];
  let dead  = [];
  let draining = false;
  let timer = null;
  let lastSyncedAt = lsJSON("niva.lastsync.v1", null);
  const subs = [];

  function emit(){
    subs.slice().forEach(function(f){ try{ f(); }catch(e){} });
  }
  function persist(){
    lsSet(OUTBOX_KEY, JSON.stringify({ v: 1, items: items, dead: dead.slice(0, 50) }));
    emit();
  }
  function restore(){
    const p = lsJSON(OUTBOX_KEY, null);
    if(p && Array.isArray(p.items)) items = p.items;
    if(p && Array.isArray(p.dead))  dead  = p.dead;
  }

  function online(){
    return (typeof navigator === "undefined" || navigator.onLine !== false);
  }

  /* Which of my queued bytes are still needed — used to sweep IndexedDB. */
  function liveBlobKeys(){
    const out = [];
    items.forEach(function(it){ if(it.blobKey) out.push(it.blobKey); });
    return out;
  }

  function cancelGroup(group, reason){
    if(!group) return;
    const keep = [];
    items.forEach(function(it){
      if(it.group === group){
        it.lastError = it.lastError || reason;
        dead.unshift(it);
      }else keep.push(it);
    });
    items = keep;
  }

  function retryDelay(tries){
    const base = Math.min(60000, 1000 * Math.pow(2, Math.max(0, tries - 1)));
    return base + Math.floor(Math.random() * 400);
  }

  /* ---- per-kind execution ---- */
  function run(it){
    switch(it.kind){
      case "store.upsert":   return runStoreUpsert(it);
      case "task.insert":    return REST.insert("tasks", it.payload.row).then(afterTaskInsert(it));
      case "task.patch":     return runTaskPatch(it);
      case "placement.insert":
        return REST.insert("placements", it.payload.row).then(function(rows){
          Sync.onPlacementInserted(it, rows[0] || it.payload.row);
        });
      case "image.upload":   return runUpload(it);
      case "image.insert":
        return REST.insert("task_images", it.payload.row).then(function(rows){
          Sync.onImageInserted(it, rows[0] || it.payload.row);
        });
      case "audit.insert":   return runAudit(it);
      case "notif.insert":
        return REST.insert("notifications", it.payload.row).then(function(){});
      case "notif.read":
        return REST.patch("notifications",
          "id=in.(" + it.payload.ids.map(encodeURIComponent).join(",") + ")",
          { read_at: it.payload.at }).then(function(){});
      case "profile.patch":  return runProfilePatch(it);
      case "image.delete":
        return REST.remove("task_images", "id=eq." + encodeURIComponent(it.payload.id))
          .then(function(){}, function(e){ if(e.kind === "permanent" || e.status === 404) return; throw e; });
    }
    return Promise.reject(SbError("permanent", "Unknown outbox op: " + it.kind));
  }

  function benignDuplicate(err){
    return err.kind === "conflict" &&
      (/_pkey/.test(String(err.message)) || /Key \(id\)/.test(String(err.details)) ||
       /resource already exists|The resource already exists|Duplicate/i.test(String(err.message)));
  }

  function afterTaskInsert(it){
    return function(rows){ Sync.onTaskInserted(it, rows[0] || it.payload.row); };
  }

  /* A store created offline may collide with one that already exists (the
     unique index is on lower(store_code), not on the id we invented). When it
     does, adopt the server's row and rewrite every queued reference to our id. */
  function runStoreUpsert(it){
    return REST.insert("stores", it.payload.row).then(function(rows){
      Sync.onStoreInserted(it, rows[0] || it.payload.row);
    }, function(err){
      if(err.kind !== "conflict") throw err;
      if(benignDuplicate(err)){ Sync.onStoreInserted(it, it.payload.row); return; }
      return REST.select("stores", "select=*&store_code=eq." +
                         encodeURIComponent(it.payload.row.store_code) + "&limit=1")
        .then(function(rows){
          if(!rows.length) throw err;
          remapId(it.payload.row.id, rows[0].id);
          Sync.onStoreInserted(it, rows[0]);
        });
    });
  }

  /* PATCHing a status that the server has already applied comes back as
     NIVA_ILLEGAL_TRANSITION. That is not a failure — it is a duplicate. Ask the
     server what the status actually is and reconcile. */
  function runTaskPatch(it){
    const q = "id=eq." + encodeURIComponent(it.payload.taskId);
    return REST.patch("tasks", q, it.payload.patch).then(function(rows){
      if(!rows.length){
        // RLS matched no row for the UPDATE. Either someone else moved it out
        // from under us or we may no longer touch it. Find out before deciding.
        return REST.select("tasks", "select=*&" + q + "&limit=1").then(function(cur){
          if(!cur.length) throw SbError("forbidden", "The server did not accept the change and the task is no longer visible to you.");
          Sync.onTaskPatched(it, cur[0], true);
        });
      }
      Sync.onTaskPatched(it, rows[0], false);
    }, function(err){
      const target = it.payload.patch && it.payload.patch.status;
      if(target && (err.nivaCode === "NIVA_ILLEGAL_TRANSITION" || err.kind === "forbidden")){
        return REST.select("tasks", "select=*&" + q + "&limit=1").then(function(cur){
          if(cur.length && cur[0].status === target){
            Sync.onTaskPatched(it, cur[0], true);   // already applied — benign
            return;
          }
          throw err;
        }, function(){ throw err; });
      }
      throw err;
    });
  }

  /* Does this object already exist in the bucket? Asking the sign endpoint is
     the cheapest existence check that works on a PRIVATE bucket: it answers
     per-path with either a signedURL or an error, and it needs no policy we do
     not already rely on for rendering evidence. */
  function objectExists(bucket, path){
    return Storage.signMany(bucket, [path], 60).then(function(rows){
      for(let i = 0; i < rows.length; i++){
        const p = String(rows[i].path || "").replace(/^\/+/, "");
        if(p === path && (rows[i].signedURL || rows[i].signedUrl)) return true;
      }
      return false;
    }, function(err){
      if(err && err.retryable) throw err;      // transport problem — not an answer
      return false;
    });
  }

  function runUpload(it){
    const data = Blobs.get(it.blobKey);
    if(!data){
      /* The bytes are gone. Three ways that happens, and they are NOT the same:
           a) this exact object already uploaded on an earlier attempt and the
              blob was dropped, but a LATER item in the group failed and the
              user has re-queued the submission;
           b) the browser evicted IndexedDB;
           c) a sweep raced us.
         (a) is recoverable and common on a flaky link, so ask the server
         whether the object is already there before declaring evidence lost.
         Only if it genuinely is not do we fail — and we fail loudly, because
         silently "succeeding" would mark a task submitted with no photo. */
      return objectExists(it.payload.bucket, it.payload.path).then(function(there){
        if(there){ Sync.onUploaded(it); return; }
        throw SbError("permanent", "The captured image bytes are no longer on this device and never reached the server.");
      });
    }
    return Storage.upload(it.payload.bucket, it.payload.path, data, it.payload.contentType)
      .then(function(){ Sync.onUploaded(it); },
            function(err){
              if(err.kind === "conflict"){ Sync.onUploaded(it); return; }   // already there
              throw err;
            });
  }

  /* The user's own profile row — today, only `height_cm`.
     Idempotent for free: it is a PATCH to a fixed value, so a retry whose
     response was lost writes the same number again.

     TWO refusals are treated as "done" rather than as failures the user has to
     look at, and neither hides a lost write:

       · the column does not exist  — 0006_profile_height.sql has not been
         applied to this project. The value stays on the device and in force
         locally; there is simply nowhere on the server to put it. Parking this
         in the sync panel would show a permanent red "1 failed" that no
         merchandiser can act on.
       · zero rows came back        — RLS matched nothing, which for a PATCH of
         one's OWN row means the session is not who it thinks it is. Re-reading
         the profile is the honest response, not retrying forever.

     Anything else — a transport failure, a 5xx, the role-escalation guard —
     propagates exactly like every other op and surfaces in the sync panel. */
  function runProfilePatch(it){
    return REST.patch("profiles", "id=eq." + encodeURIComponent(it.payload.id), it.payload.patch)
      .then(function(rows){
        if(!rows.length) return Session.loadProfile().then(function(){}, function(){});
        Sync.onProfilePatched(it, rows[0]);
      }, function(err){
        if(profileHeightMissing(err)){
          toast("Your height is saved on this phone. The server has not been updated for it yet — "
              + "ask your manager to apply the latest database migration.", true);
          return;
        }
        throw err;
      });
  }

  /* audit_events has a server-assigned identity PK, so it is the one write we
     cannot make idempotent by construction. On any retry, look first. */
  function runAudit(it){
    const row = it.payload.row;
    const probe = function(){
      /* `tries` is incremented before run(), so the FIRST attempt arrives here
         with tries === 1. Probing then would be a wasted round trip on every
         audit event, and worse, could collapse two genuinely distinct events
         that share a task, an action and a millisecond. Only a real RETRY
         needs to look first. */
      if(it.tries <= 1) return Promise.resolve(false);
      let q = "select=id&limit=1&occurred_at=eq." + encodeURIComponent(row.occurred_at) +
              "&action=eq." + encodeURIComponent(row.action);
      if(row.task_id) q += "&task_id=eq." + encodeURIComponent(row.task_id);
      return REST.select("audit_events", q).then(function(rows){ return rows.length > 0; },
                                                 function(){ return false; });
    };
    return probe().then(function(exists){
      if(exists) return;
      return REST.insert("audit_events", row, { returning: "minimal" }).then(function(){});
    });
  }

  /* Rewrite a provisional client id everywhere it is still referenced. */
  function remapId(oldId, newId){
    if(!oldId || !newId || oldId === newId) return;
    const walk = function(o){
      if(!o || typeof o !== "object") return;
      Object.keys(o).forEach(function(k){
        if(o[k] === oldId) o[k] = newId;
        else if(o[k] && typeof o[k] === "object") walk(o[k]);
      });
    };
    items.forEach(walk);
    Sync.onIdRemapped(oldId, newId);
  }

  /* Parking on a transient blocker (no session, no radio) used to be a dead
     end: step() returned and only an explicit kick() could ever restart it. A
     silent token refresh, or a network that came back without firing an
     `online` event, therefore left durable work sitting in the queue
     indefinitely. Every transient bail now re-arms a slow heartbeat, so the
     queue is self-healing even if nothing else in the app notices. */
  const PARK_MS = 15000;
  function park(){ schedule(PARK_MS); }

  function step(){
    if(draining) return;
    if(!items.length){ draining = false; return; }
    if(!SB_CONFIGURED) return;                     // never resolvable at runtime
    if(Session.state !== "ready"){ return park(); }
    if(!online()){ return park(); }

    const it = items[0];
    if(it.userId && it.userId !== Session.userId()) {
      // Queued by a different account on this device. Never drain it under the
      // wrong identity; park it until that user signs back in.
      const mine = items.filter(function(x){ return !x.userId || x.userId === Session.userId(); });
      if(!mine.length) return;                     // all of it belongs to someone else — nothing to do

      items = mine.concat(items.filter(function(x){ return x.userId && x.userId !== Session.userId(); }));
      persist();
      return schedule(0);
    }
    if(it.nextAt && it.nextAt > Date.now()){ return schedule(it.nextAt - Date.now()); }

    draining = true;
    it.tries = (it.tries || 0) + 1;
    emit();

    let p;
    try{ p = run(it); }catch(e){ p = Promise.reject(e); }

    Promise.resolve(p).then(function(){
      draining = false;
      items.shift();
      it.lastError = null;
      lastSyncedAt = new Date().toISOString();
      lsSet("niva.lastsync.v1", JSON.stringify(lastSyncedAt));
      if(it.blobKey && it.kind === "image.upload") Blobs.del(it.blobKey);
      persist();
      schedule(0);
    }, function(err){
      draining = false;
      if(benignDuplicate(err)){
        // A retry of something that already landed.
        items.shift(); persist(); schedule(0); return;
      }
      if(err.kind === "auth"){
        it.lastError = errText(err);
        Session.markExpired();
        persist();
        return;                              // paused until re-auth
      }
      if(err.retryable){
        /* One delay, used for both the stored deadline and the timer. Calling
           retryDelay() twice would jitter them apart and wake step() early for
           nothing. */
        const wait = retryDelay(it.tries);
        it.lastError = errText(err);
        it.nextAt = Date.now() + wait;
        persist();
        schedule(wait);
        return;
      }
      // Permanent. Take the whole group down together and tell the human.
      it.lastError = errText(err) + (err.hint ? " (" + err.hint + ")" : "");
      it.failedAt = new Date().toISOString();
      items.shift();
      dead.unshift(it);
      if(it.group) cancelGroup(it.group, "Cancelled because an earlier step in the same submission failed.");
      Sync.onOpFailed(it, err);
      persist();
      schedule(0);
    });
  }

  function schedule(ms){
    if(timer) clearTimeout(timer);
    timer = setTimeout(function(){ timer = null; step(); }, Math.max(0, ms || 0));
  }

  return {
    restore: restore,
    onChange: function(f){ subs.push(f); },
    /* push(kind, payload, opts) -> the op id */
    push: function(kind, payload, opts){
      opts = opts || {};
      const it = {
        id: uuid4(), userId: Session.userId(), group: opts.group || null,
        kind: kind, payload: payload, blobKey: opts.blobKey || null,
        label: opts.label || kind, taskId: opts.taskId || null,
        createdAt: new Date().toISOString(), tries: 0, nextAt: 0, lastError: null
      };
      items.push(it);
      persist();
      schedule(0);
      return it.id;
    },
    kick: function(){ schedule(0); },
    pending: function(){ return items.length; },
    pendingFor: function(taskId){
      let n = 0; items.forEach(function(it){ if(it.taskId === taskId) n++; }); return n;
    },
    groupPending: function(group){
      let n = 0; items.forEach(function(it){ if(it.group === group) n++; }); return n;
    },
    items: function(){ return items.slice(); },
    failures: function(){ return dead.slice(); },
    /* Is this op still un-landed? The render layer asks so it can keep showing
       a locally-created audit entry or notification that the server has not
       accepted yet, instead of having a poll silently erase it. */
    has: function(opId){
      if(!opId) return false;
      for(let i = 0; i < items.length; i++) if(items[i].id === opId) return true;
      for(let j = 0; j < dead.length;  j++) if(dead[j].id  === opId) return true;
      return false;
    },
    lastSynced: function(){ return lastSyncedAt; },
    busy: function(){ return draining; },
    liveBlobKeys: liveBlobKeys,
    retryFailed: function(){
      const back = dead.splice(0, dead.length);
      back.reverse().forEach(function(it){
        it.tries = 0; it.nextAt = 0; it.lastError = null; delete it.failedAt;
        items.push(it);
      });
      persist(); schedule(0);
    },
    discardFailed: function(){
      dead.forEach(function(it){ if(it.blobKey) Blobs.del(it.blobKey); });
      dead = []; persist();
    },
    /* Wipe everything belonging to nobody / to this user (sign-out reset). */
    clearAll: function(){
      items.forEach(function(it){ if(it.blobKey) Blobs.del(it.blobKey); });
      items = []; dead = []; persist();
    }
  };
})();

/* ==========================================================
   3. Programmatic placeholder imagery (canvas -> data URL)
   ========================================================== */
const IMG_CACHE = Object.create(null);
function genShot(code, kind, idx){
  const key = code+"|"+kind+"|"+idx;
  if(IMG_CACHE[key]) return IMG_CACHE[key];
  const W=560,H=380;
  const c = document.createElement("canvas"); c.width=W; c.height=H;
  const x = c.getContext("2d");
  const hue = hashCode(code) % 360;
  const after = kind === "AFTER";
  const sat = after ? 46 : 12;
  const lit = after ? 34 : 26;

  const g = x.createLinearGradient(0,0,W,H);
  g.addColorStop(0, "hsl("+hue+","+sat+"%,"+(lit+12)+"%)");
  g.addColorStop(1, "hsl("+((hue+40)%360)+","+sat+"%,"+(lit-8)+"%)");
  x.fillStyle=g; x.fillRect(0,0,W,H);

  // floor
  x.fillStyle = "rgba(0,0,0,.28)"; x.fillRect(0,H-72,W,72);
  // shelving / fixture
  const rnd = mulberry(hashCode(code+kind+idx));
  x.strokeStyle="rgba(255,255,255,.16)"; x.lineWidth=2;
  for(let i=1;i<5;i++){ const y=44+i*54; x.beginPath(); x.moveTo(28,y); x.lineTo(W-28,y); x.stroke(); }
  // products
  for(let r=0;r<4;r++){
    for(let i=0;i<9;i++){
      if(!after && rnd()<0.42) continue;
      const w = 30+rnd()*14, h = 26+rnd()*16;
      const px = 34 + i*(W-80)/9 + rnd()*4, py = 44+r*54 - h;
      x.fillStyle = after
        ? "hsl("+((hue + i*9)%360)+",68%,"+(52+rnd()*16)+"%)"
        : "hsla(0,0%,"+(58+rnd()*22)+"%,.72)";
      x.fillRect(px,py,w,h);
      x.fillStyle="rgba(255,255,255,.20)"; x.fillRect(px,py,w,5);
    }
  }
  if(after){
    // branding header panel
    x.fillStyle="hsl("+hue+",74%,46%)"; x.fillRect(24,18,W-48,42);
    x.fillStyle="rgba(255,255,255,.94)";
    x.font="700 21px system-ui, sans-serif"; x.textAlign="center";
    x.fillText("BRAND DISPLAY INSTALLED", W/2, 46);
  }
  // vignette
  const vg = x.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.92);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.45)");
  x.fillStyle=vg; x.fillRect(0,0,W,H);

  // label plate
  x.textAlign="left";
  x.fillStyle="rgba(6,12,20,.78)"; x.fillRect(0,H-46,W,46);
  x.fillStyle= after ? "#5eead4" : "#cbd5e1";
  x.font="800 17px ui-monospace, Menlo, monospace";
  x.fillText(kind + (idx>0 ? " #"+(idx+1) : ""), 14, H-24);
  x.fillStyle="#e2e8f0"; x.font="600 13px ui-monospace, Menlo, monospace";
  x.fillText(code, 14, H-8);
  x.textAlign="right"; x.fillStyle="rgba(226,232,240,.6)"; x.font="500 11px ui-monospace, Menlo, monospace";
  x.fillText("NIVA SAMPLE IMAGE", W-14, H-8);

  const url = c.toDataURL("image/jpeg", 0.68);
  IMG_CACHE[key] = url;
  return url;
}
// Simulated live capture (used by both Manager before-photo and Merchandiser after-photo)
function simulateCapture(code, kind, idx, meta){
  const base = genShot(code, kind, (idx||0));
  return new Promise(function(resolve){
    const im = new Image();
    im.onload = function(){
      const c = document.createElement("canvas"); c.width=im.width; c.height=im.height;
      const x = c.getContext("2d");
      x.drawImage(im,0,0);
      x.fillStyle="rgba(6,12,20,.62)"; x.fillRect(0,0,c.width,26);
      x.fillStyle="#5eead4"; x.font="700 12px ui-monospace, Menlo, monospace"; x.textAlign="left";
      x.fillText("● SIMULATED CAPTURE  " + (meta||""), 10, 18);
      resolve(c.toDataURL("image/jpeg", 0.7));
    };
    im.onerror = function(){ resolve(base); };
    im.src = base;
  });
}
/* Poster artwork placeholder — drawn at the poster's true aspect ratio so the
   overlay geometry is exercised end-to-end even without a real upload. */
function genPoster(seed, wFt, hFt){
  const w = Math.max(0.25, Number(wFt)||4), h = Math.max(0.25, Number(hFt)||3);
  const key = "poster|"+seed+"|"+w+"|"+h;
  if(IMG_CACHE[key]) return IMG_CACHE[key];
  const long = 760, ar = w/h;
  const W = ar >= 1 ? long : Math.round(long*ar);
  const H = ar >= 1 ? Math.round(long/ar) : long;
  const c = document.createElement("canvas"); c.width=W; c.height=H;
  const x = c.getContext("2d");
  const hue = hashCode(String(seed)) % 360;
  const rnd = mulberry(hashCode(String(seed)+"poster"));

  const g = x.createLinearGradient(0,0,W,H);
  g.addColorStop(0,"hsl("+hue+",72%,46%)");
  g.addColorStop(1,"hsl("+((hue+38)%360)+",76%,30%)");
  x.fillStyle=g; x.fillRect(0,0,W,H);

  // diagonal light sweep
  x.save(); x.globalAlpha=.10; x.fillStyle="#fff";
  x.beginPath(); x.moveTo(0,H*0.72); x.lineTo(W,H*0.30); x.lineTo(W,H); x.lineTo(0,H); x.closePath(); x.fill();
  x.restore();

  const pad = Math.round(Math.min(W,H)*0.055);
  // brand block
  const bbH = Math.round(H*0.15);
  x.fillStyle="rgba(6,12,20,.88)"; x.fillRect(pad,pad,W-pad*2,bbH);
  x.fillStyle="#fff"; x.textAlign="left";
  x.font="800 "+Math.round(bbH*0.44)+"px system-ui, sans-serif";
  x.fillText("NIVA", pad+Math.round(bbH*0.30), pad+Math.round(bbH*0.63));
  x.fillStyle="hsl("+hue+",85%,62%)";
  x.font="700 "+Math.round(bbH*0.24)+"px ui-monospace, Menlo, monospace";
  x.fillText("KEY VISUAL", pad+Math.round(bbH*0.30)+Math.round(bbH*1.55), pad+Math.round(bbH*0.60));

  // headline
  x.fillStyle="#fff"; x.textAlign="center";
  const hlY = pad+bbH+Math.round(H*0.14);
  x.font="800 "+Math.round(Math.min(W*0.115,H*0.14))+"px system-ui, sans-serif";
  x.fillText("FRESH", W/2, hlY);
  x.font="800 "+Math.round(Math.min(W*0.115,H*0.14))+"px system-ui, sans-serif";
  x.fillText("EVERY DAY", W/2, hlY+Math.round(Math.min(W*0.125,H*0.155)));

  // product silhouette — a bottle, centred in the lower two-thirds
  const cx0 = W/2, baseY = H-pad-Math.round(H*0.14);
  const bh = Math.round(H*0.34), bw = Math.round(Math.min(W*0.22, bh*0.46));
  x.fillStyle="rgba(6,12,20,.82)";
  x.beginPath();
  x.moveTo(cx0-bw/2, baseY);
  x.lineTo(cx0-bw/2, baseY-bh*0.62);
  x.quadraticCurveTo(cx0-bw/2, baseY-bh*0.80, cx0-bw*0.19, baseY-bh*0.84);
  x.lineTo(cx0-bw*0.19, baseY-bh*0.97);
  x.lineTo(cx0+bw*0.19, baseY-bh*0.97);
  x.lineTo(cx0+bw*0.19, baseY-bh*0.84);
  x.quadraticCurveTo(cx0+bw/2, baseY-bh*0.80, cx0+bw/2, baseY-bh*0.62);
  x.lineTo(cx0+bw/2, baseY); x.closePath(); x.fill();
  x.fillStyle="hsl("+((hue+18)%360)+",88%,58%)";
  x.fillRect(cx0-bw/2, baseY-bh*0.46, bw, Math.round(bh*0.17));
  x.fillStyle="rgba(255,255,255,.22)";
  x.fillRect(cx0-bw*0.34, baseY-bh*0.60, Math.round(bw*0.14), Math.round(bh*0.42));
  for(let i=0;i<3;i++){
    x.fillStyle="rgba(255,255,255,"+(0.10+rnd()*0.06).toFixed(3)+")";
    x.beginPath(); x.arc(cx0+(rnd()-0.5)*W*0.7, baseY-bh*(0.3+rnd()), Math.round(W*0.035), 0, Math.PI*2); x.fill();
  }

  // footer strip with the true physical size
  const fH = Math.round(H*0.085);
  x.fillStyle="rgba(6,12,20,.9)"; x.fillRect(0,H-fH,W,fH);
  x.fillStyle="#8fe6db"; x.textAlign="left";
  x.font="700 "+Math.round(fH*0.44)+"px ui-monospace, Menlo, monospace";
  x.fillText(w.toFixed(1)+" ft × "+h.toFixed(1)+" ft", Math.round(fH*0.5), H-Math.round(fH*0.32));
  x.textAlign="right"; x.fillStyle="rgba(226,232,240,.55)";
  x.font="500 "+Math.round(fH*0.36)+"px ui-monospace, Menlo, monospace";
  x.fillText("SAMPLE ARTWORK", W-Math.round(fH*0.5), H-Math.round(fH*0.32));

  const url = c.toDataURL("image/jpeg", 0.76);
  IMG_CACHE[key] = url;
  return url;
}
/* Mirrors simulateCapture(): stamps the generated artwork as an on-device "capture". */
function simulatePosterArt(seed, wFt, hFt, meta){
  const base = genPoster(seed, wFt, hFt);
  return new Promise(function(resolve){
    const im = new Image();
    im.onload = function(){
      const c = document.createElement("canvas"); c.width=im.width; c.height=im.height;
      const x = c.getContext("2d");
      x.drawImage(im,0,0);
      x.fillStyle="rgba(6,12,20,.62)"; x.fillRect(0,0,c.width,24);
      x.fillStyle="#5eead4"; x.font="700 11px ui-monospace, Menlo, monospace"; x.textAlign="left";
      x.fillText("● SIMULATED ARTWORK  " + (meta||""), 9, 16);
      resolve(c.toDataURL("image/jpeg", 0.74));
    };
    im.onerror = function(){ resolve(base); };
    im.src = base;
  });
}
/* A neutral 4:3 tile shown while a signed URL is being minted. Inline so it
   costs no request and cannot itself fail. */
const IMG_PENDING = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380">' +
  '<rect width="560" height="380" fill="#1b2430"/>' +
  '<g fill="none" stroke="#31435a" stroke-width="3">' +
  '<rect x="222" y="152" width="116" height="82" rx="8"/><path d="M232 226l30-28 22 20 26-30 28 38"/></g>' +
  '<circle cx="302" cy="176" r="8" fill="#31435a"/>' +
  '<text x="280" y="272" fill="#5b7391" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle">loading evidence…</text></svg>');

/* The single choke point every <img src> in this app goes through.
   Sentinels:
     gen:CODE:KIND:IDX     procedurally generated placeholder (offline demo)
     poster:SEED:W:H       procedurally generated key visual
     sb:evidence:<path>    PRIVATE object — local bytes if not uploaded yet,
                           otherwise a cached signed URL
     sbp:<bucket>:<path>   PUBLIC object (poster-artwork), no signing needed */
function resolveImg(src){
  if(!src) return "";
  if(src.indexOf("gen:")===0){
    const p = src.split(":");           // gen:CODE:KIND:IDX
    return genShot(p[1], p[2], Number(p[3]||0));
  }
  if(src.indexOf("poster:")===0){
    const p = src.split(":");           // poster:SEED:W:H
    return genPoster(p[1], Number(p[2]), Number(p[3]));
  }
  if(src.indexOf("sbp:")===0){
    const i = src.indexOf(":", 4);
    return Storage.publicUrl(src.slice(4, i), src.slice(i+1));
  }
  if(src.indexOf("sb:")===0){
    const i = src.indexOf(":", 3);
    const bucket = src.slice(3, i), path = src.slice(i+1);
    // Bytes still on this device (captured offline, or queued for upload).
    const local = Blobs.get(bucket + "/" + path);
    if(local) return local;
    if(bucket !== "evidence") return Storage.publicUrl(bucket, path);
    return Signer.urlFor(path) || IMG_PENDING;
  }
  return src;
}

/* ==========================================================
   4. Directory & campaign master  (mirrors of Supabase tables)
   ------------------------------------------------------------
   The prototype hard-coded these. They are now caches of `public.profiles`,
   `public.campaigns` and `public.stores`, filled by Repo.prime() and persisted
   with the rest of the render cache so every view still renders with no
   network. Nothing here is authoritative: RLS decides which rows a given
   session can see at all, and an EMPTY ARRAY IS A LEGITIMATE ANSWER — a
   merchandiser genuinely sees a handful of profiles and one campaign. It is
   never reported as a load failure.
   ========================================================== */

let CAMPAIGNS = [];   // mapCampaign rows

const storeByCode = c  => STORES.filter(s=>String(s.code).toUpperCase()===String(c||"").toUpperCase())[0] || null;
const merchandisers = () => USERS.filter(u=>u.role==="Merchandiser" && u.active !== false);
const posterDefaults = cid => (campaignById(cid).poster) ||
  { w:4.0, h:3.0, standoff:STANDOFF_FT, tol:STANDOFF_TOL_FT, angleTol:ANGLE_TOL_DEG };

/* ---- placement verification record ----
   Written by the guided capture flow and, for the seed, synthesised here so the
   approvals panel and dashboard KPI have something to render on first run. */
function blankPlacement(){
  return { tier:"C", tierLabel:"Unverified", distanceFt:null, targetFt:STANDOFF_FT, tolFt:STANDOFF_TOL_FT,
           distanceOk:false, distanceSource:"manual entry",
           pitchDeg:null, rollDeg:null, yawDeg:null, angleTolDeg:ANGLE_TOL_DEG,
           pitchOk:false, rollOk:false, yawOk:false, yawVerified:false,
           focalPx:null, focalSource:"—", posterWFt:null, posterHFt:null,
           captureMode:"manual", method:"manual", methodLabel:METHOD_META.manual.label,

/* A capture counts as "placement verified" when every gate passed AND the
   distance came from a real measurement — AR, or a CALIBRATED reference scale.
   An assumed focal length (tier Be) and hand-typed numbers (tier C) are not
   measurements and never qualify. TIER_META.verified is the single definition;
   the database enforces the same one in placements.is_verified. */
function placementVerified(p){ return !!(p && p.pass && tierMeta(p.tier).verified); }
/* True only for the AR tiers. Kept apart from verification because the
   same-frame provenance chip and the "strongest tier" ordering are about HOW
   the measurement was made, not about whether it counts. */
function placementAR(p){ return !!(p && isARTier(p.tier)); }
/* The strongest outcome: verified AND the photo is the very frame that was
   measured. This is deliberately AR-ONLY and does NOT follow placementVerified()
   — same-frame provenance comes from reading the pixels back out of the XR
   frame that produced the measurement, which no camera-tier path can do. The
   database says the same thing in placements.is_same_frame. */
function placementSingleFrame(p){
  return !!(p && p.pass && placementAR(p) && p.captureMode === "single-frame");
}
function placementUnverified(p){ return !p || p.tier === "C"; }

/* ==========================================================
   4b. Row mapping — PostgREST rows <-> the shapes the views render
   ------------------------------------------------------------
   The render layer is deliberately untouched: it still reads camelCase objects
   with the store fields inlined on the task. Rather than rewrite three thousand
   lines of synchronous view code to be async and snake_case, everything that
   crosses the wire is translated here, in one place, in both directions.

   The enum labels need no translation at all — 0001_schema.sql was written so
   that `task_status`, `verification_tier`, `capture_mode` and
   `notification_kind` are byte-identical to the JS constants in section 1.

   Anything the database owns (recorded_at, created_by, actor_*, the generated
   is_verified / tier_rank columns, best_placement_id, the lifecycle stamps) is
   READ but never written. Sending it is at best ignored and at worst raises
   NIVA_READONLY_FIELD.
   ========================================================== */
const num = v => (v == null || v === "") ? null : Number(v);
